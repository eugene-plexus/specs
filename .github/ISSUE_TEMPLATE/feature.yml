name: Suggest an improvement
description: An idea for something Eugene Plexus should do, or do better.
labels: [enhancement, needs-triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: What you're trying to do
      description: The task or situation, and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: Eugene Plexus version, if you use it
      placeholder: v0.2.2
    validations:
      required: false
