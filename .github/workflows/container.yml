# Build the control-plane image, verify it, and publish it to GHCR.
#
# **The image is pushed only if it passed**, because the thing being
# published is the thing an Unraid box will pull with one click and run
# unattended. `scripts/compose-acceptance.sh` builds it and then runs the
# twenty-three checks against the built artifact; the push re-tags that exact
# image rather than rebuilding, so what ships is byte-identical to what
# was tested.
#
# **This also closes the runtime checks, which had never run anywhere.** There
# is no container runtime on the development machine, so the runtime half
# of that script skipped loudly from the day it was written. A Linux
# runner has Docker, which makes CI the first place the image has ever
# been built or started.
#
# Edge candidates receive immutable SHA tags. edge.yml alone moves :edge
# after the named CI gates pass. Versioned images are promoted from the
# digest retained by full Release qualification, never rebuilt for publishing.
#
# Triggered only by the things that change the image -- the Dockerfile,
# the Compose file, the installer whose six pins decide what goes in it,
# the Unraid template (check 10 reads it), the acceptance script and
# this workflow. A docs commit does not rebuild a container.

name: Container image

on:
  push:
    branches: [main]
    paths:
      - "docker/**"
      - "scripts/**"
      - "release/**"
      - "platform/**"
      - "unraid/**"
      - ".dockerignore"
      - ".gitattributes"
      - ".github/workflows/container.yml"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Version to build a candidate for, or to publish (publishing needs its tag); empty builds edge"
        required: false
        type: string
      qualification_run:
        description: "Successful Release qualification run ID (required to publish a version)"
        required: false
        type: string
      publish:
        description: "Publish a versioned tag after qualification; false only builds an immutable candidate"
        type: boolean
        default: true
  workflow_call:
    inputs:
      release_tag:
        type: string
        required: false
      publish:
        type: boolean
        default: false
      profile:
        type: string
        default: full
    outputs:
      digest:
        value: ${{ jobs.build-verify-publish.outputs.digest }}

concurrency:
  # Pushes and manual runs queue together; a qualification's build (the only
  # caller passing profile) has its own group, so a weekly rehearsal never
  # holds an Edge build.
  group: container-image-${{ inputs.profile && github.run_id || 'main' }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/control-plane
  # What compose.yaml tags the build as, and therefore what the
  # acceptance script verified.
  BUILT: eugene-plexus/control-plane:0.1

jobs:
  coverage:
    if: inputs.release_tag == '' || !inputs.publish
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.select.outputs.full }}
      container: ${{ steps.select.outputs.container }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Select build and recovery coverage
        id: select
        env:
          CI_BASE: ${{ github.event.before }}
          CI_FULL: ${{ inputs.profile == 'full' || inputs.release_tag != '' }}
        shell: python {0}
        run: |
          import os, subprocess, sys
          command = [sys.executable, 'scripts/ci_plan.py', '--base', os.environ.get('CI_BASE', ''), '--head', 'HEAD']
          if os.environ.get('CI_FULL') == 'true':
              command.append('--full')
          subprocess.run(command, check=True)

  build-verify-publish:
    needs: coverage
    if: (inputs.release_tag == '' || !inputs.publish) && (needs.coverage.outputs.container == 'true' || inputs.release_tag != '')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      digest: ${{ steps.push.outputs.digest }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install acceptance dependencies
        run: python -m pip install PyYAML==6.0.3

      - name: Validate release tag
        if: inputs.release_tag != ''
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[a-z]+\.[0-9]+)?$ ]] || exit 1
          # Qualification may run before the tag exists; an existing tag must name this commit.
          tagged=$(git rev-parse --verify --quiet "refs/tags/$RELEASE_TAG^{commit}" || true)
          if [ -n "$tagged" ] && [ "$tagged" != "$(git rev-parse HEAD)" ]; then
            echo "::error::$RELEASE_TAG names $tagged, not this commit"
            exit 1
          fi

      # Check 5 reads the agent's own `_COMPONENT_SPECS` to derive which
      # `<KIND>_BIND_HOST` variables the image must set, rather than
      # trusting a list in the Dockerfile comment. Without the agent
      # source it skips -- which it did on the first run here, quietly
      # turning "18 checks" into 17.
      #
      # Cloned at the commit `install.sh` pins, so the check is made
      # against the same agent that is going into the image. A newer
      # `main` would be asking the wrong question.
      - name: Check out the agent at the pinned commit
        run: |
          set -euo pipefail
          pin=$(grep '^PIN_AGENT=' scripts/install.sh | cut -d= -f2)
          echo "agent pin: $pin"
          git clone --quiet --filter=blob:none --no-checkout             https://github.com/eugene-plexus/agent.git "$RUNNER_TEMP/agent"
          git -C "$RUNNER_TEMP/agent" checkout --quiet "$pin"
          echo "EP_AGENT_SRC=$RUNNER_TEMP/agent/src/eugene_plexus_agent" >> "$GITHUB_ENV"

      - name: Build and verify the image and NAS Workbench installation
        env:
          # The name the image reports, so an update can say which tag to pull.
          EP_IMAGE: ${{ env.IMAGE }}:${{ inputs.release_tag || 'edge' }}
          # A release image follows releases unless its owner says otherwise.
          EP_UPDATE_CHANNEL: ${{ inputs.release_tag && 'releases' || 'edge' }}
        run: bash scripts/compose-acceptance.sh

      - name: Restore isolated control plane and worker after a failed update
        if: needs.coverage.outputs.full == 'true'
        run: bash scripts/a7-container-acceptance.sh

      # Only reached when the script exited 0, which it does only with
      # zero failures.
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and push the image that passed
        id: push
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          commit=$(git rev-parse HEAD)
          prefix=sha
          # A rehearsal's build of the same commit must not take the tag of Edge's push build.
          if [ "$EVENT" != push ]; then prefix=rehearsal-sha; fi
          if [ -n "$RELEASE_TAG" ]; then prefix=release-sha; fi
          candidate="$IMAGE:$prefix-$commit"
          docker tag "$BUILT" "$candidate"
          docker push "$candidate"
          digest=$(docker buildx imagetools inspect "$candidate" --format '{{.Manifest.Digest}}')
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "Verified candidate: $candidate@$digest" >> "$GITHUB_STEP_SUMMARY"

      - name: Retain the exact tested image digest and inputs
        env:
          VERIFIED_DIGEST: ${{ steps.push.outputs.digest }}
        shell: python {0}
        run: |
          import json, os, sys
          from pathlib import Path
          sys.path.insert(0, 'scripts')
          from ci_plan import git
          from edge_marker import DIGEST, fingerprint
          root = Path.cwd()
          digest = os.environ['VERIFIED_DIGEST']
          if not DIGEST.fullmatch(digest):
              raise ValueError('the tested image has no valid digest')
          receipt = {'specsCommit': git(root, 'rev-parse', 'HEAD').strip(), 'imageFingerprint': fingerprint(root, 'HEAD', image=True), 'digest': digest}
          Path('image-receipt.json').write_text(json.dumps(receipt, indent=2) + '\n', encoding='utf-8', newline='\n')
      - uses: actions/upload-artifact@v7
        with:
          name: verified-container
          path: image-receipt.json
          if-no-files-found: error
          retention-days: 90

      - name: Summary
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          {
            echo "### Container image published"
            echo
            echo '```'
            echo "Immutable candidate commit: $(git rev-parse HEAD)"
            echo '```'
            echo
            echo "Verified by \`scripts/compose-acceptance.sh\` before pushing."
            echo "Unraid template: \`unraid/eugene-plexus.xml\`."
          } >> "$GITHUB_STEP_SUMMARY"

  promote-release:
    if: inputs.release_tag != '' && inputs.publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_tag }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Verify qualification and retain the tested digest
        id: qualification
        env:
          GH_TOKEN: ${{ github.token }}
          QUALIFICATION_RUN: ${{ inputs.qualification_run }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: python scripts/release_gate.py
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote without rebuilding
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          DIGEST: ${{ steps.qualification.outputs.digest }}
        run: |
          set -euo pipefail
          docker buildx imagetools create --prefer-index=false --tag "$IMAGE:$RELEASE_TAG" "$IMAGE@$DIGEST"
          actual=$(docker buildx imagetools inspect "$IMAGE:$RELEASE_TAG" --format '{{.Manifest.Digest}}')
          test "$actual" = "$DIGEST"
          echo "Published $IMAGE:$RELEASE_TAG@$DIGEST without rebuilding" >> "$GITHUB_STEP_SUMMARY"
