name: A4 macOS runner probe

# Throwaway measurement for A4 (audience-roadmap): does a GitHub-hosted
# macOS runner expose Metal to MLX, and how does mlx_lm.server behave there?

on:
  push:
    branches: [a4-macos]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: Probe v2 ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install mlx-lm 0.31.3 in its own venv
        run: |
          python -m venv ~/eugene-mlx
          ~/eugene-mlx/bin/python -m pip install -q "mlx-lm==0.31.3"
      - name: Metal from a Python with no MLX, and MLX's own number
        run: |
          python - <<'PY'
          import importlib.util, runpy
          spec = importlib.util.spec_from_file_location("p", "scripts/a4-probe-server.py")
          m = importlib.util.module_from_spec(spec); spec.loader.exec_module(m)
          m.metal_probe()
          PY
          ~/eugene-mlx/bin/python -c "import mlx.core as mx; print(mx.device_info())"
      - name: mlx_lm.server behaviour, MLX-converted model
        run: python scripts/a4-probe-server.py mlx-community/Qwen3-0.6B-4bit
      - name: mlx_lm.server behaviour, vanilla HF safetensors model
        continue-on-error: true
        run: python scripts/a4-probe-server.py HuggingFaceTB/SmolLM2-135M-Instruct
      - name: The same Metal read from a launchd agent
        continue-on-error: true
        run: |
          mkdir -p ~/Library/LaunchAgents
          cat > ~/Library/LaunchAgents/com.eugeneplexus.probe.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>Label</key><string>com.eugeneplexus.probe</string>
            <key>ProgramArguments</key><array>
              <string>$HOME/eugene-mlx/bin/python</string>
              <string>-c</string>
              <string>import sys; sys.path.insert(0, "$GITHUB_WORKSPACE/scripts"); import importlib.util; s=importlib.util.spec_from_file_location("p","$GITHUB_WORKSPACE/scripts/a4-probe-server.py"); m=importlib.util.module_from_spec(s); s.loader.exec_module(m); m.metal_probe(); import mlx.core as mx; print(mx.default_device(), mx.device_info()); import os; print("ppid", os.getppid(), "PATH", os.environ.get("PATH"))</string>
            </array>
            <key>StandardOutPath</key><string>/tmp/probe-launchd.out</string>
            <key>StandardErrorPath</key><string>/tmp/probe-launchd.err</string>
          </dict></plist>
          EOF
          launchctl bootstrap "gui/$(id -u)" ~/Library/LaunchAgents/com.eugeneplexus.probe.plist
          for i in $(seq 1 30); do [ -s /tmp/probe-launchd.out ] && break; sleep 1; done
          sleep 2
          cat /tmp/probe-launchd.out /tmp/probe-launchd.err
          launchctl bootout "gui/$(id -u)/com.eugeneplexus.probe" || true
