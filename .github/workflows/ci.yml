name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  r7-signing:
    name: R7 signing and live rotation (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
        with:
          path: specs
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Read the installer consumer pins
        id: pins
        shell: python {0}
        run: |
          import os, re
          from pathlib import Path
          text = Path("specs/scripts/install.sh").read_text(encoding="utf-8")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              for name in ("AGENT", "CONTROL", "GATEWAY", "LIBRARY", "DRIVER"):
                  pin = re.search(rf"^PIN_{name}=([0-9a-f]{{40}})$", text, re.M)
                  assert pin, name
                  out.write(f"{name.lower()}={pin.group(1)}\n")
      - uses: actions/checkout@v6
        with:
          repository: eugene-plexus/agent
          ref: ${{ steps.pins.outputs.agent }}
          path: agent
      - uses: actions/checkout@v6
        with:
          repository: eugene-plexus/control
          ref: ${{ steps.pins.outputs.control }}
          path: control
      - uses: actions/checkout@v6
        with:
          repository: eugene-plexus/gateway
          ref: ${{ steps.pins.outputs.gateway }}
          path: gateway
      - uses: actions/checkout@v6
        with:
          repository: eugene-plexus/library
          ref: ${{ steps.pins.outputs.library }}
          path: library
      - uses: actions/checkout@v6
        with:
          repository: eugene-plexus/inference-driver
          ref: ${{ steps.pins.outputs.driver }}
          path: inference-driver
      - name: Install the five consumers and their test dependencies
        run: python -m pip install -e "./agent[dev]" -e "./control[dev]" -e "./gateway[dev]" -e "./library[dev]" -e "./inference-driver[dev]"
      - name: Verify algorithm separation and detect broken guards
        run: python specs/scripts/r7-signing-checks.py
      - name: Rotate an isolated live legacy install without re-enrollment
        run: python specs/scripts/r7-rotation-acceptance.py

  r7-launch-boundary:
    name: R7 launch boundary (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
        with:
          path: specs
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Read the installer consumer pins
        id: pins
        shell: python {0}
        run: |
          import os, re
          from pathlib import Path
          text = Path("specs/scripts/install.sh").read_text(encoding="utf-8")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              for name in ("AGENT", "DRIVER"):
                  pin = re.search(rf"^PIN_{name}=([0-9a-f]{{40}})$", text, re.M)
                  assert pin, name
                  out.write(f"{name.lower()}={pin.group(1)}\n")
      - uses: actions/checkout@v6
        with:
          repository: eugene-plexus/agent
          ref: ${{ steps.pins.outputs.agent }}
          path: agent
      - uses: actions/checkout@v6
        with:
          repository: eugene-plexus/inference-driver
          ref: ${{ steps.pins.outputs.driver }}
          path: inference-driver
      - name: Install test dependencies
        run: python -m pip install -e "./agent[dev]" -e "./inference-driver[dev]"
      - name: Check real children and detect deliberately broken guards
        run: python specs/scripts/r7-launch-boundary-checks.py --current-python

  posix-installers:
    name: POSIX installer architecture regression
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Exercise native, translated, and existing Python environments
        run: bash scripts/r37-install-sh-checks.sh
      - name: Verify the regressions detect broken architecture selection
        run: python3 scripts/r37-sabotage.py

  dev-tasks:
    name: Windows development tasks
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Check task ownership and topology health
        shell: powershell
        run: |
          Import-Module Pester -RequiredVersion 3.4.0
          Invoke-Pester -Script ./scripts/dev-tasks.Tests.ps1 -EnableExit

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Run gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks dir . --no-banner --redact

  validate-openapi:
    name: Validate (openapi-spec-validator)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install openapi-spec-validator
        run: pip install 'openapi-spec-validator==0.8.5'

      - name: Check corrected contract semantics
        run: python scripts/r38-contract-checks.py --sabotage

      - name: Validate every OpenAPI document
        shell: bash
        run: |
          set -euo pipefail
          shopt -s globstar nullglob
          status=0
          for f in openapi/**/*.yaml; do
            echo "::group::$f"
            if ! python -m openapi_spec_validator "$f"; then
              status=1
            fi
            echo "::endgroup::"
          done
          exit $status

  lint-openapi:
    name: Lint (Redocly)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      # Lint only the top-level API specs. Shared schemas in
      # openapi/components/ are reached transitively via $ref, which is
      # the only context in which they make sense as OpenAPI fragments.
      - name: Run Redocly lint
        shell: bash
        run: |
          set -euo pipefail
          npx --yes @redocly/cli@2.30.4 lint \
            openapi/gateway.yaml \
            openapi/inference-driver.yaml \
            openapi/library.yaml \
            openapi/agent.yaml \
            openapi/control.yaml

  dco:
    name: DCO sign-off check
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          # Check the actual PR commits, not the synthetic merge ref.
          ref: ${{ github.event.pull_request.head.sha }}

      # CONTRIBUTING.md requires every commit to carry a Signed-off-by
      # line whose name and email match the commit author. This check
      # walks each non-merge commit in the PR and enforces that.
      - name: Check Signed-off-by lines on every PR commit
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_ACTOR:-}" == "dependabot[bot]" ]]; then
            echo "Dependabot commits are exempt from DCO sign-off."
            exit 0
          fi
          status=0
          while IFS= read -r sha; do
            [[ -z "$sha" ]] && continue
            name=$(git log -1 --format=%an "$sha")
            email=$(git log -1 --format=%ae "$sha")
            expected="Signed-off-by: ${name} <${email}>"
            msg=$(git log -1 --format=%B "$sha")
            if ! grep -Fxq "$expected" <<<"$msg"; then
              echo "::error::Commit $sha by ${name} <${email}> is missing a matching DCO sign-off."
              echo "  Expected line: ${expected}"
              echo "  Fix with: git commit --amend -s --no-edit  (or: git rebase --signoff main)"
              status=1
            fi
          done < <(git rev-list --no-merges "${BASE_SHA}..${HEAD_SHA}")
          exit $status
