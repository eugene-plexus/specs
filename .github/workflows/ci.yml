name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      agent_ref:
        description: "Optional agent candidate commit; defaults to the release pin"
        required: false
        type: string
      control_ref:
        description: "Optional control candidate commit; defaults to the release pin"
        required: false
        type: string
      gateway_ref:
        description: "Optional gateway candidate commit; defaults to the release pin"
        required: false
        type: string
      inference_driver_ref:
        description: "Optional inference_driver candidate commit; defaults to the release pin"
        required: false
        type: string
      library_ref:
        description: "Optional library candidate commit; defaults to the release pin"
        required: false
        type: string
      tool_driver_ref:
        description: "Optional tool_driver candidate commit; defaults to the release pin"
        required: false
        type: string
      ui_ref:
        description: "Optional ui candidate commit; defaults to the release pin"
        required: false
        type: string
      workbench_ref:
        description: "Optional workbench candidate commit; defaults to the release pin"
        required: false
        type: string
      site_host_ref:
        description: "Optional site-host candidate commit; defaults to the agent's pin"
        required: false
        type: string
  workflow_call:
    inputs:
      agent_ref:
        description: "Optional agent candidate commit; defaults to the release pin"
        required: false
        type: string
      control_ref:
        description: "Optional control candidate commit; defaults to the release pin"
        required: false
        type: string
      gateway_ref:
        description: "Optional gateway candidate commit; defaults to the release pin"
        required: false
        type: string
      inference_driver_ref:
        description: "Optional inference_driver candidate commit; defaults to the release pin"
        required: false
        type: string
      library_ref:
        description: "Optional library candidate commit; defaults to the release pin"
        required: false
        type: string
      tool_driver_ref:
        description: "Optional tool_driver candidate commit; defaults to the release pin"
        required: false
        type: string
      ui_ref:
        description: "Optional ui candidate commit; defaults to the release pin"
        required: false
        type: string
      workbench_ref:
        description: "Optional workbench candidate commit; defaults to the release pin"
        required: false
        type: string
      site_host_ref:
        description: "Optional site-host candidate commit; defaults to the agent's pin"
        required: false
        type: string

permissions:
  contents: read

jobs:
  s10-instruments:
    name: S10 acceptance instruments (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
        with:
          repository: eugene-plexus/specs
          ref: ${{ github.repository == 'eugene-plexus/specs' && github.sha || 'main' }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Check shared bandwidth cap and installer isolation guards
        run: python scripts/s10-checks.py
      - name: Acceptance agents never check GitHub for updates (specs#19)
        run: python scripts/acceptance-isolation-checks.py --sabotage
      - name: Verify generated release inputs
        run: python scripts/release-inputs.py --check
      - name: Verify deterministic platform vendoring and drift detection
        run: python scripts/platform-checks.py
      - name: Check release artifact bytes and component pin agreement
        run: python scripts/release-artifacts-checks.py
      - name: Verify retained A8 measurement integrity and declared targets
        run: python scripts/a8-summarize.py docs/acceptance/a8-data

  r7-signing:
    name: R7 signing, R8 profiles and A2/A3/A5 acceptance (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # C3 builds an app's environment from its archive with uv (2026-10-01).
    # Job Sites waits up to 75 s for a site's own bundle pull (2026-10-05).
    timeout-minutes: 22
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
        with:
          repository: eugene-plexus/specs
          ref: ${{ github.repository == 'eugene-plexus/specs' && github.sha || 'main' }}
          path: specs
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Read the installer consumer pins
        id: pins
        shell: python {0}
        run: |
          import os, re
          from pathlib import Path
          text = Path("specs/scripts/install.sh").read_text(encoding="utf-8")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              for name in ("AGENT", "CONTROL", "GATEWAY", "LIBRARY", "DRIVER", "TOOL_DRIVER"):
                  pin = re.search(rf"^PIN_{name}=([0-9a-f]{{40}})$", text, re.M)
                  assert pin, name
                  out.write(f"{name.lower()}={pin.group(1)}\n")
      - uses: actions/checkout@v6
        with:
          repository: eugene-plexus/agent
          ref: ${{ inputs.agent_ref || steps.pins.outputs.agent }}
          path: agent
      - uses: actions/checkout@v6
        with:
          repository: eugene-plexus/control
          ref: ${{ inputs.control_ref || steps.pins.outputs.control }}
          path: control
      - uses: actions/checkout@v6
        with:
          repository: eugene-plexus/gateway
          ref: ${{ inputs.gateway_ref || steps.pins.outputs.gateway }}
          path: gateway
      - uses: actions/checkout@v6
        with:
          repository: eugene-plexus/library
          ref: ${{ inputs.library_ref || steps.pins.outputs.library }}
          path: library
      - uses: actions/checkout@v6
        with:
          repository: eugene-plexus/inference-driver
          ref: ${{ inputs.inference_driver_ref || steps.pins.outputs.driver }}
          path: inference-driver
      - uses: actions/checkout@v6
        with:
          repository: eugene-plexus/tool-driver
          ref: ${{ inputs.tool_driver_ref || steps.pins.outputs.tool_driver }}
          path: tool-driver
      # The site host the agent installs, at the commit the agent pins: the
      # Job Sites acceptance installs it from this checkout (J6, 2026-10-05).
      - name: Read the agent's site host pin
        id: site_host
        shell: python {0}
        run: |
          import os, re
          from pathlib import Path
          text = Path("agent/src/eugene_plexus_agent/site_host.py").read_text(encoding="utf-8")
          pin = re.search(r'^SITE_HOST_COMMIT = "([0-9a-f]{40})"$', text, re.M)
          assert pin
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"commit={pin.group(1)}\n")
      - uses: actions/checkout@v6
        with:
          repository: eugene-plexus/site-host
          ref: ${{ inputs.site_host_ref || steps.site_host.outputs.commit }}
          path: site-host
      # Component dev extras pin independent lint/codegen toolchains. Only the
      # shared test runner belongs in this cross-component environment.
      - name: Install locked runtime and build dependencies
        run: |
          python -m pip install --require-hashes --only-binary :all: -r specs/release/requirements.lock
      - name: Install the acceptance runner and editable build support
        run: python -m pip install -c specs/release/constraints.txt -r specs/scripts/requirements-acceptance.txt
      - name: Install runtime consumers without dependency resolution
        run: python -m pip install --no-deps --no-build-isolation -e ./agent -e ./control -e ./gateway -e ./library -e ./inference-driver -e ./tool-driver
      - name: Check installed dependency consistency
        run: python -m pip check
      - name: Verify durable run protocol when both consumers provide it
        shell: python {0}
        run: |
          import importlib.util, subprocess, sys
          if all(importlib.util.find_spec(module) is not None for module in (
              "eugene_plexus_agent.run_worker", "eugene_plexus_library.run_operations"
          )):
              subprocess.run([sys.executable, "specs/scripts/run-operations-checks.py"], check=True)
          else:
              print("Pre-operation release pins: legacy compatibility checks still apply; run recovery activates when both consumers are upgraded.")
      - name: Score the shipped starter set for 8 GB GPU and 16 GB RAM
        run: python specs/scripts/s10-starter-check.py
      - name: One token module in five repos, and nothing of the shared-key model left
        run: python specs/scripts/r7-signing-checks.py
      - name: Rotate the root's token key across two live agents
        run: python specs/scripts/r7-rotation-acceptance.py
      - name: A stolen worker key tried against every other process, then revoked
        run: python specs/scripts/row3-per-node-keys-acceptance.py --lan
      - name: Verify R8 defaults and A2 request settings through isolated HTTP processes
        run: python specs/scripts/r8-profile-acceptance.py
      - name: Verify engines declare what they accept and the Library judges (LS1)
        run: python specs/scripts/ls1-eligibility-acceptance.py
      - name: Verify A3 client-key revocation and outage bounds across five processes
        run: python specs/scripts/a3-client-keys-acceptance.py
      - name: Verify A5 scoped keys, shared limits, cancellation and usage across gateways
        run: python specs/scripts/a5-scoped-keys-acceptance.py
      - name: Verify A6 local-only routing through signed components and real drivers
        run: python specs/scripts/a6-local-only-acceptance.py
      - name: Verify A6b uncertain outcomes, cooldown, deadlines and CLI side effects
        run: python specs/scripts/a6b-failover-acceptance.py
      - name: Verify P2a audio and PDF inputs at every door through signed processes
        run: python specs/scripts/p2-media-acceptance.py
      - name: Verify P3 speech and transcription through signed processes and the unchanged OpenAI SDK
        run: python specs/scripts/p3-audio-acceptance.py
      - name: Verify P4 image generation and edits through signed processes and the unchanged OpenAI SDK
        run: python specs/scripts/p4-images-acceptance.py
      - name: Verify P5 video jobs through signed processes, a gateway restart and the unchanged OpenAI SDK
        run: python specs/scripts/p5-videos-acceptance.py
      - name: Verify P6 moderations, model lookup and completions through signed processes and the unchanged OpenAI SDK
        run: python specs/scripts/p6-acceptance.py
      - name: Verify P8 web search through agent-spawned search accounts and the unchanged OpenAI and Anthropic SDKs
        run: python specs/scripts/p8-search-acceptance.py
      - name: Verify Google Search beside Brave (grounded answer verbatim, real addresses, Search Suggestions on every door, the person's search order)
        run: python specs/scripts/google-search-acceptance.py
      - name: Verify a Gemini account (native API, thought signatures, every surface) through signed processes and the unchanged OpenAI SDK
        run: python specs/scripts/gemini-acceptance.py
      - name: Verify C2 sign-in with Eugene through an agent, with a real OpenID Connect client
        run: python specs/scripts/c2-sign-in-acceptance.py
      - name: Verify C3 Workbench, installed from the agent's catalogue at its pinned archive
        run: python specs/scripts/c3-workbench-acceptance.py
      - name: Verify the warm standby is granted, follows, is revoked and promotes (control#5)
        run: python specs/scripts/standby-acceptance.py
      - name: Verify Job Sites through the public node route, real Caddy and a joined site
        # The entry point is the Linux container's; the Windows topology (the
        # root in WSL2) is run by hand with --root-wsl.
        if: runner.os == 'Linux'
        run: python specs/scripts/job-sites-acceptance.py
      - name: Verify A7 encrypted checkpoints and destructive restore refusals
        run: python specs/scripts/a7-recovery-checks.py
      - name: Detect deliberately broken R8 profile defaults
        run: python specs/scripts/r8-profile-checks.py

  r7-launch-boundary:
    name: R7 launch boundary (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
        with:
          repository: eugene-plexus/specs
          ref: ${{ github.repository == 'eugene-plexus/specs' && github.sha || 'main' }}
          path: specs
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Read the installer consumer pins
        id: pins
        shell: python {0}
        run: |
          import os, re
          from pathlib import Path
          text = Path("specs/scripts/install.sh").read_text(encoding="utf-8")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              for name in ("AGENT", "DRIVER"):
                  pin = re.search(rf"^PIN_{name}=([0-9a-f]{{40}})$", text, re.M)
                  assert pin, name
                  out.write(f"{name.lower()}={pin.group(1)}\n")
      - uses: actions/checkout@v6
        with:
          repository: eugene-plexus/agent
          ref: ${{ inputs.agent_ref || steps.pins.outputs.agent }}
          path: agent
      - uses: actions/checkout@v6
        with:
          repository: eugene-plexus/inference-driver
          ref: ${{ inputs.inference_driver_ref || steps.pins.outputs.driver }}
          path: inference-driver
      - name: Install locked runtime and build dependencies
        run: |
          python -m pip install --require-hashes --only-binary :all: -r specs/release/requirements.lock
      - name: Install the acceptance runner and editable build support
        run: python -m pip install -c specs/release/constraints.txt -r specs/scripts/requirements-acceptance.txt
      - name: Install runtime consumers without dependency resolution
        run: python -m pip install --no-deps --no-build-isolation -e "./agent[service]" -e ./inference-driver
      - name: Check installed dependency consistency
        run: python -m pip check
      - name: Check the real Windows service loader
        if: runner.os == 'Windows'
        run: python -m pytest agent/tests/test_winservice.py -q
      - name: Start and stop an isolated LocalSystem service
        if: runner.os == 'Windows'
        env:
          EP_SERVICE_SMOKE: "1"
        run: python specs/scripts/windows-service-smoke.py
      - name: Check real children and detect deliberately broken guards
        run: python specs/scripts/r7-launch-boundary-checks.py --current-python
      - name: Check benchmark children and detect deliberately broken guards
        run: python specs/scripts/r6-benchmark-checks.py

  posix-installers:
    name: POSIX installer architecture regression
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          repository: eugene-plexus/specs
          ref: ${{ github.repository == 'eugene-plexus/specs' && github.sha || 'main' }}
      - name: Exercise native, translated, and existing Python environments
        run: bash scripts/r37-install-sh-checks.sh
      - name: Verify the regressions detect broken architecture selection
        run: python3 scripts/r37-sabotage.py

  system-update:
    name: Linux system install updates itself through its root helper
    if: github.repository == 'eugene-plexus/specs'
    # A real sudo install on the runner, then an update asked for the way
    # the agent asks, carried out by root (docs/design/in-app-updates.md
    # §1.4). Its first two live runs each found a defect nothing else could.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Install, request an update to this commit, and check what root did
        # This commit's own installer is what the helper downloads, so the
        # target must be one raw.githubusercontent.com can serve: a pull
        # request's merge commit is not.
        # On a push the install starts from the previous push's installer,
        # so a commit that moves a pin is a real version change.
        env:
          EP_TARGET: ${{ github.event.pull_request.head.sha || github.sha }}
          EP_FROM: ${{ github.event.before || github.event.pull_request.base.sha }}
        run: |
          sudo env EP_PERSON="$(id -un)" EP_TARGET="$EP_TARGET" EP_FROM="$EP_FROM" \
            bash scripts/updates-system-install-acceptance.sh 2>&1 | tee update-run.log
          grep -q '^ALL PASS$' update-run.log

  dev-tasks:
    name: Windows development tasks
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          repository: eugene-plexus/specs
          ref: ${{ github.repository == 'eugene-plexus/specs' && github.sha || 'main' }}
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Check task ownership and topology health
        shell: powershell
        run: |
          Import-Module Pester -RequiredVersion 3.4.0
          Invoke-Pester -Script ./scripts/dev-tasks.Tests.ps1 -EnableExit
      - name: Check installer migration diagnostics before elevation
        shell: powershell
        run: |
          Import-Module Pester -RequiredVersion 3.4.0
          Invoke-Pester -Script ./scripts/install-preflight.Tests.ps1 -EnableExit
      - name: Check offline removal without touching machine services
        shell: powershell
        run: |
          Import-Module Pester -RequiredVersion 3.4.0
          Invoke-Pester -Script ./scripts/uninstall.Tests.ps1 -EnableExit

  offline-removal:
    name: Offline removal (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, macos-15, macos-26, windows-latest]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          repository: eugene-plexus/specs
          ref: ${{ github.repository == 'eugene-plexus/specs' && github.sha || 'main' }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML==6.0.3
      - run: python scripts/embed-uninstall.py --check
      - run: python scripts/test_uninstall.py

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          repository: eugene-plexus/specs
          ref: ${{ github.repository == 'eugene-plexus/specs' && github.sha || 'main' }}

      - name: Run gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks dir . --no-banner --redact

  validate-openapi:
    name: Validate (openapi-spec-validator)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          repository: eugene-plexus/specs
          ref: ${{ github.repository == 'eugene-plexus/specs' && github.sha || 'main' }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install openapi-spec-validator
        run: pip install 'openapi-spec-validator==0.8.5'

      - name: Check corrected contract semantics
        run: python scripts/r38-contract-checks.py --sabotage

      - name: Validate every OpenAPI document
        shell: bash
        run: |
          set -euo pipefail
          shopt -s globstar nullglob
          status=0
          # Schema fragments are validated through their consumers' $refs.
          # common.yaml is itself a full OpenAPI document, unlike fragments.
          for f in openapi/*.yaml openapi/components/common.yaml; do
            echo "::group::$f"
            if ! python -m openapi_spec_validator "$f"; then
              status=1
            fi
            echo "::endgroup::"
          done
          exit $status

  lint-openapi:
    name: Lint (Redocly)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          repository: eugene-plexus/specs
          ref: ${{ github.repository == 'eugene-plexus/specs' && github.sha || 'main' }}

      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      # Lint only the top-level API specs. Shared schemas in
      # openapi/components/ are reached transitively via $ref, which is
      # the only context in which they make sense as OpenAPI fragments.
      - name: Run Redocly lint
        shell: bash
        run: |
          set -euo pipefail
          npx --yes @redocly/cli@2.30.4 lint \
            openapi/gateway.yaml \
            openapi/inference-driver.yaml \
            openapi/library.yaml \
            openapi/agent.yaml \
            openapi/control.yaml \
            openapi/tool-driver.yaml \
            openapi/site-host.yaml

  dco:
    name: DCO sign-off check
    if: github.event_name == 'pull_request' && github.repository == 'eugene-plexus/specs'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          # Check the actual PR commits, not the synthetic merge ref.
          ref: ${{ github.event.pull_request.head.sha }}

      # CONTRIBUTING.md requires every commit to carry a Signed-off-by
      # line whose name and email match the commit author. This check
      # walks each non-merge commit in the PR and enforces that.
      - name: Check Signed-off-by lines on every PR commit
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_ACTOR:-}" == "dependabot[bot]" ]]; then
            echo "Dependabot commits are exempt from DCO sign-off."
            exit 0
          fi
          status=0
          while IFS= read -r sha; do
            [[ -z "$sha" ]] && continue
            name=$(git log -1 --format=%an "$sha")
            email=$(git log -1 --format=%ae "$sha")
            expected="Signed-off-by: ${name} <${email}>"
            msg=$(git log -1 --format=%B "$sha")
            if ! grep -Fxq "$expected" <<<"$msg"; then
              echo "::error::Commit $sha by ${name} <${email}> is missing a matching DCO sign-off."
              echo "  Expected line: ${expected}"
              echo "  Fix with: git commit --amend -s --no-edit  (or: git rebase --signoff main)"
              status=1
            fi
          done < <(git rev-list --no-merges "${BASE_SHA}..${HEAD_SHA}")
          exit $status

  candidate-ui:
    if: inputs.ui_ref != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          repository: eugene-plexus/ui
          ref: ${{ inputs.ui_ref }}
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test -- --run

  candidate-workbench:
    if: inputs.workbench_ref != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          repository: eugene-plexus/workbench
          ref: ${{ inputs.workbench_ref }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest
