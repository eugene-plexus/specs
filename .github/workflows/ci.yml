name: CI

on:
  pull_request:
    branches: [main]
  # Every branch (P1): a branch push plans against its merge-base with main
  # and tests the same-named branches of the component repositories. `edge`
  # is moved by the publisher alone; Dependabot's branches run as PRs.
  push:
    branches: ["**", "!edge", "!dependabot/**"]
  schedule:
    - cron: "23 3 * * 0"
  workflow_dispatch:
    inputs:
      profile:
        description: "CI coverage profile"
        required: false
        type: choice
        options: [edge, full]
        default: full
      base:
        description: "Optional planner base commit for the edge profile (scripts/branch-ci.py gives the merge-base with main); empty means full coverage"
        required: false
        type: string
      agent_ref:
        description: "Optional agent candidate commit; defaults to the release pin"
        required: false
        type: string
      control_ref:
        description: "Optional control candidate commit; defaults to the release pin"
        required: false
        type: string
      gateway_ref:
        description: "Optional gateway candidate commit; defaults to the release pin"
        required: false
        type: string
      inference_driver_ref:
        description: "Optional inference_driver candidate commit; defaults to the release pin"
        required: false
        type: string
      library_ref:
        description: "Optional library candidate commit; defaults to the release pin"
        required: false
        type: string
      tool_driver_ref:
        description: "Optional tool_driver candidate commit; defaults to the release pin"
        required: false
        type: string
      ui_ref:
        description: "Optional ui candidate commit; defaults to the release pin"
        required: false
        type: string
      workbench_ref:
        description: "Optional workbench candidate commit; defaults to the release pin"
        required: false
        type: string
      site_host_ref:
        description: "Optional site-host candidate commit; defaults to the agent's pin"
        required: false
        type: string
  workflow_call:
    inputs:
      profile:
        description: "CI coverage profile"
        required: false
        type: string
        default: full
      base:
        description: "Optional planner base commit for the edge profile; empty means full coverage"
        required: false
        type: string
      agent_ref:
        description: "Optional agent candidate commit; defaults to the release pin"
        required: false
        type: string
      control_ref:
        description: "Optional control candidate commit; defaults to the release pin"
        required: false
        type: string
      gateway_ref:
        description: "Optional gateway candidate commit; defaults to the release pin"
        required: false
        type: string
      inference_driver_ref:
        description: "Optional inference_driver candidate commit; defaults to the release pin"
        required: false
        type: string
      library_ref:
        description: "Optional library candidate commit; defaults to the release pin"
        required: false
        type: string
      tool_driver_ref:
        description: "Optional tool_driver candidate commit; defaults to the release pin"
        required: false
        type: string
      ui_ref:
        description: "Optional ui candidate commit; defaults to the release pin"
        required: false
        type: string
      workbench_ref:
        description: "Optional workbench candidate commit; defaults to the release pin"
        required: false
        type: string
      site_host_ref:
        description: "Optional site-host candidate commit; defaults to the agent's pin"
        required: false
        type: string

permissions:
  contents: read

# A newer push to a branch, or to a PR, cancels the older run. Each push to
# main has a group of its own, so it is never cancelled or held pending
# behind another: a ship's pin push must not stop the full run of the merged
# work pushed before it (P11). Every other run (a dispatch, the weekly run,
# and a call from another workflow, which carries its caller's event and run
# ID) has a group of its own too, so none is held pending or replaced: two
# branch-ci.py dispatches on main, or Release qualification's call, both run.
concurrency:
  group: ci-${{ github.repository }}-${{ github.event_name }}-${{ github.ref }}${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && format('-{0}', github.sha) || (github.event_name != 'push' && github.event_name != 'pull_request' && format('-run-{0}', github.run_id) || '') }}
  cancel-in-progress: ${{ (github.event_name == 'push' || github.event_name == 'pull_request') && github.ref != 'refs/heads/main' }}

# The agents the acceptance scripts start list engine builds from GitHub's
# API. A shared runner address meets the anonymous limit of 60 an hour
# (specs#23); with the job's own read-only token the limit is the token's.
# The agent sends it to api.github.com only (agent be5293c).
env:
  GITHUB_TOKEN: ${{ github.token }}

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.select.outputs.full }}
      runtime: ${{ steps.select.outputs.runtime }}
      launch: ${{ steps.select.outputs.launch }}
      installers: ${{ steps.select.outputs.installers }}
      dev: ${{ steps.select.outputs.dev }}
      uninstall: ${{ steps.select.outputs.uninstall }}
      contracts: ${{ steps.select.outputs.contracts }}
      instruments: ${{ steps.select.outputs.instruments }}
      macos: ${{ steps.select.outputs.macos }}
      container: ${{ steps.select.outputs.container }}
      # The planner's base, and each component candidate: a given input, or
      # on a branch push the component's same-named branch; empty is the pin.
      base: ${{ steps.select.outputs.base }}
      agent_ref: ${{ steps.select.outputs.agent_ref }}
      control_ref: ${{ steps.select.outputs.control_ref }}
      gateway_ref: ${{ steps.select.outputs.gateway_ref }}
      inference_driver_ref: ${{ steps.select.outputs.inference_driver_ref }}
      library_ref: ${{ steps.select.outputs.library_ref }}
      tool_driver_ref: ${{ steps.select.outputs.tool_driver_ref }}
      site_host_ref: ${{ steps.select.outputs.site_host_ref }}
    steps:
      - uses: actions/checkout@v6
        with:
          repository: eugene-plexus/specs
          ref: ${{ github.repository == 'eugene-plexus/specs' && github.sha || 'main' }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install PyYAML==6.0.3
      - name: Check CI planning
        run: |
          python -m unittest discover -s scripts -p 'test_ci*.py' -v
          python -m unittest discover -s scripts -p test_edge_marker.py -v
          python -m unittest discover -s scripts -p test_release_gate.py -v
          python -m unittest discover -s scripts -p test_roadmap_issues.py -v
          python -m unittest discover -s scripts -p test_worktree.py -v
          python -m unittest discover -s scripts -p test_ship.py -v
          python -m unittest discover -s scripts -p test_repin_branch.py -v
      - name: Check CPU proof contract
        run: python scripts/test_cpu_proof_contract.py
      - name: Compute gates
        id: select
        env:
          CI_BASE: ${{ github.event.before || github.event.pull_request.base.sha || inputs.base }}
          CI_FULL: ${{ github.event_name == 'schedule' || inputs.profile == 'full' || github.repository != 'eugene-plexus/specs' }}
          CI_BRANCH: ${{ github.repository == 'eugene-plexus/specs' && github.event_name == 'push' && github.ref != 'refs/heads/main' && github.ref_name || '' }}
          AGENT_REF: ${{ inputs.agent_ref }}
          CONTROL_REF: ${{ inputs.control_ref }}
          GATEWAY_REF: ${{ inputs.gateway_ref }}
          INFERENCE_DRIVER_REF: ${{ inputs.inference_driver_ref }}
          LIBRARY_REF: ${{ inputs.library_ref }}
          TOOL_DRIVER_REF: ${{ inputs.tool_driver_ref }}
          SITE_HOST_REF: ${{ inputs.site_host_ref }}
        shell: python {0}
        run: |
          import os, subprocess, sys
          command = [sys.executable, 'scripts/ci_plan.py', '--base', os.environ.get('CI_BASE', ''), '--head', 'HEAD']
          if os.environ.get('CI_FULL') == 'true':
              command.append('--full')
          if os.environ.get('CI_BRANCH'):
              # One argument, so a branch named like an option stays a value.
              command.append(f"--branch={os.environ['CI_BRANCH']}")
          for name in ('agent', 'control', 'gateway', 'inference_driver', 'library', 'tool_driver', 'site_host'):
              if os.environ.get(f'{name.upper()}_REF'):
                  command += ['--ref', f"{name}={os.environ[f'{name.upper()}_REF']}"]
          subprocess.run(command, check=True)

  # A reduced plan tests what changed since the previous push to main and
  # trusts that push's own run for the rest. Ships push merged work first and
  # their pin commit alone (P11), so a reduced run on main passes only once
  # the run of the push before it has passed: Edge never publishes a pin
  # commit over merged work whose full run failed or has not finished.
  # No job-level `permissions: actions: read`: a called workflow's job may not
  # ask for more than its caller grants, even when skipped, and Release
  # qualification and the components' Candidate integration grant contents
  # only (a probe caller granting `contents: read` ended in startup_failure,
  # run 39627576506). This repository is public; the run's token reads its
  # Actions runs without it, as Publish Edge's does.
  previous-push:
    needs: plan
    if: github.repository == 'eugene-plexus/specs' && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.plan.outputs.full == 'false'
    name: The previous push to main passed CI
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - name: Wait for the previous push's CI run, and require that it passed
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS: ${{ github.event.before }}
        run: python3 scripts/previous_push.py "$PREVIOUS"

  s10-instruments:
    needs: plan
    if: needs.plan.outputs.instruments == 'true'
    name: S10 acceptance instruments (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # bash for every step, Windows included (W0.13). The runner's default pwsh
    # fails a step only on the exit code of its last native command, so a
    # block with a failing command followed by a passing one is green, and the
    # agent's Windows pytest step once reported success with 2 failed tests.
    # bash -e -o pipefail stops at the first failing command. The same default
    # is set on every job below that runs on Windows.
    defaults:
      run:
        shell: bash
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
        with:
          repository: eugene-plexus/specs
          ref: ${{ github.repository == 'eugene-plexus/specs' && github.sha || 'main' }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Check shared bandwidth cap and installer isolation guards
        run: python scripts/s10-checks.py
      - name: Acceptance agents never check GitHub for updates (specs#19)
        run: python scripts/acceptance-isolation-checks.py --sabotage
      - name: Verify generated release inputs
        run: python scripts/release-inputs.py --check
      - name: Verify deterministic platform vendoring and drift detection
        run: python scripts/platform-checks.py
      - name: Check release artifact bytes and component pin agreement
        run: python scripts/release-artifacts-checks.py
      - name: Release script and release lines, offline (row 6)
        run: |
          python -m unittest discover -s scripts -p test_release.py -v
          python -m unittest discover -s scripts -p test_release_line.py -v
      - name: Cut a patch release from a release tag while main has moved, on bare file repositories (row 6)
        run: python scripts/release-patch-acceptance.py
      - name: Verify retained A8 measurement integrity and declared targets
        run: python scripts/a8-summarize.py docs/acceptance/a8-data

  # Pinned integration in parts (W0.3): three parts per system, run side by
  # side. Each part installs the same pinned components; every acceptance
  # step after the install runs in exactly one part per system (its
  # `matrix.shard` clause) under the profile condition it always had. Parts
  # are balanced by the step times of the full runs of 2026-10-20/21 (run
  # 39540266361 and its neighbours): about 5.5 minutes of steps each; on
  # Linux, Job Sites (about 5.3 minutes) has a part to itself. Publish Edge
  # reads the two aggregate jobs below, not these.
  r7-signing:
    needs: plan
    if: needs.plan.outputs.runtime == 'true'
    name: Pinned integration (${{ matrix.os }}, part ${{ matrix.shard }})
    runs-on: ${{ matrix.os }}
    # C3 builds an app's environment from its archive with uv (2026-10-01).
    # Job Sites waits up to 75 s for a site's own bundle pull (2026-10-05).
    # The tools-are-assumed pair acceptance runs about three minutes (2026-10-12).
    timeout-minutes: 25
    # bash for every step, Windows included (see S10 acceptance instruments).
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            shard: L1
          - os: ubuntu-latest
            shard: L2
          - os: ubuntu-latest
            shard: L3
          - os: windows-latest
            shard: W1
          - os: windows-latest
            shard: W2
          - os: windows-latest
            shard: W3
    steps:
      - uses: actions/checkout@v6
        with:
          repository: eugene-plexus/specs
          ref: ${{ github.repository == 'eugene-plexus/specs' && github.sha || 'main' }}
          path: specs
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Read the installer consumer pins
        id: pins
        shell: python {0}
        run: |
          import os, re
          from pathlib import Path
          text = Path("specs/scripts/install.sh").read_text(encoding="utf-8")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              for name in ("AGENT", "CONTROL", "GATEWAY", "LIBRARY", "DRIVER", "TOOL_DRIVER"):
                  pin = re.search(rf"^PIN_{name}=([0-9a-f]{{40}})$", text, re.M)
                  assert pin, name
                  out.write(f"{name.lower()}={pin.group(1)}\n")
      - uses: actions/checkout@v6
        with:
          repository: eugene-plexus/agent
          ref: ${{ needs.plan.outputs.agent_ref || steps.pins.outputs.agent }}
          path: agent
      - uses: actions/checkout@v6
        with:
          repository: eugene-plexus/control
          ref: ${{ needs.plan.outputs.control_ref || steps.pins.outputs.control }}
          path: control
      - uses: actions/checkout@v6
        with:
          repository: eugene-plexus/gateway
          ref: ${{ needs.plan.outputs.gateway_ref || steps.pins.outputs.gateway }}
          path: gateway
      - uses: actions/checkout@v6
        with:
          repository: eugene-plexus/library
          ref: ${{ needs.plan.outputs.library_ref || steps.pins.outputs.library }}
          path: library
      - uses: actions/checkout@v6
        with:
          repository: eugene-plexus/inference-driver
          ref: ${{ needs.plan.outputs.inference_driver_ref || steps.pins.outputs.driver }}
          path: inference-driver
      - uses: actions/checkout@v6
        with:
          repository: eugene-plexus/tool-driver
          ref: ${{ needs.plan.outputs.tool_driver_ref || steps.pins.outputs.tool_driver }}
          path: tool-driver
      # The site host the agent installs, at the commit the agent pins: the
      # Job Sites acceptance installs it from this checkout (J6, 2026-10-05).
      - name: Read the agent's site host pin
        id: site_host
        shell: python {0}
        run: |
          import os, re
          from pathlib import Path
          text = Path("agent/src/eugene_plexus_agent/site_host.py").read_text(encoding="utf-8")
          pin = re.search(r'^SITE_HOST_COMMIT = "([0-9a-f]{40})"$', text, re.M)
          assert pin
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"commit={pin.group(1)}\n")
      - uses: actions/checkout@v6
        with:
          repository: eugene-plexus/site-host
          ref: ${{ needs.plan.outputs.site_host_ref || steps.site_host.outputs.commit }}
          path: site-host
      # Component dev extras pin independent lint/codegen toolchains. Only the
      # shared test runner belongs in this cross-component environment.
      - name: Install locked runtime and build dependencies
        run: |
          python -m pip install --require-hashes --only-binary :all: -r specs/release/requirements.lock
      - name: Install the acceptance runner and editable build support
        run: python -m pip install -c specs/release/constraints.txt -r specs/scripts/requirements-acceptance.txt
      - name: Install runtime consumers without dependency resolution
        run: python -m pip install --no-deps --no-build-isolation -e ./agent -e ./control -e ./gateway -e ./library -e ./inference-driver -e ./tool-driver
      - name: Check installed dependency consistency
        run: python -m pip check
      - name: Keep Ollama files through the real machine proxy
        if: matrix.shard == 'L2' || matrix.shard == 'W1'
        shell: python {0}
        run: |
          import os, subprocess, sys, tempfile
          from pathlib import Path
          second_disk = Path(os.environ["SystemRoot"]) / "Temp" if os.name == "nt" else Path("/dev/shm")
          with tempfile.TemporaryDirectory(prefix="row65-", dir=Path.cwd()) as local:
              with tempfile.TemporaryDirectory(prefix="row65-copy-", dir=second_disk) as other:
                  subprocess.run([
                      sys.executable, "specs/scripts/row65-ollama-protocol.py",
                      "--output", str(Path(local) / "protocol"), "--copy-folder", other,
                  ], check=True)
      - name: Verify durable run protocol when both consumers provide it
        if: (matrix.shard == 'L2' || matrix.shard == 'W3') && needs.plan.outputs.full == 'true'
        env:
          LIBRARY_REF: ${{ needs.plan.outputs.library_ref }}
        shell: python {0}
        run: |
          import importlib.util, subprocess, sys
          if all(importlib.util.find_spec(module) is not None for module in (
              "eugene_plexus_agent.run_worker", "eugene_plexus_library.run_operations"
          )):
              subprocess.run([sys.executable, "specs/scripts/run-operations-checks.py"], check=True)
          else:
              print("Pre-operation release pins: legacy compatibility checks still apply; run recovery activates when both consumers are upgraded.")
      - name: Score the shipped starter set for 8 GB GPU and 16 GB RAM
        if: (matrix.shard == 'L3' || matrix.shard == 'W3') && needs.plan.outputs.full == 'true'
        run: python specs/scripts/s10-starter-check.py
      - name: One token module in five repos, and nothing of the shared-key model left
        if: matrix.shard == 'L1' || matrix.shard == 'W3'
        run: python specs/scripts/r7-signing-checks.py
      # Ten acceptance scripts start their agent through the shared harness
      # (s8-ui-acceptance.py --serve). Row 2: it runs the agent's own start path,
      # so a check through it tests the agent an install runs.
      - name: The shared acceptance harness starts the agent's own start path (row 2)
        if: matrix.shard == 'L1' || matrix.shard == 'W1'
        run: python -m pytest specs/scripts/test_s8_harness.py -q -p no:cacheprovider
      - name: The shared acceptance harness is the real server - console log copy, machine port, client doors, stop file (row 2)
        if: matrix.shard == 'L1' || matrix.shard == 'W1'
        run: python specs/scripts/harness-acceptance.py
      - name: Measure people served through the shared harness and a two-slot fixture (row 10)
        if: matrix.shard == 'L1'
        run: python specs/scripts/serving-sweep-acceptance.py
      - name: Rotate the root's token key across two live agents
        if: (matrix.shard == 'L3' || matrix.shard == 'W2') && needs.plan.outputs.full == 'true'
        run: python specs/scripts/r7-rotation-acceptance.py
      - name: A stolen worker key tried against every other process, then revoked
        if: matrix.shard == 'L2' || matrix.shard == 'W2'
        run: python specs/scripts/row3-per-node-keys-acceptance.py --lan
      - name: Policies per permission group at the root and through an agent, and a broken rule caught (row 70)
        if: matrix.shard == 'L3' || matrix.shard == 'W2'
        run: python specs/scripts/row70-group-policy-acceptance.py
      - name: Verify R8 defaults and A2 request settings through isolated HTTP processes
        if: matrix.shard == 'L2' || matrix.shard == 'W1'
        run: python specs/scripts/r8-profile-acceptance.py
      - name: Verify engines declare what they accept and the Library judges (LS1)
        if: matrix.shard == 'L3' || matrix.shard == 'W2'
        run: python specs/scripts/ls1-eligibility-acceptance.py
      - name: Verify Discover's verdicts before download, against a fake hub on loopback (LS2)
        if: (matrix.shard == 'L3' || matrix.shard == 'W3') && needs.plan.outputs.full == 'true'
        run: python specs/scripts/ls2-discover-acceptance.py
      - name: Verify a prepared model is a Library model, Run to ready on a stand-in Strata (LS3)
        if: (matrix.shard == 'L2' || matrix.shard == 'W3') && needs.plan.outputs.full == 'true'
        run: python specs/scripts/ls3-prepared-acceptance.py
      - name: Verify catalogue sources are a list and Strata publishes its own, against two fake hubs (LS4)
        if: (matrix.shard == 'L2' || matrix.shard == 'W3') && needs.plan.outputs.full == 'true'
        run: python specs/scripts/ls4-sources-acceptance.py
      - name: Verify LS5 timeout diagnostics preserve the operation state
        if: (matrix.shard == 'L3' || matrix.shard == 'W3') && needs.plan.outputs.full == 'true'
        run: python specs/scripts/ls5-preparation-checks.py
      - name: Verify preparation is a job on the engine's node, with a stand-in Strata setup (LS5)
        if: (matrix.shard == 'L3' || matrix.shard == 'W3') && needs.plan.outputs.full == 'true'
        run: python specs/scripts/ls5-preparation-acceptance.py
      - name: Verify runtime Stop waits for descendants and refuses stale Strata listeners
        if: matrix.shard == 'L1' || matrix.shard == 'W1'
        run: python specs/scripts/runtime-stop-acceptance.py
      - name: Verify each engine owns its fit model, from declaration to judge to admission (LS6)
        if: (matrix.shard == 'L3' || matrix.shard == 'W2') && needs.plan.outputs.full == 'true'
        run: python specs/scripts/ls6-fit-acceptance.py
      - name: Verify a node runs a prepared model from its own copy of the Library's files (LS7a)
        if: (matrix.shard == 'L2' || matrix.shard == 'W2') && needs.plan.outputs.full == 'true'
        run: python specs/scripts/ls7-copy-acceptance.py
      - name: Verify the Library says what is known of a prepared model (LS7b)
        if: (matrix.shard == 'L2' || matrix.shard == 'W2') && needs.plan.outputs.full == 'true'
        run: python specs/scripts/ls7b-facts-acceptance.py
      - name: Verify a model is deleted from the Library, any format, all or nothing (LS8)
        if: (matrix.shard == 'L2' || matrix.shard == 'W1') && needs.plan.outputs.full == 'true'
        run: python specs/scripts/ls8-delete-acceptance.py
      - name: Verify A3 client-key revocation and outage bounds across five processes
        if: (matrix.shard == 'L2' || matrix.shard == 'W3') && needs.plan.outputs.full == 'true'
        run: python specs/scripts/a3-client-keys-acceptance.py
      - name: Verify A5 scoped keys, shared limits, cancellation and usage across gateways
        if: (matrix.shard == 'L3' || matrix.shard == 'W1') && needs.plan.outputs.full == 'true'
        run: python specs/scripts/a5-scoped-keys-acceptance.py
      - name: Verify A6 local-only routing through signed components and real drivers
        if: matrix.shard == 'L3' || matrix.shard == 'W3'
        run: python specs/scripts/a6-local-only-acceptance.py
      - name: Verify A6b uncertain outcomes, cooldown, deadlines and CLI side effects
        if: (matrix.shard == 'L3' || matrix.shard == 'W1') && needs.plan.outputs.full == 'true'
        run: python specs/scripts/a6b-failover-acceptance.py
      - name: Verify P2a audio and PDF inputs at every door through signed processes
        if: (matrix.shard == 'L3' || matrix.shard == 'W1') && needs.plan.outputs.full == 'true'
        run: python specs/scripts/p2-media-acceptance.py
      - name: Verify P3 streaming timing is independent of request startup
        if: (matrix.shard == 'L3' || matrix.shard == 'W2') && needs.plan.outputs.full == 'true'
        run: python specs/scripts/p3-audio-checks.py
      - name: Verify P3 speech and transcription through signed processes and the unchanged OpenAI SDK
        if: (matrix.shard == 'L3' || matrix.shard == 'W2') && needs.plan.outputs.full == 'true'
        run: python specs/scripts/p3-audio-acceptance.py
      - name: Verify P4 image generation and edits through signed processes and the unchanged OpenAI SDK
        if: (matrix.shard == 'L3' || matrix.shard == 'W2') && needs.plan.outputs.full == 'true'
        run: python specs/scripts/p4-images-acceptance.py
      - name: Verify P5 video jobs through signed processes, a gateway restart and the unchanged OpenAI SDK
        if: (matrix.shard == 'L2' || matrix.shard == 'W3') && needs.plan.outputs.full == 'true'
        run: python specs/scripts/p5-videos-acceptance.py
      - name: Verify P6 moderations, model lookup and completions through signed processes and the unchanged OpenAI SDK
        if: (matrix.shard == 'L2' || matrix.shard == 'W2') && needs.plan.outputs.full == 'true'
        run: python specs/scripts/p6-acceptance.py
      - name: Verify P8 web search through agent-spawned search accounts and the unchanged OpenAI and Anthropic SDKs
        if: (matrix.shard == 'L3' || matrix.shard == 'W2') && needs.plan.outputs.full == 'true'
        run: python specs/scripts/p8-search-acceptance.py
      - name: Verify Google Search beside Brave (grounded answer verbatim, real addresses, Search Suggestions on every door, the person's search order)
        if: (matrix.shard == 'L2' || matrix.shard == 'W1') && needs.plan.outputs.full == 'true'
        run: python specs/scripts/google-search-acceptance.py
      - name: Verify a Gemini account (native API, thought signatures, every surface) through signed processes and the unchanged OpenAI SDK
        if: (matrix.shard == 'L3' || matrix.shard == 'W1') && needs.plan.outputs.full == 'true'
        run: python specs/scripts/gemini-acceptance.py
      - name: Verify the gateway and driver pair on stand-in providers (tools are assumed - header agreement, slots, counts, stream heads)
        if: (matrix.shard == 'L2' || matrix.shard == 'W3') && needs.plan.outputs.full == 'true'
        run: python specs/scripts/tools-assumed-acceptance.py
      - name: Verify interactive UI inference prerequisites through gateway and drivers
        if: (matrix.shard == 'L2' || matrix.shard == 'W1') && needs.plan.outputs.full == 'true'
        run: python specs/scripts/genui-inference-acceptance.py --report genui-inference.json
      - name: Verify the UI inference gate detects lost structured-output settings
        if: (matrix.shard == 'L2' || matrix.shard == 'W1') && needs.plan.outputs.full == 'true'
        run: python specs/scripts/genui-inference-sabotage.py
      - name: Keep UI inference prerequisite evidence
        if: always() && (matrix.shard == 'L2' || matrix.shard == 'W1') && needs.plan.outputs.full == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: genui-inference-${{ matrix.os }}
          path: genui-inference.json
          if-no-files-found: ignore
      - name: Verify C2 sign-in with Eugene through an agent, with a real OpenID Connect client
        if: matrix.shard == 'L1' || matrix.shard == 'W3'
        run: python specs/scripts/c2-sign-in-acceptance.py
      - name: Verify C3 Workbench, installed from the agent's catalogue at its pinned archive
        if: matrix.shard == 'L2' || matrix.shard == 'W1'
        run: python specs/scripts/c3-workbench-acceptance.py
      # Row 7: Workbench at the candidate (a dispatch's workbench_ref, or the
      # same-named branch on a branch push), else its main: the agent's
      # catalogue pin is the last Workbench shipped, older than main between
      # a merge and the next ship.
      - name: Verify a removed person's data is hidden, then deleted from the store and every copy (row 7)
        if: matrix.shard == 'L3' || matrix.shard == 'W2'
        env:
          R7_WORKBENCH_REF: ${{ inputs.workbench_ref || (github.repository == 'eugene-plexus/specs' && github.event_name == 'push' && github.ref != 'refs/heads/main' && github.ref_name) || 'main' }}
        run: python specs/scripts/row7-person-removal-acceptance.py
      - name: Verify Update all survives an agent restart across enrolled machines and apps
        if: (matrix.shard == 'L2' || matrix.shard == 'W1') && needs.plan.outputs.full == 'true'
        run: python specs/scripts/update-all-acceptance.py
      - name: Verify the warm standby is granted, follows, is revoked and promotes (control#5)
        if: (matrix.shard == 'L3' || matrix.shard == 'W3') && needs.plan.outputs.full == 'true'
        run: python specs/scripts/standby-acceptance.py
      - name: Verify Job Sites through the public node route, real Caddy and a joined site
        # The entry point is the Linux container's; the Windows topology (the
        # root in WSL2) is run by hand with --root-wsl.
        if: matrix.shard == 'L1' && runner.os == 'Linux' && needs.plan.outputs.full == 'true'
        run: python specs/scripts/job-sites-acceptance.py
      - name: Verify A7 encrypted checkpoints and destructive restore refusals
        if: (matrix.shard == 'L3' || matrix.shard == 'W2') && needs.plan.outputs.full == 'true'
        run: python specs/scripts/a7-recovery-checks.py
      - name: Detect deliberately broken R8 profile defaults
        if: (matrix.shard == 'L3' || matrix.shard == 'W2') && needs.plan.outputs.full == 'true'
        run: python specs/scripts/r8-profile-checks.py

  # The receipts Publish Edge reads (edge_marker.RUNTIME_JOBS), under the
  # unsplit job's names. Each passes only if every part on Linux and Windows
  # passed: a failed, skipped or cancelled part fails both.
  pinned-integration:
    needs: [plan, r7-signing]
    if: ${{ !cancelled() && needs.plan.outputs.runtime == 'true' }}
    name: Pinned integration (${{ matrix.os }})
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Every part on Linux and Windows passed
        env:
          PARTS: ${{ needs.r7-signing.result }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN: ${{ github.run_id }}
        run: |
          if [ "$PARTS" != success ]; then
            # Name the parts that did not pass; the verdict never depends on this lookup.
            failed=$(gh api "repos/$REPOSITORY/actions/runs/$RUN/jobs?per_page=100&filter=latest" \
              --jq '[.jobs[] | select((.name | contains("Pinned integration (")) and (.name | contains(", part ")) and .conclusion != "success") | "\(.name): \(.conclusion // .status)"] | join("; ")' \
              2>/dev/null || true)
            echo "::error::The pinned integration parts concluded '$PARTS'${failed:+ ($failed)}; every part on both systems must pass"
            exit 1
          fi
          echo "Every pinned integration part on Linux and Windows passed."

  # LT1, the check of record: two containers on a bridge, tcpdump in the
  # worker's namespace, and the sabotage the design names (tls-between-machines.md §5).
  lt1-machine-tls:
    needs: plan
    if: needs.plan.outputs.runtime == 'true'
    name: TLS between machines (Docker pair)
    runs-on: ubuntu-latest
    # Row 3's key changes add about 12 minutes on a pair of their own.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          repository: eugene-plexus/specs
          ref: ${{ github.repository == 'eugene-plexus/specs' && github.sha || 'main' }}
          path: specs
      - name: Read the installer consumer pins
        id: pins
        shell: python {0}
        run: |
          import os, re
          from pathlib import Path
          text = Path("specs/scripts/install.sh").read_text(encoding="utf-8")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              for name in ("AGENT", "CONTROL", "GATEWAY", "LIBRARY", "DRIVER"):
                  pin = re.search(rf"^PIN_{name}=([0-9a-f]{{40}})$", text, re.M)
                  assert pin, name
                  out.write(f"{name.lower()}={pin.group(1)}\n")
      - uses: actions/checkout@v6
        with:
          repository: eugene-plexus/agent
          ref: ${{ needs.plan.outputs.agent_ref || steps.pins.outputs.agent }}
          path: agent
      - uses: actions/checkout@v6
        with:
          repository: eugene-plexus/control
          ref: ${{ needs.plan.outputs.control_ref || steps.pins.outputs.control }}
          path: control
      - uses: actions/checkout@v6
        with:
          repository: eugene-plexus/gateway
          ref: ${{ needs.plan.outputs.gateway_ref || steps.pins.outputs.gateway }}
          path: gateway
      - uses: actions/checkout@v6
        with:
          repository: eugene-plexus/library
          ref: ${{ needs.plan.outputs.library_ref || steps.pins.outputs.library }}
          path: library
      - uses: actions/checkout@v6
        with:
          repository: eugene-plexus/inference-driver
          ref: ${{ needs.plan.outputs.inference_driver_ref || steps.pins.outputs.driver }}
          path: inference-driver
      - name: Nothing crosses in clear text, and the sabotage is refused
        run: >-
          python3 specs/scripts/lt1-machine-tls-acceptance.py --sources .
          --output "$RUNNER_TEMP/lt1"
          --labels bad-signature,wrong-pin,root-stopped,removed-machine
      - name: An upgraded install switches to required by itself
        if: needs.plan.outputs.full == 'true'
        run: >-
          python3 specs/scripts/lt1-machine-tls-acceptance.py --sources .
          --output "$RUNNER_TEMP/lt1-automatic" --labels automatic
      # Row 3: a machine's key changes under load with nothing refused, the
      # old key is refused after, the root dying mid-change, and a worker off
      # for the whole change of the root's key recovering by itself.
      - name: A machine key changes with no stop in traffic
        if: always()
        run: >-
          python3 specs/scripts/lt1-machine-tls-acceptance.py --sources .
          --output "$RUNNER_TEMP/lt1-key-change" --labels key-change,root-key-change
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lt1-machine-tls
          path: |
            ${{ runner.temp }}/lt1/result.*
            ${{ runner.temp }}/lt1-automatic/result.*
            ${{ runner.temp }}/lt1-key-change/result.*

  # On a push to main, macOS runs in macos-push.yml so Edge does not wait for
  # it. A branch push runs it here: a branch's CI is its merge gate.
  macos:
    needs: plan
    if: needs.plan.outputs.macos == 'true' && (github.event_name != 'push' || github.ref != 'refs/heads/main')
    uses: ./.github/workflows/a4-macos.yml
    with:
      agent_ref: ${{ needs.plan.outputs.agent_ref }}
      library_ref: ${{ needs.plan.outputs.library_ref }}
      gateway_ref: ${{ needs.plan.outputs.gateway_ref }}
      driver_ref: ${{ needs.plan.outputs.inference_driver_ref }}
      platforms: ${{ needs.plan.outputs.full == 'true' && '["macos-14","macos-15","macos-26"]' || '["macos-26"]' }}

  app-accounts:
    needs: plan
    if: needs.plan.outputs.full == 'true'
    uses: ./.github/workflows/c1-app-accounts.yml
    with:
      agent_ref: ${{ needs.plan.outputs.agent_ref }}
      control_ref: ${{ needs.plan.outputs.control_ref }}
      gateway_ref: ${{ needs.plan.outputs.gateway_ref }}

  open-webui:
    needs: plan
    if: needs.plan.outputs.full == 'true'
    uses: ./.github/workflows/c4-open-webui.yml
    with:
      agent_ref: ${{ needs.plan.outputs.agent_ref }}
      control_ref: ${{ needs.plan.outputs.control_ref }}
      gateway_ref: ${{ needs.plan.outputs.gateway_ref }}

  folder-tools:
    needs: plan
    if: needs.plan.outputs.full == 'true'
    uses: ./.github/workflows/c6-folder-tools.yml
    with:
      agent_ref: ${{ needs.plan.outputs.agent_ref }}

  r7-launch-boundary:
    needs: plan
    if: needs.plan.outputs.launch == 'true'
    name: R7 launch boundary (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    # bash for every step, Windows included (see S10 acceptance instruments).
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
        with:
          repository: eugene-plexus/specs
          ref: ${{ github.repository == 'eugene-plexus/specs' && github.sha || 'main' }}
          path: specs
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Read the installer consumer pins
        id: pins
        shell: python {0}
        run: |
          import os, re
          from pathlib import Path
          text = Path("specs/scripts/install.sh").read_text(encoding="utf-8")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              for name in ("AGENT", "DRIVER"):
                  pin = re.search(rf"^PIN_{name}=([0-9a-f]{{40}})$", text, re.M)
                  assert pin, name
                  out.write(f"{name.lower()}={pin.group(1)}\n")
      - uses: actions/checkout@v6
        with:
          repository: eugene-plexus/agent
          ref: ${{ needs.plan.outputs.agent_ref || steps.pins.outputs.agent }}
          path: agent
      - uses: actions/checkout@v6
        with:
          repository: eugene-plexus/inference-driver
          ref: ${{ needs.plan.outputs.inference_driver_ref || steps.pins.outputs.driver }}
          path: inference-driver
      - name: Install locked runtime and build dependencies
        run: |
          python -m pip install --require-hashes --only-binary :all: -r specs/release/requirements.lock
      - name: Install the acceptance runner and editable build support
        run: python -m pip install -c specs/release/constraints.txt -r specs/scripts/requirements-acceptance.txt
      - name: Install runtime consumers without dependency resolution
        run: python -m pip install --no-deps --no-build-isolation -e "./agent[service]" -e ./inference-driver
      - name: Check installed dependency consistency
        run: python -m pip check
      - name: Check the real Windows service loader
        if: runner.os == 'Windows'
        run: python -m pytest agent/tests/test_winservice.py -q
      - name: Start and stop an isolated LocalSystem service
        if: runner.os == 'Windows'
        env:
          EP_SERVICE_SMOKE: "1"
        run: python specs/scripts/windows-service-smoke.py
      - name: Check real children and detect deliberately broken guards
        run: python specs/scripts/r7-launch-boundary-checks.py --current-python
      - name: Check benchmark children and detect deliberately broken guards
        run: python specs/scripts/r6-benchmark-checks.py

  posix-installers:
    needs: plan
    if: needs.plan.outputs.installers == 'true'
    name: POSIX installer architecture regression
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          repository: eugene-plexus/specs
          ref: ${{ github.repository == 'eugene-plexus/specs' && github.sha || 'main' }}
      - name: Exercise native, translated, and existing Python environments
        run: bash scripts/r37-install-sh-checks.sh
      - name: Verify the regressions detect broken architecture selection
        run: python3 scripts/r37-sabotage.py

  system-update:
    name: Linux system install updates itself through its root helper
    needs: plan
    if: github.repository == 'eugene-plexus/specs' && needs.plan.outputs.installers == 'true'
    # A real sudo install on the runner, then an update asked for the way
    # the agent asks, carried out by root (docs/design/in-app-updates.md
    # §1.4). Its first two live runs each found a defect nothing else could.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Install, request an update to this commit, and check what root did
        # This commit's own installer is what the helper downloads, so the
        # target must be one raw.githubusercontent.com can serve: a pull
        # request's merge commit is not.
        # On a push the install starts from the planner's base (the previous
        # push on main, the merge-base on a branch), so a commit that moves a
        # pin is a real version change.
        env:
          EP_TARGET: ${{ github.event.pull_request.head.sha || github.sha }}
          EP_FROM: ${{ needs.plan.outputs.base }}
        run: |
          sudo env EP_PERSON="$(id -un)" EP_TARGET="$EP_TARGET" EP_FROM="$EP_FROM" \
            bash scripts/updates-system-install-acceptance.sh 2>&1 | tee update-run.log
          grep -q '^ALL PASS$' update-run.log

  dev-tasks:
    needs: plan
    if: needs.plan.outputs.dev == 'true'
    name: Windows development tasks
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          repository: eugene-plexus/specs
          ref: ${{ github.repository == 'eugene-plexus/specs' && github.sha || 'main' }}
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Check task ownership and topology health
        shell: powershell
        run: |
          Import-Module Pester -RequiredVersion 3.4.0
          Invoke-Pester -Script ./scripts/dev-tasks.Tests.ps1 -EnableExit
      - name: Check installer migration diagnostics before elevation
        shell: powershell
        run: |
          Import-Module Pester -RequiredVersion 3.4.0
          Invoke-Pester -Script ./scripts/install-preflight.Tests.ps1 -EnableExit
      - name: Check offline removal without touching machine services
        shell: powershell
        run: |
          Import-Module Pester -RequiredVersion 3.4.0
          Invoke-Pester -Script ./scripts/uninstall.Tests.ps1 -EnableExit

  offline-removal:
    needs: plan
    if: needs.plan.outputs.uninstall == 'true'
    name: Offline removal (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # bash for every step, Windows included (see S10 acceptance instruments).
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, macos-15, macos-26, windows-latest]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          repository: eugene-plexus/specs
          ref: ${{ github.repository == 'eugene-plexus/specs' && github.sha || 'main' }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install PyYAML==6.0.3
      - run: python scripts/embed-uninstall.py --check
      - run: python scripts/test_uninstall.py

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          repository: eugene-plexus/specs
          ref: ${{ github.repository == 'eugene-plexus/specs' && github.sha || 'main' }}

      - name: Run gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks dir . --no-banner --redact

  validate-openapi:
    needs: plan
    if: needs.plan.outputs.contracts == 'true'
    name: Validate (openapi-spec-validator)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          repository: eugene-plexus/specs
          ref: ${{ github.repository == 'eugene-plexus/specs' && github.sha || 'main' }}
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install openapi-spec-validator
        run: pip install 'openapi-spec-validator==0.8.5'

      - name: Check corrected contract semantics
        run: python scripts/r38-contract-checks.py --sabotage

      - name: Check Ollama Keep and worker report contracts
        run: python scripts/test_ollama_contract.py

      - name: Check gateway routing node contract
        run: python scripts/test_gateway_routing_node_contract.py

      - name: Validate every OpenAPI document
        shell: bash
        run: |
          set -euo pipefail
          shopt -s globstar nullglob
          status=0
          # Schema fragments are validated through their consumers' $refs.
          # common.yaml is itself a full OpenAPI document, unlike fragments.
          for f in openapi/*.yaml openapi/components/common.yaml; do
            echo "::group::$f"
            if ! python -m openapi_spec_validator "$f"; then
              status=1
            fi
            echo "::endgroup::"
          done
          exit $status

      # A consumer whose pin holds a document its codegen does not name gets no
      # types for it and no error (scripts/codegen-inputs.py). Reads each
      # consumer at its release pin from raw.githubusercontent.com, and asks
      # git (full history above) whether a document exists at its SPECS_REF.
      - name: Check that every consumer generates the documents it should
        run: |
          python scripts/test_codegen_inputs.py
          python scripts/codegen-inputs.py

  lint-openapi:
    needs: plan
    if: needs.plan.outputs.contracts == 'true'
    name: Lint (Redocly)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          repository: eugene-plexus/specs
          ref: ${{ github.repository == 'eugene-plexus/specs' && github.sha || 'main' }}

      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      # Lint only the top-level API specs. Shared schemas in
      # openapi/components/ are reached transitively via $ref, which is
      # the only context in which they make sense as OpenAPI fragments.
      - name: Run Redocly lint
        shell: bash
        run: |
          set -euo pipefail
          npx --yes @redocly/cli@2.30.4 lint \
            openapi/gateway.yaml \
            openapi/inference-driver.yaml \
            openapi/library.yaml \
            openapi/agent.yaml \
            openapi/control.yaml \
            openapi/tool-driver.yaml \
            openapi/site-host.yaml \
            openapi/workbench-interactions.yaml

  dco:
    name: DCO sign-off check
    if: github.event_name == 'pull_request' && github.repository == 'eugene-plexus/specs'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          # Check the actual PR commits, not the synthetic merge ref.
          ref: ${{ github.event.pull_request.head.sha }}

      # CONTRIBUTING.md requires every commit to carry a Signed-off-by
      # line whose name and email match the commit author. This check
      # walks each non-merge commit in the PR and enforces that.
      - name: Check Signed-off-by lines on every PR commit
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_ACTOR:-}" == "dependabot[bot]" ]]; then
            echo "Dependabot commits are exempt from DCO sign-off."
            exit 0
          fi
          status=0
          while IFS= read -r sha; do
            [[ -z "$sha" ]] && continue
            name=$(git log -1 --format=%an "$sha")
            email=$(git log -1 --format=%ae "$sha")
            expected="Signed-off-by: ${name} <${email}>"
            msg=$(git log -1 --format=%B "$sha")
            if ! grep -Fxq "$expected" <<<"$msg"; then
              echo "::error::Commit $sha by ${name} <${email}> is missing a matching DCO sign-off."
              echo "  Expected line: ${expected}"
              echo "  Fix with: git commit --amend -s --no-edit  (or: git rebase --signoff main)"
              status=1
            fi
          done < <(git rev-list --no-merges "${BASE_SHA}..${HEAD_SHA}")
          exit $status

  candidate-ui:
    if: inputs.ui_ref != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          repository: eugene-plexus/ui
          ref: ${{ inputs.ui_ref }}
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test -- --run

  candidate-workbench:
    if: inputs.workbench_ref != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          repository: eugene-plexus/workbench
          ref: ${{ inputs.workbench_ref }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest
