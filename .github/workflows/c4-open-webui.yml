# C4 (docs/design/c4-open-webui.md): Open WebUI from the app registry.
#
# Installs Eugene as the machine's service on a GitHub runner, as C1's run
# does, adds a fixture model behind the gateway, installs Open WebUI from
# the catalogue in an account of its own, and signs people in through
# Eugene's real sign-in page.
#
# Try candidates before pinning them: dispatch with the component SHAs.

name: C4 Open WebUI

on:
  push:
    branches: [main]
    paths:
      - scripts/c4-open-webui-acceptance.py
      - .github/workflows/c4-open-webui.yml
  workflow_dispatch:
    inputs:
      agent_ref:
        description: "Candidate agent SHA (40 chars); empty = the installer's pin"
        required: false
        type: string
      control_ref:
        description: "Candidate control SHA (40 chars); empty = the installer's pin"
        required: false
        type: string
      gateway_ref:
        description: "Candidate gateway SHA (40 chars); empty = the installer's pin"
        required: false
        type: string

permissions:
  contents: read

jobs:
  open-webui:
    name: C4 on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Open WebUI from the registry
        env:
          EP_PIN_AGENT: ${{ inputs.agent_ref }}
          EP_PIN_CONTROL: ${{ inputs.control_ref }}
          EP_PIN_GATEWAY: ${{ inputs.gateway_ref }}
        run: python scripts/c4-open-webui-acceptance.py --report c4-report.json
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c4-${{ matrix.os }}
          path: c4-report.json
          if-no-files-found: warn
