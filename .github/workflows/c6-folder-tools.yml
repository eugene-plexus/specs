name: C6 folder tools

on:
  workflow_dispatch:
    inputs:
      agent_ref:
        description: "Candidate agent SHA; empty uses the release pin"
        required: false
        type: string

permissions:
  contents: read

jobs:
  service-install:
    name: C6 on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install the HTTP acceptance client
        run: python -m pip install httpx PyYAML fastapi
      - name: Folder tools through the real Workbench app account
        env:
          EP_PIN_AGENT: ${{ inputs.agent_ref }}
        run: python scripts/c6-folder-tools-acceptance.py --report c6-report.json
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: c6-${{ matrix.os }}
          path: c6-report.json
          if-no-files-found: warn
