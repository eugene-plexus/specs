name: Publish Edge

on:
    workflow_run:
        workflows: [CI, Container image]
        types: [completed]
        branches: [main]
    schedule:
        - cron: "41 4 * * *"
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: edge-publication
    cancel-in-progress: false

jobs:
    publish:
        if: github.event_name != 'workflow_run' || (github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository)
        runs-on: ubuntu-latest
        timeout-minutes: 15
        permissions:
            contents: write
            packages: write
        steps:
            - uses: actions/checkout@v7
              with:
                  ref: main
                  fetch-depth: 0
                  persist-credentials: false
            - uses: actions/setup-python@v7
              with:
                  python-version: "3.12"
            - uses: docker/login-action@v4
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}
            - name: Advance only from verified main history
              env:
                  GH_TOKEN: ${{ github.token }}
                  EDGE_PUBLICATION_PAUSED: ${{ vars.EDGE_PUBLICATION_PAUSED }}
              run: python scripts/edge_marker.py
            - uses: actions/upload-artifact@v7
              with:
                  name: edge-publication
                  path: edge-receipt.json
                  if-no-files-found: ignore
