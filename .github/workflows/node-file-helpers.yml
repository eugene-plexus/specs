name: Node file helpers

on:
  workflow_dispatch:
    inputs:
      agent_ref:
        description: Candidate agent commit
        required: true
        type: string
      control_ref:
        description: Candidate control commit
        required: true
        type: string
      workbench_ref:
        description: Candidate Workbench commit
        required: true
        type: string
      site_host_ref:
        description: Candidate site-host commit
        required: true
        type: string

permissions:
  contents: read

jobs:
  service-install:
    name: Helper service on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install the acceptance client
        run: python -m pip install httpx PyYAML fastapi
      - name: Real service accounts, Workbench approvals and node folder access
        env:
          EP_PIN_AGENT: ${{ inputs.agent_ref }}
          EP_PIN_CONTROL: ${{ inputs.control_ref }}
        run: python scripts/node-file-helpers-service-acceptance.py --report helper-service.json
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: helper-service-${{ matrix.os }}
          path: helper-service.json
          if-no-files-found: warn

  protocol:
    name: Helper protocol on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v7
        with:
          path: specs
      - uses: actions/checkout@v7
        with:
          repository: eugene-plexus/agent
          ref: ${{ inputs.agent_ref }}
          path: agent
      - uses: actions/checkout@v7
        with:
          repository: eugene-plexus/control
          ref: ${{ inputs.control_ref }}
          path: control
      - uses: actions/checkout@v7
        with:
          repository: eugene-plexus/workbench
          ref: ${{ inputs.workbench_ref }}
          path: workbench
      - uses: actions/checkout@v7
        with:
          repository: eugene-plexus/site-host
          ref: ${{ inputs.site_host_ref }}
          path: site-host
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install runtime consumers and acceptance tools
        run: python -m pip install -e ./agent -e ./control -e ./workbench -e "./site-host[dev]" pytest pytest-asyncio uv
      - name: Check installed dependency consistency
        run: python -m pip check
      - name: Real sign-in, outbound relay, installed site host and files
        run: python specs/scripts/node-file-helpers-acceptance.py
      - name: Control permissions and standby recovery
        working-directory: control
        run: python -m pytest tests/test_node_helpers.py tests/test_replay_equivalence.py -q
      - name: Site host policy, folder containment and local servers
        working-directory: site-host
        run: python -m pytest -q
      - name: The agent's relay, the site CLI and node lifecycle
        working-directory: agent
        run: python -m pytest tests/test_site_host.py tests/test_app_accounts.py -q
      - name: Central Workbench sign-in and approvals
        working-directory: workbench
        run: python -m pytest tests/test_node_folders.py tests/test_folders.py -q
