# J14a.2 measurement: what an unprivileged process on macOS can learn about
# the account at the far end of a loopback TCP connection
# (scripts/j14a2-macos-peer-measure.py). A measurement, not a gate.

name: J14a.2 macOS peer measurement

on:
  push:
    branches: [j14a2-macos-peer]
    paths:
      - scripts/j14a2-macos-peer-measure.py
      - scripts/j14a2-macos-peer-check.py
      - .github/workflows/j14a2-macos-peer.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  measure:
    name: peer on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15, macos-26]
    steps:
      - uses: actions/checkout@v7
      - name: A second account for the run
        run: |
          sudo sysadminctl -addUser eptest2 -password "$(openssl rand -hex 16)" -shell /bin/zsh
          id eptest2
          sudo chmod -R o+rx "$GITHUB_WORKSPACE/scripts" || true
      - name: Measure, as the runner's own account
        run: python3 scripts/j14a2-macos-peer-measure.py --other eptest2 | tee peer.json
      - uses: actions/checkout@v7
        with:
          repository: eugene-plexus/agent
          ref: main
          path: agent
      - name: The agent's own reader, against this account and a second one
        run: EP_AGENT="$GITHUB_WORKSPACE/agent" python3 scripts/j14a2-macos-peer-check.py --other eptest2
      - uses: actions/upload-artifact@v7
        with:
          name: peer-${{ matrix.os }}
          path: peer.json
