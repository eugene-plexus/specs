name: C5 local MCP tools

on:
  push:
    branches: [main]
    paths:
      - scripts/c5-local-tools-acceptance.py
      - scripts/fixtures/c5-local-mcp.py
      - .github/workflows/c5-local-tools.yml
  workflow_dispatch:
    inputs:
      agent_ref:
        description: "Candidate agent SHA; empty uses the release pin"
        required: false
        type: string

permissions:
  contents: read

jobs:
  service-install:
    name: C5 on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install the HTTP acceptance client
        run: python -m pip install httpx PyYAML fastapi
      - name: Local tools through the real Workbench app account
        env:
          EP_PIN_AGENT: ${{ inputs.agent_ref }}
        run: python scripts/c5-local-tools-acceptance.py --report c5-report.json
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c5-${{ matrix.os }}
          path: c5-report.json
          if-no-files-found: warn
