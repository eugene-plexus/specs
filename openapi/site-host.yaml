openapi: 3.1.0
info:
  title: Eugene Plexus — site host
  version: 0.2.0-draft
  summary: A Job Site's own program, which holds its enrollment and whose policy is final on that machine (J19, J23, J8).
  description: |
    **What this is.** The program that **is** a Job Site
    (`docs/design/job-sites-own-enrollment.md`). It holds the site's own
    enrollment: its token key, the root's pinned identity key and TLS list,
    and the owner it recorded at its join. It polls the root, claims the
    operations queued for this site, serves them, and posts the answers
    back. It runs the site's tools: Eugene's own file server (`files`, one
    per site, whose tools take a `folder` argument, J6g), and local MCP
    servers a machine administrator added at the machine. Its policy is
    final: what it refuses, nothing upstream can make it run
    (`remote-nodes.md` §3.4, J8).

    **Where it runs.** On a machine that is a node (J21), the agent installs
    it and keeps it running; on a Linux system install it is root's to
    install and update, never the agent's (§2.4). The agent holds none of
    its identity and relays nothing for it: the two enrollments share
    nothing but the machine (J19, J23). It listens on loopback only, for
    its health and for its starter's approval API (`/v1/held`, J14a). It runs in an OS account of its own, or as
    the installing person on a per-user install (J38), and **opens no one's
    files** (§3.2).

    **Each person's tools run in a worker, as that person** (J24, J27,
    §3.2). The worker is this package, `python -I -m
    eugene_plexus_site_host.worker --account <SID or uid> --channel <name>
    [--host <SID or uid>]`, started by the machine's privileged starter
    for each linked person: the agent on Windows (with the person's session
    token, while they are signed in, J25), root's
    `eugene-plexus-site-worker@<uid>.service` on a Linux system install,
    the agent's own child on a per-user install. A worker serves only if it
    runs as `--account`, never as a system, service or root account, never
    elevated, and only once the far end of the channel is the site host's
    account. It reads the local-server list itself.

    **The channel** between them is a named pipe on Windows and a Unix
    socket elsewhere, carrying newline-delimited JSON. The site host reads
    each worker's account from the connection (Windows:
    `ImpersonateNamedPipeClient` at Identification level; elsewhere
    `SO_PEERCRED`) and refuses an account in no link. A linked person's call
    goes to their own worker; anyone else's to the owner's, confined to the
    folder (J27). With no worker connected, the call is refused, saying why.

    **Its join** is a command, not an HTTP call: `python -m
    eugene_plexus_site_host join --url <root> --token <invitation>
    [--root-key <key>] --owner <name> --label <machine> --data-dir <dir>`,
    with the owner's password on standard input. It generates its token
    key in `--data-dir`, pins the root (J7a) when the address is HTTPS,
    and sends `SiteEnrollmentRequest` (`control.yaml`,
    `POST /v1/sites/enroll`). It records the answer, `SiteEnrollment`,
    once: no later answer changes the site's owner (J6b).

    **What crosses to the root** (`control.yaml`, the `sites` tag):
    `SiteReport` in each poll, `SiteOperation` claimed, `SiteResult`
    answered. Its token is its own: EdDSA, `iss: site:<id>`, `sub: site`,
    `aud: control`, signed by the key it sent at its join. An operation
    whose `site` or `enrolledAt` is not this site's own is refused before
    anything else, so one queued for an earlier enrollment never runs.

    **Default deny.** A local server is off until its owner turns it on, and
    a person may use only the tools the owner named for them there. A folder
    is open only to the people on its list: to read, or also to change files,
    which is a standing pre-approval for `write_text`. The file server lists,
    in each person's `folder` argument, only the folders they may use, and
    for `write_text` only those they may change. A destructive tool needs a
    standing pre-approval; approving each call at the machine waits for the
    held channel of slice 3. A server marked `system` cannot be turned on
    without an administrator's consent recorded at the machine (J9).

    **The launch environment** (set by whoever starts it):
    `EUGENE_PLEXUS_APP_DATA_DIR` (the site's directory: its enrollment, key,
    policy and audit log), `EUGENE_PLEXUS_APP_BIND_PORT`,
    `EUGENE_PLEXUS_APP_ACCOUNT_KIND`, `SITE_HOST_PROTECTED_ROOTS`,
    `SITE_HOST_LINKS_FILE` (`SiteLinkFile`, which it reads and cannot
    write), `SITE_HOST_LOCAL_SERVERS_FILE` (`SiteLocalServerList`, the same),
    `SITE_HOST_CHANNEL` (the pipe's name or the socket's path), and
    optionally `SITE_HOST_LINK_PAGE` (`SiteSummary.linkPage`, where people
    link themselves: a Windows service install) and `SITE_HOST_APPROVE_PAGE`
    (`SiteSigning.approvePage`, where a person adds a key and approves held
    changes: every install that has the page, a per-user one included, which
    links nobody and so has no link page; J14a.2). Without the second, the
    approve page is the link page's `/approve`. The root's
    address and the owner come from the site's own enrollment, never from
    the environment.

    **Checking a person at the machine** (J36) is a command too:
    `python -m eugene_plexus_site_host check-person --data-dir <dir>
    --name <name>`, with the password on standard input. It signs with the
    site's key and asks the root (`POST /v1/sites/links/check`), and prints
    `SitePersonCheck` as JSON. Root runs it to link someone on a Linux
    system install, then writes the link itself.

    **Person-held keys** (J14a, `docs/design/person-held-keys.md`). A
    person's key is pinned in the links file, at the machine, by the
    machine's privileged starter; the root never sees it. Once the site's
    owner has a key, a change that gives access is not applied from the
    root's word: the site **holds** it (`held`) until the owner approves it
    at the machine, where the starter's loopback page signs the canonical
    `SiteEditEnvelope` the site gave it with the owner's key, and the site
    checks that signature against the pinned key. A change that only takes
    access away needs no signature (J51). The rules made before the owner's
    first key are approved as a whole first (J52), and until they are, no
    tool runs (J48). The page reaches this host over **`/v1/held`**,
    authorized by the token the host writes to `local_token` in its own data
    directory, which its starter can read and nobody else (J53). The
    signature, not the courier, is the authority.
  license:
    name: Apache-2.0
    identifier: Apache-2.0
  contact:
    name: Eugene Plexus
    url: https://github.com/eugene-plexus
servers:
  - url: http://127.0.0.1:{port}
    description: Loopback only. The agent reserves the port, as for any app.
    variables:
      port:
        default: "8300"
paths:
  /healthz:
    get:
      operationId: siteHostHealth
      summary: Whether the site can run tools, and whether it is enrolled and reaching its root
      security: []
      responses:
        '200':
          description: Ready.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SiteHostHealth'}
        '503':
          description: Not ready; `reason` says why.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SiteHostHealth'}
  /v1/held:
    get:
      operationId: listHeld
      summary: The changes held for one linked person, and the site's rules to approve when its owner must
      description: |
        For the starter's loopback page, which serves only the person whose
        OS account opened it. With `key`, one of that person's pinned keys,
        each item carries the canonical envelope to sign with it, with a
        fresh `seq` and `iat`; without it, only the words. When the person is
        the site's owner and has a key but has not approved the site's
        current rules (J52), the first item is `rules.confirm`.
      security: [{localToken: []}]
      parameters:
        - {name: subject, in: query, required: true, schema: {type: string, minLength: 1, maxLength: 64}}
        - {name: key, in: query, required: false, schema: {type: string, pattern: '^[a-f0-9]{32}$'}}
      responses:
        '200':
          description: The held changes, oldest first.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SiteHeldList'}
        '401':
          description: The token is missing or wrong.
        '404':
          description: Nobody is linked here as `subject`, or `key` is not one of theirs.
  /v1/held/{id}/approve:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, pattern: '^[a-z0-9]{1,32}$'}}
    post:
      operationId: approveHeld
      summary: Apply a held change, signed with its person's key at the machine
      description: |
        The site checks the envelope is canonical, every field matches the
        change it holds and its own enrollment, `seq` is greater than the
        last it accepted from this person, `iat` is at most ten minutes old,
        and the signature verifies with a key pinned to the person. Then it
        applies the change as if just asked, and records the key in its
        audit log. A refusal changes nothing; the change stays held.
      security: [{localToken: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SiteApproval'}
      responses:
        '200':
          description: "`done` with the change's result, or `failed` with why."
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SiteAnswer'}
        '401':
          description: The token is missing or wrong.
        '404':
          description: Nothing is held under this id for this person.
  /v1/held/{id}/reject:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, pattern: '^[a-z0-9]{1,32}$'}}
    post:
      operationId: rejectHeld
      summary: Turn a held change down at the machine; it is dropped and recorded
      security: [{localToken: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SiteHeldReject'}
      responses:
        '204':
          description: Dropped.
        '401':
          description: The token is missing or wrong.
        '404':
          description: Nothing is held under this id for this person.
components:
  securitySchemes:
    localToken:
      type: http
      scheme: bearer
      description: |
        The token in `local_token`, in the site host's own data directory:
        made by the host at its first start, readable by its starter and by
        nobody else (J53).
  schemas:
    SiteLocalServerList:
      $ref: 'components/sites.yaml#/SiteLocalServerList'
    SiteEnrollmentRequest:
      $ref: 'components/sites.yaml#/SiteEnrollmentRequest'
    SiteEnrollment:
      $ref: 'components/sites.yaml#/SiteEnrollment'
    SiteReport:
      $ref: 'components/sites.yaml#/SiteReport'
    SitePollAnswer:
      $ref: 'components/sites.yaml#/SitePollAnswer'
    SiteOperation:
      $ref: 'components/sites.yaml#/SiteOperation'
    SiteResult:
      $ref: 'components/sites.yaml#/SiteResult'
    SiteLinkFile:
      $ref: 'components/sites.yaml#/SiteLinkFile'
    SiteAccountLink:
      $ref: 'components/sites.yaml#/SiteAccountLink'
    SitePersonLink:
      $ref: 'components/sites.yaml#/SitePersonLink'
    SitePersonCheckRequest:
      $ref: 'components/sites.yaml#/SitePersonCheckRequest'
    SitePersonCheck:
      $ref: 'components/sites.yaml#/SitePersonCheck'

    SiteHostHealth:
      type: object
      additionalProperties: false
      required: [ready]
      properties:
        ready: {type: boolean}
        reason: {type: [string, 'null'], maxLength: 1024}
        site:
          type: [string, 'null']
          description: This site's id, once it has joined.
        lastContactAt:
          type: [string, 'null']
          format: date-time
          description: When the root last answered this site's poll.

    SiteCall:
      type: object
      additionalProperties: false
      required: [id, expiresAt, subject, server, request, installMode]
      properties:
        id: {type: string, minLength: 1, maxLength: 128, description: The root's operation id; used once.}
        expiresAt: {type: number, description: Unix seconds. At most 30 s ahead.}
        subject:
          type: string
          minLength: 1
          maxLength: 64
          description: Who asked, as the root says (a person's id, or `operator` for Eugene's owner).
        server: {$ref: 'components/sites.yaml#/SiteServerId'}
        request: {$ref: 'components/sites.yaml#/McpRequest'}
        grants:
          type: array
          maxItems: 64
          description: Eugene's owner's dev-mode grants on this site (J6e). Empty otherwise.
          items: {$ref: 'components/sites.yaml#/SiteGrantHint'}
        installMode: {$ref: 'components/sites.yaml#/InstallModeName'}

    SiteManageAction:
      type: string
      description: |
        Each is taken from the owner this site recorded at its join, and from
        nobody else, Eugene's owner included (J6b).
        - `folder.add` (`SiteFolderAdd`):
          register a folder here, under a name no other folder here has. It
          returns `SiteFolder`, with nobody on its list.
        - `folder.remove` (`SiteFolderRemove`).
        - `folder.people` (`SiteFolderPeople`):
          who may use one folder, and who may change files in it, replacing
          what was there. It returns `SiteFolder`.
        - `access.set` (`SiteAccessSet`): who may
          use one local server, and which tools, replacing what was there.
        - `server.enable` (`SiteServerEnable`): a
          local server on or off.
        - `settings.set` (`SiteSettings`).
        - `audit.read` (`SiteAuditRead`): the
          newest entries of the site's audit log.
      enum: [folder.add, folder.remove, folder.people, access.set, server.enable, settings.set, audit.read]

    SiteManage:
      type: object
      additionalProperties: false
      required: [id, expiresAt, subject, action, arguments]
      properties:
        id: {type: string, minLength: 1, maxLength: 128}
        expiresAt: {type: number}
        subject: {type: string, minLength: 1, maxLength: 64}
        action: {$ref: '#/components/schemas/SiteManageAction'}
        arguments:
          type: object
          additionalProperties: true
          description: The action's arguments; see `SiteManageAction` for each one's schema.
        names:
          type: [object, 'null']
          maxProperties: 256
          additionalProperties: {type: string, maxLength: 256}
          description: How the root names the people the arguments name (`SiteOperation.names`). Display only (J54).

    SiteEditEnvelope:
      type: object
      additionalProperties: false
      description: |
        What a person's key signs to approve one change (J14a,
        `person-held-keys.md` §12.2). The site host builds it and gives it to
        the page as canonical JSON (keys sorted, no spaces, UTF-8); the page
        signs those bytes as given, and the site checks them against what it
        holds. `typ` and `v` keep the signature from meaning anything else.
      required: [typ, v, site, enrolledAt, person, key, act, args, seq, iat]
      properties:
        typ: {type: string, const: eugene-plexus/site-edit}
        v: {type: integer, const: 1}
        site: {$ref: 'components/sites.yaml#/SiteId'}
        enrolledAt: {type: string, format: date-time}
        person: {type: string, minLength: 1, maxLength: 64}
        key: {type: string, pattern: '^[a-f0-9]{32}$'}
        act:
          type: string
          description: A `SiteManageAction` that changes something, or `rules.confirm` (J52), whose `args` are `{"digest"}`, the SHA-256 of the site's whole policy.
        args: {type: object, additionalProperties: true}
        seq: {type: integer, minimum: 1, description: Greater than the last this person approved here.}
        iat: {type: integer, description: Unix seconds.}

    SiteHeldEdit:
      type: object
      additionalProperties: false
      required: [id, action, words, heldAt]
      properties:
        id: {type: string, pattern: '^[a-z0-9]{1,32}$'}
        action: {type: string, maxLength: 64}
        words:
          type: array
          maxItems: 600
          description: The change in the site host's own words, line by line, as the page shows it.
          items: {type: string, maxLength: 1024}
        heldAt: {type: [string, 'null'], format: date-time}
        expiresAt: {type: [string, 'null'], format: date-time, description: When the site drops it unapproved.}
        envelope:
          type: [string, 'null']
          description: With `key`, the canonical `SiteEditEnvelope` to sign.

    SiteHeldList:
      type: object
      additionalProperties: false
      required: [subject, keys, items]
      properties:
        subject: {type: string, maxLength: 64}
        keys:
          type: array
          maxItems: 8
          description: The ids of the keys pinned to this person.
          items: {type: string, pattern: '^[a-f0-9]{32}$'}
        state: {$ref: 'components/sites.yaml#/SiteSigningState'}
        items:
          type: array
          maxItems: 64
          items: {$ref: '#/components/schemas/SiteHeldEdit'}

    SiteApproval:
      type: object
      additionalProperties: false
      required: [subject, envelope, key, signature]
      properties:
        subject: {type: string, minLength: 1, maxLength: 64, description: The person the starter's page serves.}
        envelope: {type: string, minLength: 2, maxLength: 262144, description: 'The canonical `SiteEditEnvelope`, exactly as listed.'}
        key: {type: string, pattern: '^[a-f0-9]{32}$'}
        signature: {type: string, minLength: 1, maxLength: 256, description: Base64 of the signature over the envelope's UTF-8 bytes.}

    SiteHeldReject:
      type: object
      additionalProperties: false
      required: [subject]
      properties:
        subject: {type: string, minLength: 1, maxLength: 64}

    SiteFolderAdd:
      type: object
      additionalProperties: false
      required: [name, path]
      properties:
        name: {type: string, minLength: 1, maxLength: 80}
        path: {type: string, minLength: 1, maxLength: 4096}
        writable: {type: boolean, default: false}

    SiteFolderRemove:
      type: object
      additionalProperties: false
      required: [id]
      properties:
        id: {type: string, pattern: '^[a-f0-9]{32}$'}

    SiteFolderPeople:
      type: object
      additionalProperties: false
      required: [id, people]
      properties:
        id: {type: string, pattern: '^[a-f0-9]{32}$'}
        people:
          type: array
          maxItems: 256
          description: Each person once. `writable` cannot exceed the folder's.
          items: {$ref: 'components/sites.yaml#/SiteFolderPerson'}

    SitePersonTools:
      type: object
      additionalProperties: false
      required: [subject, tools]
      properties:
        subject: {type: string, minLength: 1, maxLength: 64}
        tools:
          type: array
          maxItems: 64
          items: {$ref: 'components/sites.yaml#/SiteToolGrant'}

    SiteAccessSet:
      type: object
      additionalProperties: false
      description: A local server's list. Eugene's file server is granted per folder (`folder.people`).
      required: [server, people]
      properties:
        server: {$ref: 'components/sites.yaml#/SiteServerId'}
        people:
          type: array
          maxItems: 256
          items: {$ref: '#/components/schemas/SitePersonTools'}

    SiteServerEnable:
      type: object
      additionalProperties: false
      required: [server, enabled]
      properties:
        server: {$ref: 'components/sites.yaml#/SiteServerId'}
        enabled: {type: boolean}

    SiteSettings:
      type: object
      additionalProperties: false
      required: [ownerInDevMode]
      properties:
        ownerInDevMode: {type: boolean}

    SiteAuditRead:
      type: object
      additionalProperties: false
      properties:
        limit: {type: integer, minimum: 1, maximum: 200, default: 50}

    SiteAuditPage:
      type: object
      additionalProperties: false
      required: [entries]
      properties:
        entries:
          type: array
          maxItems: 200
          items: {$ref: 'components/sites.yaml#/SiteAuditEntry'}

    SiteAnswer:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: {$ref: 'components/sites.yaml#/SiteAnswerStatus'}
        message: {type: [string, 'null'], maxLength: 1024}
        response:
          description: For an MCP request answered, the JSON-RPC response.
          anyOf:
            - {$ref: 'components/sites.yaml#/McpResponse'}
            - {type: 'null'}
        result:
          type: [object, 'null']
          additionalProperties: true
          description: For a management action, its result.
