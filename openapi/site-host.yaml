openapi: 3.1.0
info:
  title: Eugene Plexus — site host
  version: 0.2.0-draft
  summary: A Job Site's own program, which holds its enrollment and whose policy is final on that machine (J19, J23, J8).
  description: |
    **What this is.** The program that **is** a Job Site
    (`docs/design/job-sites-own-enrollment.md`). It holds the site's own
    enrollment: its token key, the root's pinned identity key and TLS list,
    and the owner it recorded at its join. It polls the root, claims the
    operations queued for this site, serves them, and posts the answers
    back. It runs the site's tools: Eugene's own file server (`files`, one
    per site, whose tools take a `folder` argument, J6g), and local MCP
    servers a machine administrator added at the machine. Its policy is
    final: what it refuses, nothing upstream can make it run
    (`remote-nodes.md` §3.4, J8).

    **Where it runs.** On a machine that is a node (J21), the agent installs
    it and keeps it running. The agent holds none of its identity and relays
    nothing for it: the two enrollments share nothing but the machine
    (J19, J23). It listens on loopback only, for its health and nothing
    else. Until slice 2b.2 it runs in an OS account of its own.

    **Its join** is a command, not an HTTP call: `python -m
    eugene_plexus_site_host join --url <root> --token <invitation>
    [--root-key <key>] --owner <name> --label <machine> --data-dir <dir>`,
    with the owner's password on standard input. It generates its token
    key in `--data-dir`, pins the root (J7a) when the address is HTTPS,
    and sends `SiteEnrollmentRequest` (`control.yaml`,
    `POST /v1/sites/enroll`). It records the answer, `SiteEnrollment`,
    once: no later answer changes the site's owner (J6b).

    **What crosses to the root** (`control.yaml`, the `sites` tag):
    `SiteReport` in each poll, `SiteOperation` claimed, `SiteResult`
    answered. Its token is its own: EdDSA, `iss: site:<id>`, `sub: site`,
    `aud: control`, signed by the key it sent at its join. An operation
    whose `site` or `enrolledAt` is not this site's own is refused before
    anything else, so one queued for an earlier enrollment never runs.

    **Default deny.** A local server is off until its owner turns it on, and
    a person may use only the tools the owner named for them there. A folder
    is open only to the people on its list: to read, or also to change files,
    which is a standing pre-approval for `write_text`. The file server lists,
    in each person's `folder` argument, only the folders they may use, and
    for `write_text` only those they may change. A destructive tool needs a
    standing pre-approval; approving each call at the machine waits for the
    held channel of slice 3. A server marked `system` cannot be turned on
    without an administrator's consent recorded at the machine (J9).

    **The launch environment** (set by the agent):
    `EUGENE_PLEXUS_APP_DATA_DIR` (the site's directory: its enrollment, key,
    policy and audit log), `EUGENE_PLEXUS_APP_BIND_PORT`,
    `EUGENE_PLEXUS_APP_ACCOUNT_KIND`, `SITE_HOST_PROTECTED_ROOTS`, and the
    local-server list as `SITE_HOST_LOCAL_SERVERS_FILE` with its
    `SITE_HOST_LOCAL_SERVERS_SHA256`. The root's address and the owner come
    from the site's own enrollment, never from the environment.
  license:
    name: Apache-2.0
    identifier: Apache-2.0
  contact:
    name: Eugene Plexus
    url: https://github.com/eugene-plexus
servers:
  - url: http://127.0.0.1:{port}
    description: Loopback only. The agent reserves the port, as for any app.
    variables:
      port:
        default: "8300"
paths:
  /healthz:
    get:
      operationId: siteHostHealth
      summary: Whether the site can run tools, and whether it is enrolled and reaching its root
      security: []
      responses:
        '200':
          description: Ready.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SiteHostHealth'}
        '503':
          description: Not ready; `reason` says why.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SiteHostHealth'}
components:
  schemas:
    SiteLocalServerList:
      $ref: 'components/sites.yaml#/SiteLocalServerList'
    SiteEnrollmentRequest:
      $ref: 'components/sites.yaml#/SiteEnrollmentRequest'
    SiteEnrollment:
      $ref: 'components/sites.yaml#/SiteEnrollment'
    SiteReport:
      $ref: 'components/sites.yaml#/SiteReport'
    SitePollAnswer:
      $ref: 'components/sites.yaml#/SitePollAnswer'
    SiteOperation:
      $ref: 'components/sites.yaml#/SiteOperation'
    SiteResult:
      $ref: 'components/sites.yaml#/SiteResult'

    SiteHostHealth:
      type: object
      additionalProperties: false
      required: [ready]
      properties:
        ready: {type: boolean}
        reason: {type: [string, 'null'], maxLength: 1024}
        site:
          type: [string, 'null']
          description: This site's id, once it has joined.
        lastContactAt:
          type: [string, 'null']
          format: date-time
          description: When the root last answered this site's poll.

    SiteCall:
      type: object
      additionalProperties: false
      required: [id, expiresAt, subject, server, request, installMode]
      properties:
        id: {type: string, minLength: 1, maxLength: 128, description: The root's operation id; used once.}
        expiresAt: {type: number, description: Unix seconds. At most 30 s ahead.}
        subject:
          type: string
          minLength: 1
          maxLength: 64
          description: Who asked, as the root says (a person's id, or `operator` for Eugene's owner).
        server: {$ref: 'components/sites.yaml#/SiteServerId'}
        request: {$ref: 'components/sites.yaml#/McpRequest'}
        grants:
          type: array
          maxItems: 64
          description: Eugene's owner's dev-mode grants on this site (J6e). Empty otherwise.
          items: {$ref: 'components/sites.yaml#/SiteGrantHint'}
        installMode: {$ref: 'components/sites.yaml#/InstallModeName'}

    SiteManageAction:
      type: string
      description: |
        Each is taken from the owner this site recorded at its join, and from
        nobody else, Eugene's owner included (J6b).
        - `folder.add` (`SiteFolderAdd`):
          register a folder here, under a name no other folder here has. It
          returns `SiteFolder`, with nobody on its list.
        - `folder.remove` (`SiteFolderRemove`).
        - `folder.people` (`SiteFolderPeople`):
          who may use one folder, and who may change files in it, replacing
          what was there. It returns `SiteFolder`.
        - `access.set` (`SiteAccessSet`): who may
          use one local server, and which tools, replacing what was there.
        - `server.enable` (`SiteServerEnable`): a
          local server on or off.
        - `settings.set` (`SiteSettings`).
        - `audit.read` (`SiteAuditRead`): the
          newest entries of the site's audit log.
      enum: [folder.add, folder.remove, folder.people, access.set, server.enable, settings.set, audit.read]

    SiteManage:
      type: object
      additionalProperties: false
      required: [id, expiresAt, subject, action, arguments]
      properties:
        id: {type: string, minLength: 1, maxLength: 128}
        expiresAt: {type: number}
        subject: {type: string, minLength: 1, maxLength: 64}
        action: {$ref: '#/components/schemas/SiteManageAction'}
        arguments:
          type: object
          additionalProperties: true
          description: The action's arguments; see `SiteManageAction` for each one's schema.

    SiteFolderAdd:
      type: object
      additionalProperties: false
      required: [name, path]
      properties:
        name: {type: string, minLength: 1, maxLength: 80}
        path: {type: string, minLength: 1, maxLength: 4096}
        writable: {type: boolean, default: false}

    SiteFolderRemove:
      type: object
      additionalProperties: false
      required: [id]
      properties:
        id: {type: string, pattern: '^[a-f0-9]{32}$'}

    SiteFolderPeople:
      type: object
      additionalProperties: false
      required: [id, people]
      properties:
        id: {type: string, pattern: '^[a-f0-9]{32}$'}
        people:
          type: array
          maxItems: 256
          description: Each person once. `writable` cannot exceed the folder's.
          items: {$ref: 'components/sites.yaml#/SiteFolderPerson'}

    SitePersonTools:
      type: object
      additionalProperties: false
      required: [subject, tools]
      properties:
        subject: {type: string, minLength: 1, maxLength: 64}
        tools:
          type: array
          maxItems: 64
          items: {$ref: 'components/sites.yaml#/SiteToolGrant'}

    SiteAccessSet:
      type: object
      additionalProperties: false
      description: A local server's list. Eugene's file server is granted per folder (`folder.people`).
      required: [server, people]
      properties:
        server: {$ref: 'components/sites.yaml#/SiteServerId'}
        people:
          type: array
          maxItems: 256
          items: {$ref: '#/components/schemas/SitePersonTools'}

    SiteServerEnable:
      type: object
      additionalProperties: false
      required: [server, enabled]
      properties:
        server: {$ref: 'components/sites.yaml#/SiteServerId'}
        enabled: {type: boolean}

    SiteSettings:
      type: object
      additionalProperties: false
      required: [ownerInDevMode]
      properties:
        ownerInDevMode: {type: boolean}

    SiteAuditRead:
      type: object
      additionalProperties: false
      properties:
        limit: {type: integer, minimum: 1, maximum: 200, default: 50}

    SiteAuditPage:
      type: object
      additionalProperties: false
      required: [entries]
      properties:
        entries:
          type: array
          maxItems: 200
          items: {$ref: 'components/sites.yaml#/SiteAuditEntry'}

    SiteAnswer:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: {$ref: 'components/sites.yaml#/SiteAnswerStatus'}
        message: {type: [string, 'null'], maxLength: 1024}
        response:
          description: For an MCP request answered, the JSON-RPC response.
          anyOf:
            - {$ref: 'components/sites.yaml#/McpResponse'}
            - {type: 'null'}
        result:
          type: [object, 'null']
          additionalProperties: true
          description: For a management action, its result.
