openapi: 3.1.0
info:
  title: Eugene Plexus — tool-driver
  version: 0.1.0-draft
  summary: Runs the tools the hub runs itself (P8), one process per tool provider account.
  description: |
    **What this component is.** OpenAI's and Anthropic's APIs define some
    tools as *server-run*: the caller offers the tool, the provider runs
    it, and the model answers with the result. On a local model nobody
    ran them — Codex silently lost its search and Claude Code's WebSearch
    failed with a 400 (`docs/design/server-run-tools.md` §0). A
    tool-driver runs them, and the gateway runs the loop that offers the
    tool to the model, executes the model's call here and hands the
    result back (§3 of that design).

    **One instance per tool provider account**, as an inference-driver is
    one per backend: a SearXNG instance, a Brave Search subscription, a
    Gemini key for Google Search, a Tavily key (row 59a).
    The account's secret (Brave's subscription token) lives here, sealed
    as an inference-driver's `apiKey` is; the gateway never holds a
    search key. The operator's name for the account lives in the agent
    topology, not here.

    **What it runs today: `web_search`, and remote MCP (row 59b).** A
    remote MCP server is one an API client names on a Responses request
    (`{"type": "mcp", "server_url", ...}`): the gateway runs the loop and
    calls this component to list the server's tools and to call one,
    passing the caller's headers for that one call. Egress, its address
    rules, its time and size limits, and the caller's credential stay here
    with the other server-run tools; the credential is never logged,
    stored or echoed. Tools that act on the user's machine — files,
    shell, code execution, the user's own local MCP servers — are not run
    in the hub at all; they stay in apps or in the client, which is where
    the files are (`apps-and-spokes.md`).

    **Egress is always `internet`.** Every search provider sends the
    query to the public web, a SearXNG on the LAN included (it forwards
    the query to public engines). The query is derived from the prompt,
    which is why a local-only client key never reaches this component.

    **A provider answers in one shape.** `WebSearchResponse` carries a
    list of results and, optionally, `answer`: text the provider itself
    wrote. SearXNG's instant answers fill it today; a later provider that
    searches by asking a hosted model (OpenAI's and OpenRouter's search
    exists only as a tool on a model call) answers with text and
    citations, and fits the same shape without a contract change.

    ## Auth

    Every endpoint except `/healthz` requires a bearer token verified
    against the install's trust bundle, exactly as the inference-driver
    does (per-node token keys, 2026-09-25): the gateway presents its
    service token, an operator session may read and edit config.
  license:
    name: Apache-2.0
    identifier: Apache-2.0
  contact:
    name: Eugene Plexus
    url: https://github.com/eugene-plexus
servers:
  - url: http://{host}:{port}
    description: |
      Default LAN deployment. 8190 and up, outside the inference-drivers'
      8081-8089 and the companion drivers' 8090-8189, because the agent
      and the UI hand out ports from those ranges and a second account
      would otherwise collide with a driver added the same day.
    variables:
      host:
        default: localhost
      port:
        default: '8190'

security:
  - bearerAuth: []

tags:
  - name: tools
    description: Running a tool.
  - name: config
    description: |
      Remote-editable configuration, the same trio every component
      implements (`GET /v1/config`, `GET /v1/config/schema`,
      `PATCH /v1/config`).
  - name: admin
    description: Inspect and manage the running process.
  - name: meta
    description: Metadata and health.

paths:

  /v1/tools/web_search:
    post:
      tags: [tools]
      operationId: webSearch
      summary: Search the web once and return what was found.
      description: |
        One search, one answer. The gateway calls this once per `web_search`
        call a model makes, up to the request's `max_tool_calls`.

        **Filters are applied here, to the results, always.** A provider
        may be told about `allowedDomains` too (as a `site:` operator when
        there is exactly one), but what it returns is filtered afterwards
        whatever it did with the hint, so a result outside the allowed
        list, or inside the blocked one, never reaches the model.

        A setting the provider cannot honour is **named in `ignored`**,
        never silently dropped: SearXNG has no location parameter, so
        `userLocation` is ignored there and says so.

        Failures are the provider's, reported with its cause: a
        subscription token the provider refused is 502
        `upstream_auth_error` (our credential, not the caller's request,
        R3.4's rule); a provider that says it is busy is 429 with its
        `Retry-After`; a SearXNG with JSON output switched off is 502
        naming the setting (`search.formats` must include `json`), because
        it answers 403 and nothing else; a provider that did not answer in
        time is 504.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebSearchRequest'
      responses:
        '200':
          description: The results, filtered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebSearchResponse'
        '400':
          $ref: 'components/common.yaml#/components/responses/Problem'
        '401':
          $ref: 'components/common.yaml#/components/responses/Problem'
        '429':
          $ref: 'components/common.yaml#/components/responses/Problem'
        '502':
          $ref: 'components/common.yaml#/components/responses/Problem'
        '503':
          $ref: 'components/common.yaml#/components/responses/Problem'
        '504':
          $ref: 'components/common.yaml#/components/responses/Problem'

  /v1/tools/mcp/list_tools:
    post:
      tags: [tools]
      operationId: mcpListTools
      summary: List a remote MCP server's tools, for one Responses request.
      description: |
        Row 59b. Opens one session with the MCP server at `serverUrl`
        (Streamable HTTP: `initialize`, `notifications/initialized`, then
        `tools/list` page by page), and answers its tools. Only the
        install's gateway may call it (a `gateway` service token); a
        person's session is refused, because `reach` is the owner's
        setting and only the gateway reads it.

        **Where it may connect.** The host is resolved once per
        connection, **every** address it resolves to is checked against
        `reach`, and the connection goes to an address that was checked,
        so a second lookup (DNS rebinding) cannot switch it. A redirect is
        followed only to the same origin and only as a 307 or 308, through
        the same check. The user's proxy is not used: through a proxy the
        proxy would resolve the name, and the check would mean nothing.

        * `internet` (the default): only globally reachable addresses,
          over `https`. Loopback, private (RFC 1918, unique-local IPv6),
          the carrier range 100.64.0.0/10, link-local, multicast,
          reserved, the unspecified address and IPv6 forms that carry one
          of those IPv4 addresses (IPv4-mapped, 6to4, Teredo, NAT64) are
          refused.
        * `network`: the owner's expert choice. Addresses on the owner's
          network (private ranges, unique-local IPv6, 100.64.0.0/10) are
          also allowed, and plain `http` is allowed to them only. This
          machine's loopback stays refused: its services are this
          install's own.
        * Under every reach: link-local (cloud metadata services listen
          at 169.254.169.254), known metadata addresses (100.100.100.200,
          fd00:ec2::254), multicast, reserved and unspecified addresses
          are refused.

        A refusal is 403 `address_refused` naming the rule and the address
        it found; a scheme the reach does not allow is 400
        `scheme_refused`.

        **Limits** (each names itself when hit): 30 s for the whole call;
        8 MiB for each answer the server sends; at most 64 tools after
        `allowedTools` (413 `too_many_tools`), and at most 32 pages.

        **The caller's headers** go only to this server, and only for
        this call. They are never logged, never stored and never part of
        an error's words. The words of a failure name the server by its
        origin (`https://host:port`) only, never its path or query, which
        can carry a key too. The server refusing the caller's credential
        (401 or 403) is 424 `server_refused_credentials`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/McpListToolsRequest'
      responses:
        '200':
          description: The server's tools, filtered by `allowedTools`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/McpListToolsResponse'
        '400':
          $ref: 'components/common.yaml#/components/responses/Problem'
        '401':
          $ref: 'components/common.yaml#/components/responses/Problem'
        '403':
          $ref: 'components/common.yaml#/components/responses/Problem'
        '413':
          $ref: 'components/common.yaml#/components/responses/Problem'
        '424':
          $ref: 'components/common.yaml#/components/responses/Problem'
        '502':
          $ref: 'components/common.yaml#/components/responses/Problem'
        '504':
          $ref: 'components/common.yaml#/components/responses/Problem'

  /v1/tools/mcp/call:
    post:
      tags: [tools]
      operationId: mcpCallTool
      summary: Call one tool on a remote MCP server, for one Responses request.
      description: |
        Row 59b. One session (`initialize`, `notifications/initialized`,
        `tools/call`), under the same address rules, limits and handling
        of the caller's headers as `/v1/tools/mcp/list_tools`. A tool that
        ran and reported a failure (`isError`) is a 200 with `error`: the
        model is told the tool failed. A server that could not be reached,
        refused the credential, or did not answer in time is a problem
        response, and the gateway tells the model the call failed and why.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/McpCallRequest'
      responses:
        '200':
          description: What the tool answered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/McpCallResponse'
        '400':
          $ref: 'components/common.yaml#/components/responses/Problem'
        '401':
          $ref: 'components/common.yaml#/components/responses/Problem'
        '403':
          $ref: 'components/common.yaml#/components/responses/Problem'
        '424':
          $ref: 'components/common.yaml#/components/responses/Problem'
        '502':
          $ref: 'components/common.yaml#/components/responses/Problem'
        '504':
          $ref: 'components/common.yaml#/components/responses/Problem'

  /v1/info:
    get:
      tags: [meta]
      operationId: info
      summary: Report which provider this process fronts and which tools it runs.
      description: |
        The gateway reads this to learn which tools an install can run
        and where. A tool-driver reports only what it runs, never where it
        sits.
      responses:
        '200':
          description: Tool-driver metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolDriverInfo'

  /v1/config:
    get:
      tags: [config]
      operationId: getConfig
      summary: Read the current effective configuration.
      description: |
        Every field's effective value. A `sensitive` field (Brave's
        subscription token) reads as the literal `"<redacted>"`.
      responses:
        '200':
          description: Current config.
          content:
            application/json:
              schema:
                $ref: 'components/common.yaml#/components/schemas/ConfigDocument'
    patch:
      tags: [config]
      operationId: updateConfig
      summary: Partial update of the configuration.
      description: |
        Each key is validated against its `ConfigField`; valid changes are
        applied and invalid ones reported per key. A secret is accepted in
        plaintext and sealed before it is written.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: 'components/common.yaml#/components/schemas/ConfigUpdateRequest'
      responses:
        '200':
          description: Update outcome (may include per-field rejections).
          content:
            application/json:
              schema:
                $ref: 'components/common.yaml#/components/schemas/ConfigUpdateResult'
        '400':
          $ref: 'components/common.yaml#/components/responses/Problem'

  /v1/config/schema:
    get:
      tags: [config]
      operationId: getConfigSchema
      summary: UI-renderable description of every editable config field.
      responses:
        '200':
          description: Config schema.
          content:
            application/json:
              schema:
                $ref: 'components/common.yaml#/components/schemas/ConfigSchema'

  /v1/config/test:
    post:
      tags: [config]
      operationId: testConfig
      summary: Run one real search with the saved config merged with overrides.
      description: |
        The UI's Test button: one search for a fixed query with the saved
        config and the optional `overrides`, nothing persisted, reported as
        success or the provider's own failure and how long it took. This is
        how an operator learns that a SearXNG instance has JSON output off,
        or that a Brave token was refused, before any model asks.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: 'components/common.yaml#/components/schemas/ConfigTestRequest'
      responses:
        '200':
          description: Test result, for success and failure alike.
          content:
            application/json:
              schema:
                $ref: 'components/common.yaml#/components/schemas/ConfigTestResult'

  /v1/admin/restart:
    post:
      tags: [admin]
      operationId: restart
      summary: Schedule a process restart so `requiresRestart` config takes effect.
      responses:
        '202':
          description: Restart scheduled.
          content:
            application/json:
              schema:
                $ref: 'components/common.yaml#/components/schemas/RestartResult'

  /healthz:
    get:
      tags: [meta]
      operationId: healthz
      summary: Liveness, and whether the provider answered its last query.
      security: []
      description: |
        `ok` when the provider answered the most recent probe search,
        `degraded` with the provider's own reason in `details.error` when
        it did not, or when nothing is configured yet. The probe is a real
        query, refreshed on a timer and cached, never one per health read:
        a paid provider counts every search.
      responses:
        '200':
          description: Running.
          content:
            application/json:
              schema:
                $ref: 'components/common.yaml#/components/schemas/Health'

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        A token signed by the install's authority and verified against the
        trust bundle the agent threads at spawn.

  schemas:

    ToolName:
      type: string
      enum: [web_search, mcp]
      description: |
        A tool the hub runs itself. `web_search` runs on the account's
        search provider; `mcp` is remote MCP (row 59b), which needs no
        account settings and so is listed whether or not the search is
        set up. The gateway's `image_generation` (P8e) runs through the
        install's own images door and needs no tool-driver.

    ToolDriverInfo:
      type: object
      required: [provider, tools, egress]
      properties:
        provider:
          type: string
          description: The provider key, `searxng`, `brave`, `google` or `tavily`.
        label:
          type: string
          description: The provider's display name.
        tools:
          type: array
          items:
            $ref: '#/components/schemas/ToolName'
          description: |
            The tools this process runs. `web_search` only once the account
            is configured; `mcp` always (row 59b).
        egress:
          type: string
          enum: [internet]
          description: |
            Where a query goes. Always `internet`: even a SearXNG on the
            LAN forwards the query to public engines.
        configured:
          type: boolean
          description: False until the provider's address (and key, where it has one) is set.
        billing:
          $ref: '#/components/schemas/ToolBilling'
        version:
          type: string

    ToolBilling:
      type: string
      enum: [free, per_search]
      description: |
        Whether the provider bills each search (`per_search`: Brave,
        Google, Tavily) or not (`free`: SearXNG). The gateway tries a free account before one that
        bills, so an install with both pays only when the free one could not
        answer. Absent is read as `per_search`: an account that does not say
        is not assumed to cost nothing.

    WebSearchRequest:
      type: object
      additionalProperties: false
      required: [query]
      properties:
        query:
          type: string
          minLength: 1
          maxLength: 2000
        maxResults:
          type: integer
          minimum: 1
          maximum: 20
          description: |
            How many results to return. Absent means the account's own
            setting (5 unless the operator changed it) -- which is why this
            has no default here: a default in the schema would be filled in
            by every generated client and the account's setting would never
            be read.
        allowedDomains:
          type: array
          maxItems: 100
          items: {type: string, minLength: 1}
          description: |
            Only results from these domains (a domain matches itself and its
            subdomains). Empty or absent allows every domain.
        blockedDomains:
          type: array
          maxItems: 100
          items: {type: string, minLength: 1}
          description: Never results from these domains, or their subdomains.
        userLocation:
          $ref: 'components/common.yaml#/components/schemas/WebSearchUserLocation'
        contextSize:
          $ref: 'components/common.yaml#/components/schemas/WebSearchContextSize'
          description: |
            How much of each page to carry: `low` a short snippet, `medium`
            (the default) a paragraph, `high` every excerpt the provider has.

    WebSearchResponse:
      type: object
      required: [results, provider]
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/WebSearchResult'
        answer:
          type: [string, 'null']
          description: |
            Text the provider itself wrote in answer to the query (SearXNG's
            instant answers, Tavily's `answer`), or null. A provider that
            searches by asking a hosted model answers here, with its
            citations in `results`.
        provider:
          type: string
        latencyMs:
          type: number
        ignored:
          type: array
          items: {type: string}
          description: Request settings this provider could not honour, by name.
        searchSuggestions:
          type: [string, 'null']
          description: |
            HTML the provider's terms require shown with these results, to
            the person who asked, unmodified: Google's Search Suggestions
            (`searchEntryPoint.renderedContent`), for the `google` provider
            (docs/design/google-search-account.md, GS1, GS4). Null or absent
            for providers with none. The gateway carries it to the caller
            and keeps none of it.

    WebSearchResult:
      type: object
      required: [url, title]
      properties:
        url:
          type: string
        title:
          type: string
        snippet:
          type: string
          description: What the page says about the query, as the provider excerpted it.
        publishedAt:
          type: [string, 'null']
          description: When the page was published, as the provider reported it (ISO 8601 where it gave one).

    McpReach:
      type: string
      enum: [internet, network]
      description: |
        Which addresses a remote MCP call may connect to: the gateway's
        `remoteMcp` setting, which the owner sets (call R59-MCP).
        `internet`, the default: globally reachable addresses only, over
        `https`. `network`: also the owner's own network (private ranges,
        unique-local IPv6, 100.64.0.0/10), where plain `http` is allowed
        too. Loopback, link-local, metadata, multicast, reserved and
        unspecified addresses are refused under both. The setting's third
        value, `off`, never reaches this component: the gateway refuses
        the request itself.

    McpListToolsRequest:
      type: object
      additionalProperties: false
      required: [serverUrl, reach]
      properties:
        serverUrl:
          type: string
          minLength: 1
          maxLength: 2048
          description: The MCP server's Streamable HTTP endpoint, as the caller named it.
        headers:
          type: object
          maxProperties: 32
          additionalProperties:
            type: string
            maxLength: 8192
          description: |
            The caller's headers for this server, its `authorization` already
            turned into `Authorization: Bearer ...` by the gateway. Sent to
            this server only, for this call only. Headers that frame the
            request (`Host`, `Content-Length`, `Content-Type`, `Accept`,
            `Connection`, `Transfer-Encoding`, `Mcp-Session-Id`,
            `MCP-Protocol-Version` and the like) are refused with a 400
            naming the header, never its value.
        reach:
          $ref: '#/components/schemas/McpReach'
        allowedTools:
          type: [array, 'null']
          maxItems: 256
          items: {type: string, minLength: 1, maxLength: 128}
          description: |
            Only these tools, by name. Null or absent keeps every tool the
            server lists (up to the limit of 64).

    McpListToolsResponse:
      type: object
      required: [tools]
      properties:
        tools:
          type: array
          maxItems: 64
          items:
            $ref: '#/components/schemas/McpTool'
        latencyMs:
          type: number

    McpTool:
      type: object
      required: [name, inputSchema]
      properties:
        name:
          type: string
        description:
          type: [string, 'null']
        inputSchema:
          type: object
          additionalProperties: true
          description: The tool's JSON Schema for its arguments, as the server gave it.
        annotations:
          type: [object, 'null']
          additionalProperties: true
          description: The server's hints about the tool (`readOnlyHint` and others), as given.

    McpCallRequest:
      type: object
      additionalProperties: false
      required: [serverUrl, reach, name]
      properties:
        serverUrl:
          type: string
          minLength: 1
          maxLength: 2048
        headers:
          type: object
          maxProperties: 32
          additionalProperties:
            type: string
            maxLength: 8192
          description: As on `McpListToolsRequest`.
        reach:
          $ref: '#/components/schemas/McpReach'
        name:
          type: string
          minLength: 1
          maxLength: 128
        arguments:
          type: object
          additionalProperties: true
          description: The arguments the model gave, as a JSON object. Absent is `{}`.

    McpCallResponse:
      type: object
      properties:
        output:
          type: [string, 'null']
          description: |
            The tool's text content, joined. A part that is not text (an
            image, audio) is named in a line of its own and not carried; a
            tool with only structured content answers it as JSON. Null when
            `error` is set.
        error:
          type: [string, 'null']
          description: |
            The tool's own words when it ran and reported a failure
            (`isError`), or null.
        latencyMs:
          type: number
