openapi: 3.1.0
info:
  title: Eugene Plexus — inference-driver
  version: 0.3.0-draft
  summary: The uniform surface every heterogeneous backend is wrapped in.
  description: |
    **Token verification (per-node token keys, 2026-09-25).** This
    component holds no signing key. Its agent gives it, at spawn:

    * the path of the install's **trust bundle** (`common.yaml`,
      `TrustBundle`), which it reloads when the file changes;
    * the pinned authority key that must have signed it;
    * its own recipient name, `node:<name>`;
    * a service token addressed to this machine alone.

    Every bearer is checked against the bundle: the key found by `kid`,
    the algorithm taken from the key, and the `typ`, `iss`, `aud`, grant
    and lifetime rules in `TrustBundle`. The key material is Ed25519
    only.

    One `inference-driver` instance wraps exactly **one** backend and
    presents a uniform surface over it. An install runs N instances, one
    per backend, with the gateway routing above them.

    **A backend is one model, or an account serving many (P1,
    2026-09-27).** A driver with a model configured serves that one
    model, as every driver did before. An OpenAI-compatible driver with
    **no** model configured is a **provider account**: it reads the
    backend's own catalogue (OpenRouter's, an Ollama's pulled models, an
    LM Studio's, a `llama-server` in router mode, OpenAI's) and serves
    every model in it that its include/exclude patterns keep.
    `DriverInfo.models` lists what it serves either way, and every
    request names its `model`. The public id of an account's model is
    `<driver name>/<model id>`, and **the gateway** applies that prefix,
    because a driver does not know its own name.

    A backend is any of: a local engine speaking OpenAI-compatible HTTP
    (llama.cpp's `llama-server`, vLLM, LM Studio, Ollama), a hosted API
    (Anthropic, OpenAI, xAI, OpenRouter), or a subprocess CLI riding on
    a subscription the operator already pays for (`claude_code_cli`,
    `codex_cli`). The last kind is why the driver exists as a separate
    process: a CLI has no HTTP endpoint to proxy to, so something has to
    front it, and normalising *all* backends through one surface is
    cheaper than special-casing the ones that cannot be proxied.

    The driver owns what is specific to its backend — provider choice,
    model id, secrets, health, and how to speak the wire protocol. It
    does **not** own routing, and it does not know its own place in any
    topology: the gateway reads `/v1/info` to learn what this driver
    serves, and resolves it to a URL from the agent topology.

    All operations are stateless — the caller passes the full prompt on
    every call. Streaming uses Server-Sent Events; non-streaming returns
    a single JSON body.

    ## Which backend a driver fronts

    Two config fields, and which one is set decides how the backend is
    addressed.

    - **`runtimeName`** (`runtime_name`) names a supervised engine
      runtime. The driver resolves that name to a URL from the agent
      topology, at startup and again whenever it reconnects.
    - **`baseUrl`** is a literal URL, for every backend that is *not* a
      supervised runtime — a cloud provider, a remote LM Studio, an
      engine somebody else operates.

    `runtimeName` wins when both are set.

    Following a runtime by name rather than by URL is not a
    convenience. The agent assigns the port when the operator does
    not pick one, so a literal `baseUrl` pointing at a local runtime
    encodes a number the operator was never told and does not own — it
    is wrong the moment the thing it points at moves. A name survives
    that.

    This closes the gap M2 left open: launching a model from the library
    declared a runtime and stopped there, so the model loaded, served,
    and was unreachable because nothing pointed a driver at it. What
    still is *not* here is who creates the driver — a declared pool or
    one per launch is routing policy, and it stays with the gateway.

    ## Parameters are the caller's, never the driver's

    The driver applies no local defaults to anything affecting model
    output. Temperature, max tokens and stop sequences arrive on the
    request or are not sent to the backend at all. Backends that do not
    expose a given knob (agentic CLIs, mostly) ignore it silently rather
    than erroring.

    Correspondingly the driver **never refuses a model.** A backend that
    rejects `temperature` — as some reasoning models do — is accommodated
    by dropping the unsupported parameter and warning, not by failing
    construction. The operator owns the model; the control plane's job is
    to route to it.

    ## Secrets

    The `apiKey` field (and any other `sensitive: true` field) is stored
    on disk as a `MasterKeyEnvelope` (libsodium secretbox + base64
    nonce/ciphertext). The driver reads the master key from
    `EUGENE_PLEXUS_DRIVER_MASTER_KEY` at startup (threaded by the
    agent) and decrypts on demand. PATCH accepts plaintext and
    encrypts before persisting; GET returns `"<redacted>"`.

    ## Safe mode

    The driver honors the agent's safe-mode env var:
    `EUGENE_PLEXUS_DRIVER_SAFE_MODE=1` at startup makes it ignore its
    persisted config file and boot from built-in defaults. This is the
    recovery flow when a config edit breaks startup — the operator can
    still reach `/v1/config` to fix the persisted file, then restart
    without the env var. While safe mode is active `/v1/generate`
    returns 503 (no backend is configured), but `PATCH /v1/config`
    writes to the on-disk config normally.

    ## Auth

    Every endpoint except `/healthz` requires a bearer token. The
    gateway presents its service token (issued by the agent at spawn)
    on every call; the driver verifies it against the agent's signing
    key, threaded via env var.
  license:
    name: Apache-2.0
    identifier: Apache-2.0
  contact:
    name: Eugene Plexus
    url: https://github.com/eugene-plexus
servers:
  - url: http://{host}:{port}
    description: Default LAN deployment (mDNS-discovered or config-overridden).
    variables:
      host:
        default: localhost
      port:
        default: '8081'

security:
  - bearerAuth: []

tags:
  - name: inference
    description: Model invocation.
  - name: config
    description: |
      Remote-editable configuration. Every Eugene Plexus component
      implements the same config trio (`GET /v1/config`,
      `GET /v1/config/schema`, `PATCH /v1/config`) so a single UI can
      manage all components without per-component code.
  - name: admin
    description: Inspect and manage the running driver process.
  - name: meta
    description: Driver metadata and health.

paths:

  /v1/generate:
    post:
      tags: [inference]
      operationId: generate
      summary: Run inference on the configured backend.
      description: |
        Single-turn request/response. The caller builds the full prompt
        and the driver passes it through to its backend, translating into
        whatever wire protocol that backend speaks. The driver owns no
        conversation state.

        **How a backend's own refusal comes back, and why the status
        matters more than it looks.** The gateway cascades a 5xx to the
        next backend in the slot and hard-fails a 4xx, on the reasoning
        that the next backend would hit the same bad request. That rule
        only works if this driver keeps the two apart, so it does:

        * A backend 4xx that another backend would hit identically — an
          over-long prompt, a malformed request, an unknown model — is
          **400**, `type` ending `#backend-rejected-request`, with the
          backend's own status and body in `detail`.
        * **A backend that refuses THIS DRIVER's own credential is 502,
          `type` ending `#backend-credential-refused`, since
          2026-09-28**: a `401`, a `402` (the account behind the key has
          no credit), or a `403` unless the backend's own words say the
          *content* was flagged or moderated (OpenRouter answers 403 for
          flagged input, and that one stays the caller's 400). It was a
          400, which told the caller to fix a request that was fine for
          a key only the operator holds; measured live against
          OpenRouter with an invalid key. `retryDisposition` is
          `terminal`, so it **does not cascade** — the 4xx non-cascade
          rule is older than this and unchanged — and `detail` carries
          the backend's own status and words plus the next step: set a
          working API key on this driver.
        * **A backend with no room for this request now is 503, `type`
          ending `#backend-capacity`, since 2026-10-02 (CB3)**:
          llama-server's `Context size has been exceeded`, a 500 when
          it refuses the request and an `error` frame when it cuts a
          stream, both meaning the prompts in flight together outgrew
          the KV pool its slots share. `retryDisposition` is `safe`, so
          it cascades before any output, and the gateway's circuit does
          not count it: it is load, not a broken backend. As a 502 it
          took every healthy replica of an 8B out as "cooling down"
          (gateway#8). A request bigger than the whole pool is
          llama-server's 400 and stays the caller's.
        * A backend 4xx that is worth trying elsewhere — `408`, `409`,
          `425`, `429` — stays **502**, so the priority-list cascade
          still fires. A rate-limited cloud provider falling through to
          a local engine is the case failover was built for and must not
          regress.
        * **A deadline that fired is 504**, `type` ending
          `#backend-timeout`, and does not cascade. The backend has not
          *failed*; it has not *finished* — almost certainly still
          computing this prompt — and the next replica would take the
          same time to compute the same thing. The message names the
          seconds and `requestTimeoutSeconds`, because a read timeout
          carries no message of its own. A **connect** timeout is a dead
          host that took no work and stays **502**, so failover still
          fires.
        * Everything else — a backend 5xx, a transport failure, a
          malformed body — stays **502**.

        **A caller that disconnects cancels the backend call.** The
        driver answers **499** and the engine is released, rather than
        computing an answer into a closed socket. The same is true of
        the stream's *prefill*: the first chunk is awaited before the
        200 is committed, and on a cold engine that await is the whole
        model load.

        **This is the honest half of context-window handling.**
        `llama-server` answers an over-long prompt with a 400 naming
        both numbers (`n_prompt_tokens` and `n_ctx`); flattening that
        into a 502 made the gateway cascade a request every backend
        would refuse and hand the caller a retryable error, which is the
        looping symptom this project exists to remove. The engine's
        count is exact and ours would be a second implementation of it,
        so the driver's job here is to get out of the way.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateRequest'
      responses:
        '200':
          description: Generation completed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerateResponse'
        '404':
          $ref: '#/components/responses/ModelNotServed'
        '400':
          description: |
            The request cannot be served as asked. Either the driver
            refused it (tools against a backend that cannot carry them;
            `audioOutput` against a model that does not confirm it, or
            in a `format` other than `wav` or `pcm16`) or the backend
            rejected it in a way another backend would reject
            identically — including a prompt longer than the context
            window. Does not cascade.
          content:
            application/problem+json:
              schema:
                $ref: 'components/common.yaml#/components/schemas/Problem'
        '500':
          $ref: 'components/common.yaml#/components/responses/Problem'
        '499':
          description: |
            The caller disconnected while this was running. The backend
            call was cancelled rather than left to finish into a closed
            socket. Nothing reads this status -- the socket is gone --
            but it is what the access log records, and "the caller left"
            must not look like "we failed".
          content:
            application/problem+json:
              schema:
                $ref: 'components/common.yaml#/components/schemas/Problem'
        '502':
          description: |
            Upstream model backend error, or a backend refusal worth
            retrying elsewhere (`408`, `409`, `425`, `429`). Cascades to
            the next backend in the slot. The one 502 that does not:
            `#backend-credential-refused`, the backend refusing this
            driver's own key (see the overview).
          content:
            application/problem+json:
              schema:
                $ref: 'components/common.yaml#/components/schemas/Problem'
        '503':
          description: |
            No room for this request now (`#backend-capacity`, CB3): the
            engine's shared KV pool is full of other requests' prompts.
            `safe`, so it cascades; the gateway's circuit does not count
            it. See the overview.
          content:
            application/problem+json:
              schema:
                $ref: 'components/common.yaml#/components/schemas/Problem'
        '504':
          description: |
            `requestTimeoutSeconds` passed with no answer. **Does not
            cascade**: the backend is still computing this prompt and
            the next replica would take the same time on the same
            input. `detail` names the deadline and the setting.
          content:
            application/problem+json:
              schema:
                $ref: 'components/common.yaml#/components/schemas/Problem'

  /v1/generate/stream:
    post:
      tags: [inference]
      operationId: generateStream
      summary: Run inference with token-streamed output.
      description: |
        Same request shape as `POST /v1/generate`, but the response is a
        Server-Sent Events stream. Events:

        - `event: token` — `data` is a JSON `StreamToken`: `text` for a
          text fragment, `reasoning` for a reasoning fragment,
          `toolCalls` for tool-call fragments, exactly one per frame
        - `event: progress` — `data` is a JSON `StreamProgress`: what
          the backend is doing between outputs. Only when the request
          set `reportProgress`, and at any point before `done`. **Not
          output**: not a commit point one layer up, not a first token,
          and it never arms the stall clock (`streamStallSeconds`)
        - `event: done`  — `data` is the final `GenerateResponse` JSON
        - `event: error` — `data` is a `Problem` JSON

        Backends that don't support native streaming (some CLI subprocess
        adapters) MAY emit the entire response as a single `token` event
        followed by `done`.

        **A failure before the first frame is still a status code**, and
        carries the same 400/502 split `POST /v1/generate` describes —
        so an over-long prompt refused by the engine reaches the caller
        as a 400 and does not cascade. Once the stream is open the 200
        is committed and a failure can only be an `event: error` frame,
        which is why everything that can fail cleanly is made to fail
        before the response is handed over.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateRequest'
      responses:
        '200':
          description: SSE stream opened.
          content:
            text/event-stream:
              schema:
                type: string
                description: Newline-delimited SSE events; see operation description.
        '404':
          $ref: '#/components/responses/ModelNotServed'
        '400':
          description: |
            Refused before the stream opened — the driver's own refusal,
            or a backend rejection another backend would repeat, a
            prompt longer than the context window included. Does not
            cascade.
          content:
            application/problem+json:
              schema:
                $ref: 'components/common.yaml#/components/schemas/Problem'
        '500':
          $ref: 'components/common.yaml#/components/responses/Problem'
        '499':
          description: |
            The caller went away during the PREFILL -- the first chunk
            is awaited before the 200 is committed, and on a cold
            engine that is the whole model load. The engine call was
            cancelled.
          content:
            application/problem+json:
              schema:
                $ref: 'components/common.yaml#/components/schemas/Problem'
        '502':
          description: |
            Backend failure before the stream opened, or a refusal worth
            retrying elsewhere (`408`, `409`, `425`, `429`). Cascades —
            except `#backend-credential-refused`, the backend refusing
            this driver's own key, which does not.
          content:
            application/problem+json:
              schema:
                $ref: 'components/common.yaml#/components/schemas/Problem'
        '503':
          description: |
            No room for this request now (`#backend-capacity`, CB3): the
            engine's shared KV pool is full of other requests' prompts.
            `safe`, so it cascades; the gateway's circuit does not count
            it. See the overview.
          content:
            application/problem+json:
              schema:
                $ref: 'components/common.yaml#/components/schemas/Problem'
        '504':
          description: |
            `requestTimeoutSeconds` passed before the stream opened.
            Does not cascade — the backend is still computing this
            prompt. A timeout *after* the first frame can only be an
            `event: error`, since the 200 is already committed.
          content:
            application/problem+json:
              schema:
                $ref: 'components/common.yaml#/components/schemas/Problem'

  /v1/generate/count:
    post:
      tags: [inference]
      operationId: countPromptTokens
      summary: Count a request's prompt tokens with the backend's own tokenizer, generating nothing.
      description: |
        The prompt this request would put in front of the model, counted
        by the backend that would serve it -- **the same payload
        `/v1/generate` sends**, thinking directive and all, rendered by
        the backend's own chat template and counted by its own
        tokenizer. Nothing is generated and no prefill runs. Added
        2026-09-23 for the Anthropic door's `count_tokens`.

        **llama.cpp only, and measured.** The payload goes to
        `/apply-template` and the prompt it returns to `/tokenize` with
        `add_special: true`; against Gemma 4 E4B on b10948 that gave
        27, 59 and 95 tokens for a plain, a tool-bearing and a tool-loop
        request, **exactly** the `prompt_tokens` a one-token generation
        of each reported. Every other backend answers **501**: vLLM has
        a `/tokenize` of its own that has not been run here, Ollama and
        hosted providers have none, and the agentic CLIs have no prompt
        to count. A backend that does not know is not asked to guess.

        **A request carrying an image is 501 too**: an image's token
        cost is decided by the projector when it encodes the picture,
        and the template renders only a marker for it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateRequest'
      responses:
        '200':
          description: The count.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenCount'
        '404':
          $ref: '#/components/responses/ModelNotServed'
        '400':
          description: |
            The request cannot be counted as asked: tools against a
            backend that cannot carry them, or a setting this backend
            refuses -- the same refusals `/v1/generate` makes.
          content:
            application/problem+json:
              schema:
                $ref: 'components/common.yaml#/components/schemas/Problem'
        '499':
          description: The caller disconnected; the count was abandoned.
          content:
            application/problem+json:
              schema:
                $ref: 'components/common.yaml#/components/schemas/Problem'
        '501':
          description: |
            This backend cannot count exactly without generating (see
            above), or the request carries an image. The caller should
            count some other way; nothing was sent to the model.
          content:
            application/problem+json:
              schema:
                $ref: 'components/common.yaml#/components/schemas/Problem'
        '502':
          description: The backend failed or could not be reached while counting.
          content:
            application/problem+json:
              schema:
                $ref: 'components/common.yaml#/components/schemas/Problem'

  /v1/moderate:
    post:
      tags: [inference]
      operationId: moderate
      summary: Moderate text or an image on the configured backend.
      description: |
        The moderation counterpart of `POST /v1/embed` (P6, 2026-09-28):
        OpenAI's `/v1/moderations`, which only OpenAI's own API serves
        (OpenRouter answers 404, measured). A model without the
        `moderation` surface is refused before anything is sent.

        **Two shapes of input, as OpenAI's**: `texts`, each moderated on
        its own with one result each, or `parts`, one input of text and
        an image with one result. The image is a `data:` URL (A4); the
        gateway never forwards a remote one.

        The backend's results come back as it sent them: `flagged`,
        `categories`, `category_scores` and `category_applied_input_types`
        per input.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModerateRequest'
      responses:
        '200':
          description: One result per input.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModerateResponse'
        '400':
          description: |
            A model without the `moderation` surface, neither or both of
            `texts` and `parts`, or the backend's own refusal (more than
            one image, an image it cannot read), with its words. Does not
            cascade.
          content:
            application/problem+json:
              schema:
                $ref: 'components/common.yaml#/components/schemas/Problem'
        '404':
          $ref: '#/components/responses/ModelNotServed'
        '502':
          description: The backend failed, or refused this driver's own key.
          content:
            application/problem+json:
              schema:
                $ref: 'components/common.yaml#/components/schemas/Problem'
        '504':
          description: '`requestTimeoutSeconds` passed with no answer.'
          content:
            application/problem+json:
              schema:
                $ref: 'components/common.yaml#/components/schemas/Problem'

  /v1/speak:
    post:
      tags: [inference]
      operationId: speak
      summary: Speak text on the configured backend, streamed as audio bytes.
      description: |
        The speech counterpart of `POST /v1/generate` (P3a, 2026-09-28):
        normalised, so one request fronts OpenAI's `/v1/audio/speech`,
        OpenRouter's and ElevenLabs' text-to-speech, each translated here.
        No local engine speaks yet.

        **The answer is the audio itself, streamed** as the backend sends
        it, with the format's media type. Nothing is buffered; the first
        byte out is the commit point one layer up. A failure before it is a
        status code with a `problem+json` body, as for chat.

        **Formats are the model's.** A `format` the backend cannot make is
        refused with 400 naming the ones it can (`SpeechFormat`); `wav` is
        made from `pcm` where the backend has no WAV of its own. A voice
        the backend does not know is its own 400, relayed with its words.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SpeakRequest'
      responses:
        '200':
          description: The audio, streamed. `Content-Type` names the format.
          content:
            audio/mpeg:
              schema:
                type: string
                format: binary
            audio/ogg:
              schema:
                type: string
                format: binary
            audio/aac:
              schema:
                type: string
                format: binary
            audio/flac:
              schema:
                type: string
                format: binary
            audio/wav:
              schema:
                type: string
                format: binary
            audio/pcm:
              schema:
                type: string
                format: binary
        '400':
          description: |
            A format the model cannot make, a setting its backend cannot
            carry (`instructions` on ElevenLabs), or the backend's own
            refusal (an unknown voice). Does not cascade.
          content:
            application/problem+json:
              schema:
                $ref: 'components/common.yaml#/components/schemas/Problem'
        '404':
          $ref: '#/components/responses/ModelNotServed'
        '502':
          description: |
            The backend failed, or refused this driver's own key --
            `#backend-credential-refused`, naming the missing permission
            where the backend does (ElevenLabs' scoped keys).
          content:
            application/problem+json:
              schema:
                $ref: 'components/common.yaml#/components/schemas/Problem'
        '504':
          description: '`requestTimeoutSeconds` passed with no first byte.'
          content:
            application/problem+json:
              schema:
                $ref: 'components/common.yaml#/components/schemas/Problem'

  /v1/transcribe:
    post:
      tags: [inference]
      operationId: transcribe
      summary: Transcribe audio on the configured backend.
      description: |
        The transcription counterpart of `POST /v1/generate` (P3b,
        2026-09-28): normalised, so one request fronts OpenAI's and
        OpenRouter's `/v1/audio/transcriptions`, `llama-server`'s, and
        ElevenLabs' `/v1/speech-to-text` (P3-1), each asked in the form it
        takes (measured).

        **`translate` asks for English instead** (P3-4): OpenAI's
        `/v1/audio/translations`, which only OpenAI's `whisper-*` models
        answer (measured: its `gpt-4o-*-transcribe` models, OpenRouter and
        `llama-server` all answer 404). A model without the `translation`
        surface is refused before any audio is sent, and `language` and
        `timestampGranularities` are refused with it, since OpenAI's door
        takes neither.

        **ElevenLabs** is asked for no audio-event tags, so its transcript
        reads as OpenAI's does. It takes no `prompt` and would ignore one
        (measured), so a prompt is refused; it makes no segments, so
        `segment` timestamps are refused. Its words become OpenAI's
        `{word, start, end}` and its `audio_duration_secs` the usage
        seconds.

        **The audio travels as base64 in JSON**, as attachments do (P2a).
        It is at most 25 MiB, OpenAI's upload limit, so this path's body
        limit is 36 MiB where every other inference path's is 16.

        **`llama-server` makes `json` only** (measured): `verbose` asked of
        it is its own 400, relayed. Its Qwen3-ASR text carries the model's
        own preamble (`language English<asr_text>...`), which the same
        model on OpenRouter does not send; the driver parses it into
        `language` and the text.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TranscribeRequest'
      responses:
        '200':
          description: The transcript.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TranscribeResponse'
        '400':
          description: |
            Audio that is not base64, or the backend's own refusal (a format
            it cannot read, `verbose` on `llama-server`), with its words.
            Does not cascade.
          content:
            application/problem+json:
              schema:
                $ref: 'components/common.yaml#/components/schemas/Problem'
        '404':
          $ref: '#/components/responses/ModelNotServed'
        '413':
          description: The body is over this path's 36 MiB limit.
          content:
            application/problem+json:
              schema:
                $ref: 'components/common.yaml#/components/schemas/Problem'
        '502':
          description: The backend failed, or refused this driver's own key.
          content:
            application/problem+json:
              schema:
                $ref: 'components/common.yaml#/components/schemas/Problem'
        '504':
          description: '`requestTimeoutSeconds` passed with no answer.'
          content:
            application/problem+json:
              schema:
                $ref: 'components/common.yaml#/components/schemas/Problem'

  /v1/image:
    post:
      tags: [inference]
      operationId: image
      summary: Make or edit images on the configured backend.
      description: |
        The image counterpart of `POST /v1/generate` (P4, 2026-09-28):
        normalised, so one request fronts OpenAI's `/v1/images/generations`
        and `/v1/images/edits` and OpenRouter's `/images/generations`, each
        translated here.

        **An edit is a generation with `references`.** OpenRouter has no
        edit route (404, measured) and takes the images as
        `input_references` objects on `/images/generations`; OpenAI is asked
        on `/v1/images/edits` in the multipart form its SDK uses. `mask`
        reaches only OpenAI's API, which alone honours it; this driver
        refuses it for any other backend rather than letting it be ignored
        (OpenRouter ignores it, measured).

        **The images travel as base64 in JSON**, at most 25 MiB decoded in
        all, so this path's body limit is 36 MiB, as `/v1/transcribe`'s is.
        Every image comes back base64 whatever the backend was asked, with
        the media type its bytes carry (OpenRouter ignores
        `response_format: url`, measured).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImageRequest'
      responses:
        '200':
          description: The images.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageResponse'
        '400':
          description: |
            A setting this model does not take (`mask` off OpenAI's API,
            more references than it reads), or the backend's own refusal
            (OpenRouter's *"No provider ... supports the requested
            parameter(s)"*, a provider's content filter), with its words.
            Does not cascade.
          content:
            application/problem+json:
              schema:
                $ref: 'components/common.yaml#/components/schemas/Problem'
        '404':
          $ref: '#/components/responses/ModelNotServed'
        '413':
          description: The body is over this path's 36 MiB limit.
          content:
            application/problem+json:
              schema:
                $ref: 'components/common.yaml#/components/schemas/Problem'
        '502':
          description: The backend failed, or refused this driver's own key.
          content:
            application/problem+json:
              schema:
                $ref: 'components/common.yaml#/components/schemas/Problem'
        '504':
          description: '`requestTimeoutSeconds` passed with no answer.'
          content:
            application/problem+json:
              schema:
                $ref: 'components/common.yaml#/components/schemas/Problem'

  /v1/image/stream:
    post:
      tags: [inference]
      operationId: imageStream
      summary: Make or edit images, with partial images streamed.
      description: |
        Same request as `POST /v1/image`, for a model whose
        `capabilities.image.streaming` is true (P4-3: a streamed request is
        routed only to one). The response is Server-Sent Events:

        - `event: partial`: `data` is an `ImagePartial`, one partial render;
        - `event: done`: `data` is the final `ImageResponse`;
        - `event: error`: `data` is a `Problem`.

        **A failure before the first event is a status code**, as for
        `/v1/generate/stream`; after it, only an `error` event. A backend
        that answers plain JSON although asked to stream (OpenRouter does,
        for a model that cannot, measured) is the driver's 400: the model's
        listing said it streams and the backend disagreed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImageRequest'
      responses:
        '200':
          description: SSE stream opened.
          content:
            text/event-stream:
              schema:
                type: string
                description: Newline-delimited SSE events; see operation description.
        '400':
          description: As `POST /v1/image`, plus a model that does not stream.
          content:
            application/problem+json:
              schema:
                $ref: 'components/common.yaml#/components/schemas/Problem'
        '404':
          $ref: '#/components/responses/ModelNotServed'
        '413':
          description: The body is over this path's 36 MiB limit.
          content:
            application/problem+json:
              schema:
                $ref: 'components/common.yaml#/components/schemas/Problem'
        '502':
          description: The backend failed before the stream opened.
          content:
            application/problem+json:
              schema:
                $ref: 'components/common.yaml#/components/schemas/Problem'
        '504':
          description: '`requestTimeoutSeconds` passed before the first event.'
          content:
            application/problem+json:
              schema:
                $ref: 'components/common.yaml#/components/schemas/Problem'

  /v1/video:
    post:
      tags: [inference]
      operationId: video
      summary: Submit a video job on the configured backend.
      description: |
        The video counterpart of `POST /v1/generate` (P5, 2026-09-28):
        normalised, so the gateway speaks OpenAI's `/v1/videos` and this
        driver asks OpenRouter's `/videos` in its own shape (`duration` an
        integer, `size` one it lists, the first frame as `frame_images`).
        OpenAI's own video API shut down on 2026-09-24 (measured); an OpenAI
        account makes no videos.

        **The answer is the job, not the video.** OpenRouter accepts a job in
        a few seconds and makes it in tens (24-47 s for one second at 480p,
        measured); the caller polls `GET /v1/video/{jobId}`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VideoRequest'
      responses:
        '200':
          description: The job, accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoJob'
        '400':
          description: |
            A model that makes no videos, a first frame that is not an
            image, or the backend's own refusal (a size it does not list),
            with its words. Does not cascade.
          content:
            application/problem+json:
              schema:
                $ref: 'components/common.yaml#/components/schemas/Problem'
        '404':
          $ref: '#/components/responses/ModelNotServed'
        '413':
          description: The body is over this path's 36 MiB limit.
          content:
            application/problem+json:
              schema:
                $ref: 'components/common.yaml#/components/schemas/Problem'
        '502':
          description: The backend failed, or refused this driver's own key.
          content:
            application/problem+json:
              schema:
                $ref: 'components/common.yaml#/components/schemas/Problem'
        '504':
          description: '`requestTimeoutSeconds` passed with no answer.'
          content:
            application/problem+json:
              schema:
                $ref: 'components/common.yaml#/components/schemas/Problem'

  /v1/video/{jobId}:
    get:
      tags: [inference]
      operationId: videoJob
      summary: Poll a video job.
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 256
      responses:
        '200':
          description: The job as the backend reports it now.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoJob'
        '404':
          description: The backend knows no such job.
          content:
            application/problem+json:
              schema:
                $ref: 'components/common.yaml#/components/schemas/Problem'
        '502':
          description: The backend failed, or refused this driver's own key.
          content:
            application/problem+json:
              schema:
                $ref: 'components/common.yaml#/components/schemas/Problem'

  /v1/video/{jobId}/content:
    get:
      tags: [inference]
      operationId: videoContent
      summary: A finished video job's MP4, streamed.
      description: |
        Streamed as the backend sends it. OpenRouter sends it chunked, with
        no length, and ignores `Range` (measured), so a download is whole.
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 256
      responses:
        '200':
          description: The video.
          content:
            video/mp4:
              schema:
                type: string
                format: binary
        '400':
          description: The backend's refusal (a job that has no video yet).
          content:
            application/problem+json:
              schema:
                $ref: 'components/common.yaml#/components/schemas/Problem'
        '404':
          description: The backend knows no such job.
          content:
            application/problem+json:
              schema:
                $ref: 'components/common.yaml#/components/schemas/Problem'
        '502':
          description: The backend failed.
          content:
            application/problem+json:
              schema:
                $ref: 'components/common.yaml#/components/schemas/Problem'

  /v1/embed:
    post:
      tags: [inference]
      operationId: embed
      summary: Turn text into vectors on the configured backend.
      description: |
        The embeddings counterpart to `POST /v1/generate`, and the same
        shape of thing: the caller supplies text, the driver translates
        into whatever wire protocol its backend speaks, and owns no
        state.

        **Always float arrays, never base64.** OpenAI's `/v1/embeddings`
        lets a client ask for base64, and the OpenAI SDKs use it by
        default — but that is a *transport* encoding, and making every
        driver support it would mean depending on each backend to honour
        a parameter some ignore. So this surface speaks one shape and
        the gateway encodes on the way out, which makes the
        client-visible behaviour identical regardless of what the
        backend underneath happens to support.

        **The capability is a property of the running backend, not of
        the model**, and it cannot be read off anything — measured
        2026-09-12: `llama-server`'s `/props` exposes no pooling or
        embedding field at all, and an Ollama runner started for chat
        answers `This server does not support embeddings. Start it with
        --embeddings`. So a driver determines it by *trying*, once, and
        reports the result as the model's `embeddings` surface on
        `/v1/info`.
        The negative case is cheap: llama.cpp refuses a non-pooling
        model in 45 ms, before any compute.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmbedRequest'
      responses:
        '200':
          description: Vectors produced.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmbedResponse'
        '404':
          $ref: '#/components/responses/ModelNotServed'
        '400':
          description: |
            This backend cannot embed, or rejected the request in a way
            another backend would reject identically. Does not cascade.
            A model without the `embeddings` surface fails here rather
            than returning something that is not an embedding.
          content:
            application/problem+json:
              schema:
                $ref: 'components/common.yaml#/components/schemas/Problem'
        '500':
          $ref: 'components/common.yaml#/components/responses/Problem'
        '499':
          description: |
            The caller went away; the backend call was cancelled.
          content:
            application/problem+json:
              schema:
                $ref: 'components/common.yaml#/components/schemas/Problem'
        '502':
          description: |
            Upstream backend error, or a refusal worth retrying
            elsewhere (`408`, `409`, `425`, `429`). Cascades — but only
            across replicas of the SAME model; see `gateway.yaml`.
            `#backend-credential-refused` (the backend refusing this
            driver's own key) does not cascade.
          content:
            application/problem+json:
              schema:
                $ref: 'components/common.yaml#/components/schemas/Problem'
        '504':
          description: |
            `requestTimeoutSeconds` passed with no answer. Does not
            cascade: a replica would take the same time on the same
            input.
          content:
            application/problem+json:
              schema:
                $ref: 'components/common.yaml#/components/schemas/Problem'

  /v1/decide:
    post:
      tags: [inference]
      operationId: decide
      summary: Answer typed decision questions against one state.
      description: |
        The decisions counterpart to `POST /v1/generate`: one state and
        a map of named typed questions in, structured answers out —
        never free text. Internal and signed like every driver
        operation; the public TypeSafe-shaped door is the gateway's
        `POST /v1/systemone`, and this operation carries its substance
        after admission, bounds and routing have already been applied.

        The question and answer vocabulary is the **pinned TypeSafe
        System One protocol** (docs.typesafe.ai/api, read 2026-09-22;
        `docs/design/decision-models.md` holds the pin): `noul` answers
        a probability of yes, `choice` answers a selection with a
        distribution over at most 255 named options, `score` answers a
        probability-weighted value over 2-10 ordered levels. Fields the
        protocol does not define are refused, not forwarded — an
        unsupported knob silently dropped would be a different question
        answered confidently.

        **Malformed backend output is a backend error, never an
        invented decision.** The driver validates before returning
        success: every question answered with the matching type, choices
        legal, distributions well-formed, numbers finite and in range.
        Provider probabilities and any reported model revision are
        preserved as provenance (`reportedModel`) without claiming they
        are comparable across models. Non-streaming, deliberately.

        Raw `state` is not logged by default: it is the caller's
        record, often someone else's ticket.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DecisionRequest'
      responses:
        '200':
          description: Every question answered and validated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DecisionResponse'
        '404':
          $ref: '#/components/responses/ModelNotServed'
        '400':
          description: |
            This backend does not decide (`capabilities.decision`
            absent — the reason names `/v1/generate` for a chat model),
            or the request violates the pinned protocol in a way every
            replica would refuse identically (an unknown question kind,
            an unsupported field, criteria of the wrong shape, option
            or level counts outside the protocol's bounds). Does not
            cascade.
          content:
            application/problem+json:
              schema:
                $ref: 'components/common.yaml#/components/schemas/Problem'
        '499':
          description: |
            The caller went away. **Capacity stays occupied while known
            local work continues**: a single-slot backend that is still
            computing has not become free because nobody is listening,
            and admitting the next request on top of it would be the
            over-admission a non-cancellable engine cannot absorb.
          content:
            application/problem+json:
              schema:
                $ref: 'components/common.yaml#/components/schemas/Problem'
        '500':
          $ref: 'components/common.yaml#/components/responses/Problem'
        '502':
          description: |
            Upstream backend error, malformed backend output (a missing
            answer, an illegal choice, a distribution that is not one),
            or a refusal-before-work worth retrying elsewhere. Cascades
            across replicas of the same model per the gateway's rules.
            `#backend-credential-refused` (the backend refusing this
            driver's own key) does not cascade.
          content:
            application/problem+json:
              schema:
                $ref: 'components/common.yaml#/components/schemas/Problem'
        '504':
          description: |
            `requestTimeoutSeconds` passed with no answer. Does not
            cascade — **a timeout after possible execution never
            justifies silently sending the same decision to a different
            model** — and per A6b the outcome is reported uncertain
            rather than failed.
          content:
            application/problem+json:
              schema:
                $ref: 'components/common.yaml#/components/schemas/Problem'

  /v1/info:
    get:
      tags: [meta]
      operationId: info
      summary: Report which backend and models this driver serves.
      description: |
        The gateway polls this to build its routing table: each entry
        of `models` is a model it routes on, with that model's
        `capabilities`, and `backend` / `provider` are what the UI
        labels. A driver reports only what it serves — never where it
        sits.

        An account's list can run to hundreds of entries (OpenRouter's
        is 625). `models=false` leaves the list out and keeps every
        driver-level field, `catalogue` included, for a caller that only
        needs those — the gateway's per-request re-check of locality is
        the one that exists.
      parameters:
        - name: models
          in: query
          required: false
          schema:
            type: boolean
            default: true
          description: |
            `false` omits `models`. A driver from before P1 ignores the
            parameter, which is harmless: it has no list to omit.
        - name: model
          in: query
          required: false
          schema:
            type: string
          description: |
            Only this model's entry in `models` — an empty list when it is
            not served. For the gateway's per-request re-check of one
            candidate's settings and tools before it wakes or sends
            anything, which would otherwise re-read an account's entire
            list on every request that carries a setting. Unprefixed, as
            a request's `model` is.
      responses:
        '200':
          description: Driver metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriverInfo'

  /v1/config:
    get:
      tags: [config]
      operationId: getConfig
      summary: Read the driver's current effective configuration.
      description: |
        Returns every config field's currently effective value. Values
        of fields with `sensitive: true` (e.g. API keys) are redacted
        as the literal string `"<redacted>"`.

        ## Auth note (v0.1)

        Eugene Plexus v0.1 ships with no application-level
        authentication. Deployment assumption: behind a Tailscale
        tailnet (or equivalent network boundary). **Anyone reachable
        on the network can read and modify this driver's config.**
        Auth lands in v0.2.
      responses:
        '200':
          description: Current config.
          content:
            application/json:
              schema:
                $ref: 'components/common.yaml#/components/schemas/ConfigDocument'
    patch:
      tags: [config]
      operationId: updateConfig
      summary: Partial update of the driver's configuration.
      description: |
        Accepts a partial map of `key -> new-value` pairs. Each key is
        validated against its `ConfigField` definition. Validation
        errors are reported per-key without aborting the whole
        request — valid changes are applied, invalid ones are
        rejected and surfaced in the response.

        Some fields require a process restart to take effect (see
        `ConfigField.requiresRestart`). The response indicates whether
        a restart is needed and which keys are queued.

        ## Auth note (v0.1)

        Same caveat as `GET /v1/config`: in v0.1, anyone on the network
        can change driver config. Auth lands in v0.2.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: 'components/common.yaml#/components/schemas/ConfigUpdateRequest'
      responses:
        '200':
          description: Update outcome (may include per-field rejections).
          content:
            application/json:
              schema:
                $ref: 'components/common.yaml#/components/schemas/ConfigUpdateResult'
        '400':
          $ref: 'components/common.yaml#/components/responses/Problem'

  /v1/config/schema:
    get:
      tags: [config]
      operationId: getConfigSchema
      summary: UI-renderable description of every editable config field.
      description: |
        Returns a `ConfigSchema` listing every config field this driver
        accepts, with type, default, validation hints, and UI metadata
        (label, description, category, sensitive flag, restart-required
        flag). UIs use this to render a generic config editor without
        driver-specific code.
      responses:
        '200':
          description: Config schema.
          content:
            application/json:
              schema:
                $ref: 'components/common.yaml#/components/schemas/ConfigSchema'

  /v1/config/test:
    post:
      tags: [config]
      operationId: testConfig
      summary: Test the effective config without committing it.
      description: |
        Builds a temporary adapter from the saved config merged with the
        optional `overrides`, runs a minimal `generate()` round-trip
        (single user message), and reports success / failure / latency.
        The override values are NOT persisted — `PATCH /v1/config` is
        still required to commit them. Use this from the UI's "Test
        Connection" button so the operator can verify a new API key,
        URL, or model identifier before saving.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: 'components/common.yaml#/components/schemas/ConfigTestRequest'
      responses:
        '200':
          description: Test result. Returned for both success and failure cases.
          content:
            application/json:
              schema:
                $ref: 'components/common.yaml#/components/schemas/ConfigTestResult'

  /v1/admin/restart:
    post:
      tags: [admin]
      operationId: restart
      summary: Schedule a process restart so `requiresRestart` config takes effect.
      description: |
        Some config keys (`port`, `provider`, `modelId`, etc.) carry
        `requiresRestart: true` because the driver only reads them at
        startup. Calling this endpoint tells the driver to exit shortly
        after responding; an external supervisor (systemd, docker,
        deploy launcher) brings it back up with the new config in
        effect. The endpoint returns *before* the exit so the HTTP
        response has time to flush.

        v0.1 personal-use installations without a supervisor will
        require a manual relaunch. The UI should make this clear in the
        confirmation dialog.

        ## Auth note (v0.1)

        Unauthenticated, same as the rest of the v0.1 admin surface
        (assumed Tailscale tailnet). Auth lands in v0.2.
      responses:
        '202':
          description: Restart scheduled.
          content:
            application/json:
              schema:
                $ref: 'components/common.yaml#/components/schemas/RestartResult'

  /healthz:
    get:
      tags: [meta]
      operationId: healthz
      summary: Liveness / readiness probe.
      security: []
      description: |
        Returns ok if the driver process is running and the configured
        backend is reachable (a cheap probe — typically a cached result
        from the last successful call, refreshed on a timer).
      responses:
        '200':
          description: Healthy.
          content:
            application/json:
              schema:
                $ref: 'components/common.yaml#/components/schemas/Health'
        '503':
          description: Backend unreachable or driver not ready.
          content:
            application/json:
              schema:
                $ref: 'components/common.yaml#/components/schemas/Health'

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: |
        Bearer service token. Threaded to the driver by the agent
        at spawn time via env var. The gateway presents the
        same token shape on every call.

  responses:
    ModelNotServed:
      description: |
        The request named a `model` this driver does not serve: not in
        `DriverInfo.models`, or dropped from an account's catalogue since
        the caller last read it. `type` ends `#model-not-served`. **No
        backend was called**, so nothing was computed and the gateway may
        try another backend at once; it also re-reads this driver's list.
        An account driver asked with no `model` at all answers **400**,
        `type` ending `#model-required`, since it has no one model to
        assume.
      content:
        application/problem+json:
          schema:
            $ref: 'components/common.yaml#/components/schemas/Problem'

  schemas:

    GenerateRequest:
      type: object
      required:
        - messages
      properties:
        model:
          $ref: '#/components/schemas/RequestModel'
        localOnly:
          type: boolean
          default: false
          description: |
            Internal routing policy. When true the driver must refuse before
            forwarding any prompt/image unless its active engine is classified
            local. Never forward this field upstream. Checked on the active
            engine at execution, so stale gateway metadata cannot relax policy.
        callerSettings:
          type: array
          items:
            type: string
          description: |
            A2 provenance: names of settings explicitly requested by the caller,
            using this request's field names (maxTokens, temperature, topP, seed,
            stop, tools, toolChoice, responseFormat, topK, minP, frequencyPenalty,
            presencePenalty, parallelToolCalls; since P2c logprobs, logitBias,
            reasoningEffort, verbosity, prediction, webSearchOptions). `topLogprobs`
            rides with `logprobs`. The hints (`promptCacheKey`,
            `promptCacheRetention`, `serviceTier`, `safetyIdentifier`) are never
            listed: a backend that cannot carry a hint drops it. The gateway preserves this
            list on each fallback attempt. An adapter must refuse a known unsupported
            explicit setting with 400, rather than silently dropping it. Settings
            supplied only by profiles/defaults retain the adapter's default behavior.
            This field is internal and is not forwarded to upstream providers.
        completion:
          $ref: '#/components/schemas/CompletionPrompt'
        messages:
          type: array
          description: |
            Full prompt as an ordered conversation. Whatever system
            message the caller wants is already in here; the driver does
            not modify, prepend to, or reorder it. Empty with `completion`.
          items:
            $ref: 'components/common.yaml#/components/schemas/Message'
        maxTokens:
          type: integer
          minimum: 1
          description: |
            Maximum output tokens. Backend-clamped. Owned by the caller
            (the gateway) — the driver applies no local default. Adapters
            whose backends don't expose this knob (agentic CLIs) refuse it when
            callerSettings marks it explicit; inherited defaults remain ignored.
        temperature:
          type: number
          format: float
          minimum: 0
          maximum: 2
          description: |
            Sampling temperature. Backend-clamped. Owned by the caller
            (the gateway, which resolves it from the model's settings
            profile) — the driver applies no local default. Backends that
            reject the parameter outright, as some reasoning models do,
            refuse explicit callerSettings and omit inherited defaults.
        topP:
          type: number
          format: float
          minimum: 0
          maximum: 1
          description: |
            Nucleus sampling cutoff. Owned by the caller (the gateway)
            exactly as `temperature` is, and for the same reason: it
            changes what the model says, so a driver never substitutes
            one of its own.

            **Added 2026-09-19.** `gateway.yaml` had promised since M0
            that `top_p` was passed through to backends that support it
            and dropped with a warning where they do not, and there was
            no field here to carry it — so the gateway accepted the
            value from its caller and silently discarded it, with no
            warning logged anywhere. A knob that is read, validated and
            thrown away is worse than one that is refused.

            An adapter whose backend has no such knob — the agentic
            CLIs — drops it and says so in its log, once per field, and
            answers the request.
        seed:
          type: integer
          description: |
            Deterministic-sampling seed. Owned by the caller, carried to
            backends that implement it, dropped with a logged warning by
            adapters whose backends do not.

            **Added 2026-09-19 for the same reason as `topP`**, and it
            is the more load-bearing of the two: a caller asking for a
            seed is asking for a reproducible answer, and silently
            dropping it returns a different answer each time while the
            contract says otherwise. Nothing in a response says whether
            the seed arrived, so the failure is invisible to the caller
            by construction.
        stop:
          type: array
          items:
            type: string
          description: Optional stop sequences.
        topK:
          type: integer
          minimum: 0
          description: |
            Sample from only the K most likely tokens; 0 disables the cut.
            Not an OpenAI parameter -- llama.cpp and vLLM both take it as
            `top_k`, and Anthropic's Messages API has it natively. Caller-
            owned like every sampler here: carried when the caller set it,
            never substituted by a driver.

            **Added 2026-09-23.** Until then both front doors refused it
            with a 400 because this request had nowhere to put it, which
            made it the last sampling parameter with that gap after
            `topP` and `seed` closed theirs on 2026-09-19.

            An adapter whose backend is known to reject it (a hosted
            OpenAI endpoint, the agentic CLIs) refuses it when explicit,
            and omits it from `capabilities.supportedSettings` so the
            gateway routes around that backend instead.
        minP:
          type: number
          format: float
          minimum: 0
          maximum: 1
          description: |
            Discard tokens less likely than this fraction of the most
            likely one. A llama.cpp and vLLM extension (`min_p`), carried
            and refused exactly as `topK` is.
        frequencyPenalty:
          type: number
          format: float
          minimum: -2
          maximum: 2
          description: |
            OpenAI's `frequency_penalty`: penalise a token by how often
            it has already appeared. Carried to every backend that takes
            it; refused when explicit by the agentic CLIs and, by the
            same rule that omits `temperature`, by models whose sampler
            is fixed.
        presencePenalty:
          type: number
          format: float
          minimum: -2
          maximum: 2
          description: |
            OpenAI's `presence_penalty`: penalise a token for having
            appeared at all. Carried and refused exactly as
            `frequencyPenalty` is.
        parallelToolCalls:
          type: boolean
          description: |
            Whether the model may request several tools in one turn.
            OpenAI's `parallel_tool_calls`, which llama.cpp also reads.
            **The default differs by backend**: llama.cpp assumes false
            when it is absent and OpenAI assumes true, so an absent
            field is left absent rather than filled in -- choosing for
            the caller would change what some backend already does.
        requestId:
          type: string
          format: uuid
          description: Caller-supplied id for log correlation. Echoed in the response.
        tools:
          type: array
          items:
            $ref: '#/components/schemas/Tool'
          description: |
            Tools the model may call, in OpenAI's shape. Carried down to
            the backend unchanged and never executed here — the driver
            is a protocol adapter, and running a tool is the caller's
            job by the same reasoning that keeps output-affecting
            parameters on the gateway.

            An adapter whose backend cannot carry tools MUST fail the
            request rather than drop the field. Dropping it yields a
            plain answer that a harness cannot distinguish from the
            model declining to call anything.
        toolChoice:
          description: |
            `none`, `auto`, `required`, or an object naming one
            function. Passed through.
          oneOf:
            - type: string
              enum:
                - none
                - auto
                - required
            - $ref: '#/components/schemas/NamedToolChoice'
        responseFormat:
          $ref: '#/components/schemas/ResponseFormat'
        audioOutput:
          $ref: '#/components/schemas/AudioOutputRequest'
        logprobs:
          type: boolean
          description: Return the chosen tokens' log probabilities (P2c). A setting.
        topLogprobs:
          type: integer
          minimum: 0
          maximum: 20
        logitBias:
          type: object
          additionalProperties:
            type: integer
            minimum: -100
            maximum: 100
          description: Token id to bias, OpenAI's `logit_bias`. A setting.
        reasoningEffort:
          $ref: 'components/common.yaml#/components/schemas/ReasoningEffort'
        verbosity:
          $ref: 'components/common.yaml#/components/schemas/Verbosity'
        prediction:
          $ref: 'components/common.yaml#/components/schemas/Prediction'
        webSearchOptions:
          $ref: 'components/common.yaml#/components/schemas/WebSearchOptions'
        promptCacheKey:
          type: string
          description: A hint, carried to OpenAI's own API and dropped elsewhere (P2c).
        promptCacheRetention:
          $ref: 'components/common.yaml#/components/schemas/PromptCacheRetention'
        serviceTier:
          $ref: 'components/common.yaml#/components/schemas/ServiceTier'
        safetyIdentifier:
          type: string
          description: A hint, as `promptCacheKey`.
        conversationKey:
          type: string
          description: |
            **Internal, from the gateway: never forwarded upstream** (CB4,
            2026-10-02). The conversation this turn continues, as the
            gateway's affinity table keys it. A driver with
            `slotPinning` on (llama-server only, set by the agent with
            `--no-cache-idle-slots`) keeps each conversation in one
            engine slot by `id_slot`, least recently used out, and
            **never names a slot that is busy**: a turn whose slot is
            busy, or a new conversation when no slot is idle, waits in
            the driver. Measured: pinning a request to a busy slot
            wedged llama-server b11211 for up to 30 minutes; waiting in
            front of it, no stall in 1,224 turns. Absent, a turn takes
            any idle slot and keeps none.
        reportProgress:
          type: boolean
          default: false
          description: |
            On `POST /v1/generate/stream` only: emit `event: progress`
            frames saying what the backend is doing when it is not yet,
            or not at the moment, producing output -- see
            `StreamProgress` for what each backend reports. Ignored by
            `POST /v1/generate`. Not an output setting: it changes what
            the stream says about the work, never what the model says.

            llama.cpp's own `return_progress` flag is sent only once the
            backend has answered as `llama-server` (its `/props`), since
            a hosted API refuses a field it does not know.

            **The 200 commits at the first progress frame**, where it
            otherwise commits at the first token, so a backend that
            fails partway through reading the prompt fails as an
            `event: error` frame instead of a status code. That is why
            it is asked for rather than sent by default.
    TokenCount:
      type: object
      additionalProperties: false
      required:
        - promptTokens
      properties:
        promptTokens:
          type: integer
          minimum: 0
          description: |
            Tokens the backend's own template and tokenizer produce for
            this request's prompt -- what `usage.promptTokens` on a
            generation of the same request would report.

    GenerateResponse:
      type: object
      required:
        - finishReason
      properties:
        content:
          type:
            - string
            - 'null'
          description: |
            The generated assistant text. **Nullable since tool calling
            landed:** a turn that only calls a tool produces no text,
            and an empty string would be a lie about what the model
            said. Was required; a response with `toolCalls` and no
            `content` is the common agent-loop case.
        reasoning:
          type:
            - string
            - 'null'
          description: |
            The model's reasoning for this turn, when the backend
            reports it separately from `content` -- `reasoning_content`
            from llama.cpp, `reasoning` from vLLM. Absent when there was
            none, when the backend puts reasoning inline in `content`
            (then `thinkingMode` and the thinking filter govern it), and
            always when this driver's `thinkingMode` is `off`.

            **Added 2026-09-23, and before it every token of it was
            discarded.** Measured against llama.cpp b10948 launched with
            the agent's own argv: a reasoning model's thinking arrives
            in `reasoning_content` by default, this driver read only
            `content`, and a Qwen3 that spent its whole `max_tokens`
            budget thinking came back as an **empty answer with
            `finishReason: length`** and nothing to say why. A stop
            sequence can match inside the reasoning too, which produced
            the same empty `stop`.
        stopSequence:
          type:
            - string
            - 'null'
          description: |
            Which of the request's `stop` strings ended the answer, when
            the backend says. vLLM does (`stop_reason` on the choice);
            **llama.cpp b10948 does not** -- measured, its choice carries
            `finish_reason`, `index` and `message` and nothing else -- so
            for most local installs this stays null and `finishReason`
            stays `stop`. Set together with `finishReason: stop_sequence`.
        toolCalls:
          type: array
          items:
            $ref: '#/components/schemas/ToolCall'
          description: |
            Tools the model chose to call. Present when `finishReason`
            is `tool_calls`.
        finishReason:
          type: string
          enum:
            - stop           # natural end of generation
            - length         # hit max tokens
            - stop_sequence  # matched a `stop` value
            - tool_calls     # stopped to call one or more tools
            - content_filter # a safety classifier stopped the answer
            - error          # truncated due to backend error
          description: |
            **`content_filter` is separate from `error` since
            2026-09-19**, and the two were one value for the same
            reason `tool_calls` was folded into `stop` before step 6:
            the map had a row for a state nobody had a use for yet, so
            the state was reported as its nearest neighbour.

            A filtered answer is not a backend error — nothing broke,
            the backend did exactly what it was configured to do — and
            it is not a natural end either, which is what the caller
            saw. `error` means the generation was truncated because
            something failed mid-stream; `content_filter` means a
            classifier stopped it on purpose. OpenAI and Anthropic each
            have their own name for this state and the gateway renders
            it in the caller's vocabulary, so a client that switches on
            the field gets the vendor value it already understands.
        audio:
          $ref: '#/components/schemas/GeneratedAudio'
        logprobs:
          $ref: 'components/common.yaml#/components/schemas/ChatLogprobs'
        annotations:
          type: array
          items:
            $ref: 'components/common.yaml#/components/schemas/ChatAnnotation'
          description: The web sources the answer cites, from a provider's search (P2c).
        usage:
          $ref: '#/components/schemas/Usage'
        requestId:
          type: string
          format: uuid
        backend:
          $ref: 'components/common.yaml#/components/schemas/BackendKind'
        modelId:
          type: string
          description: |
            The public model identifier this driver serves (e.g.
            `"claude-opus-4-7"`) — the same value `/v1/info` advertises,
            **normalized**: when the driver translates to an
            `upstreamModelId` at the backend boundary, the backend's own
            name for itself is not echoed here. A caller that asked the
            public alias gets the public alias back, on this field and
            on the terminal frame of a stream alike.
        latencyMs:
          type: integer
          description: End-to-end driver-side latency in milliseconds.

    StreamToken:
      type: object
      description: |
        One `event: token` payload. Exactly one of `text`, `reasoning`,
        `toolCalls`, `audio` or `annotations` is set; `logprobs` rides with
        the `text` whose tokens it describes.

        A reasoning frame is output like any other: it is the first
        thing a reasoning model produces, so it is also the commit point
        one layer up -- once a caller has been shown the model thinking,
        a failure cannot cascade onto another model's answer.
      properties:
        text:
          type: string
          description: A fragment of the assistant's text.
        reasoning:
          type: string
          description: |
            A fragment of the model's reasoning, from a backend that
            streams it separately (`delta.reasoning_content` on
            llama.cpp, `delta.reasoning` on vLLM). Never sent when this
            driver's `thinkingMode` is `off`.
        toolCalls:
          type: array
          items:
            $ref: '#/components/schemas/ToolCallDelta'
          description: |
            Fragments of one or more tool calls, accumulated by `index`.
        audio:
          $ref: '#/components/schemas/AudioDelta'
        logprobs:
          $ref: 'components/common.yaml#/components/schemas/ChatLogprobs'
        annotations:
          type: array
          items:
            $ref: 'components/common.yaml#/components/schemas/ChatAnnotation'

    ModerateRequest:
      type: object
      additionalProperties: false
      description: Exactly one of `texts` and `parts`.
      properties:
        model:
          $ref: '#/components/schemas/RequestModel'
        localOnly:
          type: boolean
          default: false
          description: |
            As `GenerateRequest.localOnly`: refuse before sending anything
            unless the active engine is classified local.
        texts:
          type: array
          minItems: 1
          maxItems: 2048
          items:
            type: string
            maxLength: 1000000
          description: Texts moderated one by one, with one result each.
        parts:
          type: array
          minItems: 1
          maxItems: 32
          items:
            $ref: '#/components/schemas/ModerationPart'
          description: One input of text and an image, with one result.
        requestId:
          type: string
          format: uuid

    ModerationPart:
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          $ref: '#/components/schemas/ModerationPartType'
        text:
          type: string
          maxLength: 1000000
        image:
          type: string
          maxLength: 16000000
          description: 'For `image`: a `data:` URL, as `image_url.url` carries it.'

    ModerationPartType:
      type: string
      enum: [text, image]
      description: Named, so a later inline enum cannot renumber it.

    ModerateResponse:
      type: object
      additionalProperties: false
      required: [results]
      properties:
        id:
          type: string
          description: The backend's id for this moderation.
        results:
          type: array
          items:
            type: object
            additionalProperties: true
          description: |
            One per input, as the backend sent them: `flagged`,
            `categories`, `category_scores` and
            `category_applied_input_types`.
        modelId:
          type: string
          description: The model the backend says answered.
        latencyMs:
          type: integer

    SpeakRequest:
      type: object
      additionalProperties: false
      required: [input, voice]
      properties:
        model:
          $ref: '#/components/schemas/RequestModel'
        localOnly:
          type: boolean
          default: false
          description: |
            As `GenerateRequest.localOnly`: refuse before forwarding any text
            unless the active engine is classified local.
        input:
          type: string
          minLength: 1
          maxLength: 4096
          description: The text to speak. OpenAI's limit, 4,096 characters.
        voice:
          type: string
          minLength: 1
          maxLength: 128
          description: |
            The backend's own voice id, passed through (P3-3): `alloy` on
            OpenAI, `af_heart` on Kokoro, `21m00Tcm4TlvDq8ikWAM` on
            ElevenLabs. `DriverModel.voices` lists them where the backend
            says.
        format:
          $ref: 'components/common.yaml#/components/schemas/SpeechFormat'
        speed:
          type: number
          minimum: 0.25
          maximum: 4.0
          description: |
            1.0 is normal. ElevenLabs takes 0.7 to 1.2 and refuses the rest;
            the refusal is relayed.
        instructions:
          type: string
          maxLength: 4096
          description: |
            How to speak, for a backend that takes it (OpenAI's
            `gpt-4o-mini-tts`). Refused with 400 by one that cannot
            (ElevenLabs), never dropped.
        requestId:
          type: string
          format: uuid

    TranscribeRequest:
      type: object
      additionalProperties: false
      required: [audio]
      properties:
        model:
          $ref: '#/components/schemas/RequestModel'
        localOnly:
          type: boolean
          default: false
          description: |
            As `GenerateRequest.localOnly`: refuse before forwarding any
            audio unless the active engine is classified local.
        audio:
          $ref: '#/components/schemas/TranscribeAudio'
        language:
          type: string
          minLength: 2
          maxLength: 16
          description: The spoken language, ISO-639-1 (`en`), when the caller knows it.
        prompt:
          type: string
          maxLength: 8192
          description: Text to guide the transcript's style or spelling, as OpenAI's.
        temperature:
          type: number
          minimum: 0
          maximum: 1
        verbose:
          type: boolean
          default: false
          description: |
            Ask for `language`, `duration` and segments as well as the text:
            OpenAI's `verbose_json`. A backend that cannot make it refuses,
            and the refusal is relayed.
        timestampGranularities:
          type: array
          maxItems: 2
          items:
            $ref: '#/components/schemas/TimestampGranularity'
          description: With `verbose` only, as OpenAI requires.
        translate:
          type: boolean
          default: false
          description: |
            The text in English, whatever was spoken: OpenAI's
            `/v1/audio/translations` (P3-4). Only a model with the
            `translation` surface is asked. Refused with `language` or
            `timestampGranularities`, which that door does not take.
        requestId:
          type: string
          format: uuid

    TimestampGranularity:
      type: string
      enum: [word, segment]
      description: Named, so a later inline enum cannot renumber it.

    TranscribeAudio:
      type: object
      additionalProperties: false
      required: [data, filename]
      properties:
        data:
          type: string
          minLength: 1
          maxLength: 35000000
          description: The file's bytes, base64, no `data:` prefix. At most 25 MiB decoded.
        filename:
          type: string
          minLength: 1
          maxLength: 255
          description: |
            The name the caller uploaded it under. Backends read the format
            from its extension as often as from its bytes, so it is sent on.
        mediaType:
          type: string
          maxLength: 128
          description: The upload's `Content-Type`, when the caller sent one.

    TranscribeResponse:
      type: object
      additionalProperties: false
      required: [text]
      properties:
        text:
          type: string
        language:
          type: string
          description: The spoken language, as the backend names it.
        duration:
          type: number
          description: The audio's length in seconds, when the backend says.
        segments:
          type: array
          items:
            type: object
            additionalProperties: true
          description: '`verbose` only: the backend''s segments, as it sent them.'
        words:
          type: array
          items:
            type: object
            additionalProperties: true
          description: '`verbose` with word timestamps: the backend''s words, as it sent them.'
        usage:
          $ref: '#/components/schemas/TranscriptionUsage'
        modelId:
          type: string
          description: The model the backend says answered.
        latencyMs:
          type: integer

    TranscriptionUsage:
      type: object
      additionalProperties: false
      description: |
        What the backend counted, in its own unit (measured 2026-09-28):
        seconds of audio for Whisper, tokens for `gpt-4o-mini-transcribe`
        and `llama-server`.
      properties:
        seconds:
          type: number
        inputTokens:
          type: integer
        outputTokens:
          type: integer
        totalTokens:
          type: integer

    ImageRequest:
      type: object
      additionalProperties: false
      required: [prompt]
      description: |
        One request for images (P4). Settings are strings here: the gateway
        has already checked them against OpenAI's values and routed them to
        a model whose listing takes them (A2); this driver carries them.
      properties:
        model:
          $ref: '#/components/schemas/RequestModel'
        localOnly:
          type: boolean
          default: false
          description: |
            As `GenerateRequest.localOnly`: refuse before forwarding the
            prompt or any image unless the active engine is classified local.
        prompt:
          type: string
          minLength: 1
          maxLength: 32000
          description: OpenAI's limit for its GPT image models.
        n:
          type: integer
          minimum: 1
          maximum: 10
        size:
          type: string
          maxLength: 32
          description: |
            `WIDTHxHEIGHT` or `auto`, carried as sent. No OpenRouter model
            lists it and OpenRouter translates it (measured).
        quality:
          type: string
          maxLength: 16
        background:
          type: string
          maxLength: 16
        outputFormat:
          type: string
          maxLength: 8
          description: |
            Carried where the model's listing does not name it, because
            gpt-image-1-mini honours it unlisted (measured). The answer's
            `mediaType` says what the image is.
        outputCompression:
          type: integer
          minimum: 0
          maximum: 100
        moderation:
          type: string
          maxLength: 16
        style:
          type: string
          maxLength: 16
        user:
          type: string
          maxLength: 256
        inputFidelity:
          type: string
          maxLength: 8
        references:
          type: array
          maxItems: 16
          items:
            $ref: '#/components/schemas/ImageData'
          description: |
            The images to edit. Present makes this an edit; at most 25 MiB
            decoded across these and `mask`.
        mask:
          $ref: '#/components/schemas/ImageData'
        partialImages:
          type: integer
          minimum: 0
          maximum: 3
          description: For `/v1/image/stream`, how many partial renders to ask for.
        requestId:
          type: string
          format: uuid

    ImageData:
      type: object
      additionalProperties: false
      required: [data, mediaType]
      properties:
        data:
          type: string
          minLength: 1
          maxLength: 35000000
          description: The image's bytes, base64, no `data:` prefix.
        mediaType:
          type: string
          maxLength: 64
          description: |
            Read from the bytes by the gateway (`image/png`, `image/jpeg`,
            `image/webp`, `image/gif`), never from an upload's part header:
            the OpenAI SDK labels a `BytesIO` `application/octet-stream`
            (measured).

    ImageResponse:
      type: object
      additionalProperties: false
      required: [images]
      properties:
        images:
          type: array
          items:
            $ref: '#/components/schemas/GeneratedImage'
        created:
          type: integer
          description: |
            The backend's own timestamp, when it gave a real one. Absent
            where it sent 0 (flux and gemini on OpenRouter, measured).
        size:
          type: string
          description: The backend's report of the size, when it gave one.
        quality:
          type: string
        background:
          type: string
        usage:
          $ref: '#/components/schemas/ImageUsage'
        modelId:
          type: string
          description: The model the backend says answered.
        latencyMs:
          type: integer

    GeneratedImage:
      type: object
      additionalProperties: false
      required: [data, mediaType]
      properties:
        data:
          type: string
          description: Base64, no `data:` prefix.
        mediaType:
          type: string
          description: |
            What the bytes are, read from them (`image/png`, `image/jpeg`,
            `image/webp`, `image/svg+xml`), whatever format was asked for.
        revisedPrompt:
          type: string
          description: The prompt the backend actually used, where it says (`dall-e-3`).

    ImagePartial:
      type: object
      additionalProperties: false
      required: [image, index]
      properties:
        image:
          $ref: '#/components/schemas/GeneratedImage'
        index:
          type: integer
          minimum: 0
          description: 0-based, as OpenAI's `partial_image_index`.

    ImageUsage:
      type: object
      additionalProperties: false
      description: |
        What the backend counted. OpenAI counts `input_tokens` and
        `output_tokens`; OpenRouter counts chat-style `prompt_tokens` and
        `completion_tokens`, which are the same quantities under their chat
        names, plus a `cost`.
      properties:
        inputTokens:
          type: integer
        outputTokens:
          type: integer
        totalTokens:
          type: integer
        cost:
          type: number
          description: The provider's charge in US dollars, where it says (OpenRouter).

    VideoRequest:
      type: object
      additionalProperties: false
      required: [prompt]
      description: |
        One video job (P5). `seconds` and `size` are the gateway's, already
        routed to a model whose listing takes them (A2).
      properties:
        model:
          $ref: '#/components/schemas/RequestModel'
        localOnly:
          type: boolean
          default: false
          description: As `GenerateRequest.localOnly`.
        prompt:
          type: string
          minLength: 1
          maxLength: 32000
        seconds:
          type: integer
          minimum: 1
          maximum: 120
          description: Sent as OpenRouter's `duration`.
        size:
          type: string
          maxLength: 32
          description: '`WIDTHxHEIGHT`, one the model lists.'
        firstFrame:
          $ref: '#/components/schemas/ImageData'
        requestId:
          type: string
          format: uuid

    VideoJobStatus:
      type: string
      enum: [queued, in_progress, completed, failed]
      description: OpenAI's words. OpenRouter's `pending` is `queued`.

    VideoJob:
      type: object
      additionalProperties: false
      required: [jobId, status]
      properties:
        jobId:
          type: string
          description: The backend's own job id.
        status:
          $ref: '#/components/schemas/VideoJobStatus'
        progress:
          type: integer
          minimum: 0
          maximum: 100
          description: Where the backend says; OpenRouter does not (measured).
        error:
          type: string
          description: A failed job's reason, in the backend's words.
        cost:
          type: number
          description: The provider's charge in US dollars, once it says.
        modelId:
          type: string

    AudioOutputRequest:
      type: object
      additionalProperties: false
      required: [voice, format]
      description: |
        Answer with audio as well as text (P2b, 2026-09-28): the chat
        door's `modalities` including `audio`, with its `audio` object.
        Sent only to a model whose capabilities say `audioOutput`; any
        other is refused with 400 before anything is forwarded.

        **Upstream it is always a stream of `pcm16`**, whichever door
        asked: every audio-output model behind an account answers audio
        only that way (measured 2026-09-28). `POST /v1/generate`
        assembles the stream into one `GeneratedAudio`; asked for `wav`,
        it adds the header. It refuses any other `format` with 400,
        naming `wav` and `pcm16`. `POST /v1/generate/stream` carries
        `pcm16` only and refuses the rest the same way, as OpenAI itself
        does.
      properties:
        voice:
          type: string
          minLength: 1
          maxLength: 64
          description: |
            The voice, in the provider's own names (`alloy`, `coral`,
            ...). Passed through; a model with no voices (Lyria)
            ignores it.
        format:
          $ref: 'components/common.yaml#/components/schemas/AudioOutputFormat'

    GeneratedAudio:
      type: object
      required: [data, format]
      description: |
        The audio of a `POST /v1/generate` answer, assembled from the
        stream the backend sent.
      properties:
        data:
          type: string
          description: The whole answer's audio, base64-encoded.
        format:
          $ref: 'components/common.yaml#/components/schemas/AudioOutputFormat'
          description: |
            What `data` is, read from its bytes: `mp3` for an ID3 tag or
            frame sync, `wav` for a RIFF/WAVE header (including one this
            driver added), `pcm16` for headerless samples. **Not what
            was asked** when the backend sent something else: Lyria's
            MP3 is `mp3` (P2-2).
        id:
          type: string
          description: The backend's id for the audio, when it gives one.
        transcript:
          type: string
          description: |
            What the audio says, when the backend reports it. A speech
            model's spoken answer is here, not in `content`.
        expiresAt:
          type: integer
          description: |
            Unix seconds after which the backend forgets the audio, when
            it says. Nothing here stores it; see the chat door.

    AudioDelta:
      type: object
      description: |
        A fragment of the answer's audio on the stream. `data` fragments
        concatenate, after base64 decoding each one, into the whole
        answer. `id`, `format` and `expiresAt` arrive once; `transcript`
        arrives in fragments, like `text`.
      properties:
        data:
          type: string
          description: A fragment of the audio, base64-encoded on its own.
        format:
          $ref: 'components/common.yaml#/components/schemas/AudioOutputFormat'
          description: |
            On the first fragment carrying `data`: what the bytes are,
            read from them (`pcm16`, or Lyria's `mp3`).
        id:
          type: string
        transcript:
          type: string
        expiresAt:
          type: integer

    StreamProgress:
      type: object
      required:
        - stage
      description: |
        One `event: progress` payload: what the backend is doing while
        it is not producing output. Each backend reports what it can
        observe and nothing it has to guess:

        - **llama.cpp**: `prompt`, from its own `prompt_progress`
          (`return_progress: true`), one frame per batch it reads.
        - **Any HTTP backend, a hosted API included**: `working` when
          the response opens (the service has the request), and again
          at an SSE keepalive comment (OpenRouter's `: OPENROUTER
          PROCESSING`), at most every two seconds.
        - **Claude Code**: `working` when the CLI starts and when it
          sends the request; `tool` when the agent starts one of its own
          tools. Its thinking is `reasoning` output, not progress.
        - **Codex**: `working` at `turn.started`; `tool` when an item
          that runs something starts.

        **Why it exists (2026-09-27).** Before the first token a stream
        said nothing at all: measured on llama.cpp b11215 with a 7,795
        token prompt on the processor, 35 s passed with no frame, then
        the answer began. A person watching that reads a dead request,
        and one did. A cloud agent is the same shape from the other end:
        Claude Code can run tools for a minute before it writes a word.
      properties:
        stage:
          type: string
          enum: [prompt, working, tool]
          description: |
            `prompt`: reading the prompt, with the token counts below.
            `working`: the backend says it is working and not how far.
            `tool`: an agent backend is running one of its own tools,
            named in `tool`.
        tool:
          type: string
          description: |
            On `tool`: the tool's name as the backend gives it (`Read`,
            `Bash`, `command`). Its arguments are not carried.
        promptTokens:
          type: integer
          minimum: 0
          description: Tokens in the whole prompt, as the backend counted them.
        cachedTokens:
          type: integer
          minimum: 0
          description: |
            Of those, the tokens reused from the backend's cache and so
            not read again. A follow-up turn in a conversation is mostly
            cache.
        processedTokens:
          type: integer
          minimum: 0
          description: |
            Read so far, the cached ones included, so it starts at
            `cachedTokens` and ends at `promptTokens`.
        elapsedMs:
          type: integer
          minimum: 0
          description: Time the backend has spent reading this prompt so far.

    Tool:
      type: object
      required:
        - type
        - function
      properties:
        type:
          type: string
          const: function
        function:
          $ref: '#/components/schemas/FunctionDefinition'

    FunctionDefinition:
      type: object
      required:
        - name
      properties:
        name:
          type: string
        description:
          type: string
        parameters:
          type: object
          additionalProperties: true
          description: A JSON Schema object, passed through verbatim.
        strict:
          type:
            - boolean
            - 'null'

    NamedToolChoice:
      type: object
      required:
        - type
        - function
      properties:
        type:
          type: string
          const: function
        function:
          type: object
          required:
            - name
          properties:
            name:
              type: string

    ToolCall:
      type: object
      required:
        - id
        - type
        - function
      properties:
        id:
          type: string
        type:
          type: string
          const: function
        function:
          $ref: '#/components/schemas/FunctionCall'

    FunctionCall:
      type: object
      required:
        - name
        - arguments
      properties:
        name:
          type: string
        arguments:
          type: string
          description: |
            Arguments as a JSON **string**, not an object — a model can
            emit invalid JSON and the string preserves what it actually
            said. Not parsed here.

    ToolCallDelta:
      type: object
      required:
        - index
      properties:
        index:
          type: integer
        id:
          type: string
        type:
          type: string
          const: function
        function:
          type: object
          properties:
            name:
              type: string
            arguments:
              type: string

    ResponseFormat:
      type: object
      required:
        - type
      properties:
        type:
          type: string
          enum:
            - text
            - json_object
            - json_schema
        json_schema:
          $ref: '#/components/schemas/ResponseJsonSchema'

    ResponseJsonSchema:
      type: object
      required:
        - name
        - schema
      properties:
        name:
          type: string
        description:
          type: string
        schema:
          type: object
          additionalProperties: true
        strict:
          type:
            - boolean
            - 'null'

    Usage:
      type: object
      description: Token accounting. Some backends (CLI subprocess) may report nulls.
      properties:
        promptTokens:
          type: integer
          minimum: 0
        completionTokens:
          type: integer
          minimum: 0
        totalTokens:
          type: integer
          minimum: 0
        cachedPromptTokens:
          type: integer
          minimum: 0
          description: |
            How many of `promptTokens` the backend served from its
            prompt cache rather than computing. Reported by llama.cpp
            and vLLM as `usage.prompt_tokens_details.cached_tokens`;
            absent when the backend says nothing, never guessed.
        reasoningTokens:
          type: integer
          minimum: 0
          description: |
            How many of `completionTokens` were reasoning. vLLM reports
            it (`completion_tokens_details.reasoning_tokens`) when its
            reasoning parser is on; llama.cpp b10948 does not, and a
            count this driver made up from characters would be a
            tokenizer it does not have. Absent means unknown, not zero.

    EmbedRequest:
      type: object
      description: |
        Text to embed. Batched because every backend that does this
        accepts a batch, and a per-item round trip would multiply the
        control plane's own overhead by the size of a document set.
      required:
        - input
      properties:
        model:
          $ref: '#/components/schemas/RequestModel'
        localOnly:
          type: boolean
          default: false
          description: Internal policy; require a local active engine before forwarding any input.
        input:
          type: array
          minItems: 1
          items:
            type: string
          description: |
            One entry per vector to produce. Order is preserved: the
            n-th vector in the response is the n-th input, which is the
            only thing that lets a caller match them up, since an
            embedding carries no identity of its own.
        requestId:
          type: string
          description: Correlation id, echoed back. Same role as on `GenerateRequest`.

    EmbedResponse:
      type: object
      required:
        - embeddings
      properties:
        embeddings:
          type: array
          items:
            type: array
            items:
              type: number
          description: |
            One vector per input, in the order the inputs arrived.
            Floats, always — see the operation description for why this
            surface does not carry base64.
        modelId:
          type: string
          description: |
            The model that produced these vectors, as the **public**
            identifier — normalized the same way `GenerateResponse`'s
            is when `upstreamModelId` is in play. **Load-bearing beyond
            attribution:** vectors from two models are not comparable,
            so a caller storing them needs to know which model's space
            they belong to — and the public id is the only name that
            stays stable across replicas of one model on several nodes.
        backend:
          $ref: 'components/common.yaml#/components/schemas/BackendKind'
        usage:
          $ref: '#/components/schemas/Usage'
        latencyMs:
          type: integer
          minimum: 0
        requestId:
          type: string

    DecisionRequest:
      type: object
      description: |
        One state, several named typed questions, answered together.
        Question names are the caller's own keys and come back verbatim
        on the response's `answers`. Question independence is the
        protocol's promise: each question is answered against the state
        alone, not against the other questions' answers.
      required:
        - state
        - questions
      properties:
        model:
          $ref: '#/components/schemas/RequestModel'
        state:
          description: |
            What is being judged — plain text, or structured data (an
            object or array such as a ticket record or a chat log)
            passed through without re-serialization by the caller.
          oneOf:
            - type: string
            - type: object
              additionalProperties: true
            - type: array
              items: {}
        questions:
          type: object
          minProperties: 1
          additionalProperties:
            $ref: '#/components/schemas/DecisionQuestion'
          description: Caller-named questions; at least one.
        localOnly:
          type: boolean
          default: false
          description: |
            Internal policy; require a local active engine before
            forwarding any state, exactly as on `GenerateRequest`.
        requestId:
          type: string
          description: Correlation id, echoed back.

    DecisionQuestion:
      type: object
      description: |
        One typed question, in the pinned System One vocabulary. The
        shape of `criteria` depends on `type` and is validated in code
        against the pinned protocol: for `noul` an optional object
        mapping `"true"` and `"false"` to outcome descriptions; for
        `choice` a required map of 1-255 option names to rubric text or
        null; for `score` a required array of 2-10 ordered level
        descriptions, lowest first. **Fields beyond these are refused,
        never dropped** — a knob the protocol does not define, silently
        removed, would answer a different question than the caller
        asked.
      required:
        - type
        - instructions
      properties:
        type:
          type: string
          enum: [noul, choice, score]
        instructions:
          description: |
            What to decide — a string, or structured content the
            provider accepts.
          oneOf:
            - type: string
            - type: object
              additionalProperties: true
            - type: array
              items: {}
        criteria:
          description: Shape depends on `type`; see above.

    DecisionAnswer:
      type: object
      description: |
        One validated answer. `type` echoes the question's kind and
        exactly the matching fields are present — the driver has already
        refused a backend that answered otherwise, so a caller can
        switch on `type` without defending against a half-shaped answer.
      required:
        - type
      properties:
        type:
          type: string
          enum: [noul, choice, score]
        noul:
          type: number
          minimum: 0
          maximum: 1
          description: '`noul` only: the probability the answer is yes.'
        choice:
          type: string
          description: '`choice` only: the highest-probability option name.'
        score:
          type: number
          description: |
            `score` only: the probability-weighted value across the
            ordered levels, 0-indexed against `legend`.
        legend:
          type: object
          additionalProperties:
            type: string
          description: '`score` only: level indices to their descriptions.'
        probabilities:
          type: object
          additionalProperties:
            type: number
          description: |
            `choice` and `score`: the full distribution, validated to be
            over the legal options/levels with finite values.
        confidence:
          type: number
          minimum: 0
          maximum: 1
          description: |
            `choice` and `score`: the provider's certainty, preserved as
            reported. Provider-specific calibration — never comparable
            across models, and never manufactured by the driver when the
            provider omits it.

    DecisionResponse:
      type: object
      required:
        - answers
      properties:
        answers:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/DecisionAnswer'
          description: One validated answer per request question, same keys.
        modelId:
          type: string
          description: |
            The public model identifier, normalized exactly as
            `GenerateResponse.modelId` is — a backend's own name for
            itself is never echoed by a translating driver.
        reportedModel:
          type: string
          description: |
            What the backend said served this request, verbatim —
            provenance for calibration (`jev-1.13.0`, a Kev checkpoint
            id), preserved without becoming anyone's routing key.
        backend:
          $ref: 'components/common.yaml#/components/schemas/BackendKind'
        usage:
          $ref: '#/components/schemas/Usage'
        latencyMs:
          type: integer
          minimum: 0
        requestId:
          type: string

    DecisionCapability:
      type: object
      description: |
        Present on a model's `capabilities` iff it serves
        `POST /v1/decide`. Its absence is how the gateway knows not to
        route decisions there; a `surfaces` of `[decisions]` alone is how
        a decision-only backend refuses chat with a reason.
      required:
        - kinds
      properties:
        kinds:
          type: array
          items:
            type: string
            enum: [noul, choice, score]
          description: Question kinds the backend supports.
        maxQuestions:
          type: integer
          minimum: 1
          description: Per-request question ceiling. Absent means unknown.
        maxOptions:
          type: integer
          minimum: 1
          description: |
            Choice option ceiling. The protocol's own ceiling is 255;
            a backend may be lower.
        maxConcurrent:
          type: integer
          minimum: 1
          description: |
            How many requests the backend can hold at once. **Kev's
            server handles exactly one** (a lock, no cross-caller
            batching — read off `kev/serve.py` at the pinned commit), so
            its driver reports 1 and the layers above must not
            over-admit: a non-cancellable engine that is over-admitted
            holds capacity nobody can free.

    RequestModel:
      type: string
      minLength: 1
      description: |
        Which of this driver's models the request is for: an `id` from
        `DriverInfo.models`, **unprefixed** — the gateway strips the
        `<driver name>/` it added. Optional so a caller from before P1
        still works against a single-model driver, which serves its one
        model when this is absent. An account driver refuses a request
        without it (400, `#model-required`), and every driver refuses a
        model it does not list (404, `#model-not-served`) before calling
        its backend.

    DriverModel:
      type: object
      description: |
        One model a driver serves, with what that model can do.
        Everything the gateway used to read off the driver as a whole
        now sits here per model, because an account's six hundred
        models do not share one answer.
      required:
        - id
        - surfaces
      properties:
        id:
          type: string
          minLength: 1
          description: |
            What a request names in `model`. A single-model driver's is
            the public id; an account's is the backend's own id, which
            the gateway prefixes. May contain `/`, `:` and `~`
            (`anthropic/claude-opus-5.5`, `qwen3:8b`,
            `~openai/gpt-sol-latest`).
        name:
          type: string
          description: The backend's display name for the model, when it gives one.
        upstreamId:
          type: string
          description: |
            What this driver actually sends to its backend, when that
            differs from `id`. Exists because some backends' served name
            is not ours to choose: `mlx_lm.server` answers only to
            upstream's `default_model` sentinel or to the model's
            absolute path — the first collides across every MLX runtime
            in an install and the second publishes the operator's
            directory layout — so the supervised runtime's companion
            driver advertises the public alias as `id` and translates to
            the sentinel at the backend boundary, nowhere else.

            Diagnostic, never a routing key: the gateway routes and
            authorizes on `id` alone, and this value must not appear in
            any public model list. Absent means the same as `id`.
            Responses report `id` (`GenerateResponse`, `EmbedResponse`
            and `DecisionResponse` `modelId`), so two runtimes serving
            different models behind one upstream sentinel stay
            distinguishable everywhere a caller looks — and so does an
            account's alias, which the backend answers under its
            target's id (`~z-ai/glm-flash-latest` answers as
            `z-ai/glm-5.3-flash`, measured 2026-09-27).
        surfaces:
          type: array
          items:
            type: string
          description: |
            Which requests this model answers. The values so far:

            * `chat` (`/v1/generate`), `embeddings` (`/v1/embed`),
              `decisions` (`/v1/decide`), `speech` (`/v1/speak`, P3a),
              `transcription` (`/v1/transcribe`, P3b), `translation`
              (`/v1/transcribe` with `translate`, P3-4), `image`
              (`/v1/image`, P4), `video` (`/v1/video`, P5),
              `moderation` (`/v1/moderate`, P6) and `completion`
              (`/v1/generate` with `completion`, P6), which have doors;
            * `rerank`, which names a door Eugene has not built yet.

            `completion` is reported for a local `llama-server`, a vLLM,
            and an Ollama account's models with its `completion`
            capability: engines that continue raw text (P6-4). An account
            over a hosted API does not report it: OpenRouter's completions
            answer the prompt as a chat turn (measured).

            An OpenRouter model whose output is image and text (Gemini's
            image models) serves `image` beside `chat`: its images route
            answers them too (measured).

            A single-model `llama-server` whose projector hears
            (`/props` `modalities.audio`) serves `transcription` beside
            `chat`: its `/v1/audio/transcriptions` answers only then
            (measured).

            OpenAI's `whisper-*` models serve `translation` beside
            `transcription`; nothing else here translates (measured).
            ElevenLabs' `scribe_*` models serve `transcription`, listed
            only while the key may use speech-to-text (P3-1, as P3-2
            requires `models_read` for its speech models).

            A driver reports those anyway, so a model's id does not
            change on the day its door arrives, and the gateway lists a
            model on `GET /v1/models` only once a door serves one of its
            surfaces (P1-4).

            **Strings, not an enum, on purpose.** A newer driver
            reporting a surface an older gateway has never heard of must
            not fail that gateway's validation of the whole `/v1/info`,
            which would make every model on the driver unreachable over
            one unknown word. A reader ignores a surface it does not
            know. Empty only for a model whose kind neither the backend
            nor the driver could decide, which serves nothing.

            **Replaces `capabilities.embeddings` and
            `capabilities.chatCapable`**, which said the same thing once
            for the whole driver. Where they came from still holds for a
            single-model driver: `embeddings` is **a property of the
            running backend, not of the model**, and not readable from
            anything (`llama-server`'s `/props` carries no pooling
            field, and an Ollama runner started for chat refuses with
            *"This server does not support embeddings"*), so it is
            determined by trying once and cached for the driver's
            lifetime. A System One backend serves `decisions` alone. An
            account takes each model's surfaces from its catalogue.
        inputModalities:
          type: array
          items:
            type: string
          description: |
            What the model takes in, in the spelling of OpenRouter's
            `architecture.input_modalities` (`text`, `image`, `file`,
            `audio`, `video`), when the backend says. Absent means
            unknown. Strings for the reason `surfaces` gives.
        outputModalities:
          type: array
          items:
            type: string
          description: |
            What the model gives back, in OpenRouter's spelling of
            `output_modalities` (`text`, `image`, `audio`, `video`,
            `speech`, `transcription`, `embeddings`, `rerank`,
            `decisions`), when the backend says. Absent means unknown.
        voices:
          type: array
          items:
            type: string
          description: |
            The voices a speech model offers, when the backend lists
            them (OpenRouter's `supported_voices`). For P3's
            `/v1/audio/speech`; reported now so nothing changes shape
            later.
        voiceNames:
          type: object
          additionalProperties:
            type: string
          description: |
            A display name for each voice in `voices` that the backend
            names, keyed by the voice's id (ElevenLabs' `name` from
            `GET /v1/voices`: `21m00Tcm4TlvDq8ikWAM` is *Rachel*). The id
            is still what a request sends; a voice with no name here is
            shown by its id. Absent when the backend names none. Added
            2026-10-08 (Workbench media screens: ElevenLabs voices showed
            as ids).
        capabilities:
          $ref: '#/components/schemas/Capabilities'

    DriverCatalogue:
      type: object
      description: |
        Present only on a **provider account**, and its presence is what
        makes the gateway prefix this driver's model ids. Says where the
        list came from and whether the last read of it worked, because a
        list that silently stopped refreshing looks exactly like one
        that did.
      required:
        - source
        - total
        - exposed
      properties:
        source:
          type: string
          description: |
            Which listing was read: `openrouter` (`/models/user` with
            every output modality — the account's own list, not the
            public one), `ollama` (`/api/tags` plus `/api/show`),
            `lmstudio` (`/api/v0/models`), or `openai` (the OpenAI
            `/v1/models` shape, which says nothing per model).
        total:
          type: integer
          minimum: 0
          description: How many models the last good read listed, before include/exclude.
        exposed:
          type: integer
          minimum: 0
          description: How many of those the patterns kept, which is the length of `models`.
        include:
          type: array
          items:
            type: string
          description: |
            The driver's `catalogueInclude` patterns: a model is kept when
            its id matches one. `*` is the only wildcard and matches any
            run of characters, `/` included. Default `["*"]`: an
            aggregator exposes everything (call #2).
        exclude:
          type: array
          items:
            type: string
          description: The `catalogueExclude` patterns, applied after `include`.
        refreshedAt:
          type:
            - string
            - 'null'
          format: date-time
          description: |
            When the list in force was read. Null when no read has ever
            worked. It survives a restart: the last good list is kept on
            disk beside the driver's config, so an upstream that is down
            at boot still leaves its models routable.
        refreshSeconds:
          type: integer
          minimum: 60
          description: How often the list is read again (`catalogueRefreshMinutes`).
        error:
          type:
            - string
            - 'null'
          description: |
            Why the most recent read failed, in the backend's own words
            where it gave any (*"missing the permission models_read"* is
            not *"invalid key"*). Null after a read that worked. A
            failed read never empties the list: the previous one stays
            in force (R2.1's rule).

    CompletionPrompt:
      type: object
      additionalProperties: false
      required: [prompt]
      description: |
        P6: a raw text continuation instead of a conversation, OpenAI's
        legacy `/v1/completions`. With it `messages` is empty and **no chat
        template is applied**: the backend continues `prompt` as written,
        special tokens parsed, so a client-rendered fill-in-the-middle
        prompt works (measured on `llama-server` b11235). Only a model with
        the `completion` surface is asked, and each engine is asked the way
        it continues raw text: `llama-server` and vLLM at `/v1/completions`,
        Ollama at `/api/generate` with `raw` (its `/v1/completions` wraps a
        prompt in the chat template, read in its source).

        **`suffix` asks for fill-in-the-middle** and only a model whose
        `Capabilities.fillInMiddle` is true is asked. `llama-server`'s
        `/v1/completions` ignores a suffix (measured), so it is sent to
        `/infill` instead; Ollama takes it on `/api/generate` for a model
        with its `insert` capability; vLLM refuses one for every model but
        DeepSeek V4, so it is never sent there.
      properties:
        prompt:
          type: string
          maxLength: 4000000
        suffix:
          type: string
          maxLength: 4000000
          description: The text after the cursor, for fill-in-the-middle.

    Capabilities:
      type: object
      description: |
        What one model can do behind this driver, which the gateway keys
        off when routing. Was one object for the whole driver until P1;
        each `DriverModel` carries its own now. For a backend whose
        listing says nothing per model, each model inherits the answer
        the driver would give for itself (P1-3).
      properties:
        supportedSettings:
          type: array
          items:
            type: string
          description: |
            Explicit callerSettings this active adapter can carry without
            dropping them. This does not promise the provider accepts every
            possible value. Absent means unknown; ineligible for requests
            requiring explicit settings. The driver still validates before
            execution, including after a configuration change.
        streaming:
          type: boolean
          description: Whether `/v1/generate/stream` emits true incremental tokens.
        fillInMiddle:
          type: boolean
          description: |
            P6: whether a `completion` with a `suffix` is filled in the
            middle by this model: `llama-server` answering `/infill` (the
            model carries fill-in-the-middle tokens), or an Ollama model
            with the `insert` capability. Unknown is false.
        imageInput:
          type: boolean
          description: |
            Whether the loaded model is confirmed to accept inline PNG/JPEG
            images. Unknown or unverified backends report false. Rechecked
            before image generation; never inferred from the provider name.
        audioInput:
          type: boolean
          description: |
            Whether the model is confirmed to hear an `input_audio` part
            (WAV or MP3). The same rule as `imageInput`: unknown reports
            false, and the gateway routes a request carrying audio only
            to a model that says true. From the account's listing
            (`audio` in OpenRouter's `input_modalities`) or, for
            `llama-server`, its `/props` `modalities.audio`.

            **Added 2026-09-28 (P2).** Without it a text-only model is
            sent the audio: measured, OpenRouter answers *"No endpoints
            found that support input audio"*, and a backend that drops
            the part answers a question the caller did not ask.
        fileInput:
          type: boolean
          description: |
            Whether the model is confirmed to read a `file` part (PDF).
            The same rule as `audioInput`. From `file` in the account's
            `input_modalities`; no local engine reads one today, so a
            single-model driver reports false.
        speechFormats:
          type: array
          items:
            $ref: 'components/common.yaml#/components/schemas/SpeechFormat'
          description: |
            For a `speech` model: the formats this driver can give it in,
            `wav` included where it is made from `pcm` (P3a).
        audioOutput:
          type: boolean
          description: |
            Whether the model is confirmed to answer with audio
            (`GenerateRequest.audioOutput`). From `audio` in the
            account's `output_modalities`; no local engine or CLI speaks,
            so they report false. Unknown is false, as for the inputs.

            **Not from `supported_parameters`** (A2's setting list): no
            audio-output model on OpenRouter lists `modalities` or
            `audio` there (measured 2026-09-28), so routing by it would
            route nothing. Added 2026-09-28 (P2b).
        toolCalling:
          type: boolean
          description: |
            Whether this driver can carry `tools` to its backend and
            report `toolCalls` back.

            The gateway reads it to answer a question a harness
            cannot otherwise ask: a plain answer where a tool call
            was expected looks identical whether the model declined
            or the backend never saw the tools. A driver that says
            `false` here is failed at the front door with a reason
            instead.
        maxContextTokens:
          type: integer
          minimum: 0
          description: |
            The context window the backend **resolved**, read back
            from the backend itself — not the model's trained
            maximum, and never an estimate.

            Null means unknown, and unknown is a real answer: a
            hosted provider exposes nothing to read, and a CLI
            subscription has no window of its own to report. The
            gateway's `_smallest_context` folds this together with
            the window a supervised runtime reports and publishes
            the smallest as `x_eugene_plexus.context_length` on
            `GET /v1/models`, so a harness can size a prompt
            against the number that will actually apply.

            **Populated by a probe of the backend, which is why it
            exists at all.** A supervised runtime already tells the
            agent its window; this field is for the backend nobody
            supervises — an Ollama or an LM Studio the operator
            points us at — which until now reported no window
            anywhere. Contracted since M0 and populated by nothing
            until then, exactly as `streaming` was until M10.

            **Advertising, not enforcement.** Nothing here counts a
            prompt: the window is published so a caller can respect
            it, and a caller that does not is refused by the engine
            itself, whose count is exact. A backend that truncates
            silently instead of refusing is caught after the fact —
            see `x_eugene_plexus.prompt_truncated` in
            `gateway.yaml`.
        decision:
          $ref: '#/components/schemas/DecisionCapability'
        image:
          $ref: '#/components/schemas/ImageCapabilities'
        video:
          $ref: '#/components/schemas/VideoCapabilities'

    VideoCapabilities:
      type: object
      additionalProperties: false
      description: |
        For a `video` model (P5): what OpenRouter's `GET /videos/models`
        lists, which the gateway routes on. Null lists mean the listing did
        not say.
      properties:
        durations:
          type:
            - array
            - 'null'
          items:
            type: integer
          description: The whole seconds it makes.
        sizes:
          type:
            - array
            - 'null'
          items:
            type: string
          description: The `WIDTHxHEIGHT` sizes it makes; another is its 400 (measured).
        firstFrame:
          type: boolean
          description: Whether it takes a first frame (image-to-video).
        prices:
          type:
            - array
            - 'null'
          items:
            $ref: '#/components/schemas/VideoPrice'
          description: |
            Its price list, read from OpenRouter's `pricing_skus`, in the
            lines a request can be priced by (`gateway.yaml`'s
            `ModelRoutingInfo.video_prices` says how). Null when the listing
            has no line for a second of output. Added 2026-10-08.

    VideoPriceUnit:
      type: string
      enum: [second, input_image, minimum]
      description: |
        What one unit of a `VideoPrice` is: a second of video made, one
        image sent in (a first frame), or the least a job is billed.

    VideoPrice:
      type: object
      additionalProperties: false
      required: [sku, per, usd]
      description: |
        One line of a video model's price list, in US dollars. Only lines
        that price what a request asks for are carried: a second of
        output, an input image, a job's minimum. Lines in units a request
        cannot be counted in (video tokens, megapixel-seconds, a
        continuation of a video sent in, a reference) are left out.
      properties:
        sku:
          type: string
          description: The provider's own name for the line (`cents_per_video_output_second_480p`).
        per:
          $ref: '#/components/schemas/VideoPriceUnit'
        usd:
          type: number
          minimum: 0
          description: Dollars per unit; a price listed in cents is divided by 100.
        resolution:
          type: string
          description: |
            The provider's resolution class (`480p`, `720p`, `1080p`, `2K`,
            `4K`). Absent: the line holds at every resolution.
        sizes:
          type: array
          items:
            type: string
          description: |
            The model's listed sizes of that resolution: those whose
            shorter side is its height (480p: 480; 2K: 1440; 4K: 2160).
            Absent when `resolution` is, or when the model lists no sizes.
        audio:
          type: boolean
          description: True holds only with sound, false only without. Absent holds either way.
        firstFrame:
          type: boolean
          description: |
            True holds only with a first frame (image to video), false
            only without one. Absent holds either way.

    ImageCapabilities:
      type: object
      additionalProperties: false
      description: |
        For an `image` model (P4): what its listing says it takes, which the
        gateway routes on. **Absent or null means the backend checks its own
        fields**, and its refusal is relayed: an OpenAI account's image
        models, whose API is the reference and which lists nothing per
        model. **An empty list means not taken**: OpenRouter ignores an
        unlisted `quality` or `background` with a 200 (measured), so a model
        whose listing does not name one is routed around for it.
      properties:
        streaming:
          type: boolean
          description: |
            Whether `/v1/image/stream` gives partial renders. From
            OpenRouter's `supports_streaming` (8 of 55, measured); for
            OpenAI's API, its GPT image models and not `dall-e-*`.
        maxImages:
          type:
            - integer
            - 'null'
          minimum: 1
          description: The largest `n`. Null when the backend checks it.
        minReferences:
          type: integer
          minimum: 0
          default: 0
          description: |
            At least this many reference images. One on a model that only
            edits (five on OpenRouter, measured), which a generation routes
            around.
        maxReferences:
          type:
            - integer
            - 'null'
          minimum: 0
          description: |
            At most this many reference images; 0 cannot edit. Null when
            the backend checks it.
        mask:
          type: boolean
          description: Whether `mask` is honoured. OpenAI's API only (OpenRouter ignores it, measured).
        qualities:
          type:
            - array
            - 'null'
          items:
            type: string
          description: The `quality` values taken; `[]` none, null the backend checks.
        backgrounds:
          type:
            - array
            - 'null'
          items:
            type: string
          description: The `background` values taken; `[]` none, null the backend checks.
        outputFormats:
          type:
            - array
            - 'null'
          items:
            type: string
          description: |
            The `output_format` values taken. Null where the listing does
            not say: carried, and the answer labelled by its bytes (P2-2).

    DriverInfo:
      type: object
      description: |
        Driver self-description, and the gateway's only source of truth
        for what this backend serves. A driver does not know its position
        in any topology: its operator-supplied name lives in the agent
        topology, not here.
      required:
        - backend
      properties:
        locality:
          type: string
          enum: [local, external, unknown]
          default: unknown
          description: |
            Active engine's configured trust classification. Managed local
            runtimes are local; cloud APIs and subscription CLIs are external.
            Custom HTTP endpoints require an explicit operator assertion;
            URLs, hostnames and loopback addresses never prove locality.
            Unknown and absent are ineligible for local-only routing.
        localOnlyEnforced:
          type: boolean
          default: false
          description: |
            True only when this driver enforces GenerateRequest/EmbedRequest
            localOnly against the active engine before invoking it. A local
            classification alone is insufficient for a protected request.
        backend:
          $ref: 'components/common.yaml#/components/schemas/BackendKind'
        provider:
          type: string
          description: |
            Operator-friendly provider key from the driver's
            registry (e.g. `"openai"`, `"xai"`, `"openrouter"`,
            `"claude_subscription"`). Reflects which subscription /
            service this driver is wrapping — `backend` reflects the
            *protocol* underneath, which can be shared across many
            providers (e.g. xAI, OpenRouter, Ollama all report
            `backend: openai_compat_http`). Optional; omitted when
            the driver is in degraded mode and never finished
            constructing.
        models:
          type: array
          items:
            $ref: '#/components/schemas/DriverModel'
          description: |
            **Every model this driver serves, and the gateway's routing
            key.** Replaces the single `modelId` (P1, 2026-09-27, Troy's
            call #3): one list for one model and for six hundred.

            * **A driver with a model configured** reports one entry,
              whose `id` is that model's public id (a local runtime's
              alias, `claude-opus-5-5`, …), with no prefix.
            * **An account** (`catalogue` present) reports one entry per
              model its catalogue and its include/exclude patterns keep.
              Their `id`s are the backend's own ids, and the gateway
              publishes each as `<driver name>/<id>`.
            * **Empty** is a real answer: a single-model driver with no
              model chosen yet, or an account whose first catalogue read
              failed (`catalogue.error` says why). The gateway routes
              nothing here.
            * **Absent** — the key missing from the body — means a driver
              from before this field existed. The gateway names it,
              with its machine, as one to update, and never sends it a
              `model`: an older driver ignores unknown fields and would
              answer with its one model whatever was asked.

            Omitted, deliberately, when the caller passed `models=false`.
        catalogue:
          $ref: '#/components/schemas/DriverCatalogue'
        runtime:
          type: string
          description: |
            The supervised engine runtime this driver is following, when
            it was configured with `runtimeName` rather than a literal
            `baseUrl`. Absent for a cloud provider, a CLI subscription,
            or any backend that is not a runtime this install
            supervises.

            Reported here despite the rule that a driver never says
            where it sits, because this is not the driver's own address —
            it is *what it serves*, which is exactly what `/v1/info` is
            for. It lets the gateway and the UI show which engine
            process is behind a driver, so a model that is loaded but
            unroutable is diagnosable from the routing table instead of
            by reading two components' configs side by side.
        version:
          type: string
          description: inference-driver semver.
