openapi: 3.1.0
info:
  title: Eugene Plexus — inference-driver
  version: 0.3.0-draft
  summary: The uniform surface every heterogeneous backend is wrapped in.
  description: |
    **Token verification (R7):** new installs and rotations use Ed25519
    JWTs with `alg: EdDSA`. The agent supplies base64 SubjectPublicKeyInfo
    public PEM via `AUTH_VERIFY_KEY`, never the private signing key.
    Existing HS256 installs retain legacy `AUTH_SIGNING_KEY` until explicit
    rotation. Only one algorithm is accepted, selected from trusted key
    material, never the JWT header. Supplying both bootstrap keys is invalid.

    One `inference-driver` instance wraps exactly **one** model backend
    and presents a uniform surface over it. An install runs N instances,
    one per backend, with the gateway routing above them.

    A backend is any of: a local engine speaking OpenAI-compatible HTTP
    (llama.cpp's `llama-server`, vLLM, LM Studio, Ollama), a hosted API
    (Anthropic, OpenAI, xAI, OpenRouter), or a subprocess CLI riding on
    a subscription the operator already pays for (`claude_code_cli`,
    `codex_cli`). The last kind is why the driver exists as a separate
    process: a CLI has no HTTP endpoint to proxy to, so something has to
    front it, and normalising *all* backends through one surface is
    cheaper than special-casing the ones that cannot be proxied.

    The driver owns what is specific to its backend — provider choice,
    model id, secrets, health, and how to speak the wire protocol. It
    does **not** own routing, and it does not know its own place in any
    topology: the gateway reads `/v1/info` to learn what this driver
    serves, and resolves it to a URL from the agent topology.

    All operations are stateless — the caller passes the full prompt on
    every call. Streaming uses Server-Sent Events; non-streaming returns
    a single JSON body.

    ## Which backend a driver fronts

    Two config fields, and which one is set decides how the backend is
    addressed.

    - **`runtimeName`** (`runtime_name`) names a supervised engine
      runtime. The driver resolves that name to a URL from the agent
      topology, at startup and again whenever it reconnects.
    - **`baseUrl`** is a literal URL, for every backend that is *not* a
      supervised runtime — a cloud provider, a remote LM Studio, an
      engine somebody else operates.

    `runtimeName` wins when both are set.

    Following a runtime by name rather than by URL is not a
    convenience. The agent assigns the port when the operator does
    not pick one, so a literal `baseUrl` pointing at a local runtime
    encodes a number the operator was never told and does not own — it
    is wrong the moment the thing it points at moves. A name survives
    that.

    This closes the gap M2 left open: launching a model from the library
    declared a runtime and stopped there, so the model loaded, served,
    and was unreachable because nothing pointed a driver at it. What
    still is *not* here is who creates the driver — a declared pool or
    one per launch is routing policy, and it stays with the gateway.

    ## Parameters are the caller's, never the driver's

    The driver applies no local defaults to anything affecting model
    output. Temperature, max tokens and stop sequences arrive on the
    request or are not sent to the backend at all. Backends that do not
    expose a given knob (agentic CLIs, mostly) ignore it silently rather
    than erroring.

    Correspondingly the driver **never refuses a model.** A backend that
    rejects `temperature` — as some reasoning models do — is accommodated
    by dropping the unsupported parameter and warning, not by failing
    construction. The operator owns the model; the control plane's job is
    to route to it.

    ## Secrets

    The `apiKey` field (and any other `sensitive: true` field) is stored
    on disk as a `MasterKeyEnvelope` (libsodium secretbox + base64
    nonce/ciphertext). The driver reads the master key from
    `EUGENE_PLEXUS_DRIVER_MASTER_KEY` at startup (threaded by the
    agent) and decrypts on demand. PATCH accepts plaintext and
    encrypts before persisting; GET returns `"<redacted>"`.

    ## Safe mode

    The driver honors the agent's safe-mode env var:
    `EUGENE_PLEXUS_DRIVER_SAFE_MODE=1` at startup makes it ignore its
    persisted config file and boot from built-in defaults. This is the
    recovery flow when a config edit breaks startup — the operator can
    still reach `/v1/config` to fix the persisted file, then restart
    without the env var. While safe mode is active `/v1/generate`
    returns 503 (no backend is configured), but `PATCH /v1/config`
    writes to the on-disk config normally.

    ## Auth

    Every endpoint except `/healthz` requires a bearer token. The
    gateway presents its service token (issued by the agent at spawn)
    on every call; the driver verifies it against the agent's signing
    key, threaded via env var.
  license:
    name: Apache-2.0
    identifier: Apache-2.0
  contact:
    name: Eugene Plexus
    url: https://github.com/eugene-plexus
servers:
  - url: http://{host}:{port}
    description: Default LAN deployment (mDNS-discovered or config-overridden).
    variables:
      host:
        default: localhost
      port:
        default: '8081'

security:
  - bearerAuth: []

tags:
  - name: inference
    description: Model invocation.
  - name: config
    description: |
      Remote-editable configuration. Every Eugene Plexus component
      implements the same config trio (`GET /v1/config`,
      `GET /v1/config/schema`, `PATCH /v1/config`) so a single UI can
      manage all components without per-component code.
  - name: admin
    description: Inspect and manage the running driver process.
  - name: meta
    description: Driver metadata and health.

paths:

  /v1/generate:
    post:
      tags: [inference]
      operationId: generate
      summary: Run inference on the configured backend.
      description: |
        Single-turn request/response. The caller builds the full prompt
        and the driver passes it through to its backend, translating into
        whatever wire protocol that backend speaks. The driver owns no
        conversation state.

        **How a backend's own refusal comes back, and why the status
        matters more than it looks.** The gateway cascades a 5xx to the
        next backend in the slot and hard-fails a 4xx, on the reasoning
        that the next backend would hit the same bad request. That rule
        only works if this driver keeps the two apart, so it does:

        * A backend 4xx that another backend would hit identically — an
          over-long prompt, a malformed request, a rejected key, an
          unknown model — is **400**, `type` ending
          `#backend-rejected-request`, with the backend's own status and
          body in `detail`.
        * A backend 4xx that is worth trying elsewhere — `408`, `409`,
          `425`, `429` — stays **502**, so the priority-list cascade
          still fires. A rate-limited cloud provider falling through to
          a local engine is the case failover was built for and must not
          regress.
        * **A deadline that fired is 504**, `type` ending
          `#backend-timeout`, and does not cascade. The backend has not
          *failed*; it has not *finished* — almost certainly still
          computing this prompt — and the next replica would take the
          same time to compute the same thing. The message names the
          seconds and `requestTimeoutSeconds`, because a read timeout
          carries no message of its own. A **connect** timeout is a dead
          host that took no work and stays **502**, so failover still
          fires.
        * Everything else — a backend 5xx, a transport failure, a
          malformed body — stays **502**.

        **A caller that disconnects cancels the backend call.** The
        driver answers **499** and the engine is released, rather than
        computing an answer into a closed socket. The same is true of
        the stream's *prefill*: the first chunk is awaited before the
        200 is committed, and on a cold engine that await is the whole
        model load.

        **This is the honest half of context-window handling.**
        `llama-server` answers an over-long prompt with a 400 naming
        both numbers (`n_prompt_tokens` and `n_ctx`); flattening that
        into a 502 made the gateway cascade a request every backend
        would refuse and hand the caller a retryable error, which is the
        looping symptom this project exists to remove. The engine's
        count is exact and ours would be a second implementation of it,
        so the driver's job here is to get out of the way.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateRequest'
      responses:
        '200':
          description: Generation completed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerateResponse'
        '400':
          description: |
            The request cannot be served as asked. Either the driver
            refused it (tools against a backend that cannot carry them)
            or the backend rejected it in a way another backend would
            reject identically — including a prompt longer than the
            context window. Does not cascade.
          content:
            application/problem+json:
              schema:
                $ref: 'components/common.yaml#/components/schemas/Problem'
        '500':
          $ref: 'components/common.yaml#/components/responses/Problem'
        '499':
          description: |
            The caller disconnected while this was running. The backend
            call was cancelled rather than left to finish into a closed
            socket. Nothing reads this status -- the socket is gone --
            but it is what the access log records, and "the caller left"
            must not look like "we failed".
          content:
            application/problem+json:
              schema:
                $ref: 'components/common.yaml#/components/schemas/Problem'
        '502':
          description: |
            Upstream model backend error, or a backend refusal worth
            retrying elsewhere (`408`, `409`, `425`, `429`). Cascades to
            the next backend in the slot.
          content:
            application/problem+json:
              schema:
                $ref: 'components/common.yaml#/components/schemas/Problem'
        '504':
          description: |
            `requestTimeoutSeconds` passed with no answer. **Does not
            cascade**: the backend is still computing this prompt and
            the next replica would take the same time on the same
            input. `detail` names the deadline and the setting.
          content:
            application/problem+json:
              schema:
                $ref: 'components/common.yaml#/components/schemas/Problem'

  /v1/generate/stream:
    post:
      tags: [inference]
      operationId: generateStream
      summary: Run inference with token-streamed output.
      description: |
        Same request shape as `POST /v1/generate`, but the response is a
        Server-Sent Events stream. Events:

        - `event: token` — `data` is a JSON `StreamToken`: `text` for a
          text fragment, `reasoning` for a reasoning fragment,
          `toolCalls` for tool-call fragments, exactly one per frame
        - `event: done`  — `data` is the final `GenerateResponse` JSON
        - `event: error` — `data` is a `Problem` JSON

        Backends that don't support native streaming (some CLI subprocess
        adapters) MAY emit the entire response as a single `token` event
        followed by `done`.

        **A failure before the first frame is still a status code**, and
        carries the same 400/502 split `POST /v1/generate` describes —
        so an over-long prompt refused by the engine reaches the caller
        as a 400 and does not cascade. Once the stream is open the 200
        is committed and a failure can only be an `event: error` frame,
        which is why everything that can fail cleanly is made to fail
        before the response is handed over.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateRequest'
      responses:
        '200':
          description: SSE stream opened.
          content:
            text/event-stream:
              schema:
                type: string
                description: Newline-delimited SSE events; see operation description.
        '400':
          description: |
            Refused before the stream opened — the driver's own refusal,
            or a backend rejection another backend would repeat, a
            prompt longer than the context window included. Does not
            cascade.
          content:
            application/problem+json:
              schema:
                $ref: 'components/common.yaml#/components/schemas/Problem'
        '500':
          $ref: 'components/common.yaml#/components/responses/Problem'
        '499':
          description: |
            The caller went away during the PREFILL -- the first chunk
            is awaited before the 200 is committed, and on a cold
            engine that is the whole model load. The engine call was
            cancelled.
          content:
            application/problem+json:
              schema:
                $ref: 'components/common.yaml#/components/schemas/Problem'
        '502':
          description: |
            Backend failure before the stream opened, or a refusal worth
            retrying elsewhere (`408`, `409`, `425`, `429`). Cascades.
          content:
            application/problem+json:
              schema:
                $ref: 'components/common.yaml#/components/schemas/Problem'
        '504':
          description: |
            `requestTimeoutSeconds` passed before the stream opened.
            Does not cascade — the backend is still computing this
            prompt. A timeout *after* the first frame can only be an
            `event: error`, since the 200 is already committed.
          content:
            application/problem+json:
              schema:
                $ref: 'components/common.yaml#/components/schemas/Problem'

  /v1/generate/count:
    post:
      tags: [inference]
      operationId: countPromptTokens
      summary: Count a request's prompt tokens with the backend's own tokenizer, generating nothing.
      description: |
        The prompt this request would put in front of the model, counted
        by the backend that would serve it -- **the same payload
        `/v1/generate` sends**, thinking directive and all, rendered by
        the backend's own chat template and counted by its own
        tokenizer. Nothing is generated and no prefill runs. Added
        2026-09-23 for the Anthropic door's `count_tokens`.

        **llama.cpp only, and measured.** The payload goes to
        `/apply-template` and the prompt it returns to `/tokenize` with
        `add_special: true`; against Gemma 4 E4B on b10948 that gave
        27, 59 and 95 tokens for a plain, a tool-bearing and a tool-loop
        request, **exactly** the `prompt_tokens` a one-token generation
        of each reported. Every other backend answers **501**: vLLM has
        a `/tokenize` of its own that has not been run here, Ollama and
        hosted providers have none, and the agentic CLIs have no prompt
        to count. A backend that does not know is not asked to guess.

        **A request carrying an image is 501 too**: an image's token
        cost is decided by the projector when it encodes the picture,
        and the template renders only a marker for it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateRequest'
      responses:
        '200':
          description: The count.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenCount'
        '400':
          description: |
            The request cannot be counted as asked: tools against a
            backend that cannot carry them, or a setting this backend
            refuses -- the same refusals `/v1/generate` makes.
          content:
            application/problem+json:
              schema:
                $ref: 'components/common.yaml#/components/schemas/Problem'
        '499':
          description: The caller disconnected; the count was abandoned.
          content:
            application/problem+json:
              schema:
                $ref: 'components/common.yaml#/components/schemas/Problem'
        '501':
          description: |
            This backend cannot count exactly without generating (see
            above), or the request carries an image. The caller should
            count some other way; nothing was sent to the model.
          content:
            application/problem+json:
              schema:
                $ref: 'components/common.yaml#/components/schemas/Problem'
        '502':
          description: The backend failed or could not be reached while counting.
          content:
            application/problem+json:
              schema:
                $ref: 'components/common.yaml#/components/schemas/Problem'

  /v1/embed:
    post:
      tags: [inference]
      operationId: embed
      summary: Turn text into vectors on the configured backend.
      description: |
        The embeddings counterpart to `POST /v1/generate`, and the same
        shape of thing: the caller supplies text, the driver translates
        into whatever wire protocol its backend speaks, and owns no
        state.

        **Always float arrays, never base64.** OpenAI's `/v1/embeddings`
        lets a client ask for base64, and the OpenAI SDKs use it by
        default — but that is a *transport* encoding, and making every
        driver support it would mean depending on each backend to honour
        a parameter some ignore. So this surface speaks one shape and
        the gateway encodes on the way out, which makes the
        client-visible behaviour identical regardless of what the
        backend underneath happens to support.

        **The capability is a property of the running backend, not of
        the model**, and it cannot be read off anything — measured
        2026-09-12: `llama-server`'s `/props` exposes no pooling or
        embedding field at all, and an Ollama runner started for chat
        answers `This server does not support embeddings. Start it with
        --embeddings`. So a driver determines it by *trying*, once, and
        reports the result as `capabilities.embeddings` on `/v1/info`.
        The negative case is cheap: llama.cpp refuses a non-pooling
        model in 45 ms, before any compute.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmbedRequest'
      responses:
        '200':
          description: Vectors produced.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmbedResponse'
        '400':
          description: |
            This backend cannot embed, or rejected the request in a way
            another backend would reject identically. Does not cascade.
            A driver whose `capabilities.embeddings` is false fails here
            rather than returning something that is not an embedding.
          content:
            application/problem+json:
              schema:
                $ref: 'components/common.yaml#/components/schemas/Problem'
        '500':
          $ref: 'components/common.yaml#/components/responses/Problem'
        '499':
          description: |
            The caller went away; the backend call was cancelled.
          content:
            application/problem+json:
              schema:
                $ref: 'components/common.yaml#/components/schemas/Problem'
        '502':
          description: |
            Upstream backend error, or a refusal worth retrying
            elsewhere (`408`, `409`, `425`, `429`). Cascades — but only
            across replicas of the SAME model; see `gateway.yaml`.
          content:
            application/problem+json:
              schema:
                $ref: 'components/common.yaml#/components/schemas/Problem'
        '504':
          description: |
            `requestTimeoutSeconds` passed with no answer. Does not
            cascade: a replica would take the same time on the same
            input.
          content:
            application/problem+json:
              schema:
                $ref: 'components/common.yaml#/components/schemas/Problem'

  /v1/decide:
    post:
      tags: [inference]
      operationId: decide
      summary: Answer typed decision questions against one state.
      description: |
        The decisions counterpart to `POST /v1/generate`: one state and
        a map of named typed questions in, structured answers out —
        never free text. Internal and signed like every driver
        operation; the public TypeSafe-shaped door is the gateway's
        `POST /v1/systemone`, and this operation carries its substance
        after admission, bounds and routing have already been applied.

        The question and answer vocabulary is the **pinned TypeSafe
        System One protocol** (docs.typesafe.ai/api, read 2026-09-22;
        `docs/design/decision-models.md` holds the pin): `noul` answers
        a probability of yes, `choice` answers a selection with a
        distribution over at most 255 named options, `score` answers a
        probability-weighted value over 2-10 ordered levels. Fields the
        protocol does not define are refused, not forwarded — an
        unsupported knob silently dropped would be a different question
        answered confidently.

        **Malformed backend output is a backend error, never an
        invented decision.** The driver validates before returning
        success: every question answered with the matching type, choices
        legal, distributions well-formed, numbers finite and in range.
        Provider probabilities and any reported model revision are
        preserved as provenance (`reportedModel`) without claiming they
        are comparable across models. Non-streaming, deliberately.

        Raw `state` is not logged by default: it is the caller's
        record, often someone else's ticket.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DecisionRequest'
      responses:
        '200':
          description: Every question answered and validated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DecisionResponse'
        '400':
          description: |
            This backend does not decide (`capabilities.decision`
            absent — the reason names `/v1/generate` for a chat model),
            or the request violates the pinned protocol in a way every
            replica would refuse identically (an unknown question kind,
            an unsupported field, criteria of the wrong shape, option
            or level counts outside the protocol's bounds). Does not
            cascade.
          content:
            application/problem+json:
              schema:
                $ref: 'components/common.yaml#/components/schemas/Problem'
        '499':
          description: |
            The caller went away. **Capacity stays occupied while known
            local work continues**: a single-slot backend that is still
            computing has not become free because nobody is listening,
            and admitting the next request on top of it would be the
            over-admission a non-cancellable engine cannot absorb.
          content:
            application/problem+json:
              schema:
                $ref: 'components/common.yaml#/components/schemas/Problem'
        '500':
          $ref: 'components/common.yaml#/components/responses/Problem'
        '502':
          description: |
            Upstream backend error, malformed backend output (a missing
            answer, an illegal choice, a distribution that is not one),
            or a refusal-before-work worth retrying elsewhere. Cascades
            across replicas of the same model per the gateway's rules.
          content:
            application/problem+json:
              schema:
                $ref: 'components/common.yaml#/components/schemas/Problem'
        '504':
          description: |
            `requestTimeoutSeconds` passed with no answer. Does not
            cascade — **a timeout after possible execution never
            justifies silently sending the same decision to a different
            model** — and per A6b the outcome is reported uncertain
            rather than failed.
          content:
            application/problem+json:
              schema:
                $ref: 'components/common.yaml#/components/schemas/Problem'

  /v1/info:
    get:
      tags: [meta]
      operationId: info
      summary: Report which backend and model this driver serves.
      description: |
        The gateway polls this to build its routing table: `modelId` is
        the key it routes on, `capabilities` says what the backend can
        do, and `backend` / `provider` are what the UI labels. A driver
        reports only what it serves — never where it sits.
      responses:
        '200':
          description: Driver metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriverInfo'

  /v1/config:
    get:
      tags: [config]
      operationId: getConfig
      summary: Read the driver's current effective configuration.
      description: |
        Returns every config field's currently effective value. Values
        of fields with `sensitive: true` (e.g. API keys) are redacted
        as the literal string `"<redacted>"`.

        ## Auth note (v0.1)

        Eugene Plexus v0.1 ships with no application-level
        authentication. Deployment assumption: behind a Tailscale
        tailnet (or equivalent network boundary). **Anyone reachable
        on the network can read and modify this driver's config.**
        Auth lands in v0.2.
      responses:
        '200':
          description: Current config.
          content:
            application/json:
              schema:
                $ref: 'components/common.yaml#/components/schemas/ConfigDocument'
    patch:
      tags: [config]
      operationId: updateConfig
      summary: Partial update of the driver's configuration.
      description: |
        Accepts a partial map of `key -> new-value` pairs. Each key is
        validated against its `ConfigField` definition. Validation
        errors are reported per-key without aborting the whole
        request — valid changes are applied, invalid ones are
        rejected and surfaced in the response.

        Some fields require a process restart to take effect (see
        `ConfigField.requiresRestart`). The response indicates whether
        a restart is needed and which keys are queued.

        ## Auth note (v0.1)

        Same caveat as `GET /v1/config`: in v0.1, anyone on the network
        can change driver config. Auth lands in v0.2.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: 'components/common.yaml#/components/schemas/ConfigUpdateRequest'
      responses:
        '200':
          description: Update outcome (may include per-field rejections).
          content:
            application/json:
              schema:
                $ref: 'components/common.yaml#/components/schemas/ConfigUpdateResult'
        '400':
          $ref: 'components/common.yaml#/components/responses/Problem'

  /v1/config/schema:
    get:
      tags: [config]
      operationId: getConfigSchema
      summary: UI-renderable description of every editable config field.
      description: |
        Returns a `ConfigSchema` listing every config field this driver
        accepts, with type, default, validation hints, and UI metadata
        (label, description, category, sensitive flag, restart-required
        flag). UIs use this to render a generic config editor without
        driver-specific code.
      responses:
        '200':
          description: Config schema.
          content:
            application/json:
              schema:
                $ref: 'components/common.yaml#/components/schemas/ConfigSchema'

  /v1/config/test:
    post:
      tags: [config]
      operationId: testConfig
      summary: Test the effective config without committing it.
      description: |
        Builds a temporary adapter from the saved config merged with the
        optional `overrides`, runs a minimal `generate()` round-trip
        (single user message), and reports success / failure / latency.
        The override values are NOT persisted — `PATCH /v1/config` is
        still required to commit them. Use this from the UI's "Test
        Connection" button so the operator can verify a new API key,
        URL, or model identifier before saving.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: 'components/common.yaml#/components/schemas/ConfigTestRequest'
      responses:
        '200':
          description: Test result. Returned for both success and failure cases.
          content:
            application/json:
              schema:
                $ref: 'components/common.yaml#/components/schemas/ConfigTestResult'

  /v1/admin/restart:
    post:
      tags: [admin]
      operationId: restart
      summary: Schedule a process restart so `requiresRestart` config takes effect.
      description: |
        Some config keys (`port`, `provider`, `modelId`, etc.) carry
        `requiresRestart: true` because the driver only reads them at
        startup. Calling this endpoint tells the driver to exit shortly
        after responding; an external supervisor (systemd, docker,
        deploy launcher) brings it back up with the new config in
        effect. The endpoint returns *before* the exit so the HTTP
        response has time to flush.

        v0.1 personal-use installations without a supervisor will
        require a manual relaunch. The UI should make this clear in the
        confirmation dialog.

        ## Auth note (v0.1)

        Unauthenticated, same as the rest of the v0.1 admin surface
        (assumed Tailscale tailnet). Auth lands in v0.2.
      responses:
        '202':
          description: Restart scheduled.
          content:
            application/json:
              schema:
                $ref: 'components/common.yaml#/components/schemas/RestartResult'

  /healthz:
    get:
      tags: [meta]
      operationId: healthz
      summary: Liveness / readiness probe.
      security: []
      description: |
        Returns ok if the driver process is running and the configured
        backend is reachable (a cheap probe — typically a cached result
        from the last successful call, refreshed on a timer).
      responses:
        '200':
          description: Healthy.
          content:
            application/json:
              schema:
                $ref: 'components/common.yaml#/components/schemas/Health'
        '503':
          description: Backend unreachable or driver not ready.
          content:
            application/json:
              schema:
                $ref: 'components/common.yaml#/components/schemas/Health'

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: |
        Bearer service token. Threaded to the driver by the agent
        at spawn time via env var. The gateway presents the
        same token shape on every call.

  schemas:

    GenerateRequest:
      type: object
      required:
        - messages
      properties:
        localOnly:
          type: boolean
          default: false
          description: |
            Internal routing policy. When true the driver must refuse before
            forwarding any prompt/image unless its active engine is classified
            local. Never forward this field upstream. Checked on the active
            engine at execution, so stale gateway metadata cannot relax policy.
        callerSettings:
          type: array
          items:
            type: string
          description: |
            A2 provenance: names of settings explicitly requested by the caller,
            using this request's field names (maxTokens, temperature, topP, seed,
            stop, tools, toolChoice, responseFormat, topK, minP, frequencyPenalty,
            presencePenalty, parallelToolCalls). The gateway preserves this
            list on each fallback attempt. An adapter must refuse a known unsupported
            explicit setting with 400, rather than silently dropping it. Settings
            supplied only by profiles/defaults retain the adapter's default behavior.
            This field is internal and is not forwarded to upstream providers.
        messages:
          type: array
          description: |
            Full prompt as an ordered conversation. Whatever system
            message the caller wants is already in here; the driver does
            not modify, prepend to, or reorder it.
          items:
            $ref: 'components/common.yaml#/components/schemas/Message'
        maxTokens:
          type: integer
          minimum: 1
          description: |
            Maximum output tokens. Backend-clamped. Owned by the caller
            (the gateway) — the driver applies no local default. Adapters
            whose backends don't expose this knob (agentic CLIs) refuse it when
            callerSettings marks it explicit; inherited defaults remain ignored.
        temperature:
          type: number
          format: float
          minimum: 0
          maximum: 2
          description: |
            Sampling temperature. Backend-clamped. Owned by the caller
            (the gateway, which resolves it from the model's settings
            profile) — the driver applies no local default. Backends that
            reject the parameter outright, as some reasoning models do,
            refuse explicit callerSettings and omit inherited defaults.
        topP:
          type: number
          format: float
          minimum: 0
          maximum: 1
          description: |
            Nucleus sampling cutoff. Owned by the caller (the gateway)
            exactly as `temperature` is, and for the same reason: it
            changes what the model says, so a driver never substitutes
            one of its own.

            **Added 2026-09-19.** `gateway.yaml` had promised since M0
            that `top_p` was passed through to backends that support it
            and dropped with a warning where they do not, and there was
            no field here to carry it — so the gateway accepted the
            value from its caller and silently discarded it, with no
            warning logged anywhere. A knob that is read, validated and
            thrown away is worse than one that is refused.

            An adapter whose backend has no such knob — the agentic
            CLIs — drops it and says so in its log, once per field, and
            answers the request.
        seed:
          type: integer
          description: |
            Deterministic-sampling seed. Owned by the caller, carried to
            backends that implement it, dropped with a logged warning by
            adapters whose backends do not.

            **Added 2026-09-19 for the same reason as `topP`**, and it
            is the more load-bearing of the two: a caller asking for a
            seed is asking for a reproducible answer, and silently
            dropping it returns a different answer each time while the
            contract says otherwise. Nothing in a response says whether
            the seed arrived, so the failure is invisible to the caller
            by construction.
        stop:
          type: array
          items:
            type: string
          description: Optional stop sequences.
        topK:
          type: integer
          minimum: 0
          description: |
            Sample from only the K most likely tokens; 0 disables the cut.
            Not an OpenAI parameter -- llama.cpp and vLLM both take it as
            `top_k`, and Anthropic's Messages API has it natively. Caller-
            owned like every sampler here: carried when the caller set it,
            never substituted by a driver.

            **Added 2026-09-23.** Until then both front doors refused it
            with a 400 because this request had nowhere to put it, which
            made it the last sampling parameter with that gap after
            `topP` and `seed` closed theirs on 2026-09-19.

            An adapter whose backend is known to reject it (a hosted
            OpenAI endpoint, the agentic CLIs) refuses it when explicit,
            and omits it from `capabilities.supportedSettings` so the
            gateway routes around that backend instead.
        minP:
          type: number
          format: float
          minimum: 0
          maximum: 1
          description: |
            Discard tokens less likely than this fraction of the most
            likely one. A llama.cpp and vLLM extension (`min_p`), carried
            and refused exactly as `topK` is.
        frequencyPenalty:
          type: number
          format: float
          minimum: -2
          maximum: 2
          description: |
            OpenAI's `frequency_penalty`: penalise a token by how often
            it has already appeared. Carried to every backend that takes
            it; refused when explicit by the agentic CLIs and, by the
            same rule that omits `temperature`, by models whose sampler
            is fixed.
        presencePenalty:
          type: number
          format: float
          minimum: -2
          maximum: 2
          description: |
            OpenAI's `presence_penalty`: penalise a token for having
            appeared at all. Carried and refused exactly as
            `frequencyPenalty` is.
        parallelToolCalls:
          type: boolean
          description: |
            Whether the model may request several tools in one turn.
            OpenAI's `parallel_tool_calls`, which llama.cpp also reads.
            **The default differs by backend**: llama.cpp assumes false
            when it is absent and OpenAI assumes true, so an absent
            field is left absent rather than filled in -- choosing for
            the caller would change what some backend already does.
        requestId:
          type: string
          format: uuid
          description: Caller-supplied id for log correlation. Echoed in the response.
        tools:
          type: array
          items:
            $ref: '#/components/schemas/Tool'
          description: |
            Tools the model may call, in OpenAI's shape. Carried down to
            the backend unchanged and never executed here — the driver
            is a protocol adapter, and running a tool is the caller's
            job by the same reasoning that keeps output-affecting
            parameters on the gateway.

            An adapter whose backend cannot carry tools MUST fail the
            request rather than drop the field. Dropping it yields a
            plain answer that a harness cannot distinguish from the
            model declining to call anything.
        toolChoice:
          description: |
            `none`, `auto`, `required`, or an object naming one
            function. Passed through.
          oneOf:
            - type: string
              enum:
                - none
                - auto
                - required
            - $ref: '#/components/schemas/NamedToolChoice'
        responseFormat:
          $ref: '#/components/schemas/ResponseFormat'
    TokenCount:
      type: object
      additionalProperties: false
      required:
        - promptTokens
      properties:
        promptTokens:
          type: integer
          minimum: 0
          description: |
            Tokens the backend's own template and tokenizer produce for
            this request's prompt -- what `usage.promptTokens` on a
            generation of the same request would report.

    GenerateResponse:
      type: object
      required:
        - finishReason
      properties:
        content:
          type:
            - string
            - 'null'
          description: |
            The generated assistant text. **Nullable since tool calling
            landed:** a turn that only calls a tool produces no text,
            and an empty string would be a lie about what the model
            said. Was required; a response with `toolCalls` and no
            `content` is the common agent-loop case.
        reasoning:
          type:
            - string
            - 'null'
          description: |
            The model's reasoning for this turn, when the backend
            reports it separately from `content` -- `reasoning_content`
            from llama.cpp, `reasoning` from vLLM. Absent when there was
            none, when the backend puts reasoning inline in `content`
            (then `thinkingMode` and the thinking filter govern it), and
            always when this driver's `thinkingMode` is `off`.

            **Added 2026-09-23, and before it every token of it was
            discarded.** Measured against llama.cpp b10948 launched with
            the agent's own argv: a reasoning model's thinking arrives
            in `reasoning_content` by default, this driver read only
            `content`, and a Qwen3 that spent its whole `max_tokens`
            budget thinking came back as an **empty answer with
            `finishReason: length`** and nothing to say why. A stop
            sequence can match inside the reasoning too, which produced
            the same empty `stop`.
        stopSequence:
          type:
            - string
            - 'null'
          description: |
            Which of the request's `stop` strings ended the answer, when
            the backend says. vLLM does (`stop_reason` on the choice);
            **llama.cpp b10948 does not** -- measured, its choice carries
            `finish_reason`, `index` and `message` and nothing else -- so
            for most local installs this stays null and `finishReason`
            stays `stop`. Set together with `finishReason: stop_sequence`.
        toolCalls:
          type: array
          items:
            $ref: '#/components/schemas/ToolCall'
          description: |
            Tools the model chose to call. Present when `finishReason`
            is `tool_calls`.
        finishReason:
          type: string
          enum:
            - stop           # natural end of generation
            - length         # hit max tokens
            - stop_sequence  # matched a `stop` value
            - tool_calls     # stopped to call one or more tools
            - content_filter # a safety classifier stopped the answer
            - error          # truncated due to backend error
          description: |
            **`content_filter` is separate from `error` since
            2026-09-19**, and the two were one value for the same
            reason `tool_calls` was folded into `stop` before step 6:
            the map had a row for a state nobody had a use for yet, so
            the state was reported as its nearest neighbour.

            A filtered answer is not a backend error — nothing broke,
            the backend did exactly what it was configured to do — and
            it is not a natural end either, which is what the caller
            saw. `error` means the generation was truncated because
            something failed mid-stream; `content_filter` means a
            classifier stopped it on purpose. OpenAI and Anthropic each
            have their own name for this state and the gateway renders
            it in the caller's vocabulary, so a client that switches on
            the field gets the vendor value it already understands.
        usage:
          $ref: '#/components/schemas/Usage'
        requestId:
          type: string
          format: uuid
        backend:
          $ref: 'components/common.yaml#/components/schemas/BackendKind'
        modelId:
          type: string
          description: |
            The public model identifier this driver serves (e.g.
            `"claude-opus-4-7"`) — the same value `/v1/info` advertises,
            **normalized**: when the driver translates to an
            `upstreamModelId` at the backend boundary, the backend's own
            name for itself is not echoed here. A caller that asked the
            public alias gets the public alias back, on this field and
            on the terminal frame of a stream alike.
        latencyMs:
          type: integer
          description: End-to-end driver-side latency in milliseconds.

    StreamToken:
      type: object
      description: |
        One `event: token` payload. Exactly one of `text`, `reasoning`
        or `toolCalls` is set.

        A reasoning frame is output like any other: it is the first
        thing a reasoning model produces, so it is also the commit point
        one layer up -- once a caller has been shown the model thinking,
        a failure cannot cascade onto another model's answer.
      properties:
        text:
          type: string
          description: A fragment of the assistant's text.
        reasoning:
          type: string
          description: |
            A fragment of the model's reasoning, from a backend that
            streams it separately (`delta.reasoning_content` on
            llama.cpp, `delta.reasoning` on vLLM). Never sent when this
            driver's `thinkingMode` is `off`.
        toolCalls:
          type: array
          items:
            $ref: '#/components/schemas/ToolCallDelta'
          description: |
            Fragments of one or more tool calls, accumulated by `index`.

    Tool:
      type: object
      required:
        - type
        - function
      properties:
        type:
          type: string
          const: function
        function:
          $ref: '#/components/schemas/FunctionDefinition'

    FunctionDefinition:
      type: object
      required:
        - name
      properties:
        name:
          type: string
        description:
          type: string
        parameters:
          type: object
          additionalProperties: true
          description: A JSON Schema object, passed through verbatim.
        strict:
          type:
            - boolean
            - 'null'

    NamedToolChoice:
      type: object
      required:
        - type
        - function
      properties:
        type:
          type: string
          const: function
        function:
          type: object
          required:
            - name
          properties:
            name:
              type: string

    ToolCall:
      type: object
      required:
        - id
        - type
        - function
      properties:
        id:
          type: string
        type:
          type: string
          const: function
        function:
          $ref: '#/components/schemas/FunctionCall'

    FunctionCall:
      type: object
      required:
        - name
        - arguments
      properties:
        name:
          type: string
        arguments:
          type: string
          description: |
            Arguments as a JSON **string**, not an object — a model can
            emit invalid JSON and the string preserves what it actually
            said. Not parsed here.

    ToolCallDelta:
      type: object
      required:
        - index
      properties:
        index:
          type: integer
        id:
          type: string
        type:
          type: string
          const: function
        function:
          type: object
          properties:
            name:
              type: string
            arguments:
              type: string

    ResponseFormat:
      type: object
      required:
        - type
      properties:
        type:
          type: string
          enum:
            - text
            - json_object
            - json_schema
        json_schema:
          $ref: '#/components/schemas/ResponseJsonSchema'

    ResponseJsonSchema:
      type: object
      required:
        - name
        - schema
      properties:
        name:
          type: string
        description:
          type: string
        schema:
          type: object
          additionalProperties: true
        strict:
          type:
            - boolean
            - 'null'

    Usage:
      type: object
      description: Token accounting. Some backends (CLI subprocess) may report nulls.
      properties:
        promptTokens:
          type: integer
          minimum: 0
        completionTokens:
          type: integer
          minimum: 0
        totalTokens:
          type: integer
          minimum: 0
        cachedPromptTokens:
          type: integer
          minimum: 0
          description: |
            How many of `promptTokens` the backend served from its
            prompt cache rather than computing. Reported by llama.cpp
            and vLLM as `usage.prompt_tokens_details.cached_tokens`;
            absent when the backend says nothing, never guessed.
        reasoningTokens:
          type: integer
          minimum: 0
          description: |
            How many of `completionTokens` were reasoning. vLLM reports
            it (`completion_tokens_details.reasoning_tokens`) when its
            reasoning parser is on; llama.cpp b10948 does not, and a
            count this driver made up from characters would be a
            tokenizer it does not have. Absent means unknown, not zero.

    EmbedRequest:
      type: object
      description: |
        Text to embed. Batched because every backend that does this
        accepts a batch, and a per-item round trip would multiply the
        control plane's own overhead by the size of a document set.
      required:
        - input
      properties:
        localOnly:
          type: boolean
          default: false
          description: Internal policy; require a local active engine before forwarding any input.
        input:
          type: array
          minItems: 1
          items:
            type: string
          description: |
            One entry per vector to produce. Order is preserved: the
            n-th vector in the response is the n-th input, which is the
            only thing that lets a caller match them up, since an
            embedding carries no identity of its own.
        requestId:
          type: string
          description: Correlation id, echoed back. Same role as on `GenerateRequest`.

    EmbedResponse:
      type: object
      required:
        - embeddings
      properties:
        embeddings:
          type: array
          items:
            type: array
            items:
              type: number
          description: |
            One vector per input, in the order the inputs arrived.
            Floats, always — see the operation description for why this
            surface does not carry base64.
        modelId:
          type: string
          description: |
            The model that produced these vectors, as the **public**
            identifier — normalized the same way `GenerateResponse`'s
            is when `upstreamModelId` is in play. **Load-bearing beyond
            attribution:** vectors from two models are not comparable,
            so a caller storing them needs to know which model's space
            they belong to — and the public id is the only name that
            stays stable across replicas of one model on several nodes.
        backend:
          $ref: 'components/common.yaml#/components/schemas/BackendKind'
        usage:
          $ref: '#/components/schemas/Usage'
        latencyMs:
          type: integer
          minimum: 0
        requestId:
          type: string

    DecisionRequest:
      type: object
      description: |
        One state, several named typed questions, answered together.
        Question names are the caller's own keys and come back verbatim
        on the response's `answers`. Question independence is the
        protocol's promise: each question is answered against the state
        alone, not against the other questions' answers.
      required:
        - state
        - questions
      properties:
        state:
          description: |
            What is being judged — plain text, or structured data (an
            object or array such as a ticket record or a chat log)
            passed through without re-serialization by the caller.
          oneOf:
            - type: string
            - type: object
              additionalProperties: true
            - type: array
              items: {}
        questions:
          type: object
          minProperties: 1
          additionalProperties:
            $ref: '#/components/schemas/DecisionQuestion'
          description: Caller-named questions; at least one.
        localOnly:
          type: boolean
          default: false
          description: |
            Internal policy; require a local active engine before
            forwarding any state, exactly as on `GenerateRequest`.
        requestId:
          type: string
          description: Correlation id, echoed back.

    DecisionQuestion:
      type: object
      description: |
        One typed question, in the pinned System One vocabulary. The
        shape of `criteria` depends on `type` and is validated in code
        against the pinned protocol: for `noul` an optional object
        mapping `"true"` and `"false"` to outcome descriptions; for
        `choice` a required map of 1-255 option names to rubric text or
        null; for `score` a required array of 2-10 ordered level
        descriptions, lowest first. **Fields beyond these are refused,
        never dropped** — a knob the protocol does not define, silently
        removed, would answer a different question than the caller
        asked.
      required:
        - type
        - instructions
      properties:
        type:
          type: string
          enum: [noul, choice, score]
        instructions:
          description: |
            What to decide — a string, or structured content the
            provider accepts.
          oneOf:
            - type: string
            - type: object
              additionalProperties: true
            - type: array
              items: {}
        criteria:
          description: Shape depends on `type`; see above.

    DecisionAnswer:
      type: object
      description: |
        One validated answer. `type` echoes the question's kind and
        exactly the matching fields are present — the driver has already
        refused a backend that answered otherwise, so a caller can
        switch on `type` without defending against a half-shaped answer.
      required:
        - type
      properties:
        type:
          type: string
          enum: [noul, choice, score]
        noul:
          type: number
          minimum: 0
          maximum: 1
          description: '`noul` only: the probability the answer is yes.'
        choice:
          type: string
          description: '`choice` only: the highest-probability option name.'
        score:
          type: number
          description: |
            `score` only: the probability-weighted value across the
            ordered levels, 0-indexed against `legend`.
        legend:
          type: object
          additionalProperties:
            type: string
          description: '`score` only: level indices to their descriptions.'
        probabilities:
          type: object
          additionalProperties:
            type: number
          description: |
            `choice` and `score`: the full distribution, validated to be
            over the legal options/levels with finite values.
        confidence:
          type: number
          minimum: 0
          maximum: 1
          description: |
            `choice` and `score`: the provider's certainty, preserved as
            reported. Provider-specific calibration — never comparable
            across models, and never manufactured by the driver when the
            provider omits it.

    DecisionResponse:
      type: object
      required:
        - answers
      properties:
        answers:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/DecisionAnswer'
          description: One validated answer per request question, same keys.
        modelId:
          type: string
          description: |
            The public model identifier, normalized exactly as
            `GenerateResponse.modelId` is — a backend's own name for
            itself is never echoed by a translating driver.
        reportedModel:
          type: string
          description: |
            What the backend said served this request, verbatim —
            provenance for calibration (`jev-1.13.0`, a Kev checkpoint
            id), preserved without becoming anyone's routing key.
        backend:
          $ref: 'components/common.yaml#/components/schemas/BackendKind'
        usage:
          $ref: '#/components/schemas/Usage'
        latencyMs:
          type: integer
          minimum: 0
        requestId:
          type: string

    DecisionCapability:
      type: object
      description: |
        Present on `/v1/info` iff this driver serves `POST /v1/decide`.
        Its absence is how the gateway knows not to route decisions
        here; `chatCapable: false` beside it is how a decision-only
        backend refuses chat with a reason.
      required:
        - kinds
      properties:
        kinds:
          type: array
          items:
            type: string
            enum: [noul, choice, score]
          description: Question kinds the backend supports.
        maxQuestions:
          type: integer
          minimum: 1
          description: Per-request question ceiling. Absent means unknown.
        maxOptions:
          type: integer
          minimum: 1
          description: |
            Choice option ceiling. The protocol's own ceiling is 255;
            a backend may be lower.
        maxConcurrent:
          type: integer
          minimum: 1
          description: |
            How many requests the backend can hold at once. **Kev's
            server handles exactly one** (a lock, no cross-caller
            batching — read off `kev/serve.py` at the pinned commit), so
            its driver reports 1 and the layers above must not
            over-admit: a non-cancellable engine that is over-admitted
            holds capacity nobody can free.

    DriverInfo:
      type: object
      description: |
        Driver self-description, and the gateway's only source of truth
        for what this backend serves. A driver does not know its position
        in any topology: its operator-supplied name lives in the agent
        topology, not here.
      required:
        - backend
      properties:
        locality:
          type: string
          enum: [local, external, unknown]
          default: unknown
          description: |
            Active engine's configured trust classification. Managed local
            runtimes are local; cloud APIs and subscription CLIs are external.
            Custom HTTP endpoints require an explicit operator assertion;
            URLs, hostnames and loopback addresses never prove locality.
            Unknown and absent are ineligible for local-only routing.
        localOnlyEnforced:
          type: boolean
          default: false
          description: |
            True only when this driver enforces GenerateRequest/EmbedRequest
            localOnly against the active engine before invoking it. A local
            classification alone is insufficient for a protected request.
        backend:
          $ref: 'components/common.yaml#/components/schemas/BackendKind'
        provider:
          type: string
          description: |
            Operator-friendly provider key from the driver's
            registry (e.g. `"openai"`, `"xai"`, `"openrouter"`,
            `"claude_subscription"`). Reflects which subscription /
            service this driver is wrapping — `backend` reflects the
            *protocol* underneath, which can be shared across many
            providers (e.g. xAI, OpenRouter, Ollama all report
            `backend: openai_compat_http`). Optional; omitted when
            the driver is in degraded mode and never finished
            constructing.
        modelId:
          type: string
          description: |
            The **public** model identifier — what the gateway routes
            on and what callers name (e.g. `"claude-opus-4-7"`).
            Optional — omitted when the driver is configured to use the
            adapter's built-in default rather than pinning a specific
            model. When `upstreamModelId` is unset this is also what
            the backend is asked for, which is every install that
            predates the split.
        upstreamModelId:
          type: string
          description: |
            What this driver actually sends to its backend, when that
            differs from the public `modelId`. Exists because some
            backends' served name is not ours to choose:
            `mlx_lm.server` answers only to upstream's `default_model`
            sentinel or to the model's absolute path — the first
            collides across every MLX runtime in an install and the
            second publishes the operator's directory layout — so the
            supervised runtime's companion driver advertises the public
            alias here as `modelId` and translates to the sentinel at
            the backend boundary, nowhere else.

            Diagnostic, never a routing key: the gateway routes and
            authorizes on `modelId` alone, and this value must not
            appear in any public model list. Defaults to `modelId` when
            unset. Responses report the public id (`GenerateResponse`
            and `EmbedResponse` `modelId`), so two runtimes serving
            different models behind one upstream sentinel stay
            distinguishable everywhere a caller looks.
        runtime:
          type: string
          description: |
            The supervised engine runtime this driver is following, when
            it was configured with `runtimeName` rather than a literal
            `baseUrl`. Absent for a cloud provider, a CLI subscription,
            or any backend that is not a runtime this install
            supervises.

            Reported here despite the rule that a driver never says
            where it sits, because this is not the driver's own address —
            it is *what it serves*, which is exactly what `/v1/info` is
            for. It lets the gateway and the UI show which engine
            process is behind a driver, so a model that is loaded but
            unroutable is diagnosable from the routing table instead of
            by reading two components' configs side by side.
        capabilities:
          type: object
          description: Backend capabilities the gateway keys off when routing.
          properties:
            supportedSettings:
              type: array
              items:
                type: string
              description: |
                Explicit callerSettings this active adapter can carry without
                dropping them. This does not promise the provider accepts every
                possible value. Absent means unknown; ineligible for requests
                requiring explicit settings. The driver still validates before
                execution, including after a configuration change.
            streaming:
              type: boolean
              description: Whether `/v1/generate/stream` emits true incremental tokens.
            imageInput:
              type: boolean
              description: |
                Whether the loaded model is confirmed to accept inline PNG/JPEG
                images. Unknown or unverified backends report false. Rechecked
                before image generation; never inferred from the provider name.
            toolCalling:
              type: boolean
              description: |
                Whether this driver can carry `tools` to its backend and
                report `toolCalls` back.

                The gateway reads it to answer a question a harness
                cannot otherwise ask: a plain answer where a tool call
                was expected looks identical whether the model declined
                or the backend never saw the tools. A driver that says
                `false` here is failed at the front door with a reason
                instead.
            embeddings:
              type: boolean
              description: |
                Whether this driver can serve `POST /v1/embed`.

                **A property of the running backend, not of the model**,
                and not readable from anything: `llama-server`'s
                `/props` carries no pooling or embedding field, and an
                Ollama runner started for chat refuses with "This server
                does not support embeddings". So it is determined by
                trying once and cached for the driver's lifetime — which
                is the right lifetime, since it cannot change without
                the backend restarting.

                The gateway reads it to mark which surface each model
                serves on `GET /v1/models`, and to refuse a chat request
                against an embeddings-only model with a reason instead
                of passing it down to fail obscurely.
            maxContextTokens:
              type: integer
              minimum: 0
              description: |
                The context window the backend **resolved**, read back
                from the backend itself — not the model's trained
                maximum, and never an estimate.

                Null means unknown, and unknown is a real answer: a
                hosted provider exposes nothing to read, and a CLI
                subscription has no window of its own to report. The
                gateway's `_smallest_context` folds this together with
                the window a supervised runtime reports and publishes
                the smallest as `x_eugene_plexus.context_length` on
                `GET /v1/models`, so a harness can size a prompt
                against the number that will actually apply.

                **Populated by a probe of the backend, which is why it
                exists at all.** A supervised runtime already tells the
                agent its window; this field is for the backend nobody
                supervises — an Ollama or an LM Studio the operator
                points us at — which until now reported no window
                anywhere. Contracted since M0 and populated by nothing
                until then, exactly as `streaming` was until M10.

                **Advertising, not enforcement.** Nothing here counts a
                prompt: the window is published so a caller can respect
                it, and a caller that does not is refused by the engine
                itself, whose count is exact. A backend that truncates
                silently instead of refusing is caught after the fact —
                see `x_eugene_plexus.prompt_truncated` in
                `gateway.yaml`.
            chatCapable:
              type: boolean
              default: true
              description: |
                Whether this driver serves `POST /v1/generate` at all.
                True for every backend that existed before decisions —
                absent means chat-capable, so no existing driver changes
                meaning — and **false for a System One backend**, whose
                only surface is `POST /v1/decide`. The gateway reads it
                to refuse a chat request against a decision-only model
                with a sentence naming `/v1/systemone`, instead of
                letting the request die as a protocol error inside a
                backend that never spoke chat.
            decision:
              $ref: '#/components/schemas/DecisionCapability'
        version:
          type: string
          description: inference-driver semver.
