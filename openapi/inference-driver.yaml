openapi: 3.1.0
info:
  title: Eugene Plexus — inference-driver
  version: 0.3.0-draft
  summary: The uniform surface every heterogeneous backend is wrapped in.
  description: |
    One `inference-driver` instance wraps exactly **one** model backend
    and presents a uniform surface over it. An install runs N instances,
    one per backend, with the gateway routing above them.

    A backend is any of: a local engine speaking OpenAI-compatible HTTP
    (llama.cpp's `llama-server`, vLLM, LM Studio, Ollama), a hosted API
    (Anthropic, OpenAI, xAI, OpenRouter), or a subprocess CLI riding on
    a subscription the operator already pays for (`claude_code_cli`,
    `codex_cli`). The last kind is why the driver exists as a separate
    process: a CLI has no HTTP endpoint to proxy to, so something has to
    front it, and normalising *all* backends through one surface is
    cheaper than special-casing the ones that cannot be proxied.

    The driver owns what is specific to its backend — provider choice,
    model id, secrets, health, and how to speak the wire protocol. It
    does **not** own routing, and it does not know its own place in any
    topology: the gateway reads `/v1/info` to learn what this driver
    serves, and resolves it to a URL from the agent topology.

    All operations are stateless — the caller passes the full prompt on
    every call. Streaming uses Server-Sent Events; non-streaming returns
    a single JSON body.

    ## Which backend a driver fronts

    Two config fields, and which one is set decides how the backend is
    addressed.

    - **`runtimeName`** (`runtime_name`) names a supervised engine
      runtime. The driver resolves that name to a URL from the agent
      topology, at startup and again whenever it reconnects.
    - **`baseUrl`** is a literal URL, for every backend that is *not* a
      supervised runtime — a cloud provider, a remote LM Studio, an
      engine somebody else operates.

    `runtimeName` wins when both are set.

    Following a runtime by name rather than by URL is not a
    convenience. The agent assigns the port when the operator does
    not pick one, so a literal `baseUrl` pointing at a local runtime
    encodes a number the operator was never told and does not own — it
    is wrong the moment the thing it points at moves. A name survives
    that.

    This closes the gap M2 left open: launching a model from the library
    declared a runtime and stopped there, so the model loaded, served,
    and was unreachable because nothing pointed a driver at it. What
    still is *not* here is who creates the driver — a declared pool or
    one per launch is routing policy, and it stays with the gateway.

    ## Parameters are the caller's, never the driver's

    The driver applies no local defaults to anything affecting model
    output. Temperature, max tokens and stop sequences arrive on the
    request or are not sent to the backend at all. Backends that do not
    expose a given knob (agentic CLIs, mostly) ignore it silently rather
    than erroring.

    Correspondingly the driver **never refuses a model.** A backend that
    rejects `temperature` — as some reasoning models do — is accommodated
    by dropping the unsupported parameter and warning, not by failing
    construction. The operator owns the model; the control plane's job is
    to route to it.

    ## Secrets

    The `apiKey` field (and any other `sensitive: true` field) is stored
    on disk as a `MasterKeyEnvelope` (libsodium secretbox + base64
    nonce/ciphertext). The driver reads the master key from
    `EUGENE_PLEXUS_DRIVER_MASTER_KEY` at startup (threaded by the
    agent) and decrypts on demand. PATCH accepts plaintext and
    encrypts before persisting; GET returns `"<redacted>"`.

    ## Safe mode

    The driver honors the agent's safe-mode env var:
    `EUGENE_PLEXUS_DRIVER_SAFE_MODE=1` at startup makes it ignore its
    persisted config file and boot from built-in defaults. This is the
    recovery flow when a config edit breaks startup — the operator can
    still reach `/v1/config` to fix the persisted file, then restart
    without the env var. While safe mode is active `/v1/generate`
    returns 503 (no backend is configured), but `PATCH /v1/config`
    writes to the on-disk config normally.

    ## Auth

    Every endpoint except `/healthz` requires a bearer token. The
    gateway presents its service token (issued by the agent at spawn)
    on every call; the driver verifies it against the agent's signing
    key, threaded via env var.
  license:
    name: Apache-2.0
    identifier: Apache-2.0
  contact:
    name: Eugene Plexus
    url: https://github.com/eugene-plexus
servers:
  - url: http://{host}:{port}
    description: Default LAN deployment (mDNS-discovered or config-overridden).
    variables:
      host:
        default: localhost
      port:
        default: '8081'

security:
  - bearerAuth: []

tags:
  - name: inference
    description: Model invocation.
  - name: config
    description: |
      Remote-editable configuration. Every Eugene Plexus component
      implements the same config trio (`GET /v1/config`,
      `GET /v1/config/schema`, `PATCH /v1/config`) so a single UI can
      manage all components without per-component code.
  - name: admin
    description: Inspect and manage the running driver process.
  - name: meta
    description: Driver metadata and health.

paths:

  /v1/generate:
    post:
      tags: [inference]
      operationId: generate
      summary: Run inference on the configured backend.
      description: |
        Single-turn request/response. The caller builds the full prompt
        and the driver passes it through to its backend, translating into
        whatever wire protocol that backend speaks. The driver owns no
        conversation state.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateRequest'
      responses:
        '200':
          description: Generation completed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerateResponse'
        '400':
          $ref: 'components/common.yaml#/components/responses/Problem'
        '500':
          $ref: 'components/common.yaml#/components/responses/Problem'
        '502':
          description: Upstream model backend error.
          content:
            application/problem+json:
              schema:
                $ref: 'components/common.yaml#/components/schemas/Problem'

  /v1/generate/stream:
    post:
      tags: [inference]
      operationId: generateStream
      summary: Run inference with token-streamed output.
      description: |
        Same request shape as `POST /v1/generate`, but the response is a
        Server-Sent Events stream. Events:

        - `event: token` — `data` is a JSON `{"text": "..."}` chunk
        - `event: done`  — `data` is the final `GenerateResponse` JSON
        - `event: error` — `data` is a `Problem` JSON

        Backends that don't support native streaming (some CLI subprocess
        adapters) MAY emit the entire response as a single `token` event
        followed by `done`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateRequest'
      responses:
        '200':
          description: SSE stream opened.
          content:
            text/event-stream:
              schema:
                type: string
                description: Newline-delimited SSE events; see operation description.
        '400':
          $ref: 'components/common.yaml#/components/responses/Problem'
        '500':
          $ref: 'components/common.yaml#/components/responses/Problem'

  /v1/info:
    get:
      tags: [meta]
      operationId: info
      summary: Report which backend and model this driver serves.
      description: |
        The gateway polls this to build its routing table: `modelId` is
        the key it routes on, `capabilities` says what the backend can
        do, and `backend` / `provider` are what the UI labels. A driver
        reports only what it serves — never where it sits.
      responses:
        '200':
          description: Driver metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriverInfo'

  /v1/config:
    get:
      tags: [config]
      operationId: getConfig
      summary: Read the driver's current effective configuration.
      description: |
        Returns every config field's currently effective value. Values
        of fields with `sensitive: true` (e.g. API keys) are redacted
        as the literal string `"<redacted>"`.

        ## Auth note (v0.1)

        Eugene Plexus v0.1 ships with no application-level
        authentication. Deployment assumption: behind a Tailscale
        tailnet (or equivalent network boundary). **Anyone reachable
        on the network can read and modify this driver's config.**
        Auth lands in v0.2.
      responses:
        '200':
          description: Current config.
          content:
            application/json:
              schema:
                $ref: 'components/common.yaml#/components/schemas/ConfigDocument'
    patch:
      tags: [config]
      operationId: updateConfig
      summary: Partial update of the driver's configuration.
      description: |
        Accepts a partial map of `key -> new-value` pairs. Each key is
        validated against its `ConfigField` definition. Validation
        errors are reported per-key without aborting the whole
        request — valid changes are applied, invalid ones are
        rejected and surfaced in the response.

        Some fields require a process restart to take effect (see
        `ConfigField.requiresRestart`). The response indicates whether
        a restart is needed and which keys are queued.

        ## Auth note (v0.1)

        Same caveat as `GET /v1/config`: in v0.1, anyone on the network
        can change driver config. Auth lands in v0.2.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: 'components/common.yaml#/components/schemas/ConfigUpdateRequest'
      responses:
        '200':
          description: Update outcome (may include per-field rejections).
          content:
            application/json:
              schema:
                $ref: 'components/common.yaml#/components/schemas/ConfigUpdateResult'
        '400':
          $ref: 'components/common.yaml#/components/responses/Problem'

  /v1/config/schema:
    get:
      tags: [config]
      operationId: getConfigSchema
      summary: UI-renderable description of every editable config field.
      description: |
        Returns a `ConfigSchema` listing every config field this driver
        accepts, with type, default, validation hints, and UI metadata
        (label, description, category, sensitive flag, restart-required
        flag). UIs use this to render a generic config editor without
        driver-specific code.
      responses:
        '200':
          description: Config schema.
          content:
            application/json:
              schema:
                $ref: 'components/common.yaml#/components/schemas/ConfigSchema'

  /v1/config/test:
    post:
      tags: [config]
      operationId: testConfig
      summary: Test the effective config without committing it.
      description: |
        Builds a temporary adapter from the saved config merged with the
        optional `overrides`, runs a minimal `generate()` round-trip
        (single user message), and reports success / failure / latency.
        The override values are NOT persisted — `PATCH /v1/config` is
        still required to commit them. Use this from the UI's "Test
        Connection" button so the operator can verify a new API key,
        URL, or model identifier before saving.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: 'components/common.yaml#/components/schemas/ConfigTestRequest'
      responses:
        '200':
          description: Test result. Returned for both success and failure cases.
          content:
            application/json:
              schema:
                $ref: 'components/common.yaml#/components/schemas/ConfigTestResult'

  /v1/admin/restart:
    post:
      tags: [admin]
      operationId: restart
      summary: Schedule a process restart so `requiresRestart` config takes effect.
      description: |
        Some config keys (`port`, `provider`, `modelId`, etc.) carry
        `requiresRestart: true` because the driver only reads them at
        startup. Calling this endpoint tells the driver to exit shortly
        after responding; an external supervisor (systemd, docker,
        deploy launcher) brings it back up with the new config in
        effect. The endpoint returns *before* the exit so the HTTP
        response has time to flush.

        v0.1 personal-use installations without a supervisor will
        require a manual relaunch. The UI should make this clear in the
        confirmation dialog.

        ## Auth note (v0.1)

        Unauthenticated, same as the rest of the v0.1 admin surface
        (assumed Tailscale tailnet). Auth lands in v0.2.
      responses:
        '202':
          description: Restart scheduled.
          content:
            application/json:
              schema:
                $ref: 'components/common.yaml#/components/schemas/RestartResult'

  /healthz:
    get:
      tags: [meta]
      operationId: healthz
      summary: Liveness / readiness probe.
      security: []
      description: |
        Returns ok if the driver process is running and the configured
        backend is reachable (a cheap probe — typically a cached result
        from the last successful call, refreshed on a timer).
      responses:
        '200':
          description: Healthy.
          content:
            application/json:
              schema:
                $ref: 'components/common.yaml#/components/schemas/Health'
        '503':
          description: Backend unreachable or driver not ready.
          content:
            application/json:
              schema:
                $ref: 'components/common.yaml#/components/schemas/Health'

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: |
        Bearer service token. Threaded to the driver by the agent
        at spawn time via env var. The gateway presents the
        same token shape on every call.

  schemas:

    GenerateRequest:
      type: object
      required:
        - messages
      properties:
        messages:
          type: array
          description: |
            Full prompt as an ordered conversation. Whatever system
            message the caller wants is already in here; the driver does
            not modify, prepend to, or reorder it.
          items:
            $ref: 'components/common.yaml#/components/schemas/Message'
        maxTokens:
          type: integer
          minimum: 1
          description: |
            Maximum output tokens. Backend-clamped. Owned by the caller
            (the gateway) — the driver applies no local default. Adapters
            whose backends don't expose this knob (agentic CLIs) ignore
            it silently.
        temperature:
          type: number
          format: float
          minimum: 0
          maximum: 2
          description: |
            Sampling temperature. Backend-clamped. Owned by the caller
            (the gateway, which resolves it from the model's settings
            profile) — the driver applies no local default. Backends that
            reject the parameter outright, as some reasoning models do,
            have it dropped with a warning rather than erroring.
        stop:
          type: array
          items:
            type: string
          description: Optional stop sequences.
        requestId:
          type: string
          format: uuid
          description: Caller-supplied id for log correlation. Echoed in the response.
    GenerateResponse:
      type: object
      required:
        - content
        - finishReason
      properties:
        content:
          type: string
          description: The generated assistant text.
        finishReason:
          type: string
          enum:
            - stop          # natural end of generation
            - length        # hit max tokens
            - stop_sequence # matched a `stop` value
            - error         # truncated due to backend error
        usage:
          $ref: '#/components/schemas/Usage'
        requestId:
          type: string
          format: uuid
        backend:
          $ref: 'components/common.yaml#/components/schemas/BackendKind'
        modelId:
          type: string
          description: Backend-specific model identifier (e.g. `"claude-opus-4-7"`).
        latencyMs:
          type: integer
          description: End-to-end driver-side latency in milliseconds.

    Usage:
      type: object
      description: Token accounting. Some backends (CLI subprocess) may report nulls.
      properties:
        promptTokens:
          type: integer
          minimum: 0
        completionTokens:
          type: integer
          minimum: 0
        totalTokens:
          type: integer
          minimum: 0

    DriverInfo:
      type: object
      description: |
        Driver self-description, and the gateway's only source of truth
        for what this backend serves. A driver does not know its position
        in any topology: its operator-supplied name lives in the agent
        topology, not here.
      required:
        - backend
      properties:
        backend:
          $ref: 'components/common.yaml#/components/schemas/BackendKind'
        provider:
          type: string
          description: |
            Operator-friendly provider key from the driver's
            registry (e.g. `"openai"`, `"xai"`, `"openrouter"`,
            `"claude_subscription"`). Reflects which subscription /
            service this driver is wrapping — `backend` reflects the
            *protocol* underneath, which can be shared across many
            providers (e.g. xAI, OpenRouter, Ollama all report
            `backend: openai_compat_http`). Optional; omitted when
            the driver is in degraded mode and never finished
            constructing.
        modelId:
          type: string
          description: |
            Backend-specific model identifier (e.g. `"claude-opus-4-7"`).
            Optional — omitted when the driver is configured to use the
            adapter's built-in default rather than pinning a specific model.
        runtime:
          type: string
          description: |
            The supervised engine runtime this driver is following, when
            it was configured with `runtimeName` rather than a literal
            `baseUrl`. Absent for a cloud provider, a CLI subscription,
            or any backend that is not a runtime this install
            supervises.

            Reported here despite the rule that a driver never says
            where it sits, because this is not the driver's own address —
            it is *what it serves*, which is exactly what `/v1/info` is
            for. It lets the gateway and the UI show which engine
            process is behind a driver, so a model that is loaded but
            unroutable is diagnosable from the routing table instead of
            by reading two components' configs side by side.
        capabilities:
          type: object
          description: Backend capabilities the gateway keys off when routing.
          properties:
            streaming:
              type: boolean
              description: Whether `/v1/generate/stream` emits true incremental tokens.
            maxContextTokens:
              type: integer
              minimum: 0
        version:
          type: string
          description: inference-driver semver.
