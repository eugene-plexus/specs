openapi: 3.1.0
info:
  title: Eugene Plexus — library
  version: 0.3.0-draft
  summary: The operator's own model directories, scanned, described, and given launch profiles.
  description: |
    The library is how Eugene Plexus knows what models the operator
    owns. It is pointed at directories that already exist, reads what
    is in them, and remembers the launch settings that worked for each
    model.

    **The rule it exists to honour:** the user's model files stay
    theirs. Their directories, their filenames, their layout. We read;
    we never relocate, rename, hash-address, or take custody. Delete
    Eugene Plexus and every model is still where it was, correctly
    named. Every design choice here that looks slightly awkward — the
    derived-from-path `id`, the refusal to resolve symlinks, the
    refusal to guess that a moved file is the same model — is that rule
    being kept.

    ## What it holds

    * **Scanned models**, from both formats. GGUF (one quantized file,
      possibly sharded, possibly with a vision projector beside it) and
      HF safetensors (a directory of weights plus `config.json`).
      Format is a dimension of the data model, not an assumption.
    * **Per-model launch profiles**, named, N per model. This is the
      answer to "tired of tweaking llama.cpp settings for every
      different model": the settings that worked are saved against the
      model, not retyped into a runtime declaration.

    Profiles are the *only* thing this component persists about a
    model. Everything else is a projection of what is on disk, which
    is why a model can be listed as `missing` — the file is gone but
    the profile someone spent an afternoon tuning is not.

    ## What it is not

    * **Not a store.** There is no managed directory, no content
      addressing, no blob cache. Model roots are operator-chosen paths
      in this component's own config.
    * **Not in the request path.** No inference traffic passes through
      here. The gateway never calls it.
    * **Not the launcher.** Launching a model is composed by the
      caller: read a profile here, then `POST /v1/runtimes` on the
      agent with the model's `path` and the profile's `flags`. The
      profile's field names are `RuntimeSpec`'s field names precisely
      so that composition is a copy rather than a translation. This
      component holds no engine knowledge and never calls the
      agent.
    * **Not a validator of engine flags.** It stores `flags` as given.
      Validation belongs where the curated flag surface lives — the
      agent's engine adapter, at runtime-creation time. Two
      validators would mean two copies of engine knowledge and one of
      them going stale.

    ## Reading metadata is not free

    Measured, not assumed: the KV block of a 248k-vocab GGUF is
    ~10.9 MB, because the tokenizer lives in it, and the fields worth
    having (the quant, for one) can sit on the far side of it. That is
    ~50–60 ms per model warm and a lot of disk cold.

    So scanning is an asynchronous sub-resource with progress and
    phases rather than a synchronous `GET`, and a rescan is
    **incremental** — `(path, size, mtime)` unchanged means the parsed
    metadata is reused and the file is never opened.

    ## Two formats, one asymmetry worth knowing

    Safetensors headers give an exact parameter count and dtype from a
    ~11 KB read. GGUF gives no parameter count at all — only an
    author-supplied `size_label` string like `"27B"` — but does give a
    machine-readable quant tier. Hence: `parameters` is optional
    everywhere, and the quant fields exist only on the GGUF side.
    A safetensors model is sized, not tiered.

    ## Getting models, and being told which one to get

    The library also has a remote half: it searches the upstream
    catalogue, describes what a repo actually holds, scores every
    download candidate against this host's detected memory, and fetches
    the chosen one — resumably, verified against upstream's own digest,
    into a directory the operator nominated, under its own upstream
    name.

    Two things about that are worth knowing before reading the
    endpoints.

    **Guidance and discovery are one response, not two.** The moment
    someone is choosing between `Q3_K_S` and `Q2_K_M` is the moment they
    need to be told which one their machine can hold, so
    `GET /v1/catalogue/model` returns the candidates with the fit
    arithmetic already attached. One verified repo held 30 `.gguf` files
    and 25 actual choices; sorting that out — shards summed, projectors
    and calibration files set aside — is most of the work.

    **We state what fits, never what is better.** Size, bits per weight
    and a fit verdict are arithmetic and ours to assert. The relative
    quality of one quant family against another is upstream research,
    model-dependent, and would have to be invented — so
    `GET /v1/quants` explains the *schemes* and nothing here scores a
    model's quality. Guidance built on a guess is worse than no guidance.
  license:
    name: Apache-2.0
    identifier: Apache-2.0
  contact:
    name: Eugene Plexus
    url: https://github.com/eugene-plexus
servers:
  - url: http://{host}:{port}
    description: Default loopback deployment; one instance per install.
    variables:
      host:
        default: localhost
      port:
        default: '8082'

security:
  - bearerAuth: []

tags:
  - name: models
    description: |
      What the operator owns, as found on disk. One entry per
      launchable model — not per file, which is why a projector and
      shards 2..N of a split GGUF are not entries.
  - name: profiles
    description: |
      Named launch settings per model. The per-model config surface
      the whole component exists for, and the only thing here that is
      persisted rather than observed.
  - name: scan
    description: |
      Walking the configured roots. A singleton sub-resource with
      named phases — there is exactly one scan, so it is not a job
      collection.
  - name: catalogue
    description: |
      The upstream model catalogue: search, what a repo holds, the card
      prose, and a ranged metadata read of one candidate. The only
      outbound-network surface in this component, and the only one that
      can be switched off entirely (`catalogueEnabled`) for an
      air-gapped install.
  - name: downloads
    description: |
      Fetching a model into a directory the operator chose. A
      collection, not a singleton — several can be queued — with
      per-file progress, mandatory digest verification, and resume.
  - name: guidance
    description: |
      Detected hardware, the fit computation, and what the quant tiers
      mean. The answer to "Q3_K_S vs Q2_K_M? No one knows", and the
      reason it is a milestone rather than a tooltip.
  - name: config
    description: |
      The standard config trio. Model roots live here as a
      `path_list`, which is what makes them editable in the generic
      config UI with no library-specific code.

      The discovery and download half adds six fields to that same
      trio and needs no new renderer for any of them: `hfToken` (a
      `secret` — gated repos, higher upstream rate limits, and faster
      transfers even for public files, which is upstream's own advice),
      `catalogueEnabled` (the air-gap switch: off means no outbound
      request is ever made and search says so rather than timing out),
      `catalogueBaseUrl` (enterprise hubs and regional mirrors both
      exist), `downloadLayout` (`publisher_repo` or `flat`),
      `maxConcurrentDownloads` (default 1), and
      `guidanceContextLength` — the context every fit verdict is
      computed at unless a caller passes one, and therefore the single
      number that decides which quant gets recommended.
  - name: meta
    description: Health, version, and restart.

paths:

  # -------- Models --------

  /v1/models:
    get:
      tags: [models]
      operationId: listModels
      summary: Every model in the library.
      description: |
        The library browser's source of truth. One entry per
        *launchable* model: a projector, the second through Nth shard
        of a split GGUF, and an older revision inside a HuggingFace
        cache are all files on disk that are not models, and none of
        them appears here. What was passed over, and why, is on
        `GET /v1/scan` — a scanner that silently drops what it did not
        understand is indistinguishable from a broken one.

        Includes entries whose files are gone (`status: missing`).
        Hiding them would throw away the profiles attached to them,
        which are the one thing here that cannot be recovered by
        looking at the disk again.

        Unpaginated. Dozens to low hundreds of entries is the expected
        scale; pagination is a backwards-compatible addition if
        somebody turns up with thousands.
      parameters:
        - in: query
          name: path
          required: false
          schema:
            type: string
          description: |
            Reverse lookup: return the single entry whose model path is
            this one, or nothing. Normalization (absolute, canonical
            separators, case-folded on Windows) happens server-side,
            which is the entire point — it exists so a caller holding a
            path does not have to reproduce the `id` derivation to find
            the entry. The runtime dashboard uses it to link a running
            `Runtime.modelPath` back to its library entry.
      responses:
        '200':
          description: Every known model.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LibraryModelList'

  /v1/models/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
        description: |
          Opaque model handle from a list response. Derived from the
          model's normalized absolute path so it is stable across
          restarts, but opaque to callers — use `?path=` on the
          collection for reverse lookup rather than deriving it.
    get:
      tags: [models]
      operationId: getModel
      summary: Read one model, with its full metadata.
      responses:
        '200':
          description: The model.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LibraryModel'
        '404':
          $ref: 'components/common.yaml#/components/responses/Problem'
    delete:
      tags: [models]
      operationId: forgetModel
      summary: Forget a missing model and the profiles saved against it.
      description: |
        **No file is ever touched.** This deletes the library's own
        record — which is to say the profiles, the only thing it
        persists.

        Refused for a model that is still on disk. A present model
        cannot meaningfully be forgotten: the next scan finds it again,
        so a delete that appeared to work would be a lie. Only a
        `missing` entry can be dismissed, which makes this the "yes, I
        did move that model and I do not want its old settings back"
        button and nothing else.
      responses:
        '204':
          description: Entry forgotten.
        '404':
          $ref: 'components/common.yaml#/components/responses/Problem'
        '409':
          description: |
            The model is present on disk. Nothing was deleted.
          content:
            application/problem+json:
              schema:
                $ref: 'components/common.yaml#/components/schemas/Problem'

  # -------- Profiles --------

  /v1/models/{id}/profiles:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
    get:
      tags: [profiles]
      operationId: listProfiles
      summary: Every saved launch profile for one model.
      responses:
        '200':
          description: The model's profiles, default first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelProfileList'
        '404':
          $ref: 'components/common.yaml#/components/responses/Problem'
    post:
      tags: [profiles]
      operationId: createProfile
      summary: Save a new launch profile against a model.
      description: |
        `flags` are stored as given and **not validated here** — the
        engine adapter's `flagSchema` on the agent is the validator,
        and it runs when a runtime is actually created. A profile is
        allowed to be wrong; a runtime is not.

        Creating a profile with `default: true` clears the flag on
        whichever profile held it. The first profile saved for a model
        becomes its default whether or not it asks to be.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModelProfileSpec'
      responses:
        '201':
          description: Profile saved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelProfile'
        '400':
          description: |
            Malformed profile — no name, an unknown `engine`, or
            `flags` that are not a flat object.
          content:
            application/problem+json:
              schema:
                $ref: 'components/common.yaml#/components/schemas/Problem'
        '404':
          $ref: 'components/common.yaml#/components/responses/Problem'
        '409':
          description: A profile with that name already exists for this model.
          content:
            application/problem+json:
              schema:
                $ref: 'components/common.yaml#/components/schemas/Problem'

  /v1/models/{id}/profiles/{profileId}:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      - in: path
        name: profileId
        required: true
        schema:
          type: string
    get:
      tags: [profiles]
      operationId: getProfile
      summary: Read one launch profile.
      responses:
        '200':
          description: The profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelProfile'
        '404':
          $ref: 'components/common.yaml#/components/responses/Problem'
    put:
      tags: [profiles]
      operationId: replaceProfile
      summary: Replace a launch profile.
      description: |
        A whole-document replace rather than a merge, deliberately, and
        the one place this component departs from the `PATCH` shape used
        for config everywhere else. `flags` is a document: with merge
        semantics there is no way to express *removing* a flag, and
        "why is `--n-gpu-layers` still on the command line after I
        deleted it" is a bug report nobody should have to file.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModelProfileSpec'
      responses:
        '200':
          description: Updated profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelProfile'
        '400':
          $ref: 'components/common.yaml#/components/responses/Problem'
        '404':
          $ref: 'components/common.yaml#/components/responses/Problem'
        '409':
          description: Another profile for this model already has that name.
          content:
            application/problem+json:
              schema:
                $ref: 'components/common.yaml#/components/schemas/Problem'
    delete:
      tags: [profiles]
      operationId: deleteProfile
      summary: Delete a launch profile.
      description: |
        Deleting the default promotes the next profile by creation
        order, if there is one. Running runtimes are unaffected — a
        profile is a template, and nothing holds a reference to it once
        a runtime is declared.
      responses:
        '204':
          description: Profile deleted.
        '404':
          $ref: 'components/common.yaml#/components/responses/Problem'

  /v1/models/{id}/fit:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [guidance]
      operationId: getModelFit
      summary: Will this model I already own run here, and at what context?
      description: |
        The same computation the catalogue applies to a download
        candidate, pointed at a model already on the disk — where it can
        use the metadata the scan already read instead of estimating,
        so `basis` is `metadata` rather than `estimate`.

        Two things it answers that the library browser cannot: whether a
        model that fits at 8k still fits at 128k, and what the actual
        arithmetic was. Both matter because the trained context of a
        current model can be 262144 and almost nobody can serve that —
        the model's declared context and the context this host can hold
        are different numbers, which is M2's Trap 7 restated in the one
        place it has consequences.

        `vramBytes` and `ramBytes` override the detected budget. That is
        how a caller scores a model against **another** host's memory,
        which is the only honest answer in a multi-host deployment where
        the GPU is in a different building.
      parameters:
        - name: contextLength
          in: query
          schema:
            type: integer
            minimum: 1
          description: |
            Defaults to the configured `guidanceContextLength`. Pass
            the model's own `contextLength` to ask "can I serve what
            this was trained for".
        - name: kvCacheType
          in: query
          schema:
            $ref: '#/components/schemas/KvCacheType'
        - name: vramBytes
          in: query
          schema:
            type: integer
            minimum: 0
          description: |
            Override the detected VRAM budget. Sets `budget.source` to
            `override`, so a UI can say the verdict is about a machine
            it did not measure.
        - name: ramBytes
          in: query
          schema:
            type: integer
            minimum: 0
          description: Override the detected host-memory budget.
      responses:
        '200':
          description: The verdict and the arithmetic behind it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelFit'
        '404':
          $ref: 'components/common.yaml#/components/responses/Problem'
        '409':
          $ref: 'components/common.yaml#/components/responses/Problem'

  # -------- Scan --------

  /v1/scan:
    get:
      tags: [scan]
      operationId: getScan
      summary: State of the current or most recent scan.
      description: |
        Poll this while `state` is `scanning`. When it settles, this is
        the record of what the last walk found, what it passed over and
        why, and which roots could not be read — which is the first
        thing to look at when a model the operator can see in Explorer
        is not in the library.

        `state: idle` on a fresh start, before anything has been
        scanned.
      responses:
        '200':
          description: Scan state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Scan'
    post:
      tags: [scan]
      operationId: startScan
      summary: Walk the configured roots.
      description: |
        Returns immediately; poll `GET /v1/scan` for progress. Reading
        GGUF metadata costs tens of milliseconds per model warm and a
        10 MB read cold, so a full library is seconds of work and does
        not belong on a request the UI is waiting on.

        Incremental by default: a file whose `(path, size, mtime)` is
        unchanged keeps its cached metadata and is never opened. Send
        `full: true` to re-read everything, which is the escape hatch
        for when the metadata reader itself has got smarter since the
        last scan.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScanRequest'
      responses:
        '202':
          description: Scan started.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Scan'
        '409':
          description: |
            A scan is already running. There is only ever one, and
            starting a second would double the disk cost to reach the
            same answer.
          content:
            application/problem+json:
              schema:
                $ref: 'components/common.yaml#/components/schemas/Problem'
    delete:
      tags: [scan]
      operationId: cancelScan
      summary: Cancel a scan in flight.
      description: |
        Stops the walk. Models already found keep their entries — a
        partial scan is not rolled back, because what it learned is
        still true. The result reports `state: cancelled` so nobody
        mistakes a short list for a complete one.
      responses:
        '200':
          description: Cancellation requested.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Scan'
        '409':
          description: No scan is running.
          content:
            application/problem+json:
              schema:
                $ref: 'components/common.yaml#/components/schemas/Problem'

  # -------- Catalogue --------

  /v1/catalogue/search:
    get:
      tags: [catalogue]
      operationId: searchCatalogue
      summary: Search the upstream model catalogue.
      description: |
        The answer to "let me just go to the dumpster fire UI that is
        HuggingFace… no search page with summaries, just an autocomplete
        list."

        **Repos, not candidates.** A result is one repository with its
        publisher, popularity and tags — no file sizes and no fit
        verdicts, because the upstream search response does not carry
        sizes and getting them costs one extra call *per repo*. Sizes,
        quant options and guidance all live on
        `GET /v1/catalogue/model`, which is the screen where the
        operator has picked something and a per-repo call is warranted.

        **Debounce this.** Upstream allows 500 API requests per 300
        seconds and search-as-you-type will exceed that inside two
        minutes. Responses are cached server-side for a short window;
        the client is still expected not to fire on every keystroke.
      parameters:
        - name: q
          in: query
          schema:
            type: string
          description: |
            Free-text query, passed to upstream's own search. Omit to
            browse by `sort` alone, which is how the "what is popular
            right now" landing view works.
        - name: format
          in: query
          schema:
            $ref: 'components/common.yaml#/components/schemas/ModelFormat'
          description: |
            Restrict to repos serving this format. `gguf` maps to
            upstream's `gguf` filter; `safetensors` is inferred from
            library and tag metadata and is therefore approximate — a
            repo can hold both.
        - name: author
          in: query
          schema:
            type: string
          description: |
            Publisher, e.g. `unsloth`. Worth a first-class parameter
            because "the quant publisher I trust" is how people
            actually navigate this catalogue.
        - name: sort
          in: query
          schema:
            $ref: '#/components/schemas/CatalogueSort'
        - name: direction
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: desc
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
        - name: cursor
          in: query
          schema:
            type: string
          description: |
            Opaque continuation token from a previous response's
            `nextCursor`. Cursor-based rather than offset because
            upstream paginates with an opaque cursor in a `Link` header
            and there is no page number to pass through.
      responses:
        '200':
          description: A page of results.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogueSearchPage'
        '502':
          $ref: 'components/common.yaml#/components/responses/Problem'
        '503':
          $ref: 'components/common.yaml#/components/responses/Problem'

  /v1/catalogue/model:
    get:
      tags: [catalogue]
      operationId: getCatalogueModel
      summary: One upstream repo, its download candidates, and what will fit.
      description: |
        The discovery screen. **Guidance and discovery are the same
        response**, deliberately: the moment an operator is choosing
        between `Q3_K_S` and `Q2_K_M` is the moment they need to be
        told which one their machine can run, and a UI that has to join
        two calls to say so will ship without the second one.

        The work this does that a raw file listing does not:

        * **Groups 30 files into 25 candidates.** Verified on a real
          repo: shards are summed into one candidate, and the vision
          projectors, the imatrix calibration file and the MTP draft
          model are pulled out of the candidate list into
          `projectors` / `otherFiles`. A screen that lists `.gguf`
          files offers four things that cannot be launched and one that
          is half a model.
        * **Scores every candidate** against detected memory at
          `contextLength`, with the arithmetic attached.
        * **Computes bits per weight** from size and parameter count —
          the one number that makes `IQ2_S`, `Q2_K` and `UD-Q3_K_XL`
          comparable when their names come from three different
          upstream naming schemes.
        * **Says what the operator already owns**, by path, so a 16 GB
          download of a file already on the disk is visible before it
          starts rather than after.

        The `repo` is a query parameter because it contains a slash and
        may be one or two segments (`unsloth/Qwen3.8-27B-GGUF`, but
        also `gpt2`). A path segment would need `%2F`, which
        intermediaries mangle — and every UI call to this component
        goes through the agent's proxy.
      parameters:
        - name: repo
          in: query
          required: true
          schema:
            type: string
          description: Upstream repo id, e.g. `unsloth/Qwen3.8-27B-GGUF`.
        - name: revision
          in: query
          schema:
            type: string
            default: main
          description: |
            Branch, tag or commit. The response reports the
            `resolvedCommit` it landed on, because `main` moves —
            repos are requantized and re-uploaded under the same
            filenames.
        - name: contextLength
          in: query
          schema:
            type: integer
            minimum: 1
          description: |
            Context to score the candidates at. Defaults to the
            configured `guidanceContextLength`. This is the parameter
            the UI puts behind a slider: watching the recommendation
            walk down the quant list as context grows *is* the
            guidance.
        - name: kvCacheType
          in: query
          schema:
            $ref: '#/components/schemas/KvCacheType'
      responses:
        '200':
          description: The repo, its candidates, and the guidance.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogueModel'
        '404':
          $ref: 'components/common.yaml#/components/responses/Problem'
        '502':
          $ref: 'components/common.yaml#/components/responses/Problem'
        '503':
          $ref: 'components/common.yaml#/components/responses/Problem'

  /v1/catalogue/model/card:
    get:
      tags: [catalogue]
      operationId: getCatalogueCard
      summary: The model card prose.
      description: |
        The README, verbatim, as Markdown — 7–10 KB for a typical repo.
        Separate from `GET /v1/catalogue/model` because it is a separate
        upstream fetch and a client showing a collapsed "about this
        model" panel should not pay for it until the panel opens.

        This is the "with summaries" half of the search complaint.
        Returned as untrusted Markdown: it is written by whoever
        uploaded the model, so a renderer must not execute anything in
        it.
      parameters:
        - name: repo
          in: query
          required: true
          schema:
            type: string
        - name: revision
          in: query
          schema:
            type: string
            default: main
      responses:
        '200':
          description: The card.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogueCard'
        '404':
          $ref: 'components/common.yaml#/components/responses/Problem'
        '502':
          $ref: 'components/common.yaml#/components/responses/Problem'

  /v1/catalogue/model/preflight:
    get:
      tags: [catalogue]
      operationId: preflightCatalogueFile
      summary: Read one remote file's real metadata before downloading it.
      description: |
        Reads the candidate's own metadata **over HTTP Range**, without
        downloading the model, and re-scores the fit from it.

        Measured on a 16.5 GB GGUF: the KV block is at the front of the
        file, 10.9 MB of it, fetched in under a second — **0.07% of the
        file** — and it yields the machine-readable quant
        (`general.file_type`), the layer count, the KV head count and
        key/value lengths, and the trained context. Safetensors is two
        orders cheaper: an 8-byte read gives the header length and a
        second read gives an exact parameter count.

        Why it exists: without it, remote quant identification is
        filename-derived, and the filename is exactly what
        `GET /v1/models` refuses to trust for a *local* model. This
        holds a candidate to the same standard before 16 GB is spent on
        it — and for a hybrid-attention model it is the difference
        between a KV-cache estimate that is right and one that is
        4.1× too large.

        **Explicit, never automatic.** It costs upstream bandwidth per
        call, so it is for the one candidate the operator has settled
        on. Firing it across a listing would be ~270 MB for one repo.
      parameters:
        - name: repo
          in: query
          required: true
          schema:
            type: string
        - name: revision
          in: query
          schema:
            type: string
            default: main
        - name: file
          in: query
          required: true
          schema:
            type: string
          description: |
            Repo-relative path of the file to read — for a split
            candidate, the **first** shard, which carries the whole
            KV block (verified: shard 1 of a 2-shard BF16 model gave
            the full metadata).
        - name: contextLength
          in: query
          schema:
            type: integer
            minimum: 1
        - name: kvCacheType
          in: query
          schema:
            $ref: '#/components/schemas/KvCacheType'
      responses:
        '200':
          description: What the file says about itself.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CataloguePreflight'
        '404':
          $ref: 'components/common.yaml#/components/responses/Problem'
        '502':
          $ref: 'components/common.yaml#/components/responses/Problem'
        '503':
          $ref: 'components/common.yaml#/components/responses/Problem'

  # -------- Downloads --------

  /v1/downloads:
    get:
      tags: [downloads]
      operationId: listDownloads
      summary: Every download, in flight or finished.
      description: |
        Records persist after they finish so the operator can see what
        arrived, where it went, and which library entry it became.
        `DELETE` is what forgets one.
      responses:
        '200':
          description: The downloads.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DownloadList'
    post:
      tags: [downloads]
      operationId: startDownload
      summary: Fetch a model into a directory the operator chose.
      description: |
        A collection rather than M1's singleton install: several
        downloads can be queued, and `maxConcurrentDownloads` (default
        1) decides how many transfer at once. Two 40 GB fetches sharing
        one link both finish later than one after the other, and the
        progress bar people watch is the one they started first.

        **One job, N files.** A split GGUF is 2–9 files, a multimodal
        model is a quant plus a projector, and a safetensors model is a
        directory of which nothing is optional. "Download this model" is
        one operator action, so it is one record with per-file progress
        inside it.

        The destination is resolved and reported **before a byte
        moves** — root plus layout plus the upstream filename — because
        the one thing this component must never do is put a file
        somewhere the operator did not choose.

        Responds 202 with the record in `queued`; poll
        `GET /v1/downloads/{id}`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DownloadSpec'
      responses:
        '202':
          description: Accepted; the transfer runs in the background.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Download'
        '400':
          $ref: 'components/common.yaml#/components/responses/Problem'
        '409':
          $ref: 'components/common.yaml#/components/responses/Problem'
        '507':
          $ref: 'components/common.yaml#/components/responses/Problem'

  /v1/downloads/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [downloads]
      operationId: getDownload
      summary: One download's progress.
      responses:
        '200':
          description: The record.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Download'
        '404':
          $ref: 'components/common.yaml#/components/responses/Problem'
    delete:
      tags: [downloads]
      operationId: cancelDownload
      summary: Cancel in flight, or forget a finished record.
      description: |
        Cancelling stops the transfer and **removes the `.part`
        file**. That is the one file on disk this component will
        delete, and the reason it may: a `.part` is ours, created as a
        side effect of a job the operator just abandoned. A completed
        model file is the operator's and is never touched — the same
        guarantee `DELETE /v1/models/{id}` makes.

        To keep the partial bytes for later, `pause` instead.
      responses:
        '204':
          description: Cancelled and forgotten.
        '404':
          $ref: 'components/common.yaml#/components/responses/Problem'

  /v1/downloads/{id}/pause:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      tags: [downloads]
      operationId: pauseDownload
      summary: Stop transferring, keep the partial file.
      description: |
        The `.part` stays on disk and the record goes `paused`. A paused
        download shows up in the next scan as `incomplete_download`,
        which is the reason M2 reserved for exactly this.
      responses:
        '200':
          description: Paused.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Download'
        '404':
          $ref: 'components/common.yaml#/components/responses/Problem'
        '409':
          $ref: 'components/common.yaml#/components/responses/Problem'

  /v1/downloads/{id}/resume:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      tags: [downloads]
      operationId: resumeDownload
      summary: Continue a paused or failed download.
      description: |
        Runs the same loop the automatic retry runs: re-resolve
        upstream, compare the remote digest and size against what the
        record stored, and continue from the byte count on disk with a
        `Range` request.

        **The comparison is the load-bearing step.** When the digest
        disagrees the remote file changed under the partial, and the
        only correct move is to discard the partial and start over,
        which this reports through `restartedFromZero`. Uploaders
        requantize under the same filename; appending the tail of a new
        file to the head of an old one yields exactly the right number
        of bytes and a corrupt model.

        Resuming is also what a *retry* is, and retries are automatic
        and bounded — a 40 GB transfer over a domestic link will meet a
        transient failure, and treating that as terminal makes the
        feature useless. `attempts` is visible so an operator can tell
        a flaky link from a dead one.
      responses:
        '200':
          description: Resuming.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Download'
        '404':
          $ref: 'components/common.yaml#/components/responses/Problem'
        '409':
          $ref: 'components/common.yaml#/components/responses/Problem'

  # -------- Guidance --------

  /v1/hardware:
    get:
      tags: [guidance]
      operationId: getHardware
      summary: What this host has to spend on a model.
      description: |
        Detected on **this component's host**, which is what makes the
        fit arithmetic possible and is also its limitation: in a
        multi-host deployment the GPU that will load the model may be
        somewhere else entirely. Hence `hostname` on the response, and
        the budget overrides on the fit endpoints.

        **Free is reported alongside total, and free is what scoring
        uses.** Measured on the dev box with nothing unusual running:
        2.9 GiB of a 32 GiB card was already held by the desktop, and a
        third of RAM was in use. Scoring against total tells the
        operator a model fits and then it OOMs; showing both lets them
        see what quitting something would buy.

        Detection is stdlib plus vendor CLIs — no new dependency, because
        every dependency this component gains has to be installed into
        the agent's venv as well.
      responses:
        '200':
          description: The host's memory and accelerators.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HostHardware'

  /v1/quants:
    get:
      tags: [guidance]
      operationId: getQuantTable
      summary: What the quant tiers mean.
      description: |
        Static reference content, identical for every model: tier →
        family, nominal bits per weight, what the `K` / `IQ` / `UD`
        naming conventions mean, and where on the curve quality starts
        to go.

        Served from the component rather than hardcoded in the UI so
        there is one copy to update as upstream's quant families churn,
        and so a headless install can print it.

        **It contains no per-model judgement and never will.** The
        relative quality of `IQ2_S` against `Q2_K` is upstream research,
        model-dependent, and not ours to invent — a fabricated quality
        score is worse than no score, which is the same rule that makes
        an unrecognised `general.file_type` degrade to "here is the
        number". The per-model numbers this component *will* state are
        size, bits per weight, and whether it fits.
      responses:
        '200':
          description: The tiers.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuantTable'

  # -------- Config --------

  /v1/config:
    get:
      tags: [config]
      operationId: getConfig
      summary: Read the library's current effective config.
      responses:
        '200':
          description: Current config values.
          content:
            application/json:
              schema:
                $ref: 'components/common.yaml#/components/schemas/ConfigDocument'
    patch:
      tags: [config]
      operationId: updateConfig
      summary: Update config fields.
      description: |
        Partial update; absent keys are unchanged, `null` reverts a key
        to its default. Editing the roots does not itself trigger a
        walk — `POST /v1/scan` is a separate, explicit act, because a
        `PATCH` that quietly starts minutes of disk work is a `PATCH`
        that times out.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: 'components/common.yaml#/components/schemas/ConfigUpdateRequest'
      responses:
        '200':
          description: Update outcome, per key.
          content:
            application/json:
              schema:
                $ref: 'components/common.yaml#/components/schemas/ConfigUpdateResult'

  /v1/config/schema:
    get:
      tags: [config]
      operationId: getConfigSchema
      summary: UI-renderable description of every editable field.
      description: |
        The model roots are a `path_list` field here, which is the whole
        reason they are config rather than a resource of their own: the
        same generic editor that renders every other component's
        settings renders them, with no library-specific UI code.
      responses:
        '200':
          description: Config schema.
          content:
            application/json:
              schema:
                $ref: 'components/common.yaml#/components/schemas/ConfigSchema'

  /v1/config/test:
    post:
      tags: [config]
      operationId: testConfig
      summary: Check that the configured model roots are readable.
      description: |
        Stats each configured root and reports which ones cannot be
        read, without walking them — this answers "is this path right"
        in milliseconds, which is what an operator typing a path into a
        form needs. It does not scan, and finding zero models in a
        readable root is not a failure.

        Send overrides to check a path before committing it, which is
        the "Test" button next to a directory picker.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: 'components/common.yaml#/components/schemas/ConfigTestRequest'
      responses:
        '200':
          description: |
            Test outcome. `ok: false` when any configured root is
            missing or unreadable.
          content:
            application/json:
              schema:
                $ref: 'components/common.yaml#/components/schemas/ConfigTestResult'

  # -------- Meta --------

  /v1/admin/restart:
    post:
      tags: [meta]
      operationId: restart
      summary: Schedule a process restart.
      description: |
        Exits shortly after responding and relies on the agent to
        respawn. A scan in flight is abandoned; its findings so far
        persist, and the next scan is incremental over them.
      responses:
        '202':
          description: Restart scheduled.
          content:
            application/json:
              schema:
                $ref: 'components/common.yaml#/components/schemas/RestartResult'

  /healthz:
    get:
      tags: [meta]
      operationId: healthz
      summary: Liveness and readiness.
      security: []
      description: |
        Reports `degraded` when a **configured** root cannot be read —
        the operator asked for something that is not working, and a
        removable drive or a dead network share is exactly what this is
        for.

        Having **no** roots configured is `ok`, not degraded. That is a
        fresh install waiting for the wizard, not a fault, and a health
        surface that cries about it on day one teaches people to ignore
        it. `details.rootsConfigured` carries the count either way.

        Neither case ever prevents startup: bad config never crashes a
        component, and the config endpoints stay reachable so the UI can
        fix it.
      responses:
        '200':
          description: Health status.
          content:
            application/json:
              schema:
                $ref: 'components/common.yaml#/components/schemas/Health'

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Session token from the agent's `POST /v1/auth/login`, or a
        component service token threaded in at spawn time. Reads are
        open to either; mutations are operator-only.

  schemas:

    # -------- Models --------

    LibraryModelList:
      type: object
      required:
        - models
      properties:
        models:
          type: array
          items:
            $ref: '#/components/schemas/LibraryModel'
        lastScanAt:
          type: string
          format: date-time
          description: |
            When the walk that produced this list finished. Omitted
            before the first scan. Present here as well as on `Scan` so
            a browser rendering the list can say how stale it is
            without a second call.

    LibraryModel:
      type: object
      description: |
        One launchable model on this host.

        The format-independent facts are here; exactly one of `gguf` or
        `safetensors` carries the rest. That split is not tidiness — a
        quant tier is a GGUF concept and an exact parameter count is a
        safetensors one, and flattening both into one object would
        produce a schema half of whose fields are null for any given
        model.
      required:
        - id
        - path
        - format
        - name
        - status
      properties:
        id:
          type: string
          description: |
            Stable handle for this model: the first 16 hex characters of
            the SHA-256 of its normalized absolute path. Normalized
            means absolute, canonical separators, case-folded on
            Windows, and **symlinks left unresolved**.

            Derived rather than random so it survives restarts, since
            profiles are keyed to it. **Opaque to callers** — the
            normalization rules are fiddly enough that a client deriving
            it independently would sooner or later compute a handle the
            server does not recognise and get an unexplained 404. Use
            `GET /v1/models?path=` instead.

            Not content addressing: no byte of the model is read to
            produce it. Hashing 40 GB on every scan is not on the table,
            and a content-derived identity would change when nothing the
            operator did changed.
        path:
          type: string
          description: |
            Absolute path, verbatim, in the operator's own layout — the
            model's real identity, reported in full because the `id` is
            not human-readable and nothing here should be hidden behind
            a handle.

            A `.gguf` file for GGUF (the **first** shard when split), a
            directory for safetensors. This is what goes on a runtime's
            `modelPath`.
        root:
          type: string
          description: |
            The configured root this model was found under. Two roots
            can hold the same filename, so this is how the UI
            disambiguates two entries that otherwise read alike — and
            how it tells the operator which drive to go plug back in.
        format:
          $ref: 'components/common.yaml#/components/schemas/ModelFormat'
        name:
          type: string
          description: |
            The filename with its extension stripped, or the directory
            name for safetensors. **Not derived from metadata**: the
            file's own name is what the operator downloaded, what they
            call it, and what `Runtime.modelAlias` defaults to — so
            plainly-named files mean the obvious name is already the
            right one.
        displayName:
          type: string
          description: |
            The model's self-declared name from its metadata
            (`general.name` for GGUF), when it has one and it differs
            from `name`. Shown as a subtitle, never as the identity:
            metadata names are frequently the training-run name and
            collide across quants of one model.
        status:
          $ref: '#/components/schemas/ModelStatus'
        sizeBytes:
          type: integer
          minimum: 0
          description: |
            Total size of every file belonging to this model — all
            shards, and the projector when there is one. The number
            that answers "will this fit on the drive I am copying it
            to", which is why it is a sum rather than the weights file
            alone.
        fileCount:
          type: integer
          minimum: 1
          description: How many files make up this model. 1 for a plain single-file GGUF.
        architecture:
          type: string
          description: |
            Model architecture as the file declares it — `general.architecture`
            for GGUF, `model_type` from `config.json` for safetensors.
            Free-form on purpose: new architectures ship constantly and
            an enum here would reject models that work fine.
        contextLength:
          type: integer
          minimum: 0
          description: |
            Context length the **model** declares. Not what an engine
            will serve — that depends on the launch flags and available
            memory, and is reported by the agent as
            `RuntimeCapabilities.contextLength`. Both numbers are real
            and a UI that shows only this one tells a comfortable lie.
        parameters:
          type: integer
          minimum: 0
          description: |
            Exact parameter count, when the format gives one. Safetensors
            headers do (summed tensor shapes, from an ~11 KB read);
            **GGUF does not** — see `sizeLabel`. Optional because for
            most local models it is genuinely unavailable, and a schema
            that required it would be unfillable for every GGUF in
            existence.
        sizeLabel:
          type: string
          description: |
            The author's own size label, e.g. `"27B"`
            (`general.size_label`). A display string, not a number, and
            not always present or accurate — it is what the person who
            uploaded the file typed. For GGUF it is usually the only
            answer available to "how big is this model".
        capabilities:
          $ref: '#/components/schemas/ModelCapabilities'
        files:
          type: array
          items:
            $ref: '#/components/schemas/ModelFile'
          description: |
            Every file that belongs to this model, with its role. This
            is what makes a sharded model legible as one thing, and what
            shows the operator that the 900 MB projector next to their
            model is accounted for rather than missed.
        gguf:
          $ref: '#/components/schemas/GgufDetail'
        safetensors:
          $ref: '#/components/schemas/SafetensorsDetail'
        profileCount:
          type: integer
          minimum: 0
          description: |
            How many launch profiles are saved against this model. On
            the list so the browser can badge a tuned model without
            fetching every profile collection.
        firstSeenAt:
          type: string
          format: date-time
          description: When a scan first found this model.
        lastSeenAt:
          type: string
          format: date-time
          description: |
            When a scan last found it on disk. For a `missing` entry
            this is when it was last there, which is the only clue to
            what happened.
        modifiedAt:
          type: string
          format: date-time
          description: Filesystem mtime of the weights. Part of the incremental-rescan key.
        error:
          type: string
          description: |
            Why this entry is `unreadable` — a header that would not
            parse, a permission error, a truncated file. Named rather
            than dropped: a model the operator can see and we cannot
            explain is the worst of the three states.

    ModelStatus:
      type: string
      enum:
        - present
        - missing
        - unreadable
      description: |
        * `present` — found on disk and readable.
        * `missing` — not found by the last scan, but profiles are
          saved against it, so the entry survives. **Moving a model
          produces this**, plus a new entry at the new path: nothing
          guesses that a file which vanished from one root and appeared
          in another is the same file, because a wrong guess silently
          applies one model's tuning to another. The profiles stay here
          to be copied across by hand.
        * `unreadable` — the files are there and something about them
          did not work. `error` says what.

    ModelCapabilities:
      type: object
      description: |
        What the model's own metadata says it can do. Distinct from the
        agent's `RuntimeCapabilities`, which is read back off a
        *running* engine: this is a property of the file, available
        before anything is launched, and it is what the launch flags
        have to be chosen from.
      properties:
        chat:
          type: boolean
          description: |
            Text generation — the default assumption for a causal model.
            False for an embedding model.
        embedding:
          type: boolean
          description: |
            The model is a dedicated embedding model (a pooling type in
            its metadata, or non-causal attention). Load-bearing rather
            than informational: llama-server's own help says
            `--embedding` is "for use only with dedicated embedding
            models", and launching one of these as a chat model does not
            fail — it starts, serves, and returns nonsense.
        vision:
          type: boolean
          description: |
            A vision projector was found for this model, so it can take
            images. See `GgufDetail.projectorPath`.
        chatTemplate:
          type: boolean
          description: |
            The file embeds its own chat template. When false, something
            has to supply one at launch, and a model answering strangely
            with no template is a common and confusing failure.

    ModelFile:
      type: object
      description: One file belonging to a model, and what part it plays.
      required:
        - path
        - role
      properties:
        path:
          type: string
          description: Absolute path.
        role:
          $ref: '#/components/schemas/ModelFileRole'
        sizeBytes:
          type: integer
          minimum: 0

    ModelFileRole:
      type: string
      enum:
        - weights
        - shard
        - projector
        - config
        - tokenizer
        - index
        - other
      description: |
        * `weights` — the file named on the launch line. Exactly one per
          model: the single `.gguf`, the first shard of a split one, or
          the primary safetensors file.
        * `shard` — the second through Nth part of a split model.
        * `projector` — a vision projector (`general.type: mmproj`),
          which is why it is a role here and not a model of its own.
        * `config` / `tokenizer` / `index` — safetensors sidecars.
        * `other` — present in the model's directory, counted in
          `sizeBytes`, not classified.

    GgufDetail:
      type: object
      description: |
        GGUF-specific metadata, read from the file's KV block. Present
        iff `format` is `gguf`.
      properties:
        quantization:
          type: string
          description: |
            Human-readable quant tier, e.g. `"Q4_K_M"`. The vocabulary
            the operator's question is actually phrased in — "Q3_K_S vs
            2Q_K_M? No one knows" — and M3's guidance hangs off it.
        fileType:
          type: integer
          description: |
            Raw `general.file_type` enum value, reported alongside the
            label rather than instead of it. It **does** distinguish the
            K-quant mixtures (verified: 14 is `Q4_K_S`, 15 is `Q4_K_M`),
            so the label is machine-read rather than guessed from a
            filename.

            Reported raw because the quant families churn — imatrix
            variants, MXFP4, whatever is next — and a reader will meet
            values it does not know. The rule for those is to surface
            the number and the filename-derived label, never to map an
            unrecognised value onto a plausible neighbour: guidance
            built on a guess is worse than no guidance.
        quantizationDisagrees:
          type: boolean
          description: |
            True when the label derived from `fileType` and the label in
            the filename are not the same. Both are then reported and
            neither is silently preferred, because either one can be the
            wrong one — a requantized file keeps its old name more often
            than a metadata field is wrong, but not always.
        ggufVersion:
          type: integer
          description: GGUF container version (3 for everything current).
        shardCount:
          type: integer
          minimum: 1
          description: |
            Number of `…-0000N-of-0000M.gguf` parts. 1 for a plain file.
            Only the first is on the launch line; the rest are `shard`
            files.
        vocabSize:
          type: integer
          minimum: 0
          description: |
            Token count. Worth reporting for its own sake and because it
            explains the scan cost: the tokenizer lives in the KV block,
            so a 248k-token vocab means ~10.9 MB of metadata to walk
            past before the quant can be read.
        projectorPath:
          type: string
          description: |
            Absolute path to the vision projector found beside this
            model, if any. Becomes `--mmproj` on the launch line.
            llama-server can also find it unaided, but it is reported
            because "this model can see" is a fact the browser should
            show and a profile should be able to override.
        recommendedSampling:
          $ref: '#/components/schemas/RecommendedSampling'
        metadata:
          type: object
          additionalProperties: true
          description: |
            Selected raw KV pairs, verbatim, minus the tokenizer arrays.
            An escape hatch for the long tail — architecture-prefixed
            keys grow with upstream, and a reader that only ever exposes
            the fields it was written to understand goes blind on every
            model newer than itself.

    SafetensorsDetail:
      type: object
      description: |
        Safetensors-specific metadata. Present iff `format` is
        `safetensors`. **No quant fields** — a safetensors model is
        sized, not tiered.
      properties:
        dtype:
          type: string
          description: |
            Dominant tensor dtype as the header declares it, e.g.
            `"BF16"`, `"F16"`, `"F32"`. The nearest thing to a quant
            tier here, and it is a precision rather than a scheme.
        shardCount:
          type: integer
          minimum: 1
          description: |
            Number of `model-0000N-of-0000M.safetensors` files. Unlike
            GGUF, all of them are loaded together and none is "the"
            file — the directory is the model.
        repoId:
          type: string
          description: |
            HuggingFace repo this came from, e.g.
            `"sentence-transformers/all-MiniLM-L6-v2"`, when the layout
            says so (a `models--<org>--<name>` cache directory, or
            `config.json` naming it).
        revision:
          type: string
          description: |
            Snapshot revision, when the model sits in a HuggingFace
            cache. Those caches hold **one directory per revision**, so
            without this two snapshots of one model are two
            indistinguishable entries. The revision named by the
            cache's own `refs/main` is the current one; the others are
            reported as skipped older revisions rather than as models.
        configPath:
          type: string
          description: Absolute path to `config.json`, the file that made this a model.

    RecommendedSampling:
      type: object
      description: |
        Sampling parameters the model's author put in the file
        (`general.sampling.*` in GGUF). **Reported, never applied.**

        The locked rule is that the gateway owns every
        LLM-output-affecting parameter and no component substitutes a
        local default; that rule is unchanged. But the file having an
        opinion is real information, and dropping it means the operator
        has to go read the model card to find out. Whether anything can
        adopt these with one click is a gateway decision, not a library
        one.
      properties:
        temperature:
          type: number
        topK:
          type: integer
        topP:
          type: number

    # -------- Profiles --------

    ModelProfileList:
      type: object
      required:
        - profiles
      properties:
        profiles:
          type: array
          items:
            $ref: '#/components/schemas/ModelProfile'

    ModelProfileSpec:
      type: object
      description: |
        Declarative half of a profile — the launch settings that worked
        for one model. Used for create and replace bodies.

        Every field name here is a `RuntimeSpec` field name, on purpose:
        composing a profile into a runtime declaration is a copy, not a
        translation, which is what lets the launch flow live in the
        caller and keep this component free of engine knowledge.
      required:
        - name
        - engine
      properties:
        name:
          type: string
          minLength: 1
          description: |
            Operator-supplied label, unique per model — "long context",
            "cpu only", "gpu 1". Names rather than numbers because the
            reason a profile exists is the thing worth remembering about
            it.
        default:
          type: boolean
          default: false
          description: |
            The profile offered first when launching this model.
            Setting it clears the flag on whichever profile held it; the
            first profile saved for a model gets it whether it asks or
            not.
        engine:
          $ref: 'components/common.yaml#/components/schemas/EngineKind'
          description: |
            Which engine these flags are written for. Flags are not
            portable between engines, so a profile is only ever offered
            for the engine it names — and a model whose format no
            installed engine can load has nowhere to use one at all. The
            engine side of that answer is
            `EngineDescriptor.modelFormats` on the agent.
        flags:
          type: object
          additionalProperties: true
          description: |
            Curated engine flags, keyed by the field names in the
            adapter's `flagSchema` — context size, GPU layers, batch
            size, parallel slots. Copied onto `RuntimeSpec.flags`
            verbatim.

            **Stored, not validated.** The validator is the agent's
            adapter schema, at runtime-creation time. A profile is
            allowed to be wrong; the runtime that uses it is not, and
            that is where an unknown key becomes a 400. Validating in
            both places would mean two copies of engine knowledge and
            one of them going stale.
        extraArgs:
          type: array
          items:
            type: string
          description: |
            Verbatim extra arguments, for the long tail a curated
            surface always misses. `--lora` lives here, which is why
            adapters are not modelled as their own thing yet.
        env:
          type: object
          additionalProperties:
            type: string
          description: |
            Extra environment for the engine process. This is where
            `CUDA_VISIBLE_DEVICES` goes, and therefore where the
            two-replicas-on-two-GPUs case comes from: the same profile
            twice with a different device pinned. It is also the
            strongest argument for profiles being plural.
        notes:
          type: string
          description: |
            Free text from the operator. Tuning a model is empirical and
            the reasoning evaporates — "OOMs above 24 layers on the
            3090" is worth more later than the flag value it explains.

    ModelProfile:
      type: object
      description: |
        A saved profile, as stored: the spec plus server-owned
        identifiers and timestamps.
      required:
        - id
        - name
        - engine
        - default
      properties:
        id:
          type: string
          description: Server-assigned profile id, unique within the model.
        name:
          type: string
        default:
          type: boolean
        engine:
          $ref: 'components/common.yaml#/components/schemas/EngineKind'
        flags:
          type: object
          additionalProperties: true
        extraArgs:
          type: array
          items:
            type: string
        env:
          type: object
          additionalProperties:
            type: string
        notes:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    # -------- Scan --------

    ScanRequest:
      type: object
      properties:
        full:
          type: boolean
          default: false
          description: |
            Re-read metadata for every model instead of trusting the
            `(path, size, mtime)` cache. Costs the full walk — tens of
            milliseconds per model, more cold — and exists for when the
            metadata reader has changed rather than the files.

    Scan:
      type: object
      description: |
        State of the current or most recent walk of the configured
        roots. A singleton: there is exactly one scan, and inventing job
        ids for something that has exactly one is worse than not.
      required:
        - state
      properties:
        state:
          $ref: '#/components/schemas/ScanState'
        full:
          type: boolean
          description: Whether this scan is ignoring the metadata cache.
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
        roots:
          type: array
          items:
            $ref: '#/components/schemas/ScanRoot'
          description: |
            Per-root outcome. A root that could not be read is reported
            here and does not abort the scan: one unplugged drive must
            not cost the operator every other model they own.
        currentPath:
          type: string
          description: |
            What is being read right now. Present while `scanning`, and
            the difference between a scan that is working and one that
            is wedged on a network share.
        filesScanned:
          type: integer
          minimum: 0
          description: Files examined so far, across all roots.
        modelsFound:
          type: integer
          minimum: 0
          description: Models in the library as of this scan.
        added:
          type: integer
          minimum: 0
          description: Models this scan saw for the first time.
        updated:
          type: integer
          minimum: 0
          description: Models whose metadata was re-read because the file changed.
        missing:
          type: integer
          minimum: 0
          description: |
            Previously-known models this scan did not find. They keep
            their entries and their profiles; see `ModelStatus`.
        skipped:
          type: array
          items:
            $ref: '#/components/schemas/SkippedPath'
          description: |
            Paths deliberately not treated as models, each with a
            reason. **The important half of the response.** Every
            not-a-model case is here — the projector beside a model, the
            second shard of a split file, an older revision in a
            HuggingFace cache — and the reason someone can find out why
            their model is not showing up. A scanner that silently drops
            what it did not understand is indistinguishable from a
            broken one.
        error:
          type: string
          description: 'Populated when `state` is `failed`.'

    ScanState:
      type: string
      enum:
        - idle
        - scanning
        - done
        - failed
        - cancelled
      description: |
        * `idle` — nothing has been scanned yet this install.
        * `scanning` — in flight; poll for progress.
        * `done` — completed. Individual roots may still have failed;
          check `roots`.
        * `failed` — the scan itself could not run, e.g. no roots are
          configured at all.
        * `cancelled` — stopped by `DELETE /v1/scan`. Whatever it found
          is kept and reported, but the list is not complete and this
          state is what says so.

    ScanRoot:
      type: object
      description: One configured root and how the walk went in it.
      required:
        - path
        - status
      properties:
        path:
          type: string
        status:
          type: string
          enum:
            - ok
            - missing
            - unreadable
            - pending
          description: |
            `missing` and `unreadable` are separate on purpose: a path
            that does not exist is usually a typo or an unplugged drive,
            and one that exists but cannot be read is a permission
            problem. They need different advice. `pending` means the
            walk has not reached this root yet.
        modelsFound:
          type: integer
          minimum: 0
        filesScanned:
          type: integer
          minimum: 0
        error:
          type: string

    SkippedPath:
      type: object
      description: A path the scan saw and deliberately did not make a model of.
      required:
        - path
        - reason
      properties:
        path:
          type: string
        reason:
          $ref: '#/components/schemas/SkipReason'
        detail:
          type: string
          description: |
            Specifics — which model a projector belongs to, which entry
            a shard is part of, what the header parser objected to.

    SkipReason:
      type: string
      enum:
        - projector
        - shard_member
        - adapter
        - older_revision
        - not_a_model
        - unreadable_header
        - unsupported_format
        - incomplete_download
      description: |
        Why a path is not an entry. Every value here is a real case
        found on a real disk, not a defensive placeholder:

        * `projector` — a vision projector (`general.type: mmproj`),
          which belongs to the model beside it. Nearly a gigabyte each
          on current models, so getting this wrong is visible.
        * `shard_member` — part 2..N of a split model, accounted for on
          the entry that owns part 1.
        * `adapter` — a LoRA or similar (`adapter_config.json` plus
          `adapter_model.safetensors`, and no base weights). Not
          modelled yet; `--lora` in `extraArgs` covers anyone who needs
          it now.
        * `older_revision` — a HuggingFace cache snapshot that is not
          the one `refs/main` names. Those caches keep one directory per
          revision, so without this a single model appears once per
          revision ever fetched.
        * `not_a_model` — infrastructure inside a HuggingFace cache
          (`blobs/`, `refs/`, and `.no_exist/`, which is a *negative*
          cache full of zero-byte files with real-looking names), or
          anything else structurally not a model.
        * `unreadable_header` — the file is there and the metadata would
          not parse. Reported rather than skipped silently.
        * `unsupported_format` — a model format with no scanner yet.
          MLX is the reserved case.
        * `incomplete_download` — a `.part` file from a download that
          is in flight, paused, or failed. No longer reserved: the
          downloader writes these into scanned roots by design, and a
          `paused` download is *expected* to leave one there. The
          matching `Download` record, if there is one, is what says
          whether it can be resumed; a `.part` with no record behind it
          is litter and can be deleted by hand.

    # -------- Catalogue --------

    CatalogueSort:
      type: string
      enum:
        - downloads
        - likes
        - trending
        - modified
        - created
      description: |
        Ordering for a catalogue search. `trending` is upstream's own
        trending score, which is the closest thing to "what is worth
        looking at this week" — and, honestly, the ranking most likely
        to surface a keyword-stuffed finetune above an official release.
        The index is upstream's; we can filter and describe better than
        their search page but we cannot fix what it ranks.

    CatalogueSearchPage:
      type: object
      required:
        - results
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/CatalogueSearchResult'
        nextCursor:
          type: string
          description: |
            Pass back as `cursor` for the next page. Absent on the last
            page. Opaque — it is upstream's own continuation token and
            carries no page arithmetic.
        cachedAt:
          type: string
          format: date-time
          description: |
            When this answer was fetched upstream. Present because
            results are cached for a short window to stay inside the
            500-request/300-second API budget, and a client showing
            popularity numbers should know they are minutes old.

    CatalogueSearchResult:
      type: object
      description: |
        One upstream repository. **No sizes and no fit verdict** — see
        `searchCatalogue`: upstream's search response carries neither
        and synthesizing them would cost a call per row.
      required:
        - repo
      properties:
        repo:
          type: string
          description: Full repo id, e.g. `unsloth/Qwen3.8-27B-GGUF`.
        owner:
          type: string
          description: |
            The publisher. Prominent on purpose — "which quant publisher
            do I trust" is how people navigate this catalogue, and it is
            the fastest signal that separates an official release from a
            reupload.
        name:
          type: string
        formats:
          type: array
          items:
            $ref: 'components/common.yaml#/components/schemas/ModelFormat'
          description: |
            What this repo appears to serve, from its tags and library
            metadata. Approximate at search time — a repo can hold both
            formats, and only the detail call reads the file list.
        gated:
          $ref: '#/components/schemas/GateKind'
        private:
          type: boolean
        downloads:
          type: integer
          minimum: 0
        likes:
          type: integer
          minimum: 0
        trendingScore:
          type: number
        pipelineTag:
          type: string
          description: Upstream's task label, e.g. `text-generation`.
        libraryName:
          type: string
        license:
          type: string
        tags:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time
        lastModified:
          type: string
          format: date-time
          description: |
            Worth showing next to popularity: a repo with millions of
            downloads and no change in a year is a different
            proposition from one updated last week.

    GateKind:
      type: string
      enum:
        - open
        - auto
        - manual
      description: |
        Whether upstream restricts the *bytes*. `open` is unrestricted;
        `auto` needs a token and one click-through on the model page;
        `manual` needs a human approval that can take days.

        A three-valued enum rather than upstream's own
        `false | "auto" | "manual"`, which would be a boolean-or-string
        union in every generated client for no gain. `open` is the
        normalization of `false`.

        The three cases are distinguished because a gated repo browses
        perfectly — metadata, file list, sizes and digests are all
        public — and **only the download 401s.** Warning about it on
        the detail screen is the difference between a legible
        prerequisite and a mysterious failure after the operator has
        chosen a quant and pressed the button.

    CatalogueModel:
      type: object
      description: |
        One upstream repo, resolved: what it is, what can be downloaded
        from it, and which of those this host can run.
      required:
        - repo
        - revision
        - candidates
      properties:
        repo:
          type: string
        owner:
          type: string
        name:
          type: string
        revision:
          type: string
          description: The revision that was asked for, e.g. `main`.
        resolvedCommit:
          type: string
          description: |
            The commit `revision` resolved to, from upstream's
            `X-Repo-Commit`. Reported because `main` moves — repos are
            requantized and re-uploaded under the same filenames — and
            a download pins this so a later resume can tell "the
            transfer broke" from "the file I was fetching is gone".
        gated:
          $ref: '#/components/schemas/GateKind'
        private:
          type: boolean
        downloads:
          type: integer
          minimum: 0
        likes:
          type: integer
          minimum: 0
        trendingScore:
          type: number
        license:
          type: string
        tags:
          type: array
          items:
            type: string
        pipelineTag:
          type: string
        libraryName:
          type: string
        createdAt:
          type: string
          format: date-time
        lastModified:
          type: string
          format: date-time
        formats:
          type: array
          items:
            $ref: 'components/common.yaml#/components/schemas/ModelFormat'
          description: Formats actually present in the file list.
        parameters:
          type: integer
          minimum: 0
          description: |
            Parameter count, when upstream states one. For a GGUF repo
            it comes from the hub's own repo-level metadata and is
            exact — which is what makes `bitsPerWeight` computable with
            no extra request, and is the inverse of the local case where
            a GGUF gives no parameter count at all.
        architecture:
          type: string
        contextLength:
          type: integer
          minimum: 0
          description: |
            Context the model was trained for, per upstream. Not what
            this host can serve — that is what `candidates[].fit`
            answers, at a context the caller chose.
        chatTemplate:
          type: boolean
          description: Whether upstream reports an embedded chat template.
        candidates:
          type: array
          items:
            $ref: '#/components/schemas/CatalogueCandidate'
          description: |
            The launchable choices, one per quant or per format variant,
            with shards already summed. **This is the list the operator
            picks from**, and it is materially shorter than the file
            list: one verified repo held 30 `.gguf` files and 25
            candidates.
        projectors:
          type: array
          items:
            $ref: '#/components/schemas/CatalogueFile'
          description: |
            Vision projectors offered by this repo, as their own list
            because a multimodal repo ships more than one precision of
            them and the operator picks — and because a projector is
            never a candidate on its own. Add the chosen one to the
            download's `files`.
        otherFiles:
          type: array
          items:
            $ref: '#/components/schemas/CatalogueFile'
          description: |
            Files in the repo that are neither candidates nor
            projectors: the imatrix calibration file, an MTP or draft
            model, documentation. Reported rather than hidden, for the
            same reason the scan reports `skipped` — a listing that
            silently drops files it did not understand is
            indistinguishable from one that is broken.
        totalSizeBytes:
          type: integer
          minimum: 0
          description: Every file in the repo summed. Rarely what anyone wants to download.
        recommended:
          $ref: '#/components/schemas/CatalogueRecommendation'
        warnings:
          type: array
          items:
            type: string
          description: |
            Things to say before a download starts: the repo is gated,
            nothing here fits, the only thing that fits is a very low
            quant, upstream metadata was unreadable so the fit is a
            size estimate.

    CatalogueCandidate:
      type: object
      description: |
        One downloadable, launchable choice. **Shards are already
        summed here** — scoring the file named on the launch line
        understates a split candidate by the size of every other shard
        (verified: 46.55 GiB for shard 1 of a model that is 50.90 GiB).
      required:
        - label
        - format
        - files
        - sizeBytes
      properties:
        label:
          type: string
          description: |
            What to show in the list: the quant tier for GGUF
            (`Q4_K_M`, `UD-IQ3_XXS`), or the variant directory for a
            safetensors repo.
        format:
          $ref: 'components/common.yaml#/components/schemas/ModelFormat'
        files:
          type: array
          items:
            $ref: '#/components/schemas/CatalogueFile'
          description: |
            Every file this candidate needs, in the order a download
            should fetch them. For a split GGUF, all shards. For
            safetensors, the weights **and** the sidecars — `config.json`
            and the tokenizer files are not optional. Pass these
            straight to `DownloadSpec.files`.
        sizeBytes:
          type: integer
          minimum: 0
          description: Sum over `files`. The number the fit verdict is computed from.
        quantization:
          type: string
          description: |
            Quant tier, e.g. `Q4_K_M`. GGUF only — a safetensors model
            is sized, not tiered.
        quantSource:
          type: string
          enum: [filename, metadata]
          description: |
            **Where the tier came from, and this field is load-bearing.**
            `filename` at listing time, because the hub exposes no
            per-file quant and the name is all there is — the very thing
            a local scan refuses to trust. `metadata` after a preflight
            has read `general.file_type` over HTTP Range.

            Fit is computed from `sizeBytes`, which is authoritative
            either way, so a mislabelled file changes what is displayed
            and never what is promised.
        bitsPerWeight:
          type: number
          description: |
            `sizeBytes × 8 / parameters`. The one quality-adjacent
            number here that is arithmetic rather than judgement, and
            the only thing that makes three upstream naming schemes
            comparable: on one verified repo it ordered all 25
            candidates monotonically from 1.81 to exactly 16.00 for
            BF16 — that last value being the check that the parameter
            count is real.

            Absent when upstream states no parameter count.
        dtype:
          type: string
          description: Dominant tensor dtype, for safetensors candidates.
        fit:
          $ref: '#/components/schemas/Fit'
        alreadyOwned:
          $ref: '#/components/schemas/AlreadyOwned'
        gated:
          type: boolean
          description: |
            Convenience copy of the repo's gate, on the row the operator
            is about to click.

    CatalogueFile:
      type: object
      description: One file in an upstream repo, with whatever it can be verified against.
      required:
        - path
        - sizeBytes
      properties:
        path:
          type: string
          description: |
            Repo-relative path, which is **not** a filename: split
            quants live in subdirectories (`BF16/…-00001-of-00002.gguf`).
            The download writes the basename.
        sizeBytes:
          type: integer
          minimum: 0
        sha256:
          type: string
          description: |
            Content digest, for the large files — every weight file is
            LFS-backed and carries one. Note that the entry also has a
            40-hex `oid` beside it upstream which is the sha1 of the
            136-byte LFS *pointer*, not of the model: verifying against
            that passes on any download at all. This field is the real
            one.
        gitBlobSha1:
          type: string
          description: |
            For the small non-LFS files — `config.json`, the tokenizer
            files, the safetensors index — which have no content digest
            upstream. They are still verifiable:
            `sha1("blob <len>\0" + bytes)`, checked exactly against a
            real repo. Between this and `sha256` every file has
            something to check, so nothing is written unverified.
        role:
          $ref: '#/components/schemas/ModelFileRole'
        lfs:
          type: boolean
          description: |
            Whether upstream stores this through LFS. Decides which
            digest is present, and also which redirect shape the
            download meets — a 302 to a signed CDN URL for LFS, a 307
            to an internal path for the rest, both mandatory to follow.

    CatalogueRecommendation:
      type: object
      description: |
        Which candidate to take, and why. **The largest one that fully
        fits at the requested context** — not the largest that runs at
        all, because partial offload is a decision the operator should
        make knowingly rather than inherit from a recommendation.
      required:
        - label
        - reason
      properties:
        label:
          type: string
          description: The recommended candidate's `label`.
        reason:
          type: string
          description: |
            Prose, naming the numbers: what fits, at what context,
            against how much free memory. Differentiator #6 is "show
            *why*"; a bare recommendation with no arithmetic is the
            thing the source complaint is complaining about.
        lowQualityWarning:
          type: string
          description: |
            Present when the largest thing that fits is below ~4 bits
            per weight, naming the alternatives — shorter context,
            partial offload, a smaller model. Recommending a 1.81-bpw
            quant without comment is how a first impression becomes
            "this thing is stupid", and the failure is ours rather than
            the model's.

    AlreadyOwned:
      type: object
      description: |
        This candidate is already on the disk. The join only this
        component can make, since it holds both the catalogue and the
        library — and it is what stops a 16 GB re-download of a file the
        operator already has.
      required:
        - modelId
        - path
      properties:
        modelId:
          type: string
          description: The local `LibraryModel.id`.
        path:
          type: string
          description: Where it already is.
        matchedOn:
          type: string
          enum: [digest, name_and_size]
          description: |
            `digest` is certain — the local file's hash was known and
            matched. `name_and_size` is a strong guess and labelled as
            one, because the library deliberately never hashes model
            content (a 40 GB read per scan is not on the table), so for
            most entries name and size is all there is to compare.

    CatalogueCard:
      type: object
      description: The model card, as published.
      required:
        - repo
        - markdown
      properties:
        repo:
          type: string
        revision:
          type: string
        markdown:
          type: string
          description: |
            The README verbatim. **Untrusted content** — written by
            whoever uploaded the model — so a renderer must not execute
            anything in it and should not follow its links blindly.
        frontMatter:
          type: object
          additionalProperties: true
          description: |
            The card's YAML front matter as upstream parsed it: license,
            base model, tags. Structured, so a UI can show the license
            without regexing prose.
        fetchedAt:
          type: string
          format: date-time

    CataloguePreflight:
      type: object
      description: |
        What one remote file says about itself, read over HTTP Range
        without downloading it. See `preflightCatalogueFile` for the
        cost, which is the point of the endpoint.
      required:
        - repo
        - file
        - format
        - bytesRead
      properties:
        repo:
          type: string
        resolvedCommit:
          type: string
        file:
          type: string
        format:
          $ref: 'components/common.yaml#/components/schemas/ModelFormat'
        bytesRead:
          type: integer
          minimum: 0
          description: |
            How much of the remote file this cost. Reported so the
            number is visible rather than assumed: ~11 MB for a
            large-vocab GGUF, ~11 KB for a safetensors header. The GGUF
            figure is mostly tokenizer — the metadata worth having sits
            on the far side of the vocabulary, which is why the read is
            not smaller.
        quantization:
          type: string
          description: The tier, from `general.file_type`. Machine-read, not guessed.
        fileType:
          type: integer
          description: |
            Raw `general.file_type`. Reported alongside the label rather
            than instead of it, for M2's reason: the quant families
            churn and an unrecognised value must degrade to "here is the
            number", never to a plausible neighbour.
        agreesWithFilename:
          type: boolean
          description: |
            Whether the metadata tier and the filename tier match. When
            false both are reported and neither is silently preferred.
            This is the check the whole endpoint exists to make
            possible.
        architecture:
          type: string
        blockCount:
          type: integer
          minimum: 0
          description: Total layers the file declares.
        attentionLayers:
          type: integer
          minimum: 0
          description: |
            How many of those layers actually hold a KV cache. **Not
            the same number** on a hybrid model: one current release
            declares 65 blocks with a full-attention interval of 4, so
            16 layers carry KV and the naive arithmetic overestimates
            the cache by 4.1× at every context length. This field is
            what stops guidance from being confidently wrong about an
            entire class of modern models.
        contextLength:
          type: integer
          minimum: 0
        parameters:
          type: integer
          minimum: 0
          description: |
            Exact count, for safetensors, from the summed tensor shapes
            in the header. Absent for GGUF, which does not carry one —
            the same asymmetry the local scan meets, reproduced over the
            network at wildly different cost.
        dtype:
          type: string
        vocabSize:
          type: integer
          minimum: 0
        capabilities:
          $ref: '#/components/schemas/ModelCapabilities'
        recommendedSampling:
          $ref: '#/components/schemas/RecommendedSampling'
        fit:
          $ref: '#/components/schemas/Fit'
        shardCount:
          type: integer
          minimum: 1
          description: |
            From the file's own `split.count`, when it is a shard.
            Probing the **first** shard is enough — verified: shard 1 of
            a split model carries the complete KV block.

    # -------- Downloads --------

    DownloadList:
      type: object
      required:
        - downloads
      properties:
        downloads:
          type: array
          items:
            $ref: '#/components/schemas/Download'

    DownloadSpec:
      type: object
      description: |
        What to fetch and where to put it. The file list is explicit
        rather than inferred from the repo: "download the model" has to
        mean something exact by the time it reaches the transfer loop,
        and the catalogue detail response has already grouped the repo
        into candidates whose `files` can be passed straight through.
      required:
        - repo
        - files
      properties:
        repo:
          type: string
          description: Upstream repo id.
        revision:
          type: string
          default: main
          description: |
            Resolved to a commit at start and pinned for the life of
            the download, so a resume days later fetches the same bytes
            it began with.
        files:
          type: array
          minItems: 1
          items:
            type: string
          description: |
            Repo-relative paths. Every shard of a split candidate, the
            projector if the operator wants vision, and for safetensors
            the sidecars as well as the weights. Take these from
            `CatalogueCandidate.files` and `CatalogueModel.projectors`.
        root:
          type: string
          description: |
            Which configured model root to write under. Must be one of
            them — this component will not write outside the
            directories the operator nominated. Defaults to the first,
            which is what the `path_list` config type has promised
            since M2.
        subdirectory:
          type: string
          description: |
            Relative destination under `root`, overriding the configured
            layout. Path traversal is rejected; the result must stay
            inside the root.
        filename:
          type: string
          description: |
            Override the written name of the **single-file** case. Rarely
            wanted: the upstream name is what the operator recognises,
            what the library will call it, and what
            `Runtime.modelAlias` defaults to — plainly-named files are
            the point. Rejected when `files` holds more than one entry,
            because renaming one shard of a set breaks the set.

    Download:
      type: object
      description: |
        One transfer job over N files. Records persist after they finish;
        `DELETE` forgets one.
      required:
        - id
        - state
        - repo
        - files
      properties:
        id:
          type: string
        state:
          $ref: '#/components/schemas/DownloadState'
        repo:
          type: string
        revision:
          type: string
        resolvedCommit:
          type: string
          description: |
            The commit this download is pinned to. A resume that finds
            upstream serving a different digest for the same path
            reports it here rather than appending new bytes to old ones.
        root:
          type: string
        destinationDirectory:
          type: string
          description: |
            Absolute directory the files will land in, resolved **before
            the first byte moves** so the operator can see where their
            model is going while there is still time to change it.
        files:
          type: array
          items:
            $ref: '#/components/schemas/DownloadFile'
        bytesTotal:
          type: integer
          minimum: 0
        bytesDownloaded:
          type: integer
          minimum: 0
        bytesPerSecond:
          type: number
          minimum: 0
          description: Recent rate, not an average over the whole job.
        etaSeconds:
          type: integer
          minimum: 0
        attempts:
          type: integer
          minimum: 0
          description: |
            How many times the transfer has been (re)started, including
            automatic retries. Visible because a 40 GB fetch over a
            domestic link will meet transient failures, and the
            difference between a flaky connection and a dead one is
            this number moving.
        modelId:
          type: string
          description: |
            The library entry this download became, filled in after the
            post-completion scan of the destination directory. This is
            what closes discovery → download → library → profile →
            launch without the UI polling for a model to appear.
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
        error:
          type: string
        errorCode:
          type: string
          description: |
            Upstream's own error code when it gave one — `GatedRepo` is
            the one that will actually happen, and it means "accept the
            licence on the model page" rather than anything the operator
            can fix here. Carried through so the UI can say that instead
            of surfacing a bare 401.
        restartedFromZero:
          type: boolean
          description: |
            True when a resume found the remote file had changed and
            discarded the partial. Surfaced rather than silent: the
            operator is about to re-spend bandwidth they already spent,
            and the reason is that upstream requantized under the same
            filename.
        message:
          type: string
          description: What the current phase is doing, for the progress dialog.

    DownloadFile:
      type: object
      required:
        - path
        - destinationPath
        - state
      properties:
        path:
          type: string
          description: Repo-relative source path.
        destinationPath:
          type: string
          description: |
            Absolute path this file will occupy when it is done. While
            it is in flight the bytes live at this path plus `.part`.
        sizeBytes:
          type: integer
          minimum: 0
        bytesDownloaded:
          type: integer
          minimum: 0
        state:
          $ref: '#/components/schemas/DownloadState'
        sha256:
          type: string
          description: Expected content digest, when upstream published one.
        verified:
          type: boolean
          description: |
            Whether the finished file matched its digest. Verification
            happens **before** the `.part` is renamed into place, so a
            file that exists at `destinationPath` was verified — and one
            that failed stays a `.part` with the record in `failed`,
            never silently retried into the same bytes.
        role:
          $ref: '#/components/schemas/ModelFileRole'
        error:
          type: string

    DownloadState:
      type: string
      enum:
        - queued
        - resolving
        - downloading
        - verifying
        - done
        - failed
        - paused
        - cancelled
      description: |
        Named phases rather than a percentage, following M1's engine
        install for the same reason: the phases fail differently and the
        operator needs to know which one they are in. A stall in
        `downloading` is the network, a stall in `verifying` is the
        disk, and `verifying` *failing* is the one that means the bytes
        are wrong.

        * `queued` — accepted, waiting on `maxConcurrentDownloads`.
        * `resolving` — asking upstream for the commit, sizes and
          digests. Where a gated repo's 401 surfaces.
        * `paused` — operator-stopped; the `.part` is kept and shows up
          in the next scan as `incomplete_download`.
        * `cancelled` — operator-abandoned; the `.part` is removed.
        * `failed` — the retry budget is spent. `resume` runs the same
          loop again.

    # -------- Guidance --------

    Fit:
      type: object
      description: |
        Whether a model runs on a given memory budget at a given
        context, **with the arithmetic attached**. One computation, three
        callers: per candidate in the catalogue, on a local model, and
        inside a preflight.

        It is an estimate and says so. The overhead allowance is flat,
        MoE models hold experts differently, and llama.cpp's own
        allocation shifts between builds — so the inputs are all
        reported, which is what makes a wrong answer diagnosable instead
        of merely wrong.
      required:
        - verdict
        - requiredBytes
        - contextLength
        - basis
      properties:
        verdict:
          $ref: '#/components/schemas/FitVerdict'
        requiredBytes:
          type: integer
          minimum: 0
          description: '`weightsBytes + kvCacheBytes + overheadBytes`.'
        weightsBytes:
          type: integer
          minimum: 0
          description: Summed over every file in the candidate, shards included.
        kvCacheBytes:
          type: integer
          minimum: 0
          description: |
            `contextLength × attentionLayers × headCountKv ×
            (keyLength + valueLength) × bytes per element`. The term
            that goes wrong: see `attentionLayers`.
        overheadBytes:
          type: integer
          minimum: 0
          description: |
            Compute buffers, the graph, the accelerator context. A flat
            allowance, and the reason this is an estimate rather than a
            calculation.
        contextLength:
          type: integer
          minimum: 1
          description: The context this verdict is for. Change it and the verdict changes.
        kvCacheType:
          $ref: '#/components/schemas/KvCacheType'
        attentionLayers:
          type: integer
          minimum: 0
          description: |
            Layers that actually hold a KV cache, which on a hybrid
            attention/SSM model is a small fraction of the total. Where
            this is known from metadata the cache figure is real; where
            it is not, it is assumed equal to the layer count and
            `notes` says so — an assumption that is safe in the
            pessimistic direction and, on one verified current model,
            wrong by 4.1×.
        basis:
          type: string
          enum: [metadata, estimate]
          description: |
            `metadata` when the model's own declared shape produced the
            KV term — a local model, or a remote one after a preflight.
            `estimate` when only the file size was available, which is
            every catalogue candidate until someone preflights it.

            The honest distinction between "this is arithmetic" and
            "this is a guess with a number on it", and the field a UI
            should hang a "check this file" affordance off.
        budget:
          $ref: '#/components/schemas/MemoryBudget'
        notes:
          type: array
          items:
            type: string
          description: |
            The assumptions in words: full offload, F16 KV cache, layer
            count assumed to be attention count, the overhead allowance
            used. Guidance that does not state its assumptions cannot be
            argued with, and this one will sometimes be wrong.

    FitVerdict:
      type: string
      enum:
        - fits
        - tight
        - split
        - no
      description: |
        * `fits` — inside **free** VRAM. Fully offloaded, no host memory
          in the generation path.
        * `tight` — inside total VRAM but not free VRAM. It would fit on
          an idle GPU; something is holding memory right now, and
          closing it is the operator's call.
        * `split` — needs host memory as well. Runnable with partial
          offload, materially slower, and a decision rather than a
          failure.
        * `no` — larger than VRAM and RAM together.

        Four values rather than a percentage because a percentage of
        *what* — VRAM, or VRAM plus RAM? — is precisely the ambiguity
        the operator is trying to resolve, and because the four have
        different advice. `tight` and `split` are the two the field
        usually collapses into "won't fit", and they are the two worth
        naming.

    MemoryBudget:
      type: object
      description: |
        What a fit verdict was measured against. **Free and total both,
        and free is what decides the verdict.** Measured on the dev box
        with nothing unusual running: 2.9 GiB of a 32 GiB card was
        already held and a third of RAM was in use — so scoring against
        total would have promised a fit that OOMs, and hiding total
        would have concealed what quitting a browser buys back.
      properties:
        vramFreeBytes:
          type: integer
          minimum: 0
        vramTotalBytes:
          type: integer
          minimum: 0
        largestGpuFreeBytes:
          type: integer
          minimum: 0
          description: |
            The biggest single card's free memory. Separate from the sum
            because llama.cpp splits layers across GPUs by default, so
            "fits on one card" and "fits across all of them" are
            different questions with different performance — and two
            replicas on two cards, which is M5's case, needs the
            per-card number rather than the total.
        ramAvailableBytes:
          type: integer
          minimum: 0
        ramTotalBytes:
          type: integer
          minimum: 0
        gpuCount:
          type: integer
          minimum: 0
        unifiedMemory:
          type: boolean
          description: |
            Apple silicon, where the VRAM/RAM split does not exist and
            the real ceiling is the wired limit rather than a separate
            pool. Reported because the naive reading of "VRAM" on a
            96 GB Mac is zero, which would tell one of the better
            local-inference boxes on the market that it has no GPU.
        source:
          type: string
          enum: [detected, override]
          description: |
            `override` when the caller supplied the budget. That is how
            a model gets scored against **another** host's memory, which
            is the only honest answer in a deployment where the GPU is
            in a different building — and a UI should say which machine
            a verdict is about.

    KvCacheType:
      type: string
      enum:
        - f16
        - q8_0
        - q4_0
      description: |
        Element type assumed for the KV cache, which halves or quarters
        the cache term. `f16` is the default and llama.cpp's own.

        Present as a parameter because it is a launch flag
        (`--cache-type-k`) and therefore part of the question: "does
        this fit" has no answer that is independent of how it will be
        launched. A profile that sets the flag and a fit query that
        assumed `f16` disagree, and the operator should be able to see
        both.

    ModelFit:
      type: object
      description: A local model's fit, plus which model it is about.
      required:
        - modelId
        - fit
      properties:
        modelId:
          type: string
        path:
          type: string
        fit:
          $ref: '#/components/schemas/Fit'
        maxContextLength:
          type: integer
          minimum: 0
          description: |
            The largest context that still `fits` in free VRAM,
            computed by solving the same arithmetic for context instead
            of asserting it. More useful than a yes/no at one context:
            it is the number that goes in a profile's `-c`, and it
            answers the question a launch actually asks.
        modelContextLength:
          type: integer
          minimum: 0
          description: |
            What the model was trained for, for comparison. These two
            are frequently far apart — a current 27B declares 262144 and
            almost nobody can hold that — and showing only the model's
            number is the comfortable lie M2 named.

    HostHardware:
      type: object
      description: |
        What this host has to spend, as detected. Deliberately **not**
        shared with the agent's `HostAccelerator`: that answers "which
        engine build do I fetch" and its own description already says the
        VRAM-and-fit surface belongs here. The two overlap on `os` and
        `arch` and diverge on everything else, so this duplicates two
        enums rather than coupling two surfaces that will evolve apart.
        When they disagree it is because they are on different hosts,
        which is information rather than a bug.
      required:
        - hostname
        - os
        - arch
      properties:
        hostname:
          type: string
          description: |
            Which machine these numbers are from. Load-bearing in a
            multi-host deployment: a driver lives next to its engine, so
            the GPU that will load the model is not necessarily on the
            host that measured this.
        os:
          type: string
          enum: [windows, linux, macos]
        arch:
          type: string
          enum: [x64, arm64]
        cpuCount:
          type: integer
          minimum: 1
        ramTotalBytes:
          type: integer
          minimum: 0
        ramAvailableBytes:
          type: integer
          minimum: 0
          description: |
            What is actually free, which is a third less than total on
            an ordinary desktop. The number scoring uses.
        unifiedMemory:
          type: boolean
        gpus:
          type: array
          items:
            $ref: '#/components/schemas/Gpu'
        detectedAt:
          type: string
          format: date-time
          description: |
            Free memory moves constantly, so a verdict computed from a
            cached reading needs a timestamp on it.
        warnings:
          type: array
          items:
            type: string
          description: |
            What could not be detected and what was assumed instead — no
            vendor tool on PATH, an accelerator whose free memory is
            unreadable, a platform whose memory model is not the one
            assumed. Named rather than silently defaulted: a fit verdict
            computed from a wrong budget is worse than no verdict, and
            three of the detection paths in this component are
            unverified on real hardware (AMD, Intel, and Apple unified
            memory).

    Gpu:
      type: object
      required:
        - index
        - name
        - vramTotalBytes
      properties:
        index:
          type: integer
          minimum: 0
          description: |
            The device index, which is what goes in
            `CUDA_VISIBLE_DEVICES` in a profile's `env` — the mechanism
            behind two replicas on two cards.
        name:
          type: string
        vendor:
          type: string
          enum: [nvidia, amd, intel, apple, unknown]
        vramTotalBytes:
          type: integer
          minimum: 0
        vramFreeBytes:
          type: integer
          minimum: 0
          description: |
            Absent when the platform will not say. On a fresh desktop
            this is around 2.9 GiB below total before anything is
            launched, which is 11% of a 24 GB card.
        computeCapability:
          type: string
        driverVersion:
          type: string

    QuantTable:
      type: object
      description: |
        Static reference content: what the quant tiers mean. Served from
        here so there is one copy to maintain as upstream's families
        churn, and so a headless install can print it.
      required:
        - tiers
      properties:
        tiers:
          type: array
          items:
            $ref: '#/components/schemas/QuantTier'
        updatedAt:
          type: string
          format: date-time
          description: When this table was last revised, since the families move.

    QuantTier:
      type: object
      required:
        - tier
        - summary
      properties:
        tier:
          type: string
          description: 'The label as it appears in filenames, e.g. `Q4_K_M`, `IQ3_XXS`.'
        family:
          type: string
          description: |
            `legacy` (`Q4_0`, `Q8_0`), `k_quant` (`Q4_K_M` — mixed
            precision per tensor), `i_quant` (`IQ*` — importance-matrix
            quantized), `dynamic` (`UD-*` — per-tensor choices made by
            the publisher), or `unquantized` (`F16`, `BF16`, `F32`).
        nominalBitsPerWeight:
          type: number
          description: |
            The tier's nominal width. The *actual* figure for a specific
            file is `CatalogueCandidate.bitsPerWeight`, computed from its
            real size — mixed-precision schemes do not land on their
            nominal value.
        summary:
          type: string
          description: What this tier does, in one sentence.
        guidance:
          type: string
          description: |
            When it is a sensible choice. Describes the **shape** of the
            quality curve — noticeable degradation below roughly 4 bits
            per weight, severe below 3 — and never a per-model
            judgement. Which of `IQ2_S` and `Q2_K` is better for a given
            model is upstream research and not ours to invent; a
            fabricated quality score is worse than none, the same rule
            that makes an unrecognised `general.file_type` degrade to
            the raw number.
