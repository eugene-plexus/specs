    SiteLinkRemove:
      $ref: "components/job-sites.yaml#/SiteLinkRemove"
    SiteId:
      $ref: "components/sites.yaml#/SiteId"
    SiteLabel:
      $ref: "components/sites.yaml#/SiteLabel"
    SiteOwnerProof:
      $ref: "components/sites.yaml#/SiteOwnerProof"
    SiteEnrollmentRequest:
      $ref: "components/sites.yaml#/SiteEnrollmentRequest"
    SiteEnrollment:
      $ref: "components/sites.yaml#/SiteEnrollment"
    SiteReport:
      $ref: "components/sites.yaml#/SiteReport"
    SitePollAnswer:
      $ref: "components/sites.yaml#/SitePollAnswer"
    SiteOperation:
      $ref: "components/sites.yaml#/SiteOperation"
    SiteResult:
      $ref: "components/sites.yaml#/SiteResult"
    InstallModeName:
      $ref: "components/sites.yaml#/InstallModeName"
    SiteDevGrant:
      $ref: "components/job-sites.yaml#/SiteDevGrant"
    SiteFolderOwnerAccess:
      $ref: "components/job-sites.yaml#/SiteFolderOwnerAccess"
    Site:
      $ref: "components/job-sites.yaml#/Site"
    SiteList:
      $ref: "components/job-sites.yaml#/SiteList"
    SiteInvitationRequest:
      $ref: "components/job-sites.yaml#/SiteInvitationRequest"
    SiteInvitation:
      $ref: "components/job-sites.yaml#/SiteInvitation"
    HostedSites:
      $ref: "components/job-sites.yaml#/HostedSites"
    JobSiteRequest:
      $ref: "components/job-sites.yaml#/JobSiteRequest"
    SiteCancel:
      $ref: "components/job-sites.yaml#/SiteCancel"
    SiteServerList:
      $ref: "components/job-sites.yaml#/SiteServerList"
    SiteMcpCall:
      $ref: "components/job-sites.yaml#/SiteMcpCall"
    SiteMcpAnswer:
      $ref: "components/job-sites.yaml#/SiteMcpAnswer"
    InstallMode:
      $ref: "components/job-sites.yaml#/InstallMode"
    JobSite:
      $ref: "components/job-sites.yaml#/JobSite"
    JobSiteList:
      $ref: "components/job-sites.yaml#/JobSiteList"
