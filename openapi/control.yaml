openapi: 3.1.0
info:
  title: Eugene Plexus — control
  version: 0.3.0-draft
  summary: The install's trust root, node registry, topology and UI host. Exactly one active.
  description: |
    The **control root**. Exactly one is active per install, plus any
    number of warm standbys. It holds what is inherently singular —
    the trust root, the node registry, install-wide topology, the
    replicated log and the UI — and it **spawns nothing**.

    Supervision is the [agent](agent.yaml)'s job, and there is one agent
    per host. On whichever host holds the control root, `control` is
    itself just another local component in that agent's topology. That
    is deliberate: if the control root supervised processes it would need
    a second copy of the supervision machinery, and "components share
    schemas, not code" means a real second copy rather than an import.
    One supervisor implementation, running everywhere; one control root,
    supervised like anything else.

    Design and every decision behind this document:
    `docs/design/m5-multi-host-and-trust.md`. Implemented in the
    `control` repo; the agent's half of the exchange — enrollment, an
    address other hosts reach it at — landed at M7
    (`docs/design/m7-second-host-readiness.md`), and per-node token keys
    with the trust bundle on 2026-09-25
    (`docs/design/per-node-token-keys.md`).

    ## What it is authoritative for

    | | control root | agent |
    |---|---|---|
    | How many | one active, N standbys | one per host |
    | Spawns | **nothing** | every local component and engine runtime |
    | Topology | install-wide | this host only |
    | Runtimes | the **union**, tagged by node | this host's, with the process handles |
    | Trust | holds the root token key, registers each node's key, publishes the trust bundle | generates its own token key, which never leaves it; verifies against the bundle |

    An operator talks to the control root. A mutation that has to happen
    on a particular host — declaring a runtime, restarting a component —
    is accepted here and **forwarded** to that node's agent, because the
    operator should not have to know which host owns what.

    ## `down` versus `out`

    Borrowed from Ceph, because the distinction is the one that matters.
    **down** means unreachable and expected back: nothing is reassigned.
    **out** means not coming back: its responsibilities must be
    relocated.

    A control root that is `down` pauses *management* — no config edits,
    no new runtimes, no enrollment, no UI login — while **inference
    continues**, because the gateway routes from topology it already
    holds and agents keep supervising from cached state.

    **A control root is never marked `out` automatically.** There is no
    equivalent of Ceph's `mon_osd_down_out_interval` here. Promotion is
    an operator act, always, because automatic promotion without quorum
    is split-brain by definition — and that single property is what makes
    two hosts both believing they are root structurally impossible rather
    than merely unlikely.

    ## Epoch fencing

    Every control root carries a monotonic `epoch`. **Agents record the
    highest epoch they have seen and refuse to go backwards.** Promotion
    increments it, so a superseded root returning at a lower epoch is
    refused by every agent — no election, no quorum, and no agent needing
    to agree with any other agent. Each independently declines a
    downgrade.

    Known and accepted cost: an agent partitioned *during* a promotion
    still trusts the old root until it reconnects. That is bounded to the
    partitioned nodes, visible here as an epoch disagreement on
    `GET /v1/nodes`, and self-healing. It must not be "fixed" with
    automatic promotion, which would trade a visible, bounded window for
    genuine split-brain.

    ## One writer, one ordered log

    Every control-state change — enrolling a node, revoking one,
    declaring a runtime, patching config, rotating the token key — is
    appended as a `LogEntry` with a gapless monotonic `index`, applied by
    the active root, and pulled by standbys from `GET /v1/control/log`.
    Applied state is a deterministic function of the log; `GET
    /v1/control/snapshot` exists so a new standby need not replay from
    the beginning.

    Standbys **pull**; the active root never pushes. That keeps one
    writer, lets a standby measure its own lag, and means the standby
    initiates every connection, which is the direction that survives a
    firewall.

    Timestamps on entries are informational and **never** used for
    ordering. Index is the only ordering there is, which keeps clock
    skew between buildings out of the correctness argument.

    This is Raft minus voting, and deliberately so. Moving to consensus
    later would replace the transport and add an election; the log, the
    apply function, the snapshot and the epoch are already here, and only
    the commit rule would change — from "the active root applied it" to
    "a majority acknowledged it".

    ## Secrets never pass through here

    Per-node sealing: each node holds an identity keypair whose private
    half never leaves it, and a secret is sealed to the node whose
    component will read it. The control root knows the recipient because
    topology says which node a component runs on. **It never holds
    plaintext, and in normal operation never holds a key that can read
    every node's secrets.**

    Every secret is additionally sealed to a **recovery recipient** —
    a key held here, itself sealed under the passphrase-derived key and
    unsealed only during an explicit recovery. Without it, a dead node's
    secrets would be unrecoverable; with it, reading them still requires
    the operator's passphrase.

    ## Auth

    The control root is the trust root, and since 2026-09-25 **one
    leaked machine costs that machine, not the install**
    (`docs/design/per-node-token-keys.md`).

    * **Every issuer has its own key.** This root holds a token key that
      never leaves it. Every agent generates one of its own and sends
      only the public half at enrollment. No private token key crosses
      the wire.
    * **The trust bundle** (`common.yaml`, `TrustBundle`) is how every
      verifier learns which keys to accept and what each may issue.
      This root builds it from the log, signs it with its identity key
      and publishes it at `GET /v1/trust/bundle`. It pushes it to every
      node when it changes, and every node also pulls it.
    * **Only this root mints operator sessions.** A session is
      addressed to the machine the operator signed in on and to this
      root. That machine acts on other machines by exchanging the
      session here (`POST /v1/auth/token`) for a 5-minute token
      addressed to the one it is reaching, so no other machine ever
      holds the session.
    * **Revoking a node removes its key from the bundle** and rotates
      nothing.

    Enrollment is authenticated by a **join token** rather than a
    session, because the node presenting it has no credential yet.

    A mesh VPN (Tailscale / WireGuard) remains the network boundary
    between hosts. This auth layer sits on top of it rather than
    replacing it.
  license:
    name: Apache-2.0
    identifier: Apache-2.0
  contact:
    name: Eugene Plexus
    url: https://github.com/eugene-plexus
servers:
  - url: http://{host}:{port}
    description: |
      The operator-facing address, and what a browser points at once the
      control root serves the UI.

      8083 rather than inheriting the agent's 8079: the agent keeps that
      port because it appears in every existing config and acceptance
      script and there are now N agents, while `control` is new and can
      take a free number. 8083 was `memory`'s port before the strip.
    variables:
      host:
        default: localhost
      port:
        default: '8083'

security:
  - bearerAuth: []

tags:
  - name: nodes
    description: |
      The hosts this install spans, their identities and their
      enrollment. A host is **not** a component — the same reasoning that
      made engine processes `runtimes` in their own collection rather
      than components applies again.
  - name: control
    description: |
      The control root's own state: epoch, role, log replication, key
      rotation and promotion.
  - name: topology
    description: Install-wide components and the union runtime view.
  - name: auth
    description: |
      Operator authentication. Moves here from the agent, which held it
      only because it used to be the single process.
  - name: config
    description: |
      Remote-editable configuration. Every Eugene Plexus component
      implements the same trio so one UI manages all of them without
      per-component code.
  - name: meta
    description: Health and version.
  - name: sites
    description: |
      Job Sites (`docs/design/job-sites-own-enrollment.md`): machines a
      person owns, joined so that central Workbench can use their tools.
      Each is its own enrollment, held by its site host, and never a node
      (J19, J23). Eugene's owner manages membership only (`/v1/sites`); a
      site's owner manages it from Workbench (`/oidc/job-sites`); a person
      uses its tools through `/oidc/sites`.

paths:
  /v1/auth/client-keys/admission:
    post:
      tags: [auth]
      operationId: clientAdmission
      summary: Check or reserve shared client-key allowance (operator or gateway/agent service only).
      description: Durable per-install admission; 30-second renewable leases, rolling 60-second request window. Client bearers cannot call this endpoint.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ClientAdmissionRequest'}
      responses:
        '200':
          description: Current key access or reservation result.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ClientAdmissionResult'}
        '401': {description: Invalid service credential or inactive client key.}
        '403': {description: Model excluded by the key.}
        '409': {description: Reservation expired or policy changed.}
        '429':
          description: Shared concurrency/rate allowance exhausted.
          headers:
            Retry-After: {schema: {type: integer, minimum: 1}}
        '503': {description: Authority unavailable; no local fallback allowance.}

  /v1/auth/client-keys/{keyId}/limits:
    put:
      tags: [auth]
      operationId: setClientKeyLimits
      summary: Set model permissions and shared limits without replacing a key (operator only).
      parameters:
        - {name: keyId, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ClientKeyUpdateRequest'}
      responses:
        '200':
          description: Updated metadata. Revocation and token remain unchanged.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ClientKey'}
        '404': {description: No such key.}
        '503': {description: Registry unavailable.}

  /v1/auth/client-keys:
    get:
      operationId: listClientKeys
      summary: List install-wide client-key records
      description: Operator only; active root only. Contains records, never bearer tokens.
      responses:
        '200':
          description: Authoritative registry.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ClientKeyList'}
    post:
      operationId: createClientKey
      summary: Create an install-wide client key
      description: Operator only, or a member node acting for the operator on its own app's key (`SubjectToken`); active, unlocked root. Persist the record before returning the token.
      parameters:
        - $ref: '#/components/parameters/SubjectToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ClientKeyCreateRequest'}
      responses:
        '201':
          description: Key and one-time bearer token.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ClientKeyCreated'}
        '403':
          $ref: 'components/common.yaml#/components/responses/Problem'
  /v1/auth/client-keys/policy:
    get:
      operationId: getClientKeyPolicy
      summary: Issue current client-key authorization policy
      description: An operator session, or a service token with `sub` `agent` or `gateway` from a member node's key. Only the active root issues fresh policy. No signing secret is returned.
      responses:
        '200':
          description: Current policy.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ClientKeyPolicy'}
        '503':
          $ref: 'components/common.yaml#/components/responses/Problem'
  /v1/auth/client-keys/{id}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string}}
    delete:
      operationId: revokeClientKey
      summary: Revoke a key throughout the install
      description: Operator only, or a member node acting for the operator on its own app's key (`SubjectToken`); active root. Durable and idempotent. Healthy gateways observe the change within 20 seconds by default; stale policy expires after 60 seconds plus five seconds clock tolerance.
      parameters:
        - $ref: '#/components/parameters/SubjectToken'
      responses:
        '204': {description: Revocation durably recorded.}
        '403':
          $ref: 'components/common.yaml#/components/responses/Problem'
        '404':
          $ref: 'components/common.yaml#/components/responses/Problem'

  # -------- signing in with Eugene: OpenID Connect (C2) --------
  #
  # Design: docs/design/sign-in-with-eugene.md. The root is the provider;
  # browsers and apps reach it through an agent's `/oidc/*`, which forwards
  # here. These paths are OIDC's, not Eugene's API: the answers are
  # OAuth's (`error`, `error_description`), not Problem documents.

  /oidc/.well-known/openid-configuration:
    get:
      operationId: oidcDiscovery
      summary: OpenID Provider metadata (OIDC Discovery 1.0)
      description: |
        Public. The issuer is `oidcIssuer` when the operator has set one,
        otherwise the address the request arrived at through an agent
        (D11). Offers the code flow only, PKCE `S256`, RS256 ID tokens and
        `client_secret_basic`.
      responses:
        '200':
          description: Provider metadata.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OidcDiscovery'}
  /oidc/jwks:
    get:
      operationId: oidcJwks
      summary: The provider's public keys (JWK Set)
      description: Public. The RSA key every sign-in token is signed with, by `kid`; during a rotation, the old one too.
      responses:
        '200':
          description: The JWK Set.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/JsonWebKeySet'}
  /oidc/authorize:
    get:
      operationId: oidcAuthorize
      summary: The sign-in page
      description: |
        Public. Validates the request and shows the sign-in form: the
        passphrase alone on an install with no people, a name and a
        password once there are people (D4). A `client_id` or
        `redirect_uri` that does not match a registered app is an error
        page and never a redirect; anything else wrong goes back to the app
        as `error=` (RFC 6749 §4.1.2.1). `code_challenge` with `S256`,
        `state` and `nonce` are required. `scope` must include `openid`;
        `profile` and `email` are honoured and anything else is ignored.
        With `email`, a person who has an address gets `email` and
        `email_verified: false` (C4).

        **One built-in client, `eugene-site-link`** (J37,
        `job-sites-own-enrollment.md` §3.2): the agent's link page on a
        site's machine. It is public, with no secret, and its only redirect
        is a loopback one, `http://127.0.0.1:<port>/link/callback` with any
        port (RFC 8252 §7.3). Every person with `use-job-sites` may use it
        (J77; before 2b.3b every person), and Eugene's owner may not. It is
        never in the client list and cannot be edited or removed.
      parameters:
        - {name: response_type, in: query, required: true, schema: {type: string, enum: [code]}}
        - {name: client_id, in: query, required: true, schema: {type: string}}
        - {name: redirect_uri, in: query, required: true, schema: {type: string}}
        - {name: scope, in: query, required: true, schema: {type: string}}
        - {name: state, in: query, required: true, schema: {type: string}}
        - {name: nonce, in: query, required: true, schema: {type: string}}
        - {name: code_challenge, in: query, required: true, schema: {type: string}}
        - {name: code_challenge_method, in: query, required: true, schema: {type: string, enum: [S256]}}
      responses:
        '200':
          description: The sign-in page.
          content:
            text/html:
              schema: {type: string}
        '302': {description: Back to the app with `error=`.}
        '400':
          description: An unknown app or redirect URI, as a page.
          content:
            text/html:
              schema: {type: string}
    post:
      operationId: oidcSignIn
      summary: Submit the sign-in form
      description: |
        Form fields: `request` (the pending request the page was rendered
        for, good once, for 10 minutes), `password`, and `name` once the
        install has people. Success redirects to the app with `code` and
        `state`. A wrong name or password answers the page again with the
        same sentence for both. Five failures a minute per address, or per
        name, is 429.

        A person may also send `new_password` and `new_password_again`
        (D10): once their password checks, it is replaced, and every
        earlier sign-in of theirs ends at its next refresh. Two that differ,
        or one under 12 characters, answer the page again and change
        nothing. Eugene's own passphrase is never changed here: sending
        one for `operator` is 400.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema: {type: object, additionalProperties: {type: string}}
      responses:
        '302': {description: Back to the app with `code` and `state`.}
        '200':
          description: The page again, with why.
          content:
            text/html:
              schema: {type: string}
        '400':
          description: |
            The request expired or its app is gone, or a new password was
            sent for the owner, whose passphrase is not changed here; the
            page says which.
          content:
            text/html:
              schema: {type: string}
        '403':
          description: |
            This person is turned off, or may not use this app; the page
            says which.
          content:
            text/html:
              schema: {type: string}
        '429':
          description: Too many failed sign-ins; the page says when to try again.
          content:
            text/html:
              schema: {type: string}
  /oidc/token:
    post:
      operationId: oidcToken
      summary: Trade a code, or a refresh token, for tokens
      description: |
        `client_secret_basic`. `grant_type` is `authorization_code` (with
        `code`, `code_verifier`, `redirect_uri`) or `refresh_token`. A
        refresh is refused when the person has been disabled or deleted,
        their password changed after the sign-in, or the sign-in was
        revoked (D6).

        The built-in `eugene-site-link` client sends `client_id` in the form
        and no secret, and may only trade a code: it gets an ID token and no
        refresh token.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema: {type: object, additionalProperties: {type: string}}
      responses:
        '200':
          description: Tokens.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OidcTokenResponse'}
        '400':
          description: OAuth error (`invalid_grant`, `invalid_request`, `unsupported_grant_type`).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OAuthError'}
        '401':
          description: '`invalid_client`.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OAuthError'}
  /oidc/userinfo:
    get:
      operationId: oidcUserinfo
      summary: Who the access token was issued for
      description: A bearer access token from `/oidc/token`. The same claims as the ID token's, less the token ones.
      responses:
        '200':
          description: Claims.
          content:
            application/json:
              schema: {type: object, additionalProperties: true}
        '401':
          description: Missing, expired or revoked access token.
  /oidc/revoke:
    post:
      operationId: oidcRevoke
      summary: Sign out by revoking a refresh token (RFC 7009)
      description: '`client_secret_basic`. Revokes the sign-in the token belongs to. 200 for a token already invalid, as RFC 7009 requires.'
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema: {type: object, additionalProperties: {type: string}}
      responses:
        '200': {description: 'Revoked, or nothing to revoke.'}
        '401':
          description: '`invalid_client`.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OAuthError'}

  /v1/people:
    get:
      operationId: listPeople
      summary: The people who may sign in to apps
      description: Operator only. Never a password or its verifier.
      responses:
        '200':
          description: The people.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PersonList'}
    post:
      operationId: createPerson
      summary: Add a person
      description: Operator only; active, unlocked root. A name is unique, compared case-folded, and `operator` is the owner's.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PersonCreateRequest'}
      responses:
        '201':
          description: The person.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Person'}
        '409':
          $ref: 'components/common.yaml#/components/responses/Problem'
        '422':
          $ref: 'components/common.yaml#/components/responses/Problem'
  /v1/people/{id}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string}}
    patch:
      operationId: updatePerson
      summary: Change a person's name, apps, permissions, or whether they are disabled
      description: Operator only. Disabling refuses their next sign-in and their apps' next refresh.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PersonUpdateRequest'}
      responses:
        '200':
          description: The person.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Person'}
        '404':
          $ref: 'components/common.yaml#/components/responses/Problem'
    delete:
      operationId: deletePerson
      summary: Remove a person
      description: Operator only. Their sign-ins stop at their apps' next refresh.
      responses:
        '204': {description: Removed.}
        '404':
          $ref: 'components/common.yaml#/components/responses/Problem'
  /v1/people/{id}/password:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string}}
    put:
      operationId: setPersonPassword
      summary: Set a person's password
      description: |
        Operator only: how a forgotten password is reset (D10, Troy). A
        sign-in from before the new password does not refresh. At least
        12 characters, as the passphrase.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PersonPasswordRequest'}
      responses:
        '204': {description: Set.}
        '404':
          $ref: 'components/common.yaml#/components/responses/Problem'
        '422':
          $ref: 'components/common.yaml#/components/responses/Problem'
  /v1/oidc/clients:
    get:
      operationId: listOidcClients
      summary: The apps that sign in with Eugene
      description: Operator only. Never a secret.
      responses:
        '200':
          description: The apps.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OidcClientList'}
    post:
      operationId: createOidcClient
      summary: Register an app that signs in with Eugene
      description: |
        Operator only, or a member node acting for the operator on its
        own app (`SubjectToken`, with `owner` `app:<id>@<node>`); active,
        unlocked root. Redirect URIs are matched exactly (RFC 9700 §4.1);
        plain `http` is allowed, because a home network has no
        certificates. The secret is in this answer and nowhere else.
      parameters:
        - $ref: '#/components/parameters/SubjectToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/OidcClientCreateRequest'}
      responses:
        '201':
          description: The app and its one-time secret.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OidcClientCreated'}
        '403':
          $ref: 'components/common.yaml#/components/responses/Problem'
        '422':
          $ref: 'components/common.yaml#/components/responses/Problem'
  /v1/oidc/clients/{clientId}:
    parameters:
      - {name: clientId, in: path, required: true, schema: {type: string}}
    delete:
      operationId: deleteOidcClient
      summary: Stop an app signing in with Eugene
      description: Operator only, or a member node acting for the operator on its own app (`SubjectToken`). Its sign-ins stop at its next refresh.
      parameters:
        - $ref: '#/components/parameters/SubjectToken'
      responses:
        '204': {description: Removed.}
        '403':
          $ref: 'components/common.yaml#/components/responses/Problem'
        '404':
          $ref: 'components/common.yaml#/components/responses/Problem'
  /v1/oidc/clients/{clientId}/redirect-uris:
    parameters:
      - {name: clientId, in: path, required: true, schema: {type: string}}
    put:
      operationId: setOidcClientRedirectUris
      summary: Replace where an app's sign-ins return to
      description: |
        Replaces the client's exact redirect URIs and nothing else: the
        same client id and secret, so the app's sign-ins carry on.

        Operator only, a member node acting for the operator
        (`SubjectToken`), **or a member node on its own**, with its own
        `sub: agent` token. The last is how an app's return address
        follows a change of address made at that machine (one HTTPS
        port, 2026-10-05): at boot the agent updates the clients of its
        own apps, with no operator present. A node, either way, may
        change only clients whose `owner` is `app:<id>@<that node>`. It
        could already take every sign-in to those apps, because it runs
        them and holds their secrets, so this gives it nothing new.
      parameters:
        - $ref: '#/components/parameters/SubjectToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/OidcClientRedirectsRequest'}
      responses:
        '200':
          description: The app as it is now.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OidcClient'}
        '403':
          $ref: 'components/common.yaml#/components/responses/Problem'
        '404':
          $ref: 'components/common.yaml#/components/responses/Problem'
        '422':
          $ref: 'components/common.yaml#/components/responses/Problem'

  # -------- nodes: the hosts this install spans --------

  /v1/nodes:
    get:
      tags: [nodes]
      operationId: listNodes
      summary: Every host in this install, with its identity and epoch.
      description: |
        The multi-host dashboard's source of truth, and where a
        mis-wired or partitioned install becomes visible: a node whose
        `lastSeenEpoch` disagrees with `GET /v1/control/status` is one
        that has not yet learned about a promotion.

        Includes this node. A single-host install returns exactly one
        entry, which is the honest answer rather than an empty list.
      responses:
        '200':
          description: Every enrolled node.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodeList'
        '401':
          $ref: 'components/common.yaml#/components/responses/Problem'

  /v1/nodes/{name}:
    parameters:
      - in: path
        name: name
        required: true
        schema:
          type: string
    get:
      tags: [nodes]
      operationId: getNode
      summary: Read one node.
      responses:
        '200':
          description: The node.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Node'
        '404':
          $ref: 'components/common.yaml#/components/responses/Problem'
    delete:
      tags: [nodes]
      operationId: revokeNode
      summary: Revoke a node's enrollment, which removes its key from the trust bundle.
      description: |
        One `revokeNode` log entry. It removes the node's token key from
        the trust bundle, and with it every token the node ever minted.
        Every session whose `aud` names it as the console dies too.

        Nothing else changes. No key is rotated, nobody else is signed
        out, and no client key is reissued, because since 2026-09-25 no
        other machine holds a key the revoked one could use. The new
        bundle is pushed to every node at once; a node that is `down`
        takes it when it next reaches this root. `nodesBehind` in the
        answer, and `Node.trustBundleVersion` afterwards, say which
        nodes do not hold it yet.

        The runtimes the node hosted become un-declared. The models
        stay on that host's disk, but nothing in this install will route
        to them.
      responses:
        '202':
          description: Revoked; the new bundle is being pushed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrustChange'
        '404':
          $ref: 'components/common.yaml#/components/responses/Problem'
        '409':
          description: This host is a standby and does not accept writes.
          content:
            application/problem+json:
              schema:
                $ref: 'components/common.yaml#/components/schemas/Problem'
        '503':
          description: |
            Locked: the identity key that signs the bundle is not in
            memory, so a bundle without the node could not be published.
            Nothing is revoked.
          content:
            application/problem+json:
              schema:
                $ref: 'components/common.yaml#/components/schemas/Problem'

    patch:
      tags: [nodes]
      operationId: announceNodeAddress
      summary: A node tells this root its address changed.
      security: []
      description: |
        **Called by the node, not the operator**, on every agent startup
        and whenever its `advertiseUrl` changes. Without it a node's
        address is announced exactly once, at enrollment, and a host that
        reboots onto a new tailnet IP or a new DHCP lease leaves this
        root holding an address nobody is listening on — with no path
        back, because the only way to reach that node is the address that
        just went stale. That was live for four milestones.

        **The credential is the signature, not a bearer**, and it is the
        mirror image of `POST /v1/node/trust-bundle` in `agent.yaml`: the
        root proves itself to a node with its identity key, and a node
        proves itself to the root with its own. Two reasons a bearer
        cannot do this job here, and the second is the load-bearing one:

        1. Only this root and the node itself should be able to move a
           node, and the node's identity key is the one credential that
           says both "this node" and "not a copy of a token it was sent".
        2. **Every other mutation on this root is operator-only**, on
           purpose — "a compromised peer holding a service token must not
           be able to enroll a host or re-key the install". An unattended
           reboot has no operator, so accepting one here would have been
           the first hole in that rule rather than an exception to it.

        **Idempotent, and deliberately silent when nothing changed.** A
        restart that announces the address it already had answers 200
        with `changed: false` and appends nothing, because otherwise
        every reboot of every node grows the log for no information.

        `sequence` is strictly increasing per node and mirrored in
        applied state, so a captured announcement cannot be replayed to
        move a node back to an address it used to have. It resets with
        the node record on re-enrollment.

        **The signature settles who is announcing, never which address**,
        and until 2026-09-18 nothing settled the second question: a
        correctly signed announcement could name any URL at all, with a
        loopback check as the only filter, so `http://169.254.169.254/`
        was a valid address for a node. After that this root probes it
        every poll and every console proxy hop dials it carrying the
        operator's own bearer. Two rules sit after the signature now.

        **An address that can never be a node is a 400.** A scheme that
        is not http(s), the bind wildcard, a multicast group, a
        link-local address — where every cloud provider's
        instance-metadata service listens — or a reserved range. The
        same rule applies at `enrollNode`, so it is a rule about what a
        node's address is rather than about one endpoint.

        **A node may not put itself on the open internet: 409.** Classes
        are `loopback`, `private` (RFC 1918, unique-local IPv6, and
        100.64.0.0/10, where a tailnet lives) and `public`; a bare
        hostname counts public, because whoever resolves it is not this
        root. Moving *between* loopback and private is explicitly fine —
        that is the Reach switch, and a new DHCP lease after a reboot —
        and so is narrowing. Going public when this node was not already
        public is refused, because nothing here can tell that apart from
        a leaked signing key doing it. The remedy named in `detail` is
        re-enrollment, which needs an operator-minted join token and is
        therefore the confirmation the rule is asking for; a node that is
        genuinely on the open internet enrolls that way and re-advertises
        freely forever after.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NodeAddressAnnouncement'
      responses:
        '200':
          description: |
            Recorded, or already the case. `changed` tells them apart.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodeAddressAck'
        '401':
          description: |
            The signature does not verify against the node's recorded
            `signingPublicKey`, or that node has none — it enrolled
            before nodes had a signing identity and must re-enroll
            before it can re-advertise.
          content:
            application/problem+json:
              schema:
                $ref: 'components/common.yaml#/components/schemas/Problem'
        '404':
          $ref: 'components/common.yaml#/components/responses/Problem'
        '400':
          description: |
            The announcement is correctly signed and the address cannot
            be a node's: a non-http(s) scheme, the bind wildcard, a
            multicast group, a link-local address, or a reserved range.
            `detail` names which.
          content:
            application/problem+json:
              schema:
                $ref: 'components/common.yaml#/components/schemas/Problem'
        '409':
          description: |
            One of three. `sequence` is not above the one already
            recorded — a replay, or a node whose identity file was
            restored from a backup; or the announced address would put a
            node that was not on the open internet onto it, which only an
            operator confirms, by re-enrolling; or this host is a standby
            and does not accept writes. `detail` says which.
          content:
            application/problem+json:
              schema:
                $ref: 'components/common.yaml#/components/schemas/Problem'

  /v1/nodes/join-token:
    post:
      tags: [nodes]
      operationId: mintJoinToken
      summary: Mint a single-use, short-lived token that lets one host enroll.
      description: |
        Operator-only. The token is the only credential a new agent has,
        so it is deliberately narrow: **single-use, short-lived, and
        scoped to one node**. Minting a second token does not invalidate
        the first; expiry and use do.

        The returned `token` is shown **once** and not retrievable
        afterwards. It is not stored in recoverable form — a lost token
        is re-minted, not looked up.

        The returned `id` is the handle to withdraw it by
        (`revokeJoinToken`) and is not the token: a token that went to
        the wrong place used to stay live for the rest of its TTL with
        no remedy but waiting.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JoinTokenRequest'
      responses:
        '201':
          description: Token minted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JoinToken'
        '401':
          $ref: 'components/common.yaml#/components/responses/Problem'

  /v1/nodes/join-tokens:
    get:
      tags: [nodes]
      operationId: listJoinTokens
      summary: The join tokens this root has minted and not yet expired.
      description: |
        Operator-only, and **carries no token** — the store keeps a hash
        and never the secret, so there is nothing here to steal and
        nothing to re-read a lost token from.

        Active-root-local, like minting: this list does not survive a
        promotion, because the tokens do not either.
      responses:
        '200':
          description: Outstanding tokens, soonest to expire first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JoinTokenList'
        '401':
          $ref: 'components/common.yaml#/components/responses/Problem'

  /v1/nodes/join-tokens/{id}:
    delete:
      tags: [nodes]
      operationId: revokeJoinToken
      summary: Withdraw a minted join token before it expires.
      description: |
        Operator-only. The token stops working immediately: it is
        forgotten here, so presenting it afterwards is indistinguishable
        from presenting one that never existed, which is the right
        answer — a revoked credential should not confirm it was ever
        real.

        **Minting one does not withdraw another** (`mintJoinToken` says
        so), which is exactly why this exists: before it, a token pasted
        into the wrong window stayed live for the rest of its TTL and
        the only remedy was to wait.

        Revoking a token that has already enrolled a node is allowed and
        changes nothing about that node — membership is in the
        replicated log and a spent token cannot be spent again. It only
        clears the row.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: The `id` from `mintJoinToken` or `listJoinTokens`, never the token.
      responses:
        '204':
          description: Revoked, or already gone.
        '401':
          $ref: 'components/common.yaml#/components/responses/Problem'
        '404':
          $ref: 'components/common.yaml#/components/responses/Problem'

  /v1/nodes/enroll:
    post:
      tags: [nodes]
      operationId: enrollNode
      summary: Exchange a join token and a public key for membership.
      description: |
        Called by the **agent**, not by the operator, and authenticated by
        the join token rather than a session — the node presenting it has
        no credential yet. This is the one endpoint here that does not
        take a session token.

        The agent generates its keys first and sends only their public
        halves: the identity keys for sealing and for address
        announcements, and its **token key**. **No private key leaves the
        node.** In exchange it receives its name, the current epoch, this
        root's identity, and a trust bundle that already lists the new
        node's key, so its own tokens verify from the first request.

        A `gateway` grant on the join token becomes this node's grant in
        the bundle. The node cannot ask for one.

        The `url` it sends is recorded as `Node.url` — where this root
        probes it, forwards declarations to it, and where a gateway sends
        a stop or start for a runtime it owns. An enrollment without one
        is accepted and produces a node nothing can reach, which the node
        list shows as `reachable: false` until it re-enrolls. It is
        checked against the same rule `announceNodeAddress` applies: an
        address that can never be a node is a 400, checked **before** the
        join token is consumed. Any reachability class is allowed here,
        unlike on the announcement, because a join token is
        operator-minted and the operator is therefore present.

        Idempotent on the token: re-presenting a consumed token returns
        409 rather than enrolling a second node, because a join token
        that could be replayed is a join token that could be stolen.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnrollmentRequest'
      responses:
        '201':
          description: Enrolled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Enrollment'
        '400':
          description: |
            Malformed public key, a name that collides, or a `url` that
            can never be a node's address.
          content:
            application/problem+json:
              schema:
                $ref: 'components/common.yaml#/components/schemas/Problem'
        '401':
          description: Token unknown, expired, or already used.
          content:
            application/problem+json:
              schema:
                $ref: 'components/common.yaml#/components/schemas/Problem'
        '409':
          description: This token has already enrolled a node.
          content:
            application/problem+json:
              schema:
                $ref: 'components/common.yaml#/components/schemas/Problem'

  # -------- control: this root's own state --------

  /v1/control/status:
    get:
      tags: [control]
      operationId: controlStatus
      summary: This root's role, epoch, applied index, and its standbys' lag.
      description: |
        The one call that answers "is failover safe right now". A standby
        whose `appliedIndex` trails the active root's cannot be promoted
        without losing whatever it has not applied, and this is where an
        operator sees that before deciding rather than after.

        Readable by an operator session and by a member node's `agent`
        or `gateway` service token, because an agent needs to learn the
        current epoch.
      responses:
        '200':
          description: Control-root state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ControlStatus'
        '401':
          $ref: 'components/common.yaml#/components/responses/Problem'

  /v1/control/log:
    get:
      tags: [control]
      operationId: readLog
      summary: Pull control-state log entries after a given index.
      description: |
        How a standby stays current. Standbys **pull**; the active root
        never pushes — that keeps exactly one writer, lets a standby
        measure its own lag honestly, and means the standby initiates the
        connection, which is the direction that survives a firewall
        between buildings.

        Entries are gapless and strictly increasing in `index`. A caller
        that receives a gap must re-snapshot rather than guess, which is
        why the response reports `firstAvailableIndex`: after compaction
        the tail an old standby wants may no longer exist.

        Timestamps on entries are informational. **Index is the only
        ordering**, so clock skew between hosts cannot affect
        correctness.

        **An operator session, or the standby's own token.** The entries
        include the ones that wrote the install's key material, so this is
        the same door as `readSnapshot` and takes the same credentials; see
        there for why.

        Each read by the standby records where it is: `after` is the index
        it has applied (`ControlStatus.standbys`).
      parameters:
        - in: query
          name: after
          required: true
          description: Return entries with `index` strictly greater than this.
          schema:
            type: integer
            format: int64
            minimum: 0
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
      responses:
        '200':
          description: Entries, oldest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogPage'
        '401':
          $ref: 'components/common.yaml#/components/responses/Problem'
        '409':
          description: |
            `after` predates `firstAvailableIndex` — the entries were
            compacted away. Take a snapshot instead.
          content:
            application/problem+json:
              schema:
                $ref: 'components/common.yaml#/components/schemas/Problem'

  /v1/control/snapshot:
    get:
      tags: [control]
      operationId: readSnapshot
      summary: The applied state as of one index, for bootstrapping a standby.
      description: |
        A new standby starts here and then follows the log from
        `index`. Also the recovery path for a standby that fell behind
        compaction.

        Contains topology, the node registry and the sealed recovery key
        — everything in the replication set except the passphrase, which
        exists only in the operator's head, and per-component secrets,
        which are sealed on the hosts that read them and never travel
        here.

        **An operator session, or the standby's own token**, narrower than
        every other read on this root and deliberately so. What comes back
        includes `sealedSigningKey`, `salt` and `passphraseVerifier`, so
        any other holder gains an **offline attack on the operator's
        passphrase** by reading it. Until 2026-09-25 a year-long
        `service:control` token opened it, and this root handed one to
        every node on every poll.

        **The standby's token** (2026-10-08,
        `docs/design/warm-standby.md`): a `sub: standby` service token,
        addressed to `control`, signed by the key of the one node that
        holds the `standby` grant (`makeStandby`). It is checked against
        this root's applied state on every request, so removing the grant
        shuts the next pull out while the token still has time left. No
        other node, and no other token kind, opens this or the log.
      responses:
        '200':
          description: Snapshot at an index.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Snapshot'
        '401':
          $ref: 'components/common.yaml#/components/responses/Problem'

  /v1/control/promote:
    post:
      tags: [control]
      operationId: promote
      summary: Promote this standby to active. Operator action, passphrase required.
      description: |
        Called **on the standby**, never on the active root, and never by
        a timer. The passphrase is required because a standby holds the
        Argon2id salt and a verifier but not the master key — which is
        exactly why the master key never has to exist here at rest or
        cross the wire: promotion is manual, so the operator is present
        at the one moment it is needed.

        The standby verifies the passphrase, derives the master key,
        confirms its applied index, increments the epoch, appends a
        `promote` entry, and begins accepting writes. Then it **announces
        the epoch** to every enrolled node: it pushes a trust bundle
        carrying the new epoch (`POST /v1/node/trust-bundle`,
        `agent.yaml`), signed with the control identity that promotion
        deliberately preserved. Agents record it and fence the old root
        by refusing its lower one. A node that is `down` during the
        announcement learns the epoch when it next pulls the bundle, which
        is the bounded, visible window this document accepts in place of
        quorum.

        **Refusing to promote is a valid outcome.** A standby that cannot
        prove its state reports how far behind it is and returns 409;
        silently promoting a stale root is how an install loses its node
        registry. `force` exists for the operator who has decided that
        losing the tail is better than staying down, and it says so.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PromoteRequest'
      responses:
        '200':
          description: Promoted; the new epoch is in the response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ControlStatus'
        '401':
          description: Passphrase rejected.
          content:
            application/problem+json:
              schema:
                $ref: 'components/common.yaml#/components/schemas/Problem'
        '409':
          description: |
            This root is already active, or the standby is behind and
            `force` was not set. `detail` reports the gap.
          content:
            application/problem+json:
              schema:
                $ref: 'components/common.yaml#/components/schemas/Problem'

  /v1/control/rotate-key:
    post:
      tags: [control]
      operationId: rotateSigningKey
      summary: Replace this root's token key. Every session and client key ends.
      description: |
        The emergency lever for "this root's token key may have leaked".
        It generates a new key, seals it into the log, and publishes a
        bundle naming only the new key. Every operator session and every
        client key in the install stops verifying at once, and has to be
        signed in again or reissued.

        Node keys are untouched and nothing private is distributed:
        only the bundle moves, the same way a revocation's does.
      responses:
        '202':
          description: Rotated; the new bundle is being pushed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrustChange'
        '401':
          $ref: 'components/common.yaml#/components/responses/Problem'
        '409':
          description: This host is a standby and does not accept writes.
          content:
            application/problem+json:
              schema:
                $ref: 'components/common.yaml#/components/schemas/Problem'

  /v1/trust/bundle:
    get:
      tags: [control]
      operationId: getTrustBundle
      summary: The signed set of keys every verifier in the install trusts.
      security: []
      description: |
        **Public, and safe to be.** The bundle holds public keys and
        signed-out session ids, and its signature is the credential: an
        agent checks it against the identity key it pinned at enrollment
        and refuses a lower `version` than it holds. Every agent pulls it
        every 60 seconds and whenever this root becomes reachable again.
        That pull is how a node that was down during a revocation
        catches up.

        A sealed root still answers, with the last bundle it signed,
        which it keeps on disk. A root that has never signed one answers
        503.

        **A bearer, when sent, must verify**: a member's own `sub: agent`
        token, or 401. **It is not on the entry point's public route**
        (`public_sites`, J31): the bundle names every node, its keys and
        grants, and the signed-out session ids, which is nobody's business
        on the internet, and no Job Site needs it. A site's key is checked by
        this root alone and is never in the bundle. A request marked as
        having come that way (`X-Eugene-Plexus-Entry: public-sites`, set by
        the entry point and stripped from everything else) is refused
        without a token, in case an older entry point forwards it.
      responses:
        '200':
          description: The current bundle.
          content:
            application/json:
              schema:
                $ref: 'components/common.yaml#/components/schemas/SignedTrustBundle'
        '401':
          $ref: 'components/common.yaml#/components/responses/Problem'
        '503':
          $ref: 'components/common.yaml#/components/responses/Problem'

  /v1/trust/tls:
    get:
      tags: [control]
      operationId: getRootTls
      summary: The TLS public keys this root's nodes name presents, signed by its identity.
      security: []
      description: |
        **Public, and safe to be: public keys only** (J7a, Troy,
        2026-10-05). A Job Site pins this root's identity key from its
        join command, not a certificate. Before it sends a join token or
        a password, and whenever a connection presents a key it has not
        seen, it fetches this list over that same connection, checks the
        signature against the pinned key, and accepts the connection only
        when the key it was shown is listed and its certificate has not
        expired. So renewals need nobody, and no public CA or DNS name is
        needed.

        The root learns the keys by connecting to its own nodes name: to
        its entry point on loopback, or to the public name when an
        outside proxy holds the certificate. When it cannot, this answers
        503 with the reason, and a site joins nothing rather than trust
        what it was shown.
      responses:
        '200':
          description: The current signed list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignedRootTls'
        '503':
          $ref: 'components/common.yaml#/components/responses/Problem'

  # -------- topology: install-wide --------

  /v1/components:
    get:
      tags: [topology]
      operationId: listComponents
      summary: Every component in the install, across every node.
      description: |
        The install-wide view. Each entry carries the `node` it runs on,
        which the agent's own `/v1/components` cannot report because it
        only knows its own host.
      responses:
        '200':
          description: Components across all nodes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComponentPlacementList'
        '401':
          $ref: 'components/common.yaml#/components/responses/Problem'
        '503':
          description: |
            No node is reachable. Distinct from an empty list, which
            would mean nothing is declared.
          content:
            application/problem+json:
              schema:
                $ref: 'components/common.yaml#/components/schemas/Problem'

  /v1/runtimes:
    get:
      tags: [topology]
      operationId: listRuntimes
      summary: The union of every node's runtimes, each tagged with its node.
      description: |
        What the runtime dashboard reads once an install spans hosts.
        Assembled by asking each enrolled node's agent, so a node that is
        `down` contributes `unreachableNodes` rather than silently
        contributing nothing — a dashboard that shows fewer runtimes than
        exist, with no indication why, is worse than one that says a host
        is unreachable.
      responses:
        '200':
          description: Runtimes across all reachable nodes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuntimePlacementList'
        '401':
          $ref: 'components/common.yaml#/components/responses/Problem'
    post:
      tags: [topology]
      operationId: createRuntime
      summary: Declare a runtime on a node, forwarded to that node's agent.
      description: |
        Accepted here and **forwarded** to the target node's agent, which
        is what makes "the operator talks to the control root" true
        rather than aspirational. `node` selects the host; omitted, it
        means the node the control root runs on, which keeps a
        single-host install from having to name anything.

        Validation that needs the host — does this model path exist, is
        this port free, does the engine adapter know these flags — can
        only happen on the agent, so this endpoint's failures are largely
        relayed from there. A 502 means the agent refused or was
        unreachable, and `detail` carries what it said.

        **`spec.modelPath` is the library's spelling and stays that
        way** (M11). The library names a model by its path on the
        library's host; the target node resolves where the same file is
        on its own disk through its agent's `pathMappings`, at spawn,
        and reports the result as `Runtime.localPath`. Nothing here
        translates the path, and nothing here knows how to — a mount is
        a fact about one host that only that host can check. A node
        that cannot find the file refuses with a 422 naming the path,
        the node and the mapping fix, and that refusal is what the 502
        relays.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RuntimePlacementSpec'
      responses:
        '201':
          description: Declared on the target node.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuntimePlacement'
        '400':
          $ref: 'components/common.yaml#/components/responses/Problem'
        '404':
          description: No such node.
          content:
            application/problem+json:
              schema:
                $ref: 'components/common.yaml#/components/schemas/Problem'
        '502':
          description: The target node's agent refused or was unreachable.
          content:
            application/problem+json:
              schema:
                $ref: 'components/common.yaml#/components/schemas/Problem'

  # -------- auth --------

  /v1/auth/status:
    get:
      tags: [auth]
      operationId: authStatus
      summary: Whether this install has been through first-run setup.
      security: []
      description: |
        Called by the UI on every page load to tell a fresh install from
        a logged-out one. Unauthenticated by necessity — it is what the
        UI asks *before* it has a token.
      responses:
        '200':
          description: Initialization state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthStatus'

  /v1/auth/initialize:
    post:
      tags: [auth]
      operationId: authInitialize
      summary: Set the operator passphrase on a fresh install.
      security: []
      description: |
        First-run only, and refused once `initialized` is true. Derives
        the master key via Argon2id and generates this root's token
        key and its epoch-1 identity.

        The passphrase is unrecoverable by design: losing it means losing
        every sealed secret in the install, including the recovery
        recipient that would otherwise reach a dead node's credentials.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthInitializeRequest'
      responses:
        '204':
          description: Initialized.
        '409':
          description: Already initialized.
          content:
            application/problem+json:
              schema:
                $ref: 'components/common.yaml#/components/schemas/Problem'

  /v1/auth/login:
    post:
      tags: [auth]
      operationId: authLogin
      summary: Exchange the operator passphrase for a session token.
      security: []
      description: |
        **The only place an operator session is minted** in an enrolled
        install. An agent's own login forwards here.

        The session's `aud` depends on who asked:

        * **An agent forwarding a sign-in** sends its own service token
          (`sub: agent`, addressed to `control`) as `Authorization`. The
          session is then addressed to that machine and to this root:
          `["node:<name>", "control"]`.
        * **A login with no such token** gets `["control"]`: the wizard,
          a sealed-root unlock, or a caller reaching this port directly.

        A correct passphrase also unseals this root when it is locked.

        Returns `common.yaml`'s shared `AuthLoginResponse`, the same
        shape the agent's login returns, so the field is `sessionToken`.

        It was not always. This document used to define its own local
        `SessionToken` whose field was `token`, which meant the one
        concept had two wire shapes in one install and the UI's session
        handling could not be reused against the trust root. A component
        redefining a shared schema locally is precisely what the shared
        `specs` repo exists to prevent, so the duplicate is gone rather
        than documented.
      responses:
        '200':
          description: Session issued.
          content:
            application/json:
              schema:
                $ref: 'components/common.yaml#/components/schemas/AuthLoginResponse'
        '401':
          description: Passphrase rejected.
          content:
            application/problem+json:
              schema:
                $ref: 'components/common.yaml#/components/schemas/Problem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthInitializeRequest'

  /v1/auth/sessions/current:
    delete:
      tags: [auth]
      operationId: authLogout
      summary: Sign the presented session out, everywhere in the install.
      description: |
        Appends a replicated `revokeSession` entry. The session's `jti`
        joins the trust bundle's `revokedSessions`, and the new bundle is
        pushed, so every machine refuses the session and every token
        exchanged from it (by `sid`) within seconds. An agent's own
        sign-out forwards here, and keeps a local copy for when this
        root cannot be reached.
      responses:
        '204':
          description: Signed out.
        '401':
          $ref: 'components/common.yaml#/components/responses/Problem'

  /v1/auth/token:
    post:
      tags: [auth]
      operationId: exchangeToken
      summary: Exchange a session for a short-lived token addressed to one other machine.
      description: |
        RFC 8693 token exchange. It is **how the console acts on another
        machine without handing it the session**.

        **Who calls it.** The agent the operator signed in on, from its
        proxy, whenever a request is going to a different machine.
        `Authorization` is that agent's own service token
        (`sub: agent`, addressed to `control`), the actor.
        `subjectToken` is the operator's session.

        **What is checked.**

        * The session verifies, is not signed out, and is addressed to
          the actor's machine. A session cannot be exchanged by a
          machine it was not issued to.
        * `audience` names an enrolled node.

        **What comes back.** An `ep-session+jwt` addressed to that one
        node and living 5 minutes, and never beyond the session's own
        `exp`. It carries `act: {"sub": "node:<actor>"}` and
        `sid: <session jti>`, so signing the session out, or revoking
        the actor's machine, ends it too. The receiving machine sees only
        this token, and it is worthless anywhere else.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenExchangeRequest'
      responses:
        '200':
          description: Exchanged.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenExchangeResponse'
        '400':
          description: '`audience` names no enrolled node.'
          content:
            application/problem+json:
              schema:
                $ref: 'components/common.yaml#/components/schemas/Problem'
        '401':
          description: |
            The actor token or the session does not verify, the session
            is signed out, or the session is not addressed to the actor's
            machine.
          content:
            application/problem+json:
              schema:
                $ref: 'components/common.yaml#/components/schemas/Problem'
        '503':
          $ref: 'components/common.yaml#/components/responses/Problem'

  /v1/config:
    get:
      tags: [config]
      operationId: getConfig
      summary: Read the control root's configuration.
      description: |
        UI preferences, `firstRunComplete`, `securityMode`, and the
        standby endpoints this root replicates to.

        **`securityMode: os_keyring` is host-bound** and this is where
        that bites: the master key sits in *this* machine's Credential
        Manager or Keychain, so a standby on another host cannot inherit
        auto-unlock and will require the passphrase at promotion. That is
        consistent with promotion being a human act anyway, but the
        wizard has to say so in words rather than let it be discovered
        during a failover.

        **`securityMode: passphrase_file` is not host-bound**, and exists
        because `os_keyring` cannot work everywhere: a container has no
        Credential Manager, no Keychain and no Secret Service daemon, so
        a containerised root came back from every restart sealed and
        routing nothing until a person signed in. This mode reads the
        passphrase from a path given by
        `EUGENE_PLEXUS_CONTROL_PASSPHRASE_FILE` and derives the key the
        same way login does. Mount the same secret on a standby and the
        promotion above needs nobody either.

        Both auto-unlock modes make the same trade and neither is the
        default: whoever can read the store — this machine's keyring, or
        that file — can unlock the install without knowing the
        passphrase.
      responses:
        '200':
          description: Current config.
          content:
            application/json:
              schema:
                $ref: 'components/common.yaml#/components/schemas/ConfigDocument'
        '401':
          $ref: 'components/common.yaml#/components/responses/Problem'
    patch:
      tags: [config]
      operationId: updateConfig
      summary: Partial update of the control root's configuration.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: 'components/common.yaml#/components/schemas/ConfigUpdateRequest'
      responses:
        '200':
          description: Update outcome, per key.
          content:
            application/json:
              schema:
                $ref: 'components/common.yaml#/components/schemas/ConfigUpdateResult'
        '400':
          $ref: 'components/common.yaml#/components/responses/Problem'
        '401':
          $ref: 'components/common.yaml#/components/responses/Problem'

  /v1/config/schema:
    get:
      tags: [config]
      operationId: getConfigSchema
      summary: UI-renderable description of every editable config field.
      responses:
        '200':
          description: Config schema.
          content:
            application/json:
              schema:
                $ref: 'components/common.yaml#/components/schemas/ConfigSchema'

  /healthz:
    get:
      tags: [meta]
      operationId: healthz
      summary: Liveness probe.
      security: []
      description: |
        Healthy on a standby as well as on the active root — a standby
        that is up and replicating is doing its job. Read
        `GET /v1/control/status` for role and lag; this endpoint answers
        only whether the process is alive.
      responses:
        '200':
          description: Healthy.
          content:
            application/json:
              schema:
                $ref: 'components/common.yaml#/components/schemas/Health'
        '503':
          description: Not ready.
          content:
            application/json:
              schema:
                $ref: 'components/common.yaml#/components/schemas/Health'

  /v1/sites:
    get:
      operationId: listSites
      tags: [sites]
      summary: Every Job Site, for membership
      description: |
        Needs the `membership` capability (J15). What Eugene's owner sees of
        a site is membership only (J19): who owns it, whether it is online,
        and the node that hosts it. **In dev mode** each site also carries
        `dev` (J33): its folders and servers as it last reported them, and
        Eugene's owner's own access there (J13b), which works only if the
        site's owner lets Eugene's owner in (J6e).
      responses:
        '200':
          description: The sites.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SiteList'}
        '401':
          $ref: 'components/common.yaml#/components/responses/Problem'
        '403':
          $ref: 'components/common.yaml#/components/responses/Problem'

  /v1/sites/invitations:
    post:
      operationId: inviteSite
      tags: [sites]
      summary: Invite a machine to be one person's Job Site
      description: |
        Needs the `membership` capability. Mints a single-use join token
        naming a person, who confirms at the machine with their own password
        and becomes the site's owner (remote-nodes.md §3.3, rule 1). Eugene's
        owner invites; the person owns (J11). The machine must already be a
        node (J21); the join command adds the site to it without reinstalling
        anything (J35). Listed and withdrawn with the node join tokens
        (`/v1/nodes/join-tokens`), where its record has `kind: site`.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SiteInvitationRequest'}
      responses:
        '201':
          description: The invitation. The token is shown once.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SiteInvitation'}
        '401':
          $ref: 'components/common.yaml#/components/responses/Problem'
        '403':
          $ref: 'components/common.yaml#/components/responses/Problem'
        '422':
          description: The person does not exist or is disabled.
          content:
            application/problem+json:
              schema:
                $ref: 'components/common.yaml#/components/schemas/Problem'

  /v1/sites/enroll:
    post:
      operationId: enrollSite
      tags: [sites]
      summary: A site host exchanges a site invitation and its public key for membership
      description: |
        Called by the **site host**, at the machine, and authenticated by the
        join token, its only credential. In order: the token is a site
        invitation that has not been spent; the person it names confirms
        with their own password, rate-limited as a sign-in is; no site or
        node uses the token key. Then the token is spent and `enrollSite` is
        appended. A site has no address, so nothing on it is ever dialled:
        it polls (J23). One of the seven paths of the entry point's public mode
        (`public_sites`, J31), where failed joins are rate-limited too.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SiteEnrollmentRequest'}
      responses:
        '201':
          description: Enrolled.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SiteEnrollment'}
        '400':
          description: A malformed key, or a key another site or node already uses.
          content:
            application/problem+json:
              schema:
                $ref: 'components/common.yaml#/components/schemas/Problem'
        '401':
          description: The token is unknown, expired or not a site invitation, or the person's password is wrong.
          content:
            application/problem+json:
              schema:
                $ref: 'components/common.yaml#/components/schemas/Problem'
        '403':
          description: The person is disabled, or is not the one the invitation names.
          content:
            application/problem+json:
              schema:
                $ref: 'components/common.yaml#/components/schemas/Problem'
        '409':
          description: This token has already enrolled a site.
          content:
            application/problem+json:
              schema:
                $ref: 'components/common.yaml#/components/schemas/Problem'
        '429':
          description: Too many failed joins; try again shortly.
        '503':
          description: The root is locked.

  /v1/sites/poll:
    post:
      operationId: pollSite
      tags: [sites]
      summary: A site reports what it holds and waits for an operation
      description: |
        A site token (`siteToken`). A long poll of about 8 seconds; the site
        is *online* while it has polled within the last 25. The report is
        kept as a cache for listings.
      security: [{siteToken: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SiteReport'}
      responses:
        '200':
          description: An operation to claim, or none.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SitePollAnswer'}
        '401':
          description: Not the token of an enrolled site. A removed site is told so here, and its site host stops.
        '503':
          description: The root is locked.

  /v1/sites/operations/{ident}/claim:
    parameters:
      - name: ident
        in: path
        required: true
        schema: {type: string}
    post:
      operationId: claimSiteOperation
      tags: [sites]
      summary: A site claims one operation queued for it
      description: |
        A site token, for this site's own operations only. Permission is
        checked again at the claim, and a claimed operation is never offered
        again. The operation names the site and its `enrolledAt`; the site
        refuses one that is not its own.
      security: [{siteToken: []}]
      responses:
        '200':
          description: The operation.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SiteOperation'}
        '401':
          description: Not the token of an enrolled site.
        '403':
          description: The person's access was withdrawn after the operation was queued.
        '404':
          description: No such operation for this site, or it was claimed, cancelled or expired.

  /v1/sites/operations/{ident}/result:
    parameters:
      - name: ident
        in: path
        required: true
        schema: {type: string}
    post:
      operationId: finishSiteOperation
      tags: [sites]
      summary: A site answers an operation it claimed
      description: |
        A site token, for this site's own operations only. The answer is at
        most 70,000 bytes, and reaches the caller only after the caller's
        access is checked once more.
      security: [{siteToken: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SiteResult'}
      responses:
        '204':
          description: Recorded.
        '401':
          description: Not the token of an enrolled site.
        '404':
          description: No such running operation for this site.
        '413':
          description: The answer is larger than 70,000 bytes.

  /v1/sites/leave:
    post:
      operationId: leaveSite
      tags: [sites]
      summary: A site leaves the install, from the machine
      description: |
        A site token. Leaving needs no one's permission (remote-nodes.md
        §3.3): `removeSite` is appended and the site's key stops working at
        once. The site host calls it when it is removed at the machine.
      security: [{siteToken: []}]
      responses:
        '204':
          description: Removed.
        '401':
          description: Not the token of an enrolled site.

  /v1/sites/links/check:
    post:
      operationId: checkSitePerson
      tags: [sites]
      summary: A site checks a person's Eugene sign-in, typed at its machine to link them (J36)
      description: |
        A site token. Used by the elevated link step on a Linux system
        install (`install.sh --site-link`), which signs with the site's own
        key: root reads it, as it reads the site host's directory. Answers
        who the person is when the name and password are right, so root can
        write the link; a wrong pair is 401, with the same sentence for
        both. Rate-limited as a sign-in is, per site and per name, so a site
        cannot use it to guess passwords at speed. A disabled person is 403.
        Nothing is recorded at the root: the link lives on the machine. One
        of the seven paths of the entry point's public mode (`public_sites`).
      security: [{siteToken: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SitePersonCheckRequest'}
      responses:
        '200':
          description: The person.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SitePersonCheck'}
        '401':
          description: Not an enrolled site's token, or the name or password is wrong.
        '403':
          description: The person is disabled, lacks `use-job-sites` (J77), or is Eugene's owner, who is not a person on a site.
        '429':
          description: Too many failed checks; try again shortly.
        '503':
          description: The root is locked.

  /v1/sites/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: {$ref: 'components/sites.yaml#/SiteId'}
    delete:
      operationId: removeSite
      tags: [sites]
      summary: Remove a Job Site
      description: |
        Needs the `membership` capability. Revokes the site at once:
        `removeSite` is appended, its key stops working, and its site host
        stops at its next poll and says why. Nothing on the machine is
        touched from here.
      responses:
        '204':
          description: Removed, or already gone.
        '401':
          $ref: 'components/common.yaml#/components/responses/Problem'
        '403':
          $ref: 'components/common.yaml#/components/responses/Problem'
        '503':
          description: The root is locked.

  /v1/sites/{id}/folders/{folder_id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: {$ref: 'components/sites.yaml#/SiteId'}
      - name: folder_id
        in: path
        required: true
        schema: {type: string}
    patch:
      operationId: setSiteFolderOwnerAccess
      tags: [sites]
      summary: Eugene's owner's own access to a site's folder, in dev mode only
      description: |
        Needs the `dev-access` capability (J15), which the passphrase session
        holds. **Dev mode only** (J13b): refused with 409 in production. The
        grant works only if the site's owner lets Eugene's owner in there
        (J6e), which the site checks itself, and it stops working the moment
        the install is in production.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SiteFolderOwnerAccess'}
      responses:
        '200':
          description: The site, with its dev view.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Site'}
        '401':
          $ref: 'components/common.yaml#/components/responses/Problem'
        '403':
          $ref: 'components/common.yaml#/components/responses/Problem'
        '404':
          description: No such site, or the site has not reported that folder.
        '409':
          description: The install is in production mode.
        '422':
          description: Write access to a folder registered read-only.

  /v1/nodes/{name}/standby:
    parameters:
      - name: name
        in: path
        required: true
        schema: {type: string}
    put:
      operationId: makeStandby
      tags: [nodes, control]
      summary: Make this node the install's warm standby
      description: |
        One `setStandby` entry (`on: true`) that gives the node the
        `standby` grant (`docs/design/warm-standby.md`, SB1). The new trust
        bundle is pushed to every node. The node's agent then starts a
        standby control root that follows this one with a `sub: standby`
        token (SB2, SB3).

        **What the standby holds.** It keeps a copy of the replication set:
        the sealed keys, the salt and the passphrase verifier. Its node key
        (until the grant is removed) or its disk is enough to try guessing
        the passphrase offline. Promotion still needs the passphrase.

        A session holding the `membership` capability. Doing it again for
        the node that already holds the grant changes nothing and answers
        the same.
      responses:
        '202':
          description: The node holds the grant; the new bundle is being pushed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrustChange'
        '401':
          $ref: 'components/common.yaml#/components/responses/Problem'
        '403':
          $ref: 'components/common.yaml#/components/responses/Problem'
        '404':
          $ref: 'components/common.yaml#/components/responses/Problem'
        '409':
          description: |
            Another node is already the standby (one at a time; the problem
            names it), the node is this root's own, or this host is a
            standby and accepts no writes. Nothing changed.
          content:
            application/problem+json:
              schema:
                $ref: 'components/common.yaml#/components/schemas/Problem'
        '503':
          description: |
            Locked: the identity key that signs the bundle is not in
            memory. Nothing changed.
          content:
            application/problem+json:
              schema:
                $ref: 'components/common.yaml#/components/schemas/Problem'
    delete:
      operationId: stopStandby
      tags: [nodes, control]
      summary: Stop this node being the standby
      description: |
        One `setStandby` entry (`on: false`). The node's next pull is
        refused, whatever its token's remaining life, because the
        replication routes check the applied state on every request. Its
        agent stops the standby and deletes its copy of the replication
        set when the new bundle reaches it.

        A session holding the `membership` capability. A node that is not
        the standby answers the same, and nothing is appended.
      responses:
        '202':
          description: The grant is gone; the new bundle is being pushed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrustChange'
        '401':
          $ref: 'components/common.yaml#/components/responses/Problem'
        '403':
          $ref: 'components/common.yaml#/components/responses/Problem'
        '404':
          $ref: 'components/common.yaml#/components/responses/Problem'
        '409':
          description: This host is a standby and accepts no writes.
          content:
            application/problem+json:
              schema:
                $ref: 'components/common.yaml#/components/schemas/Problem'
        '503':
          description: Locked. Nothing changed.
          content:
            application/problem+json:
              schema:
                $ref: 'components/common.yaml#/components/schemas/Problem'
  /v1/nodes/{name}/hosted-sites:
    parameters:
      - name: name
        in: path
        required: true
        schema: {type: string}
    put:
      operationId: putHostedSites
      tags: [nodes, sites]
      summary: A node says which sites its agent supervises
      description: |
        That node's own `agent` service token, addressed to `control`;
        another node's is refused. Appends `setSiteHost` for each listed site
        whose recorded host differs, and clears this node from the sites it
        no longer lists (J32). **For display and cross-links only**: nothing
        is authorized by it, so a node that lied could only mislabel. A site
        id that is not enrolled is ignored.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/HostedSites'}
      responses:
        '204':
          description: Recorded.
        '401':
          $ref: 'components/common.yaml#/components/responses/Problem'
        '403':
          $ref: 'components/common.yaml#/components/responses/Problem'
  /oidc/sites/servers:
    post:
      operationId: listMySiteServers
      tags: [sites]
      summary: The servers on machines that the signed-in person may use
      description: |
        Every server on a Job Site that the person may use. Each site has one
        file server, `files`, listed once with the folders the person may use
        there by the names its tools' `folder` argument takes (J6g), and the
        local servers it lets them use: what the site's own list says, as the
        site last reported it (J6b). The site checks each call again. An
        enrolled Workbench client secret and its signed-in person's refresh
        credential.
      security: [{helperClient: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/JobSiteRequest'}
      responses:
        '200':
          description: The servers, and the install's mode.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SiteServerList'}
        '401':
          description: Workbench client or person sign-in is invalid.
        '403':
          description: This sign-in or app access was withdrawn.
        '503':
          description: Eugene is locked.
  /oidc/sites/mcp:
    post:
      operationId: callSiteServer
      tags: [sites]
      summary: One MCP request to one server on one machine
      description: |
        Carries one MCP request of the 2026-07-28 revision (`server/discover`,
        `tools/list`, `tools/call`) to the site, which claims it on its next
        poll (J6a). The root checks the Workbench client and the person's
        sign-in; the site's own policy decides (J8). A destructive tool runs
        only under the site owner's standing pre-approval. Since 2b.3b each
        call runs under its workspace's rule (J70): `allow` at once, `ask` only
        with `asked` (J72), which this root carries and does not check. Since
        J14b, for a person with a key, the site answers `held` (`held` says
        what to sign) until the call comes again with `approval`, signed by
        the person; this root carries it and cannot make one. The
        request is at most 40,000 bytes; the answer at most 70,000. A `tools/call` the site
        claimed but did not confirm is `uncertain`: it may have acted.
      security: [{helperClient: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SiteMcpCall'}
      responses:
        '200':
          description: The machine's answer, or its refusal in its own words.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SiteMcpAnswer'}
        '401':
          description: Workbench client or person sign-in is invalid.
        '403':
          description: Not granted, or this sign-in or app access was withdrawn.
        '409':
          description: This operation id was used already.
        '413':
          description: The request is too large.
        '429':
          description: The machine is busy.
        '503':
          description: The site is offline or needs an update.
        '504':
          description: The machine did not answer in time.
  /oidc/sites/cancel:
    post:
      operationId: cancelSiteCall
      tags: [sites]
      summary: Cancel a queued operation belonging to this Workbench sign-in
      description: |
        Prevents a queued operation from being claimed. A tool call already
        running may finish; cancellation never implies rollback. Reusing the
        same operation id is refused for five minutes while this root process
        remains running.
      security: [{helperClient: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SiteCancel'}
      responses:
        '204':
          description: Cancelled, already finished, or not yet submitted.
        '401':
          description: Workbench client or person sign-in is invalid.
        '403':
          description: This sign-in or app access was withdrawn.
        '429':
          description: Too many recent operations.

  /oidc/sites/link/remove:
    post:
      operationId: removeSiteLink
      tags: [sites]
      summary: Remove a person's link to an OS account on a site's machine
      description: |
        A person removes their own link; the site's owner may name anyone's
        (§3.2). The root asks the agent that hosts the site
        (`DELETE /v1/site/links/{subject}` there, with the root's token),
        because the link lives on the machine and only its starter writes
        it. Removing a link only takes access away: from then on that
        person's calls there run as the owner, confined, if the owner shares
        a folder with them, and otherwise not at all. A Linux system install
        removes a link with the elevated one-liner instead (J36); there the
        answer is 409, saying so.
      security: [{helperClient: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SiteLinkRemove'}
      responses:
        '204':
          description: Removed, or there was none.
        '401':
          description: Workbench client or person sign-in is invalid.
        '403':
          description: Not the person's own link, and they do not own the site.
        '404':
          description: No such site, or it is not one the person owns or may use.
        '409':
          description: The site's machine links people only with the elevated one-liner, or no node hosts it now; `detail` says which.
        '503':
          description: The machine's agent did not answer.

  /oidc/install-mode:
    post:
      operationId: getInstallMode
      tags: [sites]
      summary: The install's mode, for an app to tell every person it serves
      description: |
        `production` or `dev` (J13, J18). In dev mode Eugene's owner sees all
        tool information, Job Site results included, and may grant themselves
        a site's folders; every person is told. Results produced in production
        stay hidden from the owner after a switch to dev. A new install starts
        in production. An enrolled Workbench client authenticates; no person
        is needed, because the mode is the same for everyone.
      security: [{helperClient: []}]
      responses:
        '200':
          description: The mode, and when it last changed.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/InstallMode'}
        '401':
          description: Authentication, current permission, state, or availability refused the request.
        '403':
          description: Authentication, current permission, state, or availability refused the request.
        '404':
          description: Authentication, current permission, state, or availability refused the request.
        '409':
          description: Authentication, current permission, state, or availability refused the request.
        '503':
          description: Authentication, current permission, state, or availability refused the request.

  /oidc/job-sites:
    post:
      operationId: listMyJobSites
      tags: [sites]
      summary: The signed-in person's own Job Sites, and those they are linked to
      description: |
        Every Job Site this person owns, with its folders, its servers and
        who may use which tool, as each site last reported them. Since 2b.3b
        also every site whose last report links them to an OS account there
        (`role: linked`), showing only their own: their workspaces, their
        link and their keys' state. A Job Site's
        owner is the only one who grants its tools (J11), and the site keeps
        that list itself (J6b). Authenticated as `/oidc/sites/*` is: an
        enrolled Workbench client and the person's refresh credential.
      security: [{helperClient: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/JobSiteRequest'}
      responses:
        '200':
          description: The person's sites.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/JobSiteList'}
        '401':
          description: Authentication, current permission, state, or availability refused the request.
        '403':
          description: Authentication, current permission, state, or availability refused the request.
        '404':
          description: Authentication, current permission, state, or availability refused the request.
        '409':
          description: Authentication, current permission, state, or availability refused the request.
        '503':
          description: Authentication, current permission, state, or availability refused the request.

  /oidc/job-sites/invite:
    post:
      operationId: inviteMyJobSite
      tags: [sites]
      summary: A join command for one of the signed-in person's own machines
      description: |
        Self-service (J9): any signed-in person with `add-job-sites` (J77,
        on by default) may add a Job Site for a machine of their own; 403
        without it. Mints a site invitation naming them, valid 15
        minutes, at most three outstanding per person. The machine must
        already be a node (J21); the join command, run there, adds the site
        without reinstalling the node (J35), and the person confirms with
        their own password. The machine joins through `joinUrl`: the entry
        point's nodes name, else the address Eugene's owner set
        (`siteJoinUrl`). The public route is not needed on the root's own
        network (J31). 409 when this root knows neither address. Eugene's
        owner signs in with the passphrase and owns no Job Sites: to use one,
        they make a person account for themselves.
      security: [{helperClient: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/JobSiteInviteRequest'}
      responses:
        '200':
          description: The invitation. The token is shown once.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/JobSiteInvite'}
        '401':
          description: Authentication, current permission, state, or availability refused the request.
        '403':
          description: Authentication, current permission, state, or availability refused the request.
        '404':
          description: Authentication, current permission, state, or availability refused the request.
        '409':
          description: Authentication, current permission, state, or availability refused the request.
        '503':
          description: Authentication, current permission, state, or availability refused the request.
  /oidc/job-sites/{site}/servers/{server}/access:
    parameters:
      - {name: site, in: path, required: true, schema: {$ref: 'components/sites.yaml#/SiteId'}}
      - {name: server, in: path, required: true, schema: {$ref: 'components/sites.yaml#/SiteServerId'}}
    post:
      operationId: setMyJobSiteAccess
      tags: [sites]
      summary: Say who may use which tools of one local server on the person's own Job Site
      description: |
        For a local server only; workspaces are shared through the site's
        own workspace actions (2b.3b). Replaces
        the server's list of people, the site's owner included (J11: the
        owner grants their own access too). People are named by how they
        sign in. The site applies it to its own list and answers with what it
        holds (J6b). A destructive tool must be granted as a standing
        pre-approval (`standing: true`), or the site refuses the grant.
      security: [{helperClient: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/JobSiteAccessRequest'}
      responses:
        '202':
          description: The site holds the change until its owner approves it at the machine with their key (J14a). Nothing changed yet.
          content:
            application/json:
              schema: {$ref: 'components/job-sites.yaml#/JobSiteHeld'}
        '200':
          description: The server and who may use it, as the site now holds them.
          content:
            application/json:
              schema: {$ref: 'components/job-sites.yaml#/JobSiteServer'}
        '401':
          description: Workbench client or person sign-in is invalid.
        '404':
          description: The person owns no such site, or it has no such server.
        '422':
          description: The site refused it; `detail` says why in the site's words.
        '503':
          description: The site is offline, its file support is off, or it needs an update.
        '504':
          description: The site did not answer in time.
  /oidc/job-sites/{site}/servers/{server}/enabled:
    parameters:
      - {name: site, in: path, required: true, schema: {$ref: 'components/sites.yaml#/SiteId'}}
      - {name: server, in: path, required: true, schema: {$ref: 'components/sites.yaml#/SiteServerId'}}
    post:
      operationId: enableMyJobSiteServer
      tags: [sites]
      summary: Turn a local server on the person's own Job Site on or off
      description: |
        For a local server only: added at the machine by its administrator,
        it is off until the site's owner turns it on here. The file server is
        on while a folder is registered. A server marked `system` cannot be
        turned on without an administrator's consent recorded at the machine
        (J9).
      security: [{helperClient: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/JobSiteServerEnable'}
      responses:
        '202':
          description: The site holds the change until its owner approves it at the machine with their key (J14a). Nothing changed yet.
          content:
            application/json:
              schema: {$ref: 'components/job-sites.yaml#/JobSiteHeld'}
        '200':
          description: The server, as the site now holds it.
          content:
            application/json:
              schema: {$ref: 'components/job-sites.yaml#/JobSiteServer'}
        '401':
          description: Workbench client or person sign-in is invalid.
        '404':
          description: The person owns no such site, or it has no such server.
        '422':
          description: The site refused it; `detail` says why in the site's words.
        '503':
          description: The site is offline, its file support is off, or it needs an update.
        '504':
          description: The site did not answer in time.
  /oidc/job-sites/{site}/settings:
    parameters:
      - {name: site, in: path, required: true, schema: {$ref: 'components/sites.yaml#/SiteId'}}
    post:
      operationId: setMyJobSiteSettings
      tags: [sites]
      summary: The person's own Job Site's settings
      description: |
        `ownerInDevMode`: let Eugene's owner use the folders they give
        themselves while Eugene is in dev mode (J6e). Off by default. Dev mode
        alone opens nothing on a site.
      security: [{helperClient: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/JobSiteSettings'}
      responses:
        '202':
          description: The site holds the change until its owner approves it at the machine with their key (J14a). Nothing changed yet.
          content:
            application/json:
              schema: {$ref: 'components/job-sites.yaml#/JobSiteHeld'}
        '200':
          description: The site.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/JobSite'}
        '401':
          description: Workbench client or person sign-in is invalid.
        '404':
          description: The person owns no such site, or it has no such server.
        '422':
          description: The site refused it; `detail` says why in the site's words.
        '503':
          description: The site is offline, its file support is off, or it needs an update.
        '504':
          description: The site did not answer in time.
  /oidc/job-sites/{site}/audit:
    parameters:
      - {name: site, in: path, required: true, schema: {$ref: 'components/sites.yaml#/SiteId'}}
    post:
      operationId: readMyJobSiteAudit
      tags: [sites]
      summary: The newest lines of the person's own Job Site's audit log
      description: |
        Kept on the machine, read from it on each request (J8). Who asked for
        what, and what the site decided; never a file's contents or a tool's
        result. Eugene's owner never reads it. Since 2b.3b any person linked
        there reads the lines that belong to them, and the site's owner the
        rest (J80, `SiteAuditEntry`); before, only the site's owner.
      security: [{helperClient: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/JobSiteAuditRequest'}
      responses:
        '200':
          description: The entries, newest first.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/JobSiteAudit'}
        '401':
          description: Workbench client or person sign-in is invalid.
        '404':
          description: The person owns no such site, or it has no such server.
        '422':
          description: The site refused it; `detail` says why in the site's words.
        '503':
          description: The site is offline, its file support is off, or it needs an update.
        '504':
          description: The site did not answer in time.
  /oidc/job-sites/{site}/passkeys:
    parameters:
      - {name: site, in: path, required: true, schema: {$ref: 'components/sites.yaml#/SiteId'}}
    post:
      operationId: pairMyJobSitePasskey
      tags: [sites]
      summary: Pin the owner's passkey at their Job Site, with the code shown at the machine (J14a.3)
      description: |
        Workbench made the passkey at its HTTPS address and computed the MAC
        in the browser from the code the person typed (`SitePasskeyBinding`,
        site-host.yaml); the code itself never reaches this root. This root
        carries the public half and the MAC to the site, which pins the
        passkey only if the MAC checks with the code it showed. Since 2b.3b
        any person linked there pairs their own, which approves only their
        own items (J67); before, only the site's owner.
      security: [{helperClient: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/JobSitePasskeyPair'}
      responses:
        '201':
          description: Pinned.
          content:
            application/json:
              schema: {$ref: 'components/sites.yaml#/SitePasskey'}
        '401':
          description: Workbench client or person sign-in is invalid.
        '404':
          description: The person owns no such site, or nothing is held under that id.
        '422':
          description: The site refused it; `detail` says why in the site's words.
        '503':
          description: The site is offline, or it needs an update to take passkeys.
        '504':
          description: The site did not answer in time.
  /oidc/job-sites/{site}/passkeys/{id}/remove:
    parameters:
      - {name: site, in: path, required: true, schema: {$ref: 'components/sites.yaml#/SiteId'}}
      - {name: id, in: path, required: true, schema: {type: string, pattern: '^[a-f0-9]{32}$'}}
    post:
      operationId: removeMyJobSitePasskey
      tags: [sites]
      summary: Remove one of the owner's passkeys at their Job Site, from Workbench
      description: |
        For a lost phone: the person need not be at the machine. Removing a
        key only takes it away (`passkey.remove`, site-host.yaml); what it
        approved stays, and if it was the person's last key there, nothing
        runs under their rules until they add a key and approve them (J48,
        J79). Since 2b.3b any person linked there removes their own.
      security: [{helperClient: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/JobSiteRequest'}
      responses:
        '204':
          description: Removed.
        '401':
          description: Workbench client or person sign-in is invalid.
        '404':
          description: The person owns no such site.
        '422':
          description: The site refused it (no such passkey); `detail` says why in the site's words.
        '503':
          description: The site is offline, or it needs an update to take passkeys.
        '504':
          description: The site did not answer in time.
  /oidc/job-sites/{site}/held:
    parameters:
      - {name: site, in: path, required: true, schema: {$ref: 'components/sites.yaml#/SiteId'}}
    post:
      operationId: listMyJobSiteHeld
      tags: [sites]
      summary: What the owner's Job Site holds for their approval, read from the site (J14a.3)
      description: |
        With `key`, one of the person's passkeys, each item carries the
        canonical envelope to sign with it. The words are the site's own;
        this root only carries them. Since 2b.3b, for any person linked
        there, their own held changes only.
      security: [{helperClient: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/JobSiteHeldListRequest'}
      responses:
        '200':
          description: The held changes, oldest first, and the owner's passkeys.
          content:
            application/json:
              schema: {$ref: 'components/sites.yaml#/SiteHeldList'}
        '401':
          description: Workbench client or person sign-in is invalid.
        '404':
          description: The person owns no such site, or nothing is held under that id.
        '422':
          description: The site refused it; `detail` says why in the site's words.
        '503':
          description: The site is offline, or it needs an update to take passkeys.
        '504':
          description: The site did not answer in time.
  /oidc/job-sites/{site}/held/{id}/approve:
    parameters:
      - {name: site, in: path, required: true, schema: {$ref: 'components/sites.yaml#/SiteId'}}
      - {name: id, in: path, required: true, schema: {type: string, pattern: '^[a-z0-9]{1,32}$'}}
    post:
      operationId: approveMyJobSiteHeld
      tags: [sites]
      summary: Approve a held change with the person's own passkey (J14a.3; any linked person since 2b.3b)
      description: |
        The assertion is over the envelope `held` listed; the site checks
        it against the passkey it pinned (`SitePasskeyApproval`,
        site-host.yaml) and then applies the change. `id` is `rules` for the
        site's rules as a whole (J52).
      security: [{helperClient: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/JobSitePasskeyApproval'}
      responses:
        '200':
          description: Applied.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/JobSite'}
        '401':
          description: Workbench client or person sign-in is invalid.
        '404':
          description: The person owns no such site, or nothing is held under that id.
        '422':
          description: The site refused it; `detail` says why in the site's words.
        '503':
          description: The site is offline, or it needs an update to take passkeys.
        '504':
          description: The site did not answer in time.
  /oidc/job-sites/{site}/held/{id}/reject:
    parameters:
      - {name: site, in: path, required: true, schema: {$ref: 'components/sites.yaml#/SiteId'}}
      - {name: id, in: path, required: true, schema: {type: string, pattern: '^[a-z0-9]{1,32}$'}}
    post:
      operationId: rejectMyJobSiteHeld
      tags: [sites]
      summary: Turn down a held change from Workbench; it is dropped, never applied
      security: [{helperClient: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/JobSiteRequest'}
      responses:
        '204':
          description: Dropped.
        '401':
          description: Workbench client or person sign-in is invalid.
        '404':
          description: The person owns no such site, or nothing is held under that id.
        '422':
          description: The site refused it; `detail` says why in the site's words.
        '503':
          description: The site is offline, or it needs an update to take passkeys.
        '504':
