        '504':
          description: The site did not answer in time.
  /oidc/job-sites/{site}/workspaces/{workspace_id}/rules:
    parameters:
      - {name: site, in: path, required: true, schema: {$ref: 'components/sites.yaml#/SiteId'}}
      - {name: workspace_id, in: path, required: true, schema: {type: string, pattern: '^[a-f0-9]{32}$'}}
    post:
      operationId: setMyJobSiteWorkspaceRules
      tags: [sites]
      summary: The person's own rules in one of their workspaces, and its deny patterns (J70)
      description: |
        Allow, ask or deny for reading and searching, and for changing files;
        path patterns that hide what they match from every tool, for everyone
        who uses the workspace. A change that is nowhere looser applies at
        once (J51); any other is held for the person's own key (J68).
      security: [{helperClient: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/JobSiteRulesRequest'}
      responses:
        '202':
          description: The site holds the change until the person approves it with their key. Nothing changed yet.
          content:
            application/json:
              schema: {$ref: 'components/job-sites.yaml#/JobSiteHeld'}
        '200':
          description: The workspace, read live from the site.
          content:
            application/json:
              schema: {$ref: 'components/job-sites.yaml#/JobSiteWorkspaceDetail'}
        '401':
          description: Workbench client or person sign-in is invalid.
        '403':
          description: The person lacks `use-job-sites` (J77).
        '404':
          description: The person owns no such site and is linked to none by that id, or it has no such workspace.
        '422':
          description: The site refused it; `detail` says why in the site's words.
        '503':
          description: The site is offline, or it needs an update to keep each person's workspaces (`SiteSigning.people`).
        '504':
          description: The site did not answer in time.
  /oidc/job-sites/{site}/workspaces/{workspace_id}/people:
    parameters:
      - {name: site, in: path, required: true, schema: {$ref: 'components/sites.yaml#/SiteId'}}
      - {name: workspace_id, in: path, required: true, schema: {type: string, pattern: '^[a-f0-9]{32}$'}}
    post:
      operationId: shareMyJobSiteWorkspace
      tags: [sites]
      summary: Whom the site's owner shares one of their workspaces with, and each one's rules there (J69, J70)
      description: |
        The site's owner only, for their own workspaces only. Replaces the
        list. People are named by how they sign in. Each person's `read` and
        `change` say allow, ask or deny; "ask" is asked of that person in
        Workbench, when they make the call (§2.6). A change that only takes
        access away applies at once (J51); any other waits for the owner's
        key (J14a).
      security: [{helperClient: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/JobSiteWorkspacePeopleRequest'}
      responses:
        '202':
          description: The site holds the change until its owner approves it with their key. Nothing changed yet.
          content:
            application/json:
              schema: {$ref: 'components/job-sites.yaml#/JobSiteHeld'}
        '200':
          description: The workspace, read live from the site.
          content:
            application/json:
              schema: {$ref: 'components/job-sites.yaml#/JobSiteWorkspaceDetail'}
        '401':
          description: Workbench client or person sign-in is invalid.
        '404':
          description: The person owns no such site, or it has no such workspace of theirs, or no such person signs in.
        '422':
          description: The site refused it; `detail` says why in the site's words.
        '503':
          description: The site is offline, or it needs an update to keep each person's workspaces.
        '504':
          description: The site did not answer in time.
  /oidc/job-sites/{site}/window/close:
    parameters:
      - {name: site, in: path, required: true, schema: {$ref: 'components/sites.yaml#/SiteId'}}
    post:
      operationId: closeMyJobSiteWindow
      tags: [sites]
      summary: Close the person's open window on a Job Site now
      description: |
        The window the person opened with their key (J14b, J81), in which
        their `allow` tools run without a signature each. Closing only takes
        access away, so it needs no signature (J90). Any person linked there.
      security: [{helperClient: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/JobSiteRequest'}
      responses:
        '204':
          description: Closed, or none was open.
        '401':
          description: Workbench client or person sign-in is invalid.
        '404':
          description: The person owns no such site and is linked to none by that id.
        '422':
          description: The site refused it; `detail` says why in the site's words.
        '503':
          description: The site is offline, or it needs an update to check signed calls.
        '504':
          description: The site did not answer in time.
  /oidc/job-sites/{site}/commands/withdraw:
    parameters:
      - {name: site, in: path, required: true, schema: {$ref: 'components/sites.yaml#/SiteId'}}
    post:
      operationId: withdrawMyJobSiteCommands
      tags: [sites]
      summary: The site's owner takes back the consent to commands on their machine
      description: |
        An administrator consented at the machine (J9, J89); the site's owner
        may take it back from here (J30). It only takes access away, so it
        needs no signature. Giving it again is done at the machine: the
        Windows tray, or the one-liner again.
      security: [{helperClient: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/JobSiteRequest'}
      responses:
        '204':
          description: Withdrawn.
        '401':
          description: Workbench client or person sign-in is invalid.
        '404':
          description: The person owns no such site.
        '422':
          description: The site refused it; `detail` says why in the site's words.
        '503':
          description: The site is offline, or it needs an update to run commands.
        '504':
          description: The site did not answer in time.
  /oidc/job-sites/{site}/leave:
    parameters:
      - {name: site, in: path, required: true, schema: {$ref: 'components/sites.yaml#/SiteId'}}
    post:
      operationId: leaveMyJobSite
      tags: [sites]
      summary: Take the person's own machine out of the install
      description: |
        Leaving needs no one's permission (remote-nodes.md §3.3). The site is
        revoked at once, as when Eugene's owner removes it, and its site host
        stops at its next poll.
      security: [{helperClient: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/JobSiteRequest'}
      responses:
        '204':
          description: Removed.
        '401':
          description: Authentication, current permission, state, or availability refused the request.
        '403':
          description: Authentication, current permission, state, or availability refused the request.
        '404':
          description: Authentication, current permission, state, or availability refused the request.
        '409':
          description: Authentication, current permission, state, or availability refused the request.
        '503':
          description: Authentication, current permission, state, or availability refused the request.
components:

  securitySchemes:
    siteToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        A Job Site's own token: EdDSA, signed by the key the site sent at
        enrollment, `iss: site:<id>`, `sub: site`, `aud: control`, at most
        five minutes long. Checked against the site registry, never the
        trust bundle, and accepted only by the four `/v1/sites` routes a site
        calls.
    helperClient:
      type: http
      scheme: basic
      description: Workbench client_secret_basic, plus that client's person refresh token in the body.
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: |
        An operator session from `POST /v1/auth/login` or
        `POST /v1/auth/token`, or a service token addressed to `control`
        and signed by a key in the trust bundle (`common.yaml`,
        `TrustBundle`). Mutations take a session; the reads that say
        so also take an `agent` or `gateway` service token. The two
        replication reads (`readLog`, `readSnapshot`) take a session or the
        standby's `sub: standby` token, and no other service token.

  parameters:
    SubjectToken:
      name: X-Eugene-Plexus-Subject-Token
      in: header
      required: false
      schema: {type: string}
      description: |
        **A member node acting for an operator who is acting on it**
        (2026-10-01). The console reaches another machine with a
        five-minute token addressed to that machine alone (`POST
        /v1/auth/token`), and installing an app there needs its key and
        its sign-in registration from this root -- which that token, not
        being addressed here, cannot ask for. So the machine sends its
        own `agent` service token as the bearer (the actor) and the
        operator's token, addressed to that same machine, here (the
        subject; RFC 8693's roles).

        Taken only by the operations that reference it, and only for
        things named for the acting node: a client key named
        `app:<id>@<node>`, a sign-in registration whose `owner` is. Any
        other name is a 403. A subject addressed to another machine, an
        actor that is not an agent speaking for itself, or a signed-out
        session is a 401. A node's own token without a subject opens
        none of these.

  schemas:
    SitePersonCheckRequest:
      $ref: "components/sites.yaml#/SitePersonCheckRequest"
    SitePersonCheck:
      $ref: "components/sites.yaml#/SitePersonCheck"
    SitePersonLink:
