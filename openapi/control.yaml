    # -------- nodes --------

    NodeList:
      type: object
      required:
        - nodes
      properties:
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/Node'

    Node:
      type: object
      description: |
        One host in this install.

        Identified by an operator-supplied `name`, consistent with
        components and runtimes — but its *identity* is `publicKey`. A
        name is a label an operator can read; the keypair is what makes
        a node the same node after a restart, and what a secret is sealed
        to.
      required:
        - name
        - role
        - reachable
      properties:
        name:
          type: string
          minLength: 1
          description: |
            Operator-supplied, unique per install. Used in
            `Runtime.node`, `RuntimePlacementSpec.node`, and anywhere a
            placement has to be named.
        label:
          type:
            - string
            - "null"
          minLength: 1
          maxLength: 64
          description: |
            The name people see for this machine, set by an operator
            (`PUT /v1/nodes/{name}/label`) or at enrollment. `null` shows
            `name`. Display only: everything that addresses the node uses
            `name`. Unique across the install's names and labels, ignoring
            case, when it was written.
        url:
          type: string
          format: uri
          description: |
            Where this node's agent is reachable — from this root, and from
            a gateway sending a lifecycle action to the agent that owns a
            runtime. Recorded verbatim from `EnrollmentRequest.url`; the
            agent is the one that knows how it reached this root, and this
            root does not guess from a source address.
        machineUrl:
          type:
            - string
            - "null"
          format: uri
          description: |
            This node's machine port (LT1): the one TLS door other
            machines reach it through, `https://<host>:8083`. From its
            signed announcement or its enrolment. `null` on a node that
            runs a version without one.
        tlsPins:
          type: array
          maxItems: 2
          items:
            $ref: '#/components/schemas/TlsPin'
          description: |
            The keys this node's machine port may present, registered
            under its signature. Every other machine refuses a connection
            that presents any other. Empty on a node without a machine
            port. Two while its machine key changes (`tlsNextPin`, row 3):
            the current key and the next, and both again after the switch
            until the node announces the new key alone.
        tlsNextPin:
          oneOf:
            - $ref: '#/components/schemas/TlsPin'
            - type: 'null'
          description: |
            The one of `tlsPins` the node announced as its next key
            (`NodeAddressAnnouncement.tlsNextPin`). `null` outside a
            machine key change.
        machineKeyChange:
          oneOf:
            - $ref: '#/components/schemas/NodeMachineKeyChange'
            - type: 'null'
          description: |
            While the node announces a next key: which machines this root
            sees holding a list that names it. An observation, never
            replicated. `null` outside a change.
        machineTls:
          $ref: '#/components/schemas/MachineLink'
        certificateNames:
          type: array
          items:
            type: string
          description: |
            Names the owner listed for this node (LT2,
            `tls-for-clients.md` §4): its client certificate may hold them
            beside its own address and `.local` name. Private addresses and
            local names only. Empty when none are listed.
        role:
          $ref: '#/components/schemas/NodeRole'
        reachable:
          type: boolean
          description: |
            Whether the control root could reach this node's agent on its
            last attempt. False means `down`, not `out` — see this
            document's description. Nothing is reassigned on the strength
            of this field alone.
        publicKey:
          type: string
          description: |
            The node's identity public key, generated at enrollment. The
            private half never leaves the node, which is what makes
            per-node sealing meaningful: a secret sealed to this key can
            be read by this host and by the recovery recipient, and by
            nothing else.
        signingPublicKey:
          type: string
          description: |
            The node's **Ed25519** public key, used for one thing: to
            verify that a `PATCH /v1/nodes/{name}` really came from this
            node. `publicKey` cannot do it — that one is X25519 and
            exists so secrets can be sealed to the node — and a key that
            both seals and signs is a key whose compromise costs twice.

            Absent on a node enrolled before nodes had a signing
            identity. Such a node cannot re-advertise and must re-enroll;
            surfaced here rather than inferred from a 401.
        tokenPublicKey:
          type: string
          description: |
            Base64 of this node's raw Ed25519 **token** public key, the
            key its tokens are signed with. It is listed in the trust
            bundle as `node:<name>`. The private half was generated on
            the node and has never been anywhere else. A third key,
            separate from `publicKey` and `signingPublicKey`, because
            each key does one job.
        grants:
          type: array
          items:
            $ref: 'components/common.yaml#/components/schemas/TrustGrant'
          description: |
            What this node's key may issue, as the trust bundle lists it:
            `node`, plus `gateway` when the join token that enrolled it
            said so. Given by the join token, never claimed by the node.
            A Job Site is not a node: it has its own registry and key
            (`/v1/sites`, J19). A node enrolled with `files` before that
            (slices 1 and 2) still replays, as a **retired** node: it is
            in no listing and no trust bundle, and nothing it signs is
            accepted.
        owner:
          type:
            - string
            - "null"
          deprecated: true
          description: |
            Written only for a node enrolled with `files` before slice
            2b.1, and kept so its log and snapshots still replay. `null`
            for every other node.
        trustBundleVersion:
          type:
            - integer
            - "null"
          format: int64
          description: |
            The trust bundle version this node reported holding on the
            last probe. A value below the current one is a node that has
            not yet taken a revocation or a rotation. Observation, not
            applied state, so never replicated; `null` until probed.
        advertiseSequence:
          type: integer
          format: int64
          minimum: 0
          description: |
            The highest announcement sequence accepted from this node. A
            `PATCH /v1/nodes/{name}` at or below it is a replay and is
            refused. Applied state, so a promoted standby refuses the
            same replays this root would.
        lastSeenEpoch:
          type: integer
          format: int64
          minimum: 0
          description: |
            The highest control-root epoch this node has acknowledged. A
            value below `ControlStatus.epoch` is the visible symptom of a
            node that was partitioned during a promotion — bounded,
            self-healing, and deliberately surfaced rather than hidden.
        agentVersion:
          type: string
        os:
          type: string
          enum: [windows, linux, macos]
        arch:
          type: string
          enum: [x64, arm64]
        devices:
          type: array
          items:
            $ref: 'components/common.yaml#/components/schemas/ComputeDevice'
          description: |
            What this host can compute on. **This is the cross-host
            hardware inventory M3 deferred**, and it lands here exactly
            as M3 predicted: *"building a real inventory is topology work
            and belongs to the agent if it belongs anywhere."*

            The library's fit surface already takes a hardware override
            and reports which host it measured, so multi-host quant
            guidance works as soon as these exist. Reported, not acted
            on — deciding *which* node should host a model is lifecycle
            policy, which is M6.
        enrolledAt:
          type: string
          format: date-time
        lastSeenAt:
          type: string
          format: date-time
        lastError:
          type:
            - string
            - "null"
          description: |
            Why the last probe of this node did not come back with an
            identity, in the probe client's words -- an HTTP status and
            the body's title, or a transport error. `null` when the node
            answered, and when nothing has polled yet.

            Added 2026-09-15 because `reachable: false` on its own sent an
            operator looking at enrollment, keys and firewalls when the
            cause was a worker refusing this root's tokens as "not yet
            valid (iat)" over half a second of clock skew. The probe
            client had the reason the whole time; this surface dropped
            it. Observation, not applied state: a standby has not seen
            what this root saw, so it is never replicated.

    MachineUrl:
      type: string
      format: uri
      description: |
        Where other machines reach this node's machine port (LT1,
        `docs/design/tls-between-machines.md`): `https://<host>:<port>`,
        8083 unless the node's published ports are remapped. Paths under
        it reach this node's own listeners: `/agent`, `/control` (on the
        root) and `/drivers/<name>`.

    TlsPin:
      type: string
      pattern: '^[A-Za-z0-9_-]{43}$'
      description: |
        Base64url (no padding) of the SHA-256 of a machine key's
        SubjectPublicKeyInfo, the form Job Sites pin too.

    NodeMachineKeyChange:
      type: object
      description: |
        A machine key change seen from this root (row 3): the node
        announced a next key, and it switches once every machine that can
        reach it holds a machine list naming both keys. An observation of
        this root's last poll: a standby has seen none of it.
      required: [nextPin, waitingOn, unreachable]
      properties:
        nextPin:
          $ref: '#/components/schemas/TlsPin'
        listVersion:
          type:
            - integer
            - "null"
          format: int64
          description: |
            The first machine list `version` that names both keys (and,
            for the machine that runs this root, both in `controlPins`).
            `null` until this root has signed one.
        waitingOn:
          type: array
          items:
            type: string
          description: |
            Machines this root reached that hold an older list, or that
            report no list version (a version before row 3), or that it
            has not polled yet. The node waits for none of them after 3
            minutes.
        unreachable:
          type: array
          items:
            type: string
          description: |
            Machines this root could not reach on its last poll. The node
            does not wait for them: each fetches the list when it is back.
        notReady:
          type: array
          items:
            type: string
          description: |
            Machines with a machine key that this root has never seen
            report a machine list version: they run an agent older than
            row 3, which cannot take the root's new key by itself if it
            misses the change. A change of the key of the machine that
            runs this root does not switch while any is listed (update
            them, or remove a machine that is gone). Another machine's
            change is not held up by them.

    MachineLink:
      type: object
      description: |
        How this root last reached the node, as an observation: never
        replicated, and absent until it has polled.
      required: [state]
      properties:
        state:
          type: string
          enum: [encrypted, no_key, unreachable, refused, unknown]
          description: |
            * `encrypted`: the last poll went over TLS to the key the node
              registered.
            * `no_key`: the node runs a version without a machine port, so
              traffic to it is plain (refused once encryption is required).
            * `unreachable`: it has a key on record and its machine port did
              not answer.
            * `refused`: its machine port presented a key it did not
              register. A security event; nothing was sent.
            * `unknown`: not polled yet.
        detail:
          type:
            - string
            - "null"
          description: The reason in the probe client's words, for the last three.

    SignedMachineList:
      type: object
      required: [jws]
      properties:
        jws:
          type: string
          description: |
            A JWS compact serialization with header
            `{"alg": "EdDSA", "typ": "ep-machines+jwt"}` whose payload is a
            `MachineList`, signed with this root's identity key: the key
            every node pinned at enrolment.

    MachineList:
      type: object
      description: |
        Every machine's TLS door and the keys it may present (LT1). A node
        that holds it reaches another node's agent, and this root, only
        over TLS to a key listed here.
      required: [iat, version, required, nodes, controlPins]
      properties:
        iat:
          type: integer
          format: int64
          description: When it was signed.
        version:
          type: integer
          format: int64
          minimum: 1
          description: |
            Rises by one each time the list changes. A node refuses a list
            whose version is lower than the one it holds, so an old list
            cannot bring back a key that was dropped.
        required:
          type: boolean
          description: |
            Encryption between machines is required (`machineEncryption`):
            no plain HTTP between machines, and drivers and control bind
            to loopback.
        clientPlainHttp:
          type: string
          enum: ['on', 'off']
          description: |
            Whether a node's client doors (8079, 8080, app ports) still take
            plain HTTP from another machine (LT2-C4, the `clientPlainHttp`
            config field). `off` only by the owner's choice; a node then
            refuses a plain request from another machine with the
            `https://` URL named, and loopback stays plain. Absent from an
            older root's list, which means `on`.
        controlPins:
          type: array
          items:
            $ref: '#/components/schemas/TlsPin'
          description: |
            The keys the machine port in front of this control root may
            present, given to it by its own machine's agent. A node reaches
            the root at the address it joined with, over TLS to one of
            these.
        keyChange:
          type: boolean
          description: |
            This root takes `NodeAddressAnnouncement.tlsNextPin` (row 3):
            a node may change its machine key. Absent from an older
            root's list, and a node then offers no change.
        control:
          $ref: '#/components/schemas/MachineListControl'
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/MachineListNode'

    MachineListControl:
      type: object
      description: |
        Where the install's active control root is, and at which epoch
        (row 4, `docs/design/rows/row-04.md`). Absent from a root older
        than row 4.

        **A node moves only with a promotion** (R4-MOVE). It writes
        `url` as its `controlUrl` only when all of these hold: the list
        verifies against the root identity it pinned at enrolment; its
        `version` is above the one it holds; `epoch` is above the epoch
        its current `controlUrl` came with (`NodeIdentity.controlUrlEpoch`);
        and `epoch` is at least the epoch it holds. The same epoch never
        moves a node: a node may reach its root at an address the root
        does not know, such as a tailnet address.

        A list whose `epoch` is below the epoch a node holds comes from a
        superseded root, and the node refuses all of it
        (`POST /v1/node/machine-list` answers 409).
      required: [epoch]
      properties:
        epoch:
          type: integer
          format: int64
          minimum: 1
          description: The epoch of the root that signed this list.
        node:
          type:
            - string
            - "null"
          description: |
            The node this root runs on, when it knows its own name. After a
            promotion, the promoted machine.
        url:
          type:
            - string
            - "null"
          description: |
            Where nodes reach this root: the plain form
            `http://<host>:<machine port>` of its machine's port, which a
            node's machine table carries to TLS under `/control`, or the
            root's nodes name when it has no machine port. Taken from the
            machine port its agent describes in the door file, else from
            this root's own node record, else from the nodes name. Null
            when this root knows none of them; a node then does not move.

    MachineListNode:
      type: object
      required: [name, pins]
      properties:
        name:
          type: string
        url:
          type:
            - string
            - "null"
          description: The agent address other machines know it by (`Node.url`).
        machineUrl:
          type:
            - string
            - "null"
        pins:
          type: array
          items:
            $ref: '#/components/schemas/TlsPin'

    NodeCertificateNames:
      type: object
      required: [names]
      additionalProperties: false
      properties:
        names:
          type: array
          maxItems: 16
          items:
            type: string
            maxLength: 253

    NodeCertificateRequest:
      type: object
      required: [csr]
      additionalProperties: false
      properties:
        csr:
          type: string
          description: |
            A PKCS#10 certificate signing request in PEM, signed with the
            node's machine key, its names in a subjectAltName extension.

    NodeCertificate:
      type: object
      required: [certificate, ca, names, notAfter]
      properties:
        certificate:
          type: string
          description: The leaf, PEM.
        ca:
          type: string
          description: The install CA that signed it, PEM.
        names:
          type: array
          items:
            type: string
          description: The names it holds, IP addresses and DNS names.
        notAfter:
          type: string
          format: date-time

    NodeRole:
      type: string
      enum:
        - control
        - standby
        - agent
      description: |
        * `control` — the active control root. Exactly one.
        * `standby` — replicating, promotable, serving no writes.
        * `agent` — supervision only, no control-plane state.

        A node's role is *configuration*, not an election outcome.
        Nothing here votes.

    NodeLabel:
      type: string
      minLength: 1
      maxLength: 64
      description: |
        What people call a machine, shown wherever its name would be. Any
        letters, spaces and punctuation; no control characters. Trimmed
        before it is checked. Not an identifier: nothing addresses a node by
        it.

    NodeLabelRequest:
      type: object
      additionalProperties: false
      required:
        - label
      properties:
        label:
          $ref: '#/components/schemas/NodeLabel'

    JoinTokenRequest:
      type: object
      properties:
        nodeName:
          type: string
          description: |
            Bind this token to one intended node name. Optional; when
            set, an enrollment presenting a different name is refused,
            which turns a leaked token into a token that can only do the
            thing it was minted for.
        ttlSeconds:
          type: integer
          minimum: 30
          maximum: 86400
          default: 900
          description: |
            Short by default. A join token is the one credential that
            grants membership, and the window in which it is useful is
            the window in which it is dangerous.
        grants:
          type: array
          items:
            type: string
            enum: [gateway]
          description: |
            Extra grants the node enrolled with this token receives in the
            trust bundle. `gateway` lets it mint `sub: gateway` tokens to
            other machines, which the install's gateway needs in order to
            reach every node's drivers and agent. The wizard asks for it
            on the machine that runs the gateway; `/nodes` does not.

    JoinToken:
      type: object
      required:
        - id
        - token
        - expiresAt
      properties:
        id:
          type: string
          description: |
            A handle for this token that is **not** the token and not
            derived from it — a separate random value, so listing and
            revoking never move the credential or its verifier.

            It exists because minting was the only thing an operator
            could do to a join token. A token pasted into the wrong
            window could not be withdrawn; it simply stayed live for the
            rest of its TTL, and the only remedy was to wait.
        token:
          type: string
          description: |
            **Shown once.** Not retrievable afterwards and not stored in
            recoverable form — a lost token is re-minted, never looked
            up.

            **It carries the root's machine key (LT1)** when this root has
            one: `<secret>.<pin>`, the pin a `TlsPin`. A joining machine
            enrols over TLS to the root's machine port and checks that key
            before it sends the token, so nobody on the network can answer
            in the root's place. The root takes the token with or without
            the suffix.
        expiresAt:
          type: string
          format: date-time
        nodeName:
          type: string
          description: The node name this token is bound to, when it is bound.
        grants:
          type: array
          items:
            type: string
            enum: [gateway]

    JoinTokenRecord:
      type: object
      description: |
        One outstanding join token, **without the token**.

        The store keeps a hash and never the secret, so this is
        everything that can honestly be said about a minted token after
        the one moment it was shown: what it was for, when it dies, and
        whether it has been spent.
      required:
        - id
        - expiresAt
        - used
      properties:
        id:
          type: string
          description: The handle to revoke it by.
        expiresAt:
          type: string
          format: date-time
        nodeName:
          type: string
          description: The node name this token is bound to, when it is bound.
        grants:
          type: array
          items:
            type: string
            enum: [gateway]
          description: What the node it enrolls will be granted, as minted.
        kind:
          $ref: '#/components/schemas/JoinTokenKind'
        owner:
          type: string
          description: The person a site invitation names. Absent on a node's token.
        used:
          type: boolean
          description: |
            True once this token has enrolled a node. A spent token is
            kept until it expires so a replay answers 409 "already
            spent" rather than 401 "unknown" — so a listing shows it,
            and revoking it is allowed and pointless rather than
            refused.

    JoinTokenKind:
      type: string
      enum: [node, site]
      description: What a join token enrolls. A site invitation (`POST /v1/sites/invitations`) is listed and withdrawn with the node tokens.

    JoinTokenList:
      type: object
      required:
        - tokens
      properties:
        tokens:
          type: array
          items:
            $ref: '#/components/schemas/JoinTokenRecord'

    EnrollmentRequest:
      type: object
      required:
        - token
        - name
        - publicKey
        - signingPublicKey
        - tokenPublicKey
      properties:
        token:
          type: string
          description: The join token, which is this request's only credential.
        name:
          type: string
          minLength: 1
        label:
          $ref: '#/components/schemas/NodeLabel'
          description: |
            The name people see for this machine, recorded as `Node.label`
            under the rules `PUT /v1/nodes/{name}/label` applies. Checked
            before the join token is spent. Omitted, or equal to `name`, is
            no label. A machine that enrolls again under the same name keeps
            the label it had unless this sets one.
        publicKey:
          type: string
          description: |
            The agent's identity public key. The private half stays on
            the node; sending it would defeat the point of per-node
            sealing.
        signingPublicKey:
          type: string
          description: |
            The agent's Ed25519 identity public key, recorded as
            `Node.signingPublicKey` and used to verify later address
            announcements.
        tokenPublicKey:
          type: string
          description: |
            Base64 of the agent's raw Ed25519 token public key, recorded
            as `Node.tokenPublicKey` and listed in the trust bundle. The
            agent generated the pair; the private half stays on it.
        url:
          type: string
          format: uri
          description: |
            Where other hosts reach this agent — its `advertiseUrl`,
            configured or derived (`agent.yaml`, `GET /v1/node`). Becomes
            `Node.url`. The agent sends it because the agent knows which
            interface it used to reach this root; a root deriving it from
            the request's source address would be right on a flat mesh
            network and wrong behind anything else.
        machineUrl:
          $ref: '#/components/schemas/MachineUrl'
        tlsPin:
          $ref: '#/components/schemas/TlsPin'
        agentVersion:
          type: string
        os:
          type: string
          enum: [windows, linux, macos]
        arch:
          type: string
          enum: [x64, arm64]
        devices:
          type: array
          items:
            $ref: 'components/common.yaml#/components/schemas/ComputeDevice'

    NodeAddressAnnouncement:
      type: object
      description: |
        A node telling this root where it now is. Signed by the node, not
        bearer-authenticated — see `PATCH /v1/nodes/{name}`.
      required:
        - url
        - sequence
        - signature
      properties:
        url:
          type: string
          format: uri
          description: |
            Where other hosts now reach this node's agent. Becomes
            `Node.url`, normalized once on the way into the log exactly
            as enrollment's is.
        sequence:
          type: integer
          format: int64
          minimum: 1
          description: |
            Strictly increasing per node, persisted on the node. This
            root refuses anything at or below `Node.advertiseSequence`,
            which is what stops a captured announcement being replayed to
            pin a node to an address it has left.
        signature:
          type: string
          description: |
            Detached Ed25519 signature, base64, by the node's identity
            signing key over the **canonical message**: the UTF-8 bytes
            of the JSON object `{"name": "<name>", "sequence":
            <sequence>, "url": "<url>"}` with keys sorted and no
            whitespace — `json.dumps(obj, sort_keys=True,
            separators=(",", ":"))`. `name` is the path parameter and
            `url` is the value in this body, verbatim and unnormalized.

            Three fields, one serializer, stated here so both sides
            implement it from one sentence. Including `name` is what
            stops one node's announcement being replayed against
            another's record.

            **With `machineUrl` or `tlsPin` in the body (LT1), the object
            signed holds them too**, under the same names, so the key a
            node registers is covered by the same signature as its
            address: `{"machineUrl": …, "name": …, "sequence": …,
            "tlsPin": …, "url": …}`, keys sorted, holding exactly the
            ones the body holds. An announcement without either signs
            the three fields above, so an older node's announcement
            verifies as before. `tlsNextPin` (row 3) joins the signed
            object under its own name in the same way.

            **Verified against the raw request body, never against a
            parsed `url`.** An OpenAPI `format: uri` becomes a URL type
            in most generators, and those normalize — Pydantic's
            `AnyUrl` appends a trailing slash to an authority-only URL —
            so a verifier that parses first compares different bytes
            from the ones the node signed, and *every* announcement
            fails with what looks like a crypto error. Found by it
            happening. A signature is over bytes on the wire; `format:
            uri` stays here because the validation and the generated
            clients are still worth having.
        machineUrl:
          $ref: '#/components/schemas/MachineUrl'
        tlsPin:
          $ref: '#/components/schemas/TlsPin'
        tlsNextPin:
          $ref: '#/components/schemas/TlsPin'
          description: |
            The node's next machine key, while it changes keys (row 3).
            Only with `tlsPin`, and not equal to it. The root records both
            in `Node.tlsPins` and lists both, so every machine accepts
            either key across the switch; the node then announces
            `tlsPin` alone, and the old key leaves the list. A replay of
            an announcement that carried the old key is refused by
            `sequence`.

    NodeAddressAck:
      type: object
      required:
        - name
        - url
        - sequence
        - changed
      properties:
        name:
          type: string
        url:
          type: string
          format: uri
          description: The address now recorded, after normalization.
        sequence:
          type: integer
          format: int64
          description: The sequence now recorded.
        changed:
          type: boolean
          description: |
            False when the announcement matched what was already
            recorded, which is the common case on a restart. Nothing was
            appended to the log.

    Enrollment:
      type: object
      description: |
        What a newly enrolled node needs in order to participate, and
        nothing more.
      required:
        - name
        - epoch
        - controlPublicKey
        - trustBundle
      properties:
        name:
          type: string
        epoch:
          type: integer
          format: int64
          description: |
            The control root's current epoch. The node records it and
            from then on refuses any root presenting a lower one.
        trustBundle:
          $ref: 'components/common.yaml#/components/schemas/SignedTrustBundle'
        controlPublicKey:
          type: string
          description: |
            Base64 of the control root's raw Ed25519 identity public key.
            The node pins it and from then on accepts a trust bundle only
            if this key signed it. **No private key is in this
            response**: until 2026-09-25 it carried the install's signing
            key in plaintext, which made every node the install.
        recoveryPublicKey:
          type: string
          description: |
            The second recipient every secret on this node is sealed to.
            Held by the control root under the passphrase-derived key, so
            a dead node's credentials are recoverable by the operator and
            by nobody else.
        grants:
          type: array
          items:
            $ref: 'components/common.yaml#/components/schemas/TrustGrant'
          description: |
            What this node's key was granted: `node`, plus `gateway` when
            the join token said so.

    # -------- control state --------

    ControlStatus:
      type: object
      required:
        - role
        - epoch
        - appliedIndex
      properties:
        role:
          $ref: '#/components/schemas/NodeRole'
        epoch:
          type: integer
          format: int64
          minimum: 1
          description: |
            Monotonic generation of the control root. Incremented by
            promotion, and the whole of the fencing mechanism: agents
            refuse a lower epoch, so a superseded root cannot command
            anything that has already heard from its successor.
        appliedIndex:
          type: integer
          format: int64
          minimum: 0
          description: The highest log index this process has applied.
        firstAvailableIndex:
          type: integer
          format: int64
          description: |
            Oldest index still in the log after compaction. A standby
            whose position predates this cannot catch up by reading the
            log and must take a snapshot instead.
        standbys:
          type: array
          items:
            $ref: '#/components/schemas/StandbyStatus'
          description: |
            Present on the active root. **This is the "is failover safe
            right now" answer** — a standby trailing the active root
            cannot be promoted without losing the difference, and an
            operator should see that before a failure rather than during
            one.

            Since 2026-10-08, the node that holds the `standby` grant, from
            applied state; the `standbyUrls` setting is no longer read.
        activeUrl:
          type: string
          format: uri
          description: Where the active root is, as reported by a standby.
        initialized:
          type: boolean

    StandbyStatus:
      type: object
      description: |
        What the active root knows of its standby, from the standby's own
        pulls (`docs/design/warm-standby.md`, SB4), never from probing it.
        A root that has restarted knows nothing until the next pull, and
        says so with no `lastContactAt`.
      required:
        - node
      properties:
        node:
          type: string
          description: The node that holds the `standby` grant.
        url:
          type: string
          format: uri
          description: That node's address, as `Node.url` records it. Absent when none is recorded.
        appliedIndex:
          type: integer
          format: int64
          description: |
            The index the standby had applied at its last pull: the `after`
            of its last log read, or the index of its last snapshot.
        lagEntries:
          type: integer
          format: int64
          minimum: 0
          description: |
            How many entries behind this standby is. Reported as a count
            of entries rather than a duration, because entries are what
            would be lost and seconds are not.
        lastContactAt:
          type: string
          format: date-time
          description: When the standby last pulled. Absent until it has, since this root started.
        reachable:
          type: boolean
          description: |
            The standby pulled within the last three follow intervals.
            False when it has not pulled since this root started, which
            `lastContactAt` being absent tells apart from a standby that
            stopped.
        version:
          type: string
          description: |
            The version of control the standby runs, from the
            `Eugene-Plexus-Version` header of its last pull (row 4). Absent
            from a standby older than row 4. A standby older than the root
            should be updated: it may drop what a newer root writes.
        matches:
          type: boolean
          description: |
            Whether the standby's copy is the root's, byte for byte (row
            4). Read at a pull made at this root's own applied index, from
            the `Eugene-Plexus-Copy-Digest` header: true when that digest
            is this root's `LogPage.appliedDigest`, false when it differs.
            A standby whose copy differs takes a fresh snapshot by itself
            (at most once in 10 minutes), so false that stays means the
            fresh copy differs too. Absent until a standby on this root's
            version has pulled at this root's index: two versions may write
            the same state in different bytes.
        logVersion:
          type: integer
          minimum: 0
          description: |
            The log version the standby applies, from the
            `Eugene-Plexus-Log-Version` header of its last pull (row 5);
            0 when its pull carried none (a standby older than row 5).
            Absent until it has pulled since this root started. Log
            version 1 adds `retireOidcKeys` and `changePassphrase`: this
            root refuses to write either while its standby reports less,
            because the standby's copy would stop there.

    LogPage:
      type: object
      required:
        - entries
        - appliedIndex
      properties:
        entries:
          type: array
          items:
            $ref: '#/components/schemas/LogEntry'
          description: Oldest first, gapless, strictly increasing `index`.
        appliedIndex:
          type: integer
          format: int64
          description: The active root's own applied index, so a caller can compute its lag.
        firstAvailableIndex:
          type: integer
          format: int64
          description: |
            Reported on every page so a standby learns it has fallen
            behind compaction *before* it tries to read a gap.
        appliedDigest:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: |
            SHA-256, in hex, of the active root's canonical applied state
            at `appliedIndex`: the bytes `GET /v1/control/snapshot` would
            send at that index (row 4). Kept per index, so a caught-up
            standby's pulls cost no hashing. A standby on the same version
            (the `Eugene-Plexus-Version` response header) whose copy at the
            same index has another digest differs from the root, for
            example a copy that applied entries with code too old to know
            all their fields. It takes a fresh snapshot.

    AccessAuditEvent:
      type: object
      additionalProperties: false
      required: [index, at, actor, action, target]
      properties:
        index: {type: integer, minimum: 1}
        at: {type: string}
        actor: {type: string, minLength: 1, maxLength: 256}
        action: {type: string, minLength: 1, maxLength: 128}
        target: {type: string, minLength: 1, maxLength: 256}
    AccessAudit:
      type: object
      required: [events]
      properties:
        events:
          type: array
          maxItems: 1000
          items: {$ref: '#/components/schemas/AccessAuditEvent'}
    LogEntry:
      type: object
      description: |
        One control-state change. Applied state is a deterministic
        function of the entries applied so far, which is the property
        that makes a standby's state comparable to the active root's —
        and the property a later move to consensus would depend on.
      required:
        - index
        - epoch
        - op
      properties:
        index:
          type: integer
          format: int64
          minimum: 1
          description: |
            Gapless and monotonic, assigned by the active root alone.
            **The only ordering there is.**
        epoch:
          type: integer
          format: int64
          description: |
            The control-root generation that appended this entry. A
            standby rejects entries from an epoch below the highest it
            has seen, which fences a superseded root out of the log as
            well as out of the agents.
        op:
          $ref: '#/components/schemas/LogOp'
        actor:
          type: string
          maxLength: 256
          description: Verified actor of an access change. Absent on legacy records; never inferred as owner.
        payload:
          type: object
          additionalProperties: true
          description: Operation-specific. Shape follows `op`.
        at:
          type: string
          format: date-time
          description: |
            **Informational only, never used for ordering.** Recorded so
            an operator can read the log; deliberately not load-bearing,
            which is what keeps clock skew between buildings out of the
            correctness argument.

    LogOp:
      type: string
      enum:
        - enrollNode
        - updateNode
        - revokeNode
        - putComponent
        - deleteComponent
        - putRuntime
        - deleteRuntime
        - patchConfig
        - putClientKey
        - revokeClientKey
        - setClientKeyLimits
        - rotateClientKey
        - touchClientKey
        - putClientAdmission
        - rotateSigningKey
        - revokeSession
        - promote
        - putPerson
        - putPermissionGroup
        - deletePermissionGroup
        - putNodeHelper
        - setPersonPassword
        - deletePerson
        - putOidcClient
        - deleteOidcClient
        - putOidcKey
        - revokeSignIn
        - setOidcClientRedirects
        - enrollSite
        - removeSite
        - setSiteHost
        - setSiteDevGrants
        - setStandby
        - putExternalProvider
        - deleteExternalProvider
        - putSignInInvitation
        - deleteSignInInvitation
        - linkExternalIdentity
        - deleteExternalIdentity
        - putBrowserSignIn
        - deleteBrowserSignIn
        - labelNode
        - setInstallCa
        - setNodeCertificateNames
        - retireOidcKeys
        - changePassphrase
      description: |
        **`retireOidcKeys` (row 5, log version 1)** keeps only the sign-in
        keys named in `keep` (`{keep: [kid]}`, at least one held key) and
        drops the others, so every token they signed stops verifying. It
        follows a `putOidcKey` when the owner ends every app sign-in after
        a suspected leak.

        **`changePassphrase` (row 5, log version 1)** changes Eugene's
        passphrase: `{salt, passphraseVerifier, sealed}`, where `sealed`
        holds every value the old master key sealed, sealed again under
        the new one by the writer (`signingKey`, `controlKey`,
        `recoveryKey`, `installCaKey`, `oidcKeys` by `kid`, and
        `externalProviders` by id). It must name exactly the sealed values
        the state holds, no more and no fewer, or it does not apply. Every
        root that applies it writes a snapshot and drops every entry
        before it, so no value sealed under the old key stays in the log;
        a root that could not, does at its next start. The writer appends
        every entry that carries a sealed value (`putOidcKey`,
        `rotateSigningKey`, `setInstallCa`, `putExternalProvider`,
        `changePassphrase`) only while the salt is the one it sealed under.

        **`setNodeCertificateNames` (LT2, 2026-10-20)** replaces the names
        the owner listed for one node's client certificate (`{name,
        names}`). An operator's, unsigned, like `labelNode`.

        **`setInstallCa` (LT2, 2026-10-20)** records the install CA once:
        `{certificate, sealedKey}`, the certificate in PEM and the key's
        PKCS8 DER sealed under the passphrase-derived key, as the other
        sealed keys are. A second one is refused at apply: the CA is made
        once, so every device's trust holds through a promotion.

        **`labelNode` (2026-10-19)** sets or clears one node's `label`, the
        name people see (`{name, label}`, `label` a string or `null`). It is
        its own op because `updateNode` is the node-signed address change and
        a label is an operator's, unsigned: widening that op would put an
        unsigned field under a signature that does not name it.

        **`setStandby` (2026-10-08)** gives one node the `standby` grant
        (`on: true`) or takes it away (`on: false`); `promote` takes it from
        the node it promotes (`docs/design/warm-standby.md`). At most one
        node holds it.

        **The four Job Site operations (slice 2b.1, 2026-10-06)** are
        `enrollSite`, `removeSite`, `setSiteHost` (a node's display-only
        claim to host a site, J32) and `setSiteDevGrants` (Eugene's owner's
        own dev-mode grants on a site, J13b). A Job Site is its own
        enrollment, never a node (J19). **`putNodeHelper` is read and
        ignored**, because the operator-managed node folders retired (J20).
        An `enrollNode` that granted `files` still applies, so a later
        `revokeNode` of it replays, but the node it records is retired
        (`Node.grants`).

        **The seven sign-in operations (C2, 2026-10-01)** replicate people,
        the apps that sign in, the provider's sealed RSA key and revoked
        sign-ins, so a promoted standby signs people in as the old root
        did and keeps refusing what it refused. **`setOidcClientRedirects`**
        (2026-10-05) replaces one client's redirect URIs and nothing else,
        where `putOidcClient` only ever adds a client.

        The complete set of control-state mutations. Closed on purpose:
        **every change goes through one writer and one ordered path**, and
        an operation that is not in this list is an operation that would
        not replicate. Adding a mutation means adding an op here.

        **`updateNode` is the tenth, added at M9**, and it is worth
        saying why the set opened. M5 closed it at nine and the rule that
        closed it was about what does *not* belong: minting a join token
        and initializing the install are not replicated state, so they
        got no op. An address change is the opposite case — it mutates
        `Node.url`, which lives in the snapshot, and by this schema's own
        sentence something that mutates applied state and has no op is
        something that would not replicate. Reusing `enrollNode` as an
        upsert would have worked and been worse: the log is read by
        operators, and a node that moved house would appear to have
        enrolled again.

        **`revokeSession` (2026-09-25)** records a sign-out, because the
        trust bundle every machine checks sessions against is built
        from applied state. A sign-out a standby had not seen would be a
        session a promotion brought back.

        **`rotateSigningKey` still carries `revokedNode`** in logs
        written before 2026-09-25, when revoking a node rotated the
        shared key. It removes that node if it is still enrolled. Nothing
        writes it that way now: a revocation is one `revokeNode`.

    Snapshot:
      type: object
      description: |
        Applied state as of `index`, for bootstrapping a standby or
        recovering one that fell behind compaction.

        Carries the replication set and nothing else. The passphrase
        exists only in the operator's head; per-component secrets are
        sealed on the hosts that read them and never travel here.

        **The governing rule, learned by implementing it:** a snapshot
        has to be able to reproduce exactly what the log produces,
        because it *is* the log's compacted head. **Every** `LogOp` value
        must have somewhere to land here, or compaction
        silently discards the state that op wrote — and the loss shows
        up at a promotion rather than at the compaction. Adding an op
        means checking this schema can hold its effect.

        **`Node.reachable` in a snapshot is not an observation.** It is
        required by that schema and a snapshot carries no observations,
        so it is always `false` here and a reader must not treat it as a
        report about the host. Reachability, `lastSeenAt` and
        `lastSeenEpoch` belong to whichever root did the polling; see
        `GET /v1/nodes`.
      required:
        - index
        - epoch
      properties:
        browserSignIn:
          $ref: '#/components/schemas/BrowserSignInState'
        clientAdmission:
          type: object
          additionalProperties: true
          description: Durable logical clock and per-key admission buckets; replayed verbatim with leases and rolling-window charges.
        accessAudit:
          type: array
          maxItems: 1000
          items: {$ref: '#/components/schemas/AccessAuditEvent'}
        clientKeys:
          type: array
          items: {$ref: '#/components/schemas/ClientKey'}
        index:
          type: integer
          format: int64
        epoch:
          type: integer
          format: int64
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/Node'
        components:
          type: array
          items:
            $ref: '#/components/schemas/ComponentPlacement'
        runtimes:
          type: array
          items:
            $ref: '#/components/schemas/RuntimePlacementSpec'
          description: |
            Runtime **declarations** — what should be running where —
            and deliberately not `RuntimePlacement`, which is the
            reporting shape and carries no `spec`.

            §4 of the design requires "declared runtimes" to survive,
            and a placement without its spec is not a declaration: a
            promoted standby holding one would know a runtime's name and
            nothing about the model path or flags it launches with.
            `node` is always present here even though the schema allows
            it to be omitted elsewhere; a snapshot has no "the node the
            control root runs on" default to fall back on, because the
            root that reads it may not be the root that wrote it.
        config:
          type: object
          additionalProperties: true
          description: |
            The control root's own applied configuration.

            Replicated because `patchConfig` is one of the ops, so
            config *is* control state — and a snapshot that dropped it
            would lose every config change made before the last
            compaction. A promoted standby that came up without
            `standbyUrls` would silently have no standbys of its own,
            which is the failure mode where the second failover is the
            one that hurts. (Since 2026-10-08 the standby is the node with
            the `standby` grant, which is in `nodes`, and `standbyUrls` is
            no longer read.)
        signingKeyId:
          type: string
          description: |
            Names the current generation of this root's token key. Not a
            secret.
        revokedSessions:
          type: array
          items:
            $ref: 'components/common.yaml#/components/schemas/RevokedSession'
          description: |
            Sessions signed out and not yet expired, as `revokeSession`
            wrote them. The trust bundle carries the same list.
        salt:
          type: string
          description: |
            The Argon2id salt. Replicated because without it the same
            passphrase derives a different key, and a standby that cannot
            derive the master key cannot be promoted.
        passphraseVerifier:
          type: string
          description: |
            Lets a standby authenticate the operator at promotion without
            holding the master key.
        sealedRecoveryKey:
          type: string
          description: |
            The recovery recipient, sealed under the passphrase-derived
            key. Replicated so a promoted standby can still reach a dead
            node's secrets; useless to anyone without the passphrase.
        sealedSigningKey:
          type: string
          description: |
            This root's token key, sealed under the passphrase-derived
            key: what signs operator sessions, exchanged tokens and client
            keys. It never leaves a root in any other form.

            Replicated so a promoted standby signs with the same key and
            nobody has to sign in again or reissue a client key. It is
            **sealed** because a snapshot is a file on a second host; the
            standby has the salt and the verifier but no master key until
            the operator supplies the passphrase at promotion, which is
            exactly the moment it needs to open this.
        rootTokenPublicKey:
          type: string
          description: |
            Base64 of the raw public half of the above, in the clear, so a
            root can publish a bundle naming it without unsealing
            anything.
        sealedControlKey:
          type: string
          description: |
            The control root's own identity private key, sealed under
            the passphrase-derived key. Its public half is what nodes
            record at enrollment as `controlPublicKey` and check epoch
            changes against, so a promoted standby that generated a
            *fresh* identity would be rejected by every enrolled node.
            Replicating it is what makes promotion a change of host
            rather than a change of identity.
        controlPublicKey:
          type: string
          description: |
            The public half of the above, carried in the clear so a
            standby can report the identity it would assume without
            holding the passphrase.
        installCaCertificate:
          type: string
          description: |
            The install CA's certificate, PEM (LT2): what every device
            trusts. Absent until `setInstallCa`.
        sealedInstallCaKey:
          type: string
          description: |
            The install CA's private key, PKCS8 DER sealed under the
            passphrase-derived key. Replicated so a promoted standby issues
            leaves under the same CA and no device has to trust a new one.
        permissionGroups:
          type: array
          items: {$ref: '#/components/schemas/PermissionGroup'}
          description: Central access groups. Absent in old snapshots means no groups.
        people:
          type: array
          items: {$ref: '#/components/schemas/SnapshotPerson'}
          description: |
            The people who may sign in to apps, as `putPerson`,
            `setPersonPassword` and `deletePerson` left them, with their
            Argon2id verifiers: as `passphraseVerifier` is here, and for the
            same reason (a promoted standby signs people in).
        sites:
          type: array
          items: {$ref: '#/components/schemas/SnapshotSite'}
          description: The Job Site registry (J19), as `enrollSite`, `removeSite`, `setSiteHost` and `setSiteDevGrants` left it.
        nodeHelpers:
          type: array
          deprecated: true
          items: {type: object, additionalProperties: true}
          description: Read from snapshots written before slice 2b.1, and ignored. The operator-managed node folders retired (J20).
        oidcClients:
          type: array
          items: {$ref: '#/components/schemas/SnapshotOidcClient'}
        oidcKeys:
          type: array
          items: {$ref: '#/components/schemas/SnapshotOidcKey'}
          description: |
            The provider's RSA keys, newest first, each sealed under the
            passphrase-derived key as `sealedSigningKey` is.
        revokedSignIns:
          type: array
          items:
            $ref: 'components/common.yaml#/components/schemas/RevokedSession'
          description: Sign-ins revoked at `/oidc/revoke` and not yet expired, by their `jti`.

    SnapshotSite:
      type: object
      additionalProperties: false
      description: One Job Site in the registry (J19).
      required: [id, label, owner, tokenPublicKey, enrolledAt]
      properties:
        id: {$ref: 'components/sites.yaml#/SiteId'}
        label: {$ref: 'components/sites.yaml#/SiteLabel'}
        owner: {type: string, description: The owner's person id.}
        tokenPublicKey: {type: string}
        enrolledAt: {type: string, format: date-time}
        hostNode: {type: [string, 'null']}
        devGrants:
          type: array
          maxItems: 64
          items: {$ref: '#/components/schemas/SiteDevGrant'}

    SnapshotPerson:
      type: object
      required: [id, name, passwordVerifier, disabled, createdAt, passwordChangedAt]
      properties:
        administration: {$ref: '#/components/schemas/AdministrationGrants'}
        administrationVersion:
          type: integer
          minimum: 0
          description: Absent is zero. Increased on delegation, disable/enable and password changes to invalidate administration sessions.
        groups:
          type: [array, 'null']
          maxItems: 64
          uniqueItems: true
          items: {type: string, minLength: 1, maxLength: 64}
          description: Null or absent keeps individual access. A list uses only the union of these groups; an empty list grants no access. Individual app/permission settings are retained but inactive in group mode.
        helperGrants:
          type: array
          deprecated: true
          items: {type: object, additionalProperties: true}
          description: Read from snapshots written before slice 2b.1, and ignored (J20).
        id: {type: string}
        name: {type: string}
        displayName: {type: string}
        email: {type: string}
        passwordVerifier: {type: string, description: 'Argon2id, the passphrase''s parameters.'}
        apps:
          type: [array, 'null']
          items: {type: string}
        permissions:
          type: [array, 'null']
          items: {type: string}
          description: Since 2b.3b (J77). Absent in a snapshot written before then, which reads as null, the install's defaults.
        disabled: {type: boolean}
        createdAt: {type: string, format: date-time}
        passwordChangedAt: {type: string, format: date-time}

    SnapshotOidcClient:
      type: object
      required: [clientId, name, secretVerifier, redirectUris, createdAt]
      properties:
        clientId: {type: string}
        name: {type: string}
        secretVerifier: {type: string, description: 'SHA-256 of the 32 random bytes of the secret, hex.'}
        redirectUris:
          type: array
          items: {type: string}
        owner: {type: string}
        createdAt: {type: string, format: date-time}

    SnapshotOidcKey:
      type: object
      required: [kid, sealedKey, publicJwk, createdAt]
      properties:
        kid: {type: string}
        sealedKey: {type: string}
        publicJwk: {type: object, additionalProperties: true}
        createdAt: {type: string, format: date-time}

    Person:
      type: object
      description: |
        A stable account for apps. Explicit owner-granted administration may also
        open directory management; it never grants owner or private-chat access.
      required: [id, name, disabled, createdAt, passwordChangedAt]
      properties:
        administration: {$ref: '#/components/schemas/AdministrationGrants'}
        groups:
          type: [array, 'null']
          maxItems: 64
          uniqueItems: true
          items: {type: string, minLength: 1, maxLength: 64}
          description: Null or absent keeps individual access. A list uses only the union of these groups; an empty list grants no access. Individual app/permission settings are retained but inactive in group mode.
        id: {type: string, description: 'Stable; the `sub` in their ID tokens.'}
        name: {type: string, description: 'What they sign in with. Unique, compared case-folded.'}
        displayName: {type: string}
        email:
          type: string
          description: |
            Optional, and unique compared case-folded. Given to an app that
            asks for the `email` scope, with `email_verified: false`: Eugene
            sends no mail and has proved nothing about it. Some apps (Open
            WebUI) identify people by it (C4).
        appsInEffect:
          type: [array, 'null']
          items: {type: string}
          description: Effective app grants, calculated from groups or individual access. Null means every app; an empty list means none.
        apps:
          type: [array, 'null']
          items: {type: string}
          description: The `clientId`s they may sign in to. Null is every app on the install.
        permissions:
          type: [array, 'null']
          maxItems: 16
          uniqueItems: true
          items: {$ref: '#/components/schemas/PersonPermission'}
          description: |
            Exactly these permissions (J77). Null is the install's defaults,
            the root's settings `peopleMayAddJobSites` and
            `peopleMayUseJobSites`, so changing a default changes everyone
            left on it.
        permissionsInEffect:
          type: array
          items: {$ref: '#/components/schemas/PersonPermission'}
          description: Effective permissions from selected groups, or individual permissions/install defaults when groups is null.
        policiesInEffect:
          $ref: '#/components/schemas/PoliciesInEffect'
          description: The group policies that apply to them now, and which groups set each. Absent from an older root.
        disabled: {type: boolean}
        createdAt: {type: string, format: date-time}
        passwordChangedAt: {type: string, format: date-time}

    AdministrationGrants:
      type: object
      additionalProperties: false
      properties:
        managePeople:
          type: boolean
          default: false
          description: Create accounts with no access, edit display names, disable/enable or delete ordinary accounts. No password resets, email changes, individual access edits, self edits or changes to other administrators.
        manageGroups:
          type: boolean
          default: false
          description: Define groups and their app/job-site grants. Does not assign memberships or administration rights. May change access for existing members of these groups.
        membershipGroups:
          type: array
          default: []
          maxItems: 64
          uniqueItems: true
          items: {type: string, minLength: 1, maxLength: 64}
          description: May add/remove ordinary accounts in exactly these groups. Preserve memberships outside this scope. May not change individual-access mode, self or other administrators.
    AdministrationLoginRequest:
      type: object
      additionalProperties: false
      required: [name, password]
      properties:
        name: {type: string, minLength: 1, maxLength: 64}
        password: {type: string, minLength: 1, maxLength: 1024}
    AdministrationSession:
      type: object
      description: When owner is true, authority is unrestricted and the membershipGroups scope is not applicable. The owner's session uses the existing owner logout endpoint.
      required: [personId, name, owner, grants]
      properties:
        personId: {type: string}
        name: {type: string}
        owner: {type: boolean}
        grants: {$ref: '#/components/schemas/AdministrationGrants'}
    AdministrationLoginResponse:
      type: object
      required: [sessionToken, expiresAt, session]
      properties:
        sessionToken: {type: string}
        expiresAt: {type: string, format: date-time}
        session: {$ref: '#/components/schemas/AdministrationSession'}

    PersonPermission:
      type: string
      description: |
        What a person may do with job sites (J77, `job-sites-own-enrollment.md`
        §3.3). Kept at the root, set where People are managed. They only
        narrow: whatever they say, a site still needs the person's OS
        account on the machine, a link made there, and their own key on
        their own changes, so a root that sets one wrongly gives no one more
        than the machine allows.
        - `add-job-sites`: add a machine of their own as a job site
          (`/oidc/job-sites/invite`, J9).
        - `use-job-sites`: link themselves at a site's machine (the link
          page's sign-in and `/v1/sites/links/check`), and keep workspaces
          of their own there (`/oidc/job-sites/{site}/workspaces…`, and calls
          into those workspaces). Taking it away leaves a link on the machine
          inert: the root refuses its workspaces and calls, and the person or
          the site's owner can remove the link. A folder the site's owner
          shares with them is the owner's grant and is not governed by it.
      enum: [add-job-sites, use-job-sites]

    PersonList:
      type: object
      required: [people]
      properties:
        owner:
          $ref: '#/components/schemas/OwnerAccount'
        people:
          type: array
          items: {$ref: '#/components/schemas/Person'}
        operatorName:
          type: string
          description: The name the owner signs in with, once the install has people.

    PersonCreateRequest:
      type: object
      additionalProperties: false
      required: [name, password]
      properties:
        groups:
          type: [array, 'null']
          maxItems: 64
          uniqueItems: true
          items: {type: string, minLength: 1, maxLength: 64}
          description: Null or absent keeps individual access. A list uses only the union of these groups; an empty list grants no access. Individual app/permission settings are retained but inactive in group mode.
        name: {type: string, minLength: 1, maxLength: 64, pattern: "^[^\\s@][^@]*[^\\s@]$|^[^\\s@]$"}
        displayName: {type: string, maxLength: 120}
        email: {type: string, maxLength: 254, pattern: "^[^@\\s]+@[^@\\s]+$"}
        password: {type: string, minLength: 12, maxLength: 1024}
        apps:
          type: [array, 'null']
          items: {type: string}
        permissions:
          type: [array, 'null']
          maxItems: 16
          uniqueItems: true
          items: {$ref: '#/components/schemas/PersonPermission'}
          description: |
            Exactly these permissions (J77). Null is the install's defaults,
            the root's settings `peopleMayAddJobSites` and
            `peopleMayUseJobSites`, so changing a default changes everyone
            left on it.

    PersonUpdateRequest:
      type: object
      additionalProperties: false
      properties:
        groups:
          type: [array, 'null']
          maxItems: 64
          uniqueItems: true
          items: {type: string, minLength: 1, maxLength: 64}
          description: Null or absent keeps individual access. A list uses only the union of these groups; an empty list grants no access. Individual app/permission settings are retained but inactive in group mode.
        displayName: {type: string, maxLength: 120}
        email:
          type: [string, 'null']
          maxLength: 254
          pattern: "^[^@\\s]+@[^@\\s]+$"
          description: A new address, or `null` to clear it.
        apps:
          type: [array, 'null']
          items: {type: string}
        permissions:
          type: [array, 'null']
          maxItems: 16
          uniqueItems: true
          items: {$ref: '#/components/schemas/PersonPermission'}
          description: |
            Exactly these permissions (J77). Null is the install's defaults,
            the root's settings `peopleMayAddJobSites` and
            `peopleMayUseJobSites`, so changing a default changes everyone
            left on it.
        disabled: {type: boolean}

    PersonPasswordRequest:
      type: object
      additionalProperties: false
      required: [password]
      properties:
        password: {type: string, minLength: 12, maxLength: 1024}

    OidcClient:
      type: object
      required: [clientId, name, redirectUris, createdAt]
      properties:
        clientId: {type: string}
        name: {type: string}
        redirectUris:
          type: array
          items: {type: string}
        owner:
          type: string
          description: '`app:<id>@<node>` for an app the registry installed; absent for one the operator added.'
        createdAt: {type: string, format: date-time}

    OidcKey:
      type: object
      description: One sign-in key (row 5), without its key material.
      required: [kid, createdAt, signs]
      properties:
        kid:
          type: string
          description: The key's RFC 7638 thumbprint, as the JWKS names it.
        createdAt:
          type: string
          format: date-time
        signs:
          type: boolean
          description: True for the newest key, which signs every new token.
        verifiesUntil:
          type: string
          format: date-time
          description: |
            For a key that no longer signs: when the last refresh token
            it signed expires (30 days after the next key was made). It
            is dropped at the next change after that. Absent for the key
            that signs.
    OidcKeyList:
      type: object
      required: [keys]
      properties:
        keys:
          type: array
          description: Newest first. Empty before the first sign-in made a key.
          items: {$ref: '#/components/schemas/OidcKey'}
        nextChangeAt:
          type: string
          format: date-time
          description: |
            When the active root changes the key by itself:
            `signInKeyDays` after the newest key was made. It checks once
            an hour while it is unlocked. Absent when `signInKeyDays` is 0
            (never) or there is no key yet.
    OidcKeyChangeRequest:
      type: object
      additionalProperties: false
      properties:
        endSignIns:
          type: boolean
          default: false
          description: |
            True after a suspected leak: tokens the old key signed stop
            verifying at once. An app that renews them asks the person to
            sign in again (Workbench within five minutes, its JWKS cache);
            an app that keeps its own session (Open WebUI) keeps it until
            it expires or the person signs out.
    PassphraseChangeRequest:
      type: object
      additionalProperties: false
      required: [current, new]
      properties:
        current:
          type: string
          format: password
          minLength: 1
          writeOnly: true
          description: Eugene's passphrase now.
        new:
          type: string
          format: password
          minLength: 12
          writeOnly: true
          description: The new passphrase, at least 12 characters.
    PassphraseMachineState:
      type: string
      enum: [changed, pending, plain]
      description: |
        * `changed`: the machine took the new passphrase.
        * `pending`: it was not reached, or could not take it now; it
          takes it at its next sign-in with the new passphrase.
        * `plain`: it is reached in plain HTTP, so nothing was sent to
          it; it takes the new passphrase at its next sign-in.
    PassphraseMachine:
      type: object
      required: [node, state]
      properties:
        node: {type: string}
        state: {$ref: '#/components/schemas/PassphraseMachineState'}
        detail:
          type: string
          description: |
            The observed cause, for `pending` and `plain`. For `changed`,
            what the machine could not do with the new passphrase:
            *this machine could not save its passphrase file: <cause>*
            (after a restart it stays locked until someone signs in).
    PassphraseFileState:
      type: string
      enum: [matches, old, none]
      description: |
        The passphrase file this root unlocks from (`securityMode:
        passphrase_file`), checked at each start, every hour and after a
        change: `matches` holds this install's passphrase; `old` holds
        another (after a change this root could not write it), so after a
        restart the root stays locked until someone signs in; `none`
        means this root does not unlock from a file.
    PassphraseChangeResult:
      type: object
      required: [changedAt, machines, passphraseFile]
      properties:
        changedAt:
          type: string
          format: date-time
        machines:
          type: array
          description: |
            Each machine that keeps a passphrase of its own, or that could
            not be asked whether it does, by node name.
          items: {$ref: '#/components/schemas/PassphraseMachine'}
        passphraseFile: {$ref: '#/components/schemas/PassphraseFileState'}
        cleanup:
          type: string
          description: |
            Present when the passphrase changed but the copies sealed
            under the old key could not be removed yet: the cause. The
            root tries again every hour and at its next start.
    OidcClientList:
      type: object
      required: [clients]
      properties:
        clients:
          type: array
          items: {$ref: '#/components/schemas/OidcClient'}
        issuer:
          type: string
          description: 'Explicit oidcIssuer or the managed console origin with /oidc. Otherwise absent, and an app uses the address it reaches Eugene at with /oidc.'

    OidcClientCreateRequest:
      type: object
      additionalProperties: false
      required: [name, redirectUris]
      properties:
        name: {type: string, minLength: 1, maxLength: 80}
        redirectUris:
          type: array
          minItems: 1
          maxItems: 20
          items: {type: string, minLength: 1, maxLength: 2048}
        owner: {type: string, maxLength: 120}

    OidcClientRedirectsRequest:
      type: object
      additionalProperties: false
      required: [redirectUris]
      properties:
        redirectUris:
          type: array
          minItems: 1
          maxItems: 20
          items: {type: string, minLength: 1, maxLength: 2048}

    OidcClientCreated:
      type: object
      required: [client, clientSecret]
      properties:
        client: {$ref: '#/components/schemas/OidcClient'}
        clientSecret:
          type: string
          description: In this answer only.

    OidcDiscovery:
      type: object
      additionalProperties: true
      required: [issuer, authorization_endpoint, token_endpoint, jwks_uri]
      properties:
        issuer: {type: string}
        authorization_endpoint: {type: string}
        token_endpoint: {type: string}
        userinfo_endpoint: {type: string}
        revocation_endpoint: {type: string}
        jwks_uri: {type: string}
        response_types_supported:
          type: array
          items: {type: string}
        id_token_signing_alg_values_supported:
          type: array
          items: {type: string}
        code_challenge_methods_supported:
          type: array
          items: {type: string}

    JsonWebKeySet:
      type: object
      required: [keys]
      properties:
        keys:
          type: array
          items: {type: object, additionalProperties: true}

    OidcTokenResponse:
      type: object
      required: [access_token, token_type, expires_in, id_token]
      properties:
        access_token: {type: string}
        token_type: {type: string, enum: [Bearer]}
        expires_in: {type: integer}
        id_token: {type: string}
        refresh_token: {type: string}
        scope: {type: string}

    OAuthError:
      type: object
      required: [error]
      properties:
        error: {type: string}
        error_description: {type: string}

    OidcSubjectsRequest:
      type: object
      additionalProperties: false
      required: [subjects]
      properties:
        subjects:
          type: array
          minItems: 1
          maxItems: 500
          items: {$ref: '#/components/schemas/OidcSubject'}

    OidcSubject:
      type: string
      description: A person's `sub`, as their ID token carries it.
      minLength: 1
      maxLength: 200

    OidcSubjectsResponse:
      type: object
      additionalProperties: false
      required: [known, unknown]
      properties:
        known:
          type: array
          description: Ids Eugene has a person record for (on or off), or the owner's.
          items: {type: string}
        unknown:
          type: array
          description: Ids Eugene has no person for. Each one was deleted, or never was Eugene's.
          items: {type: string}

    OidcGroup:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id: {type: string, minLength: 1, maxLength: 64}
        name: {type: string, minLength: 1, maxLength: 80}

    OidcGroupsResponse:
      type: object
      additionalProperties: false
      required: [groups]
      properties:
        groups:
          type: array
          description: The permission groups that give the calling app, sorted by name.
          items: {$ref: '#/components/schemas/OidcGroup'}

    PromoteRequest:
      type: object
      required:
        - passphrase
      properties:
        passphrase:
          type: string
          format: password
          description: |
            Required, and the reason the master key never needs to live
            on a standby at rest or cross the wire to it.
        force:
          type: boolean
          default: false
          description: |
            Promote despite trailing the active root. For the operator
            who has decided that losing the tail beats staying down —
            an explicit choice with a name, not a silent default.

    TrustChange:
      type: object
      description: |
        What a revocation or a root-key rotation changed. Both publish a
        new trust bundle and push it. Nothing is re-keyed on any node,
        so there is no mixed-key state to track. A node either holds the
        new bundle or it does not yet, and it says which on every probe
        (`Node.trustBundleVersion`).
      required:
        - version
        - reason
        - nodesBehind
      properties:
        version:
          type: integer
          format: int64
          description: The bundle version this change produced.
        reason:
          type: string
          enum: [revocation, rotation, standby]
          description: '`standby`: a `makeStandby` or `stopStandby` (2026-10-08).'
        revokedNode:
          type: string
          description: 'Set when `reason: revocation`.'
        standbyNode:
          type: string
          description: |
            Set when `reason: standby`: the node that holds the grant now.
            Absent when no node does.
        nodesBehind:
          type: array
          items:
            type: string
          description: |
            Nodes that had not acknowledged `version` when this answered:
            named, because "which host still trusts the old key" is the
            question an operator has. They take it from the push, or
            when they next pull.

    TokenExchangeRequest:
      type: object
      required:
        - subjectToken
        - audience
      properties:
        subjectToken:
          type: string
          description: The operator's session, addressed to the actor's machine.
        audience:
          type: string
          pattern: '^node:.+$'
          description: The one machine the exchanged token may be presented to.

    TokenExchangeResponse:
      type: object
      required:
        - accessToken
        - expiresAt
      properties:
        accessToken:
          type: string
          description: An `ep-session+jwt` addressed to `audience`, with `act` and `sid`.
        expiresAt:
          type: string
          format: date-time

    # -------- topology --------

    ComponentPlacementList:
      type: object
      required:
        - components
      properties:
        components:
          type: array
          items:
            $ref: '#/components/schemas/ComponentPlacement'
        unreachableNodes:
          type: array
          items:
            type: string
          description: |
            Nodes that could not be asked. Named explicitly so the view
            is honestly partial rather than quietly short.

    ComponentPlacement:
      type: object
      description: |
        A component, plus which node it runs on. The node dimension is
        the only thing the agent's own view cannot supply.
      required:
        - node
        - name
        - kind
      properties:
        node:
          type: string
        name:
          type: string
        kind:
          $ref: 'components/common.yaml#/components/schemas/ComponentKind'
        url:
          type: string
          format: uri
        status:
          type: string
          description: |
            As the owning agent reports it. Deliberately a string here
            rather than a copy of the agent's enum: the agent owns
            component status, and duplicating its enum in this document
            would create two definitions of one fact.

    RuntimePlacementList:
      type: object
      required:
        - runtimes
      properties:
        runtimes:
          type: array
          items:
            $ref: '#/components/schemas/RuntimePlacement'
        unreachableNodes:
          type: array
          items:
            type: string
          description: |
            Nodes that could not be asked. A dashboard showing fewer
            runtimes than exist, with no indication why, is worse than
            one that names the host it could not reach.

    RuntimePlacement:
      type: object
      description: |
        An engine runtime, plus the node it runs on. Every other field is
        the agent's `Runtime` verbatim, relayed rather than
        reinterpreted — this document adds placement and takes nothing
        away.
      required:
        - node
        - name
      properties:
        node:
          type: string
        name:
          type: string
        modelAlias:
          type: string
          description: |
            The model id a client asks the gateway for. Unique across the
            *install*, not just the node — two nodes serving the same
            alias is how replicas are expressed, and the gateway load
            balances across them.
        status:
          type: string
        url:
          type: string
          format: uri
        engine:
          $ref: 'components/common.yaml#/components/schemas/EngineKind'

    RuntimePlacementSpec:
      type: object
      description: |
        A runtime declaration plus where to put it. `spec` is the agent's
        `RuntimeSpec` unchanged; this wrapper adds only the node.
      required:
        - spec
      properties:
        node:
          type: string
          description: |
            Target host. Omitted means the node the control root runs on,
            so a single-host install never has to name anything.
        spec:
          type: object
          additionalProperties: true
          description: |
            The agent's `RuntimeSpec`, forwarded verbatim. Modelled
            loosely here on purpose: the agent's spec is the one
            definition of what a runtime declaration is, and restating
            its fields in this document would create a second one that
            drifts.

    # -------- auth --------

    AuthStatus:
      type: object
      description: |
        Whether this trust root has been through first-run setup,
        whether its sealed values are open right now, and whether this
        host's OS keyring can keep them open across a restart. Same
        shape as the agent's, for the same reader: the first-run wizard
        writes `securityMode` to both processes on this host, and the
        UI's Issues list reads `unlocked` here to say "sealed" in words
        instead of a 503.
      required:
        - initialized
      properties:
        initialized:
          type: boolean
          description: |
            True once a passphrase has been set. False means every
            endpoint except this one, `/healthz` and
            `POST /v1/auth/initialize` will refuse.
        unlocked:
          type: boolean
          description: |
            True while the master key is in memory and this root's
            token key is open. False is the sealed root that answers
            `503 Locked` across its surface — the state a container comes
            back in after every restart under `prompt_on_startup`.
            Absent from a root that predates the field.
        keyringAvailable:
          type: boolean
          description: |
            Whether this host's OS keyring accepted a write, read and
            delete of a probe entry from this process — measured once per
            process run. False in a container or on a headless box, where
            `passphrase_file` is the unattended answer. Absent when the
            probe was not run or did not finish within its budget.
        passphraseFile:
          $ref: '#/components/schemas/PassphraseFileState'

    AuthInitializeRequest:
      type: object
      required:
        - passphrase
      properties:
        passphrase:
          type: string
          minLength: 1
          format: password
          description: |
            Hashed with Argon2id and used to derive the master key that
            at-rest secrets are sealed under. Losing it means losing
            every stored credential — including the recovery recipient
            that would otherwise reach a dead node's secrets. There is no
            recovery path, by design.

    OwnerAccount:
      type: object
      description: Protected root owner, listed beside people without changing the existing operator subject or passphrase recovery. Not editable through person/group APIs.
      required: [id, name, displayName]
      properties:
        id: {type: string}
        name: {type: string}
        displayName: {type: string}

    PermissionGroup:
      type: object
      description: A shared collection of app and job-site grants.
      additionalProperties: false
      required: [id, name, description, apps, permissions, createdAt, updatedAt]
      properties:
        id: {type: string, minLength: 1, maxLength: 64}
        name: {type: string, minLength: 1, maxLength: 80}
        description: {type: string, maxLength: 500}
        apps:
          type: [array, 'null']
          maxItems: 256
          uniqueItems: true
          items: {type: string}
          description: Explicit app client IDs; null deliberately grants all apps.
        permissions:
          type: array
          maxItems: 16
          uniqueItems: true
          items: {$ref: '#/components/schemas/PersonPermission'}
        policies:
          $ref: '#/components/schemas/GroupPolicies'
          description: |
            What the group sets for its members (row 70). A root that knows
            policies always answers this object, with `null` for each policy
            not set; an older root leaves it out, and a console hides its
            Policies section then. In the replicated log and the snapshot it
            is kept only when a policy is set, holding only the policies set.
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}

    PermissionGroupWrite:
      type: object
      description: Complete replacement policy; omitted grants default to no access.
      additionalProperties: false
      required: [name]
      properties:
        name: {type: string, minLength: 1, maxLength: 80}
        description: {type: string, maxLength: 500, default: ''}
        apps:
          type: [array, 'null']
          maxItems: 256
          uniqueItems: true
          default: []
          items: {type: string}
        permissions:
          type: array
          maxItems: 16
          uniqueItems: true
          default: []
          items: {$ref: '#/components/schemas/PersonPermission'}
        policies:
          $ref: '#/components/schemas/GroupPolicies'
          description: |
            The group's policies, replaced whole: a `null` or absent policy
            inside is not set. Omitted from a replace, the group keeps its
            current policies, so a console that predates policies never
            clears them. Omitted from a create, the group sets none. An
            older root refuses this field (`additionalProperties: false`).

    GroupPolicies:
      type: object
      additionalProperties: false
      description: |
        Policies a permission group sets for its members (row 70). Not set
        is no policy: a person whose groups set none gets the install's
        default. A person in several groups gets the most generous value of
        each: the highest queue band, the larger percent.
      properties:
        queueBand:
          oneOf:
            - $ref: '#/components/schemas/QueueBand'
            - type: 'null'
          description: Queue priority for the members' requests. The root returns it in the admission check of a verified person.
        summaryContextPercent:
          type: [integer, 'null']
          minimum: 50
          maximum: 95
          description: The percent of a model's context at which Workbench starts summarising a long chat. With no policy, Workbench uses 80.

    PoliciesInEffect:
      type: object
      additionalProperties: false
      description: |
        The policies that apply to a person now (row 70), from the groups
        they are in: the most generous value of each. An absent value is no
        policy. Individual access (`groups` null) sets none. The same object
        is the `eugene_policies` sign-in claim.
      properties:
        queueBand: {$ref: '#/components/schemas/QueueBand'}
        summaryContextPercent: {type: integer, minimum: 50, maximum: 95}
        setBy: {$ref: '#/components/schemas/PoliciesSetBy'}

    PoliciesSetBy:
      type: object
      additionalProperties: false
      description: For each policy value in effect, the ids of the groups that set that value, sorted by group name.
      properties:
        queueBand:
          type: array
          maxItems: 64
          items: {type: string}
        summaryContextPercent:
          type: array
          maxItems: 64
          items: {type: string}

    PermissionGroupList:
      type: object
      description: All permission groups in the central directory.
      required: [groups]
      properties:
        groups:
          type: array
          items: {$ref: '#/components/schemas/PermissionGroup'}
