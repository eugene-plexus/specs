openapi: 3.1.0
info:
  title: Eugene Plexus — agent
  version: 0.3.0-draft
  summary: Per-host process supervisor and engine launcher. One per node.
  description: |
    The agent is the per-host supervisor: **one runs on every node** in
    an install, and it is the only Eugene Plexus process an operator
    starts by hand. Its lifecycle belongs to the platform — a systemd
    unit, a **Windows service**, a container entrypoint — which is why
    it is not itself a `ComponentKind`.

    **What starts it is not a detail, and R2.6 made it a promise.** A
    self-hosted server that only survives a reboot if somebody signs in
    is not one. On Windows that means a real service running as
    LocalSystem, which has two consequences this document carries rather
    than hides: `NodeReach.restart` reports the mechanism and says in
    `detail` whether it comes back before anyone logs in, and
    `shareCredentials` exists at all — a service holds none of the
    per-user credentials the person who installed it collected by hand,
    so an authenticated file share has to be told to it once.

    **M5 splits this component.** Jobs 1-3 below are the agent's and
    stay; jobs 4-5 — the install's trust root and its install-wide
    topology — move to the new **control root** (`control.yaml`),
    because supervision is inherently per-host while a trust root is
    inherently singular. Until that implementation lands, the
    trust-root surface is still served here and still documented here.
    The **node half** — identity, enrollment, the trust bundle, an
    address other hosts can reach — is served from M7
    (`docs/design/m7-second-host-readiness.md`).
    Design: `docs/design/m5-multi-host-and-trust.md`.

    Its jobs:

      1. **Supervise the control-plane components** declared in its
         topology — the gateway, N inference-drivers, the library.
         These are Eugene Plexus processes, spawned as
         `<python> -m <module>`, and the agent respawns any that
         exit. Children marked `safeMode: true` launch with
         `EUGENE_PLEXUS_<KIND>_SAFE_MODE=1` so they boot from defaults
         without reading their own config file.

      2. **Supervise the engine processes.** These are third-party
         binaries we do not own — `llama-server` first — spawned from
         an arbitrary argv the agent's engine adapter constructs,
         with an engine-specific readiness probe. See
         `GET /v1/runtimes`. Supervision *mechanics* are shared with
         components; nothing else is.

      3. **Serve the UI's static assets** at the root path so the
         operator's browser has one stable address to point at, and
         **proxy the browser's API calls** to the gateway, the library,
         the control root and each inference-driver — see `/` and
         `/api/proxy/{target}/{path}`. The assets ship in a separate
         Python distribution, `eugene-plexus-ui`; an install without it
         serves the API normally and says so at `/`, because a missing
         browser surface is a degradation and not a failure.

      4. **Expose its own configuration and topology over HTTP** so the
         UI can edit the install's shape without touching files on
         disk.

      5. **Hold the install's trust root.** The operator's passphrase
         derives the master key that encrypts secrets at rest. The
         agent issues UI session tokens after passphrase login, and
         threads per-component service tokens plus the master key to
         spawned children via env var.

    The agent does not route requests, does not talk to models, and
    consumes no tokens. It starts things and reports what is running.

    ## Why engines and components are separate collections

    Both are supervised processes and share the spawn / watch / respawn
    / log-capture / crash-backoff machinery. Nothing about their
    *declarations* is alike, which is why they are separate surfaces:

    | | Component (`/v1/components`) | Runtime (`/v1/runtimes`) |
    |---|---|---|
    | What it is | a Eugene Plexus process | a third-party engine binary |
    | How it starts | `<python> -m <module>` | argv from an engine adapter |
    | Readiness | the shared `/healthz` | engine-specific probe |
    | Config | the standard config trio | curated engine flag surface |
    | Auth | gets public verification key + service token (legacy HMAC until rotation) | gets none; fronted by a driver |

    Collapsing them would mean one schema whose fields are half-null
    whichever kind it describes.

    ## Security model

    The wizard sets a passphrase at install. The agent derives a
    master key from it via Argon2id and uses that for two things:

      * **At-rest encryption** of `sensitive` config fields on each
        component. The master key is threaded to spawned children via
        env var (`EUGENE_PLEXUS_<KIND>_MASTER_KEY`, base64); children
        decrypt at construction time.
      * **UI session auth.** `POST /v1/auth/login` accepts the
        passphrase. On an enrolled agent it forwards the sign-in to the
        control root, which is the only thing that mints sessions; a
        standalone agent verifies and mints its own. Every UI proxy
        request thereafter presents the session as
        `Authorization: Bearer <token>`.

    Three `securityMode` options:

      * `prompt_on_startup` — master key in memory only; passphrase
        required at every agent start. After a power cut the install
        stays offline until the operator types it.
      * `os_keyring` — master key in OS Credential Manager / Keychain /
        Secret Service, auto-unlocked while the operator's OS session is
        active. More convenient; weaker boundary.
      * `passphrase_file` (2026-09-24) — for an agent that runs under
        its own account, where there is no OS session and so no keyring:
        the Linux system install. The agent keeps the passphrase in the
        file `EUGENE_PLEXUS_AGENT_PASSPHRASE_FILE` names, owner-only
        (0400), writes it itself when the passphrase is set or signed in
        with, and reads it at startup. Whoever can read that file can
        unlock the install, which is the keyring's trade moved to a path
        only that account and root can open. The installer selects it;
        the wizard does not offer it as a choice.

    **Tokens (per-node token keys, 2026-09-25;
    `docs/design/per-node-token-keys.md`).** This agent generates its
    own Ed25519 token key the first time it starts, keeps it in
    `node.yaml`, and sends only the public half at enrollment. No
    private token key ever arrives here. The token profile and the
    trust bundle every verifier checks against are defined in
    `common.yaml` (`TrustBundle`).

    * **Its children** get a service token addressed to this machine
      alone, the bundle's path, the pinned authority key and their own
      recipient name. A child's token is worthless on any other
      machine.
    * **Other machines** are reached with tokens addressed to them: a
      session is exchanged at the root, and this node's own `agent` or
      `gateway` tokens are minted per destination
      (`POST /v1/auth/service-token`).
    * **The proxy never sends a session to another machine.**

    An agent that has not enrolled is its own authority, and signs a
    bundle that names only itself. A mesh VPN (Tailscale / WireGuard)
    remains the network boundary between hosts; this auth layer sits on
    top rather than replacing it.
  license:
    name: Apache-2.0
    identifier: Apache-2.0
  contact:
    name: Eugene Plexus
    url: https://github.com/eugene-plexus
servers:
  - url: http://{host}:{port}
    description: |
      Default loopback deployment. 8079 unless
      `EUGENE_PLEXUS_AGENT_BIND_PORT` says otherwise — a bootstrap
      setting rather than a literal from M7, which is what lets two
      agents share one box for a same-host acceptance run. The UI still
      ships pointed at 8079.
    variables:
      host:
        default: localhost
      port:
        default: "8079"

security:
  - bearerAuth: []

tags:
  - name: auth
    description: |
      Operator passphrase login → session token.

      **Moving to the control root at M5** (`control.yaml`). The agent
      held the trust root only because it used to be the single process;
      once there are N agents there cannot be N trust roots, which is the
      concrete reason the install was capped at one host. Documented here
      until the implementation migrates, so a consumer regenerating
      against this document does not lose the endpoints its login flow
      still calls.
  - name: components
    description: |
      Topology and lifecycle of the supervised Eugene Plexus
      processes — the gateway, the inference-drivers, the library.
      Engine processes are not components; see the `runtimes` tag.
  - name: engines
    description: |
      Which engines this install knows how to start, whether a usable
      binary is present for each, and fetching one when it isn't.
      Engine releases are a managed artifact here, alongside configs
      and (from M2) models.
  - name: runtimes
    description: |
      Engine processes under supervision — third-party binaries we
      spawn from an adapter-built argv, not Eugene Plexus components.
      One runtime serves one model.

      **From M6 a runtime arrives routable.** Declaring one also
      declares a companion `inference-driver` component that follows it
      by name (`RuntimeSpec.autoDriver`), so the gateway sees the model
      the moment the engine is `ready` and no second step is needed.
      Two runtimes declared under one `modelAlias` are two replicas,
      and the gateway load-balances across them. A runtime may also
      carry lifecycle policy — `idleUnloadSeconds` and `startOnDemand`
      — which the **gateway** acts on, because only the gateway sees
      demand; the agent executes the stop and start it is asked for and
      reports why a runtime is stopped. And a launch is measured against
      the target device's free memory before it spawns
      (`POST /v1/runtimes/admission`), because a model that does not
      fit should be refused with the arithmetic rather than discovered
      as an out-of-memory in a log a minute later. Design:
      `docs/design/m6-lifecycle-policy.md`.
  - name: config
    description: |
      Remote-editable agent settings — UI preferences (theme, font
      size), the first-run wizard's completion flag, `securityMode`,
      `vllmBinary`, `advertiseUrl`, and `pathMappings`: this node's
      **overrides** of where a Library folder is mounted here, for the
      one machine that mounts a share somewhere other than the folder's
      own `mounts` say (2026-09-14; at M11 it was the only statement of
      the mapping and every node carried a row per folder). The rules a
      spawn actually uses are the Library's folders' mounts for this
      host's OS shape, with these overrides winning where both name one
      folder; `POST /v1/library/folders/check` reports the effective
      answer per folder, and is what the Library's Folders page renders.
      Also `modelCopyEnabled`, `modelCopyDir` and `modelCopyMinFreeGb`
      (`docs/design/node-local-model-copy.md`): whether this node keeps
      its own copy of the model files **its declared runtimes point
      at**, where, and how much free space to leave on that disk. Per
      node because storage is — an operator is happy to spend 200 GB on
      the machine with the NVMe and not on the one booting off an SD
      card. The knob is headroom to leave rather than a cap to use,
      because headroom is what the volume's owner actually cares about
      and stays meaningful as the disk fills for reasons that have
      nothing to do with us. It is not a library and nothing can be put
      in it by choosing: the set is exactly the distinct `modelPath`s of
      this node's runtimes, so a runtime deleted takes its copy with it
      and there is no policy to configure.

      And `shareCredentials` (R2.6, 2026-09-18): the file servers this
      host has to log in to before it can open a Library folder at all,
      one entry per server. Per node for the same reason `pathMappings`
      is — a mount is a property of the share, a login is a property of
      *this machine's relationship to* it — and it exists because **an
      agent running as a Windows service holds none of the credentials
      the person who installed it once typed into Explorer**. Measured
      on the live install: the same share opens from a logon session
      that has a stored credential and answers `WinError 1272` from one
      that does not, because Windows 11 refuses an unauthenticated guest
      connection by default — so *"the share needs no password"* is not
      the same as *"anything can open it"*. Empty is the right value
      wherever the OS already has access; the agent asks the OS to
      establish the session rather than opening files with a credential
      of its own, so every child it spawns inherits the access without
      knowing the credential exists.

      Topology lives under `/v1/components`, not here, so editing UI
      prefs can never accidentally restructure the install.
      `GET /v1/directories` is the picker behind every path field on
      this host.
  - name: node
    description: |
      This host's identity, its accelerators, and which control root it
      answers to. One agent per host; the install-wide view of every node
      lives on the control root (`control.yaml`).
  - name: apps
    description: |
      Optional spokes this agent installs and supervises — a chat app,
      the Discord connector, one day a trainer — each its own package in
      its own Python environment. **An app is not a component.** A
      component is part of the hub and holds service credentials; an app
      sits outside it and holds a client key, the same credential any
      third-party client of this install could be given. So the hub has
      no private door our own spokes use and nobody else's can: whatever
      an app needs, the public contract offers to everyone. Its UI runs
      on its own port — its own browser origin — and is never embedded
      in the console. Design: `docs/design/apps-and-spokes.md`.
  - name: meta
    description: Health and version.

paths:
  /v1/auth/client-keys/admission:
    post:
      tags: [auth]
      operationId: clientAdmission
      summary: Check or reserve shared client-key allowance (operator or gateway/agent service only).
      description: Durable per-install admission; 30-second renewable leases, rolling 60-second request window. Client bearers cannot call this endpoint.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ClientAdmissionRequest'}
      responses:
        '200':
          description: Current key access or reservation result.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ClientAdmissionResult'}
        '401': {description: Invalid service credential or inactive client key.}
        '403': {description: Model excluded by the key.}
        '409': {description: Reservation expired or policy changed.}
        '429':
          description: Shared concurrency/rate allowance exhausted.
          headers:
            Retry-After: {schema: {type: integer, minimum: 1}}
        '503': {description: Authority unavailable; no local fallback allowance.}

  /v1/auth/client-keys/{keyId}/limits:
    put:
      tags: [auth]
      operationId: setClientKeyLimits
      summary: Set model permissions and shared limits without replacing a key (operator only).
      parameters:
        - {name: keyId, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ClientKeyUpdateRequest'}
      responses:
        '200':
          description: Updated metadata. Revocation and token remain unchanged.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ClientKey'}
        '404': {description: No such key.}
        '503': {description: Registry unavailable.}

  # -------- v0.2: auth --------

  /v1/auth/status:
    get:
      tags: [auth]
      operationId: authStatus
      summary: Has a passphrase been set on this install?
      security: []
      description: |
        Public probe, deliberately. The UI calls it on every page load to
        tell "fresh install, send them to the wizard" from "logged out,
        send them to the login form" — a distinction it cannot make from
        a 401, and which it must not burn a rate-limited login attempt to
        discover.

        One boolean, no secrets, no per-source behaviour, no rate limit.
        Nothing here is worth protecting: an unconfigured install
        announces itself by refusing every other endpoint anyway.
      responses:
        "200":
          description: Initialization state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthStatus"

  /v1/auth/initialize:
    post:
      tags: [auth]
      operationId: initializeAuth
      summary: First-run passphrase setup.
      security: []
      description: |
        Sets the operator passphrase on an uninitialized install:
        persists an Argon2id-PHC hash and the master-key salt, derives
        the master key into memory so the supervisor can thread it to
        children that decrypt at-rest secrets, and returns a session
        token.

        Returning a session — rather than making the caller log in
        immediately afterwards — is what lets the wizard commit the rest
        of its screens in the same transaction. Everything it writes
        after this point is authenticated.

        **Not** a change-passphrase endpoint. It refuses with 409 when a
        passphrase already exists, because an endpoint that both creates
        and replaces a credential, and is reachable without one, is a
        reset endpoint by accident.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthInitializeRequest"
      responses:
        "200":
          description: Initialized; an operator session comes back with it.
          content:
            application/json:
              schema:
                $ref: "components/common.yaml#/components/schemas/AuthLoginResponse"
        "409":
          description: Already initialized — log in instead.
          content:
            application/problem+json:
              schema:
                $ref: "components/common.yaml#/components/schemas/Problem"

  /v1/auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Exchange the operator's passphrase for a session token.
      security: []
      description: |
        **Enrolled, this forwards to the control root**, which is the
        only thing in an install that mints operator sessions. If this
        agent holds a passphrase of its own, it checks it first and
        unlocks its own master key. It then sends the passphrase to the
        root, with its own `agent` service token as proof of which
        machine is asking, and returns the root's session. That session
        is addressed to this machine and to the root. A worker with no
        passphrase of its own is a console now too.

        If the root does not answer, this is a **503** saying so.
        Sessions already issued keep working, and so does inference.

        **Standalone** (not enrolled), this agent verifies the Argon2id
        hash set during the first-run wizard and mints the session
        itself.

        Rate-limited per source IP. After 5 failed attempts within
        60 seconds, the endpoint returns 429 and refuses further
        attempts from that source for 60 seconds. (No lockout of the
        legitimate operator — they'll just have to wait.)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "components/common.yaml#/components/schemas/AuthLoginRequest"
      responses:
        "200":
          description: Logged in.
          content:
            application/json:
              schema:
                $ref: "components/common.yaml#/components/schemas/AuthLoginResponse"
        "401":
          description: Wrong passphrase.
          content:
            application/problem+json:
              schema:
                $ref: "components/common.yaml#/components/schemas/Problem"
        "429":
          description: Rate-limited.
          content:
            application/problem+json:
              schema:
                $ref: "components/common.yaml#/components/schemas/Problem"

  /v1/auth/sessions/current:
    delete:
      tags: [auth]
      operationId: logout
      summary: Invalidate the current session token.
      description: |
        The token presented in `Authorization` is added to this
        agent's revocation list and, when enrolled, forwarded to the
        control root. The root's replicated sign-out reaches every
        machine through the trust bundle. The local list covers a
        sign-out made while the root cannot be reached.
      responses:
        "204":
          description: Logged out.
        "401":
          $ref: "components/common.yaml#/components/responses/Problem"

  /v1/auth/service-token:
    post:
      tags: [auth]
      operationId: mintServiceToken
      summary: A short-lived token for one of this agent's children to present on another machine.
      description: |
        **How the gateway reaches every node's drivers and agents without
        a key of its own.** A child authenticates with the local token it
        was spawned with, which is addressed to this machine alone, and
        asks for a token addressed to one other recipient. The agent signs
        it with this node's key for 15 minutes, under the caller's own
        `sub`. The child caches it and asks again at half its life. No
        root is involved, so the data path outlives a dead root.

        **Only what the trust bundle grants this node is minted.**
        `sub: gateway` to another machine needs this node's `gateway`
        grant, which the operator gave at enrollment. Any other `sub`
        cannot leave this machine and is refused with 403: a driver's or
        the library's token has no business anywhere else.

        Local callers only in practice, since the credential it takes is
        a local token. Nothing about that is assumed: the token is
        verified like any other.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServiceTokenRequest"
      responses:
        "200":
          description: Minted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceTokenResponse"
        "401":
          $ref: "components/common.yaml#/components/responses/Problem"
        "403":
          description: |
            The caller's `sub` may not be carried to that recipient by
            this node: no `gateway` grant, or a kind that never leaves
            its machine.
          content:
            application/problem+json:
              schema:
                $ref: "components/common.yaml#/components/schemas/Problem"

  # -------- client keys (hobbyist UX S4, 2026-09-15) --------

  /v1/auth/client-keys:
    get:
      tags: [auth]
      operationId: listClientKeys
      summary: The long-lived keys this install has minted for outside clients.
      description: |
        One record per key, newest first. **The token itself is not
        here** — it is returned once, by the POST that made it, and is
        not stored anywhere afterwards. What is stored is enough to tell
        two keys apart in a list: the name the operator gave it, the
        last few characters of the token, when it was made, when it
        expires, and whether it has been revoked.

        Operator-only. A service token may not read the list; the one
        thing a component needs from it is the revoked set, which has
        its own endpoint.
      responses:
        "200":
          description: The key records.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientKeyList"
        "401":
          $ref: "components/common.yaml#/components/responses/Problem"
    post:
      tags: [auth]
      operationId: createClientKey
      summary: Mint a long-lived key for an app outside this install.
      description: |
        Returns the bearer an OpenAI-compatible client presents to the
        gateway — Continue, Cline, Open WebUI, SillyTavern, the OpenAI
        SDK, `curl`. An `ep-client+jwt` signed by the install's
        authority (the control root when enrolled, which is where this
        forwards), addressed to `gateway`, which **only the gateway's
        OpenAI-compatible paths accept**
        (`/v1/models`, `/v1/chat/completions`, `/v1/embeddings`). It
        opens no operator surface anywhere: this agent, the control
        root, the library and the gateway's own config and admin paths
        all refuse it.

        Until this endpoint the only bearer a person could give a
        harness was the **operator session token** — a credential that
        can do everything, shown in a diagnostic panel, and expired
        fourteen days after sign-in. A key per app, revocable one at a
        time, is what replaces it.

        **`token` is shown once.** The agent keeps the record, not the
        token: there is nothing to steal from the record file and
        nothing to re-read, so a lost key is re-minted rather than
        recovered.

        Any enrolled agent forwards management to the active control root using
        the caller's operator credential. Records and revocations are install-wide.
        An unenrolled agent owns a standalone registry. Existing records migrate
        automatically using the enrolled node identity; migration status is visible
        in the list response. Unavailable authorities return 503 for writes.

        Operator-only, and it is one of the few endpoints where that
        matters as much as it does on the trust root: a token minted
        here outlives every session.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientKeyCreateRequest"
      responses:
        "201":
          description: Minted. `token` will not be shown again.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientKeyCreated"
        "401":
          $ref: "components/common.yaml#/components/responses/Problem"
        "422":
          description: The name is empty, or the lifetime is out of range.
          content:
            application/problem+json:
              schema:
                $ref: "components/common.yaml#/components/schemas/Problem"

  /v1/auth/client-keys/policy:
    get:
      operationId: getClientKeyPolicy
      summary: Read bounded-age client authorization policy
      description: Operator or gateway service only. Enrolled agents relay the active control policy without renewing its timestamp; standalone agents issue local policy. Unavailable authorities return 503.
      responses:
        '200':
          description: Current authority policy; never an empty fallback on failure.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ClientKeyPolicy'}
        '503':
          $ref: 'components/common.yaml#/components/responses/Problem'

  /v1/auth/client-keys/revoked:
    get:
      tags: [auth]
      operationId: listRevokedClientKeys
      summary: The ids of client keys that must no longer be accepted.
      description: |
        Compatibility endpoint for older gateways. Enrolled agents return the
        active control root's revoked identifiers. New gateways use /policy,
        which also registers permitted identifiers and bounds cache age.
        An operator session, or a `gateway` service token. No empty fallback on authority failure.
      responses:
        "200":
          description: The revoked ids.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientKeyRevocations"
        "401":
          $ref: "components/common.yaml#/components/responses/Problem"

  /v1/auth/client-keys/{id}:
    delete:
      tags: [auth]
      operationId: revokeClientKey
      summary: Revoke one client key.
      description: |
        The record stays, marked revoked with a timestamp, until the
        key's own expiry passes — a list that forgets what was revoked
        cannot tell "this key was never made here" from "this key was
        turned off".

        New gateways refresh every 15 seconds, with a 4-second request timeout.
        During outages their last policy expires after 60 seconds (up to five
        seconds of clock tolerance); client access then fails closed. Known
        revocations remain denied after restart. Upgrade every gateway and agent
        before relying on this bound.

        Revoking a key nobody still holds the token for is the normal
        case: the record's `id` identifies it, and the token was shown
        once.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Revoked, or already revoked — both are 204.
        "401":
          $ref: "components/common.yaml#/components/responses/Problem"
        "404":
          description: No key with that id in the authoritative registry.
          content:
            application/problem+json:
              schema:
                $ref: "components/common.yaml#/components/schemas/Problem"

  /v1/components:
    get:
      tags: [components]
      operationId: listComponents
      summary: List supervised components with their declared topology and live status.
      description: |
        Returns one entry per component the agent knows about,
        combining the declarative topology (what the operator asked
        for) with operational state (what the agent observes
        right now).
      responses:
        "200":
          description: Component list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComponentList"
    post:
      tags: [components]
      operationId: createComponent
      summary: Add a new component to the topology.
      description: |
        Used by the first-run wizard's "+ Add another driver" flow and
        by the post-setup Components tab. The agent scaffolds the
        component's own config file at `spawn.configFile` if it doesn't
        exist, then begins supervising. For a `remote` entry no file is
        scaffolded — the agent only monitors reachability.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ComponentEntry"
      responses:
        "201":
          description: Component added; supervision started.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Component"
        "400":
          $ref: "components/common.yaml#/components/responses/Problem"
        "409":
          description: A component with this name already exists.
          content:
            application/problem+json:
              schema:
                $ref: "components/common.yaml#/components/schemas/Problem"

  /v1/components/{name}:
    parameters:
      - in: path
        name: name
        required: true
        schema:
          type: string
        description: Operator-supplied component name (e.g. `left`, `right`, `gateway`).
    get:
      tags: [components]
      operationId: getComponent
      summary: Read one component's topology entry plus current status.
      responses:
        "200":
          description: Component details.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Component"
        "404":
          $ref: "components/common.yaml#/components/responses/Problem"
    patch:
      tags: [components]
      operationId: updateComponent
      summary: Modify a component's topology entry.
      description: |
        Partial update. Changes that affect the running process
        (spawn.configFile, url's port, safeMode) trigger a restart of
        that component once the patch is applied — the agent's
        respawn loop sees the new desired state and reconciles.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ComponentEntry"
      responses:
        "200":
          description: Updated component.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Component"
        "400":
          $ref: "components/common.yaml#/components/responses/Problem"
        "404":
          $ref: "components/common.yaml#/components/responses/Problem"
    delete:
      tags: [components]
      operationId: deleteComponent
      summary: Remove a component from the topology.
      description: |
        SIGTERMs the spawned process (if local) and removes the entry
        from `agent.yaml`. The component's own config file is left
        on disk so re-adding by the same name picks up where it left
        off.
      responses:
        "204":
          description: Component removed.
        "404":
          $ref: "components/common.yaml#/components/responses/Problem"

  /v1/components/{name}/restart:
    parameters:
      - in: path
        name: name
        required: true
        schema:
          type: string
    post:
      tags: [components]
      operationId: restartComponent
      summary: Restart one supervised component.
      description: |
        For a spawned component the agent SIGTERMs it (with a brief
        timeout, then SIGKILL) and respawns with the current desired
        state — picking up any config changes made via PATCH. The first-
        run wizard's "Start" step calls this once per component to
        flip them out of safe mode after their real config is in place.

        For a `remote` component this returns `409 Conflict`: the
        agent cannot restart something it does not own.
      responses:
        "202":
          description: Restart scheduled.
          content:
            application/json:
              schema:
                $ref: "components/common.yaml#/components/schemas/RestartResult"
        "404":
          $ref: "components/common.yaml#/components/responses/Problem"
        "409":
          description: Component is remote and cannot be restarted by the agent.
          content:
            application/problem+json:
              schema:
                $ref: "components/common.yaml#/components/schemas/Problem"

  # -------- engines: what we know how to start --------

  /v1/engines:
    get:
      tags: [engines]
      operationId: listEngines
      summary: Report every engine adapter, and whether a usable binary is present.
      description: |
        An engine is supported only when an adapter exists for it,
        because the adapter is the thing that knows how to build the
        argv, what readiness means, and which flags are worth exposing.
        This endpoint is what the UI reads to render the "add a runtime"
        form: `flagSchema` is a standard `ConfigSchema`, so the same
        generic config editor that edits every component's settings also
        edits engine flags. No engine-specific UI code.

        `available: false` means the adapter exists but no binary was
        found. `acquisition` then says whether one can be fetched for
        this host and which build would be chosen — or, when it cannot,
        why not, which is a real answer on Linux with an NVIDIA GPU
        because upstream publishes no CUDA build for it.

        Not every engine is one we install. `acquisition.policy` says
        which kind this is, and for a `manual` engine — vLLM, a Python
        package in the operator's own environment — `manualInstall`
        carries the command for the detected host and `python` describes
        the environment that was found. So this endpoint renders three
        different panels from one shape: install it, here is why we
        cannot, and here is how you do it yourself.

        Note what `available` does and does not mean: it answers "is a
        binary discoverable on this host" — by managed install, by an
        install-wide configured path, or on PATH. A runtime carrying an
        explicit `binary` bypasses discovery entirely and will run
        happily against an engine reported here as unavailable.
      responses:
        "200":
          description: Known engine adapters.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EngineList"

  /v1/engines/{engine}/install:
    parameters:
      - in: path
        name: engine
        required: true
        schema:
          $ref: "components/common.yaml#/components/schemas/EngineKind"
    post:
      tags: [engines]
      operationId: installEngine
      summary: Fetch, verify and unpack an engine build.
      description: |
        Starts an install and returns immediately — the download is
        hundreds of megabytes and nothing useful comes of holding a
        request open for it. Poll the GET on this path for progress.

        One install runs per engine at a time, which is why this is a
        singleton sub-resource and not a job collection: nobody is
        installing two llama.cpp builds concurrently, and pretending
        otherwise would mean inventing job ids for something that has
        exactly one.

        The build lands in its own versioned directory and only becomes
        the engine's binary once it has verified and unpacked. An
        install never overwrites a build in place — a runtime may be
        executing one right now.

        Returns 409 when an install is already running, and 422 when
        this host has no installable build (see
        `EngineAcquisition.reason`).

        **An engine with `acquisition.policy: manual` always returns
        422**, on every host, because we do not install that engine at
        all — its unit of installation is a Python environment rather
        than a verifiable asset. The 422's `detail` carries
        `manualInstall`'s command and docs URL, so a client that reached
        here anyway still learns the way forward. A UI should read
        `policy` and render instructions instead of an install button,
        rather than discovering this by calling.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EngineInstallRequest"
      responses:
        "202":
          description: Install accepted and running.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EngineInstall"
        "401":
          $ref: "components/common.yaml#/components/responses/Problem"
        "409":
          description: An install is already in flight for this engine.
          content:
            application/problem+json:
              schema:
                $ref: "components/common.yaml#/components/schemas/Problem"
        "422":
          description: Nothing installable for this host.
          content:
            application/problem+json:
              schema:
                $ref: "components/common.yaml#/components/schemas/Problem"
    get:
      tags: [engines]
      operationId: getEngineInstall
      summary: Progress of the current or most recent install.
      description: |
        The terminal states (`done`, `failed`, `cancelled`) persist until
        the next install starts, so a UI that reconnects after the fact
        still learns how it ended rather than finding an empty slot and
        assuming success.
      responses:
        "200":
          description: Install state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EngineInstall"
        "401":
          $ref: "components/common.yaml#/components/responses/Problem"
        "404":
          description: No install has ever been started for this engine.
          content:
            application/problem+json:
              schema:
                $ref: "components/common.yaml#/components/schemas/Problem"
    delete:
      tags: [engines]
      operationId: cancelEngineInstall
      summary: Cancel an install in flight.
      description: |
        Stops the download and removes the partial directory. A build
        that already finished is untouched — this cancels an install,
        it does not uninstall an engine.
      responses:
        "200":
          description: Cancelled; the state reflects it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EngineInstall"
        "401":
          $ref: "components/common.yaml#/components/responses/Problem"
        "409":
          description: Nothing in flight to cancel.
          content:
            application/problem+json:
              schema:
                $ref: "components/common.yaml#/components/schemas/Problem"

  # -------- apps: optional spokes this agent installs and supervises --------

  /v1/apps:
    get:
      tags: [apps]
      operationId: listApps
      summary: The apps installed on this node, with their live status.
      description: |
        One entry per installed app. An app is not a component: it holds
        a client key and nothing else, runs from its own Python
        environment, and reaches the hub the way any outside client does.
        See the `apps` tag and `docs/design/apps-and-spokes.md`.
      responses:
        "200":
          description: Installed apps.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppList"
        "401":
          $ref: "components/common.yaml#/components/responses/Problem"

  /v1/app-catalogue:
    get:
      tags: [apps]
      operationId: getAppCatalogue
      summary: The apps this node can install, and whether it can install any.
      description: |
        The catalogue shipped with this agent release plus any custom
        entries the operator added on this node. A new app in a later
        release is a new row here; the agent needs no new code for it.

        `installable: false` is a real answer with `reason` saying what to
        do: this agent cannot find `uv`, or has not enrolled (an agent
        that has not enrolled signs with a key that changes at every
        start, so an app's key would stop working at the next restart).
      responses:
        "200":
          description: The catalogue.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppCatalogue"
        "401":
          $ref: "components/common.yaml#/components/responses/Problem"

  /v1/app-catalogue/custom:
    post:
      tags: [apps]
      operationId: addCustomApp
      summary: Add an app that is not in the shipped catalogue.
      description: |
        Operator-only, and **refused with 403 until the agent's
        `allowCustomApps` setting is on** — the same expert-switch posture
        as `allowUnrestrictedEngineLaunch`, for the same reason: it runs
        code this release did not ship. The entry is stored on this node
        and installed like any other; it is how a spoke somebody else
        wrote gets the same supervision ours do. **Installing it runs its code as the user
        this agent runs as, holding the client key minted for it** — a UI
        must say so before the operator confirms.

        409 when an entry with this `id` already exists, shipped or custom;
        422 when `source` is neither an archive URL nor an existing folder
        on this node.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppManifest"
      responses:
        "201":
          description: Added to this node's catalogue.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppCatalogueEntry"
        "401":
          $ref: "components/common.yaml#/components/responses/Problem"
        "403":
          $ref: "components/common.yaml#/components/responses/Problem"
        "409":
          $ref: "components/common.yaml#/components/responses/Problem"
        "422":
          $ref: "components/common.yaml#/components/responses/Problem"

  /v1/app-catalogue/custom/{id}:
    parameters:
      - $ref: "#/components/parameters/AppId"
    delete:
      tags: [apps]
      operationId: removeCustomApp
      summary: Remove a custom entry from this node's catalogue.
      description: |
        409 while the app is installed — uninstall it first, so an entry
        is never removed from under something still running from it.
      responses:
        "204":
          description: Removed.
        "401":
          $ref: "components/common.yaml#/components/responses/Problem"
        "404":
          $ref: "components/common.yaml#/components/responses/Problem"
        "409":
          $ref: "components/common.yaml#/components/responses/Problem"

  /v1/apps/{id}:
    parameters:
      - $ref: "#/components/parameters/AppId"
    get:
      tags: [apps]
      operationId: getApp
      summary: One installed app.
      responses:
        "200":
          description: The app.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/App"
        "401":
          $ref: "components/common.yaml#/components/responses/Problem"
        "404":
          $ref: "components/common.yaml#/components/responses/Problem"
    delete:
      tags: [apps]
      operationId: uninstallApp
      summary: Stop an app, revoke its key and remove its environments.
      description: |
        Revoking the key is part of uninstalling, not a separate step: an
        app that is gone must not leave a working credential behind. The
        app's `data` directory is kept unless `purge` is true, so an
        uninstall followed by a reinstall picks up where it left off.

        The key is revoked at whoever holds the registry — the control
        root on an enrolled node — with the caller's own credential. If
        that revocation fails the uninstall stops with the authority's
        answer and nothing has been removed.
      parameters:
        - in: query
          name: purge
          required: false
          schema:
            type: boolean
            default: false
          description: Also delete the app's `data` directory.
      responses:
        "204":
          description: Uninstalled.
        "401":
          $ref: "components/common.yaml#/components/responses/Problem"
        "404":
          $ref: "components/common.yaml#/components/responses/Problem"
        "503":
          $ref: "components/common.yaml#/components/responses/Problem"

  /v1/apps/{id}/install:
    parameters:
      - $ref: "#/components/parameters/AppId"
    post:
      tags: [apps]
      operationId: installApp
      summary: Install, or update to, the catalogue's version of an app.
      description: |
        Returns immediately; poll the GET on this path. One install runs
        per app, the same singleton shape as an engine install.

        The version installed is the one the catalogue names — there is
        no version in the request, because an app's version is pinned by
        the release that ships it (or by the operator's custom entry).
        Installing a version beside an installed one is how an update
        works: the new environment is built, verified and moved into
        place while the old one keeps running, then the app restarts on
        the new one. The previous environment is kept for rollback.

        On a first install the agent mints the app's client key with the
        **caller's** credential, named `app:<id>@<node>`, so it appears in
        the install's key list like any other and can be narrowed or
        revoked there.

        403 for a custom entry while `allowCustomApps` is off; 409 when an
        install is in flight or that version is already installed; 422
        when this node cannot install apps (`AppCatalogue.reason`).
      responses:
        "202":
          description: Install accepted and running.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppInstall"
        "401":
          $ref: "components/common.yaml#/components/responses/Problem"
        "403":
          $ref: "components/common.yaml#/components/responses/Problem"
        "404":
          $ref: "components/common.yaml#/components/responses/Problem"
        "409":
          $ref: "components/common.yaml#/components/responses/Problem"
        "422":
          $ref: "components/common.yaml#/components/responses/Problem"
    get:
      tags: [apps]
      operationId: getAppInstall
      summary: Progress of the current or most recent install of this app.
      responses:
        "200":
          description: Install state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppInstall"
        "401":
          $ref: "components/common.yaml#/components/responses/Problem"
        "404":
          $ref: "components/common.yaml#/components/responses/Problem"
    delete:
      tags: [apps]
      operationId: cancelAppInstall
      summary: Cancel an install in flight.
      responses:
        "200":
          description: Cancelled; the state reflects it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppInstall"
        "401":
          $ref: "components/common.yaml#/components/responses/Problem"
        "409":
          $ref: "components/common.yaml#/components/responses/Problem"

  /v1/apps/{id}/start:
    parameters:
      - $ref: "#/components/parameters/AppId"
    post:
      tags: [apps]
      operationId: startApp
      summary: Start an installed app, and keep it started across restarts.
      responses:
        "200":
          description: The app.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/App"
        "401":
          $ref: "components/common.yaml#/components/responses/Problem"
        "404":
          $ref: "components/common.yaml#/components/responses/Problem"

  /v1/apps/{id}/stop:
    parameters:
      - $ref: "#/components/parameters/AppId"
    post:
      tags: [apps]
      operationId: stopApp
      summary: Stop an installed app, and keep it stopped across restarts.
      responses:
        "200":
          description: The app.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/App"
        "401":
          $ref: "components/common.yaml#/components/responses/Problem"
        "404":
          $ref: "components/common.yaml#/components/responses/Problem"

  /v1/apps/{id}/restart:
    parameters:
      - $ref: "#/components/parameters/AppId"
    post:
      tags: [apps]
      operationId: restartApp
      summary: Restart an installed app.
      description: Clears a `crashed` state, like restarting a component.
      responses:
        "200":
          description: The app.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/App"
        "401":
          $ref: "components/common.yaml#/components/responses/Problem"
        "404":
          $ref: "components/common.yaml#/components/responses/Problem"
        "409":
          $ref: "components/common.yaml#/components/responses/Problem"

  /v1/apps/{id}/config:
    parameters:
      - $ref: "#/components/parameters/AppId"
    get:
      tags: [apps]
      operationId: getAppConfig
      summary: Read an app's own settings, through this agent.
      description: |
        For an app whose manifest declares `configTrio: true`. The agent
        checks the operator's session and calls the app's own
        `GET /v1/config` on loopback with the **admin token** it handed
        the app at this spawn — a credential that means something to that
        app and nothing to the hub. So the operator never talks to an app
        directly with a hub credential, and a console on any node reaches
        it through `node:<name>`.

        409 when the app declares no config trio; 503 when it is not
        answering.
      responses:
        "200":
          description: The app's config document.
          content:
            application/json:
              schema:
                $ref: "components/common.yaml#/components/schemas/ConfigDocument"
        "401":
          $ref: "components/common.yaml#/components/responses/Problem"
        "404":
          $ref: "components/common.yaml#/components/responses/Problem"
        "409":
          $ref: "components/common.yaml#/components/responses/Problem"
        "503":
          $ref: "components/common.yaml#/components/responses/Problem"
    patch:
      tags: [apps]
      operationId: updateAppConfig
      summary: Change an app's own settings, through this agent.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "components/common.yaml#/components/schemas/ConfigUpdateRequest"
      responses:
        "200":
          description: The app's answer.
          content:
            application/json:
              schema:
                $ref: "components/common.yaml#/components/schemas/ConfigUpdateResult"
        "400":
          $ref: "components/common.yaml#/components/responses/Problem"
        "401":
          $ref: "components/common.yaml#/components/responses/Problem"
        "404":
          $ref: "components/common.yaml#/components/responses/Problem"
        "409":
          $ref: "components/common.yaml#/components/responses/Problem"
        "503":
          $ref: "components/common.yaml#/components/responses/Problem"

  /v1/apps/{id}/config/schema:
    parameters:
      - $ref: "#/components/parameters/AppId"
    get:
      tags: [apps]
      operationId: getAppConfigSchema
      summary: An app's own config schema, through this agent.
      responses:
        "200":
          description: The app's config schema.
          content:
            application/json:
              schema:
                $ref: "components/common.yaml#/components/schemas/ConfigSchema"
        "401":
          $ref: "components/common.yaml#/components/responses/Problem"
        "404":
          $ref: "components/common.yaml#/components/responses/Problem"
        "409":
          $ref: "components/common.yaml#/components/responses/Problem"
        "503":
          $ref: "components/common.yaml#/components/responses/Problem"

  # -------- runtimes: engine processes we supervise --------

  /v1/benchmarks:
    get:
      tags: [runtimes]
      operationId: listBenchmarks
      summary: Recent profile benchmarks on this node.
      description: Operator-only. Retains the latest 20 jobs across agent restarts.
      responses:
        "200":
          description: Newest first, including the active job.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BenchmarkList"
    post:
      tags: [runtimes]
      operationId: startBenchmark
      summary: Measure single-sequence decode speed at increasing context depth.
      description: |
        Operator-only. Uses the installed llama-bench beside the selected
        llama.cpp server, with the saved profile copied into the request.
        Requires every runtime on the node to be stopped. Does not stop models,
        install engines, download files, change profiles or change fit estimates.
        While active, runtime create/update/start/restart requests return 409.
        Depths are zero, half of the available context, and context minus
        generated tokens. Results exclude tokenization and sampling. Unsupported
        settings are refused rather than silently ignored. One job per node;
        fifteen-minute time limit. Agent restart marks unfinished jobs failed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BenchmarkRequest"
      responses:
        "202":
          description: Accepted; poll the node's benchmark list for progress.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Benchmark"
        "400":
          description: Unsupported profile, engine, context or benchmark binary.
        "409":
          description: A benchmark or runtime is active on this node.
        "422":
          description: Model unavailable or memory admission refused.

  /v1/benchmarks/{id}/cancel:
    post:
      tags: [runtimes]
      operationId: cancelBenchmark
      summary: Stop an active benchmark and retain its partial results.
      description: Operator-only. Idempotent for a finished job. Releases the node only after its child exits.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Stopped or already finished.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Benchmark"
        "404":
          description: Job not found on this node.

  /v1/runtimes:
    get:
      tags: [runtimes]
      operationId: listRuntimes
      summary: What is running, where, with which model, and what it can do.
      description: |
        The runtime dashboard's source of truth, and how the operator
        answers "is my model loaded yet". Each entry pairs the
        declarative half (what the operator asked for) with the observed
        half — status, pid, the resolved `argv`, the engine's own
        version, and the capabilities read back off the running engine.

        Includes runtimes that are not currently up: a `stopped` or
        `crashed` runtime is still declared, and hiding it would make
        the dashboard lie.
      responses:
        "200":
          description: Every declared runtime.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuntimeList"
    post:
      tags: [runtimes]
      operationId: createRuntime
      summary: Declare a new engine runtime, and the driver that fronts it.
      description: |
        Persists the runtime to the agent's topology and spawns it
        immediately unless `autoStart` is false. `flags` are validated
        against the engine adapter's `flagSchema`; unknown keys are
        rejected rather than silently dropped, because a typo'd flag
        that vanishes is much worse than one that errors.

        **Launch ends with a routable model.** Unless `autoDriver` is
        false, the agent also declares a companion `inference-driver`
        component named `<name>-driver`, configured with
        `runtimeName: <name>` and `modelId: <alias>`, spawns it, and
        keeps the two together: deleting the runtime deletes the
        driver, renaming it renames the driver, and changing the alias
        re-targets it. The runtime is persisted first — its port is
        assigned at write time — so the driver's lookup of the runtime
        succeeds regardless of the engine's state. M2 named this gap,
        M4 taught a driver to follow a runtime by name, and this is the
        step that creates one. `Runtime.driver` reports the companion.

        **A launch that will not fit is refused before it spawns.** When
        `autoStart` is true the spec is measured against the free memory
        of the device(s) it targets, and a `refuse` decision is a 422
        carrying the arithmetic — required bytes, free bytes, the device,
        and which runtimes hold the memory. `?force=true` declares it
        anyway, because the estimate is an estimate and the model is the
        operator's. `POST /v1/runtimes/admission` is the same measurement
        without the declaration. A runtime declared with `autoStart`
        false is not measured until it is started.

        **A launch of a model that is not on this host is refused the
        same way** (M11). `modelPath` is resolved through the Library
        folder's `mounts` for this host's OS and this node's
        `pathMappings` overrides — the library on another host names
        files by *its* path, and the folder says where the same
        directory is mounted here — and if the resolved path does not
        exist, the 422's `detail` names the declared path, this node,
        what it resolved to, and where the rule goes. Before M11 this
        case was accepted, given a companion driver, and crashed on
        spawn.

        **A model that is under no Library folder is refused before any
        of that, as a 400** (2026-09-14). A node runs only what the
        Library catalogues: `modelPath` must lie under the `path` of a
        `LibraryFolder` in the library's `modelRoots`, matched by path
        components with the folder's own shape choosing the rules. The
        400's `detail` names the path and the remedy — add the directory
        that holds it to the Library, then scan. `force` does not
        bypass this; the override is one action away and is not a flag.
        Whether the library has *scanned* the model is not checked — a
        folder just added launches, and admission measures by file size
        as it always has. When this node has never been able to read the
        library's folder list (a worker in its first minute, a library
        that has not started), the check is skipped with a warning
        rather than refusing every launch, and
        `POST /v1/library/folders/check` says `libraryConsulted: false`.

        Accepts the operator **or a service token from the control root
        itself** (`sub: control`, `iss: control`, addressed to this
        node), because the control root forwards declarations to the
        node that will run them (`control.yaml`, `POST /v1/runtimes`) and
        the trust root's token is what every other credential in the
        install reduces to. A leaked driver or library token still cannot
        declare a runtime; the other mutations here stay operator-only.
      parameters:
        - in: query
          name: force
          required: false
          schema:
            type: boolean
            default: false
          description: |
            Declare and spawn even when admission says the model will
            not fit. An explicit choice with a name; the refusal it
            overrides named its numbers.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RuntimeSpec"
      responses:
        "201":
          description: Runtime declared.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Runtime"
        "400":
          description: |
            Invalid spec — unknown engine, no adapter, a flag that
            isn't in the adapter's schema, or a port already claimed by
            another runtime — **or a `modelPath` under no Library
            folder** (`model-not-in-library`, 2026-09-14; `detail`
            names the path and says to add its directory to the
            Library). **Not** a model path that does not exist: that is
            an admission refusal (422, below), because it is decided by
            the same dry run and carries the same structure — until M11
            nothing checked it at all, and a launch of a path this host
            did not have was accepted and crashed.
          content:
            application/problem+json:
              schema:
                $ref: "components/common.yaml#/components/schemas/Problem"
        "409":
          description: |
            A runtime with that name already exists — or a component
            already holds the companion driver's name `<name>-driver`
            and is not a companion, in which case `detail` names both.
          content:
            application/problem+json:
              schema:
                $ref: "components/common.yaml#/components/schemas/Problem"
        "422":
          description: |
            Admission refused: the model will not fit on the device(s)
            this spec targets — **or is not on this host at all** (M11:
            `modelPath`, after this node's `pathMappings`, names nothing
            here) — and `force` was not set. `detail` carries the
            `Admission` reasoning in prose, naming the fix; `POST
            /v1/runtimes/admission` returns it structured, with the
            resolved `location`.
          content:
            application/problem+json:
              schema:
                $ref: "components/common.yaml#/components/schemas/Problem"

  /v1/runtimes/admission:
    post:
      tags: [runtimes]
      operationId: checkAdmission
      summary: Would this runtime fit on the device it targets, right now?
      description: |
        The dry run behind `POST /v1/runtimes` and `POST
        /v1/runtimes/{name}/start`. Takes a `RuntimeSpec`, measures it
        against the live free memory of the device(s) its `env` pins it
        to (`CUDA_VISIBLE_DEVICES`, `HIP_VISIBLE_DEVICES`; every device
        of the detected kind when unset), and returns a decision with
        its arithmetic. Declares nothing and spawns nothing.

        Required bytes come from the library's fit computation when a
        library is reachable — one in this agent's topology, or (M11)
        the install's, found through the control root the way the
        console hop finds it, so a worker with no library of its own is
        measured by metadata too — the same arithmetic the discovery
        screen shows, at the context this spec asks for; and from the
        model file's size plus a fixed allowance otherwise. `basis` says
        which. Free bytes are the largest single target device's,
        because llama.cpp's default split is by layers and a model that
        fits across two cards and on neither is `split`, not `fits`.

        **It also answers whether the model is here at all.** `location`
        carries `modelPath` resolved through this node's `pathMappings`,
        whether that path exists on this host, and — when the library
        answered — whether the file is the size the library says it is.
        A model that is not here is `refuse` with `fit: unknown`: the
        rule that `unknown` never refuses is about a budget that could
        not be measured, and a file that is not there is a measurement.
        A size that disagrees with the library is a warning, not a
        refusal — a stale scan is likelier than a wrong mapping, and the
        engine will say if the file is broken.

        **Refuse, never queue** (decided 2026-09-10). A queue is a
        promise about when memory frees that the control plane cannot
        keep; the on-demand path (`RuntimeSpec.startOnDemand`, driven by
        the gateway) is how a model that does not fit right now gets
        loaded when it is actually asked for. `unknown` never refuses:
        a verdict computed from a budget that could not be measured is
        worse than no verdict, and three detection paths are unverified
        on real hardware.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RuntimeSpec"
      responses:
        "200":
          description: The decision and what it was computed from. Returned for admit and refuse alike.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Admission"
        "400":
          $ref: "components/common.yaml#/components/responses/Problem"

  /v1/runtimes/{name}:
    parameters:
      - in: path
        name: name
        required: true
        schema:
          type: string
    get:
      tags: [runtimes]
      operationId: getRuntime
      summary: Read one runtime.
      responses:
        "200":
          description: The runtime.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Runtime"
        "404":
          $ref: "components/common.yaml#/components/responses/Problem"
    patch:
      tags: [runtimes]
      operationId: updateRuntime
      summary: Modify a runtime's declaration.
      description: |
        Partial update. Every field here is baked into the argv at
        spawn time, so any change to a running runtime restarts it —
        there is no way to re-flag a live `llama-server`. The response
        reports the post-restart state, which will normally be
        `starting` or `loading` rather than `ready`. A `modelPath`
        under no Library folder is refused exactly as on create (400
        `model-not-in-library`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RuntimeSpec"
      responses:
        "200":
          description: Updated runtime.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Runtime"
        "400":
          $ref: "components/common.yaml#/components/responses/Problem"
        "404":
          $ref: "components/common.yaml#/components/responses/Problem"
    delete:
      tags: [runtimes]
      operationId: deleteRuntime
      summary: Stop a runtime and remove it from the topology.
      description: |
        Terminates the engine process and drops the entry. **The model
        file is never touched.** Removing a runtime un-declares a way of
        serving a model; it does not delete anything the user owns.
      responses:
        "204":
          description: Runtime removed.
        "404":
          $ref: "components/common.yaml#/components/responses/Problem"

  /v1/runtimes/{name}/restart:
    parameters:
      - in: path
        name: name
        required: true
        schema:
          type: string
    post:
      tags: [runtimes]
      operationId: restartRuntime
      summary: Restart one engine process.
      description: |
        Terminates the engine (brief timeout, then kill) and respawns it
        with the current declaration. Also clears the crash counter, so
        this is how an operator retries a `crashed` runtime after fixing
        whatever was wrong. Expect the model load to be paid again.
      responses:
        "202":
          description: Restart scheduled.
          content:
            application/json:
              schema:
                $ref: "components/common.yaml#/components/schemas/RestartResult"
        "404":
          $ref: "components/common.yaml#/components/responses/Problem"

  /v1/runtimes/{name}/stop:
    parameters:
      - in: path
        name: name
        required: true
        schema:
          type: string
    post:
      tags: [runtimes]
      operationId: stopRuntime
      summary: Stop an engine process without un-declaring it.
      description: |
        Terminates the engine and suppresses the respawn loop, leaving
        the runtime declared with `status: stopped`. This exists because
        an engine holds GPU memory: an operator who wants the VRAM back
        for something else needs a stop that is not a delete and not a
        crash. Start it again with `POST .../start`.

        **Accepts the operator or a `gateway` service token** addressed
        to this node: from this machine's own gateway, or from a node the
        trust bundle grants `gateway`.
        The gateway is the component that sees demand, so it is the one
        that unloads an idle runtime; it says so in the body, and the
        agent reports it back as `Runtime.stopReason: idle` so a
        dashboard can explain a stopped model rather than just show
        one. A leaked driver or library token still cannot stop an
        engine.

        The companion driver, if any, keeps running: it is cheap, and a
        driver that still answers `/v1/info` for a stopped engine is
        what lets the gateway keep listing an on-demand model.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StopRequest"
      responses:
        "202":
          description: Stop scheduled.
          content:
            application/json:
              schema:
                $ref: "components/common.yaml#/components/schemas/RestartResult"
        "404":
          $ref: "components/common.yaml#/components/responses/Problem"

  /v1/runtimes/{name}/start:
    parameters:
      - in: path
        name: name
        required: true
        schema:
          type: string
    post:
      tags: [runtimes]
      operationId: startRuntime
      summary: Start a stopped engine process.
      description: |
        Spawns a runtime that is `stopped` or `crashed`. A no-op that
        still returns 202 if it is already coming up or ready, so the
        UI's Start button is idempotent.

        Measured against the target device's free memory first, exactly
        as `POST /v1/runtimes` is, and refused with 422 when the model
        will not fit — this is where a runtime declared with `autoStart`
        false meets admission. `?force=true` starts it anyway.

        Accepts the operator or a `gateway` service token, because the
        gateway is what starts a
        `startOnDemand` runtime when a request arrives for its model.
      parameters:
        - in: query
          name: force
          required: false
          schema:
            type: boolean
            default: false
          description: Start even when admission says the model will not fit.
      responses:
        "202":
          description: Start scheduled.
          content:
            application/json:
              schema:
                $ref: "components/common.yaml#/components/schemas/RestartResult"
        "404":
          $ref: "components/common.yaml#/components/responses/Problem"
        "422":
          description: |
            Admission refused and `force` was not set. `detail` carries
            the arithmetic.
          content:
            application/problem+json:
              schema:
                $ref: "components/common.yaml#/components/schemas/Problem"

  # -------- this node --------

  /v1/node:
    get:
      tags: [node]
      operationId: getNode
      summary: What this host is, and which control root it answers to.
      description: |
        One agent, one host. This is how the control root learns what a
        node *is* — accelerators included — and how anything else
        discovers which control root this node recognises.

        `epoch` is the highest control-root generation this agent has
        acknowledged, and the agent **refuses any root presenting a
        lower one**. That refusal is the whole fencing mechanism: a
        superseded control root cannot command a node that has already
        heard from its successor, with no election and no agreement
        between agents required. See `control.yaml`.

        Present before enrollment too, with `enrolled: false` and no
        control root — an agent supervises local processes perfectly well
        with no trust relationship at all, which is what makes the
        bootstrap order work and is consistent with the standing
        degraded-mode rule.

        `advertiseUrl` is where *other hosts* reach this agent: the
        `advertiseUrl` config field when the operator set one, otherwise
        derived at enrollment from the interface this agent used to reach
        the control root plus its own bind port. It is what the agent sent
        the control root as the node's URL, reported here so a wrong guess
        is visible and overridable.

        `reach` answers the separate question *can anything else on the
        network get here at all* — what each process is actually
        listening on, what the host firewall says about those ports, and
        whether the address this node would advertise differs from the
        one it is bound to. It is evidence rather than a setting; the
        setting is `POST /v1/node/reach`.
      responses:
        "200":
          description: This node.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NodeIdentity"

  /v1/node/enroll:
    post:
      tags: [node]
      operationId: enrollWithControl
      summary: Join an install by presenting a join token to a control root.
      description: |
        Operator-only, and the one call that gives this agent a place in
        an install. It generates the node's identity keypair if it has
        none, then calls the control root's `POST /v1/nodes/enroll` with
        the join token, its **public** key, and the URL at which other
        hosts reach this agent (`NodeIdentity.advertiseUrl`).

        The private key never leaves this host. That is not a detail:
        per-node sealing means a secret is sealed to this key, so a
        control root that could obtain it would be a control root that
        could read every node's secrets — which is exactly the blast
        radius the design refuses.

        Returns 409 if already enrolled. Re-enrolling elsewhere is a
        deliberate act: revoke at the old control root first, so this
        node's key leaves that install's trust bundle.

        The body the root returns carries a trust bundle that already
        lists this node's key. The agent pins the root's identity key,
        stores the bundle, and restarts every supervised component so
        they verify against it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnrollRequest"
      responses:
        "200":
          description: Enrolled; the resulting identity.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NodeIdentity"
        "400":
          $ref: "components/common.yaml#/components/responses/Problem"
        "401":
          $ref: "components/common.yaml#/components/responses/Problem"
        "409":
          description: Already enrolled with a control root.
          content:
            application/problem+json:
              schema:
                $ref: "components/common.yaml#/components/schemas/Problem"
        "502":
          description: The control root refused or was unreachable.
          content:
            application/problem+json:
              schema:
                $ref: "components/common.yaml#/components/schemas/Problem"

  /v1/node/unenroll:
    post:
      tags: [node]
      operationId: unenrollNode
      summary: Leave an install — forget its trust bundle and become standalone again.
      description: |
        Operator-only, and the exact inverse of `POST /v1/node/enroll`.
        The agent discards the install's trust bundle, the epoch, the
        control root's URL and identity, becomes its own authority
        again, and restarts every supervised component so they pick
        that up. **Its runtimes stay declared and its model files are
        untouched** — only routing stops, which is already the
        documented consequence of revocation.

        **Why this is safe to allow locally.** The install stops
        trusting this node when the root drops its key, which is what
        `DELETE /v1/nodes/{name}` does. Un-enrolling only makes this node
        stop trusting the install. A node cannot escape revocation by
        un-enrolling; it can only disarm itself.

        **It proceeds when the control root is unreachable**, per the
        standing degraded-mode rule: an operator detaching a node from a
        dead install is precisely the case where refusing is useless.
        When the root *is* reachable the agent calls
        `DELETE /v1/nodes/{name}` there first, forwarding the caller's
        own operator session, which is addressed to the root as well as
        to this machine. That drops this node's key from the bundle every
        other machine holds, which is the whole point of revoking rather
        than deleting. `controlNotified` reports whether it happened;
        `false` means the operator still owes the root a revocation.

        **This logs out every session on this node**, exactly as
        enrollment does and for the same reason: the authority those
        sessions were signed by is no longer trusted here.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UnenrollRequest"
      responses:
        "200":
          description: |
            Un-enrolled. Read `controlNotified` before assuming the
            install is clean.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnenrollResult"
        "401":
          $ref: "components/common.yaml#/components/responses/Problem"
        "409":
          description: This agent is not enrolled, so there is nothing to leave.
          content:
            application/problem+json:
              schema:
                $ref: "components/common.yaml#/components/schemas/Problem"

  /v1/node/reach:
    post:
      tags: [node]
      operationId: setNodeReach
      summary: Let other devices on the network reach this machine, or stop them.
      description: |
        The one switch behind "Reach it from other devices". Turning it
        **on** writes a non-loopback `advertiseUrl` (the address this
        host would use on its own network, derived from the routing
        table, unless the caller supplies one), tells the control root
        if this node is enrolled, restarts the supervised components so
        they bind an interface other hosts can reach, and — when asked,
        and when the platform allows it — adds the host firewall rule.
        Turning it **off** is the exact inverse: the config field is
        cleared, components come back on loopback, and a firewall rule
        this agent added is removed.

        **It is a convenience over settings that remain settings.**
        Everything here can be done by hand through
        `PATCH /v1/config {"advertiseUrl": …}` plus the firewall command
        the card prints, and the config field stays the expert override
        that wins — including with a value that will not work
        (`easy-default-expert-override`). What this endpoint adds is
        doing the four steps in one order, and reporting which of them
        actually happened.

        ### The agent's own socket is the part that needs a restart

        Supervised components take their bind host from the environment
        at spawn, so restarting them is enough and this endpoint does
        it. **This agent's own listening socket is fixed for the life of
        the process**, so an agent that was started while the node
        advertised loopback keeps answering only on loopback until it is
        started again. That is reported rather than hidden:
        `NodeReach.restartRequired` is true until the socket and the
        setting agree, and `NodeReach.restart` says whether this agent
        can arrange its own restart and, when it cannot, the command a
        person runs.

        `restartAgent` asks for that restart. It is **not** the default:
        the browser making this call is talking to the process that
        would go away, and an agent that cannot come back takes the
        console with it. The response is sent before the restart begins.

        ### Turning it on does not make it reachable

        Binding an interface, advertising an address and being allowed
        through a firewall are three different things, and only the
        third is outside this process. The response carries the fresh
        `NodeReach`, so a caller can show the firewall verdict that
        still stands in the way. A verdict is never upgraded to
        `allowed` because we changed something; it is re-read.

        Operator-only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NodeReachRequest"
      responses:
        "200":
          description: |
            What was done, and the reach as it now stands. A step that
            could not be taken is named in `steps`, not raised as an
            error: adding a firewall rule can fail for reasons the rest
            of the change should not be rolled back for.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NodeReachResult"
        "400":
          description: |
            `enabled` is true, `url` was not given, and this host has no
            non-loopback address to propose.
          content:
            application/problem+json:
              schema:
                $ref: "components/common.yaml#/components/schemas/Problem"
        "401":
          $ref: "components/common.yaml#/components/responses/Problem"
        "422":
          description: The supplied `url` is not a URL, or is a loopback address.
          content:
            application/problem+json:
              schema:
                $ref: "components/common.yaml#/components/schemas/Problem"

  /v1/node/trust-bundle:
    post:
      tags: [node]
      operationId: pushTrustBundle
      summary: Take a newer trust bundle, or a new epoch, from the control root.
      security: []
      description: |
        Called by the **control root** whenever the bundle changes: a
        node enrolled or was revoked, a session was signed out, the root's
        token key rotated, or a promotion raised the epoch. The agent also
        pulls the same bundle every 60 s (`control.yaml`,
        `GET /v1/trust/bundle`), so a node that missed a push catches up
        by itself.

        **The credential is the signature, not a bearer token.** The body
        is a JWS signed by the control root's identity key, the one this
        agent pinned at enrollment as `controlPublicKey`. Anything that
        can reach this port but does not hold that key is refused with
        401, and a bundle's content cannot be forged by whoever relays it.

        **This is where rollback protection and epoch fencing happen.**
        The agent answers **409** to a bundle whose `epoch` or `version`
        is lower than the one it holds. That is how a superseded control
        root returning after a promotion is refused, with no election and
        no quorum: every agent declines the downgrade on its own. An
        equal version is accepted and replaces the held bundle.

        On acceptance the agent writes the bundle atomically beside
        `node.yaml`, where its children reload it. Nothing restarts.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "components/common.yaml#/components/schemas/SignedTrustBundle"
      responses:
        "200":
          description: Accepted; the identity as it now stands.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NodeIdentity"
        "401":
          description: |
            The signature does not verify against the pinned
            `controlPublicKey`, or this agent has not enrolled and so has
            no root to recognise.
          content:
            application/problem+json:
              schema:
                $ref: "components/common.yaml#/components/schemas/Problem"
        "409":
          description: |
            Refused: the bundle's `epoch` or `version` is lower than the
            one this agent holds. `detail` names both numbers.
          content:
            application/problem+json:
              schema:
                $ref: "components/common.yaml#/components/schemas/Problem"

  /v1/directories:
    get:
      tags: [config]
      operationId: listDirectories
      summary: List a directory on this host, for a path picker.
      description: |
        The picker behind every path field in this agent's config —
        a `pathMappings` rule's `to`, and `vllmBinary` — and the same
        endpoint the library carries for its model roots, sharing one
        schema so the UI has one picker (M11).

        Without `path`, the places to start: every drive on Windows,
        `/` on POSIX, and the home directory. With it, that directory's
        children — directories only unless `includeFiles`, visible only
        unless `showHidden`. Entries this agent may not read are left
        out rather than failing the listing.

        **Operator-only and unrestricted.** An operator can already type
        any path into config, and the agent already stats what they
        name; listing what they could type is not a new capability. It
        is still a walk of this host's disk on request, so no service
        token is accepted.
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: path
          required: false
          schema:
            type: string
          description: |
            Absolute path of the directory to list. Omit for the
            starting points. A UNC path or an unmounted place is typed,
            not browsed — the picker keeps a path box for exactly this.
        - in: query
          name: includeFiles
          required: false
          schema:
            type: boolean
            default: false
          description: Also list files. A directory picker never asks for this.
        - in: query
          name: showHidden
          required: false
          schema:
            type: boolean
            default: false
          description: Also list dot-prefixed and hidden entries.
      responses:
        "200":
          description: The listing.
          content:
            application/json:
              schema:
                $ref: "components/common.yaml#/components/schemas/DirectoryListing"
        "400":
          description: "`path` exists and is not a directory."
          content:
            application/problem+json:
              schema:
                $ref: "components/common.yaml#/components/schemas/Problem"
        "403":
          description: This agent may not read `path`.
          content:
            application/problem+json:
              schema:
                $ref: "components/common.yaml#/components/schemas/Problem"
        "404":
          description: No such directory on this host.
          content:
            application/problem+json:
              schema:
                $ref: "components/common.yaml#/components/schemas/Problem"

  /v1/library/folders/check:
    post:
      tags: [config]
      operationId: checkLibraryFolders
      summary: Where each Library folder is on this host, and whether it is there.
      description: |
        One row per folder the Library catalogues (2026-09-14): the
        path this node would open for it, **which rule said so** — the
        folder's own `mounts` (`inherited`), this node's `pathMappings`
        (`override`), or nothing (`same_path`) — whether that path
        exists here and is a directory, and how many of the library's
        models under the folder this host can reach. The structured
        form of `POST /v1/config/test`'s prose for `pathMappings`, and
        the answer the Library's Folders page renders as a cell per
        node.

        The body is optional. With `pathMappings`, those overrides are
        used instead of the saved ones for this answer only — the Test
        beside an unsaved edit. The folder list is this node's copy of
        the library's `modelRoots`, refreshed by this call when the
        library can be reached (locally, or through the install for a
        worker); `libraryConsulted` says whether it was, and
        `folderListAgeSeconds` how old the copy is otherwise. Stats run
        off the event loop: a dead share blocks for as long as the OS
        takes to give up.

        Operator-only: it walks this host's disk on request.
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LibraryFolderCheckRequest"
      responses:
        "200":
          description: The effective reach of every Library folder from this host.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibraryFolderReach"

  /v1/model-copies/clear:
    post:
      tags: [runtimes]
      operationId: clearModelCopies
      summary: Delete this node's local copies of its models.
      description: |
        Removes every model file this node copied to its own disk
        (`docs/design/node-local-model-copy.md`), and reports what it
        could not remove and why. Deleting nothing is a success: a node
        with copying switched off, or one that has never launched
        anything, answers with two empty lists.

        **It does not stop anything.** A copy a runtime currently has
        open stays, named in `skipped` — stopping an engine to reclaim
        disk is a decision with a user's inference session on the other
        end of it, and a button labelled "clear" must not make it.

        **And it does not switch copying off.** The copies come back the
        next time these runtimes start, which is what the operator asked
        for by leaving the toggle on; any UI offering this has to say so
        beside the button, or it reads as "free this space permanently"
        and is wrong within minutes.

        Operator-only: it deletes files on this host.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: What was deleted, and what survived.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelCopyClearResult"

  /v1/config:
    get:
      tags: [config]
      operationId: getConfig
      summary: Read the agent's UI preferences, engine paths and first-run state.
      description: |
        Returns the agent's settings that are NOT topology — UI
        preferences (theme, font size, future displayName, future
        connectors), host-local engine paths, and `firstRunComplete`.
        Topology lives under `/v1/components`. This split prevents
        accidental topology changes when an operator edits UI prefs.

        **`vllmBinary`** (`file_path`) is the install-wide path to the
        `vllm` console script in the operator's own virtual environment.
        It exists because vLLM is an engine we deliberately do not
        install (`EngineAcquisition.policy: manual`), and without it a
        working venv reads as unavailable unless the operator puts it on
        `PATH` or repeats the path on every runtime. It points at the
        console script rather than at an interpreter or a venv
        directory: the script's shebang binds its own interpreter, so
        nothing needs activating.

        A config field rather than a new endpoint on purpose — the
        generic editor renders it with no engine-specific UI code, which
        is the same rule that makes `EngineDescriptor.flagSchema` a
        `ConfigSchema`. The pattern generalises as `<engine>Binary` if a
        third driven engine ever arrives.

        **`advertiseUrl`** (`url`, optional) is the address at which
        *other hosts* reach this agent — `http://<tailnet-ip>:8079`.
        Sent to the control root at enrollment as the node's URL, and
        stamped onto every component this agent spawns as
        `Component.advertiseUrl` (the same host, that component's port)
        so a gateway elsewhere can reach a companion driver here. When
        unset, the agent derives it at enrollment from the interface it
        used to reach the control root, and `GET /v1/node` reports what
        it derived. Setting an advertise host that is not loopback also
        makes spawned components bind `0.0.0.0` rather than loopback,
        because a component that must be reached from another host
        cannot bind only to this one; engines are never widened.
      responses:
        "200":
          description: Current config.
          content:
            application/json:
              schema:
                $ref: "components/common.yaml#/components/schemas/ConfigDocument"
    patch:
      tags: [config]
      operationId: updateConfig
      summary: Partial update of UI preferences and setup state.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "components/common.yaml#/components/schemas/ConfigUpdateRequest"
      responses:
        "200":
          description: Update outcome.
          content:
            application/json:
              schema:
                $ref: "components/common.yaml#/components/schemas/ConfigUpdateResult"
        "400":
          $ref: "components/common.yaml#/components/responses/Problem"

  /v1/config/schema:
    get:
      tags: [config]
      operationId: getConfigSchema
      summary: UI-renderable description of every editable agent config field.
      responses:
        "200":
          description: Config schema.
          content:
            application/json:
              schema:
                $ref: "components/common.yaml#/components/schemas/ConfigSchema"

  /healthz:
    get:
      tags: [meta]
      operationId: healthz
      summary: Liveness / readiness probe.
      security: []
      description: |
        The agent is healthy if its own HTTP server is up and at
        least one supervised component is reachable. A agent that
        cannot reach any of its children stays up (so config endpoints
        remain editable) but reports `degraded`.
      responses:
        "200":
          description: Healthy.
          content:
            application/json:
              schema:
                $ref: "components/common.yaml#/components/schemas/Health"
        "503":
          description: All supervised components unreachable.
          content:
            application/json:
              schema:
                $ref: "components/common.yaml#/components/schemas/Health"

  # ---------------------------------------------------------------------
  # The browser surface. Two paths, neither of them a typed API, both of
  # them load-bearing: without them an install has an HTTP interface and
  # no way for a person to use it, which removes differentiator #5
  # (networked-first with auth) from every install path.
  #
  # Declared as path items WITHOUT operations, deliberately. An operation
  # object would have to name a request body, a response schema and a
  # status code, and all three are "whatever the component said" — a
  # generated client for either of these would be a fiction. What a
  # reader needs from this document is that the paths exist, what serves
  # them, and what they are allowed to assume; that is what is here.
  # ---------------------------------------------------------------------

  /:
    summary: The web UI, as static files.
    description: |
      Everything not matched by a route above is served from the static
      export shipped in the `eugene-plexus-ui` distribution, found at
      runtime through `importlib.resources` rather than a path in the
      agent's own tree — so the browser half of an install is a wheel
      you either installed or did not.

      **A directory URL redirects to its trailing-slash form** (`/nodes`
      → `/nodes/`), because the export emits one `index.html` per route.
      Deep links therefore cost one redirect and then work; this is
      stated because a build that drops the convention produces a page
      that works when clicked and 404s when pasted, and the symptom
      names neither cause.

      **When the distribution is absent** this path answers `503` with a
      human-readable page naming what to install. The API surface is
      unaffected — `degraded-mode-required` — and `/healthz` still
      answers `200`.

  /api/proxy/{target}/{path}:
    summary: Same-origin pass-through from the browser to any component.
    description: |
      The browser calls `/api/proxy/<target>/<path>`; the agent forwards
      the request to `<component-base-url>/<path>` with the method,
      headers, query and body it was given, and streams the response
      back untouched. One origin for the UI's own calls: none of them
      needs CORS, and no component URL has to reach the browser for
      the UI to work.

      **The exception, by design:** the gateway's three OpenAI-compatible
      paths answer CORS separately (see `gateway.yaml`), so a browser can
      also reach the front door *directly* -- which is what the
      playground's diagnostic mode does, on purpose, because a client
      that shares this proxy's path with the thing it tests proves
      nothing about the path a third-party client takes.

      **`target` is resolved from this agent's own topology**, in
      process, at request time:

        * `agent` — this process.
        * `gateway`, `library`, `control` — resolved by *kind*, because
          an install has exactly one of each. Not configuration: a
          second place recording a component's URL is a second place it
          can be wrong.
        * anything else — an `inference-driver` **by name**, so a driver
          added while the browser is open is reachable without a reload
          and without a restart.

      A target that resolves to nothing answers `503` naming what was
      looked for, rather than falling back to a default address that
      will also fail but less legibly.

      **Unauthenticated, and it has to be**: this is the path the login
      request itself travels. It confers no authority — the
      `Authorization` header is forwarded verbatim and every component
      behind it enforces its own auth — and it reaches only addresses
      already declared in the topology.

      **Every method is accepted** and the response is streamed rather
      than buffered, so a token stream stays a token stream. Hop-by-hop
      headers (`connection`, `transfer-encoding`, `content-length`,
      `content-encoding`) are dropped in both directions and the
      upstream request is made with `accept-encoding: identity`, so no
      decoder sits in the path to re-buffer an SSE body.
    parameters:
      - name: target
        in: path
        required: true
        schema:
          type: string
        description: |
          `agent`, `gateway`, `library`, `control`, or the name of an
          inference-driver in this agent's topology.
      - name: path
        in: path
        required: true
        schema:
          type: string
        description: |
          The remainder of the upstream path, slashes included — e.g.
          `v1/chat/completions`. Not URL-encoded: this is a wildcard
          tail, and OpenAPI has no better way to say so.

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: |
        An operator session (`POST /v1/auth/login`, or an exchanged
        token addressed to this machine), or a service token addressed
        to this machine and signed by a key in the trust bundle
        (`common.yaml`, `TrustBundle`). Each route says which classes
        and which `sub` it accepts.

  parameters:
    AppId:
      in: path
      name: id
      required: true
      schema:
        type: string
        pattern: "^[a-z][a-z0-9-]{1,39}$"
      description: The app's `AppManifest.id`.

  schemas:
    BenchmarkRequest:
      type: object
      additionalProperties: false
      required: [modelId, profileId, profileName, runtime]
      properties:
        modelId:
          type: string
          minLength: 1
          maxLength: 256
        profileId:
          type: string
          minLength: 1
          maxLength: 256
        profileName:
          type: string
          minLength: 1
          maxLength: 256
        runtime:
          $ref: "#/components/schemas/RuntimeSpec"
        repetitions:
          type: integer
          minimum: 1
          maximum: 5
          default: 3
        tokens:
          type: integer
          minimum: 16
          maximum: 256
          default: 128

    BenchmarkPoint:
      type: object
      required: [depth, tokensPerSecond, standardDeviation, samples]
      properties:
        depth:
          type: integer
          minimum: 0
        tokensPerSecond:
          type: number
          exclusiveMinimum: 0
        standardDeviation:
          type: number
          minimum: 0
        samples:
          type: array
          items:
            type: number
            exclusiveMinimum: 0

    BenchmarkState:
      type: string
      enum: [running, completed, failed, cancelled]

    Benchmark:
      type: object
      required: [id, request, node, state, startedAt, progress, detail, depths, points]
      properties:
        id:
          type: string
        request:
          $ref: "#/components/schemas/BenchmarkRequest"
        node:
          type: string
        state:
          $ref: "#/components/schemas/BenchmarkState"
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: [string, "null"]
          format: date-time
        progress:
          type: number
          minimum: 0
          maximum: 1
        detail:
          type: string
        depths:
          type: array
          items:
            type: integer
            minimum: 0
        points:
          type: array
          items:
            $ref: "#/components/schemas/BenchmarkPoint"
        binary:
          type: [string, "null"]
        engineVersion:
          type: [string, "null"]
        localPath:
          type: [string, "null"]
        modelSizeBytes:
          type: [integer, "null"]
          minimum: 0
        modelModifiedAt:
          type: [string, "null"]
          format: date-time
        command:
          type: array
          items:
            type: string
        hardware:
          type: object
          additionalProperties:
            type: string
          description: CPU/GPU/backend identity reported by the benchmark executable.

    BenchmarkList:
      type: object
      required: [benchmarks]
      properties:
        benchmarks:
          type: array
          items:
            $ref: "#/components/schemas/Benchmark"

    ComponentList:
      type: object
      required:
        - components
      properties:
        components:
          type: array
          description: |
            Components in the order they were configured. The first-run
            wizard fills this in; later editing happens via the
            Components tab.
          items:
            $ref: "#/components/schemas/Component"

    Component:
      type: object
      description: |
        Combined declarative + operational view of one supervised
        component. The declarative half (`name`, `kind`, `url`,
        `spawn`, `safeMode`) is what's persisted to `agent.yaml`.
        The operational half (`status`, `lastRestart`, `lastError`,
        `pid`) is observed at runtime and not persisted.
      required:
        - name
        - kind
        - url
        - status
      properties:
        name:
          type: string
          description: Operator-supplied label, also used in the gateway's `drivers` list.
        kind:
          $ref: "components/common.yaml#/components/schemas/ComponentKind"
        url:
          type: string
          format: uri
          description: |
            Canonical address. For spawned components the agent
            parses the port out of this URL and passes it via env var
            (`EUGENE_PLEXUS_<KIND>_BIND_PORT`); for remote components
            this is what the agent probes.
        advertiseUrl:
          type: string
          format: uri
          readOnly: true
          description: |
            Where a **peer on another host** reaches this component: the
            agent's advertise host with this component's port. Derived,
            never declared, and present only for a component this agent
            spawns on an agent that has an advertise address
            (`NodeIdentity.advertiseUrl`). `url` keeps its one meaning —
            what the agent binds and probes — and the gateway prefers this
            field and falls back to `url`, which is the whole of what makes
            a companion driver on one host routable from a gateway on
            another. Absent on a single-host install, where the two would
            say the same thing.
        spawn:
          $ref: "#/components/schemas/SpawnConfig"
          description: |
            Present iff this component runs locally under agent
            supervision. Absence means it's remote (the agent only
            monitors reachability).
        safeMode:
          type: boolean
          default: false
          description: |
            When true the agent launches the spawned component with
            `EUGENE_PLEXUS_<KIND>_SAFE_MODE=1`, telling it to ignore its
            own config file and boot from defaults. Used to recover
            from a config that breaks startup. Ignored for remote
            components.
        status:
          $ref: "#/components/schemas/ComponentStatus"
        pid:
          type: integer
          description: Operating-system process id. Set only for spawned, currently-running components.
        lastRestart:
          type: string
          format: date-time
          description: When the agent last started or restarted this component.
        lastError:
          type: string
          description: |
            Most recent error observed for this component. Reset to null
            on successful restart. Useful for surfacing why a component
            keeps crashing in the UI's Components tab.

    ComponentEntry:
      type: object
      description: |
        Declarative half of a Component, used for create / update
        request bodies. Status fields are server-owned and excluded.
      required:
        - name
        - kind
        - url
      properties:
        name:
          type: string
        kind:
          $ref: "components/common.yaml#/components/schemas/ComponentKind"
        url:
          type: string
          format: uri
        spawn:
          $ref: "#/components/schemas/SpawnConfig"
        safeMode:
          type: boolean
          default: false

    SpawnConfig:
      type: object
      required:
        - configFile
      properties:
        configFile:
          type: string
          description: |
            Absolute path to the component's own config file. The
            agent passes this to the component via its
            kind-specific env var
            (`EUGENE_PLEXUS_<KIND>_CONFIG_FILE`) at spawn time.
        env:
          type: object
          additionalProperties:
            type: string
          description: |
            Optional extra environment variables to pass to the
            spawned process. Reserved for advanced operators; the
            wizard never sets this.

    ComponentStatus:
      type: string
      enum:
        - starting
        - running
        - safe_mode
        - exited
        - crashed
        - unreachable
      description: |
        Current operational state.

        * `starting` — agent has spawned the process but it has
          not yet answered `/healthz`.
        * `running` — process is up and `/healthz` is healthy.
        * `safe_mode` — process is up but launched with
          `SAFE_MODE=1`; will refuse to do useful work until the
          operator fixes its config and clears the safe-mode flag.
        * `exited` — process exited cleanly and the agent is in
          the middle of respawning it (transient state).
        * `crashed` — process has exited non-zero repeatedly and the
          agent has given up auto-restarting it. Operator must
          restart it manually after fixing the cause.
        * `unreachable` — for remote components, the agent can't
          reach the URL. For spawned components this state is not
          used (use `crashed` or `exited` instead).

    # -------- This node --------

    NodeIdentity:
      type: object
      description: |
        What this agent knows about its own host and its own place in an
        install. The install-wide `Node` view lives on the control root;
        this is the half only the host itself can answer.
      required:
        - enrolled
      properties:
        enrolled:
          type: boolean
          description: |
            False on a fresh agent, and not an error state — supervision
            works without a trust relationship, which is what lets the
            agent on the control host boot first and start the control
            root.
        name:
          type: string
          description: This node's name in the install. Absent until enrolled.
        publicKey:
          type: string
          description: |
            This node's identity public key. The private half never
            leaves the host; a secret sealed to this key is readable here
            and by the control root's recovery recipient, and nowhere
            else.
        controlUrl:
          type: string
          format: uri
          description: The control root this node answers to.
        epoch:
          type: integer
          format: int64
          minimum: 0
          description: |
            Highest control-root epoch this agent has acknowledged. **It
            refuses any root presenting a lower one**, which fences a
            superseded control root without an election, without quorum,
            and without agreeing with any other agent.
        advertiseUrl:
          type: string
          format: uri
          description: |
            Where other hosts reach this agent — the `advertiseUrl` config
            field, or the value derived at enrollment when none was set.
            What the control root holds as this node's `Node.url`.
        trustBundleVersion:
          type: integer
          format: int64
          description: |
            The version of the trust bundle this agent holds. After a
            revocation or a rotation, a node still below the root's
            current version is the answer to "which host is stale", from
            the host itself.
        trustBundleAgeSeconds:
          type: integer
          format: int64
          description: |
            Seconds since the held bundle was signed. Reported, never
            enforced: a bundle keeps working while the root is dead, so
            its age is what tells an operator this node has not heard
            from the root.
        tokenPublicKey:
          type: string
          description: |
            Base64 of this node's raw Ed25519 token public key. The
            private half was generated here and never leaves.
        controlPublicKey:
          type: string
          description: |
            The identity public key of the control root this agent
            enrolled with, pinned then and checked against every trust
            bundle since. A dashboard can compare it with the root's own
            `Snapshot.controlPublicKey`.
        signingPublicKey:
          type: string
          description: |
            This node's **Ed25519** identity public key — the one it
            signs `PATCH /v1/nodes/{name}` with, recorded at the control
            root as `Node.signingPublicKey`.

            Separate from `publicKey`, which is X25519 and exists to have
            secrets sealed *to* it. One key cannot do both jobs: sealing
            is Diffie-Hellman and signing is Ed25519, and deriving one
            from the other only runs in the direction we do not have.

            Absent on a node enrolled before this key existed, which is
            also why its re-advertisements are refused — see
            `PATCH /v1/nodes/{name}` in `control.yaml`.
        advertiseSequence:
          type: integer
          format: int64
          minimum: 0
          description: |
            How many address announcements this node has made since it
            enrolled. Strictly increasing, persisted here and mirrored at
            the control root, so a replayed announcement cannot move a
            node back to an address it used to have.
        os:
          type: string
          enum: [windows, linux, macos]
        arch:
          type: string
          enum: [x64, arm64]
        devices:
          type: array
          items:
            $ref: "components/common.yaml#/components/schemas/ComputeDevice"
          description: |
            What this host can compute on, detected locally. The control
            root aggregates these into the cross-host inventory M3
            deferred; detection stays here because only the host can do
            it.
        agentVersion:
          type: string
        time:
          type: string
          format: date-time
          description: |
            This host's wall clock at the moment it answered.

            One field, and it exists because **no component put its own
            current time on any response body**, so nothing outside a
            host could tell that its clock was wrong. On 2026-09-15 a
            control root running 0.50 s ahead of a worker whose Windows
            Time service had stopped refused that worker's traffic as
            "not yet valid (iat)" on every token minted in the first
            half of a second; every health check said `ok`, the node was
            listed `down` with no reason, and the cause took a morning
            to find. Components tolerate 300 s of skew now — which buys
            time, and makes the drift *silent* until it crosses the
            threshold and the install stops working.

            A console reads this from two hosts a few milliseconds
            apart and knows what they disagree by. Bound the round trip
            around the read (`t0` before, `t1` after) and the true
            offset is inside `[time - t1, time - t0]`; report a skew
            only where that interval clears zero by a margin, because a
            slow proxy hop must not read as a broken clock.

            **Not** a remembered observation of skew. A remembered one
            says a peer was wrong at some past minute; this says what
            this host thinks the time is now, which is the quantity,
            and it needs no state. It is also why the field is on the
            host's own identity rather than under `reach`: a clock is a
            property of a machine, not of who can get to it.
          examples:
            - "2026-09-16T14:03:21.482Z"
        reach:
          $ref: "#/components/schemas/NodeReach"

    # -------- Reach: can anything else on the network get here --------

    NodeReach:
      type: object
      description: |
        Whether other devices can reach this machine, as **evidence**
        rather than as a setting.

        Three separate things have to be true, and every surface before
        this one reported at most one of them: a process has to be
        listening on an address other than loopback, the node has to be
        advertising that address so the rest of the install and the
        person's phone know to use it, and the host firewall has to let
        the connection in. Each is reported on its own here, because
        each fails on its own and the symptom of all three is the same
        — *connection refused*.

        **Nothing here is inferred from a setting.** `boundAddresses`
        comes from the sockets, the firewall verdict from the host
        firewall, and `lastReachedByRoot` from a connection another
        machine actually made. Where a thing cannot be determined the
        answer is `unknown`, never `allowed`.

        Not to be confused with `LibraryFolderReach`, which answers a
        different question with the same word: whether *this node* can
        open a folder on *another* machine. This one is whether another
        machine can open a socket on this one.
      required:
        - enabled
        - restartRequired
      properties:
        enabled:
          type: boolean
          description: |
            This node advertises an address other hosts can use. It is a
            statement about the **setting**, not about whether anything
            got through — read `boundAddresses` and `firewall` for that.
        advertiseUrl:
          type: string
          format: uri
          description: |
            The address currently advertised, repeated from
            `NodeIdentity.advertiseUrl` so a caller rendering this object
            has everything it needs.
        proposedUrl:
          type: string
          format: uri
          description: |
            The address this host would advertise if reach were turned on
            now: its own address on the network it routes through, plus
            the port this agent binds. Derived from the routing table
            (no packet is sent), so it is available on a machine that has
            never enrolled and on one whose control root is on loopback —
            which is every standalone install, and exactly where the
            enrollment-time derivation answers `127.0.0.1`.

            Absent when this host has no non-loopback address at all.
        boundAddresses:
          type: array
          items:
            $ref: "#/components/schemas/BoundAddress"
          description: |
            What each process of this install is actually listening on,
            this agent included — read from the process, not from its
            configuration. This is where "the setting says one thing and
            the socket says another" becomes visible.
        restartRequired:
          type: boolean
          description: |
            This agent's own socket does not match what the node
            advertises. A listening socket is fixed for the life of the
            process, so an agent started while the node advertised
            loopback answers only on loopback however the setting is
            changed afterwards. Supervised components do not have this
            problem — they are restarted when the setting changes.
        restart:
          $ref: "#/components/schemas/AgentRestart"
        firewall:
          $ref: "#/components/schemas/HostFirewall"
        lastReachedFrom:
          type: string
          description: |
            The address of the last connection to this agent that came
            from somewhere other than this machine.

            **The only proof from outside.** Static inspection of a
            firewall says what *should* happen; a connection that
            arrived says what did. Deliberately *any* off-host caller
            rather than the control root specifically: on a standalone
            install there is no root probing from elsewhere, and the
            person opening this page on their phone is both the test
            they were told to run and the evidence it passed. The
            control root's own view of the same fact is
            `Node.lastSeenAt` in `control.yaml`, which is where a
            multi-machine console should read it.

            Absent until something off this machine connects. Not
            persisted: it describes this process, and a restart is
            exactly when a person wants to know whether reach still
            works rather than whether it once did.
        lastReachedAt:
          type: string
          format: date-time
          description: When that connection arrived.

    BoundAddress:
      type: object
      required: [process, host, port]
      properties:
        process:
          type: string
          description: |
            `agent`, a `ComponentKind`, or `app:<id>` for an installed
            app. Engines are not listed: they are deliberately never
            widened.
        host:
          type: string
          description: The interface bound — `127.0.0.1`, `0.0.0.0`, or one address.
        port:
          type: integer
        reachableOffHost:
          type: boolean
          description: |
            Whether this bind can be reached from another machine at all,
            before the firewall gets a say. False for a loopback bind,
            which no rule can rescue.

    AgentRestart:
      type: object
      description: |
        How this agent would come back if it stopped — which decides
        whether a switch may restart it, and what a person is told when
        it may not.
      required: [mechanism, canSelfRestart]
      properties:
        mechanism:
          type: string
          enum: [service, logon_task, systemd, launchd, none, unknown]
          description: |
            What starts this agent. `none` means nothing does — it was
            launched by hand, and stopping it ends the install until
            somebody types the command again.
        canSelfRestart:
          type: boolean
          description: |
            This agent can ask its own supervisor to restart it. False is
            not a failure; it is the case where the switch changes the
            setting and says plainly that the person has to restart it.
        command:
          type: string
          description: |
            The command a person runs to restart this agent, for the
            case above and for a card to print either way.
        detail:
          type: string
          description: |
            One plain sentence about what this mechanism means for the
            person reading it — *"This agent starts at boot, before
            anyone signs in."* for a service, *"This agent starts when
            you log in."* for a logon task, and for `none` the fact that
            stopping it ends the install until somebody types the
            command again.

            **It is the difference between the two Windows mechanisms,
            stated where a person can see it**, which is the whole of
            why R2.6 changed one into the other. A card that renders
            `command` and not this can tell somebody *how* to restart
            their install and never that it will not come back on its
            own after a reboot — which is the question they came to the
            page with.

    HostFirewall:
      type: object
      description: |
        What the host firewall says about the ports this install
        publishes. Read per request and cached no longer than the node
        view; a stale verdict is worse than a slow one.
      required: [supported]
      properties:
        supported:
          type: boolean
          description: |
            This platform has a firewall this agent knows how to read.
            False is a first-class answer: every other field is then
            absent and every port's verdict is `unknown`.
        product:
          type: string
          description: |
            The firewall being described — `Windows Defender Firewall`,
            `ufw`, `firewalld`, `Application Firewall`.
        enabled:
          type: boolean
        defaultInbound:
          type: string
          enum: [block, allow, unknown]
          description: |
            What happens to an inbound connection no rule matches.
            **`unknown` is not `allow`.** Windows reports this as
            `NotConfigured` through its PowerShell cmdlets, which means
            *block*, and reads as *not blocking* to anyone who compares
            the string to `Block`.
        activeProfiles:
          type: array
          items:
            type: string
          description: |
            The firewall profiles in force on the interfaces this host is
            connected through — on Windows, `Private`, `Public` or
            `Domain`. A home network Windows has classified as `Public`
            is the commonest cause of "it worked here yesterday", so the
            classification is reported even when every verdict is
            `allowed`.
        thirdPartyProducts:
          type: array
          items:
            type: string
          description: |
            Firewalls registered with the OS that are **not** the one
            described above. A third-party firewall makes every verdict
            here `unknown`, however confident the built-in firewall's own
            answer looks: "Windows Firewall is off" says nothing about
            whether Norton is letting us through.
        ports:
          type: array
          items:
            $ref: "#/components/schemas/FirewallPort"
        detail:
          type: string
          description: |
            Why the answer is what it is, in a sentence — including why a
            read failed, which is the difference between `unknown` and a
            blank card.

    FirewallPort:
      type: object
      required: [port, verdict]
      properties:
        port:
          type: integer
        verdict:
          type: string
          enum: [allowed, blocked, unknown]
          description: |
            `allowed` — an enabled Allow rule covers this port, or this
            program, in every profile currently in force.
            `blocked` — the firewall is on, unmatched inbound traffic is
            blocked, and nothing covers us; or an explicit Block rule
            names this program.
            `unknown` — a third-party firewall is registered, the read
            failed, or the platform cannot answer. **A verdict is never
            upgraded to `allowed` by inference.**
        rule:
          type: string
          description: The name of the rule that decided it, when one did.
        scope:
          type: string
          enum: [port, program]
          description: |
            What the deciding rule is bound to. Worth surfacing rather
            than hiding: the rule Windows creates from its own *Windows
            Security Alert* dialog is bound to the **program**, and this
            install's program is a versioned interpreter path under the
            install directory — so an allow a person clicked once stops
            covering us the day the interpreter is upgraded, with no
            message anywhere. A rule this agent adds is bound to the
            **port**, for that reason.
        profiles:
          type: array
          items:
            type: string
          description: The profiles the deciding rule applies to.
        remedy:
          type: string
          description: |
            The command that would change a `blocked` verdict, ready to
            run. Present on `blocked`, and on `unknown` where a command
            would settle it.

    NodeReachRequest:
      type: object
      required: [enabled]
      properties:
        enabled:
          type: boolean
          description: |
            True to advertise and bind an address other hosts can use;
            false to return to loopback.
        url:
          type: string
          format: uri
          description: |
            The address to advertise, for the case the derived one is
            wrong — a host with several interfaces, or a container
            published on a different port. Defaults to
            `NodeReach.proposedUrl`. A loopback address is refused here:
            it is what `enabled: false` means, and accepting it would
            leave a switch that reads *on* and does nothing.
        allowFirewall:
          type: boolean
          default: false
          description: |
            Ask the host firewall to allow this install's ports. Adding a
            rule needs administrator rights everywhere: an agent running
            as a service has them, and an agent running in a person's own
            session raises a prompt on the desktop. Where neither is
            possible the step is reported as not taken, with the command.
        restartAgent:
          type: boolean
          default: false
          description: |
            Restart this agent afterwards, so its own socket picks up the
            change. The response is sent first. Refused with
            `restarted: false` when `AgentRestart.canSelfRestart` is
            false — this agent will not stop itself with nothing to start
            it again.

    NodeReachResult:
      type: object
      required: [reach, steps]
      properties:
        reach:
          $ref: "#/components/schemas/NodeReach"
        steps:
          type: array
          items:
            $ref: "#/components/schemas/ReachStep"
          description: |
            One entry per thing that was attempted, in the order it was
            attempted. A step that failed does not roll back the ones
            before it — a firewall rule that could not be added is not a
            reason to stop advertising — so this list, not the status
            code, is how a caller learns what actually happened.
        restarted:
          type: boolean
          description: |
            A restart of this agent has been scheduled. The caller should
            expect this connection to close.

    ReachStep:
      type: object
      required: [step, ok]
      properties:
        step:
          type: string
          enum:
            [advertise, announce, restart_components, firewall, restart_agent]
        ok:
          type: boolean
        detail:
          type: string

    EnrollRequest:
      type: object
      required:
        - controlUrl
        - token
      properties:
        controlUrl:
          type: string
          format: uri
          description: The control root to join.
        token:
          type: string
          description: |
            A join token minted at that control root. Single-use and
            short-lived by design — it is the only credential this node
            has until enrollment completes.
        name:
          type: string
          description: |
            Requested node name. Defaults to the host's own name, which
            is the answer an operator would have typed anyway.

    ServiceTokenRequest:
      type: object
      description: |
        A token for one other machine, asked for by one of this agent's
        own children. See `POST /v1/auth/service-token`.
      required:
        - audience
      properties:
        audience:
          type: string
          pattern: '^(control|node:.+)$'
          description: The one recipient the token may be presented to.

    ServiceTokenResponse:
      type: object
      required:
        - token
        - expiresAt
      properties:
        token:
          type: string
          description: An `ep-service+jwt` signed by this node's key, addressed to `audience`.
        expiresAt:
          type: string
          format: date-time

    UnenrollRequest:
      type: object
      description: |
        Optional. The default does the right thing; the field exists for
        the operator who already knows the root is gone and does not want
        to wait for the attempt to time out.
      properties:
        notifyControl:
          type: boolean
          default: true
          description: |
            Call `DELETE /v1/nodes/{name}` at the control root first, so
            the install drops this node's key and stops trusting it. Set false to skip the attempt entirely — it does not
            change what happens *here*, only whether the root is told.

    UnenrollResult:
      type: object
      required:
        - identity
        - controlNotified
      properties:
        identity:
          $ref: "#/components/schemas/NodeIdentity"
        controlNotified:
          type: boolean
          description: |
            Whether the control root accepted the revocation. **False is
            not a failure of this call** — the node has left either way.
            It means the install still lists this node and still trusts
            the key it just discarded, and an operator owes it a
            `DELETE /v1/nodes/{name}`.
        previousName:
          type: string
          description: The name this node had in the install it just left.
        previousControlUrl:
          type: string
          format: uri
          description: The control root it answered to.
        detail:
          type: string
          description: |
            Why the root was not told, when it was not. Present exactly
            when `controlNotified` is false and something was attempted.

    # -------- Auth --------

    AuthStatus:
      type: object
      description: |
        Whether this install has been through first-run setup, whether
        its secrets are open right now, and whether this host can keep
        them open across a restart on its own.

        Unauthenticated by necessity: it is what the UI asks before it
        has a token. Nothing here is a secret. The two optional fields
        arrived with the hobbyist UX work (2026-09-15) so the first-run
        wizard can default `securityMode` to `os_keyring` where a
        keyring exists and say plainly where one does not.
      required:
        - initialized
      properties:
        initialized:
          type: boolean
          description: |
            True once a passphrase has been set. False means every
            endpoint except this one, `/healthz` and
            `POST /v1/auth/initialize` will refuse.
        unlocked:
          type: boolean
          description: |
            True while the master key is in this process's memory, so
            sealed values (provider API keys) can be opened. False after a restart under
            `securityMode: prompt_on_startup` until someone signs in, or
            when an `os_keyring` recovery found nothing usable. Absent
            from an agent that predates the field.
        keyringAvailable:
          type: boolean
          description: |
            Whether this host's OS keyring (Windows Credential Manager,
            macOS Keychain, a Linux Secret Service) accepted a write,
            read and delete of a probe entry from this process — measured
            once per process run, not assumed from the platform. False on
            a headless Linux box with no unlocked secret service, in a
            container, or under a service account with no credential
            store; true on the ordinary desktop. The wizard defaults
            `securityMode` to `os_keyring` on true and explains the
            passphrase prompt on false. Absent when the probe was not run
            or did not finish within its budget.
        passphraseFile:
          type: boolean
          description: |
            True when this agent unlocks itself from a passphrase file:
            `securityMode` is `passphrase_file` and
            `EUGENE_PLEXUS_AGENT_PASSPHRASE_FILE` names where the file
            goes. The Linux system install, where the agent runs under
            its own account and has no keyring (2026-09-24). The wizard
            then says the install unlocks itself after a restart, offers
            no keyring choice, and sets the control root to the same
            mode. Absent from an agent that predates the field, and false
            everywhere else.

    ClientKeyLimits:
      $ref: 'components/client-keys.yaml#/components/schemas/ClientKeyLimits'

    ClientKeyUpdateRequest:
      $ref: 'components/client-keys.yaml#/components/schemas/ClientKeyUpdateRequest'

    ClientAdmissionRequest:
      $ref: 'components/client-keys.yaml#/components/schemas/ClientAdmissionRequest'

    ClientAdmissionResult:
      $ref: 'components/client-keys.yaml#/components/schemas/ClientAdmissionResult'

    ClientKey:
      $ref: 'components/client-keys.yaml#/components/schemas/ClientKey'

    ClientKeyList:
      $ref: 'components/client-keys.yaml#/components/schemas/ClientKeyList'

    ClientKeyCreateRequest:
      $ref: 'components/client-keys.yaml#/components/schemas/ClientKeyCreateRequest'

    ClientKeyCreated:
      $ref: 'components/client-keys.yaml#/components/schemas/ClientKeyCreated'

    ClientKeyPolicy:
      $ref: 'components/client-keys.yaml#/components/schemas/ClientKeyPolicy'

    ClientKeyRevocations:
      type: object
      description: |
        What the gateway polls. Ids only, and the revision at which the
        set last changed.
      required:
        - ids
        - revision
      properties:
        ids:
          type: array
          items:
            type: string
          description: |
            `jti`s to refuse. Excludes keys whose `expiresAt` has passed:
            those are refused by expiry, and keeping them here would
            make this list grow forever.
        revision:
          type: integer
          description: |
            Increments whenever the set changes. A reader logs on a
            change rather than on every poll.

    AuthInitializeRequest:
      type: object
      required:
        - passphrase
      properties:
        passphrase:
          type: string
          minLength: 1
          format: password
          description: |
            The operator passphrase. Hashed with Argon2id and used to
            derive the master key that at-rest secrets are sealed
            under, so losing it means losing every stored credential —
            there is no recovery path by design.

    # -------- Engines and runtimes --------

    ManagedEngine:
      type: object
      description: |
        A build this install fetched and owns, as opposed to one found on
        PATH or pointed at by hand. Present only when we installed it.
      required:
        - version
        - binaryPath
        - variant
      properties:
        version:
          type: string
          description: |
            Upstream build identifier - for llama.cpp a `bNNNN` tag, not
            a semver. Copied verbatim from the release, because the only
            useful thing to do with it is compare it to what upstream
            has.
        binaryPath:
          type: string
          description: Absolute path to the executable inside the managed directory.
        variant:
          type: string
          description: |
            Which asset was chosen, e.g. `win-cuda-13.3-x64`. Recorded
            because it is the answer to "why is this slow" often enough
            to be worth surfacing: a host that fell back to a CPU build
            looks identical from the outside otherwise.
        installedAt:
          type: string
          format: date-time
        sizeBytes:
          type: integer
          format: int64
          description: |
            On-disk size of this build. A Windows CUDA install is roughly
            half a gigabyte unpacked and we retain two, so this is worth
            showing before someone asks where their disk went.
        previousVersion:
          type: string
          description: |
            The build retained alongside this one, if any. Retention is
            current plus previous: keeping every build is not viable at
            this size, and keeping only the newest leaves a bad upgrade
            with no way back.

    EngineAcquisition:
      type: object
      description: |
        Whether this host can be given a build of this engine, and which
        one. Answers the question before the operator commits to a
        several-hundred-megabyte download.
      required:
        - installable
      properties:
        policy:
          type: string
          enum:
            - managed
            - manual
          description: |
            Whether this engine is one we install at all. A property of
            the engine, not of this host.

            * `managed` — we fetch, verify and retain builds of it.
              llama.cpp, which ships prebuilt release assets with
              per-asset digests.
            * `manual` — the operator installs it and we discover what
              they installed. vLLM, whose unit of installation is a
              Python environment: an interpreter of a version we do not
              control (specifically 3.12 for the ROCm and Intel wheels),
              several GB per retained copy, three of six targets on a
              non-default package index, Apple silicon served by a
              separate project entirely, and no single digest that
              verifies the result. Decided 2026-09-09.

            Separate from `installable` because the two answer different
            questions and the UI renders them differently.
            `installable: false` under `policy: managed` means *not on
            this host* — there is a build, just not for this one, which
            is Linux + NVIDIA llama.cpp. `policy: manual` means *not by
            us, anywhere*, and the UI owes the operator instructions
            (`manualInstall`) rather than a disabled install button.
            Inferring that difference from a false boolean would be
            guesswork.
        installable:
          type: boolean
          description: |
            False means we will not be installing this engine here, and
            `reason` says why. This is a real outcome, not an error, and
            it arises two ways. Under `policy: managed` no published
            asset fits this host — upstream publishes no CUDA build for
            Linux, so a Linux box with an NVIDIA GPU cannot be served
            automatically and is told so rather than quietly handed a
            slower Vulkan build it never asked for. Under
            `policy: manual` it is always false, on every host, by
            decision.
        variant:
          type: string
          description: The asset variant that would be fetched, when installable.
        reason:
          type: string
          description: |
            Why not, when `installable: false`. Written for the operator,
            naming the way forward - build from source, use a container,
            or point `binary` at an existing build. For a
            `policy: manual` engine the way forward is an install the
            operator performs, and `manualInstall` carries the command
            itself.
        manualInstall:
          $ref: "#/components/schemas/ManualInstall"
          description: |
            How the operator installs this engine themselves. Present
            for `policy: manual`, and the reason driving an engine is a
            supported path rather than a shrug.
        detected:
          $ref: "#/components/schemas/HostAccelerator"
        latestVersion:
          type: string
          description: Newest upstream build we know of.
        latestPublishedAt:
          type: string
          format: date-time
          description: |
            When that build shipped. Deliberately the age of the newest
            build rather than a count of builds behind: llama.cpp
            publishes several a day, so "1,021 builds behind" is noise
            and "your build is three weeks old" is information.
        checkedAt:
          type: string
          format: date-time
          description: |
            When we last asked upstream. Checked at most daily and never
            on the request path; a failed check leaves this stale rather
            than raising anything.

    ManualInstall:
      type: object
      description: |
        Instructions for installing an engine we do not manage, written
        for the host we actually detected.

        This exists so that "we don't install this one" is still an
        answer the operator can act on. A refusal that names the exact
        command is a different product from a refusal that says no —
        and since a `manual` engine's refusal is permanent rather than
        situational, it is the only surface the operator gets.
      required:
        - docsUrl
      properties:
        command:
          type: string
          description: |
            A copy-pasteable command for the detected platform and
            accelerator, e.g.
            `uv pip install vllm --torch-backend=auto`. Omitted when we
            cannot name one honestly — an unrecognised accelerator, or a
            target upstream serves from a separate project — in which
            case `docsUrl` and `notes` carry it. Never a guess: a
            command that does not work is worse than no command, because
            the operator will believe it.
        docsUrl:
          type: string
          description: |
            Upstream's own install page. Required, and deliberately the
            one field that always exists: upstream's instructions are
            correct for longer than any copy we make of them, and this
            is the value that stays right when our `command` goes stale.
        notes:
          type: string
          description: |
            Constraints the command alone does not convey — a required
            Python version, a non-default package index, that this
            target is served by a separate upstream project, or that the
            platform is unsupported and the way in is a Linux VM.

    HostAccelerator:
      type: object
      description: |
        What the agent detected about this machine, insofar as it
        decides which engine build to fetch. Not a general hardware
        inventory - the VRAM-and-quant-fit surface that M3 needs belongs
        to the library component, not here.
      properties:
        os:
          type: string
          enum: [windows, linux, macos]
        arch:
          type: string
          enum: [x64, arm64]
        accelerator:
          type: string
          enum: [none, cuda, rocm, metal, sycl, vulkan]
          description: |
            `metal` is reported on Apple silicon even though there is no
            separate Metal asset - the plain macOS build has it compiled
            in, and saying `none` there would read as "no GPU".

            `vulkan` is how a non-NVIDIA GPU on **Windows** is served,
            and it exists because until 2026-09-18 there was no answer
            at all: the ROCm probe looked for `rocm-smi` or `/opt/rocm`
            and the SYCL probe for `sycl-ls` or Linux sysfs, none of
            which exists on Windows, so every AMD and Intel card there
            fell through to `none` - a CPU build, a fit scored against
            RAM, and the starter set inverted to the smallest model, on
            a machine built around a graphics card.

            Vulkan rather than ROCm or SYCL for that case because
            upstream publishes `win-vulkan-x64` in every release, it
            needs no vendor SDK, and one build covers AMD and Intel
            alike. `rocm` is still reported on Windows when the HIP SDK
            is actually installed, which is what makes
            `win-rocm-10.0-x64` reachable rather than dead code.
        acceleratorVersion:
          type: string
          description: |
            For CUDA, the highest version the installed driver supports.
            Selection takes the highest published build whose major
            matches and whose minor is no greater than this. When the
            release publishes no such build — upstream moved from 13.3
            to 13.4 on 2026-09-15 and stopped shipping 13.3 — the lowest
            published minor **above** it within the same major is taken
            instead, under CUDA's minor-version compatibility (an
            application built with any 13.x toolkit runs on any 13.x
            driver, minus PTX JIT for newer PTX and APIs the driver
            lacks; verified live with b10990's 13.4 build on a 13.3
            driver), and the agent logs the choice. The candidate
            minors are read from the release's own asset names, not a
            table: the table this replaced went stale in a day.

            **A NEWER major is never chosen** — a 13.x build needs a
            13.x driver, and the refusal says so and names the fix. **An
            OLDER major is**, when the driver's own major has nothing
            this machine's cards can run: NVIDIA's drivers are backward
            compatible, so a 12.x build loads on a 13.x driver with the
            CUDA runtime it ships beside it. Until 2026-09-23 this said a
            different major was never chosen *either way*, which refused
            a working build on the one kind of host that needs it — see
            `computeCapability`.
        computeCapability:
          type: string
          description: |
            For CUDA, the **lowest** compute capability among this
            machine's NVIDIA cards, as `nvidia-smi --query-gpu=compute_cap`
            reports it (`6.1` for a Pascal Quadro P4000, `12.0` for an
            RTX 5090). Absent when the driver would not say, which is
            only drivers old enough that no published build loads on
            them anyway.

            **It exists because the driver's CUDA version is not enough
            to choose a build.** From CUDA 13 the toolkit no longer
            compiles for Maxwell, Pascal or Volta, and upstream
            llama.cpp's own build adds `50-virtual 61-virtual 70-virtual`
            only below 13 — so a card below 7.5 cannot run a 13.x build
            at all, while the last driver branch that supports it (580)
            reports CUDA 13.0. Choosing by driver alone installs a build
            with no kernels for the card, which fails at model load with
            nothing naming why. So a 13.x build is a candidate only at
            7.5 or above, a 12.x build at 5.0 or above, and below 5.0
            nothing published runs and the refusal says so.

            **The lowest card decides**, because one engine may use every
            visible card and a build must carry code for all of them: a
            3090 beside a P4000 gets the 12.x build, which carries both.

    EngineInstallRequest:
      type: object
      properties:
        version:
          type: string
          description: |
            A specific upstream build to install. Omit for the newest.
            Present so an operator who found a regression can pin the
            build that worked, which is the whole reason we record the
            version rather than just "installed".

    EngineInstall:
      type: object
      description: |
        Progress of one install. Phases are named rather than reduced to
        a percentage because they fail differently and the operator
        needs to know which one they are in: a stall in `downloading` is
        the network, a stall in `extracting` is the disk, and a failure
        in `verifying` is the one that means do not run this.
      required:
        - engine
        - state
      properties:
        engine:
          $ref: "components/common.yaml#/components/schemas/EngineKind"
        state:
          type: string
          enum:
            - resolving
            - downloading
            - verifying
            - extracting
            - done
            - failed
            - cancelled
          description: |
            * `resolving` - asking upstream which build and which asset.
            * `downloading` - fetching. On Windows with CUDA this is two
              assets, the binary and a separate CUDA runtime, and the
              byte counters cover both.
            * `verifying` - comparing the SHA-256 the releases API
              reported for the asset. Upstream publishes no checksum
              file; the digest arrives with the asset metadata, so
              there is no excuse for skipping this.
            * `extracting` - unpacking into a new versioned directory.
            * `done` / `failed` / `cancelled` - terminal, and retained
              until the next install starts.
        version:
          type: string
          description: The build being installed, once resolved.
        variant:
          type: string
        bytesDownloaded:
          type: integer
          format: int64
        bytesTotal:
          type: integer
          format: int64
          description: |
            Total across every asset this install needs. Absent until
            `resolving` finishes.
        message:
          type: string
          description: What is happening now, for a status line.
        error:
          type: string
          description: "Populated when `state: failed`."
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time

    EngineList:
      type: object
      required:
        - engines
      properties:
        engines:
          type: array
          items:
            $ref: "#/components/schemas/EngineDescriptor"

    EngineDescriptor:
      type: object
      description: |
        One engine adapter, plus what the agent found on this host.
      required:
        - engine
        - available
        - modelFormats
      properties:
        engine:
          $ref: "components/common.yaml#/components/schemas/EngineKind"
        available:
          type: boolean
          description: |
            True iff a usable binary was found and successfully
            version-probed. When false, `error` says why and runtimes
            for this engine will fail to spawn.
        modelFormats:
          type: array
          items:
            $ref: "components/common.yaml#/components/schemas/ModelFormat"
          description: |
            On-disk model formats this adapter's engine can load. A
            property of the engine, not of this host — it does not
            change with `available`.

            This is the engine half of a join the UI performs: the
            library reports what format each model *is*, and this
            reports what each engine can *load*. `llama_cpp` lists
            `gguf`; `vllm` lists `safetensors`. Between them the UI can
            grey out a launch button and name the missing engine instead
            of offering one that fails.

            `vllm` does **not** list `gguf`, though upstream has a path
            for it. That path is documented as highly experimental and
            under-optimized, and it needs a second `--tokenizer` model
            because converting a GGUF tokenizer is unstable — so
            claiming the format would light up a launch button across
            the whole GGUF population llama.cpp already serves properly.

            A format match is a *first* filter and not a promise. It says
            the engine can load this kind of file, not that it can load
            this model: vLLM's model registry is the authority on
            architectures and it answers only at spawn. The second
            filter is therefore the engine's own failure, surfaced
            verbatim through `Runtime.lastError`. No architecture list is
            copied in here, for the same reason the formats are not
            copied into the library.

            It lives here because engine knowledge lives here. Putting
            format support on the library would give the library a copy
            of it, and the copy would be the one that went stale.
        experimental:
          type: boolean
          default: false
          description: |
            True while this engine's integration has never been proved
            on the hardware it targets — `mlx` until a physical Apple
            silicon run is recorded. A property of the *integration*,
            not of this host, and reported so the UI can badge the
            option instead of hardcoding a list that goes stale the day
            the evidence lands. Experimental does not mean hidden: on
            appropriate hardware the engine is offered, badged; on the
            wrong hardware `acquisition.manualInstall.notes` explains
            why there is no install command.
        binaryPath:
          type: string
          description: Absolute path to the binary the adapter would spawn.
        version:
          type: string
          description: |
            What is running, so an operator can tell what they actually
            have and so a flag that stopped working after an upgrade is
            diagnosable. For llama.cpp, the build number as the binary
            reports it.

            **Not necessarily obtained by running the engine.** For a
            Python-package engine the version is read from the installed
            distribution's metadata instead: vLLM exposes it through a
            CLI flag whose module import chain loads PyTorch first, and
            paying that to render a settings panel is not acceptable.
            Same trade the managed store already makes for llama.cpp,
            where the recorded build number is returned rather than
            re-probed.
        origin:
          type: string
          enum:
            - managed
            - configured
            - path
          description: |
            Where the binary came from. Discovery precedence is an
            explicit `binary` on the runtime, then `configured`, then
            `managed`, then `PATH`.

            * `managed` — fetched and verified by us. Only ever set for
              an engine with `acquisition.policy: managed`.
            * `configured` — an explicit path the operator set. Two
              sources: a `binary` on one runtime, for someone who builds
              llama.cpp themselves or wants a specific build for one
              model; or an install-wide path in the agent's own
              config, which is how an engine we never manage becomes
              discoverable at all. Without the second, an operator with
              a perfectly good vLLM venv would read as unavailable
              unless they put it on `PATH` or repeated the path on every
              runtime.
            * `path` — found on `PATH`.
        flagSchema:
          $ref: "components/common.yaml#/components/schemas/ConfigSchema"
          description: |
            The **curated** flag surface for this engine, as a standard
            `ConfigSchema` so the generic config editor renders it with
            no engine-specific UI code.

            Curated, not complete: `llama-server` has hundreds of flags
            and exposing them wholesale would produce a form nobody can
            use. What is here is what a person actually turns —
            context size, GPU layers, batch size, parallel slots, flash
            attention. Anything omitted is still reachable through
            `RuntimeSpec.extraArgs`.
        error:
          type: string
          description: "Populated when `available: false`."
        managed:
          $ref: "#/components/schemas/ManagedEngine"
        acquisition:
          $ref: "#/components/schemas/EngineAcquisition"
        python:
          $ref: "#/components/schemas/PythonEngine"
          description: |
            Present when this engine is a Python package rather than a
            self-contained binary, describing the environment it lives
            in. Absent for llama.cpp.

    PythonEngine:
      type: object
      description: |
        The environment a Python-package engine was found in.

        This is the `ManagedEngine.variant` idea applied to an engine
        whose build is a property of its environment rather than of a
        filename: recorded because it is the answer to "why is this
        slow" often enough to be worth surfacing. A venv holding a
        CPU-only PyTorch looks identical from the outside to one holding
        a CUDA build and runs orders of magnitude slower, and nothing
        else on this descriptor would ever say so.
      required:
        - interpreter
      properties:
        interpreter:
          type: string
          description: |
            Absolute path to the interpreter behind the engine's console
            script. The script's own shebang binds it, so nothing needs
            activating and the argv stays a plain executable invocation —
            but the interpreter is what identifies *which* install is in
            use when an operator keeps more than one.
        pythonVersion:
          type: string
          description: |
            e.g. `3.12.8`. Surfaced rather than merely logged because it
            is sometimes the whole problem and is not fixable from here:
            upstream publishes the ROCm and Intel wheels for 3.12 only,
            so an operator on 3.13 has an unusable environment and the
            only useful thing we can do is show them the number.
        packageVersion:
          type: string
          description: |
            The engine package's own version, from the installed
            distribution's metadata. Mirrors `EngineDescriptor.version`
            and is here so the environment reads as a self-contained
            record.
        torchVersion:
          type: string
          description: |
            The installed PyTorch version *including its build tag* —
            e.g. `2.9.0+cu129`. The tag is the load-bearing half: it is
            what distinguishes a CUDA build from a CPU-only one, which
            is the single most useful fact about an environment that is
            serving slowly.
        accelerator:
          $ref: "#/components/schemas/FrameworkAccelerator"

    FrameworkAccelerator:
      type: string
      enum: [none, cuda, rocm, xpu, metal, unknown]
      description: |
        What a Python engine's installed framework was *built for*, read
        from its build tag rather than from the host.

        Deliberately a separate schema from `HostAccelerator.accelerator`
        rather than a shared one, because the two say different things
        and carry different values. That one reports what the *machine*
        has; this one reports what the *wheel* has. A CUDA box running a
        CPU-only PyTorch is a real and quiet failure — everything looks
        installed and inference is orders of magnitude slower — and it
        is visible only as the disagreement between these two fields.

        `unknown` when the build tag does not parse. Honest, and better
        than reporting `none`, which would read as a definite claim that
        there is no acceleration.

    RuntimeList:
      type: object
      required:
        - runtimes
      properties:
        runtimes:
          type: array
          items:
            $ref: "#/components/schemas/Runtime"

    RuntimeSpec:
      type: object
      description: |
        Declarative half of a Runtime — what the operator asked for.
        Used for create and update bodies; observed fields are
        server-owned and excluded.

        Note what is *not* here: a command line. The operator declares
        intent (this engine, this model, these flags) and the adapter
        builds the argv. Letting a topology entry carry raw argv would
        make every engine "supported" while making none of them
        knowable — no readiness probe, no flag validation, no version
        story. The resolved argv is reported back on `Runtime.argv` for
        debugging, which is the half of raw-argv access that is
        genuinely useful.
      required:
        - name
        - engine
        - modelPath
      properties:
        name:
          type: string
          minLength: 1
          description: |
            Operator-supplied label, unique per node. Referenced by
            an inference-driver on that node to say which runtime it
            fronts. Different nodes may use the same label; install-wide
            runtime identity is the pair (node, name).
        engine:
          $ref: "components/common.yaml#/components/schemas/EngineKind"
        modelPath:
          type: string
          description: |
            Absolute path to the model on this host — a `.gguf` file, or
            a directory for multi-file formats. **The operator's own
            path, in the operator's own layout.** We never relocate,
            rename, or hash-address a model file; a runtime points at
            where the user put it.

            For a sharded GGUF this is the *first* shard
            (`…-00001-of-0000N.gguf`), which is what the engine expects.
            When a runtime is created from the library, this is the
            `path` off a `LibraryModel` and the `flags` are a
            `ModelProfile` — but nothing here depends on the library
            existing, and a hand-written runtime is still a runtime.

            **When the library is on another host, this is still the
            library's spelling** (M11). The node resolves where the same
            file is on its own disk through the Library folder's
            `mounts` and its own `pathMappings` overrides, at every
            spawn and never onto this field — so the declaration keeps
            linking to its library entry (`GET /v1/models?path=` is keyed
            to the library's own path), and a changed mapping takes
            effect at the next start with nothing re-declared. What was
            actually opened is reported as `Runtime.localPath`.
        modelAlias:
          type: string
          description: |
            The model id this runtime serves under, and therefore what a
            client asks the gateway for. Defaults to the model
            filename with its extension stripped — plainly-named files
            mean the obvious name is already the right one, so this is
            an override, not a requirement.

            **The resolved value is always passed to the engine
            explicitly, never left to the engine's own default.** vLLM's
            default served name is the `--model` argument verbatim, and
            we launch models by absolute path because the user's files
            stay theirs — so leaving it unset would publish
            `/home/you/models/Qwen3-8B` as an OpenAI model id. That
            leaks the operator's directory layout to every API client
            and, worse, makes the routing key differ per host for the
            same model, which breaks both multi-host placement and any
            failover priority list that names a model. llama.cpp derives
            its default from the filename and would have been fine,
            which is exactly why this was invisible until a second
            engine existed.
        host:
          type: string
          default: 127.0.0.1
          description: |
            Address the engine binds. Defaults to loopback: an engine
            has no auth of its own, so it must not be exposed directly.
            Reaching a model from another machine is the gateway's job,
            and the gateway has auth.
        port:
          type: integer
          minimum: 1
          maximum: 65535
          description: |
            Port the engine binds. Assigned from an ephemeral range when
            omitted — with N runtimes the operator should not have to
            hand out port numbers.
        autoStart:
          type: boolean
          default: true
          description: |
            Whether the agent spawns this runtime at startup and
            respawns it on exit. False leaves it declared but
            `stopped`, which is how a rarely-used large model stays
            configured without holding VRAM.
        autoDriver:
          type: boolean
          default: true
          description: |
            Whether the agent declares and supervises a companion
            `inference-driver` that follows this runtime by name, so
            the model is routable the moment the engine is ready. The
            companion is `<name>-driver`; `Runtime.driver` reports it.
            Set false to front the runtime by hand — one hand-tuned
            driver pointed at an engine is still a supported shape, it
            is just no longer the only one. Decided 2026-09-10 over a
            declared pool: one driver per backend is the rule the
            contract has stated since M0, a runtime is a backend, and a
            pool would need allocation state and give drivers names
            that mean a different model every hour.
        idleUnloadSeconds:
          type: integer
          minimum: 0
          description: |
            Stop the engine after this many seconds with no request for
            its model through the gateway, releasing its GPU memory.
            Absent or 0 means never, which is every existing
            declaration's behaviour unchanged.

            **The gateway decides; this agent executes.** Only the
            gateway sees demand, so it tracks the last request per
            runtime and calls `POST .../stop` with `reason: idle` when
            this expires. A runtime with a request in flight is never
            stopped. Setting this also **opts the runtime into
            eviction**: when a `startOnDemand` model will not fit, the
            gateway may stop the most-idle runtimes that carry a timeout
            to make room. A model that must stay resident sets none.
        startOnDemand:
          type: boolean
          default: false
          description: |
            Start this runtime when a request arrives for its model and
            it is `stopped`. The gateway calls `POST .../start`, waits
            for `ready` (bounded by its `swapWaitSeconds`), and serves
            the request; the response says it did (`swapped_in`). With
            `autoStart: false` and `idleUnloadSeconds` set, this is
            llama-swap's model: declare five, load none, serve whichever
            is asked for, unload it when it goes quiet — several at
            once when they fit.

            False by default so that a hand-pressed Stop stays stopped.
        flags:
          type: object
          additionalProperties: true
          description: |
            Curated engine flags, keyed by the field names in the
            adapter's `flagSchema`. Validated on write: an unknown key
            is a 400, never a silent drop.

            This is the per-model settings surface — the reason
            "tweaking llama.cpp settings for every different model" is a
            complaint we answer. Values here are engine *launch* flags;
            sampling parameters that ride on each request are the
            gateway's, not these.
        extraArgs:
          type: array
          items:
            type: string
          description: |
            Verbatim extra arguments, appended after everything the
            adapter generated. The escape hatch for the long tail of
            flags a curated surface will always miss.

            Unvalidated by definition, so the UI must present it as the
            advanced option it is: a bad value here surfaces as an
            engine that refuses to start, and the resolved `argv` plus
            the captured engine output are how it gets diagnosed.
        env:
          type: object
          additionalProperties:
            type: string
          description: |
            Extra environment variables for the engine process. Needed
            more often than for a component — accelerator selection
            (`CUDA_VISIBLE_DEVICES`, `HIP_VISIBLE_DEVICES`) is how a
            runtime is pinned to one GPU, which is what makes two
            replicas on two cards possible.
        workingDirectory:
          type: string
          description: |
            Working directory for the engine process. Defaults to the
            binary's own directory, which is what prebuilt llama.cpp
            releases need to find their bundled shared libraries.
        binary:
          type: string
          description: |
            Override the binary for this one runtime, ignoring whatever
            the adapter discovered. For running one model on a custom
            build without disturbing the rest of the install.

    Runtime:
      type: object
      description: |
        Combined declarative + operational view of one engine process.
        The declarative half is `RuntimeSpec` and is persisted; the
        operational half is observed and is not.
      required:
        - name
        - engine
        - modelPath
        - status
      properties:
        name:
          type: string
        engine:
          $ref: "components/common.yaml#/components/schemas/EngineKind"
        modelPath:
          type: string
        localPath:
          type: string
          readOnly: true
          description: |
            Where **this host** opens the model: `modelPath` resolved
            through the Library folder's `mounts` for this OS and this
            node's `pathMappings` overrides, or `modelPath` itself when
            no rule applies (M11; the folder half 2026-09-14). Observed,
            never declared, and
            computed from the current mapping each time it is read — so
            a stopped runtime shows what its next start would open, and
            a mapping changed after declaration is visible before
            anything restarts. Equal to `modelPath` on every single-host
            install.

            **A local copy is resolved one step ahead of all of that**
            (`docs/design/node-local-model-copy.md`): where this node
            keeps a valid copy of the file, `localPath` is the copy and
            `localPathSource` says `copy`. Turning the copy off reverts
            this by itself, because nothing is stored — the answer is
            recomputed on every read.
        localPathSource:
          $ref: "#/components/schemas/RuntimeLocalPathSource"
        localPathNote:
          type: string
          readOnly: true
          description: |
            Why this node is **not** opening a local copy, when it is
            not and the operator asked for one: not enough free space to
            leave the configured headroom, the copy failed, the source
            could not be read. Absent when the copy was used, and absent
            when copying is switched off — a node that was never asked
            has nothing to explain.

            On the wire because a silently skipped copy is the failure
            mode of this whole feature: the model still serves, the
            launch still succeeds, and the only visible symptom is that
            it is four minutes slower than the operator expected.
        copyProgress:
          $ref: "#/components/schemas/CopyProgress"
        modelAlias:
          type: string
          description: Resolved alias — the declared value, or the derived filename.
        host:
          type: string
        port:
          type: integer
          description: Resolved port, including one assigned by the agent.
        autoStart:
          type: boolean
        autoDriver:
          type: boolean
        idleUnloadSeconds:
          type: integer
        startOnDemand:
          type: boolean
        flags:
          type: object
          additionalProperties: true
        extraArgs:
          type: array
          items:
            type: string
        env:
          type: object
          additionalProperties:
            type: string
        workingDirectory:
          type: string
        binary:
          type: string
        driver:
          type: string
          description: |
            Name of the companion `inference-driver` component the agent
            declared for this runtime, when `autoDriver` is true. What
            the gateway's routing table calls this backend, and the
            entry to read in `GET /v1/components` for its health. Absent
            when the operator fronts the runtime by hand.
        status:
          $ref: "#/components/schemas/RuntimeStatus"
        stopReason:
          $ref: "#/components/schemas/StopReason"
          description: |
            Why a `stopped` runtime is stopped. Present only in that
            state; cleared on start. An observation, not a declaration
            — it is never replicated, and after a control-root
            promotion the answer is re-read from this agent.
        url:
          type: string
          format: uri
          description: |
            Where this engine is actually listening
            (`http://<host>:<port>`). This is the value an
            inference-driver's `baseUrl` points at, and the reason a
            driver never needs to know about ports or argv.
        argv:
          type: array
          items:
            type: string
          description: |
            The exact command line the agent spawned, as the adapter
            resolved it. Read-only and reported deliberately: the first
            question anyone debugging a local engine asks is "what
            command did you actually run", and every tool that hides the
            answer makes that debugging worse. Copy-pasteable.
        pid:
          type: integer
          description: OS process id. Set only while the engine is alive.
        node:
          type: string
          description: |
            The node this runtime runs on — always *this* agent's node,
            since an agent supervises only its own host.

            Reported anyway, and this is why: the control root relays
            these into a union view across every node, and a runtime that
            arrived without a node would be a runtime the operator cannot
            locate. Filled from the agent's own identity rather than
            declared, so it cannot disagree with reality. Absent on an
            agent that has not enrolled, which is the only state in which
            "which node" has no answer.
        engineVersion:
          type: string
          description: Version reported by the binary that is actually running.
        capabilities:
          $ref: "#/components/schemas/RuntimeCapabilities"
        lastRestart:
          type: string
          format: date-time
        lastError:
          type: string
          description: |
            Most recent failure for this runtime — a spawn error, a
            non-zero exit, or a readiness probe that never passed.
            Cleared on a successful start.
        loadProgress:
          $ref: "#/components/schemas/LoadProgress"

    LoadProgress:
      type: object
      description: |
        How far into reading its model an engine is, **present only while
        that is a thing anyone can honestly say**.

        A large model on shared storage takes minutes to load, and for
        those minutes a healthy node and a hung one look identical: the
        status is `loading`, the engine answers 503, and nothing says
        whether bytes are moving. This is what distinguishes them.

        **Absent is the normal case, not an error.** It is absent
        whenever the read cannot be observed:

          * the engine **memory-maps** its model, which llama.cpp does by
            default — faulted pages are not read I/O, so the counter sees
            a few megabytes of header and then nothing. Measured
            2026-09-17 on Windows: 268 MB touched through a mapping moved
            `ReadTransferCount` by 0.0 MB, against +268.4 MB for the same
            bytes read normally, over SMB and on local disk alike;
          * the host has no counter this agent knows;
          * the runtime is not loading, or has no process.

        So a consumer renders a bar when this is present and elapsed time
        when it is not, and never infers one from the other. A field that
        was always present would force every consumer to invent the
        distinction, and one of them would get it wrong by showing a bar
        frozen at 0.1% for four minutes — which is the question this
        answers, made worse by looking authoritative.
      required:
        - bytesRead
        - source
      properties:
        bytesRead:
          type: integer
          format: int64
          description: |
            Bytes this engine process has read since it started. Includes
            whatever else it read — its own binary, CUDA libraries — which
            is noise against a model measured in gigabytes.
        totalBytes:
          type: integer
          format: int64
          description: |
            Size of the model file this runtime is opening, when it could
            be measured. Null when the path could not be stat'd, which is
            a share that has gone away — exactly when a load is worth
            watching, so progress is still reported without a percentage.
        bytesPerSecond:
          type: number
          format: double
          description: |
            Observed over a short window, so it tracks a share that has
            just got slower rather than averaging the whole load. Null on
            the first pair of readings.
        source:
          type: string
          description: |
            Which counter answered. On the wire so that "this host cannot
            measure it" stays distinguishable from "this engine is not
            reading" — both of which make the field absent, and only one
            of which is worth reporting to whoever runs the host.
          enum:
            - windows_io_counters
            - proc_io_rchar
            - rusage_diskio

    CopyProgress:
      type: object
      description: |
        How far into copying a model file to this node's own disk the
        agent is (`docs/design/node-local-model-copy.md`). Present
        exactly while `status` is `copying`, and absent otherwise.

        **The same shape as `LoadProgress` and deliberately not the same
        field**, because the two differ on the question that field
        exists to answer. `loadProgress` is absent whenever the bytes
        cannot be observed — llama.cpp maps its model and faulted pages
        are not read I/O — so a consumer reads *absent* as "show elapsed
        instead". Here the agent is the process doing the reading and
        the writing, so the bytes are never unobservable and absent can
        only mean "no copy is running". One field carrying both meanings
        would make every consumer invent the distinction, and this
        project has already paid for that once.

        It reports the copy of ONE model file — the file this runtime
        points at. Several runtimes over one file (M6 replicas) copy it
        once, so the second and third report the same copy while it runs
        and none of them afterwards.
      required:
        - bytesCopied
      properties:
        bytesCopied:
          type: integer
          format: int64
          description: Bytes written to the destination so far.
        totalBytes:
          type: integer
          format: int64
          description: |
            Size of the source file, when it could be measured. Null
            when the source could not be stat'd — a share that has gone
            away mid-copy, which is exactly when this is worth watching,
            so progress is still reported without a percentage.
        bytesPerSecond:
          type: number
          format: double
          description: |
            Observed over a short window rather than averaged over the
            whole copy, so a share that has just got slower shows it.
            Null on the first pair of readings.
        destination:
          type: string
          description: |
            Where the copy is being written, on this host. Reported
            because the operator picked the directory and the commonest
            question about a long copy is which disk is filling up.

            This is the **final** path, not the temporary name the bytes
            are actually landing in: a partial copy never carries the
            name an engine would open (§3.3 of the design), and naming
            the temp file here would invite someone to go looking for a
            file that exists only until the rename.

    ModelCopyClearResult:
      type: object
      description: |
        What `POST /v1/model-copies/clear` managed to delete, and what it
        did not.

        **It never stops a runtime to get at a file.** On Windows an open
        or mapped file cannot be deleted at all, so a running engine's
        copy is protected by the OS rather than by our code; on Linux the
        unlink succeeds, the engine keeps its inode, and the space comes
        back when that process exits — later than an operator watching a
        disk meter expects. Both are reported rather than smoothed over,
        because "I pressed Clear and the disk did not change" is
        otherwise indistinguishable from a bug.
      required:
        - deleted
        - skipped
      properties:
        deleted:
          type: array
          items:
            type: string
          description: Paths removed, on this host.
        bytesFreed:
          type: integer
          format: int64
          description: |
            Total size of what was deleted. On Linux this counts space
            that is only returned when a runtime still holding an inode
            exits, which is what `skipped` explains.
        skipped:
          type: array
          items:
            $ref: "#/components/schemas/ModelCopySkipped"
          description: One entry per copy that survived, with the reason.

    ModelCopySkipped:
      type: object
      required:
        - path
        - reason
      properties:
        path:
          type: string
        runtime:
          type: string
          description: The runtime holding it open, when that is why.
        reason:
          type: string
          description: |
            Plain-language reason this copy is still on disk — in use by
            a running runtime, permission denied, or the delete failed.
            Rendered as written; the UI does not classify it.

    RuntimeLocalPathSource:
      type: string
      readOnly: true
      description: |
        Which rule decided this runtime's `localPath`.

        The three values of `FolderReachSource`, plus `copy`. They are a
        separate enum rather than a shared one because a *folder* can
        never be a copy — a copy is made per model file, and putting
        `copy` in the folder enum would hand the Library's Folders page
        a value it can never receive and must still handle.

        * `same_path` — no rule applied; `modelPath` is opened as
          written. Every single-host install.
        * `inherited` — the Library folder's own `mounts` carried an
          entry of this host's OS shape.
        * `override` — this node's `pathMappings` named the folder.
        * `copy` — this node holds its own valid copy of the file and is
          opening that. Resolved ahead of the other three, which is why
          it can appear on a node that also has a mount: the mount is
          how the copy got here.
      enum:
        - same_path
        - inherited
        - override
        - copy

    RuntimeStatus:
      type: string
      enum:
        - copying
        - starting
        - loading
        - ready
        - stopped
        - exited
        - crashed
      description: |
        Operational state of an engine process. Distinct from
        `ComponentStatus`: an engine has no safe mode (nothing to
        recover a config from), and it has a model-load phase that a
        component does not.

        These are defined by what they *mean*, not by how any one engine
        reports them. That distinction is load-bearing, because the two
        engines report the load phase in opposite ways — see `loading`.

        * `copying` — this node is making its local copy of the model
          file, and **nothing has been spawned yet**
          (`docs/design/node-local-model-copy.md`). It is its own state
          rather than `starting` for the reason the list above is
          defined by meaning: `starting` says *spawned, and we have no
          information yet*, and there is no process here at all. Folding
          it in would put a multi-minute wait behind a word that
          promises a process — the same "healthy and broken look
          identical" window this feature exists to close. `copyProgress`
          says how far along, and unlike `loadProgress` it is always
          present in this state, because the agent is the one moving the
          bytes. Only reachable on a node with `modelCopyEnabled`; a
          copy that is skipped or already valid never enters it.
        * `starting` — spawned, and we have no information yet. Not "the
          probe failed": the honest gap between spawning a process and
          learning anything about it.
        * `loading` — the engine is alive and working, and is not
          servable yet. Worth its own state rather than folding into
          `starting`: a large quant off a spinning disk can sit here for
          minutes, and an operator staring at a dashboard needs to know
          the difference between "working on it" and "wedged".

          How it is *observed* is per-engine, and this is most of why
          readiness is per-adapter rather than a shared TCP check.
          `llama-server` says so itself, answering `/health` with 503
          and a loading status. **vLLM does the opposite:** it binds its
          port before loading the model and does not answer at all until
          the model is in memory, so for minutes it is
          indistinguishable — over the network alone — from a process
          that died.

          Hence the rule: for an engine that does not answer while
          loading, *the process being alive while nothing answers* **is**
          `loading`. There is nothing else it could be. That inference
          needs the process handle, which the supervisor has and a
          network probe does not, and it is why lifecycle adapters live
          here rather than in the driver. An engine like that also needs
          a per-adapter startup budget to keep "working on it" separable
          from "wedged"; vLLM's is minutes, because CUDA graph capture
          and compilation dominate it.
        * `ready` — model loaded and serving. The only state in which
          the gateway will route to it.
        * `stopped` — deliberately stopped, or declared with
          `autoStart: false`. Not an error; the respawn loop is
          suppressed.
        * `exited` — exited cleanly and is being respawned (transient).
        * `crashed` — could not be launched, or exited non-zero. If this
          process never became ready, automatic retries stop immediately
          rather than repeating a failed model load. After readiness,
          unexpected non-zero exits retry with back-off up to five
          consecutive crashes; 60 seconds of continuously observed ready
          time resets that history. Loading time does not count as useful
          uptime. `lastError` and the captured engine output say why;
          `POST .../restart` retries after settings have been corrected.

    RuntimeCapabilities:
      type: object
      description: |
        What the running engine reports about itself, read back after it
        becomes ready rather than inferred from the declaration. The
        gateway keys routing decisions off these; the UI displays them.
      properties:
        contextLength:
          type: integer
          minimum: 0
          description: |
            Effective context window of the loaded model, as the engine
            resolved it — which is not necessarily what was asked for.
            A requested context larger than the model or the available
            memory gets clamped by the engine, and the clamped value is
            the true one.
        parallelSlots:
          type: integer
          minimum: 1
          description: |
            Concurrent requests this runtime can serve. The unit of
            capacity the gateway divides work across, so a single
            runtime with several slots and several runtimes with one
            each are the same kind of thing to the layer above.
        embeddings:
          type: boolean
          description: Whether this runtime was started in embedding mode.
        vision:
          type: boolean
          description: Whether the loaded runtime explicitly reports image input.
        multimodal:
          type: boolean
          description: Whether a projector was loaded alongside the model.

    StopRequest:
      type: object
      description: |
        Optional body for `POST /v1/runtimes/{name}/stop`, saying why.
        Recorded as `Runtime.stopReason` so the dashboard can explain a
        stopped model. Absent means `operator`.
      properties:
        reason:
          $ref: "#/components/schemas/StopReason"

    StopReason:
      type: string
      enum:
        - operator
        - idle
        - autoStart
      description: |
        * `operator` — an explicit stop, from the UI or the API.
        * `idle` — the gateway unloaded it after `idleUnloadSeconds`
          passed with no request for its model. It comes back on the
          next request if `startOnDemand` is set.
        * `autoStart` — declared with `autoStart: false` and never
          started in this agent's lifetime.

        A reason beside `status: stopped` rather than three new members
        of `RuntimeStatus`, because the state is the same state — the
        process is not running and the respawn loop is suppressed — and
        only the cause differs.

    Admission:
      type: object
      description: |
        Whether a runtime would fit on the device it targets, right now,
        and the arithmetic behind the answer. Returned by
        `POST /v1/runtimes/admission`, and the reasoning behind a 422
        from `POST /v1/runtimes` or `POST /v1/runtimes/{name}/start`.

        Deliberately **not** the library's `Fit`. That schema describes
        a model against a host for the discovery screen; this one
        decides a launch of one spec on one device and names what to do
        about a refusal. They overlap on the verdict words and diverge
        on everything else, and sharing them would couple the discovery
        screen to the supervisor.

        Since M11 it also answers the question that comes before memory:
        is the model on this host at all. `location` is where the
        declared path resolves on this node and whether anything is
        there, and a `refuse` with `fit: unknown` is that answer being
        no.

        Since 2026-09-19 it also answers against memory that is spoken
        for but not yet taken: `reservedBytes`. Free memory is a live
        reading, and a launch spends it over the minutes it takes to
        copy and load a file, so two launches in quick succession were
        both admitted against the same free card.
      required:
        - decision
        - fit
        - basis
        - reason
      properties:
        decision:
          $ref: "#/components/schemas/AdmissionDecision"
        fit:
          $ref: "#/components/schemas/AdmissionFit"
        basis:
          $ref: "#/components/schemas/AdmissionBasis"
        requiredBytes:
          type: integer
          format: int64
          minimum: 0
          description: |
            What the launch is estimated to need on the device — weights
            plus KV cache at the requested context plus an overhead
            allowance when the library computed it; file size plus an
            estimated KV cache at that same context, plus an overhead
            allowance, when it did not.

            The fallback estimate scales with the context asked for, and
            said so from 2026-09-19. A flat fraction of the file was the
            same defect the library had already fixed in its own
            estimate: the context control changes the number echoed back
            on the screen and cannot change a verdict, so an 8B Q4 asked
            for at 128k was admitted against 5.5 GB when the cache alone
            is about three times the weights.
        freeBytes:
          type: integer
          format: int64
          minimum: 0
          description: |
            Free memory on the largest single target device at the
            moment of measurement. Free, not total: M3 measured 2.9 GiB
            of a 32 GiB card held on an idle desktop.

            **The verdict is computed against this minus
            `reservedBytes`**, not against this. Reporting the reduced
            number here instead would be a claim about the card that is
            not true.
        reservedBytes:
          type: integer
          format: int64
          minimum: 0
          description: |
            Memory this node has already promised to launches that have
            not taken it yet, on that same device, and which was
            therefore subtracted from `freeBytes` before the verdict.
            Absent or `0` when nothing is in flight.

            It exists because free memory is a live reading and a launch
            spends it slowly. A runtime that was admitted three seconds
            ago has read no weights; one that is `copying` has no
            process at all, for as long as the file takes to cross the
            wire. Without this, two launches in quick succession both
            measured the same free memory and both were told `fits`, the
            second one for memory the first had already spent.

            Released when the runtime is next observed past its start,
            when it is stopped or deleted, or on a timeout, so an
            abandoned launch cannot hold a card for the life of the
            process. A dry run never adds to it; declaring a runtime
            that starts does, `force` included, because `force` is the
            operator overriding the verdict and not the launch becoming
            free.
        totalBytes:
          type: integer
          format: int64
          minimum: 0
        device:
          $ref: "components/common.yaml#/components/schemas/ComputeDevice"
          description: The device the verdict is about.
        contextLength:
          type: integer
          minimum: 0
          description: |
            The context the KV cache was sized for — the spec's
            `contextSize`, or the model's own context when the spec
            leaves it to the engine, and the default this agent
            assumed when neither was known and the estimate came from
            the file's size.
        maxContextLength:
          type:
            - integer
            - "null"
          minimum: 0
          description: |
            The largest `contextSize` at which this file fits entirely in
            the target device's free memory, from the library's fit model
            scored against the budget this agent measured. Rounded down
            to a multiple of 256. `null` when the library was not
            consulted (`basis: file_size`), and `0` when the weights
            alone do not fit, so no context makes it true.

            **This is the number a refusal should hand back.** Added
            2026-09-15 after Discover scored a 27B Q6 as `fits` at its
            8,192-token guidance context, the operator made a default
            profile that left `contextSize` to the engine, and admission
            refused it at the model's own 262,144 — 41 GiB against 30 —
            with advice to "lower contextSize" and no number. The two
            screens had never disagreed about the model, only about the
            context, and neither said so. A profile form prefills from
            this; a refusal offers it as a one-click fix.
        blockers:
          type: array
          items:
            $ref: "#/components/schemas/AdmissionBlocker"
          description: |
            Runtimes holding memory on that device, or on their way to
            holding it, most idle first. `copying` counts: no process
            exists yet, and it is the longest part of a first launch on
            a remote mount. What an operator would stop to make room, and the
            list the gateway's opt-in eviction walks — restricted there
            to runtimes that declared `idleUnloadSeconds`.
        location:
          $ref: "#/components/schemas/ModelLocation"
          description: |
            Where the declared model is on this host, and whether it is
            (M11). Present on every answer from an agent that computes
            it; absent from an older agent.
        reason:
          type: string
          description: |
            The decision in prose, naming the numbers. A refusal that
            does not say why is the complaint this endpoint exists to
            answer.
        warning:
          type: string
          description: |
            Present when the budget could not be fully measured — no
            vendor tool, an unreadable device, a detection path
            unverified on real hardware. An `admit` with a warning is
            an admit on faith, and says so.

    AdmissionDecision:
      type: string
      enum:
        - admit
        - refuse
      description: |
        Refuse, never queue (decided 2026-09-10). A refusal carries its
        numbers and is overridable with `force`; the on-demand path is
        how a model that does not fit right now gets loaded when it is
        actually asked for.

    AdmissionFit:
      type: string
      enum:
        - fits
        - tight
        - split
        - no
        - unknown
      description: |
        The same four words the library's guidance uses, plus `unknown`,
        mapped onto a decision by what the spec asked for. `fits` admits.
        `tight` — inside total memory but not free memory — and `split`
        — needs host memory too — refuse a full-offload launch and admit
        one whose `gpuLayers` is set below full, because then the
        operator chose partial offload. `no` refuses. `unknown` admits
        with a warning: a verdict from a budget that could not be
        measured is worse than none.

    AdmissionBasis:
      type: string
      enum:
        - metadata
        - file_size
      description: |
        * `metadata` — the library computed required bytes from the
          model's real metadata at the requested context. Present when
          a `library` component is in this agent's topology and
          answered.
        * `file_size` — the model file's size plus a fixed allowance.
          What an agent with no library reachable can measure on its
          own, said out loud rather than dressed up.

    AdmissionBlocker:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          description: A runtime holding memory on the device.
        status:
          $ref: "#/components/schemas/RuntimeStatus"
        idleUnloadSeconds:
          type: integer
          description: |
            Its declared idle timeout, when it has one. Only a runtime
            with one is ever evicted by the gateway; the rest are here
            so the operator knows what is holding the memory.
        evictable:
          type: boolean
          description: |
            Whether the gateway may stop this runtime to make room —
            true exactly when it declared `idleUnloadSeconds`.

    ModelLocation:
      type: object
      description: |
        Where a declared model path lands on this host (M11).

        The library describes a model by its path on the library's own
        host; a node that runs the engine elsewhere reaches the same
        file through a `pathMappings` rule, or not at all. This is the
        resolution, reported with the declaration so an operator sees
        both spellings — and reported on the admission dry run so the
        launch screen can say what will happen before the button is
        pressed.
      required:
        - path
        - localPath
        - exists
      properties:
        path:
          type: string
          description: The path as declared — the library's spelling.
        localPath:
          type: string
          description: |
            The path this host would open: `path` through the rule in
            `mapping`, or `path` itself when none applied.
        exists:
          type: boolean
          description: |
            Whether `localPath` names a file or directory on this host,
            at the moment of measurement. False is what turns the
            decision to `refuse`.
        mapping:
          $ref: "components/common.yaml#/components/schemas/PathMapping"
          description: The rule that applied, when one did.
        sizeBytes:
          type: integer
          format: int64
          minimum: 0
          description: |
            Bytes at `localPath` on this host — one file, or every file
            under a directory. Absent when it does not exist or could
            not be measured.
        librarySizeBytes:
          type: integer
          format: int64
          minimum: 0
          description: |
            What the library says the same thing is: its weights file
            for a file path, its whole `sizeBytes` for a directory.
            Absent when no library answered.
        sizeMatchesLibrary:
          type: boolean
          description: |
            Whether the two sizes agree. Absent when either is absent.
            False is a warning and not a refusal: a stale library scan
            after an upstream replacement is likelier than a mapping
            that points at a look-alike, and the engine will say if the
            file is broken. What this cannot catch, and does not
            pretend to, is a different file of the same size.

    LibraryFolderCheckRequest:
      type: object
      description: |
        Optional overrides for `POST /v1/library/folders/check`. Same
        idea as `ConfigTestRequest`: what is sent stands in for the
        saved value for this answer only.
      properties:
        pathMappings:
          type: array
          items:
            $ref: "components/common.yaml#/components/schemas/PathMapping"
          description: |
            This node's overrides as they would be after an unsaved
            edit. Absent means the saved ones.

    LibraryFolderReach:
      type: object
      description: |
        The answer to "how does this node reach each Library folder",
        one row per folder (2026-09-14).
      required:
        - libraryConsulted
        - folders
      properties:
        libraryConsulted:
          type: boolean
          description: |
            Whether the library answered during this call. False means
            the rows come from this node's last copy of its folder
            list, or there are none because it has never been read —
            `folders` is then empty and `folderListAgeSeconds` absent,
            and the declaration check on `POST /v1/runtimes` is being
            skipped with a warning.
        folderListAgeSeconds:
          type: integer
          minimum: 0
          description: |
            How long ago the folder list was last read from the library.
            Zero when `libraryConsulted`. Absent when never.
        libraryUrl:
          type: string
          description: Where the library was, or was looked for.
        folders:
          type: array
          items:
            $ref: "#/components/schemas/LibraryFolderStatus"

    LibraryFolderStatus:
      type: object
      description: One Library folder as this host reaches it.
      required:
        - path
        - localPath
        - source
        - exists
      properties:
        path:
          type: string
          description: The folder as the library spells it.
        localPath:
          type: string
          description: The path this host would open for it.
        source:
          $ref: "#/components/schemas/FolderReachSource"
        mount:
          type: string
          description: |
            The folder's mount this host's OS shape selected, when the
            source is `inherited`. Absent otherwise.
        override:
          $ref: "components/common.yaml#/components/schemas/PathMapping"
          description: The `pathMappings` rule that applied, when one did.
        exists:
          type: boolean
          description: Whether `localPath` exists on this host, now.
        isDirectory:
          type: boolean
          description: Whether it is a directory. Absent when it does not exist.
        modelsUnder:
          type: integer
          minimum: 0
          description: |
            How many models the library lists under this folder. Absent
            when the library was not consulted.
        modelsReachable:
          type: integer
          minimum: 0
          description: |
            How many of those exist at their resolved path here. Absent
            with `modelsUnder`.
        problem:
          type: string
          description: |
            What is wrong, in a sentence, when something is: the path
            is missing, not a directory, or models the library lists
            are not where the rule says. Absent when nothing is.

    FolderReachSource:
      type: string
      description: |
        Which rule decided a folder's `localPath` on this host.

        * `same_path` — no rule applied; the folder's own path is
          opened as written. Every single-host install, and any node
          that mounts the share at the same path the library uses.
        * `inherited` — the folder's `mounts` carried an entry of this
          host's OS shape. Stated once on the Library, nothing on this
          node.
        * `override` — this node's `pathMappings` named the folder, and
          won.
      enum:
        - same_path
        - inherited
        - override

    # -------- Apps: optional spokes --------

    AppManifest:
      type: object
      additionalProperties: false
      description: |
        What an app is, how to install it, and what it needs from the hub.
        The shipped catalogue is a list of these; so is a custom entry.

        **Nothing here grants anything on the hub.** An app receives a
        client key scoped by `uses` and the addresses it needs, and no
        service token, signing key or master key — the same things a
        third-party client could be given, which is the rule the design
        calls *our spokes get no back doors*.

        **What an app owes the agent** is small: bind the port in
        `EUGENE_PLEXUS_APP_BIND_PORT` (on `EUGENE_PLEXUS_APP_BIND_HOST`
        when set, loopback otherwise) and answer `GET /healthz` with a
        2xx once it is serving — an app that never does reads `starting`
        for as long as it runs. It finds its key in the file named by
        `EUGENE_PLEXUS_APP_KEY_FILE`, the gateway at
        `EUGENE_PLEXUS_APP_GATEWAY_URL` (absent when none could be
        found), keeps its state under `EUGENE_PLEXUS_APP_DATA_DIR`, and —
        with `configTrio` — requires `EUGENE_PLEXUS_APP_ADMIN_TOKEN` as
        the bearer on its config trio.
      required: [id, name, source, version, package, entry]
      properties:
        id:
          type: string
          pattern: "^[a-z][a-z0-9-]{1,39}$"
          description: |
            Stable identifier: a directory name under the node's `apps`
            directory, part of the key's name, and the path segment in
            `/v1/apps/{id}`. Lowercase so two spellings cannot be two apps.
        name:
          type: string
          minLength: 1
          maxLength: 80
          description: What a person calls it.
        summary:
          type: string
          maxLength: 400
          description: One or two sentences for the catalogue card.
        homepage:
          type: string
          format: uri
          description: Where to read about it. Display only.
        source:
          type: string
          minLength: 1
          description: |
            What `uv pip install` is given, as `<package> @ <source>`: an
            `https://` archive URL — for a GitHub repo,
            `https://github.com/<owner>/<repo>/archive/<commit>.tar.gz` —
            or, for a custom entry, a directory on this node holding the
            package (a developer's own checkout). The shipped catalogue
            uses archive URLs at pinned commits, the way the installers
            pin the hub's own packages.
        version:
          type: string
          minLength: 1
          maxLength: 64
          pattern: "^[A-Za-z0-9._+-]+$"
          description: |
            The label this install is recorded under and the name of its
            environment's directory — the commit, for a catalogue entry.
            Updating an app is installing a different `version`.
        package:
          type: string
          minLength: 1
          description: The distribution name, e.g. `eugene-plexus-chat`.
        entry:
          type: string
          pattern: "^[A-Za-z_][A-Za-z0-9_]*(\\.[A-Za-z_][A-Za-z0-9_]*)*$"
          description: |
            The module run as `python -m <entry>` with the app's own
            interpreter. The install imports it once before it counts as
            installed, so a package that installs and cannot start is a
            failed install rather than a crash loop later.
        python:
          type: string
          default: "3.12"
          pattern: "^3\\.[0-9]+$"
          description: The Python the app's environment is built with.
        ui:
          type: boolean
          default: false
          description: |
            Whether the app serves a browser UI on its port. A UI is
            opened on the app's own origin and never embedded in or
            proxied through the console: the console's origin holds the
            operator session and an unauthenticated proxy to every
            component, and anything running there has operator authority.
        configTrio:
          type: boolean
          default: false
          description: |
            Whether the app serves `GET /v1/config`, `GET
            /v1/config/schema` and `PATCH /v1/config`, requiring the admin
            token this agent hands it at each spawn. Required of apps we
            ship; optional for a custom entry, whose page then shows
            status, logs and Open only.
        uses:
          type: array
          uniqueItems: true
          items:
            $ref: "#/components/schemas/AppHubSurface"
          default: [inference]
          description: The hub surfaces the app's key is scoped to.

    AppHubSurface:
      type: string
      enum:
        - inference
      description: |
        A public hub surface an app's client key may be used on.

        * `inference` — the gateway's client doors (`/v1/models`,
          `/v1/chat/completions` and the rest), under A5's default
          limits. The operator narrows or widens the key like any other.

        One member today on purpose. A trainer depositing models into the
        Library would add a second, together with the Library endpoint it
        names, when a trainer exists to use it — not before.

    AppOrigin:
      type: string
      enum:
        - catalogue
        - custom
      description: |
        * `catalogue` — shipped with this agent release.
        * `custom` — added by an operator on this node.

    AppCatalogueEntry:
      type: object
      required: [manifest, origin]
      properties:
        manifest:
          $ref: "#/components/schemas/AppManifest"
        origin:
          $ref: "#/components/schemas/AppOrigin"
        installedVersion:
          type: string
          description: |
            The version installed on this node, when one is. Differs from
            `manifest.version` when an update is available.

    AppCatalogue:
      type: object
      required: [apps, installable]
      properties:
        apps:
          type: array
          items:
            $ref: "#/components/schemas/AppCatalogueEntry"
        installable:
          type: boolean
          description: Whether this node can install apps at all.
        reason:
          type: string
          description: "Why not, and what to do. Present when `installable: false`."

    AppInstall:
      type: object
      description: |
        Progress of one install. Named phases, as for engines, because
        they fail for different reasons: `creating` is the Python
        download, `installing` is the package index and the network, and
        `verifying` failing means the package installed and cannot start.
      required: [app, state]
      properties:
        app:
          type: string
        version:
          type: string
        state:
          type: string
          enum:
            - resolving
            - creating
            - installing
            - verifying
            - done
            - failed
            - cancelled
          description: |
            * `resolving` — reading the catalogue and minting the key.
            * `creating` — building the environment with the manifest's
              Python.
            * `installing` — installing the package into it.
            * `verifying` — importing `entry` with that interpreter.
            * `done` / `failed` / `cancelled` — terminal, and retained
              until the next install of this app starts.
        message:
          type: string
          description: What is happening now, for a status line.
        error:
          type: string
          description: |
            Populated when `state: failed`: the tail of the tool's own
            output where there is one, because "install failed" is the
            one message nobody can act on.
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time

    AppList:
      type: object
      required: [apps]
      properties:
        apps:
          type: array
          items:
            $ref: "#/components/schemas/App"

    App:
      type: object
      description: |
        One installed app: what was installed (persisted in `apps.yaml`
        beside `agent.yaml`) and what the agent observes now.

        `apps.yaml` is a separate file on purpose. An entry this agent
        cannot read degrades the apps alone — the file is kept as
        `apps.yaml.unreadable` and `/healthz` says why — and never takes
        the topology, runtimes or passphrase with it.
      required: [id, name, version, origin, enabled, status, port, ui, configTrio, uses]
      properties:
        id:
          type: string
        name:
          type: string
        version:
          type: string
        previousVersion:
          type: string
          description: The environment kept for rollback, when there is one.
        origin:
          $ref: "#/components/schemas/AppOrigin"
        node:
          type: string
          description: This node's name, when it has one.
        enabled:
          type: boolean
          description: |
            Whether the operator wants it running. Start and stop set it,
            and it survives the agent restarting.
        status:
          $ref: "#/components/schemas/ComponentStatus"
        port:
          type: integer
          description: |
            The port it binds, allocated from 8190-8289 and persisted so
            its address does not change between restarts.
        uiUrl:
          type: string
          format: uri
          description: |
            Where a browser opens its UI: this node's advertised host with
            the app's port, or loopback on a node that advertises none.
            Present only for an app with `ui: true`.
        gatewayUrl:
          type: string
          format: uri
          description: |
            The gateway address handed to the app at its last start — the
            local gateway when this node runs one, otherwise the owning
            node's agent proxy (`<agent>/api/proxy/gateway`), which is the
            same public path a browser uses and survives a port remap that
            a component address does not. Absent when none could be found;
            an app we ship then says so and takes an address in its own
            config.
        ui:
          type: boolean
        configTrio:
          type: boolean
        uses:
          type: array
          items:
            $ref: "#/components/schemas/AppHubSurface"
        keyId:
          type: string
          description: |
            The client key minted for it. Revoking that key cuts the app
            off from the hub; uninstalling revokes it.
        keyName:
          type: string
        installedAt:
          type: string
          format: date-time
        pid:
          type: integer
        lastRestart:
          type: string
          format: date-time
        lastError:
          type: string
        detail:
          type: string
          description: |
            Something the operator should know that is not an error — the
            gateway could not be found, say — in words they can act on.
