servers:
  - url: http://{host}:{port}
    description: Default LAN deployment.
    variables:
      host:
        default: localhost
      port:
        default: '8080'

security:
  - bearerAuth: []

tags:
  - name: tools
    description: Tools run through the install's accounts, with the caller's key limits.
  - name: inference
    description: |
      The OpenAI-compatible front door. snake_case field names and
      OpenAI's error envelope, unlike everything else here — see the
      note above `/v1/models` in `paths`.
  - name: files
    description: |
      Files and uploads kept for their owner by the install's store (row
      53), in OpenAI's shapes, and in Anthropic's for its Files API.
  - name: admin
    description: Inspect and manage the running gateway.
  - name: config
    description: |
      Remote-editable configuration. Every Eugene Plexus component
      implements the same config trio (`GET /v1/config`,
      `GET /v1/config/schema`, `PATCH /v1/config`) so a single UI can
      manage all components without per-component code.
  - name: metrics
    description: |
      Retained per-backend latency, throughput and failure counts.
      Gateway-local and deliberately not replicated: these are
      per-request measurements of one process's traffic, further from
      install-wide truth than liveness, which M5 already settled is
      never in the log.
  - name: meta
    description: Versioning and health.

paths:
  /v1/runtimes/switch:
    post:
      tags: [admin]
      operationId: switchRuntime
      summary: Drain one model, stop it, and start another saved runtime on the same node.
      description: |
        Operator-only. Holds both runtimes out of this gateway's routing
        while draining requests, stopping the source and starting the
        target. Source and target keep their own aliases. Returns 409
        without stopping the source when it cannot drain within 30 seconds.
        Returns 202 when the target start is scheduled; the owning agent's
        runtime status reports loading, ready or failed. Only ready models
        receive traffic. No requests are replayed and no models are evicted
        automatically. Both runtimes must use the same engine and have
        startOnDemand disabled. Direct engine traffic is outside this gateway.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RuntimeSwitchRequest"
      responses:
        "202":
          description: Source stopped and target start accepted.
          content:
            application/json:
              schema:
                $ref: "components/common.yaml#/components/schemas/RestartResult"
        "409":
          description: Busy, incompatible, or unable to complete the switch; detail explains recovery.
  /v1/roles:
    get:
      tags: [admin]
      operationId: listRoles
      summary: List every model role and its assigned models in order.
      description: |
        Every `ModelRole`, including roles with no models, with its label,
        required capability and models in the effective `modelSlots`
        configured order. Assignments come from slots named `role:<role>`;
        other slots are not roles. This is one list per role for the whole
        install. Edit assignments through `PATCH /v1/config`.

        Each model reports whether it has the required capability: `yes`,
        `no` or `unknown`, with the cause of a negative or unknown finding.
        A configured model whose capability cannot be established stays in
        the list as `unknown`. Capability findings warn; they never block
        role assignment. An untested capability is not evidence of a lack.
      responses:
        '200':
          description: Every role, including unassigned roles, with effective assignments.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelRoleList'
              example:
                roles:
                  - role: chat
                    label: Chat
                    requiredCapability: chat
                    models: []
                  - role: agentic
                    label: Agentic (tools and code)
                    requiredCapability: toolCalling
                    models: []
                  - role: vision
                    label: Sees images
                    requiredCapability: imageInput
                    models: []
                  - role: reads-pages
                    label: Reads pages (OCR)
                    requiredCapability: imageInput
                    models:
                      - model: vision-unchecked
                        capability: unknown
                        reason: No reachable driver reports capabilities for vision-unchecked.
                      - model: vision-local
                        capability: 'yes'
                        reason: null
                      - model: text-only
                        capability: 'no'
                        reason: The provider lists text input only for text-only.
                  - role: image
                    label: Makes images
                    requiredCapability: image
                    models: []
                  - role: speech-to-text
                    label: Hears speech
                    requiredCapability: transcription
                    models: []
                  - role: text-to-speech
                    label: Speaks
                    requiredCapability: speech
                    models: []
                  - role: music
                    label: Makes music
                    requiredCapability: audioOutput
                    models: []
                  - role: embeddings
                    label: Embeddings
                    requiredCapability: embeddings
                    models: []
                  - role: rerank
                    label: Reranks
                    requiredCapability: rerank
                    models: []
                  - role: decision
                    label: Decisions (yes/no)
                    requiredCapability: decision
                    models: []

  # -------- The OpenAI-compatible front door --------
  #
  # These two operations are the only ones in Eugene Plexus that use
  # snake_case field names and a non-problem+json error envelope. That is
  # deliberate and not negotiable: "OpenAI-compatible" is worth nothing
  # unless an unmodified OpenAI SDK can point its base_url here and work.
  # Renaming `max_tokens` to `maxTokens` for house-style consistency
  # would break every client, which is the entire audience.

  /v1/models:
    get:
      tags:
      - inference
      operationId: listModels
      summary: List every model the gateway can currently route to.
      description: |
        OpenAI-compatible model list. This is how a client discovers
        what to put in `ChatCompletionRequest.model`, and it is a view
        of the routing table rather than a configured list: the gateway
        asks every `inference-driver` in the agent topology what it
        serves and reports the union.

        A model appears here when at least one driver serving it is
        reachable. Two drivers serving the same model produce one entry,
        not two — replicas are a routing detail, and a client should not
        have to know how many GPUs are behind a name.

        Each role with assigned models also appears as `role:<name>`,
        with `x_eugene_plexus.role` giving its role and label. A role with
        no models is omitted. These names use the same slot routing and
        fallback as other `modelSlots` entries.

        Gemini SDK compatibility (row 58): the response also carries Gemini model fields; /v1/models
        includes models and nextPageToken alongside the existing OpenAI object/data. Both
        projections describe the same caller-visible page. Unknown limits are omitted. Requests with
        x-goog-api-key or ?key= receive GeminiErrorResponse errors; existing bearer-only catalogue
        errors retain their OpenAI shape. A query key is redacted from every log, error and metrics
        record. The v1beta catalogue always uses Gemini shapes. Model-name mapping never widens key
        scope.
      responses:
        '200':
          description: Available models.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelList'
      security:
      - bearerAuth: []
      - geminiApiKeyAuth: []
      - geminiQueryKeyAuth: []
      parameters:
      - name: pageSize
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 1000
        description: Page size. Omitted returns all visible models, preserving the OpenAI catalogue default.
      - name: pageToken
        in: query
        schema:
          type: string
        description: Opaque nextPageToken from the preceding response.
  /v1/models/{model}:
    get:
      tags:
      - inference
      operationId: retrieveModel
      summary: One model, as the list shows it.
      security:
      - bearerAuth: []
      - geminiApiKeyAuth: []
      - geminiQueryKeyAuth: []
      description: |
        OpenAI's `GET /v1/models/{model}` (P6): the same object
        `GET /v1/models` lists for this caller, `x_eugene_plexus`
        included. **The id may contain slashes** (an account's
        `openrouter/anthropic/claude-opus-5.5`), and the path takes the
        rest of the URL as the id. A model this key may not use is a 404,
        as one that does not exist is, so a scoped key learns nothing of
        what it cannot reach.

        Gemini SDK compatibility (row 58): the response also carries Gemini model fields; /v1/models
        includes models and nextPageToken alongside the existing OpenAI object/data. Both
        projections describe the same caller-visible page. Unknown limits are omitted. Requests with
        x-goog-api-key or ?key= receive GeminiErrorResponse errors; existing bearer-only catalogue
        errors retain their OpenAI shape. A query key is redacted from every log, error and metrics
        record. The v1beta catalogue always uses Gemini shapes. Model-name mapping never widens key
        scope.
        Known Eugene ids resolve directly, configured Gemini aliases next, then role:chat. The
        response name describes the requested resource; modelVersion on generation names the actual
        serving model.
      parameters:
      - name: model
        in: path
        required: true
        schema:
          type: string
        description: The model's id, slashes included.
      responses:
        '200':
          description: The model.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Model'
        '401':
          description: Missing, malformed, expired or revoked credential.
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/OpenAIErrorResponse'
                - $ref: '#/components/schemas/GeminiErrorResponse'
        '404':
          description: No model by that id that this caller may use (`code` `model_not_found`, as OpenAI's).
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/OpenAIErrorResponse'
                - $ref: '#/components/schemas/GeminiErrorResponse'

  /v1beta/models/{model}:generateContent:
    parameters:
    - name: model
      in: path
      required: true
      schema:
        type: string
      description: |-
        Requested model name, slashes included. Remove only the leading models/ resource prefix.
        Known Eugene ids resolve directly, then explicit geminiModelNames, then role:chat
        (R58-NAMES). Resolved targets retain key scope and localOnly checks.
    post:
      tags:
      - inference
      operationId: generateGeminiContentBeta
      summary: Generate a Gemini content response.
      security:
      - bearerAuth: []
      - geminiApiKeyAuth: []
      - geminiQueryKeyAuth: []
      description: |-
        Gemini API door on the same shared path as Chat Completions, Messages and Responses: the
        same keys, routing, role resolution, failover, metrics and server-run web search. Unknown
        model names resolve to role:chat by default; geminiModelNames overrides them, and a known
        Eugene model id is used directly. Key model scope is checked after resolution, never
        bypassed by an alias. Slashes in Eugene ids are part of {model}.

        contents text and inlineData images/audio/PDF become shared messages and attachments under
        the existing limits. functionCall and functionResponse become tool calls and results;
        systemInstruction becomes the system message. functionDeclarations takes parameters or
        parametersJsonSchema; toolConfig.functionCallingConfig maps AUTO, ANY, NONE and
        allowedFunctionNames to tools and tool_choice. googleSearch uses the hub's
        web_search_options and the same tool and locality permissions.

        generationConfig temperature, topP, topK, maxOutputTokens, stopSequences and seed map to
        their shared settings. application/json with responseSchema or responseJsonSchema becomes
        structured output, including the CLI routing classifier. thinkingConfig maps thinkingLevel
        or thinkingBudget to reasoning effort; includeThoughts controls returning thought parts.
        candidateCount greater than one is a 400 naming candidateCount. safetySettings is accepted
        and named in x-eugene-plexus-ignored-settings because no local safety filter runs. Any other
        known setting that cannot be carried is refused naming its field and observed cause; unknown
        or untested model capability never blocks an attempt.

        The answer reports the actual serving model in modelVersion and the x-eugene-plexus-*
        envelope headers. SAFETY is returned only for an observed content_filter. Query key values
        are redacted from every log, trace, error and metric, including access logs and failures
        before routing. Gemini errors use error.code, message and status. All these front-door
        routes participate in CORS; x-goog-api-key is accepted and envelope headers are exposed, as
        on the other doors.
      responses:
        '200':
          description: Gemini response. The x-eugene-plexus-* envelope headers identify the actual serving
            path.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeminiGenerateContentResponse'
        '400':
          description: Invalid or unsupported request; names the field and observed cause.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeminiErrorResponse'
        '401':
          description: Missing or invalid caller key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeminiErrorResponse'
        '403':
          description: Key scope, tool permission or localOnly refusal.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeminiErrorResponse'
        '404':
          description: The resolved model or role has no assignment visible to this key; names it and where
            to configure it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeminiErrorResponse'
        '429':
          description: Client rate or concurrency limit reached.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeminiErrorResponse'
        '499':
          description: The caller disconnected; the backend request was cancelled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeminiErrorResponse'
        '502':
          description: |-
            All eligible backends failed, or the backend's own credential was refused; the message
            identifies the observed cause.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeminiErrorResponse'
        '503':
          description: Gateway starting, safe mode, or no eligible backend ready.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeminiErrorResponse'
        '504':
          description: Backend request timed out; names the observed timeout.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeminiErrorResponse'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GeminiGenerateContentRequest'
