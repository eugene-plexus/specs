  /v1/web_search:
    post:
      tags: [tools]
      operationId: webSearch
      summary: Search through the install's accounts for Open WebUI.
      security:
        - bearerAuth: []
      description: |
        The shape Open WebUI's external search engine sends and reads
        (row 34). The gateway runs `server_tools.SearchRunner` on the
        install's search accounts in their configured order, with the
        same failover rule as a chat's `web_search`. It maps each result's
        address, title and excerpt to `link`, `title` and `snippet`.
        It shortens the returned list without changing the account's own
        result count or fetching any result page. An empty successful
        search returns `[]`.

        **Admission is the same as on every front door.** A client key's
        `limits.allowedTools` must permit `web_search` (null permits all;
        empty permits none). A `limits.localOnly` key is refused before
        any account runs, including a search account on the LAN: a query
        goes to the internet. The request counts against the key's rate
        and concurrency limits and is attributed to that key. Refusals
        use `SearchRunner`'s `why_not` wording.

        **Google accounts are not skipped** (OW-GOOGLE, 2026-10-21).
        A search provider's terms are the account holder's to keep. This
        response carries only links, titles and snippets; it cannot carry
        Search Suggestions or a provider's other display fields.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebSearchRequest'
      responses:
        '200':
          description: |
            At most `count` results and at most the account's own result
            count. When `count` is absent, the account's count applies,
            capped at 20. A successful search with no results is `[]`.
          content:
            application/json:
              schema:
                type: array
                maxItems: 20
                items:
                  $ref: '#/components/schemas/WebSearchResult'
        '400':
          description: |
            Invalid request. An invalid query says
            "query: must be 1 to 2000 characters."
            An invalid count names its allowed range, 1 to 20.
          content:
            application/problem+json:
              schema:
                $ref: 'components/common.yaml#/components/schemas/Problem'
        '401':
          $ref: 'components/common.yaml#/components/responses/Problem'
        '403':
          description: |
            The key's tool scope or locality refuses the search, with
            `why_not`'s words. For example: "this key is local-only, and
            a web search sends a query made from the prompt to the internet".
          content:
            application/problem+json:
              schema:
                $ref: 'components/common.yaml#/components/schemas/Problem'
        '429':
          description: |
            The key's admission limit or the search provider's rate limit.
            A provider's `Retry-After` is carried through unchanged.
          headers:
            Retry-After:
              description: The provider's retry hint, or the key's admission retry delay.
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: 'components/common.yaml#/components/schemas/Problem'
        '503':
          description: |
            No usable search account, or every account failed. With no
            account: "no search account is set up; add one under Backends,
            then Add a search account". An account that is not ready names
            what it needs. When all accounts fail, the detail carries each
            account's observed cause from `SearchRunner`'s `reasons`.
          content:
            application/problem+json:
              schema:
                $ref: 'components/common.yaml#/components/schemas/Problem'

  /v1/images/generations:
    post:
      tags: [inference]
      operationId: createImage
      summary: OpenAI-compatible image generation.
      security:
        - bearerAuth: []
      description: |
        OpenAI's `/v1/images/generations` (P4, 2026-09-28), in its shape: the
        OpenAI SDK's `client.images.generate(...)` works unchanged, streamed
        or not (captured). The model is any with the `image` surface on
        `GET /v1/models`: an OpenRouter image model (Gemini's image+text ones
        included, measured) or OpenAI's.

        Open WebUI uses this same door and the same key policy (OW-IMAGES,
        2026-10-21). A paid external model is allowed when its key permits
        it. `limits.localOnly` refuses every cloud backend, including
        fallback targets; an app key has no exception.

        **Tiers, as chat** (§5, call #4), filtered at every tier to models
        that take what the request asks. **A setting is routed by the model's
        own listing** (A2): `n`, `quality`, `background` and `output_format`
        go only where the listing names the value; an `output_format` the
        listing does not mention is carried and the answer labelled by its
        bytes (P2-2). **`stream: true` routes only to a model that streams**
        (P4-3); where none can, the 400 names `stream`. A streamed request's
        first event is the commit point.

        **The answer is always `b64_json`.** `response_format: url` is
        accepted and ignored (P4-1): there is no store to serve a URL from,
        and OpenRouter and OpenAI's GPT image models answer base64 anyway.
        `created` is this gateway's clock where a backend says 0, `usage` is
        OpenAI's `input_tokens`/`output_tokens`, and every stream event
        carries the fields OpenAI's schema requires (OpenRouter's omit them,
        measured). OpenRouter's own `aspect_ratio`, `resolution` and `seed`
        are refused by name (P4-4); `size` reaches every backend.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImageGenerationRequest'
      responses:
        '200':
          description: |
            The images, or with `stream: true` an SSE stream of
            `image_generation.partial_image` and `image_generation.completed`
            events, one `completed` per image.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImagesResponse'
            text/event-stream:
              schema:
                $ref: '#/components/schemas/ImageStreamEvent'
        '400':
          description: |
            A field this door refuses, a model with no `image` surface, a
            setting no model in the slot takes (named), or the backend's
            refusal (a provider's content filter), with its words.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenAIErrorResponse'
        '401':
          description: Missing, malformed, expired or revoked credential.
          content:
