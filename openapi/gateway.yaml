  /v1/chat/completions:
    parameters:
      - $ref: '#/components/parameters/RepetitionMode'
    post:
      tags: [inference]
      operationId: createChatCompletion
      summary: Generate a chat completion, routed to a backend that serves the model.
      description: |
        The one endpoint everything else exists to support.

        **What the chosen backend does not honour is named**
        (2026-10-12, `docs/design/tools-assumed.md`): a setting the
        caller sent, with a value the backend's
        `capabilities.settingsNotHonoured` lists, is named on this door's
        `x-eugene-plexus-ignored-settings` in this door's spelling
        (`tool_choice`, `parallel_tool_calls`), on both response modes,
        and the header is absent when there is nothing to name.
        `/v1/messages` and `/v1/responses` add it to theirs. A stream's
        is read from the backend chosen for the first attempt, before
        anything is sent, so **a stream opens as it always has**: the
        head never waits for the backend's first frame, and a failover
        after the head cannot change it. A whole answer's is read after
        the call, from the backend that served it. Only what the caller sent
        is named; the gateway's own settings (a search loop's forced
        first turn) are not. Strata ignores `tool_choice` `required`
        and a named function, and `parallel_tool_calls: false`
        (measured), so a request carrying one is answered, with the
        header, rather than refused.

        Routing: `model` is resolved to its slot — the drivers serving
        it, then the drivers serving each configured target in order
        (see `modelSlots`). Within a tier the least-busy eligible driver
        is chosen and the request is translated to its `/v1/generate`.
        If the attempt fails in a cascade-eligible way — a transport
        error or a 5xx — the gateway tries the rest of the tier, then
        the next tier. A **4xx does not cascade**: it means the request
        itself is wrong, the next backend would reject it identically,
        and retrying would only bury the real error.

        **A deadline that fired does not cascade either**, and answers
        **504**. A backend that has not replied inside
        `requestTimeoutSeconds` is almost certainly still computing this
        prompt; the next replica would take the same time to compute the
        same thing, so cascading multiplies the cost of one slow answer
        and then reports a total failure. The 504's message names the
        setting to raise. A *connect* timeout is different in kind — the
        host never took the work — and cascades like any other transport
        error.

        **A client that disconnects cancels the backend call.** The
        request is dropped with a 499 and the attempt is still recorded,
        because a generation nobody read is a real cost. Clients that
        retry on their own deadline (the OpenAI SDKs retry twice by
        default) would otherwise leave one generation running per
        attempt.

        A model whose runtimes are all `stopped` is not a 404. If one of
        them declared `startOnDemand`, the gateway starts it, waits up
        to `swapWaitSeconds` for `ready`, and serves the request —
        `x_eugene_plexus.swapped_in` and `waited_ms` say so. Past the
        wait, the next tier is tried; with none, a 503 naming the
        runtime being woken.

        A request that finds nothing eligible first refreshes the
        routing table (shared across concurrent requests, at most once a
        second) before waking anything or answering — the table is
        otherwise `routingRefreshSeconds` behind the agent about
        readiness, and the first live run met exactly that seam. A
        request that finds a backend never pays for a topology read.

        Sampling parameters are the gateway's to send. Anything the
        caller omits is filled from the model's settings profile and
        sent explicitly; a driver never substitutes a default of its
        own. A parameter the chosen backend cannot accept is dropped
        with a warning rather than failing the request — a control plane
        routes to whatever the operator owns, and refusing a model
        because it dislikes `temperature` is not our call to make.

        For max_tokens, temperature and top_p, precedence is explicit
        request value, then the Library model's default profile, then
        gateway defaults (top_p remains absent without a profile value).
        The model is identified by the selected runtime's modelPath,
        including on each fallback attempt; aliases and replicas do not
        share defaults merely because they share a display name. Hosted
        backends without a Library runtime use gateway defaults.

        Profile reads go through the gateway's own agent's Library proxy
        using its service credential. They are cached for profileCacheSeconds
        (30 by default). During a transport error, a proxy 502/503/504, or
        a timeout, last-known values remain in effect with no time limit.
        profileMaxStaleSeconds is null by default, meaning no limit while
        the Library cannot answer. An explicit number limits stale reuse
        to that many seconds after cache expiry, then gateway defaults
        apply. Zero disables stale reuse. Failures are
        retried no more often than every five seconds and logged with the
        fallback decision. Every successful answer replaces the saved
        values; a successful empty result clears old defaults.
        Setting either cache duration to zero takes effect on the next
        request. Profile edits take effect on subsequent requests after
        cache expiry and do not restart engines.

        **Pictures in tool results.** A `tool` message's `content` may be
        a string or an array of text and `image_url` parts. The gateway moves
        each tool picture to the next user message, after the turn's tool
        messages and before the person's own words, labelled with
        `The image returned by tool call <id>:`. The tool message keeps its
        call id and a note: "[The tool returned an image; it is attached to
        the next user message.]". This is the same path as an Anthropic
        `tool_result` or a Responses `function_call_output`; the
        inference-driver's tool messages carry text only. PNG and JPEG pass
        through; GIF and WebP are re-encoded to PNG, and animated pictures
        are refused. The limits and the rule that keeps the newest tool
        pictures are in `MessageContent`. Pictures route only to a backend
        that confirms image input; with none, the request is a 400 naming
        the cause, as for a person's own picture.

        Profile and special-token caches survive a gateway restart in
        `library-cache.json` beside its config file. They are written at
        most once a minute, only when changed, and loaded as stale, never
        fresh. `GET /v1/info` reports Library reachability and how many
        models currently use saved profile settings.

        **Audio and files ride the image path (P2, 2026-09-28).** An
        `input_audio` part (WAV or MP3) and a `file` part (a PDF, inline
        as `file_data`) are carried to the backend as they are, within
        the limits `MessageContent` states, and route **only** to a model
        whose backend confirms that kind of input
        (`x_eugene_plexus.audio_input`, `file_input` on `GET /v1/models`),
        fallback included. A model that cannot hear or read the
        attachment is never asked: with no such backend the request is a
        400 saying so, before anything is forwarded or woken. A `file_id`
        (row 53) is read from the caller's own files in the install's
        store and carried inline: a PDF as `file_data`, an image as an
        image part, UTF-8 text as text; another owner's id is refused as
        a missing one, and a store that is not answering is a 503 naming
        the cause. The files one request names count together against the
        11 MiB attachment limit, a file named twice twice.

        **Audio out (P2b, 2026-09-28).** `modalities: ["text", "audio"]`
        with `audio: {voice, format}` asks for a spoken answer, and routes
        **only** to a model that confirms audio output
        (`x_eugene_plexus.audio_output`), fallback included; with none it
        is a 400 naming that field. The answer's audio is
        `message.audio` (`delta.audio` when streamed), and what it says
        is `audio.transcript`, not `content`.

        Every audio-output model behind an account answers audio only
        when streamed and only as `pcm16` (measured 2026-09-28), so that
        is what is asked of it, whatever the caller asked. A non-streamed
        answer is that stream assembled; asked for `wav`, it carries a
        WAV header. **Only `wav` and `pcm16` can be served** that way, and
        `mp3`, `flac`, `opus` and `aac` are refused with a 400 naming the
        two that work, rather than transcoded (P2-1). A streamed request
        takes `pcm16` only, as OpenAI's own does. `audio.format` on the
        answer is **what the bytes are**: Lyria answers MP3 whatever it is
        asked, and its audio is labelled `mp3` (P2-2).

        Nothing keeps the audio: an assistant message sent back with
        `audio: {id}` is refused, because the id names a store this
        install does not have. Send the transcript as `content` instead.

        Set `stream: true` for Server-Sent Events. The stream emits
        `data:` lines carrying `ChatCompletionChunk` objects and
        terminates with `data: [DONE]`, matching OpenAI's framing
        exactly. Tokens are forwarded as the backend produces them.

        **Streaming trades a failover guarantee for early delivery, and
        the trade is not optional.** A non-streamed request that loses
        its backend cascades to the next one in the slot and the caller
        sees a single clean answer. A streamed request can only do that
        until its first token: once part of an answer has been sent,
        retrying on another backend would splice two models' output
        together with no marker at the seam, so instead the stream is
        **truncated** and an OpenAI-shaped `error` frame is emitted in
        place of the rest. A caller that needs the cascade more than it
        needs early tokens should not set `stream`.

        Before the first token nothing has changed: the cascade runs
        exactly as it does for a non-streamed request, and a backend
        that dies during connection or before producing output is
        failed over silently.

        **A tool-call fragment is a first token.** The commit point is
        the first frame carrying any part of an answer, and a
        `tool_calls` delta is part of an answer — so a stream that has
        emitted one fragment of one call is past the point of no return
        exactly as if it had emitted prose.

        This is the same rule, but it is worth stating separately
        because the failure it prevents is worse. Splicing prose from
        two models produces a visibly odd answer. Splicing a tool call
        produces `arguments` half-written by one model and completed by
        another, which can parse as valid JSON and name real
        parameters — a **wrong action taken confidently**, with nothing
        at the seam to notice. Text that reads strangely is a bad
        answer; a call that runs cleanly against the wrong arguments is
        a bad *effect*, and this control plane hands that call to a
        harness that will execute it.

        So: a caller that needs the cascade more than early tokens
        should not stream, and that advice is stronger for an agent
        loop than for a chat window.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatCompletionRequest'
      responses:
        '200':
          description: |
            A completion, or an SSE stream when `stream` was true.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatCompletionResponse'
            text/event-stream:
              schema:
                $ref: '#/components/schemas/ChatCompletionChunk'
                description: |
                  The stream is `data:` lines each carrying one of
                  these, terminated by a literal `data: [DONE]`. The
                  schema names the frame, not the whole body.
        '400':
          description: |
            The request cannot be served as asked, and no backend would
            serve it differently — so it is refused here rather than
            cascaded. Four ways to get one: a malformed body; `tools`
            for a model no backend can carry them to; **a model that
            serves embeddings and not chat**; or a backend that rejected
            the request itself, which most often means **a prompt longer
            than the context window**.

            The embeddings case is new with `POST /v1/embeddings` and is
            the reason it was worth adding: the library detects and will
            launch a dedicated embedding model, and before this that
            model sat on `GET /v1/models` looking like any other and
            failed here as whatever the backend happened to say. Now it
            is refused by name, and `x_eugene_plexus.surfaces` says
            which surface to use instead.

            The last is passed through verbatim, and deliberately: an
            engine that counts tokens knows exactly how many the prompt
            had and exactly how many fit, and says both. That is a
            better answer than any estimate this layer could make, and
            it arrives as a 400 rather than the retryable 502 it used to
            be — a difference that decides whether a harness fixes the
            prompt or retries the same one forever.

            **A driver's own 401 or 403 is NOT one of these, since
            2026-09-19.** It was, and it was the one 4xx the caller
            could do nothing about: it means the gateway's credential
            to that driver was refused — a rotated service token on one
            node is the shape it takes — so the request was fine and
            the install is not. Reporting it as
            `invalid_request_error` sent a harness to re-read its own
            prompt for a fault that was never there. It is a 502 with
            `upstream_auth_error` now, and the message names the
            driver. **Nor, since 2026-09-28, is a backend refusing a
            driver's own key** (the driver's `#backend-credential-refused`):
            the same 502 and type, for the same reason one hop further
            out — see the 502 below.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenAIErrorResponse'
        '404':
          description: |
            No reachable driver serves the requested model. Distinct
            from 503: the model is not something this install can route
            to at all.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenAIErrorResponse'
        '499':
          description: |
            The client disconnected before the answer was ready, and
            the backend call was cancelled with it. Nothing reads this
            -- the socket is gone -- but the attempt IS recorded in
            `/v1/metrics`, because a generation nobody read is a real
            cost and is the one signal that says callers are giving up.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenAIErrorResponse'
        '502':
          description: |
            Every eligible backend failed. Returned after the priority
            list is exhausted, so this means the cascade ran and lost,
            not that one backend hiccuped.

            **One 502 does mean a single backend, and is named as
            such:** a driver that answered 401 or 403 refused the
            gateway's own credential. That is an install fault rather
            than a request fault, and reporting it in the caller's 4xx
            range told a harness to fix a prompt that was correct.
            `error.type` is `upstream_auth_error` and the message names
            the driver whose credential was refused.

            **Since 2026-09-28 the same 502 and type cover the hop past
            the driver:** the provider behind a driver refused that
            driver's own key — a 401, a 402 when the account has no
            credit, or a 403 that is not about the content (the driver's
            `#backend-credential-refused`). Measured live: OpenRouter's
            401 for a bad key reached the caller as a 400
            `invalid_request_error`. The message names the driver, its
            URL and the provider's own words, and says to set a working
            API key on that driver. Neither case cascades; that rule is
            older than both and unchanged.

            **Since 2026-10-12 a 502 also answers a request the gateway
            could not admit because a driver's listing could not be read
            for a cause that waiting cannot clear:** the driver refused
            the gateway's credential, answered 404 or a body that is not
            a listing, or says it is degraded (in its own words). The
            message names the driver and what to look at, with no
            `Retry-After`. Causes that can clear (a timeout, a refused
            connection, a 5xx, a listing that lacks the model for now)
            are the 503 below.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenAIErrorResponse'
        '504':
          description: |
            No backend answered within `requestTimeoutSeconds`.
            **Deliberately not a 502**, and deliberately not cascaded:
            the backend is almost certainly still computing this
            prompt, and the next replica would take the same time on
            the same input. The message names the setting to raise.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenAIErrorResponse'
        '503':
          description: |
            A driver serves the model but is not ready — the engine is
            still loading, a `startOnDemand` runtime was woken and did
            not reach `ready` within `swapWaitSeconds`, or the gateway
            is in safe mode. Retryable, so it is deliberately not folded
            into 502. The message names the runtime when one is being
            woken. Since 2026-10-12 it also answers a request whose
            backends' listings could not be read for a cause that can
            clear (a timeout, a refused connection, a 5xx, a listing
            that lacks the model for now): it names each driver and what
            was observed, with `Retry-After`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenAIErrorResponse'

  /v1/messages:
    parameters:
      - $ref: '#/components/parameters/RepetitionMode'
    post:
      tags: [inference]
      operationId: createAnthropicMessage
      summary: Anthropic-compatible Messages API, so an Anthropic client can use local models.
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      description: |
        **The third front door, and the one that decides whether an
        agent harness can point at this install at all.** Claude Code,
        the Anthropic SDKs and every tool built on them speak this wire
        and not OpenAI's, so without it the most capable client in the
        field can be pointed at every competing product and not at us.

        It is a **translation at the edge**, not a second routing
        engine. The body is mapped into the same internal request
        `/v1/chat/completions` builds, and from there the two doors
        share everything: the surface refusal, the tools refusal checked
        before a backend is picked, the refresh-and-wake, the settings
        profile, the truncation detector, the cascade and the
        recording. `GET /v1/metrics` sees this door exactly as it sees
        the other one, which is the whole reason the translation happens
        here rather than against a driver.

        ### Authentication takes two headers, and they are alternatives

        `Authorization: Bearer <token>` **or** `x-api-key: <token>`,
        carrying the same tokens the OpenAI door accepts — an operator
        session, a service token, or a **client key** from
        `POST /v1/auth/client-keys`.

        Two headers because the client decides which one, and it never
        sends both. Measured against Claude Code 2.1.207 on 2026-09-19
        (`docs/acceptance/anthropic-messages-measurement.md`):
        `ANTHROPIC_API_KEY` sends `x-api-key` and **no `Authorization`
        header at all**, while `ANTHROPIC_AUTH_TOKEN` sends
        `Authorization: Bearer` and no `x-api-key`. A door that read
        only one of them would not merely prefer the wrong header; on
        half the configurations it would see no credential whatsoever.

        ### A rejected credential is 403 here and 401 everywhere else

        **This is a deliberate divergence and it must not be tidied
        away.** Measured: a 401 from this endpoint makes Claude Code
        retry without bound — nine attempts in 79 seconds, still
        climbing when the measurement's timeout fired — while **showing
        its user nothing at all**. A 403 is reported on the first
        attempt, verbatim, as
        `Failed to authenticate. API Error: 403 <our message>`.

        So a missing, malformed, expired or revoked token on
        `/v1/messages` answers **403** with a message naming the reason.
        The same token on `/v1/chat/completions` still answers 401,
        because an OpenAI SDK reports a 401 properly and a 403 there
        would read as "this key exists but may not do this".

        A gateway that answers 401 here converts a typo in a key into a
        silent retry storm against itself, which is the looping symptom
        this project removed from the driver at step 7, one layer up, in
        the client it most wants to keep.

        ### Compatibility hints and explicit refusals (A2)

        `context_management` remains accepted for Claude Code compatibility but is
        not enforced. `cache_control` is carried to a backend that can use it, as a
        hint, and not enforced elsewhere (see below). `output_config.effort` is carried as
        the shared reasoning-effort preference to supporting backends.
        `thinking` decides whether reasoning is returned as `thinking` blocks,
        and `disabled` also requests effort `none` where supported. Ignored hints are named in
        `x-eugene-plexus-ignored-settings` on both response modes.
        `metadata` is discarded as an opaque annotation.

        **`output_config.format` is honoured** (2026-10-03): a
        `{"type": "json_schema", "schema": {...}}` is carried as the chat
        path's `response_format` of type `json_schema`, so the answer's
        text is JSON matching the schema. Claude Code sends it, under the
        `structured-outputs-2025-12-15` beta, for session titles, memory
        recall and prompt hooks, and those failed through this door while
        it was refused.

        Four top-level fields Claude Code's request builder can add --
        `safeguards`, `speed`, `thread` and `diagnostics` (2.1.288) -- are
        accepted, not enforced, and named on the ignored-settings header.
        Any other unknown top-level field is rejected with 400 naming the
        field.

        A prompt the backend reports as too long for the model's context
        is a 400 `invalid_request_error` (on a stream, whose 200 is already
        sent, the `error` event of that type) whose message **begins
        `prompt is too long`**, followed by `: N tokens > M maximum` when
        the backend reported both numbers. Claude Code compacts the
        conversation and retries only on that wording, so a local model's
        overflow relayed in the engine's own words ended the session
        instead.

        `cache_control` appears on system blocks, on the last user
        content block **and on `tool_result` blocks**. Prompt caching is
        a property of a hosted service and means nothing to a local
        engine holding the KV cache itself. **Carry the client's, add
        none** (`docs/design/prompt-cache.md`, PC6): when any mark is
        present, the backend is sent the hint (`cacheControl`, with the
        longest `ttl` any mark named), and a backend that takes it
        (an OpenRouter `anthropic/*` model) caches the conversation. A
        request that marked nothing sends nothing. The header names
        `cache_control` only when the backend that answered did not
        carry it: for a stream, the first backend tried.

        **`thinking` is dropped rather than refused, and that was
        measured rather than assumed.** It is on every request Claude
        Code sends. A known Claude model id produces
        `{"budget_tokens": …, "type": "enabled"}`; **an arbitrary local
        model id — which is the entire purpose of this door — produces
        `{"type": "adaptive"}`**; and `MAX_THINKING_TOKENS=0` produces
        `"thinking": null` with the key still present, so even a
        presence check refuses the one configuration genuinely asking
        for no thinking. Dropping it is not a loss of control either:
        `thinkingMode` on the model's settings profile and the driver's
        `ThinkingFilter` already decide what a local model does with a
        reasoning block, and that decision belongs to the operator who
        owns the model rather than to the caller.

        ### Search results and the memory tool (MR9a, 2026-10-18)

        A `search_result` block (`source`, `title`, `content` of text
        blocks), on a user turn or inside a `tool_result`, reaches the
        model as its words between `[Search result N: <title> (<source>)]`
        and `[End of search result N]`, where N is one more than
        Anthropic's `search_result_index`: counted across the whole
        request in order, top level and tool results alike. **Dropped
        silently before MR9a.** A missing `source`, `title` or `content`,
        a non-text block inside it, one on an assistant turn, and
        `citations.enabled` that differs between results are each a 400,
        as upstream refuses them. `citations.enabled: true` is accepted
        and named on `x-eugene-plexus-ignored-settings` as `citations`:
        no `search_result_location` citation is returned, because a local
        model cannot say which blocks it drew on.

        The `memory_20250818` tool (named `memory`) is the caller's to
        run, as Anthropic defines it. It reaches the backend as a
        function named `memory` (a `command` of `view`, `create`,
        `str_replace`, `insert`, `delete` or `rename`, with each
        command's fields), and Anthropic's memory protocol text follows
        the request's own system text. The model's call comes back as a
        `tool_use` block named `memory`; the gateway runs nothing and
        keeps nothing. Another tool named `memory` in the same request is
        a 400. `count_tokens` counts both expansions.

        ### Reasoning comes back as `thinking` blocks, when asked for

        Since 2026-09-23 a model's reasoning -- which llama.cpp and vLLM
        report separately from the answer -- is returned as a `thinking`
        content block ahead of the text, streamed as `thinking_delta`
        events. **Only when the request's `thinking` is non-null and not
        `{"type": "disabled"}`**, which is Anthropic's own rule: a client
        that never enabled thinking reads `content[0].text`, and a
        thinking block in first place would break the commonest line of
        Anthropic SDK code there is. Claude Code sends `adaptive` for a
        local model id, so it gets them.

        **`display` is honoured the way Anthropic defines it.**
        `"omitted"` returns the block with `thinking` empty, and
        `"summarized"` or no `display` returns the text (ours is the
        whole reasoning, not a summary: there is nothing to condense it
        with and nothing to hide). **Claude Code sends `"omitted"` on
        every request** (measured, 2.1.207), so it is shown no reasoning
        text, by its own choice.

        What an omitted block still carries is continuity, in
        `signature` -- which is what Anthropic's opaque signature is
        for. Ours is `eugene-plexus-reasoning-v1:` followed by the
        reasoning in base64: a value only this gateway reads, never a
        claim to be Anthropic's. A `thinking` block sent back on a later
        assistant turn is carried to the backend as that turn's
        reasoning, from its text or else from that signature, so a tool
        loop through Claude Code reaches the model with its own earlier
        thinking -- llama.cpp renders it into the prompt for templates
        that keep it. A signature this gateway did not write is ignored,
        and a `redacted_thinking` block is dropped: nothing in it is
        readable here.

        What is still not honoured, and is named on the ignored-settings
        header when sent: a `budget_tokens`, and `disabled` as an
        instruction to the model. Both hide or cap what the model does,
        and the model's thinking is the operator's `thinkingMode` to
        govern.

        `top_k` is carried to the backend since 2026-09-23. It was
        refused with a 400 before that, being the last sampler neither
        internal contract could carry.

        ### Images are carried, on the OpenAI door's path

        Since 2026-09-23 an `image` block with a `base64` source is
        carried to the backend as an inline image part, and from there it
        is the shared path's: the limits `MessageContent` states
        (`maxImagesPerRequest`, 12 by default, 5 MiB decoded each, 10 MiB
        total, 8192 px a side),
        a check that the bytes are the picture they claim to be, and
        routing **only to a backend that confirms image input**. A model
        that cannot see the picture is never asked -- the request is a
        400 saying so, before anything is forwarded or woken, which is
        why this was refused until a vision backend could be routed to.

        **Claude Code's image arrives inside a `tool_result`**, and that
        decided the shape (captured with `scripts/r4-capture.py --mode
        imageread`, Claude Code 2.1.207 / agent-sdk 0.3.280): its `Read`
        of an image file returns a result whose content is a lone
        `image` block and no text. The inference-driver's `tool` messages
        carry text only and image parts ride on user messages, so the picture
        **moves**: the tool message keeps its call id and says, in a
        bracketed line, that the tool returned an image attached to the
        next user message; and that user message -- directly after the
        turn's tool messages, ahead of the person's own words -- opens
        with `The image returned by tool call <id>:` and the picture. A
        person's own image block stays where they put it among their
        text.

        PNG and JPEG pass through byte for byte. **GIF and WebP are
        re-encoded to PNG**, losslessly, because Claude Code sends a small
        `.gif` or `.webp` exactly as it found it (captured) while local
        engines and this gateway's internal contract take PNG and JPEG;
        an animated one is refused. A large image needs nothing: the
        same capture sent a 36 MB 4000x3000 PNG as a 490 KB JPEG, so the
        client resizes before our limits could bite.

        A `url` source is refused and never fetched -- the gateway
        dialling an address a caller names is the request forgery this
        project closed for node addresses. A Files API `file` source
        (row 53) is read from the caller's own files in the install's
        store and carried as a `base64` source; a text file in a
        `document` block becomes a `text` source.
        An image on an `assistant` or `system` turn is refused: there is
        nowhere on a backend's wire for it. Every image refusal names the
        block in the caller's own coordinates
        (`messages.2.content.0.content.0.source`).

        **The image limit counts the whole conversation**, because a
        client sends its history on every request and the model receives
        every picture in it each time. It was a fixed four until
        2026-09-23, when a Claude Code session that had read five
        screenshots was refused on every turn after the fifth; it is the
        gateway's `maxImagesPerRequest` now, twelve by default and at most
        64. The shared `MessageContent` rule keeps the newest tool pictures
        that fit and replaces the others with notes naming the limit. A
        person's own pictures are never dropped; if they alone are over a
        limit, the refusal names the setting and the block that tipped it.

        ### Documents are carried too (P2, 2026-09-28)

        A `document` block with a `base64` PDF source is carried as a
        file part and routes only to a model that confirms file input; a
        `text` source (`text/plain`) is carried as the text it holds.
        Either may sit inside a `tool_result`, which is where Claude
        Code's `Read` of a PDF puts it, and moves to the next user
        message exactly as an image does. `title` becomes the file's
        name. Refused with a 400: a `url`, `file` or `content` source,
        and `citations` enabled -- this gateway returns no citation
        blocks, and a client that asked for them would read an answer
        with none as uncited.

        ### Web search runs here (P8)

        A `web_search_<8 digits>` server tool is run by this install's
        search account, as "Server-run tools" above says, and answered
        with `server_tool_use` and `web_search_tool_result` blocks.
        Claude Code's WebSearch is its own request offering exactly this
        tool (`web_search_20250305`, `max_uses: 8`, measured); when no
        search can run for it, the 400 names why.

        ### What is refused, with a 400 naming the field

        Every other server-side tool type, `mcp_servers`, more than four
        `stop_sequences`, a missing `max_tokens`, and the image and
        document cases above. Each is refused rather than dropped
        because each changes what the answer would be: a model that
        never saw the document is not answering the question that was
        asked.

        **A model nothing serves is also a 400 here, not a 404.**
        Measured: Claude Code discards the body of a 404 and shows a
        generic *"There's an issue with the selected model"* instead, so
        a 404 would throw away the explanation — including the
        `503 Locked` control-root diagnosis, which exists precisely so
        that this surface stops naming two healthy places and never
        mentioning the root.

        ### Streaming

        `stream: true` produces Anthropic's typed event stream:
        `message_start`, then per content block a `content_block_start`,
        `content_block_delta` run and `content_block_stop`, then
        `message_delta` carrying `stop_reason`, then `message_stop`.
        There is no `[DONE]` sentinel — that is OpenAI's framing, and a
        strict Anthropic client rejects a stream that carries it.

        **Content blocks are numbered statefully and our internal
        stream is not**, which is the one piece of real work in the
        translation. Text and reasoning deltas carry no index of their
        own, while tool fragments carry a per-call index; the translator
        therefore holds the open text or thinking block and a map from
        tool-call index to content block index, and emits
        `content_block_stop` for whatever is open before the next kind
        of block starts -- a `thinking` block closes before the answer's
        first `text` block opens. Getting it wrong means a
        strict SDK rejects the stream *inside* a 200, which reads to the
        user as the model producing nothing.

        `message_start` is emitted on the **first event from the
        driver**, never on request acceptance. It names the model, and
        until the first token the cascade can still change which backend
        — and therefore which model id — answers.

        Its `usage.input_tokens` is **0**: a local engine reports the
        prompt's size when it finishes, not when it starts. The real
        count arrives on `message_delta`, and that is the one a client
        keeps — measured 2026-09-23, Claude Code's session transcript
        and result hold the `message_delta` count whether or not
        `message_start` carried one.

        The failover rule is unchanged and is inherited rather than
        re-implemented, because the commit point sits below both
        translators: failover is possible until the first token and
        impossible after it. Past that point a stream is **truncated**,
        and the truncation is reported as an `error` event followed by
        `message_stop` rather than as a status code, since the status is
        long gone.

        ### The envelope does not go in the body

        `x_eugene_plexus` rides on **response headers**
        (`x-eugene-plexus-driver`, `-runtime`, `-node`, `-backend`,
        `-latency-ms`, `-attempts`, `-tier`, `-swapped-in`,
        `-waited-ms`, `-context-length`, `-prompt-truncated`) rather
        than in the response object. Anthropic's wire is typed events
        and a strict client is exactly who this door is for, so an
        unknown top-level key is a risk with no upside. The *recording*
        is unaffected: it rides the shared path and lands in
        `GET /v1/metrics` like any other request.

        ### Two shape facts that are easy to get wrong

        Claude Code sends `POST /v1/messages?beta=true` on **every**
        request. The query parameter is ignored, and an
        `anthropic-beta` header naming features we do not implement is
        tolerated rather than validated — refusing an unknown beta would
        refuse every request from the client this exists for.

        A `tool_result` is a **block inside a `user` message**, several
        to a message, and an assistant turn comes back carrying its own
        `tool_use` blocks. Both directions are translated; the inbound
        assistant mapping is not optional, because it is how a tool loop
        continues past its first turn.
      parameters:
        - name: beta
          in: query
          required: false
          schema:
            type: boolean
          description: |
            Accepted and ignored. Claude Code appends `?beta=true` to
            every request; documenting it here is what stops a future
            reader treating it as an unknown parameter worth refusing.
        - name: anthropic-version
          in: header
          required: false
          schema:
            type: string
          description: |
            Anthropic's API version, `2023-06-01` from every observed
            client. Accepted and not enforced: we serve local models, so
            there is no dated behaviour of ours for it to select.
        - name: anthropic-beta
          in: header
          required: false
          schema:
            type: string
          description: |
            Comma-separated beta feature names. **Tolerated, never
            validated.** Claude Code sends five to seven of them and the
            list changes with its own version and login method.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnthropicMessagesRequest'
      responses:
        '200':
          description: |
            A message, or an Anthropic event stream when `stream` was
            true.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnthropicMessageResponse'
            text/event-stream:
              schema:
                $ref: '#/components/schemas/AnthropicStreamEvent'
                description: |
                  SSE frames carrying both an `event:` name and a
                  `data:` object whose `type` repeats it. **No
                  `[DONE]`**; the stream ends at `message_stop`.
        '400':
          description: |
            The request names something this gateway cannot carry —
            a document or image it cannot carry or no ready backend can
            read, a server-side tool other than web search, a web search
            that cannot run (the message says why),
            `mcp_servers`, more than four `stop_sequences`, a missing
            `max_tokens` — **or names a model nothing serves**, which is
            a 400 here rather than a 404 because Claude Code discards a
            404's body. The message names the field or the model.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnthropicErrorResponse'
        '403':
          description: |
            Missing, malformed, expired or revoked credential.
            **Deliberately not 401**: a 401 is retried without bound by
            Claude Code and shows its user nothing, while a 403 is
            reported on the first attempt with our message intact.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnthropicErrorResponse'
        '499':
          description: |
            The client disconnected; the backend call was cancelled and
            the attempt was still recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnthropicErrorResponse'
        '502':
          description: |
            Every eligible backend failed, after the cascade ran — or a
            driver refused the gateway's own credential (401/403 from
            the driver), or the provider behind a driver refused that
            driver's own key (the driver's `#backend-credential-refused`),
            each one backend rather than all of them and an install
            fault rather than a request fault. All three
            render as `api_error` on this door, where the OpenAI door
            distinguishes them by `error.type`: Anthropic's error
            vocabulary has no member for *our upstream refused us*, and
            `permission_error` here would read as the caller's
            credential being wrong when it is ours.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnthropicErrorResponse'
        '503':
          description: |
            A driver serves the model but is not ready, or the gateway
            is starting or in safe mode. Retryable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnthropicErrorResponse'
        '504':
          description: |
            No backend answered within `requestTimeoutSeconds`. Not
            cascaded: the backend is almost certainly still computing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnthropicErrorResponse'

  /v1/messages/count_tokens:
    post:
      tags: [inference]
      operationId: countAnthropicMessageTokens
      summary: Count a Messages request's input tokens with the serving backend's own tokenizer.
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      description: |
        Anthropic's token-counting endpoint, answered by the backend that
        would serve the request: the body is translated exactly as
        `POST /v1/messages` translates it, and the driver counts the
        resulting prompt with the backend's own template and tokenizer
        (`POST /v1/generate/count` on the inference-driver). **Nothing is
        generated and nothing is woken.**

        ### Why it exists: measured, 2026-09-23

        Claude Code's `/context` calls this endpoint 13-14 times, one per
        category (system prompt pieces, tool groups, skills), beta
        `token-counting-2024-11-01`, bodies `{model, messages, system?,
        tools?}` with no `max_tokens`. **Answered with a 404 it does not
        fail -- it counts by inference instead**: each 404 was followed at
        once by a real `POST /v1/messages` with `max_tokens: 1`, and the
        engine evaluated prompts of up to 9,050 tokens for one output
        token each (17.8 s apiece on a CPU). One diagnostic command cost
        fourteen prefills, would wake an idle-unloaded model, and put
        fourteen one-token requests in `GET /v1/metrics`.

        ### When it cannot count, it says so with a 400

        A count is answered only by a **ready** backend that can count
        exactly -- llama.cpp or Gemini, using its native `countTokens`.
        Gemini counts supported attachments as well as text, system
        instructions and tools. When none can (the model is asleep,
        its backend cannot count, or llama.cpp receives an image whose
        cost only its projector knows), this is a **400** naming the reason, and Claude Code falls
        back to counting by inference as above. **A 400 and not a 5xx,
        by measurement:** answered 400, 403 or 404, `/context` tried each
        count once and fell back; answered 501 or 503, it retried every
        one first. A stopped model is never woken to count: a caller who
        wants that pays for it knowingly, through the fallback. Since
        2026-10-12 the same 400 also answers a count whose key or whose
        backends' listings cannot be checked right now (the admission
        authority or a driver did not answer). It fails closed: nothing
        is counted, and nothing is forwarded or woken. A rejected key is
        still its 401 or 403.

        ### What it shares with the Messages door, and what it does not

        The same credentials (`x-api-key` or `Authorization: Bearer`) and
        the same **403** for a rejected one; the same refusals (documents,
        server-side tools, unknown settings); the same client-key model
        scope and `localOnly` rule. **It does not take a concurrency
        reservation or count against a key's request rate** -- a count is
        a key *check*, not an admission, since `/context` sends fourteen
        at once -- and it is **not recorded** in `GET /v1/metrics`,
        because it is not inference.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnthropicCountTokensRequest'
      responses:
        '200':
          description: The count.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnthropicTokenCount'
        '400':
          description: |
            The request names something this door refuses, names a model
            nothing serves, or cannot be counted exactly right now (see
            above). Claude Code falls back to counting by inference.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnthropicErrorResponse'
        '403':
          description: Missing, malformed, expired or revoked credential, as on `/v1/messages`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnthropicErrorResponse'

  /v1/responses:
    parameters:
      - $ref: '#/components/parameters/RepetitionMode'
    post:
      tags: [inference]
      operationId: createResponse
      summary: OpenAI's Responses API, so Codex CLI and other Responses clients can use local models.
      description: |
        **The fourth front door, and the only one Codex CLI can use.**
        Codex 0.130 refuses `wire_api = "chat"` at startup, so without
        this path it cannot be pointed at this install at all.

        It is a **translation at the edge**, exactly as `/v1/messages`
        is: the body becomes the internal request `/v1/chat/completions`
        builds, and from there every door shares the surface refusal, the
        tools refusal, the refresh-and-wake, the settings profile, the
        image path, client-key admission, the truncation detector, the
        cascade and the recording. Every shape below was captured from a
        real Codex CLI (`docs/acceptance/responses-measurement.md`), except
        the row 57 client-run tools and compaction, whose wire shapes
        follow OpenAI's documented API.

        ### Stateless: the conversation lives in the client

        Codex sends `store: false` and **resends the whole conversation
        on every turn**, with no `previous_response_id`. This gateway
        keeps no response store either, so `previous_response_id`,
        `conversation`, `prompt` (a stored prompt template),
        `background: true` and an `item_reference` input item are each
        refused with a 400 naming the field: each points at state that
        exists only on OpenAI's servers. `store: true` is accepted and
        named on the ignored-settings header, because nothing is kept;
        every response reports `store: false`.

        ### What the input becomes

        `instructions` becomes the leading system message. A `developer`
        or `system` message becomes a system message where it stands.
        `input_text` is text and `input_image` is an image part (below).
        A `function_call` item is the assistant turn's tool call and a
        `function_call_output` is the `tool` message answering it, by
        `call_id`; consecutive assistant-side items (reasoning, a
        message, calls) form one assistant turn. **Adjacent messages of
        the same role are joined** with a blank line: Codex sends two
        user messages in a row on every request, and a chat template
        that requires alternating roles would refuse them.

        `web_search` is on **every** Codex request as
        `{"type": "web_search", "external_web_access": false}`. Since P8
        it **runs** when a search can run here ("Server-run tools") and
        `external_web_access` is not `false`; otherwise it is accepted,
        removed, and named on the ignored-settings header, with the
        reason in `x-eugene-plexus-web-search`. Refusing it would refuse
        the first request of every session, as `/v1/messages` once did
        with `output_config`. `filters.allowed_domains`,
        `filters.blocked_domains`, `user_location` and
        `search_context_size` are honoured; any other filter or setting
        on the tool (`search_content_types`, `image_settings`,
        `return_token_budget`, and the `indexed_web_access` Codex 0.160
        sends in its Indexed mode) is named on the ignored-settings
        header.
        `image_generation` runs
        through this install's image models (P8e, "Server-run tools"
        above) or is refused with a 400 naming why.
        `mcp` (remote MCP, row 59b) runs on a tool-driver under the
        owner's `remoteMcp` setting, with approvals, as "Remote MCP" above
        describes; when it cannot run, the 400 names why. Its items --
        `mcp_list_tools`, `mcp_call`, `mcp_approval_request` -- come back
        in `output`, and `mcp_approval_response` answers a request in the
        next `input`.

        ### Client-run tools (row 57)

        `custom`, `local_shell`, `shell` and `apply_patch` are offered to
        the model as chat functions. The client executes the calls;
        nothing executes inside the gateway. A `custom` tool becomes a
        function with one string parameter `input`. Its call comes back
        as `custom_tool_call` with `call_id`, `name` and the free-text
        `input`. A grammar in `format` is included in the function
        description, not enforced, and named as `tools[i].format` on
        `x-eugene-plexus-ignored-settings`.

        `local_shell` becomes a function with `command` (an array of
        strings), `workdir`, `timeout_ms` and `env`. Its
        `local_shell_call` carries an `action` of `type: exec`, with
        `working_directory` for `workdir`. `shell` becomes a function
        with `commands` (an array of strings), `timeout_ms` and
        `max_output_length`; its `shell_call` carries those in `action`.
        It uses the client's local environment; a hosted container is
        refused because this gateway has no shell execution service.
        `apply_patch` becomes a function with one string parameter
        `input`, the patch, and returns an `apply_patch_call` with an
        OpenAI `operation` (`type`, `path` and, for create or update,
        `diff`).

        These call items can be sent back as assistant history. Their
        `custom_tool_call_output`, `local_shell_call_output`,
        `shell_call_output` and `apply_patch_call_output` items become
        tool results matched by `call_id`. The legacy local-shell
        output's `id` is also accepted as its call id.
        `tool_choice` can force any declared client-run tool, by name
        for a function or custom tool, or by type for the other tools.

        Tools still refused return a 400 naming their observed cause:
        `computer_use_preview` (no local model is trained for it),
        `code_interpreter` (Eugene has no sandbox; use a function tool and
        run it yourself), and `file_search` (file search needs row 56).

        A `compaction` input item from `/v1/responses/compact` is
        decrypted and authenticated by this gateway and expanded into a
        developer message containing the summary. An item that cannot
        be authenticated is refused with a 400; see the compact endpoint.

        **A `namespace` tool is accepted** (2026-10-03): `{"type":
        "namespace", "name", "description", "tools": [...]}`, a group of
        tools Codex sends to every custom provider since 0.133.0 (its
        sub-agent tools as `multi_agent_v1`, MCP servers as theirs). Each
        `function` member is offered to the model under its own `name`,
        and a call to one comes back as a `function_call` carrying
        `namespace`, because Codex routes a call by namespace and name
        together. A member of any other type is not offered and is named
        on the ignored-settings header. Two offered tools with one name
        are refused with a 400 naming it. Before this, every request from
        Codex 0.133 to 0.160 was refused.

        ### Reasoning goes out as `reasoning_text` and comes back

        A model's reasoning is a `reasoning` output item whose `content`
        holds one `reasoning_text` part -- the Responses API's slot for a
        model's own reasoning, which is what a local engine reports.
        `summary` is empty: there is nothing here to summarize with, so
        a requested `reasoning.summary` is named on the ignored-settings
        header. `reasoning.effort` is carried to supporting backends; when
        unsupported it is omitted and named on that header without refusing the request.

        When `include` asks for `reasoning.encrypted_content`, the item
        also carries `encrypted_content`:
        `eugene-plexus-reasoning-v1:` and the reasoning in base64 -- the
        same carrier the Anthropic door's omitted thinking uses, readable
        only here and never a claim to be OpenAI's. Codex sends reasoning
        items back on later turns with `content` and `encrypted_content`
        intact (measured), and either one is carried to the backend as
        that assistant turn's reasoning, so a tool loop reaches the model
        with its own earlier thinking.

        ### Files and audio (P2, 2026-09-28)

        An `input_file` whose `file_data` is an inline PDF is carried as
        the chat door's `file` part, and an `input_audio` part as its
        `input_audio`, with the same limits and the same routing: only to
        a model that confirms that input. `filename` is the name the
        model is shown. A `file_id` (row 53) is read from the caller's
        own files in the install's store and carried inline (a PDF as
        `file_data`, an image as an `input_image`, text as text). A
        `file_url` is refused and never fetched. `detail` is accepted and, other than `auto`, named on
        the ignored-settings header, as for images.

        ### Images

        An `input_image` whose `image_url` is an inline `data:` URL is
        carried on the image path every door shares: the limits in
        `MessageContent`, a check that the bytes are the picture they
        claim to be, and routing only to a backend that confirms image
        input. A URL is refused and never fetched. A `file_id` (row 53)
        is read from the caller's own files in the install's store.
        **`detail` is accepted whatever it says** -- Codex sends
        `"high"` on every image (measured), both on a `-i` attachment and
        in its `view_image` tool's result -- and a value other than
        `auto` is named on the ignored-settings header, because a local
        projector sizes the picture itself. An image inside a
        `function_call_output` moves to the next user message, labelled
        with the call id, as on `/v1/messages`: the inference-driver's
        `tool` messages carry text only. The shared `MessageContent` rule
        keeps the newest tool pictures that fit and replaces the others
        with notes naming the limit; a person's own pictures are never
        dropped.

        ### No cap from the install default

        Codex sends **no `max_output_tokens`**, which in this protocol
        means no cap -- and an answer that ends in `response.incomplete`
        is **generated six times and then failed** by Codex (measured).
        So on this door an absent `max_output_tokens` takes the model's
        settings profile `maxTokens` when it sets one and otherwise sends
        none, leaving the answer bounded by the context window and
        `requestTimeoutSeconds`. The gateway's install-wide
        `defaultMaxTokens` does not apply here. Every other door keeps
        using it.

        ### Statuses: chosen for what the client does with them

        Measured against Codex 0.130 (the record's §3): a **400** is shown
        once; a 401, 403 or 404 is retried five times and then shown; a
        5xx is retried twenty-nine times; a 429's and a 500's message are
        discarded. Hence **a model nothing serves is a 400 here, not a
        404** -- the same divergence `/v1/messages` makes, for the same
        kind of reason -- and a rejected credential stays the OpenAI
        door's 401, which Codex bounds and shows.

        ### Streaming

        `stream: true` produces the Responses event stream: every frame
        carries both an `event:` name and a `data:` object whose `type`
        repeats it, and a `sequence_number` counting from 0. There is no
        `[DONE]`. `response.created` and `response.in_progress` open it;
        each output item is `response.output_item.added`, its deltas
        (`response.reasoning_text.delta`, `response.output_text.delta`
        inside a `content_part`, or `response.function_call_arguments.delta`),
        its `.done` events and `response.output_item.done`; the stream ends
        with `response.completed`, or `response.incomplete` when the answer
        was cut at the output cap or by a content filter.

        **The stream opens as soon as a backend is chosen, and stays
        open with `response.in_progress` every ten seconds until output
        arrives.** Codex drops a stream that is silent for five minutes
        -- before the first event too -- and retries it from the start,
        and an SSE comment does not reset that timer (measured). A local
        engine prefilling Codex's first prompt on a processor can take
        longer than that. `response.created` therefore names the model
        that was *asked for*; the terminal event names the one that
        answered, which after a cascade can differ.

        A failure after that point is `response.failed`, never a bare
        `error` event, which Codex reports without our message. Its
        `error.code` is chosen for what the client should do:
        `context_length_exceeded` when the backend refused an over-long
        prompt (Codex stops and says the context is full),
        `invalid_prompt` when another attempt cannot help -- a backend
        that refused the request, a deadline that fired while the engine
        was still computing, a credential turned off mid-stream -- and
        `server_error` for a failure a retry can fix.

        The failover rule is inherited unchanged: possible until the first
        token, impossible after it.

        ### The envelope does not go in the body

        `x_eugene_plexus` rides on response headers, as on `/v1/messages`
        (`x-eugene-plexus-driver`, `-runtime`, `-node`, `-backend`, `-latency-ms`,
        `-attempts`, `-tier`, `-swapped-in`, `-waited-ms`,
        `-context-length`, `-prompt-truncated`), and
        `x-eugene-plexus-ignored-settings` names every accepted setting
        this gateway does not honour. The recording rides the shared path
        and lands in `GET /v1/metrics` like any other request.

        ### Accepted and discarded, refused

        Discarded as opaque annotations: `metadata`, `client_metadata`,
        `user`, `safety_identifier`. Accepted and named on the
        ignored-settings header when set: `prompt_cache_key` and
        `prompt_cache_retention` (a local engine keeps its own cache),
        `service_tier`, `truncation: "auto"` (this gateway never drops
        input to make it fit; the engine refuses instead),
        `stream_options.include_obfuscation`, `text.verbosity`, and the
        `include` values that ask for server-side tool output
        (`web_search_call.action.sources` is always included on a search
        that ran). `max_tool_calls` bounds the searches one response may
        run (P8). Refused with a 400 naming the
        field: every stateful field above, `top_logprobs` above 0 and the
        `message.output_text.logprobs` include, an `input_file` with a
        `file_url`, `tool_choice` forcing an undeclared or
        refused tool, and any top-level field not listed in
        `ResponsesRequest`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResponsesRequest'
      responses:
        '200':
          description: |
            A response object, or a Responses event stream when `stream`
            was true.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponsesResponse'
            text/event-stream:
              schema:
                $ref: '#/components/schemas/ResponsesStreamEvent'
        '400':
          description: |
            The request names something this door refuses (see above), an
            image it cannot carry or no ready backend can see, a backend
            refused it -- **or it names a model nothing serves**, which is
            a 400 here and not a 404 because Codex retries a 404 five
            times before showing it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenAIErrorResponse'
        '401':
          description: Missing, malformed, expired or revoked credential.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenAIErrorResponse'
        '499':
          description: The client disconnected; the backend call was cancelled and recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenAIErrorResponse'
        '502':
          description: |
            Every eligible backend failed after the cascade ran, or a
            driver refused the gateway's own credential, or a provider
            refused a driver's own key — the last two as
            `upstream_auth_error`, which this door streams as
            `invalid_prompt` so the client does not retry a key that
            cannot work.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenAIErrorResponse'
        '503':
          description: A backend serves the model but is not ready, or the gateway is starting.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenAIErrorResponse'
        '504':
          description: |
            No backend answered within `requestTimeoutSeconds`. Not
            cascaded: the backend is almost certainly still computing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenAIErrorResponse'

  /v1/responses/compact:
    post:
      tags: [inference]
      operationId: compactResponse
      summary: Compact a conversation into an opaque item the client can resend.
      description: |
        OpenAI's standalone compact shape. The gateway asks the requested
        model for a summary using a fixed compaction prompt: what was
        asked, decided and done, open threads, and files touched. The
        summary has a budget of 4,000 output tokens. `instructions`, when
        supplied, guides the summary alongside that fixed prompt.

        The response's output ends with a `compaction` item. Its
        `encrypted_content` is the summary, encrypted and authenticated
        with the gateway's own key, made once in an owner-only
        `compaction.key` file beside its config. The key survives a
        restart. The item is opaque to the client and needs no response store.
        The returned output is the next conversation window: send it
        intact as `input` to `/v1/responses` or this endpoint. The gateway
        decrypts a compaction item into a developer message for any model
        serving that later request.

        Admission, model routing, client-key scope, `localOnly`, the
        16 MiB JSON body limit, timeouts and metrics use the same path as
        `/v1/responses`. No client tool is executed while summarising.
        This endpoint returns JSON only. It does not add chain loading:
        `previous_response_id` remains refused until row 54 supplies it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResponsesCompactRequest'
      responses:
        '200':
          description: A compacted conversation window ending with an opaque compaction item.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponsesCompactResponse'
        '400':
          description: |
            An invalid request, a model nothing serves, a backend refusal,
            or a compaction item's `encrypted_content` that could not be
            authenticated (malformed, tampered with, or made by another
            gateway or OpenAI). The error names the field and observed
            cause and includes: "This compaction was made elsewhere; send
            the conversation instead." The same error applies to a
            compaction input on `/v1/responses`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenAIErrorResponse'
        '401':
          description: Missing, malformed, expired or revoked credential.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenAIErrorResponse'
        '500':
          description: The compaction key could not be read or created; the error names the observed cause.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenAIErrorResponse'
        '502':
          description: Every eligible backend failed, or an upstream credential was refused.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenAIErrorResponse'
        '503':
          description: A backend serves the model but is not ready, or the gateway is starting.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenAIErrorResponse'
        '504':
          description: No backend answered within requestTimeoutSeconds.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenAIErrorResponse'

  /v1/responses/input_tokens:
    post:
      tags: [inference]
      operationId: countResponseInputTokens
      summary: Count a Responses request's input tokens, without generating.
      description: |
        OpenAI's `POST /v1/responses/input_tokens` (P2c, 2026-09-28): the
        body is a Responses request, translated as `/v1/responses`
        translates it, and counted by a **ready** backend of the tier that
        would serve it, with its own template and tokenizer -- the way
        `/v1/messages/count_tokens` counts. Nothing is generated, woken or
        recorded.

        **A count this door cannot give is a 400 saying why**: a backend
        that cannot count without generating (OpenRouter has no such
        endpoint, measured), an attachment its counter cannot handle,
        or nothing running. Gemini uses native `countTokens`, including
        supported multimodal inputs; llama.cpp still cannot count images.
        A key or a listing that
        cannot be checked right now is the same 400 (fail-closed), never a
        5xx. It is admitted as `/v1/responses` is: the same key scope and
        `localOnly` rule, and the same body limit (2026-10-12).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResponsesRequest'
      responses:
        '200':
          description: The count.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponsesInputTokens'
        '400':
          description: A request this door refuses, or a count it cannot give.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenAIErrorResponse'
        '401':
          description: Missing, malformed, expired or revoked credential.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenAIErrorResponse'

  /v1/responses/{responseId}:
    parameters:
      - name: responseId
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [inference]
      operationId: retrieveResponse
      summary: Always 404 -- this gateway keeps no response store.
      description: |
        Answered so that a client asking for a stored response is told
        why there is none, in OpenAI's envelope, rather than receiving a
        framework's bare 404. `DELETE`, and the `cancel` and
        `input_items` sub-resources, answer the same way.
      responses:
        '404':
          description: No response is ever stored here.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenAIErrorResponse'

  /v1/completions:
    parameters:
      - $ref: '#/components/parameters/RepetitionMode'
    post:
      tags: [inference]
      operationId: createCompletion
      summary: OpenAI-compatible legacy completions, raw continuation and fill-in-the-middle.
      security:
        - bearerAuth: []
      description: |
        OpenAI's legacy `/v1/completions` (P6, 2026-09-28): the OpenAI
        SDK's `client.completions.create(...)` works unchanged, streamed or
        not. The model is any with the `completion` surface on
        `GET /v1/models`: a local `llama-server`, vLLM or Ollama model,
        which continue raw text (P6-4). Accounts over hosted APIs are not
        offered: OpenRouter's completions answer a prompt as a chat turn
        and ignore `suffix` (measured).

        **`prompt` is continued as written**, special tokens included, so
        an editor that renders its own fill-in-the-middle template
        (Continue does, read in its source) is answered as it expects.

        **`suffix` routes only to a model that fills in the middle**
        (`x_eugene_plexus.fill_in_middle`), in every tier; with none, a 400
        naming it. It is never dropped: `llama-server`'s own
        `/v1/completions` would drop it, so its driver uses `/infill`.

        **Tiers, as chat**: a fallback model's completion is still a
        completion, and a stream commits at its first token.

        **Refused with a 400 naming the field** in P6: `n` or `best_of`
        above 1, `echo`, `logprobs`, a `prompt` that is an array of more
        than one string or of token ids, and unknown fields.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompletionRequest'
      responses:
        '200':
          description: 'The completion, or with `stream` an SSE stream of `CompletionChunk` frames ending with the `[DONE]` sentinel.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompletionResponse'
            text/event-stream:
              schema:
                $ref: '#/components/schemas/CompletionChunk'
        '400':
          description: |
            A field this door refuses, a `suffix` no model here can fill,
            a model with no `completion` surface, or the backend's refusal.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenAIErrorResponse'
        '401':
          description: Missing, malformed, expired or revoked credential.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenAIErrorResponse'
        '404':
          description: No model by that name.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenAIErrorResponse'
        '502':
          description: Every backend failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenAIErrorResponse'
        '503':
          description: The model is served but not ready.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenAIErrorResponse'
        '504':
          description: No backend answered within `requestTimeoutSeconds`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenAIErrorResponse'

  /v1/moderations:
    post:
      tags: [inference]
      operationId: createModeration
      summary: OpenAI-compatible moderation.
      security:
        - bearerAuth: []
      description: |
        OpenAI's `/v1/moderations` (P6, 2026-09-28), in its shape: the
        OpenAI SDK's `client.moderations.create(...)` works unchanged. The
        model is any with the `moderation` surface on `GET /v1/models`,
        which today means OpenAI's `omni-moderation-*` through an OpenAI
        account: OpenRouter has no moderation door (404, measured).

        **`model` may be left out**, as the SDK does (P6-1): the one model
        with the `moderation` surface this key may use answers. With none
        or several, a 400 names the choices.

        **Same model only** (P6-2): a slot's other targets are never used,
        since categories and thresholds are the model's own; its replicas
        balance and fail over.

        **`input`** is a string, an array of strings (one result each), or
        an array of parts: `text`, and `image_url` with a `data:` URL (A4:
        the gateway never forwards a remote URL). OpenAI moderates at most
        one image per request and refuses more, relayed. Unknown fields are
        refused naming them.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModerationRequest'
      responses:
        '200':
          description: One result per input.
          content:
            application/json:
              schema:
