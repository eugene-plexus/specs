openapi: 3.1.0
info:
  title: Eugene Plexus — gateway
  version: 0.3.0-draft
  summary: The one OpenAI-compatible front door over every configured backend.
  description: |
    **Token verification (per-node token keys, 2026-09-25).** This
    component holds no signing key. Its agent gives it, at spawn:

    * the path of the install's **trust bundle** (`common.yaml`,
      `TrustBundle`), which it reloads when the file changes;
    * the pinned authority key that must have signed it;
    * its own recipient name, `node:<name>`;
    * a service token addressed to this machine alone.

    Every bearer is checked against the bundle: the key found by `kid`,
    the algorithm taken from the key, and the `typ`, `iss`, `aud`, grant
    and lifetime rules in `TrustBundle`. The key material is Ed25519
    only.

    **Signed-in app requests (U3).** An installed Workbench sends its app
    client key as the Bearer and its root-issued OIDC access token in
    `X-Eugene-Person-Token`. The active root checks the current person,
    session and app grant and binds the proof to that app key on every
    admission and renewal. The person proof cannot replace the Bearer and
    is never sent to inference drivers. Other clients remain app-only unless
    they adopt this proof protocol; supplied proofs are always validated.
    Missing or unavailable person verification fails closed.

    An app may request its model catalogue without a person by sending
    `X-Eugene-App-Operation: catalog` to `GET /v1/models`. This exception
    preserves the app key's model filter and cannot run models. The header
    is refused on every other inference route and cannot accompany a
    person proof. Model requests retain the app key's model, tool,
    locality, concurrency and rate limits.

    The gateway is the single endpoint a client talks to. It resolves a
    requested model to a backend, load-balances across the drivers
    serving that model, and cascades down a priority list when one
    fails. That is its whole job.

    **The gateway holds no backend knowledge.** One `inference-driver`
    runs per backend and owns everything backend-specific: provider
    choice, model id, secrets, generation params, health. The gateway
    owns only routing.

    The two layers are never collapsed. Keeping them separate is what
    buys three things that matter:

      * **Load balancing and concurrency.** Two replicas of one model
        on two GPUs, or a small fast model and a large one serving at
        once, need N independently-configured backends with something
        above them.
      * **Multi-host placement.** A driver belongs next to its engine.
        As separate processes, the driver runs on the remote GPU host
        and the gateway reaches it over the tailnet — which is what
        makes "GPUs in different buildings" a supported topology.
      * **Non-HTTP backends.** `claude_code_cli` and `codex_cli` are
        subprocess engines with no endpoint to proxy to. Something must
        front them with HTTP, and that something is the driver — so the
        driver has to be able to sit in the request path regardless.

    The local hop and the control plane's own work are measured separately
    from the backend. M8's historical **114-120 ms** overhead was traced
    to constructing an HTTP client and parsing CA certificates on every
    request. R1.1 replaced those clients with reused clients and measured
    **3.2 ms** end-to-end overhead against a 5 ms stub on 2026-09-18.
    Neither measurement is a latency guarantee for another deployment.
    `GET /v1/metrics` exposes the spans so their cost remains observable.

    ## Server-run tools (P8, 2026-09-29): web search

    OpenAI's and Anthropic's APIs define `web_search` as a tool the
    *provider* runs. On a local model nobody ran it: Codex's was removed
    and Claude Code's WebSearch was refused (design
    `docs/design/server-run-tools.md` §0). Now the hub runs it. A
    **tool-driver** (`tool-driver.yaml`, `ComponentKind.tool-driver`, one
    per search account -- SearXNG or Brave) executes one search; the
    gateway runs the loop around it, and never holds a search key.

    **One declaration across three doors.** `web_search_options` on
    `/v1/chat/completions`, a `web_search` tool on `/v1/responses` and a
    `web_search_<8 digits>` server tool on `/v1/messages` become one
    request for a search. Anthropic's tool is dated and **any date is
    accepted**: the settings this gateway knows (`max_uses`,
    `allowed_domains`, `blocked_domains`, `user_location`) are honoured,
    any other is dropped and named on the ignored-settings header, and
    the version seen is kept on the execution's metrics row, so the day
    Claude Code sends a new date is noticed rather than a 400.

    **A search runs only when all four hold:** the request asked for one;
    the install has a reachable tool-driver that runs `web_search`; the
    client key's `allowedTools` permits it (null permits); and the key is
    **not** `localOnly` -- a search sends a query made from the prompt to
    the public internet, a SearXNG on the LAN included. On `/v1/responses`
    `external_web_access: false` is also a no (design call #2): Codex
    sends `false` unless its user chose live search, and that user did not
    ask for their prompt to leave the machine.

    **Where it runs.** A backend whose model lists `webSearchOptions` in
    `supportedSettings` searches itself: the request is **forwarded, not
    run twice**, and its citations come back as P2c's `annotations`. Any
    other backend must call tools (`capabilities.toolCalling`). The
    gateway offers it one function tool, `web_search(query)` (another
    name when the caller already declared that one), and:

      1. calls the model;
      2. runs each `web_search` call the model made on a tool-driver and
         hands the results back as a tool message -- titles, addresses,
         excerpts and dates, with an instruction to cite what it uses as
         markdown links;
      3. calls the model again, up to `max_tool_calls` (Responses),
         `max_uses` (Anthropic), else the gateway's `maxToolCalls`
         setting (default 5, design call #6). A call past the limit is
         answered *no more searches are available* rather than run.

    A model turn that asks for a search **and** calls one of the caller's
    own functions has its function calls dropped and is asked again with
    the results: the caller only ever sees function calls from a turn
    with no search pending, so nothing about a search has to survive
    between two of the caller's requests. When search is the **only**
    tool the caller offered -- `web_search_options` with no functions, or
    Claude Code's WebSearch request, which offers exactly one tool -- the
    first model call must call a tool, because the caller asked for a
    search and not for an opinion about whether to search. A model that
    refuses a forced tool choice (Anthropic documents this for Claude
    Opus 5.5, Sonnet 5.5 and Fable 5.1) is asked that one turn again,
    once, with the choice left to it and an instruction to search; a
    caller's own forced choice is never loosened.

    **Failover ends at the first search.** Every model call after the
    first goes to the backend that answered the first, and a failure
    after a search has run is reported, never retried elsewhere: the
    search was a side effect with a cost, its results are now in the
    conversation, and another model continuing it would be the seam M10
    forbids for tokens. A search that fails is not a failed request:
    the model is told the search failed and why, and answers without it,
    as Anthropic's API does.

    **What the caller gets back** is the answer plus each door's own
    record of what ran: `url_citation` annotations on chat (one per
    result address the answer cites) and `x_eugene_plexus.web_searches`;
    on Responses a `web_search_call` item per search (`action.query`,
    `action.sources`) before the message that used it, streamed as
    `response.web_search_call.in_progress` → `.searching` → `.completed`
    so a slow search reads as working, with `url_citation` annotations on
    the text; on messages a `server_tool_use` block and a
    `web_search_tool_result` block per search (an error block when it
    failed) and `usage.server_tool_use.web_search_requests`. A client
    that hands those items back on its next request is not refused: they
    become the history the model reads.

    **When a search cannot run** the door says why, in its own way. Chat
    keeps P2c's routing (only a model that searches itself) and its 400
    names the reason nothing else could. Responses removes the tool, as
    it always has, names it on the ignored-settings header and gives the
    reason in `x-eugene-plexus-web-search`. Messages answers 400 with the
    reason, because Claude Code's WebSearch request exists only to search
    and answering it without one would invent results.

    ### `image_generation` (P8e, 2026-09-29)

    OpenAI defines `image_generation` for the Responses API only, so it
    runs on `/v1/responses` alone. The same loop offers the model one
    more function, `image_generation(prompt)` (plus `size` when the tool
    left it unset), and answers each call **in-process through the
    images door's own routing** (P4): the key's `allowedModels`, the
    model's listed image settings and its tiers, exactly as a
    `POST /v1/images/generations` would be -- no second HTTP hop. The
    image model is the tool's `model` when this install serves it for the
    key; else the gateway's `imageToolModel` setting; else the one image
    model the key may use, when there is exactly one.

    **The model is told in words, never shown the image**: that an image
    was made for its prompt, at what size, and is shown to the person.
    The caller gets it as OpenAI returns it, an `image_generation_call`
    item whose `result` is the base64 image, streamed as
    `response.image_generation_call.in_progress` → `.generating` →
    `.completed`. The tool's `size`, `quality`, `background`,
    `output_format`, `output_compression` and `moderation` ride on the
    images request; `partial_images`, `input_image_mask`,
    `input_fidelity` and an `action` other than `generate`/`auto` are
    named on the ignored-settings header. One `max_tool_calls` budget
    covers searches and images alike, and failover ends at the first
    execution of either.

    **When it cannot run** -- no image model for this key, a key whose
    `allowedTools` does not include `image_generation`, or a model with
    no backend that calls tools -- the request is a 400 naming the
    reason, as the tool was refused before P8e. It is never removed
    silently: a caller that offered image generation and got none would
    read the model's refusal as the model's. An image that fails to be
    made is told to the model, which answers without it, and its item is
    `failed`.

    ### Remote MCP (row 59b, 2026-10-26)

    A Responses request may carry `{"type": "mcp", "server_label",
    "server_url", "headers", "authorization", "allowed_tools",
    "require_approval", "server_description"}`, as on OpenAI. The gateway
    runs the loop; a **tool-driver** connects to the server
    (`/v1/tools/mcp/list_tools` and `/v1/tools/mcp/call` in
    `tool-driver.yaml`), so egress, its address rules and the caller's
    credential stay with the other server-run tools. `connector_id`
    (OpenAI's own connectors) is refused: there is no such connector here.

    **It runs only when all five hold:** the gateway's `remoteMcp` setting
    is not `off`; the install has a tool-driver that lists `mcp` (every
    search account's process does); the client key's `allowedTools`
    permits `mcp` (null permits); the key is not `localOnly`, since the
    model's arguments leave the machine; and the model has a backend that
    calls tools. Otherwise the request is a 400 naming which, never a
    silent removal.

    **Where it may connect** is the owner's setting `remoteMcp` (*Remote
    MCP from API clients*, call R59-MCP): `internet` (the default) reaches
    globally routable addresses over https only; `network`, an expert
    choice, also reaches the owner's own network (and plain http there);
    `off` refuses the tool. This machine's loopback, link-local and cloud
    metadata addresses are never reached. A server URL the rule refuses is
    a 400 naming the rule and the address.

    **The tools.** Each server's tools are listed once per request -- or
    taken from an `mcp_list_tools` item for that `server_label` already in
    `input` -- and the list comes back as an `mcp_list_tools` output item.
    A list that cannot be read is a 424 naming the cause. Each tool is
    offered to the model as a function: its own name when one MCP server
    is offered and the name is free, else `<server_label>__<name>`; a name
    a function may not carry is made safe with a short hash. `allowed_tools`
    (a list of names, or `{"tool_names"}`) narrows the list.

    **Approval.** `require_approval` is `always` (the default, as on
    OpenAI), `never`, or `{"always": {"tool_names"}, "never":
    {"tool_names"}}`; a tool neither names needs approval unless only
    `always` was given. A call that needs approval is not run: the
    response ends with an `mcp_approval_request` item (`id`,
    `server_label`, `name`, `arguments`). The caller answers with an
    `mcp_approval_response` item (`approval_request_id`, `approve`,
    `reason`) in the next request, whose `input` carries the request item
    too. **An approval for an id no `mcp_approval_request` in the
    conversation carries is refused** with a 400, as is one for a server
    the request's tools do not name, and two for one id. An approved call
    runs before the model is called and comes back as an `mcp_call` item
    carrying `approval_request_id`; a declined one is told to the model.
    A call already answered by an `mcp_call` in `input` is never run
    again.

    **What the caller gets back:** `mcp_call` items (`id`, `server_label`,
    `name`, `arguments`, `output`, `error`, `approval_request_id`),
    streamed as `response.mcp_call.in_progress` then `.completed` or
    `.failed`, and `mcp_list_tools` items streamed as
    `response.mcp_list_tools.in_progress` then `.completed`. A call that
    fails is told to the model, which answers without it. Handed back in
    `input`, the items become the history the model reads.

    **Limits:** 20 MCP calls per response (`max_tool_calls` lowers it),
    after which the model is told none are left; 30 s per call, 8 MiB per
    answer and 64 tools per server, each enforced by the tool-driver and
    named when hit. Failover ends at the first call, as for a search.

    **The caller's credential** (`headers`, `authorization`) goes to the
    tool-driver for one call and from there to that server only. It is
    never logged, never in metrics, never in an error's words, and never
    echoed: the response's `tools` carry an `mcp` tool without `headers`
    or `authorization`. A metrics row per call records the tool, the
    outcome and the time, not the server, the tool's name or its
    arguments.

    ## Where the routing table comes from

    The gateway does not store backend URLs. It reads the agent
    topology (`GET /v1/components`, `kind: inference-driver`, and
    `kind: tool-driver` for the search accounts, P8) and asks
    each driver's `/v1/info` which models it is serving, then builds
    model → drivers from the answers. Backend URLs live in exactly one
    place — the agent topology — and are never duplicated into the
    gateway's own config.

    **A driver serves one model or, as a provider account, many (P1,
    2026-09-27).** Every entry of its `models` list is a routing
    candidate, keyed by **(node, driver, model)**. A single-model
    driver's entry is published under its own id; an account's under
    `<driver name>/<id>`, with the gateway adding the prefix because a
    driver does not know its name. The same driver name on two machines
    is therefore one account served from both, a replica per model,
    exactly as a model alias on two machines is today. Every request the
    gateway sends a driver names its `model`, unprefixed.

    Each driver is joined to the engine runtime it follows by the
    `runtime` it reports on `/v1/info` — by **(node, name)**, never by alias,
    because two replicas share an alias and a join by alias loses
    exactly the case load balancing is for. The join is what enforces
    the rule the runtime contract has stated since M0: **a driver whose
    runtime is not `ready` is not routed to.** A driver reports its
    model from config whether or not its engine answers, so without
    the gate a stopped replica would take every other request. A driver
    that follows no runtime — a cloud provider, a CLI subscription — is
    eligible whenever it is reachable; there is no engine of ours for
    it to be waiting on.

    The gateway finds the control root through its own agent, and an
    operator can override it. On every refresh, with `controlUrl`
    unset, it asks the agent it was started by: `GET /v1/node` names
    the control root this node is enrolled to, and failing that
    `GET /v1/components` names the `control` component the agent
    declares — the two places a host already knows where its install's
    root is. Then it reads the control root's `GET /v1/nodes` for the
    list of agents and reads each agent's `/v1/components` and
    `/v1/runtimes` directly — not the control root's union views, whose
    `RuntimePlacement` carries no lifecycle fields, and not through a
    poll that would die with the control root and take model swapping
    down with management. The control root contributes the one thing
    only it knows: which agents exist and where, which is also how a
    stop or start reaches the agent that owns a runtime on another
    host. A host whose agent is neither enrolled nor running a control
    root is a single-host install, and the one configured agent is all
    of it.

    `controlUrl` set is the topmost override and is used as given, even
    when it is wrong; `GET /v1/admin/routing` says which of the three
    the table was built from and whether the root answered. Before
    2026-09-13 nothing set the field at all — not the installers, not
    the container, not the agent's first boot — so every multi-host
    install came up with its workers enrolled, reachable and invisible
    to routing until an operator found the field.

    ## Lifecycle policy (M6)

    The gateway is the component that sees demand, so it is the one
    that acts on it. Design: `docs/design/m6-lifecycle-policy.md`.

    * **Every model is a slot; a slot is an ordered list of tiers; a
      tier is every eligible driver serving one model id.** A request
      for model `X` is served by the drivers serving `X`, load-balanced.
      A `modelSlots` entry extends that with targets — model ids tried
      in order when the tiers before them have nothing that answers. A
      cloud subscription is a target like any other, because a
      `claude_code_cli` driver already serves a model id.
    * **Within a tier, least outstanding requests**, weighted by the
      runtime's `parallelSlots`, ties broken round-robin. The signal is
      the gateway's own in-flight count, which exists for every engine;
      vLLM's `/load` is real and llama.cpp has nothing like it, so the
      balancer uses neither.
    * **Cascade within the tier, then to the next tier.** Transport
      errors and 5xx cascade; a 4xx does not, and **a deadline that
      fired does not either**. A backend that has not answered in time
      is still computing this prompt, and the next replica would take
      the same time to compute the same thing — so a read timeout, and
      a 504 from the driver's own deadline, come back as a 504 naming
      `requestTimeoutSeconds` rather than as "every backend failed". A
      *connect* timeout is a dead host, took no work, and still
      cascades. `attempts` counts every backend tried and `tier` says
      where the answer came from.
    * **Idle unload.** A runtime that declared `idleUnloadSeconds` is
      stopped, through its node's agent, once that long has passed
      with no request for its model and nothing in flight.
    * **Start on demand.** A request whose tiers are all asleep wakes a
      `startOnDemand` runtime, waits up to `swapWaitSeconds` for
      `ready`, and serves. A tier with a startable runtime is **awaited,
      not skipped**: falling straight through to a cloud target because
      the local model was idle would spend money precisely because idle
      unload worked. If the wake is refused on admission, the gateway
      may first stop the most-idle runtimes that themselves declared an
      idle timeout — eviction bounded by opt-in.

    None of this is replicated state. Which runtimes are loaded is an
    observation, re-read from the agents after a control-root
    promotion; the policy fields ride on each `RuntimeSpec` and
    replicate with the declaration. The gateway talks to the owning
    node's agent directly rather than through the control root, so
    model swapping keeps working while management is down — the
    surviving data path M5 tested.

    ## The gateway owns every output-affecting parameter

    Temperature, max tokens and stop sequences ride on every request
    the gateway makes downstream. A driver never substitutes a local
    default for a parameter the caller omitted: if a value reaches a
    backend, the gateway put it there. Per-model settings profiles
    resolve here, on the way through.

    ## Safe mode

    The gateway honors the agent's safe-mode env var:
    `EUGENE_PLEXUS_GATEWAY_SAFE_MODE=1` at startup makes it ignore its
    persisted config file and boot from built-in defaults. This is the
    recovery flow when a config edit breaks startup — the operator can
    still reach `/v1/config` to fix the persisted file, then restart
    without the env var. Inference requests fail while safe mode is
    active; `PATCH /v1/config` writes to the on-disk config normally.

    ## Auth

    Every endpoint except `/healthz` requires a bearer token. UI calls
    present the operator's session token (issued by the agent after
    passphrase login); component-to-component calls present the
    per-component service token threaded via env var at spawn time.

    ### Client keys, on the front door only (2026-09-15)

    A third audience arrived with the hobbyist UX work: `aud: client`,
    a long-lived named key the agent mints
    (`POST /v1/auth/client-keys`) for an app outside the install --
    Continue, Cline, Open WebUI, SillyTavern, the OpenAI SDK, `curl`.
    **This gateway accepts it on the inference and tool front-door paths
    and nowhere else** -- the three OpenAI-compatible ones; since R4
    `POST /v1/messages`, the same audience arriving through a different
    protocol; and since B2 `POST /v1/systemone`, the TypeSafe-shaped
    decision door, for the same reason. `POST /v1/web_search` also accepts
    it for Open WebUI's external search engine (row 34), with the key's
    tool scope, locality, rate and concurrency limits and attribution.
    `/v1/config`, `/v1/admin/*` and `/v1/metrics` refuse
    it exactly as they refuse a driver's service token, and so does
    every other component in the install: an `ep-client+jwt` is a class
    no other route accepts. It must also be signed by a key the trust
    bundle grants `authority`; a node's key cannot mint one.

    That narrowing is the point of the audience. Before it, the only
    bearer a person could paste into a harness was their **operator
    session token** -- full authority over every component, obtainable
    only from a diagnostic panel inside the UI, and dead fourteen days
    after sign-in. A key scoped to the front door can be handed out,
    written into a config file, and revoked one at a time.

    **Revocation is a policy this gateway polls, and it is bounded rather
    than instant.** A client token carries a `jti`; the agent on this
    gateway's own node relays the control root's client-key policy (the
    revoked ids, the permitted identifiers and how old a copy may be) at
    `GET /v1/auth/client-keys/policy`. This gateway re-reads it within the
    age the policy allows, so revoking a key stops it here within about
    that interval. **If the
    agent cannot be reached the previous list keeps being used and
    requests keep being served** -- taking every harness in an install
    down because the local agent restarted would be a worse failure than
    a revoked key living a few seconds longer, and the token still has
    to carry a valid signature and an unexpired `exp`. The instant,
    total revocation is rotating the control root's token key
    (`control.yaml`, `POST /v1/control/rotate-key`), after which every
    client key and session stops verifying.

    A client key is **not** a per-request identity. Nothing here records
    which key served a request; `/v1/metrics` counts backends, not
    callers.

    ## Browsers, and CORS

    The front-door paths -- `GET /v1/models`,
    `POST /v1/chat/completions`, `POST /v1/embeddings`,
    `POST /v1/messages`, `POST /v1/responses` and
    `POST /v1/web_search` -- answer CORS,
    so a web page on another origin can use the front door the way a
    non-browser client always could: the UI playground's direct mode,
    Open WebUI in a tab, a web app on the OpenAI SDK. **`/v1/messages`
    is in the set for a reason that is on the wire**: Anthropic's own
    browser SDK path sends
    `anthropic-dangerous-direct-browser-access: true`, and Claude Code
    sends it too, so a browser client of this door is a shape its
    authors expect. The default allowed request headers therefore
    include `x-goog-api-key`, `x-api-key`, `anthropic-version` and `anthropic-beta`
    alongside `authorization` and `content-type` -- **as a fallback
    that agrees with the surface, not as the mechanism.** The reply
    ECHOES `access-control-request-headers` whenever a preflight sends
    one, and a real browser always does, so those three are already
    allowed by the echo. R4's first draft claimed the opposite and its
    own sabotage pass disproved it: removing `x-api-key` from the
    default changed no browser outcome at all.
    A preflight is
    answered before auth (it carries no bearer by definition), every
    response on those paths carries `Access-Control-Allow-Origin` and
    `Access-Control-Expose-Headers` naming `Retry-After`, `X-Request-ID`
    and every `x-eugene-plexus-*` header (U4, 2026-09-28: a browser hides
    any header not named, so a page could not read what served its
    request), and **no other path does**: `/v1/config`, `/v1/admin/*` and
    `/v1/metrics` stay same-origin, because a browser client needs the
    front door and nothing else. The Gemini front-door routes under
    `/v1beta/models` and `/v1/models` are in this same CORS set; the
    x-goog-api-key header and x-eugene-plexus-* response headers work
    under the same policy.

    Any origin by default, no credentials. CORS exists to stop a page
    spending credentials the browser attaches on its own -- cookies,
    HTTP auth -- and the front door has none: a page without the bearer
    gets the 401 a `curl` without one gets. Two live config fields
    change it: `corsAllowedOrigins` (a list; empty means any) and
    `corsEnabled` (off refuses browsers entirely). A refused preflight
    is a `403` `Problem` naming the origin and the key, because a
    browser reports every CORS failure as `Failed to fetch`.

    Until 2026-09-13 a preflight here was answered `405 Method Not
    Allowed`, measured live; nothing had noticed because the UI
    reaches this gateway through the agent's same-origin proxy.
