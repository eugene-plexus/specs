openapi: 3.1.0
info:
  title: Eugene Plexus — gateway
  version: 0.3.0-draft
  summary: The one OpenAI-compatible front door over every configured backend.
  description: |
    The gateway is the single endpoint a client talks to. It resolves a
    requested model to a backend, load-balances across the drivers
    serving that model, and cascades down a priority list when one
    fails. That is its whole job.

    **The gateway holds no backend knowledge.** One `inference-driver`
    runs per backend and owns everything backend-specific: provider
    choice, model id, secrets, generation params, health. The gateway
    owns only routing.

    The two layers are never collapsed. Keeping them separate is what
    buys three things that matter:

      * **Load balancing and concurrency.** Two replicas of one model
        on two GPUs, or a small fast model and a large one serving at
        once, need N independently-configured backends with something
        above them.
      * **Multi-host placement.** A driver belongs next to its engine.
        As separate processes, the driver runs on the remote GPU host
        and the gateway reaches it over the tailnet — which is what
        makes "GPUs in different buildings" a supported topology.
      * **Non-HTTP backends.** `claude_code_cli` and `codex_cli` are
        subprocess engines with no endpoint to proxy to. Something must
        front them with HTTP, and that something is the driver — so the
        driver has to be able to sit in the request path regardless.

    The extra local hop is sub-millisecond against a multi-second
    generation. It is not a cost worth optimising away.

    ## Where the routing table comes from

    The gateway does not store backend URLs. It reads the watchdog
    topology (`GET /v1/components`, `kind: inference-driver`) and asks
    each driver's `/v1/info` what model it is serving, then builds
    model → drivers from the answers. Backend URLs live in exactly one
    place — the watchdog topology — and are never duplicated into the
    gateway's own config.

    ## The gateway owns every output-affecting parameter

    Temperature, max tokens and stop sequences ride on every request
    the gateway makes downstream. A driver never substitutes a local
    default for a parameter the caller omitted: if a value reaches a
    backend, the gateway put it there. Per-model settings profiles
    resolve here, on the way through.

    ## Safe mode

    The gateway honors the watchdog's safe-mode env var:
    `EUGENE_PLEXUS_GATEWAY_SAFE_MODE=1` at startup makes it ignore its
    persisted config file and boot from built-in defaults. This is the
    recovery flow when a config edit breaks startup — the operator can
    still reach `/v1/config` to fix the persisted file, then restart
    without the env var. Inference requests fail while safe mode is
    active; `PATCH /v1/config` writes to the on-disk config normally.

    ## Auth

    Every endpoint except `/healthz` requires a bearer token. UI calls
    present the operator's session token (issued by the watchdog after
    passphrase login); component-to-component calls present the
    per-component service token threaded via env var at spawn time.
  license:
    name: Apache-2.0
    identifier: Apache-2.0
  contact:
    name: Eugene Plexus
    url: https://github.com/eugene-plexus
servers:
  - url: http://{host}:{port}
    description: Default LAN deployment.
    variables:
      host:
        default: localhost
      port:
        default: '8080'

security:
  - bearerAuth: []

tags:
  - name: admin
    description: Inspect and manage the running gateway.
  - name: config
    description: |
      Remote-editable configuration. Every Eugene Plexus component
      implements the same config trio (`GET /v1/config`,
      `GET /v1/config/schema`, `PATCH /v1/config`) so a single UI can
      manage all components without per-component code.
  - name: meta
    description: Versioning and health.

paths:
  /v1/admin/drivers:
    get:
      tags: [admin]
      operationId: listDrivers
      summary: Report the gateway's configured drivers.
      description: |
        Surfaces what the gateway sees when it queries each
        driver's `/v1/info`, in the order the operator configured
        them. Used by the UI to render dynamic per-driver tabs and by
        ops to confirm the topology.
      responses:
        '200':
          description: Driver topology snapshot.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriversInfo'
        '503':
          description: All configured drivers are unreachable.
          content:
            application/problem+json:
              schema:
                $ref: 'components/common.yaml#/components/schemas/Problem'

  /v1/admin/drivers/probe:
    post:
      tags: [admin]
      operationId: probeDriver
      summary: Test-connect to an arbitrary driver URL without persisting it.
      description: |
        Used by the UI's per-URL "Test" buttons in the drivers list
        editor — same affordance Sonarr / Radarr expose next to each
        indexer entry. Fetches `<url>/v1/info` once, reports
        reachability + backend identity, and returns. Does not touch
        the saved config; safe to call against unsaved form values.

        Probes a *single* URL. A driver slot is a priority list of
        backends (see `DriverEntry.backends`, which are topology entry
        names); the UI resolves each name to a URL via the watchdog
        topology and calls this once per backend so each fallback can
        be tested independently.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DriverProbeRequest'
      responses:
        '200':
          description: |
            Probe outcome. Returned for both reachable and unreachable
            cases — `reachable` distinguishes them, `error` carries the
            failure detail when set.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriverHealth'
        '400':
          $ref: 'components/common.yaml#/components/responses/Problem'

  /v1/admin/restart:
    post:
      tags: [admin]
      operationId: restart
      summary: Schedule a process restart so `requiresRestart` config takes effect.
      description: |
        Some config keys (driver list, ports, etc.) carry
        `requiresRestart: true` because the gateway only reads them
        at startup. Calling this endpoint tells the gateway to
        exit shortly after responding; an external supervisor (systemd,
        docker, deploy launcher) brings it back up with the new config
        in effect. The endpoint returns *before* the exit so the HTTP
        response has time to flush.

        v0.1 personal-use installations without a supervisor will
        require a manual relaunch. The UI should make this clear in the
        confirmation dialog.

        ## Auth note (v0.1)

        Unauthenticated, same as the rest of the v0.1 admin surface
        (assumed Tailscale tailnet). Auth lands in v0.2.
      responses:
        '202':
          description: Restart scheduled.
          content:
            application/json:
              schema:
                $ref: 'components/common.yaml#/components/schemas/RestartResult'
  /v1/config:
    get:
      tags: [config]
      operationId: getConfig
      summary: Read the gateway's current effective configuration.
      description: |
        Returns every config field's currently effective value. Values
        of fields with `sensitive: true` are redacted as the literal
        string `"<redacted>"`.

        (v0.2) Notable config additions: `identityUrl` for the
        identity component, and an extended `defaultSystemPrompt`
        that may be empty when the gateway should always
        assemble prompts from identity-component data.
      responses:
        '200':
          description: Current config.
          content:
            application/json:
              schema:
                $ref: 'components/common.yaml#/components/schemas/ConfigDocument'
    patch:
      tags: [config]
      operationId: updateConfig
      summary: Partial update of the gateway's configuration.
      description: |
        Accepts a partial map of `key -> new-value` pairs. Each key is
        validated against its `ConfigField` definition. Validation
        errors are reported per-key without aborting the whole
        request — valid changes are applied, invalid ones are
        rejected and surfaced in the response.

        Some fields require a process restart to take effect (see
        `ConfigField.requiresRestart`). The response indicates whether
        a restart is needed and which keys are queued.

        ## Auth note (v0.1)

        Same caveat as `GET /v1/config`: in v0.1, anyone on the network
        can change gateway config. Auth lands in v0.2.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: 'components/common.yaml#/components/schemas/ConfigUpdateRequest'
      responses:
        '200':
          description: Update outcome (may include per-field rejections).
          content:
            application/json:
              schema:
                $ref: 'components/common.yaml#/components/schemas/ConfigUpdateResult'
        '400':
          $ref: 'components/common.yaml#/components/responses/Problem'

  /v1/config/schema:
    get:
      tags: [config]
      operationId: getConfigSchema
      summary: UI-renderable description of every editable config field.
      description: |
        Returns a `ConfigSchema` listing every config field the
        gateway accepts, with type, default, validation hints,
        and UI metadata (label, description, category, sensitive flag,
        restart-required flag). UIs use this to render a generic
        config editor without gateway-specific code.
      responses:
        '200':
          description: Config schema.
          content:
            application/json:
              schema:
                $ref: 'components/common.yaml#/components/schemas/ConfigSchema'

  /v1/config/test:
    post:
      tags: [config]
      operationId: testConfig
      summary: Test the effective config without committing it.
      description: |
        Probes every driver the gateway can route to, hitting each
        `/v1/info`, using the saved config merged with the optional
        `overrides`. The override values are NOT persisted. Use this
        from the UI's "Test Connection" button to verify the routing
        table and timeouts before saving.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: 'components/common.yaml#/components/schemas/ConfigTestRequest'
      responses:
        '200':
          description: Test result. Returned for both success and failure cases.
          content:
            application/json:
              schema:
                $ref: 'components/common.yaml#/components/schemas/ConfigTestResult'

  /healthz:
    get:
      tags: [meta]
      operationId: healthz
      summary: Liveness / readiness probe.
      security: []
      responses:
        '200':
          description: Healthy.
          content:
            application/json:
              schema:
                $ref: 'components/common.yaml#/components/schemas/Health'
        '503':
          description: One or more dependencies unhealthy.
          content:
            application/json:
              schema:
                $ref: 'components/common.yaml#/components/schemas/Health'

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: |
        Bearer session token issued by the watchdog. Operator
        sessions are issued via `POST /v1/auth/login` on the
        watchdog; component-internal calls use service tokens
        threaded to spawned children via env var at startup.

  schemas:
    DriverProbeRequest:
      type: object
      description: |
        Request body for `POST /v1/admin/drivers/probe`. Tests a single
        backend URL without persisting it. A driver slot may hold
        several backends (`DriverEntry.backends`, topology entry names);
        the UI resolves each to a URL and probes them separately so an
        operator can verify every fallback before saving.
      required:
        - url
      properties:
        url:
          type: string
          format: uri
          description: The single backend base URL to test-connect.
        name:
          type: string
          description: |
            Optional slot label, echoed into diagnostics. Not required
            to probe; the operator may be testing a URL before naming
            the slot.

    DriversInfo:
      type: object
      required:
        - drivers
      properties:
        drivers:
          type: array
          description: |
            Per-driver health snapshot, ordered as the gateway's
            `drivers` config declared them.
          items:
            $ref: '#/components/schemas/DriverHealth'

    DriverHealth:
      type: object
      description: |
        What the gateway sees from one inference-driver's `/v1/info`,
        plus the gateway-side reachability status and the
        operator-supplied `name`.
      required:
        - name
        - reachable
      properties:
        name:
          type: string
          description: |
            Operator-supplied driver name from the gateway's
            `drivers` config. UI uses this as the tab/column label.
        reachable:
          type: boolean
        url:
          type: string
          format: uri
          description: How the gateway reaches this driver.
        backend:
          $ref: 'components/common.yaml#/components/schemas/BackendKind'
        modelId:
          type: string
        version:
          type: string
        error:
          type: string
          description: 'Populated when `reachable: false`.'
