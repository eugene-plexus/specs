openapi: 3.1.0
info:
  title: Eugene Plexus — gateway
  version: 0.3.0-draft
  summary: The one OpenAI-compatible front door over every configured backend.
  description: |
    The gateway is the single endpoint a client talks to. It resolves a
    requested model to a backend, load-balances across the drivers
    serving that model, and cascades down a priority list when one
    fails. That is its whole job.

    **The gateway holds no backend knowledge.** One `inference-driver`
    runs per backend and owns everything backend-specific: provider
    choice, model id, secrets, generation params, health. The gateway
    owns only routing.

    The two layers are never collapsed. Keeping them separate is what
    buys three things that matter:

      * **Load balancing and concurrency.** Two replicas of one model
        on two GPUs, or a small fast model and a large one serving at
        once, need N independently-configured backends with something
        above them.
      * **Multi-host placement.** A driver belongs next to its engine.
        As separate processes, the driver runs on the remote GPU host
        and the gateway reaches it over the tailnet — which is what
        makes "GPUs in different buildings" a supported topology.
      * **Non-HTTP backends.** `claude_code_cli` and `codex_cli` are
        subprocess engines with no endpoint to proxy to. Something must
        front them with HTTP, and that something is the driver — so the
        driver has to be able to sit in the request path regardless.

    The extra local *hop* is sub-millisecond against a multi-second
    generation. **What that sentence does not license, and used to imply,
    is that the two-layer split is free.** M8's phase decomposition
    measured gateway-side elapsed minus the driver's own `latencyMs` at
    **114-120 ms, consistently**, on completions of about a second — and
    narrowed it to the HTTP driver path, since a subprocess backend shows
    6 ms. Not the network: the loopback hop really is sub-millisecond.
    A finding rather than a conclusion; diagnosing it is its own piece of
    work, and `GET /v1/metrics` now has the numbers. The layering is
    still right for the reasons above, but it is not free, and this
    document asserted for eight milestones that it was.

    ## Where the routing table comes from

    The gateway does not store backend URLs. It reads the agent
    topology (`GET /v1/components`, `kind: inference-driver`) and asks
    each driver's `/v1/info` what model it is serving, then builds
    model → drivers from the answers. Backend URLs live in exactly one
    place — the agent topology — and are never duplicated into the
    gateway's own config.

    Each driver is joined to the engine runtime it follows by the
    `runtime` it reports on `/v1/info` — by **name**, never by alias,
    because two replicas share an alias and a join by alias loses
    exactly the case load balancing is for. The join is what enforces
    the rule the runtime contract has stated since M0: **a driver whose
    runtime is not `ready` is not routed to.** A driver reports its
    `modelId` from config whether or not its engine answers, so without
    the gate a stopped replica would take every other request. A driver
    that follows no runtime — a cloud provider, a CLI subscription — is
    eligible whenever it is reachable; there is no engine of ours for
    it to be waiting on.

    The gateway finds the control root through its own agent, and an
    operator can override it. On every refresh, with `controlUrl`
    unset, it asks the agent it was started by: `GET /v1/node` names
    the control root this node is enrolled to, and failing that
    `GET /v1/components` names the `control` component the agent
    declares — the two places a host already knows where its install's
    root is. Then it reads the control root's `GET /v1/nodes` for the
    list of agents and reads each agent's `/v1/components` and
    `/v1/runtimes` directly — not the control root's union views, whose
    `RuntimePlacement` carries no lifecycle fields, and not through a
    poll that would die with the control root and take model swapping
    down with management. The control root contributes the one thing
    only it knows: which agents exist and where, which is also how a
    stop or start reaches the agent that owns a runtime on another
    host. A host whose agent is neither enrolled nor running a control
    root is a single-host install, and the one configured agent is all
    of it.

    `controlUrl` set is the topmost override and is used as given, even
    when it is wrong; `GET /v1/admin/routing` says which of the three
    the table was built from and whether the root answered. Before
    2026-09-13 nothing set the field at all — not the installers, not
    the container, not the agent's first boot — so every multi-host
    install came up with its workers enrolled, reachable and invisible
    to routing until an operator found the field.

    ## Lifecycle policy (M6)

    The gateway is the component that sees demand, so it is the one
    that acts on it. Design: `docs/design/m6-lifecycle-policy.md`.

    * **Every model is a slot; a slot is an ordered list of tiers; a
      tier is every eligible driver serving one model id.** A request
      for model `X` is served by the drivers serving `X`, load-balanced.
      A `modelSlots` entry extends that with targets — model ids tried
      in order when the tiers before them have nothing that answers. A
      cloud subscription is a target like any other, because a
      `claude_code_cli` driver already serves a model id.
    * **Within a tier, least outstanding requests**, weighted by the
      runtime's `parallelSlots`, ties broken round-robin. The signal is
      the gateway's own in-flight count, which exists for every engine;
      vLLM's `/load` is real and llama.cpp has nothing like it, so the
      balancer uses neither.
    * **Cascade within the tier, then to the next tier.** Transport
      errors and 5xx cascade; a 4xx does not, and **a deadline that
      fired does not either**. A backend that has not answered in time
      is still computing this prompt, and the next replica would take
      the same time to compute the same thing — so a read timeout, and
      a 504 from the driver's own deadline, come back as a 504 naming
      `requestTimeoutSeconds` rather than as "every backend failed". A
      *connect* timeout is a dead host, took no work, and still
      cascades. `attempts` counts every backend tried and `tier` says
      where the answer came from.
    * **Idle unload.** A runtime that declared `idleUnloadSeconds` is
      stopped, through its node's agent, once that long has passed
      with no request for its model and nothing in flight.
    * **Start on demand.** A request whose tiers are all asleep wakes a
      `startOnDemand` runtime, waits up to `swapWaitSeconds` for
      `ready`, and serves. A tier with a startable runtime is **awaited,
      not skipped**: falling straight through to a cloud target because
      the local model was idle would spend money precisely because idle
      unload worked. If the wake is refused on admission, the gateway
      may first stop the most-idle runtimes that themselves declared an
      idle timeout — eviction bounded by opt-in.

    None of this is replicated state. Which runtimes are loaded is an
    observation, re-read from the agents after a control-root
    promotion; the policy fields ride on each `RuntimeSpec` and
    replicate with the declaration. The gateway talks to the owning
    node's agent directly rather than through the control root, so
    model swapping keeps working while management is down — the
    surviving data path M5 tested.

    ## The gateway owns every output-affecting parameter

    Temperature, max tokens and stop sequences ride on every request
    the gateway makes downstream. A driver never substitutes a local
    default for a parameter the caller omitted: if a value reaches a
    backend, the gateway put it there. Per-model settings profiles
    resolve here, on the way through.

    ## Safe mode

    The gateway honors the agent's safe-mode env var:
    `EUGENE_PLEXUS_GATEWAY_SAFE_MODE=1` at startup makes it ignore its
    persisted config file and boot from built-in defaults. This is the
    recovery flow when a config edit breaks startup — the operator can
    still reach `/v1/config` to fix the persisted file, then restart
    without the env var. Inference requests fail while safe mode is
    active; `PATCH /v1/config` writes to the on-disk config normally.

    ## Auth

    Every endpoint except `/healthz` requires a bearer token. UI calls
    present the operator's session token (issued by the agent after
    passphrase login); component-to-component calls present the
    per-component service token threaded via env var at spawn time.

    ### Client keys, on the front door only (2026-09-15)

    A third audience arrived with the hobbyist UX work: `aud: client`,
    a long-lived named key the agent mints
    (`POST /v1/auth/client-keys`) for an app outside the install --
    Continue, Cline, Open WebUI, SillyTavern, the OpenAI SDK, `curl`.
    **This gateway accepts it on the four front-door paths and nowhere
    else** -- the three OpenAI-compatible ones and, since R4,
    `POST /v1/messages`, which is the same audience arriving through a
    different protocol. `/v1/config`, `/v1/admin/*` and `/v1/metrics` refuse
    it exactly as they refuse a driver's service token, and so does
    every other component in the install: `client` matches neither
    `operator` nor the `service:` prefix that every other check tests
    for.

    That narrowing is the point of the audience. Before it, the only
    bearer a person could paste into a harness was their **operator
    session token** -- full authority over every component, obtainable
    only from a diagnostic panel inside the UI, and dead fourteen days
    after sign-in. A key scoped to the front door can be handed out,
    written into a config file, and revoked one at a time.

    **Revocation is a list this gateway polls, and it is bounded rather
    than instant.** A client token carries a `jti`; the agent on this
    gateway's own node keeps the records and serves the revoked ids at
    `GET /v1/auth/client-keys/revoked`. This gateway re-reads that list
    when its copy is older than the routing refresh interval, so
    revoking a key stops it here within about that interval. **If the
    agent cannot be reached the previous list keeps being used and
    requests keep being served** -- taking every harness in an install
    down because the local agent restarted would be a worse failure than
    a revoked key living a few seconds longer, and the token still has
    to carry a valid signature and an unexpired `exp`. The instant,
    total revocation is the one that has existed since M7: rotate the
    install's signing key and every token everywhere stops verifying.

    A client key is **not** a per-request identity. Nothing here records
    which key served a request; `/v1/metrics` counts backends, not
    callers.

    ## Browsers, and CORS

    The four front-door paths -- `GET /v1/models`,
    `POST /v1/chat/completions`, `POST /v1/embeddings` and
    `POST /v1/messages` -- answer CORS,
    so a web page on another origin can use the front door the way a
    non-browser client always could: the UI playground's direct mode,
    Open WebUI in a tab, a web app on the OpenAI SDK. **`/v1/messages`
    is in the set for a reason that is on the wire**: Anthropic's own
    browser SDK path sends
    `anthropic-dangerous-direct-browser-access: true`, and Claude Code
    sends it too, so a browser client of this door is a shape its
    authors expect. The default allowed request headers therefore
    include `x-api-key`, `anthropic-version` and `anthropic-beta`
    alongside `authorization` and `content-type` -- a preflight that
    omits one of those is a door that answers preflight and then fails
    the request, which is the least diagnosable CORS failure there is.
    A preflight is
    answered before auth (it carries no bearer by definition), every
    response on those paths carries `Access-Control-Allow-Origin`, and
    **no other path does**: `/v1/config`, `/v1/admin/*` and
    `/v1/metrics` stay same-origin, because a browser client needs the
    front door and nothing else.

    Any origin by default, no credentials. CORS exists to stop a page
    spending credentials the browser attaches on its own -- cookies,
    HTTP auth -- and the front door has none: a page without the bearer
    gets the 401 a `curl` without one gets. Two live config fields
    change it: `corsAllowedOrigins` (a list; empty means any) and
    `corsEnabled` (off refuses browsers entirely). A refused preflight
    is a `403` `Problem` naming the origin and the key, because a
    browser reports every CORS failure as `Failed to fetch`.

    Until 2026-09-13 a preflight here was answered `405 Method Not
    Allowed`, measured live; nothing had noticed because the UI
    reaches this gateway through the agent's same-origin proxy.
  license:
    name: Apache-2.0
    identifier: Apache-2.0
  contact:
    name: Eugene Plexus
    url: https://github.com/eugene-plexus
servers:
  - url: http://{host}:{port}
    description: Default LAN deployment.
    variables:
      host:
        default: localhost
      port:
        default: '8080'

security:
  - bearerAuth: []

tags:
  - name: inference
    description: |
      The OpenAI-compatible front door. snake_case field names and
      OpenAI's error envelope, unlike everything else here — see the
      note above `/v1/models` in `paths`.
  - name: admin
    description: Inspect and manage the running gateway.
  - name: config
    description: |
      Remote-editable configuration. Every Eugene Plexus component
      implements the same config trio (`GET /v1/config`,
      `GET /v1/config/schema`, `PATCH /v1/config`) so a single UI can
      manage all components without per-component code.
  - name: metrics
    description: |
      Retained per-backend latency, throughput and failure counts.
      Gateway-local and deliberately not replicated: these are
      per-request measurements of one process's traffic, further from
      install-wide truth than liveness, which M5 already settled is
      never in the log.
  - name: meta
    description: Versioning and health.

paths:
  # -------- The OpenAI-compatible front door --------
  #
  # These two operations are the only ones in Eugene Plexus that use
  # snake_case field names and a non-problem+json error envelope. That is
  # deliberate and not negotiable: "OpenAI-compatible" is worth nothing
  # unless an unmodified OpenAI SDK can point its base_url here and work.
  # Renaming `max_tokens` to `maxTokens` for house-style consistency
  # would break every client, which is the entire audience.

  /v1/models:
    get:
      tags: [inference]
      operationId: listModels
      summary: List every model the gateway can currently route to.
      description: |
        OpenAI-compatible model list. This is how a client discovers
        what to put in `ChatCompletionRequest.model`, and it is a view
        of the routing table rather than a configured list: the gateway
        asks every `inference-driver` in the agent topology what it
        serves and reports the union.

        A model appears here when at least one driver serving it is
        reachable. Two drivers serving the same model produce one entry,
        not two — replicas are a routing detail, and a client should not
        have to know how many GPUs are behind a name.
      responses:
        '200':
          description: Available models.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelList'

  /v1/chat/completions:
    post:
      tags: [inference]
      operationId: createChatCompletion
      summary: Generate a chat completion, routed to a backend that serves the model.
      description: |
        The one endpoint everything else exists to support.

        Routing: `model` is resolved to its slot — the drivers serving
        it, then the drivers serving each configured target in order
        (see `modelSlots`). Within a tier the least-busy eligible driver
        is chosen and the request is translated to its `/v1/generate`.
        If the attempt fails in a cascade-eligible way — a transport
        error or a 5xx — the gateway tries the rest of the tier, then
        the next tier. A **4xx does not cascade**: it means the request
        itself is wrong, the next backend would reject it identically,
        and retrying would only bury the real error.

        **A deadline that fired does not cascade either**, and answers
        **504**. A backend that has not replied inside
        `requestTimeoutSeconds` is almost certainly still computing this
        prompt; the next replica would take the same time to compute the
        same thing, so cascading multiplies the cost of one slow answer
        and then reports a total failure. The 504's message names the
        setting to raise. A *connect* timeout is different in kind — the
        host never took the work — and cascades like any other transport
        error.

        **A client that disconnects cancels the backend call.** The
        request is dropped with a 499 and the attempt is still recorded,
        because a generation nobody read is a real cost. Clients that
        retry on their own deadline (the OpenAI SDKs retry twice by
        default) would otherwise leave one generation running per
        attempt.

        A model whose runtimes are all `stopped` is not a 404. If one of
        them declared `startOnDemand`, the gateway starts it, waits up
        to `swapWaitSeconds` for `ready`, and serves the request —
        `x_eugene_plexus.swapped_in` and `waited_ms` say so. Past the
        wait, the next tier is tried; with none, a 503 naming the
        runtime being woken.

        A request that finds nothing eligible first refreshes the
        routing table (shared across concurrent requests, at most once a
        second) before waking anything or answering — the table is
        otherwise `routingRefreshSeconds` behind the agent about
        readiness, and the first live run met exactly that seam. A
        request that finds a backend never pays for a topology read.

        Sampling parameters are the gateway's to send. Anything the
        caller omits is filled from the model's settings profile and
        sent explicitly; a driver never substitutes a default of its
        own. A parameter the chosen backend cannot accept is dropped
        with a warning rather than failing the request — a control plane
        routes to whatever the operator owns, and refusing a model
        because it dislikes `temperature` is not our call to make.

        Set `stream: true` for Server-Sent Events. The stream emits
        `data:` lines carrying `ChatCompletionChunk` objects and
        terminates with `data: [DONE]`, matching OpenAI's framing
        exactly. Tokens are forwarded as the backend produces them.

        **Streaming trades a failover guarantee for early delivery, and
        the trade is not optional.** A non-streamed request that loses
        its backend cascades to the next one in the slot and the caller
        sees a single clean answer. A streamed request can only do that
        until its first token: once part of an answer has been sent,
        retrying on another backend would splice two models' output
        together with no marker at the seam, so instead the stream is
        **truncated** and an OpenAI-shaped `error` frame is emitted in
        place of the rest. A caller that needs the cascade more than it
        needs early tokens should not set `stream`.

        Before the first token nothing has changed: the cascade runs
        exactly as it does for a non-streamed request, and a backend
        that dies during connection or before producing output is
        failed over silently.

        **A tool-call fragment is a first token.** The commit point is
        the first frame carrying any part of an answer, and a
        `tool_calls` delta is part of an answer — so a stream that has
        emitted one fragment of one call is past the point of no return
        exactly as if it had emitted prose.

        This is the same rule, but it is worth stating separately
        because the failure it prevents is worse. Splicing prose from
        two models produces a visibly odd answer. Splicing a tool call
        produces `arguments` half-written by one model and completed by
        another, which can parse as valid JSON and name real
        parameters — a **wrong action taken confidently**, with nothing
        at the seam to notice. Text that reads strangely is a bad
        answer; a call that runs cleanly against the wrong arguments is
        a bad *effect*, and this control plane hands that call to a
        harness that will execute it.

        So: a caller that needs the cascade more than early tokens
        should not stream, and that advice is stronger for an agent
        loop than for a chat window.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatCompletionRequest'
      responses:
        '200':
          description: |
            A completion, or an SSE stream when `stream` was true.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatCompletionResponse'
            text/event-stream:
              schema:
                $ref: '#/components/schemas/ChatCompletionChunk'
                description: |
                  The stream is `data:` lines each carrying one of
                  these, terminated by a literal `data: [DONE]`. The
                  schema names the frame, not the whole body.
        '400':
          description: |
            The request cannot be served as asked, and no backend would
            serve it differently — so it is refused here rather than
            cascaded. Four ways to get one: a malformed body; `tools`
            for a model no backend can carry them to; **a model that
            serves embeddings and not chat**; or a backend that rejected
            the request itself, which most often means **a prompt longer
            than the context window**.

            The embeddings case is new with `POST /v1/embeddings` and is
            the reason it was worth adding: the library detects and will
            launch a dedicated embedding model, and before this that
            model sat on `GET /v1/models` looking like any other and
            failed here as whatever the backend happened to say. Now it
            is refused by name, and `x_eugene_plexus.surfaces` says
            which surface to use instead.

            The last is passed through verbatim, and deliberately: an
            engine that counts tokens knows exactly how many the prompt
            had and exactly how many fit, and says both. That is a
            better answer than any estimate this layer could make, and
            it arrives as a 400 rather than the retryable 502 it used to
            be — a difference that decides whether a harness fixes the
            prompt or retries the same one forever.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenAIErrorResponse'
        '404':
          description: |
            No reachable driver serves the requested model. Distinct
            from 503: the model is not something this install can route
            to at all.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenAIErrorResponse'
        '499':
          description: |
            The client disconnected before the answer was ready, and
            the backend call was cancelled with it. Nothing reads this
            -- the socket is gone -- but the attempt IS recorded in
            `/v1/metrics`, because a generation nobody read is a real
            cost and is the one signal that says callers are giving up.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenAIErrorResponse'
        '502':
          description: |
            Every eligible backend failed. Returned after the priority
            list is exhausted, so this means the cascade ran and lost,
            not that one backend hiccuped.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenAIErrorResponse'
        '504':
          description: |
            No backend answered within `requestTimeoutSeconds`.
            **Deliberately not a 502**, and deliberately not cascaded:
            the backend is almost certainly still computing this
            prompt, and the next replica would take the same time on
            the same input. The message names the setting to raise.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenAIErrorResponse'
        '503':
          description: |
            A driver serves the model but is not ready — the engine is
            still loading, a `startOnDemand` runtime was woken and did
            not reach `ready` within `swapWaitSeconds`, or the gateway
            is in safe mode. Retryable, so it is deliberately not folded
            into 502. The message names the runtime when one is being
            woken.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenAIErrorResponse'

  /v1/messages:
    post:
      tags: [inference]
      operationId: createAnthropicMessage
      summary: Anthropic-compatible Messages API, so an Anthropic client can use local models.
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      description: |
        **The third front door, and the one that decides whether an
        agent harness can point at this install at all.** Claude Code,
        the Anthropic SDKs and every tool built on them speak this wire
        and not OpenAI's, so without it the most capable client in the
        field can be pointed at every competing product and not at us.

        It is a **translation at the edge**, not a second routing
        engine. The body is mapped into the same internal request
        `/v1/chat/completions` builds, and from there the two doors
        share everything: the surface refusal, the tools refusal checked
        before a backend is picked, the refresh-and-wake, the settings
        profile, the truncation detector, the cascade and the
        recording. `GET /v1/metrics` sees this door exactly as it sees
        the other one, which is the whole reason the translation happens
        here rather than against a driver.

        ### Authentication takes two headers, and they are alternatives

        `Authorization: Bearer <token>` **or** `x-api-key: <token>`,
        carrying the same tokens the OpenAI door accepts — an operator
        session, a service token, or a **client key** from
        `POST /v1/auth/client-keys`.

        Two headers because the client decides which one, and it never
        sends both. Measured against Claude Code 2.1.207 on 2026-09-19
        (`docs/acceptance/anthropic-messages-measurement.md`):
        `ANTHROPIC_API_KEY` sends `x-api-key` and **no `Authorization`
        header at all**, while `ANTHROPIC_AUTH_TOKEN` sends
        `Authorization: Bearer` and no `x-api-key`. A door that read
        only one of them would not merely prefer the wrong header; on
        half the configurations it would see no credential whatsoever.

        ### A rejected credential is 403 here and 401 everywhere else

        **This is a deliberate divergence and it must not be tidied
        away.** Measured: a 401 from this endpoint makes Claude Code
        retry without bound — nine attempts in 79 seconds, still
        climbing when the measurement's timeout fired — while **showing
        its user nothing at all**. A 403 is reported on the first
        attempt, verbatim, as
        `Failed to authenticate. API Error: 403 <our message>`.

        So a missing, malformed, expired or revoked token on
        `/v1/messages` answers **403** with a message naming the reason.
        The same token on `/v1/chat/completions` still answers 401,
        because an OpenAI SDK reports a 401 properly and a 403 there
        would read as "this key exists but may not do this".

        A gateway that answers 401 here converts a typo in a key into a
        silent retry storm against itself, which is the looping symptom
        this project removed from the driver at step 7, one layer up, in
        the client it most wants to keep.

        ### What is dropped, and why dropping is honest

        `cache_control`, `thinking`, `top_k`, `metadata`,
        `context_management` and any unknown field are **dropped
        silently**. A blanket unknown-field refusal passes every refusal
        test and then fails on the first real request, because this wire
        carries a great deal we have no equivalent for.

        `cache_control` appears on system blocks, on the last user
        content block **and on `tool_result` blocks**; prompt caching is
        a property of a hosted service and means nothing to a local
        engine holding the KV cache itself.

        **`thinking` is dropped rather than refused, and that was
        measured rather than assumed.** It is on every request Claude
        Code sends. A known Claude model id produces
        `{"budget_tokens": …, "type": "enabled"}`; **an arbitrary local
        model id — which is the entire purpose of this door — produces
        `{"type": "adaptive"}`**; and `MAX_THINKING_TOKENS=0` produces
        `"thinking": null` with the key still present, so even a
        presence check refuses the one configuration genuinely asking
        for no thinking. Dropping it is not a loss of control either:
        `thinkingMode` on the model's settings profile and the driver's
        `ThinkingFilter` already decide what a local model does with a
        reasoning block, and that decision belongs to the operator who
        owns the model rather than to the caller.

        `top_k` is a real loss and is documented as one: both local
        engines accept it and neither of our contracts carries it, which
        is the same omission `top_p` and `seed` already have on the
        internal request.

        ### What is refused, with a 400 naming the field

        Image blocks, document blocks, server-side tool types,
        `mcp_servers`, more than four `stop_sequences`, and a missing
        `max_tokens`. Each is refused rather than dropped because each
        changes what the answer would be: a model that never saw the
        image is not answering the question that was asked.

        **A model nothing serves is also a 400 here, not a 404.**
        Measured: Claude Code discards the body of a 404 and shows a
        generic *"There's an issue with the selected model"* instead, so
        a 404 would throw away the explanation — including the
        `503 Locked` control-root diagnosis, which exists precisely so
        that this surface stops naming two healthy places and never
        mentioning the root.

        ### Streaming

        `stream: true` produces Anthropic's typed event stream:
        `message_start`, then per content block a `content_block_start`,
        `content_block_delta` run and `content_block_stop`, then
        `message_delta` carrying `stop_reason`, then `message_stop`.
        There is no `[DONE]` sentinel — that is OpenAI's framing, and a
        strict Anthropic client rejects a stream that carries it.

        **Content blocks are numbered statefully and our internal
        stream is not**, which is the one piece of real work in the
        translation. Text deltas carry no index of their own, while tool
        fragments carry a per-call index; the translator therefore holds
        the open text block and a map from tool-call index to content
        block index, and emits `content_block_stop` for the text block
        before the first tool block opens. Getting it wrong means a
        strict SDK rejects the stream *inside* a 200, which reads to the
        user as the model producing nothing.

        `message_start` is emitted on the **first event from the
        driver**, never on request acceptance. It names the model, and
        until the first token the cascade can still change which backend
        — and therefore which model id — answers.

        The failover rule is unchanged and is inherited rather than
        re-implemented, because the commit point sits below both
        translators: failover is possible until the first token and
        impossible after it. Past that point a stream is **truncated**,
        and the truncation is reported as an `error` event followed by
        `message_stop` rather than as a status code, since the status is
        long gone.

        ### The envelope does not go in the body

        `x_eugene_plexus` rides on **response headers**
        (`x-eugene-plexus-driver`, `-runtime`, `-backend`,
        `-latency-ms`, `-attempts`, `-tier`, `-swapped-in`,
        `-waited-ms`, `-context-length`, `-prompt-truncated`) rather
        than in the response object. Anthropic's wire is typed events
        and a strict client is exactly who this door is for, so an
        unknown top-level key is a risk with no upside. The *recording*
        is unaffected: it rides the shared path and lands in
        `GET /v1/metrics` like any other request.

        ### Two shape facts that are easy to get wrong

        Claude Code sends `POST /v1/messages?beta=true` on **every**
        request. The query parameter is ignored, and an
        `anthropic-beta` header naming features we do not implement is
        tolerated rather than validated — refusing an unknown beta would
        refuse every request from the client this exists for.

        A `tool_result` is a **block inside a `user` message**, several
        to a message, and an assistant turn comes back carrying its own
        `tool_use` blocks. Both directions are translated; the inbound
        assistant mapping is not optional, because it is how a tool loop
        continues past its first turn.
      parameters:
        - name: beta
          in: query
          required: false
          schema:
            type: boolean
          description: |
            Accepted and ignored. Claude Code appends `?beta=true` to
            every request; documenting it here is what stops a future
            reader treating it as an unknown parameter worth refusing.
        - name: anthropic-version
          in: header
          required: false
          schema:
            type: string
          description: |
            Anthropic's API version, `2023-06-01` from every observed
            client. Accepted and not enforced: we serve local models, so
            there is no dated behaviour of ours for it to select.
        - name: anthropic-beta
          in: header
          required: false
          schema:
            type: string
          description: |
            Comma-separated beta feature names. **Tolerated, never
            validated.** Claude Code sends five to seven of them and the
            list changes with its own version and login method.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnthropicMessagesRequest'
      responses:
        '200':
          description: |
            A message, or an Anthropic event stream when `stream` was
            true.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnthropicMessageResponse'
            text/event-stream:
              schema:
                $ref: '#/components/schemas/AnthropicStreamEvent'
                description: |
                  SSE frames carrying both an `event:` name and a
                  `data:` object whose `type` repeats it. **No
                  `[DONE]`**; the stream ends at `message_stop`.
        '400':
          description: |
            The request names something this gateway cannot carry —
            an image or document block, a server-side tool,
            `mcp_servers`, more than four `stop_sequences`, a missing
            `max_tokens` — **or names a model nothing serves**, which is
            a 400 here rather than a 404 because Claude Code discards a
            404's body. The message names the field or the model.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnthropicErrorResponse'
        '403':
          description: |
            Missing, malformed, expired or revoked credential.
            **Deliberately not 401**: a 401 is retried without bound by
            Claude Code and shows its user nothing, while a 403 is
            reported on the first attempt with our message intact.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnthropicErrorResponse'
        '499':
          description: |
            The client disconnected; the backend call was cancelled and
            the attempt was still recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnthropicErrorResponse'
        '502':
          description: |
            Every eligible backend failed, after the cascade ran.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnthropicErrorResponse'
        '503':
          description: |
            A driver serves the model but is not ready, or the gateway
            is starting or in safe mode. Retryable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnthropicErrorResponse'
        '504':
          description: |
            No backend answered within `requestTimeoutSeconds`. Not
            cascaded: the backend is almost certainly still computing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnthropicErrorResponse'

  /v1/embeddings:
    post:
      tags: [inference]
      operationId: createEmbedding
      summary: OpenAI-compatible embeddings.
      security:
        - bearerAuth: []
      description: |
        The second OpenAI surface this gateway serves, and the reason it
        exists is coherence rather than demand: the library already
        detects dedicated embedding models (a pooling type in GGUF
        metadata, an encoder architecture in safetensors) and will
        happily discover, download and launch one. Before this endpoint,
        that model then appeared on `GET /v1/models` looking like
        anything else and failed every request it was sent. We were
        letting people acquire a thing we could not serve.

        **FAILOVER DOES NOT CROSS MODELS HERE, AND THAT IS THE RULE THIS
        ENDPOINT TURNS ON.** Everywhere else in this gateway a slot is
        an ordered list of targets and a failure cascades to the next
        one. For chat that degrades gracefully -- a different model
        answers, and the caller can tell. For embeddings it is silent
        corruption: vectors from two models occupy different spaces, so
        a fallback writes noise into the caller's vector store with a
        200 and nothing to mark the seam. Different dimensions would at
        least raise; the *same* dimension poisons quietly, and the
        damage outlives the request in a database.

        So: balancing and failover across **replicas of the same model
        id** work exactly as they do for chat -- those are
        interchangeable by definition. A `modelSlots` cascade to a
        *different* target does not run for embeddings. A request whose
        own model has no eligible backend fails rather than being served
        by a neighbour. Same family of rule as M10's "failover is
        possible until the first token and impossible after it": both
        give up a retry to avoid returning a wrong answer that looks
        like a right one.

        **`encoding_format` is honoured here rather than passed down.**
        The OpenAI SDKs request `base64` by default, and backends differ
        on whether they implement it -- so the driver surface speaks
        float arrays only and this layer encodes. The encoding is
        little-endian `float32`, then base64, verified byte-for-byte
        against a real backend's own output rather than inferred from
        the OpenAI documentation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmbeddingRequest'
      responses:
        '200':
          description: Vectors produced.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmbeddingResponse'
        '400':
          description: |
            Malformed request, or the named model does not serve this
            surface -- `GET /v1/models` reports which surfaces each
            model serves, so a caller can tell before sending.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenAIErrorResponse'
        '404':
          description: No reachable driver serves the requested model.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenAIErrorResponse'
        '499':
          description: |
            The client disconnected; the backend call was cancelled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenAIErrorResponse'
        '502':
          description: |
            Every eligible backend for this model failed. Note "for this
            model": the cascade never reached a different one.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenAIErrorResponse'
        '504':
          description: |
            No backend answered within `requestTimeoutSeconds`. Not
            retried on a replica: a replica would take the same time on
            the same input.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenAIErrorResponse'
        '503':
          description: |
            Something serves this model and none of it can take a
            request right now -- usually an engine still loading.
            Retryable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenAIErrorResponse'

  /v1/admin/drivers:
    get:
      tags: [admin]
      operationId: listDrivers
      summary: Report the gateway's configured drivers.
      description: |
        Surfaces what the gateway sees when it queries each
        driver's `/v1/info`, in the order the operator configured
        them. Used by the UI to render dynamic per-driver tabs and by
        ops to confirm the topology.
      responses:
        '200':
          description: Driver topology snapshot.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriversInfo'
        '503':
          description: All configured drivers are unreachable.
          content:
            application/problem+json:
              schema:
                $ref: 'components/common.yaml#/components/schemas/Problem'

  /v1/admin/drivers/probe:
    post:
      tags: [admin]
      operationId: probeDriver
      summary: Test-connect to an arbitrary driver URL without persisting it.
      description: |
        Used by the UI's per-URL "Test" buttons in the drivers list
        editor — same affordance Sonarr / Radarr expose next to each
        indexer entry. Fetches `<url>/v1/info` once, reports
        reachability + backend identity, and returns. Does not touch
        the saved config; safe to call against unsaved form values.

        Probes a *single* URL. The UI resolves a driver's name to a URL
        via the agent topology and calls this once per driver, so each
        backend behind a model can be tested independently. Priority
        lists are `modelSlots` entries naming model ids, not URLs, so
        there is nothing here to probe for a slot as a whole — read
        `GET /v1/admin/routing` for how a slot currently resolves.

        **Probed anonymously** (2026-09-18). Operator-gated, as every
        admin path here is, and it dials whatever the operator typed —
        that is the feature. What it no longer carries is this install's
        `service:gateway` token, which every component in the install
        accepts, so a URL in a form was enough to collect one. An
        operator typing an address is not an operator deciding to hand
        out a credential.

        Consequently a backend that wants a key answers **401, and that
        is reported as `reachable: true`** with the reason in `error`. It
        is the more diagnostic answer: the address answered, so the
        operator's next step is the key rather than the network.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DriverProbeRequest'
      responses:
        '200':
          description: |
            Probe outcome. Returned for both reachable and unreachable
            cases — `reachable` distinguishes them, `error` carries the
            failure detail when set. **A URL that answered at all is
            `reachable: true`**, including one that answered 401 or 403
            to the unauthenticated probe; only a transport failure is
            `reachable: false`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriverHealth'
        '400':
          $ref: 'components/common.yaml#/components/responses/Problem'

  /v1/admin/routing:
    get:
      tags: [admin]
      operationId: getRoutingTable
      summary: The resolved routing table — slots, tiers, backends, and what each is doing.
      description: |
        What `/v1/models` compresses into one entry per model, opened
        up: every slot the gateway would answer for, its tiers in
        order, and for each backend whether it is eligible right now
        and why not, how many requests are in flight to it, the
        runtime behind it and that runtime's lifecycle state. This is
        the page an operator reads when a request went somewhere
        surprising, and what the acceptance run reads to see the
        balancer alternate.

        A view of the last refresh, not a fresh poll — the same
        snapshot requests are routed from, so what it shows is what a
        request would meet.

        `control_root` says where the node list came from — the
        `controlUrl` config field, the gateway's own agent, or nowhere
        — and whether the control root answered on the last refresh.
        A sealed root after a container restart shows here as
        `reachable: false` with `503 Locked` in `error`, the one place
        outside the control root's own API that says so; the table
        keeps the previous node list while it is true.
      responses:
        '200':
          description: The routing table as of the last refresh.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoutingTableView'
        '503':
          description: No routing table — the gateway is in safe mode.
          content:
            application/problem+json:
              schema:
                $ref: 'components/common.yaml#/components/schemas/Problem'

  /v1/admin/restart:
    post:
      tags: [admin]
      operationId: restart
      summary: Schedule a process restart so `requiresRestart` config takes effect.
      description: |
        Some config keys (driver list, ports, etc.) carry
        `requiresRestart: true` because the gateway only reads them
        at startup. Calling this endpoint tells the gateway to
        exit shortly after responding; an external supervisor (systemd,
        docker, deploy launcher) brings it back up with the new config
        in effect. The endpoint returns *before* the exit so the HTTP
        response has time to flush.

        v0.1 personal-use installations without a supervisor will
        require a manual relaunch. The UI should make this clear in the
        confirmation dialog.

        ## Auth note (v0.1)

        Unauthenticated, same as the rest of the v0.1 admin surface
        (assumed Tailscale tailnet). Auth lands in v0.2.
      responses:
        '202':
          description: Restart scheduled.
          content:
            application/json:
              schema:
                $ref: 'components/common.yaml#/components/schemas/RestartResult'

  # -------- Retained request metrics (M8) --------
  #
  # Every completion already reported how it was served, on
  # `x_eugene_plexus`, and none of it was kept. These two paths are
  # where it is kept.
  #
  # Recorded at the routing hooks rather than off the response
  # envelope, deliberately: the streaming path never sets
  # `x_eugene_plexus`, so an envelope-based recorder would be blind to
  # every streaming client. The hooks fire around every attempt on both
  # paths.

  /v1/metrics:
    get:
      tags: [metrics]
      operationId: getMetrics
      summary: Aggregated per-backend latency, throughput and failure counts.
      description: |
        What each backend actually did, over a window. The question this
        exists to answer is "is this backend faster than that one for
        this model **on this box**" — and the restraint that goes with
        it: these numbers describe this install only. They are not a
        benchmark and must not be presented as one.

        Grouped by (model, driver, runtime, node, backend). A group's
        throughput is computed from the latency of the attempt that
        **served** the request, never the request's total — a cascade
        whose primary timed out for 30 s before a secondary answered in
        800 ms would otherwise report the secondary as forty times
        slower than it is.

        `tokensPerSecond` is **null**, not zero, for a group whose
        backends did not report token usage. A UI that renders those the
        same way says "slow" where it means "unmeasured".

        Which backends those are is not a fixed list, and an earlier
        draft of this text claimed it was: the CLI subscription backends
        *do* report usage, parsing it out of Claude's envelope and
        Codex's `turn.completed`, and return nothing only when the CLI
        emitted none. Treat absence as a per-request fact, not a
        property of a backend kind.

        Operator-only. No component needs this, so a `service:*` token
        is refused rather than accepted for reads as elsewhere; and
        model names plus traffic volumes are not nothing on a shared
        tailnet.
      parameters:
        - name: since
          in: query
          description: |
            Start of the window, inclusive. Defaults to 24 hours ago.
            Rows older than `metricsRetentionDays` are gone, so a
            `since` beyond it returns what survived and sets
            `truncated`.
          schema:
            type: string
            format: date-time
        - name: until
          in: query
          description: End of the window, exclusive. Defaults to now.
          schema:
            type: string
            format: date-time
        - name: model
          in: query
          description: Restrict to one requested model id.
          schema:
            type: string
        - name: driver
          in: query
          description: Restrict to one inference-driver by name.
          schema:
            type: string
        - name: bucket
          in: query
          description: |
            `none` (default) returns one group per dimension tuple over
            the whole window. `hour` additionally splits each group by
            hour, which is what a history chart reads.

            Both are computed from **raw rows**, so both are bounded by
            `metricsRetentionDays`. Hourly rollups are written and kept
            past retention, but they are not served here and deliberately
            so: a rollup can carry sums and a max, and a percentile
            cannot be reconstructed from those. Serving a mean through a
            field named `p50` would be a quieter error than serving
            nothing.
          schema:
            type: string
            enum: [none, hour]
            default: none
      responses:
        '200':
          description: Aggregates over the window.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetricsSummary'
        '503':
          description: |
            Metrics are disabled (`metricsEnabled: false`) or the store
            could not be opened. Distinguished from an empty window,
            which is a 200 with no groups.
          content:
            application/problem+json:
              schema:
                $ref: 'components/common.yaml#/components/schemas/Problem'

  /v1/metrics/requests:
    get:
      tags: [metrics]
      operationId: getMetricRequests
      summary: Individual retained requests, newest first, with their attempts.
      description: |
        The rows behind the aggregates, for the question an aggregate
        cannot answer: what happened at 02:14. Each request carries
        every attempt it made, so a cascade is legible as one request
        and the backends it tried in order.

        Newest first, cursor-paged. Raw rows exist only within
        `metricsRetentionDays`; older traffic survives only as hourly
        rollups, which no endpoint serves yet.
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 50
        - name: cursor
          in: query
          description: |
            `nextCursor` from a previous page. Opaque; encodes the
            position rather than an offset, so a page is stable while
            new requests arrive.
          schema:
            type: string
        - name: model
          in: query
          schema:
            type: string
        - name: outcome
          in: query
          description: |
            Restrict to one outcome. `error` and `cascaded` are the two
            worth filtering for; `cascaded` means `attempts > 1`
            whether or not the request eventually succeeded.
          schema:
            type: string
            enum: [served, error, cascaded]
      responses:
        '200':
          description: One page of retained requests.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetricRequestPage'
        '503':
          description: Metrics are disabled or the store could not be opened.
          content:
            application/problem+json:
              schema:
                $ref: 'components/common.yaml#/components/schemas/Problem'

  /v1/config:
    get:
      tags: [config]
      operationId: getConfig
      summary: Read the gateway's current effective configuration.
      description: |
        Returns every config field's currently effective value. Values
        of fields with `sensitive: true` are redacted as the literal
        string `"<redacted>"`.

        The lifecycle-policy fields (M6), all editable at runtime
        through the generic editor:

        * **`modelSlots`** (`model_slots`) — the priority lists. An
          ordered list of `{model, targets}`; see
          `ConfigValueType.model_slots` for the shape and why targets
          are model ids rather than driver names.
        * **`loadBalancing`** (`enum`) — `least_busy` (default) picks
          the eligible driver with the fewest in-flight requests per
          slot of capacity, ties round-robin; `round_robin` alternates
          strictly, which is worth having when comparing two replicas.
        * **`swapWaitSeconds`** (`duration`) — how long a request waits
          for a `startOnDemand` runtime to reach `ready` before the next
          tier is tried. Engine-dependent: llama.cpp loads a small
          model in seconds; vLLM's silent load is minutes.
        * **`idleCheckSeconds`** (`duration`) — how often the gateway
          checks each runtime's idle timeout.
        * **`controlUrl`** (`url`, optional) — the control root, when
          the gateway should not work it out itself. Unset, the gateway
          asks its own agent on every refresh: the control root the
          node is enrolled to (`GET /v1/node`), else the `control`
          component the agent declares (`GET /v1/components`), else
          this host alone. Set, it is used as given, even when wrong —
          the override for a gateway whose agent is neither enrolled
          nor running a control root, or for an address the agent
          cannot know. Takes effect on the next routing refresh.

        The retained-metrics fields (M8):

        * **`metricsEnabled`** (`boolean`, default `true`) — whether
          completions are measured at all. False skips building the
          row, not just writing it: the recording path runs on every
          request, and "small" is how the routing table came to be a
          refresh interval behind.
        * **`metricsRetentionDays`** (`integer`, default `7`) — how
          long raw per-request rows are kept. `0` keeps rollups only.
          A request plus its attempts is roughly 200 bytes, so a heavy
          install at one completion a second is about 17 MB a day.
        * **`metricsRollupEnabled`** (`boolean`, default `true`) —
          hourly aggregates, kept indefinitely because they are a few
          hundred rows a day and they are the only record that survives
          retention. Written but not yet served: they hold sums and a
          max, and no endpoint reports a percentile it cannot compute
          from those.
      responses:
        '200':
          description: Current config.
          content:
            application/json:
              schema:
                $ref: 'components/common.yaml#/components/schemas/ConfigDocument'
    patch:
      tags: [config]
      operationId: updateConfig
      summary: Partial update of the gateway's configuration.
      description: |
        Accepts a partial map of `key -> new-value` pairs. Each key is
        validated against its `ConfigField` definition. Validation
        errors are reported per-key without aborting the whole
        request — valid changes are applied, invalid ones are
        rejected and surfaced in the response.

        Some fields require a process restart to take effect (see
        `ConfigField.requiresRestart`). The response indicates whether
        a restart is needed and which keys are queued.

        ## Auth note (v0.1)

        Same caveat as `GET /v1/config`: in v0.1, anyone on the network
        can change gateway config. Auth lands in v0.2.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: 'components/common.yaml#/components/schemas/ConfigUpdateRequest'
      responses:
        '200':
          description: Update outcome (may include per-field rejections).
          content:
            application/json:
              schema:
                $ref: 'components/common.yaml#/components/schemas/ConfigUpdateResult'
        '400':
          $ref: 'components/common.yaml#/components/responses/Problem'

  /v1/config/schema:
    get:
      tags: [config]
      operationId: getConfigSchema
      summary: UI-renderable description of every editable config field.
      description: |
        Returns a `ConfigSchema` listing every config field the
        gateway accepts, with type, default, validation hints,
        and UI metadata (label, description, category, sensitive flag,
        restart-required flag). UIs use this to render a generic
        config editor without gateway-specific code.
      responses:
        '200':
          description: Config schema.
          content:
            application/json:
              schema:
                $ref: 'components/common.yaml#/components/schemas/ConfigSchema'

  /v1/config/test:
    post:
      tags: [config]
      operationId: testConfig
      summary: Test the effective config without committing it.
      description: |
        Probes every driver the gateway can route to, hitting each
        `/v1/info`, using the saved config merged with the optional
        `overrides`. The override values are NOT persisted. Use this
        from the UI's "Test Connection" button to verify the routing
        table and timeouts before saving.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: 'components/common.yaml#/components/schemas/ConfigTestRequest'
      responses:
        '200':
          description: Test result. Returned for both success and failure cases.
          content:
            application/json:
              schema:
                $ref: 'components/common.yaml#/components/schemas/ConfigTestResult'

  /healthz:
    get:
      tags: [meta]
      operationId: healthz
      summary: Liveness / readiness probe.
      security: []
      responses:
        '200':
          description: Healthy.
          content:
            application/json:
              schema:
                $ref: 'components/common.yaml#/components/schemas/Health'
        '503':
          description: One or more dependencies unhealthy.
          content:
            application/json:
              schema:
                $ref: 'components/common.yaml#/components/schemas/Health'

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: |
        Bearer token issued by the agent. Operator sessions come from
        `POST /v1/auth/login`; component-internal calls use service
        tokens threaded to spawned children via env var at startup; and
        an outside app uses a **client key** from
        `POST /v1/auth/client-keys`, which this gateway accepts on the
        four front-door paths and refuses everywhere else. See
        "Client keys, on the front door only" above.

        On `POST /v1/messages` the same token may arrive as `x-api-key`
        instead -- see `apiKeyAuth` -- and a refusal there is **403, not
        401**, because a 401 is retried without bound by the client that
        door exists for.

    apiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key
      description: |
        The same tokens as `bearerAuth`, in the header an Anthropic
        client sends. Accepted on `POST /v1/messages` and nowhere else.

        Measured against Claude Code 2.1.207: `ANTHROPIC_API_KEY`
        produces this header and **no `Authorization` header at all**,
        while `ANTHROPIC_AUTH_TOKEN` produces `Authorization: Bearer`
        and no `x-api-key`. They are alternatives, never both, so a
        door reading only one of them sees no credential rather than
        the wrong one.

  schemas:
    DriverProbeRequest:
      type: object
      description: |
        Request body for `POST /v1/admin/drivers/probe`. Tests a single
        backend URL without persisting it. A driver slot in the
        gateway's `drivers` config may name several backends, as
        topology entry names; the UI resolves each to a URL and probes
        them separately so an operator can verify every fallback before
        saving.
      required:
        - url
      properties:
        url:
          type: string
          format: uri
          description: The single backend base URL to test-connect.
        name:
          type: string
          description: |
            Optional slot label, echoed into diagnostics. Not required
            to probe; the operator may be testing a URL before naming
            the slot.

    DriversInfo:
      type: object
      required:
        - drivers
      properties:
        drivers:
          type: array
          description: |
            Per-driver health snapshot, ordered as the gateway's
            `drivers` config declared them.
          items:
            $ref: '#/components/schemas/DriverHealth'

    DriverHealth:
      type: object
      description: |
        What the gateway sees from one inference-driver's `/v1/info`,
        plus the gateway-side reachability status and the
        operator-supplied `name`.
      required:
        - name
        - reachable
      properties:
        name:
          type: string
          description: |
            Operator-supplied driver name from the gateway's
            `drivers` config. UI uses this as the tab/column label.
        reachable:
          type: boolean
        url:
          type: string
          format: uri
          description: How the gateway reaches this driver.
        backend:
          $ref: 'components/common.yaml#/components/schemas/BackendKind'
        modelId:
          type: string
        runtime:
          type: string
          description: |
            The supervised engine runtime this driver follows, straight
            off its `/v1/info`. Absent for a backend that is not a
            runtime this install supervises.

            Carried up because it answers the one question this panel
            could not previously answer: a driver that is reachable but
            serves nothing, next to a runtime that is `ready` and
            routed to by nobody, is the visible shape of a
            mis-wired install.
        version:
          type: string
        error:
          type: string
          description: 'Populated when `reachable: false`.'

    # -------- OpenAI-compatible wire schemas --------
    #
    # snake_case throughout, unlike the rest of Eugene Plexus. See the
    # note above `/v1/models` in `paths` for why.

    ModelList:
      type: object
      required:
        - object
        - data
      properties:
        object:
          type: string
          const: list
        data:
          type: array
          items:
            $ref: '#/components/schemas/Model'

    Model:
      type: object
      description: |
        One routable model, in OpenAI's shape plus one namespaced
        extension. Unknown fields are ignored by OpenAI clients, which
        is what makes it safe to answer "which of my backends is behind
        this name" without breaking compatibility.
      required:
        - id
        - object
      properties:
        id:
          type: string
          description: |
            What the client puts in `ChatCompletionRequest.model`. For a
            local runtime this is its `modelAlias`, which defaults to
            the model's own filename — so the name a user sees is the
            name of the file they downloaded.
        object:
          type: string
          const: model
        created:
          type: integer
          description: Unix timestamp. Model file mtime for local models.
        owned_by:
          type: string
          description: |
            OpenAI sends an organisation here. We send the provider —
            `local`, or the cloud provider key for a subscription
            backend.
        x_eugene_plexus:
          $ref: '#/components/schemas/ModelRoutingInfo'

    ModelRoutingInfo:
      type: object
      description: |
        Namespaced extension: how this install serves the model. Present
        so the UI can render the routing table straight off the standard
        endpoint instead of needing a parallel admin call, and so an
        operator can see that a name is backed by two replicas.
      properties:
        drivers:
          type: array
          items:
            type: string
          description: Names of the inference-drivers currently serving this model.
        backends:
          type: array
          items:
            $ref: 'components/common.yaml#/components/schemas/BackendKind'
          description: Distinct wire protocols behind this model.
        context_length:
          type: integer
          description: |
            Smallest context window among the serving backends — the
            honest number, since a request may land on any of them.
        surfaces:
          type: array
          items:
            type: string
            enum: [chat, embeddings]
          description: |
            Which OpenAI surfaces this model can be sent to.

            OpenAI's own `/v1/models` does not say, which is why every
            RAG front-end makes you pick an embedding model from a
            dropdown of everything and discover your mistake as an
            error. This install knows, because the driver determines it
            from the backend, so it says.

            **Measured, not assumed, and the two are not always
            disjoint**: an Ollama runner started for chat refuses to
            embed, `nomic-embed-text` refuses to chat -- but
            `llama-server` given `--embedding` still serves chat
            perfectly well. Hence a list.

            Empty means nothing serving this model would admit to either
            surface, which is a backend that could not be reached rather
            than a model that does nothing.
        tool_calling:
          type: boolean
          description: |
            Whether a request for this model may carry `tools`.

            **True only when every backend serving it can**, by the same
            reasoning as `context_length` above: a request may land on
            any of them, so the honest answer is the weakest one. A
            harness can read this and pick a model rather than discover
            the limit as a 400 halfway through a task.
        tiers:
          type: array
          items:
            type: array
            items:
              type: string
          description: |
            The slot's tiers in priority order, each the driver names
            in it. One tier for an unconfigured model; more when a
            `modelSlots` entry adds targets. Empty tiers are omitted.
        ready_backends:
          type: integer
          minimum: 0
          description: |
            How many of those drivers can take a request right now — a
            reachable driver whose runtime is `ready`, or that follows
            no runtime. Zero with the model still listed means every
            runtime behind it is asleep and at least one will wake on
            demand.
        on_demand:
          type: boolean
          description: |
            True when a request for this model may have to wait for a
            runtime to start — every eligible backend is `stopped` and
            at least one declared `startOnDemand`.

    ChatCompletionRequest:
      type: object
      required:
        - model
        - messages
      properties:
        model:
          type: string
          description: |
            A model id from `GET /v1/models`. The gateway resolves it to
            a backend; the client does not choose a backend.
        messages:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ChatCompletionMessage'
        max_tokens:
          type: integer
          minimum: 1
          description: |
            Maximum output tokens. Filled from the model's settings
            profile when omitted, then always sent downstream
            explicitly.
        temperature:
          type: number
          format: float
          minimum: 0
          maximum: 2
        top_p:
          type: number
          format: float
          minimum: 0
          maximum: 1
        stop:
          type: array
          items:
            type: string
          maxItems: 4
          description: Stop sequences.
        seed:
          type: integer
          description: |
            Passed through to backends that support deterministic
            sampling; dropped with a warning where they do not.
        stream:
          type: boolean
          default: false
          description: |
            When true the response is an SSE stream of
            `ChatCompletionChunk` objects terminated by `data: [DONE]`.
        user:
          type: string
          description: Opaque client-supplied identifier, echoed into logs only.
        tools:
          type: array
          items:
            $ref: '#/components/schemas/Tool'
          description: |
            Tools the model may call. Passed through to the backend
            unchanged; the gateway never invents, filters or reorders
            them.

            **The gateway does not execute tools.** It carries the
            definitions down and the model's chosen calls back up, and
            the caller runs them and sends the results as `tool` role
            messages. That is OpenAI's contract and it is the one an
            agent harness implements.

            A backend that cannot carry tools is not silently stripped:
            the request fails with a 400 naming the backend, because a
            harness that receives a plain answer where it expected a
            tool call has no way to tell "the model chose not to" from
            "nobody ever offered it the tools" — and the second is a
            bug that looks exactly like the first. `GET /v1/models`
            reports which models can.
        tool_choice:
          description: |
            How the model should use `tools`. `auto` is the default when
            tools are present, `none` forbids calling one, `required`
            forces at least one call, and an object names a specific
            function. Passed through; the gateway does not enforce it.
          oneOf:
            - type: string
              enum:
                - none
                - auto
                - required
            - $ref: '#/components/schemas/NamedToolChoice'
        response_format:
          $ref: '#/components/schemas/ResponseFormat'

    ChatCompletionMessage:
      type: object
      description: |
        OpenAI-shaped chat message. Intentionally *not* the shared
        `Message` schema: this one is on a wire contract we do not own,
        so it carries exactly OpenAI's fields and nothing of ours.
        Leaking a house field like `timestamp` into a payload an OpenAI
        SDK parses is how "compatible" quietly stops being true.
      required:
        - role
      properties:
        role:
          type: string
          enum:
            - system
            - user
            - assistant
            - tool
        content:
          type:
            - string
            - 'null'
          description: |
            The message text. **Nullable, and that is not laxity:** an
            assistant message that only calls a tool has no text, and
            OpenAI sends `content: null` alongside `tool_calls` for it.
            A schema that required a string here would reject the
            single most common assistant turn in an agent loop.
        name:
          type: string
          description: Optional participant name, per OpenAI.
        tool_calls:
          type: array
          items:
            $ref: '#/components/schemas/ToolCall'
          description: |
            Set on an **assistant** message, naming the tools the model
            chose to call. The caller executes them and replies with one
            `tool` message per call, each carrying the matching
            `tool_call_id`.
        tool_call_id:
          type: string
          description: |
            Required on a **tool** message: which call in the preceding
            assistant turn this is the result of. `content` is the
            result, as a string — the caller serializes it.

    ChatCompletionResponse:
      type: object
      required:
        - id
        - object
        - created
        - model
        - choices
      properties:
        id:
          type: string
          description: 'Completion id, `chatcmpl-` prefixed as clients expect.'
        object:
          type: string
          const: chat.completion
        created:
          type: integer
        model:
          type: string
          description: |
            The model that actually served the request. Equal to the
            requested id in the normal case; after a cascade it names
            what answered, which may differ.
        choices:
          type: array
          items:
            $ref: '#/components/schemas/ChatCompletionChoice'
        usage:
          $ref: '#/components/schemas/CompletionUsage'
          description: Present on the final chunk only.
        x_eugene_plexus:
          $ref: '#/components/schemas/CompletionRoutingInfo'

    ChatCompletionChoice:
      type: object
      required:
        - index
        - message
        - finish_reason
      properties:
        index:
          type: integer
        message:
          $ref: '#/components/schemas/ChatCompletionMessage'
        finish_reason:
          type: string
          enum:
            - stop
            - length
            - tool_calls
          description: |
            `stop` for a natural end or a matched stop sequence,
            `length` for hitting the token cap, `tool_calls` when the
            model stopped because it wants one or more tools run.

            Until 2026-09-11 this enum was `stop` and `length` only, and
            its description said so in as many words — "OpenAI's two
            values for a completion **without** tool calls". That
            sentence was the single occurrence of the string "tool"
            anywhere in this contract or the driver's, and it was an
            accurate description of a control plane no agent harness
            could use.

    ChatCompletionChunk:
      type: object
      description: One SSE frame of a streaming completion.
      required:
        - id
        - object
        - created
        - model
        - choices
      properties:
        id:
          type: string
        object:
          type: string
          const: chat.completion.chunk
        created:
          type: integer
        model:
          type: string
        choices:
          type: array
          items:
            $ref: '#/components/schemas/ChatCompletionChunkChoice'
        usage:
          $ref: '#/components/schemas/CompletionUsage'
        x_eugene_plexus:
          $ref: '#/components/schemas/CompletionRoutingInfo'
          description: |
            Set on the **final frame only**, alongside `usage` — the
            same place OpenAI puts its own end-of-stream extras.
            Absent on every earlier frame, because the values are not
            known until the completion is done.

            Added at M8. Until then a streaming client could see no
            routing information at all: the non-streaming response
            carried this and the stream did not, so exactly the clients
            that stream — the UI playground among them — were the ones
            that could not tell which backend answered. Retained
            metrics do not depend on this (they are recorded at the
            routing hooks, which fire on both paths); this closes the
            matching gap in what a caller can see.

    ChatCompletionChunkChoice:
      type: object
      required:
        - index
        - delta
      properties:
        index:
          type: integer
        delta:
          type: object
          description: |
            Incremental payload. The first chunk carries `role`;
            subsequent chunks carry `content` fragments, `tool_calls`
            fragments, or neither on the terminal chunk.
          properties:
            role:
              type: string
              enum:
                - assistant
            content:
              type:
                - string
                - 'null'
            tool_calls:
              type: array
              items:
                $ref: '#/components/schemas/ToolCallDelta'
              description: |
                Tool-call fragments. Each carries an `index` and the
                caller accumulates by it: `id` and `function.name`
                arrive once, `function.arguments` arrives as a string
                split across any number of frames. A single frame is
                **not** parseable JSON and was never meant to be.
        finish_reason:
          type:
            - string
            - 'null'
          enum:
            - stop
            - length
            - tool_calls
            - null
          description: Null until the terminal chunk.

    Tool:
      type: object
      description: |
        One tool offered to the model. OpenAI has only ever defined
        `function`, and the wrapper exists so other kinds can be added
        without reshaping the field.
      required:
        - type
        - function
      properties:
        type:
          type: string
          const: function
        function:
          $ref: '#/components/schemas/FunctionDefinition'

    FunctionDefinition:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          description: 'The name the model calls, e.g. `read_file`.'
        description:
          type: string
          description: |
            What the tool does. Load bearing rather than decorative —
            it is the only thing the model has to decide *whether* to
            call this tool.
        parameters:
          type: object
          additionalProperties: true
          description: |
            A JSON Schema object describing the arguments. Passed
            through verbatim: we do not validate it, rewrite it, or
            translate dialects. A backend that rejects a construct
            rejects it in its own words, which is more useful than a
            guess of ours made one hop earlier.
        strict:
          type:
            - boolean
            - 'null'
          description: |
            Ask the backend to constrain generation to `parameters`.
            Passed through; backends that do not support it ignore it.

    NamedToolChoice:
      type: object
      description: Force one specific function.
      required:
        - type
        - function
      properties:
        type:
          type: string
          const: function
        function:
          type: object
          required:
            - name
          properties:
            name:
              type: string

    ToolCall:
      type: object
      description: One tool call the model chose to make.
      required:
        - id
        - type
        - function
      properties:
        id:
          type: string
          description: |
            Correlation id. The caller echoes it as `tool_call_id` on
            the message carrying the result.
        type:
          type: string
          const: function
        function:
          $ref: '#/components/schemas/FunctionCall'

    FunctionCall:
      type: object
      required:
        - name
        - arguments
      properties:
        name:
          type: string
        arguments:
          type: string
          description: |
            The arguments as a **JSON string**, not an object. That is
            OpenAI's shape and it is deliberate on their part: a model
            can emit invalid JSON, and a string preserves what it
            actually said instead of failing the whole response. The
            caller parses it and handles the failure. We do not parse
            it, so we cannot lose it.

    ToolCallDelta:
      type: object
      description: |
        A fragment of a `ToolCall` in a streaming response. Accumulate
        by `index`.
      required:
        - index
      properties:
        index:
          type: integer
          description: |
            Which call in the assistant turn this fragment belongs to.
            Present on every fragment, because a model can interleave
            fragments of two calls.
        id:
          type: string
        type:
          type: string
          const: function
        function:
          type: object
          properties:
            name:
              type: string
            arguments:
              type: string
              description: A fragment of the arguments string, to be concatenated.

    ResponseFormat:
      type: object
      description: |
        Constrain the shape of the reply. Passed through to the backend;
        the gateway does not enforce or post-validate it.
      required:
        - type
      properties:
        type:
          type: string
          enum:
            - text
            - json_object
            - json_schema
        json_schema:
          $ref: '#/components/schemas/ResponseJsonSchema'
          description: Required when `type` is `json_schema`.

    ResponseJsonSchema:
      type: object
      required:
        - name
        - schema
      properties:
        name:
          type: string
        description:
          type: string
        schema:
          type: object
          additionalProperties: true
          description: A JSON Schema object. Passed through verbatim.
        strict:
          type:
            - boolean
            - 'null'

    CompletionUsage:
      type: object
      description: |
        Token accounting in OpenAI's field names. Fields may be absent
        when the backend did not report them on that request.

        This used to say the CLI subprocess backends "generally do not",
        which is wrong and was believed downstream: both of them parse a
        usage block out of their CLI's output — Claude's envelope,
        Codex's `turn.completed` — and omit it only when the CLI emitted
        none.
      properties:
        prompt_tokens:
          type: integer
          minimum: 0
        completion_tokens:
          type: integer
          minimum: 0
        total_tokens:
          type: integer
          minimum: 0

    CompletionRoutingInfo:
      type: object
      description: |
        Namespaced extension recording how this particular request was
        served. Not part of OpenAI's schema, and ignored by clients that
        do not know it.

        It exists because the failure mode of a routing layer is being
        opaque: when one of several backends is slow or a cascade fired,
        an operator needs to see which one answered without going to the
        logs. `attempts` above 1 is the visible evidence that failover
        did its job.
      properties:
        driver:
          type: string
          description: Name of the inference-driver that served this request.
        runtime:
          type: string
          description: |
            Name of the engine runtime behind that driver, when it is a
            local engine. Absent for hosted and CLI backends, which have
            no runtime of ours.
        backend:
          $ref: 'components/common.yaml#/components/schemas/BackendKind'
        latency_ms:
          type: integer
          description: Gateway-side wall-clock time, including any failed attempts.
        attempts:
          type: integer
          minimum: 1
          description: |
            How many backends were tried. Greater than 1 means the
            priority-list cascade fired and an earlier backend failed.
        tier:
          type: integer
          minimum: 1
          description: |
            Which tier of the slot answered, 1-based. Greater than 1
            means every backend in an earlier tier was ineligible or
            failed — a cloud target answering for a local model, say.
        swapped_in:
          type: boolean
          description: |
            True when the gateway had to start a `startOnDemand`
            runtime to serve this request. The visible cost of idle
            unload, next to the request that paid it.
        waited_ms:
          type: integer
          minimum: 0
          description: |
            How long the request waited for a runtime to reach `ready`
            before being sent. Zero when nothing had to be woken.
        context_length:
          type: integer
          minimum: 1
          description: |
            The context window of the backend that actually answered, as
            that backend resolved it. **Null** when it does not expose
            one — a hosted provider, a CLI subscription, or a local
            engine that was not reachable to ask. Null and not absent:
            this envelope serializes its unset fields, as `runtime` has
            since M0.

            Per-request, and therefore not the same number as
            `x_eugene_plexus.context_length` on `GET /v1/models`: that
            one is the smallest across every backend serving the name,
            because a request may land on any of them. This one is the
            window that applied to *this* request, which is what makes a
            truncated answer explicable after the fact.
        prompt_truncated:
          type: boolean
          description: |
            **The backend silently dropped input.** True when the prompt
            we sent was far larger than the token count the backend
            reported consuming — the signature of a server that fits an
            over-long prompt into the window by discarding the middle of
            the conversation and answering anyway, with a 200 and no
            flag of its own.

            This is the failure that makes a coding harness loop: it
            sends file contents, the model never receives them, and the
            confident answer that comes back is about code nobody read.
            Measured on this project's own hardware: 66,389 characters
            across six messages came back as `prompt_tokens: 86`, HTTP
            200, nothing anywhere saying so.

            Detected, not predicted. It is computed from
            `usage.prompt_tokens` **after** the answer, by a ratio
            chosen to be far below any real tokenizer's — so it cannot
            fire on a merely token-dense prompt, and it needs no
            tokenizer of ours.

            **Three states, and the difference matters.** `null` means
            not evaluated — the backend reported no usage, or the prompt
            was too small for the test to mean anything — and must not
            be read as reassurance. `false` means it was checked and the
            input arrived. `true` means it did not. Null and not absent:
            this envelope serializes its unset fields, as `runtime` has
            since M0.

            **Why a flag and not an error.** The answer has already been
            generated, and on a streamed request it has already been
            delivered — M10's rule is that a stream cannot be unsent.
            Failing one path and flagging the other would make the same
            condition report two different ways, so both flag. A backend
            that refuses instead of truncating needs none of this: its
            refusal is exact and is passed straight through as a 400.

    EmbeddingRequest:
      type: object
      required:
        - model
        - input
      properties:
        model:
          type: string
          description: |
            Must name a model that serves the embeddings surface.
            `GET /v1/models` reports `x_eugene_plexus.surfaces` per
            model; a chat-only model is refused here with a 400 rather
            than sent down to fail as an obscure backend error.
        input:
          oneOf:
            - type: string
            - type: array
              minItems: 1
              items:
                type: string
          description: |
            One string, or a batch of them. Order is preserved and is
            the only way a caller can match vectors to inputs.

            **Token-array inputs are not accepted**, which OpenAI does
            allow. Supporting them would mean tokenizing on this side to
            validate, and this install deliberately owns no tokenizer --
            see the context-window decision. A caller sending one gets a
            400 rather than a silently different answer.
        encoding_format:
          type: string
          enum: [float, base64]
          default: float
          description: |
            `base64` is what the OpenAI SDKs ask for by default, so it
            is supported and is handled **here** rather than passed to
            the backend: little-endian `float32`, then base64.
        user:
          type: string
          description: Opaque end-user id, as OpenAI defines it. Recorded, not routed on.
        dimensions:
          type: integer
          minimum: 1
          description: |
            Passed through to the backend unchanged. Most local backends
            ignore it; this layer does not emulate truncation, because a
            silently-truncated vector is a wrong answer that looks like
            a right one.

    EmbeddingResponse:
      type: object
      required:
        - object
        - data
        - model
      properties:
        object:
          type: string
          enum: [list]
        data:
          type: array
          items:
            $ref: '#/components/schemas/EmbeddingData'
        model:
          type: string
          description: |
            The model that actually produced these vectors. After a
            same-model failover this still names that model -- by the
            rule above, it can never name a different one.
        usage:
          $ref: '#/components/schemas/EmbeddingUsage'
        x_eugene_plexus:
          $ref: '#/components/schemas/CompletionRoutingInfo'

    EmbeddingData:
      type: object
      required:
        - object
        - index
        - embedding
      properties:
        object:
          type: string
          enum: [embedding]
        index:
          type: integer
          minimum: 0
          description: Position of the input this vector came from.
        embedding:
          oneOf:
            - type: array
              items:
                type: number
            - type: string
          description: |
            An array of floats, or a base64 string when the caller asked
            for `base64` -- little-endian `float32`.

    EmbeddingUsage:
      type: object
      description: |
        Separate from `CompletionUsage` because there is no completion:
        OpenAI omits `completion_tokens` here, and inventing a zero
        would assert something the backend never said.
      properties:
        prompt_tokens:
          type: integer
          minimum: 0
        total_tokens:
          type: integer
          minimum: 0

    RoutingTableView:
      type: object
      description: |
        The gateway's resolved routing table, as of the last refresh.
        The same snapshot requests are routed from, opened up so an
        operator can see why a request went where it did.
      required:
        - refreshed_at
        - slots
      properties:
        refreshed_at:
          type: string
          format: date-time
        load_balancing:
          type: string
          description: The strategy in effect — the `loadBalancing` config value.
        slots:
          type: array
          items:
            $ref: '#/components/schemas/RoutingSlotView'
        unreachable_drivers:
          type: array
          items:
            type: string
          description: Drivers in the topology that did not answer `/v1/info`.
        control_root:
          $ref: '#/components/schemas/ControlRootView'

    ControlRootView:
      type: object
      description: |
        Where the routing table's node list comes from, and whether that
        source answered on the last refresh. The control root is the one
        thing routing needs from management — which agents exist and
        where — and the one thing that, until 2026-09-13, nothing told
        the gateway. It reads it from its own agent now; this says what
        it found.
      required:
        - source
        - reachable
      properties:
        source:
          type: string
          enum: [config, agent, none]
          description: |
            `config` — the `controlUrl` config field, set by an operator
            and used as given, even when wrong. `agent` — derived on
            this refresh from the gateway's own agent: `GET /v1/node`
            (`controlUrl`, when the node is enrolled), else the
            `control` component the agent declares. `none` — neither
            knew of one; the table is built from the one configured
            agent, which is a single-host install.
        url:
          type: string
          format: uri
          description: The control root read, or tried. Absent when `source` is `none`.
        reachable:
          type: boolean
          description: |
            Whether `GET /v1/nodes` answered on the last refresh. False
            keeps the previous node list in force — management being
            down must not empty the routing table — and is the state a
            container's sealed root leaves every gateway in after a
            restart. Always false when `source` is `none`.
        error:
          type: string
          description: |
            Why it did not answer, when it did not: the HTTP status and
            the problem's title when it sent one (`503 Locked`), else
            the transport error.
        nodes:
          type: integer
          description: How many nodes the control root listed on the last read that answered.

    RoutingSlotView:
      type: object
      required:
        - model
        - tiers
      properties:
        model:
          type: string
          description: What a client asks for.
        configured:
          type: boolean
          description: |
            True when a `modelSlots` entry exists for this model; false
            for the implicit one-tier slot every served model id gets.
        tiers:
          type: array
          items:
            $ref: '#/components/schemas/RoutingTierView'

    RoutingTierView:
      type: object
      required:
        - target
        - backends
      properties:
        target:
          type: string
          description: The model id this tier is the replica set of.
        backends:
          type: array
          items:
            $ref: '#/components/schemas/RoutingBackendView'

    RoutingBackendView:
      type: object
      required:
        - driver
        - eligible
      properties:
        driver:
          type: string
        url:
          type: string
          format: uri
        eligible:
          type: boolean
          description: Whether a request could be sent here right now.
        ineligible_reason:
          type: string
          description: |
            Why not, when `eligible` is false — the runtime's status
            (`stopped`, `loading`, `crashed`), or that the driver was
            unreachable.
        in_flight:
          type: integer
          minimum: 0
          description: Requests this gateway currently has outstanding to it.
        parallel_slots:
          type: integer
          minimum: 1
          description: The runtime's capacity, when it reported one; 1 otherwise.
        runtime:
          type: string
          description: The engine runtime this driver follows, when it follows one.
        runtime_status:
          type: string
          description: |
            The agent's `RuntimeStatus` for that runtime, as a string —
            the agent owns the enum.
        node:
          type: string
          description: The node the runtime runs on, when the agent reports one.
        stop_reason:
          type: string
          description: The agent's `Runtime.stopReason`, when the runtime is stopped.
        idle_unload_seconds:
          type: integer
          description: The runtime's declared idle timeout, when it has one.
        start_on_demand:
          type: boolean
        idle_seconds:
          type: integer
          minimum: 0
          description: |
            Seconds since the gateway last sent this backend a request.
            Absent when it never has.

    AnthropicMessagesRequest:
      type: object
      description: |
        Request body for `POST /v1/messages`, in Anthropic's shape.

        **Deliberately permissive, and the reason is a measurement.**
        Every field this gateway does not honour is *ignored* rather
        than rejected, because a real Claude Code request carries
        `thinking`, `cache_control`, `metadata` and
        `context_management` on the very first call, and a schema that
        refused an unknown field would refuse every request from the
        client this endpoint exists for.

        Consequently **this schema does not decide what is refused**.
        The refusals — image and document blocks, server-side tools,
        `mcp_servers`, more than four `stop_sequences` — are enforced
        against the raw request body by the implementation, with a 400
        naming the field, because a model that ignores extra keys cannot
        see the thing it is meant to reject. Read this schema as what
        the gateway *reads*, and the endpoint description as what it
        refuses.
      additionalProperties: true
      required:
        - model
        - messages
        - max_tokens
      properties:
        model:
          type: string
          description: |
            A model id from `GET /v1/models`. Anthropic model names have
            no special meaning here: the id is resolved against this
            install's slots like any other, and a caller naming
            `claude-sonnet-4-5` gets whatever the operator mapped that
            to, or a 400.
        messages:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/AnthropicInputMessage'
        max_tokens:
          type: integer
          minimum: 1
          description: |
            **Required by Anthropic's contract, and required here.**
            Unlike the OpenAI door, a missing value is a 400 rather than
            a fill from the settings profile, because a client written
            against this wire always sends one and its absence means the
            caller is not speaking this protocol.
        system:
          description: |
            A system prompt: a plain string, or a list of blocks.

            Claude Code sends three blocks, and the **first is not a
            prompt at all** — it is a billing header smuggled as prose
            (`x-anthropic-billing-header: …`). Any code that assumes
            `system[0]` is the instruction is wrong about the commonest
            client. All blocks are concatenated in order into one
            `system` message.
          oneOf:
            - type: string
            - type: array
              items:
                $ref: '#/components/schemas/AnthropicSystemBlock'
        stream:
          type: boolean
          default: false
          description: |
            When true the response is Anthropic's typed SSE stream.
            **Claude Code sets this on every request**, so the
            non-streaming path of this endpoint is real but is not
            exercised by that client.
        temperature:
          type: number
          format: float
          minimum: 0
          maximum: 1
          description: |
            Anthropic's range is 0-1 where OpenAI's is 0-2. Passed
            through unscaled: the value means the same thing to a local
            engine either way, and rescaling would silently change what
            a caller asked for.
        top_p:
          type: number
          format: float
          minimum: 0
          maximum: 1
        top_k:
          type: integer
          minimum: 0
          description: |
            **Read and dropped**, and this is a real loss rather than a
            no-op: both local engines accept a top-k and neither of this
            project's internal contracts carries one, which is the same
            gap `top_p` and `seed` have on `GenerateRequest`. Documented
            here so the omission is visible to whoever adds it.
        stop_sequences:
          type: array
          items:
            type: string
          description: |
            Up to four. A fifth is a 400 rather than a silent truncation
            to the first four, because dropping a stop sequence changes
            where the answer ends.
        tools:
          type: array
          items:
            $ref: '#/components/schemas/AnthropicToolDefinition'
          description: |
            Tool definitions. Translated into the OpenAI function shape
            and carried to the backend unchanged.

            A backend that cannot carry tools is refused by name rather
            than served without them — the same rule the OpenAI door
            states, and for the same reason: a harness cannot tell "the
            model chose not to call one" from "nobody offered it any".
        tool_choice:
          $ref: '#/components/schemas/AnthropicToolChoice'
        metadata:
          type: object
          additionalProperties: true
          description: |
            Read and dropped. Claude Code puts a JSON *string* in
            `user_id` carrying a device id, an account uuid and a
            session id; none of it is ours to keep, and the gateway's
            own request records already identify a request.
        thinking:
          type:
            - object
            - 'null'
          additionalProperties: true
          description: |
            **Read and dropped, never refused**, and the distinction was
            measured. Present on every Claude Code request, in three
            shapes: `{"budget_tokens": N, "type": "enabled"}` for a
            known Claude id, `{"type": "adaptive"}` for an arbitrary
            local id, and **`null` when the caller set
            `MAX_THINKING_TOKENS=0`** — so even `"thinking" in body` is
            true for the one configuration asking for no thinking at
            all.

            Dropping it is not a loss of control. A local model's
            reasoning output is governed by `thinkingMode` on its
            settings profile and by the driver's thinking filter, which
            is the operator's decision rather than the caller's.
        cache_control:
          type: object
          additionalProperties: true
          description: |
            Prompt-cache hints, read and dropped wherever they appear —
            on system blocks, on the last user content block, and on
            `tool_result` blocks. A local engine owns its own KV cache
            and there is nothing here to honour.

    AnthropicInputMessage:
      type: object
      description: |
        One turn. A tool result is **a `tool_result` block inside a
        `user` message**, and a model's tool call comes back as a
        `tool_use` block inside an `assistant` message — Anthropic has
        no `tool` role, and that is the shape fact the translation turns
        on.

        **`system` is in the enum because a real client sends it, and
        the published contract says it does not.** Anthropic documents
        `user` and `assistant` only, and the first version of this
        schema said so. Then a real Claude Code driving a tool loop
        against this gateway was refused with
        `messages.1.role: Input should be 'user' or 'assistant'` on its
        very first request: it sends the documented top-level `system`
        (three blocks) **and, separately, a `system`-role message inside
        `messages`** carrying several more kilobytes, positioned after
        the first user turn.

        It is carried **in place** rather than hoisted into the leading
        system prompt. The client put it after a user turn deliberately,
        and moving it would change what the model sees for the sake of
        tidiness on a wire we do not own.

        This one was found by the live run and not by the unit tests,
        because the unit fixtures came from a capture of a *simple*
        request and this shape appears only once tools are in play.
        Recorded in `docs/acceptance/anthropic-messages-measurement.md`.
      additionalProperties: true
      required:
        - role
        - content
      properties:
        role:
          type: string
          enum:
            - user
            - assistant
            - system
        content:
          description: |
            A plain string, or a list of blocks. Both forms arrive from
            real clients in the same conversation.
          oneOf:
            - type: string
            - type: array
              items:
                $ref: '#/components/schemas/AnthropicContentBlock'

    AnthropicContentBlock:
      type: object
      description: |
        One content block. **Modelled loosely on purpose**: the variants
        differ by `type` and a strict `oneOf` here would generate a
        union that rejects the next block type Anthropic adds, on a wire
        we do not own.

        The variants this gateway carries: `text` (`text`), `tool_use`
        (`id`, `name`, `input`), and `tool_result` (`tool_use_id`,
        `content`, `is_error`).

        The variants it refuses with a 400: `image` and `document`. They
        are refused rather than dropped because a model that never
        received the image is not answering the question that was
        asked, and a silently text-only answer to *"what is in this
        screenshot"* is worse than a refusal that names the reason.
      additionalProperties: true
      required:
        - type
      properties:
        type:
          type: string
          description: '`text`, `tool_use`, `tool_result`, `image`, `document`, …'
        text:
          type: string
        id:
          type: string
          description: 'On `tool_use`: the id a matching `tool_result` refers to.'
        name:
          type: string
          description: 'On `tool_use`: the tool being called.'
        input:
          type: object
          additionalProperties: true
          description: 'On `tool_use`: the arguments object, already parsed.'
        tool_use_id:
          type: string
          description: 'On `tool_result`: which call this answers.'
        content:
          description: |
            On `tool_result`: the result, as a string or as a list of
            blocks. Claude Code sends a plain string; a list containing
            an image block is refused like any other image.
          oneOf:
            - type: string
            - type: array
              items:
                $ref: '#/components/schemas/AnthropicContentBlock'
        is_error:
          type: boolean
          description: |
            On `tool_result`: the tool failed. Carried into the `tool`
            message's text rather than dropped, because a harness that
            cannot see its own tool failed will call it again.
        cache_control:
          type: object
          additionalProperties: true

    AnthropicSystemBlock:
      type: object
      additionalProperties: true
      required:
        - type
      properties:
        type:
          type: string
          enum:
            - text
        text:
          type: string
        cache_control:
          type: object
          additionalProperties: true

    AnthropicToolDefinition:
      type: object
      description: |
        A tool the model may call. `name` plus `input_schema` map
        directly onto an OpenAI function's `name` and `parameters`.

        A definition carrying a `type` naming a server-side tool —
        anything this gateway would have to execute itself, rather than
        hand back to the caller — is refused with a 400. This control
        plane routes to local engines; it has no web search to run and
        no sandbox to run code in, and pretending otherwise would fail
        at the moment the model chose to use one.
      additionalProperties: true
      required:
        - name
      properties:
        name:
          type: string
        description:
          type: string
        input_schema:
          type: object
          additionalProperties: true
          description: JSON Schema for the tool's arguments.
        type:
          type: string
          description: |
            Present only for server-side tools. Its presence is what the
            refusal keys on.
        cache_control:
          type: object
          additionalProperties: true

    AnthropicToolChoice:
      type: object
      description: |
        How the model should use `tools`. `auto`, `any`, `tool` (with a
        `name`) or `none`, mapped onto the OpenAI equivalents — `any`
        becomes `required`, which is the closest honest reading.
      additionalProperties: true
      required:
        - type
      properties:
        type:
          type: string
          enum:
            - auto
            - any
            - tool
            - none
        name:
          type: string
          description: 'With `type: tool`: which one.'

    AnthropicMessageResponse:
      type: object
      description: |
        A completed message. The `x_eugene_plexus` envelope the OpenAI
        door adds to its response body is **not** here — it rides on
        response headers instead, because a strict Anthropic client is
        exactly who this door is for and an unknown top-level key is a
        risk with no upside.
      required:
        - id
        - type
        - role
        - content
        - model
      properties:
        id:
          type: string
        type:
          type: string
          enum:
            - message
        role:
          type: string
          enum:
            - assistant
        model:
          type: string
          description: |
            The model that actually answered, which after a cascade is
            not necessarily the one that was asked for.
        content:
          type: array
          items:
            $ref: '#/components/schemas/AnthropicContentBlock'
          description: |
            `text` blocks and `tool_use` blocks, in the order the
            backend produced them.
        stop_reason:
          type:
            - string
            - 'null'
          enum:
            - end_turn
            - max_tokens
            - stop_sequence
            - tool_use
            - null
          description: |
            Mapped from the backend's finish reason: `stop` becomes
            `end_turn`, `length` becomes `max_tokens`, `tool_calls`
            becomes `tool_use`.
        stop_sequence:
          type:
            - string
            - 'null'
        usage:
          $ref: '#/components/schemas/AnthropicUsage'

    AnthropicUsage:
      type: object
      description: |
        Token counts, renamed from the backend's OpenAI-shaped `usage`.
        Cache fields are reported as zero rather than omitted: a client
        that reads them should see an honest nothing rather than an
        absence it has to guess about.
      required:
        - input_tokens
        - output_tokens
      properties:
        input_tokens:
          type: integer
        output_tokens:
          type: integer
        cache_creation_input_tokens:
          type: integer
          default: 0
        cache_read_input_tokens:
          type: integer
          default: 0

    AnthropicStreamEvent:
      type: object
      description: |
        One frame of the Anthropic event stream. Each SSE frame carries
        both an `event:` name and a `data:` object whose `type` repeats
        it; a client may read either, so both are always sent.

        The order is `message_start`, then per content block
        `content_block_start` → `content_block_delta`* →
        `content_block_stop`, then `message_delta` carrying
        `stop_reason` and final `usage`, then `message_stop`. **There is
        no `[DONE]` sentinel.**

        `message_start` is emitted on the **first event from the
        driver**, never on request acceptance — it names the model, and
        until the first token the cascade can still change which backend
        answers.

        An `error` event is how a truncation is reported once the status
        code is long gone: a stream that has emitted a token cannot fail
        over, so it stops, says why, and still closes with
        `message_stop` so a client's state machine does not hang.
      additionalProperties: true
      required:
        - type
      properties:
        type:
          type: string
          enum:
            - message_start
            - content_block_start
            - content_block_delta
            - content_block_stop
            - message_delta
            - message_stop
            - ping
            - error
        index:
          type: integer
          description: |
            Which content block, on the three `content_block_*` events.
            **Assigned by the gateway, statefully**: our internal stream
            numbers tool-call fragments per call and gives text no index
            at all, so the translator holds the open text block and a
            map from tool-call index to block index.
        message:
          type: object
          additionalProperties: true
        content_block:
          $ref: '#/components/schemas/AnthropicContentBlock'
        delta:
          type: object
          additionalProperties: true
          description: |
            `{"type": "text_delta", "text": …}` for prose,
            `{"type": "input_json_delta", "partial_json": …}` for a tool
            call's arguments, and on `message_delta` the `stop_reason`.
        usage:
          $ref: '#/components/schemas/AnthropicUsage'
        error:
          type: object
          additionalProperties: true

    AnthropicErrorResponse:
      type: object
      description: |
        Anthropic's error envelope. The rest of this gateway returns RFC
        7807 `problem+json` and the OpenAI doors return OpenAI's shape;
        this is the third foreign convention on this component, honoured
        exactly for the same reason as the second — a client parses it
        to build its exception, and anything else reports as an
        unhelpful generic failure.
      required:
        - type
        - error
      properties:
        type:
          type: string
          enum:
            - error
        error:
          type: object
          required:
            - type
            - message
          properties:
            type:
              type: string
              description: |
                `invalid_request_error`, `authentication_error`,
                `permission_error`, `not_found_error`,
                `rate_limit_error`, `api_error`, `overloaded_error`.
            message:
              type: string
              description: |
                Human-readable, and **it has to carry the whole
                explanation** — measured, a 400 and a 403 are shown to
                the user verbatim while a 404's message is discarded,
                which is why this door answers 400 for a model nothing
                serves.

    OpenAIErrorResponse:
      type: object
      description: |
        Error envelope for the two OpenAI-compatible operations. The
        rest of the gateway returns RFC 7807 `problem+json`; these two
        cannot, because OpenAI SDKs parse this shape to build their
        exceptions and would report a problem+json body as an unhelpful
        generic failure. One surface, one foreign convention, honoured
        exactly.
      required:
        - error
      properties:
        error:
          type: object
          required:
            - message
            - type
          properties:
            message:
              type: string
              description: |
                Human-readable failure. Names the model and, on a
                cascade, that every backend was tried — the operator
                reading it is usually the person who configured the
                thing.
            type:
              type: string
              description: 'OpenAI-style class, e.g. `invalid_request_error`.'
            param:
              type:
                - string
                - 'null'
            code:
              type:
                - string
                - 'null'

    # -------- Retained request metrics (M8) --------

    Percentiles:
      type: object
      description: |
        A latency distribution, in milliseconds. Percentiles rather than
        a mean because generation latency is long-tailed, and a mean
        hides exactly the requests an operator is asking about.
      required:
        - p50
        - p90
        - max
      properties:
        p50:
          type: integer
          minimum: 0
        p90:
          type: integer
          minimum: 0
        p99:
          type: integer
          minimum: 0
        max:
          type: integer
          minimum: 0

    Throughput:
      type: object
      description: |
        Completion tokens per second, computed from the **serving
        attempt's** elapsed time — not the request total, which
        includes failed attempts.

        `samples` is how many requests in the group actually reported
        token usage, and can be lower than the group's `requests`. A
        group where nothing reported usage is not given a zeroed
        `Throughput`: the field is null instead, so "unmeasured" and
        "zero" stay distinguishable.
      required:
        - p50
        - samples
      properties:
        p50:
          type: number
        p90:
          type: number
        samples:
          type: integer
          minimum: 1

    MetricsGroup:
      type: object
      description: |
        One dimension tuple's numbers over the window, or over one hour
        of it when `bucket=hour`.
      required:
        - requests
        - errors
        - cascaded
        - swappedIn
        - latencyMs
      properties:
        bucketStart:
          type: string
          format: date-time
          description: Present only when `bucket=hour`.
        model:
          type: string
          description: |
            The model id the client **asked for**. After a cascade this
            is not what answered — `driver` and `runtime` say that —
            and grouping by the requested id is what makes "this model
            is slow" answerable at all.
        driver:
          type: string
        runtime:
          type:
            - string
            - 'null'
          description: |
            The engine runtime behind the driver, by name so replicas
            are distinguished. Null for hosted and CLI backends, which
            have no runtime of ours.
        node:
          type:
            - string
            - 'null'
          description: Which host's agent supervises it. Null before enrollment.
        backend:
          $ref: 'components/common.yaml#/components/schemas/BackendKind'
        requests:
          type: integer
          minimum: 0
        errors:
          type: integer
          minimum: 0
          description: Requests that ended with no backend having served them.
        cascaded:
          type: integer
          minimum: 0
          description: |
            Requests with `attempts > 1`. A cascade that silently
            always works hides a broken primary, which is why this is
            counted rather than only logged.
        swappedIn:
          type: integer
          minimum: 0
          description: |
            Requests that had to wake a `startOnDemand` runtime. The
            measured cost of M6's idle unload, which shipped with no
            way to see what it costs.
        latencyMs:
          $ref: '#/components/schemas/Percentiles'
        tokensPerSecond:
          oneOf:
            - $ref: '#/components/schemas/Throughput'
            - type: 'null'
          description: Null when no request in this group reported token usage.
        waitedMs:
          oneOf:
            - $ref: '#/components/schemas/Percentiles'
            - type: 'null'
          description: |
            Wake latency, over the `swappedIn` requests only. Null when
            none of them woke anything.
        routingMs:
          oneOf:
            - $ref: '#/components/schemas/Percentiles'
            - type: 'null'
          description: |
            How long deciding where to send the request took. Null for
            groups recorded before this was measured.
        overheadMs:
          oneOf:
            - $ref: '#/components/schemas/Percentiles'
            - type: 'null'
          description: |
            The control plane's own cost: the serving attempt's
            gateway-side time minus the driver's measurement of its
            backend call. Null when no request in the group had a
            backend that reported its own latency.
        tierCounts:
          type: object
          additionalProperties:
            type: integer
            minimum: 0
          description: |
            Requests served, keyed by the 1-based tier that answered. A
            slot whose tier 2 answers everything has a primary that is
            not working, and this is where that becomes visible.

    MetricsSummary:
      type: object
      required:
        - windowStart
        - windowEnd
        - gatewayStartedAt
        - rowsDropped
        - groups
      properties:
        windowStart:
          type: string
          format: date-time
        windowEnd:
          type: string
          format: date-time
        gatewayStartedAt:
          type: string
          format: date-time
          description: |
            When this gateway process started. Present so a history
            that begins mid-window reads as partial rather than as an
            install that served nothing — the gateway is respawned on
            operator login, so a fresh start time is routine.
        rowsDropped:
          type: integer
          minimum: 0
          description: |
            Measurements discarded since startup because the write
            queue was full. Non-zero means these numbers are a sample
            rather than a census, and the endpoint says so instead of
            quietly under-reporting. Recording degrades before
            inference does.
        truncated:
          type: boolean
          description: |
            True when the window reaches past `metricsRetentionDays`,
            so raw rows for its early part no longer exist and the
            numbers describe less than the window asked for. Hourly
            rollups do cover that period on disk; nothing serves them
            yet.
        groups:
          type: array
          items:
            $ref: '#/components/schemas/MetricsGroup'

    MetricAttempt:
      type: object
      description: One backend touched by one request, in the order tried.
      required:
        - driver
        - elapsedMs
        - served
      properties:
        driver:
          type: string
        runtime:
          type:
            - string
            - 'null'
        node:
          type:
            - string
            - 'null'
        backend:
          $ref: 'components/common.yaml#/components/schemas/BackendKind'
        elapsedMs:
          type: integer
          minimum: 0
          description: |
            This attempt alone, not the request. Gateway-side, so it
            includes the local hop to the driver.
        backendMs:
          type:
            - integer
            - 'null'
          description: |
            The **driver's** own measurement of its backend call
            (`GenerateResponse.latencyMs`), when it reported one.

            `elapsedMs - backendMs` is therefore the cost of the
            gateway-to-driver hop plus the driver's own work: the
            control plane's overhead on this request. This document
            asserted from M0 to M8 that the extra local hop was
            "sub-millisecond against a multi-second generation" and "not
            a cost worth optimising away" - an architectural
            justification nobody had measured. Both numbers were already
            being produced; subtracting them made the claim checkable,
            and **the first time it ran it came back 114-120 ms**. See
            this document's overview.
          minimum: 0
        served:
          type: boolean
        error:
          type:
            - string
            - 'null'
          description: |
            The exception **class name** only, never its message.
            Driver error text can carry a provider's response body, and
            a metrics table is the kind of thing that gets pasted into
            an issue — this must not become an accidental credential
            store.

    MetricRequest:
      type: object
      required:
        - startedAt
        - requestedModel
        - attempts
        - totalMs
        - outcome
        - tries
      properties:
        startedAt:
          type: string
          format: date-time
        requestedModel:
          type: string
        servedModel:
          type:
            - string
            - 'null'
          description: |
            What actually answered. Differs from the requested id after
            a cascade.
        attempts:
          type: integer
          minimum: 1
        tier:
          type: integer
          minimum: 1
        totalMs:
          type: integer
          minimum: 0
          description: |
            Gateway-side wall clock for the whole request, including
            failed attempts and excluding the wake — the same figure
            `x_eugene_plexus.latency_ms` reports. Per-backend
            throughput comes from `tries[].elapsedMs`, never from here.
        routingMs:
          type:
            - integer
            - 'null'
          description: |
            Time spent deciding where to send this request - resolving
            the model to a slot, picking a backend, and any
            routing-table refresh that happened on the way - measured
            **before** `totalMs` starts and excluding the wake, which is
            `waitedMs`.

            Previously invisible, and not always small: a refresh does
            HTTP to the agent and to every driver's `/v1/info`, inside
            the request that triggered it.
          minimum: 0
        refreshed:
          type: boolean
          description: |
            Whether a routing-table refresh ran inside this request.
            The expensive and surprising case, so it is a flag rather
            than something to infer from `routingMs`.
        strategy:
          type:
            - string
            - 'null'
          description: |
            The `loadBalancing` value in effect when this request was
            routed. Recorded per request because the config can change
            between them, and `least_busy` and `round_robin` explain
            different orderings.
        candidates:
          type: array
          description: |
            What the balancer considered. Present only when there was a
            decision to make - more than one candidate, or at least one
            rejected.
          items:
            $ref: '#/components/schemas/MetricCandidate'
        waitedMs:
          type: integer
          minimum: 0
        swappedIn:
          type: boolean
        streamed:
          type: boolean
          description: |
            Whether the client asked for SSE. Recorded because streamed
            requests were invisible to the response envelope, and a
            store that could not tell them apart would hide the very
            gap it was built to close.
        promptTokens:
          type:
            - integer
            - 'null'
        completionTokens:
          type:
            - integer
            - 'null'
        outcome:
          type: string
          enum: [served, error]
        tries:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/MetricAttempt'


    MetricCandidate:
      type: object
      description: |
        One backend the balancer considered for a request, and what it
        saw when it decided.

        Deliberately the **input** to the decision rather than a score.
        There is no score: `least_busy` is a sort by in-flight requests
        per slot of capacity, and inventing a number to display would be
        inventing the smarter balancer that was explicitly deferred.
        What this answers is the question an operator actually asks —
        why did this request go there and not to the other one.

        Recorded only when there was a decision to make: more than one
        candidate, or at least one rejected. A single eligible backend is
        not an audit trail.
      required:
        - driver
        - tier
        - eligible
      properties:
        driver:
          type: string
        tier:
          type: integer
          minimum: 1
        eligible:
          type: boolean
          description: |
            Whether this backend could take the request at all. A driver
            following a runtime is eligible only while that runtime is
            `ready`; one following nothing of ours is eligible whenever
            it is reachable.
        reason:
          type:
            - string
            - 'null'
          description: Why not, when `eligible` is false. Null when it was.
        inFlight:
          type:
            - integer
            - 'null'
          description: |
            Requests already outstanding to this backend when the choice
            was made. The load signal `least_busy` sorts on.
          minimum: 0
        slots:
          type:
            - integer
            - 'null'
          description: |
            The runtime's `parallelSlots`, its concurrent capacity. The
            balancer compares `inFlight / slots`, not `inFlight`, so a
            four-slot replica holding two requests is less loaded than a
            one-slot replica holding one.
          minimum: 1

    MetricRequestPage:
      type: object
      required:
        - requests
      properties:
        requests:
          type: array
          items:
            $ref: '#/components/schemas/MetricRequest'
        nextCursor:
          type:
            - string
            - 'null'
          description: Absent or null on the last page.
