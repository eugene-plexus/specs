  /v1/videos/{video_id}:
    get:
      tags: [inference]
      operationId: retrieveVideo
      summary: Poll a video job.
      security:
        - bearerAuth: []
      description: |
        The job as its backend reports it now, in OpenAI's shape: `queued`,
        `in_progress`, `completed` or `failed`, with `progress` 0 until it
        ends (OpenRouter reports none, measured) and `prompt` null (the
        handle does not carry it). **Another key's handle, a forged one and
        one from another install all read as not found.**

        A job that has ended carries `x_eugene_plexus.cost_usd` when the
        provider says what it billed (2026-10-08). OpenRouter says it on a
        completed job.

        Remix, edits, extensions and delete are not routed (P5-2): only
        OpenAI's shut-down API served them.
      parameters:
        - name: video_id
          in: path
          required: true
          schema:
            type: string
            maxLength: 4096
          description: The handle `POST /v1/videos` returned.
      responses:
        '200':
          description: The job.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoResource'
        '404':
          description: No such job for this key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenAIErrorResponse'
        '502':
          description: The backend failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenAIErrorResponse'
        '503':
          description: The backend that holds the job is not reachable right now.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenAIErrorResponse'

  /v1/videos/{video_id}/content:
    get:
      tags: [inference]
      operationId: downloadVideoContent
      summary: A finished job's MP4, streamed.
      security:
        - bearerAuth: []
      description: |
        The video, streamed as the backend sends it. **`variant` other than
        `video` is refused**: OpenRouter ignores it and answers the MP4
        (measured), which a caller asking for a thumbnail would save as one.
      parameters:
        - name: video_id
          in: path
          required: true
          schema:
            type: string
            maxLength: 4096
          description: The handle `POST /v1/videos` returned.
        - name: variant
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/VideoVariant'
      responses:
        '200':
          description: The video.
          content:
            video/mp4:
              schema:
                type: string
                format: binary
        '400':
          description: A `variant` other than `video`, or a job that has not completed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenAIErrorResponse'
        '404':
          description: No such job for this key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenAIErrorResponse'
        '502':
          description: The backend failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenAIErrorResponse'
        '503':
          description: The backend that holds the job is not reachable right now.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenAIErrorResponse'

  /v1/files:
    post:
      tags: [files]
      operationId: createFile
      summary: Keep a file in this install's store (OpenAI's Files API; Anthropic's too).
      security:
        - bearerAuth: []
      description: |
        Row 53. The file is kept by the install's **store**, one per
        install on the root by default, and belongs to the caller: the
        person the root verified (an app's `X-Eugene-Person-Token`), else
        the client key, else the owner's console. Nobody else sees it, the
        install owner included. **It is kept until it is deleted**, as
        OpenAI keeps a file, unless the request sends `expires_after`
        (OpenAI's field and bounds: one hour to 30 days) or the owner set a
        default life in Settings; then it is deleted for good at its end.

        **At most 16 MiB here**, the gateway's body limit; a larger file
        comes through `/v1/uploads` in parts. Over the owner's quota (10
        GiB and 10,000 files by default) is a 413 that says the numbers;
        nothing is written past it.

        **Anthropic's Files API is this door too**: a request with
        `anthropic-version` (every Anthropic SDK sends it) is answered in
        Anthropic's shapes (`AnthropicFileMetadata`) and its error
        envelope, and the file is kept as `user_data`.

        **When the store is not answering**, every files and uploads
        request is a 503 that names the cause ("Eugene's store is not
        answering: ... Chat keeps working; files wait for it."). Chat,
        completions and Messages without a `file_id` never ask the store.
        When the owner turned files off in Settings, a 403 says so.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/FileUploadForm'
      responses:
        '200':
          description: The file, kept.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/OpenAIFile'
                  - $ref: '#/components/schemas/AnthropicFileMetadata'
        '400':
          description: A missing file, an unknown `purpose`, an `expires_after` past the maximum.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OpenAIErrorResponse'}
        '401':
          description: No usable credential.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OpenAIErrorResponse'}
        '403':
          description: The owner turned files off in Settings.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OpenAIErrorResponse'}
        '413':
          description: Over 16 MiB, or over the owner's quota (the numbers are in the message).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OpenAIErrorResponse'}
        '503':
          description: The store is not answering; the message names the cause.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OpenAIErrorResponse'}
    get:
      tags: [files]
      operationId: listFiles
      summary: The caller's own files.
      security:
        - bearerAuth: []
      description: |
        OpenAI's `purpose`, `limit` (1 to 10,000), `order` and `after`;
        with `anthropic-version`, Anthropic's `limit` (1 to 1,000, default
        20), `after_id` and `before_id`. Another owner's files are never
        listed.
      parameters:
        - name: purpose
          in: query
          required: false
          schema: {$ref: '#/components/schemas/OpenAIFilePurpose'}
        - name: limit
          in: query
          required: false
          schema: {type: integer, minimum: 1, maximum: 10000}
        - name: order
          in: query
          required: false
          schema:
            type: string
            enum: [asc, desc]
        - name: after
          in: query
          required: false
          schema: {type: string}
        - name: after_id
          in: query
          required: false
          schema: {type: string}
        - name: before_id
          in: query
          required: false
          schema: {type: string}
      responses:
        '200':
          description: One page of the caller's files.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/OpenAIFileList'
                  - $ref: '#/components/schemas/AnthropicFileList'
        '401':
          description: No usable credential.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OpenAIErrorResponse'}
        '503':
          description: The store is not answering; the message names the cause.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OpenAIErrorResponse'}

  /v1/files/{file_id}:
    parameters:
      - name: file_id
        in: path
        required: true
        schema: {type: string, maxLength: 64}
    get:
      tags: [files]
      operationId: retrieveFile
      summary: One of the caller's files.
      security:
        - bearerAuth: []
      description: |
        **Another owner's file reads as one that does not exist**: the
        same 404 and the same message, so a caller learns nothing of what
        others keep.
      responses:
        '200':
          description: The file.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/OpenAIFile'
                  - $ref: '#/components/schemas/AnthropicFileMetadata'
        '404':
          description: No such file for this caller.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OpenAIErrorResponse'}
        '503':
          description: The store is not answering; the message names the cause.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OpenAIErrorResponse'}
    delete:
      tags: [files]
      operationId: deleteFile
      summary: Delete one of the caller's files, for good.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Deleted.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/OpenAIFileDeleted'
                  - $ref: '#/components/schemas/AnthropicFileDeleted'
        '404':
          description: No such file for this caller.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OpenAIErrorResponse'}
        '503':
          description: The store is not answering; the message names the cause.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OpenAIErrorResponse'}

  /v1/files/{file_id}/content:
    parameters:
      - name: file_id
        in: path
        required: true
        schema: {type: string, maxLength: 64}
    get:
      tags: [files]
      operationId: downloadFileContent
      summary: The bytes of one of the caller's files.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The bytes as kept, with the file's media type.
          content:
            application/octet-stream:
              schema: {type: string, format: binary}
        '404':
          description: No such file for this caller.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OpenAIErrorResponse'}
        '503':
          description: The store is not answering; the message names the cause.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OpenAIErrorResponse'}

  /v1/uploads:
    post:
      tags: [files]
      operationId: createUpload
      summary: Start an upload of a file larger than one request (OpenAI's Uploads API).
      security:
        - bearerAuth: []
      description: |
        Declare the file (`bytes`, `filename`, `mime_type`, `purpose`),
        add its parts (each at most 16 MiB), then complete it with the
        parts in order and, optionally, its MD5 (OpenAI's field) or
        SHA-256. The parts are joined into a temporary file, the size and
        digest are checked, and only then is it a file. An upload not
        completed within an hour is deleted with its parts.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/OpenAIUploadRequest'}
      responses:
        '200':
          description: The upload, `pending`.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OpenAIUpload'}
        '400':
          description: A missing or wrong field.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OpenAIErrorResponse'}
        '413':
          description: Over the owner's quota (the numbers are in the message).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OpenAIErrorResponse'}
        '503':
          description: The store is not answering; the message names the cause.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OpenAIErrorResponse'}

  /v1/uploads/{upload_id}/parts:
    parameters:
      - name: upload_id
        in: path
        required: true
        schema: {type: string, maxLength: 64}
    post:
      tags: [files]
      operationId: addUploadPart
      summary: Add one part to the caller's upload.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [data]
              properties:
                data:
                  type: string
                  format: binary
                  description: At most 16 MiB.
      responses:
        '200':
          description: The part.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OpenAIUploadPart'}
        '404':
          description: No such upload for this caller, or it has ended.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OpenAIErrorResponse'}
        '413':
          description: A part over 16 MiB.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OpenAIErrorResponse'}
        '503':
          description: The store is not answering; the message names the cause.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OpenAIErrorResponse'}

  /v1/uploads/{upload_id}/complete:
    parameters:
      - name: upload_id
        in: path
        required: true
        schema: {type: string, maxLength: 64}
    post:
      tags: [files]
      operationId: completeUpload
      summary: Join the parts, in order, into one of the caller's files.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/OpenAIUploadComplete'}
      responses:
        '200':
          description: The upload, `completed`, with its `file`.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OpenAIUpload'}
        '400':
          description: |
            The parts do not add up to the declared `bytes`, or the MD5 or
            SHA-256 does not match; the upload stays `pending`.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OpenAIErrorResponse'}
        '404':
          description: No such upload or part for this caller.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OpenAIErrorResponse'}
        '409':
          description: The upload is being completed, or is taking a part, already.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OpenAIErrorResponse'}
        '503':
          description: The store is not answering; the message names the cause.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OpenAIErrorResponse'}

  /v1/uploads/{upload_id}/cancel:
    parameters:
      - name: upload_id
        in: path
        required: true
        schema: {type: string, maxLength: 64}
    post:
      tags: [files]
      operationId: cancelUpload
      summary: Stop one of the caller's uploads; its parts are deleted.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The upload, `cancelled`.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OpenAIUpload'}
        '404':
          description: No such upload for this caller.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OpenAIErrorResponse'}
        '503':
          description: The store is not answering; the message names the cause.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OpenAIErrorResponse'}

  /v1/embeddings:
    post:
      tags: [inference]
      operationId: createEmbedding
      summary: OpenAI-compatible embeddings.
      security:
        - bearerAuth: []
      description: |
        The second OpenAI surface this gateway serves, and the reason it
        exists is coherence rather than demand: the library already
        detects dedicated embedding models (a pooling type in GGUF
        metadata, an encoder architecture in safetensors) and will
        happily discover, download and launch one. Before this endpoint,
        that model then appeared on `GET /v1/models` looking like
        anything else and failed every request it was sent. We were
        letting people acquire a thing we could not serve.

        **FAILOVER DOES NOT CROSS MODELS HERE, AND THAT IS THE RULE THIS
        ENDPOINT TURNS ON.** Everywhere else in this gateway a slot is
        an ordered list of targets and a failure cascades to the next
        one. For chat that degrades gracefully -- a different model
        answers, and the caller can tell. For embeddings it is silent
        corruption: vectors from two models occupy different spaces, so
        a fallback writes noise into the caller's vector store with a
        200 and nothing to mark the seam. Different dimensions would at
        least raise; the *same* dimension poisons quietly, and the
        damage outlives the request in a database.

        So: balancing and failover across **replicas of the same model
        id** work exactly as they do for chat -- those are
        interchangeable by definition. A `modelSlots` cascade to a
        *different* target does not run for embeddings. A request whose
        own model has no eligible backend fails rather than being served
        by a neighbour. Same family of rule as M10's "failover is
        possible until the first token and impossible after it": both
        give up a retry to avoid returning a wrong answer that looks
        like a right one.

        **`encoding_format` is honoured here rather than passed down.**
        The OpenAI SDKs request `base64` by default, and backends differ
        on whether they implement it -- so the driver surface speaks
        float arrays only and this layer encodes. The encoding is
        little-endian `float32`, then base64, verified byte-for-byte
        against a real backend's own output rather than inferred from
        the OpenAI documentation.

        **`dimensions` reaches the driver** (row 58). Gemini sends it as
        `outputDimensionality`, including each item in a batch. The
        answer names dimensions in `x-eugene-plexus-ignored-settings`
        only when the serving backend did not apply it; it is absent
        for dimensions applied by Gemini. Provider refusals name the
        field and observed cause. No layer truncates or pads vectors.
        An untested capability alone never blocks an attempt.

        **`user` remains accepted and ignored**: it is not forwarded,
        stored or routed on. The ignored-settings header names it when
        present; when both fields were ignored the order is
        `dimensions, user`. A JSON null is not a setting. Before row 58
        dimensions was always ignored (MR0); the header now reports
        what the backend actually applied.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmbeddingRequest'
      responses:
        '200':
          description: |
            Vectors produced. `x-eugene-plexus-ignored-settings` names
            `user` when supplied and `dimensions` only when the backend
            did not apply it. It is absent when nothing was ignored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmbeddingResponse'
        '400':
          description: |
            Malformed request, or the named model does not serve this
            surface -- `GET /v1/models` reports which surfaces each
            model serves, so a caller can tell before sending.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenAIErrorResponse'
        '404':
          description: No reachable driver serves the requested model.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenAIErrorResponse'
        '499':
          description: |
            The client disconnected; the backend call was cancelled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenAIErrorResponse'
        '502':
          description: |
            Every eligible backend for this model failed. Note "for this
            model": the cascade never reached a different one. A driver
            that refused the gateway's own credential, or a provider
            that refused a driver's own key, also lands here, with
            `error.type` `upstream_auth_error`, for the reasons given on
            `POST /v1/chat/completions`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenAIErrorResponse'
        '504':
          description: |
            No backend answered within `requestTimeoutSeconds`. Not
            retried on a replica: a replica would take the same time on
            the same input.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenAIErrorResponse'
        '503':
          description: |
            Something serves this model and none of it can take a
            request right now -- usually an engine still loading.
            Retryable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenAIErrorResponse'

  /v1/rerank:
    post:
      tags: [inference]
      operationId: createRerank
      summary: Sort passages by how well they answer a question.
      security:
        - bearerAuth: []
      description: |
        A result sorter (reranker) scores each passage a search found
        against the question, and the best come first (MR6, 2026-10-12).
        Document search sends a model its top few passages: a sorter picks
        them better than the search's own order. Open WebUI calls this as
        its external reranker; any client of Jina's, Cohere's or Hugging
        Face TEI's rerank API can.

        **Three request shapes, one door.** `documents` (Jina, Cohere):
        strings, or objects with a string `text`, answered as
        `RerankResponse` (`results`). `texts` (TEI): strings, answered as
        TEI answers, a bare array of `{index, score}`. Exactly one of the
        two. The answer's shape follows the request's.

        **Scores are 0 to 1, best first.** The engine's own scale is not
        the same from model to model (measured: Qwen3-Reranker answers
        probabilities, bge-reranker-v2-m3 logits from 8.19 to -11.04), so
        a threshold would mean nothing across them; the driver puts every
        score on one scale (`inference-driver.yaml` `POST /v1/rerank`).
        `raw_scores: true` asks for the engine's own numbers instead.

        **Failover does not cross models**, as on `POST /v1/embeddings`:
        replicas of the named model balance and fail over; a `modelSlots`
        cascade to a different target does not run, because two sorters'
        scores are not comparable and a caller sorting by them would mix
        scales with a 200.

        **`model` may be left out**, as TEI's clients do: the request
        goes to the one model this key may use whose surfaces include
        `rerank`. None is a 404 that says so; two or more is a 400 naming
        them.

        **What `llama-server` does not do is done here.** It answers
        `return_documents` with no documents and refuses objects
        (measured on b10948 and b11552); this door sends it the text and
        puts the passage back on each result when `return_documents` or
        `return_text` asks. An empty list is answered with no results and
        reaches no model.

        **Accepted and ignored, and the answer says so:** `truncate: true`
        (and its `truncation_direction`), `max_chunks_per_doc`,
        `max_tokens_per_doc` and `rank_fields`, named in
        `x-eugene-plexus-ignored-settings` in that order when the request
        carries them, as the other doors name what they do not honour. A
        passage longer than the model takes is a 400 naming the limit,
        not cut, which is what TEI's default `truncate: false` asks for,
        so that is not named.

        At most 1,000 passages a request (Cohere's limit). The body limit
        is the embeddings door's.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RerankRequest'
      responses:
        '200':
          description: |
            The passages, scored, best first: `RerankResponse` for a
            `documents` request, `TeiRerankResponse` for a `texts` one.
            `x-eugene-plexus-ignored-settings` names what was accepted and
            not honoured, and is absent otherwise.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/RerankResponse'
                  - $ref: '#/components/schemas/TeiRerankResponse'
        '400':
          description: |
            Malformed request (neither or both of `documents` and `texts`,
            more than 1,000 passages, a passage that is neither text nor an
            object with a string `text`, which the message names by
            position), a model that does not serve `rerank`, `model` left
            out where two or more sorters are served, or a passage longer
            than the model takes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenAIErrorResponse'
        '404':
          description: |
            No reachable driver serves the requested model, or `model` was
            left out and no result sorter is served to this key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenAIErrorResponse'
        '499':
          description: |
            The client disconnected; the backend call was cancelled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenAIErrorResponse'
        '502':
          description: |
            Every eligible backend for this model failed, without reaching
            a different model; `upstream_auth_error` as on
            `POST /v1/chat/completions`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenAIErrorResponse'
        '503':
          description: |
            Something serves this model and none of it can take a request
            right now, usually an engine still loading. Retryable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenAIErrorResponse'
        '504':
          description: |
            No backend answered within `requestTimeoutSeconds`. Not retried
            on a replica.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenAIErrorResponse'

  /v1/systemone:
    post:
      tags: [inference]
      operationId: createDecision
      summary: TypeSafe-shaped typed decisions against local or hosted decision models.
      security:
        - bearerAuth: []
      description: |
        **The fourth front door: decisions, not text.** One state and a
        map of named typed questions in; structured answers out — a
        probability of yes (`noul`), a selection with a distribution
        over named options (`choice`), a probability-weighted value over
        ordered levels (`score`). The request and response vocabulary is
        the **pinned TypeSafe System One protocol** verbatim
        (docs.typesafe.ai/api, read 2026-09-22 —
        `docs/design/decision-models.md` holds the pin and the measured
        evidence), so a TypeSafe client changes its base URL and
        nothing else. **The calling application owns any subsequent
        action**: a decision response never executes a tool or changes
        routing policy.

        Like the Anthropic door it is a translation at the edge, not a
        second routing engine: `model` is a public Eugene alias resolved
        through the same routing table, admission and scopes as every
        completion, and the substance travels to a driver's internal
        `POST /v1/decide`. Only backends advertising
        `capabilities.decision` are eligible; a chat request naming a
        decision-only model, or a decision naming a chat-only model, is
        a 400 whose message names the right door. **Hosted decision
        providers are cloud-classified**: a `localOnly` key is refused
        before any state leaves the machine, and a hosted provider is
        never a fallback for a local one.

        **Bounds are enforced before any backend work**: the body-size
        limit every door shares, at least one and at most
        `decisionMaxQuestions` (config, default 32) questions, `choice`
        criteria of 1-255 options, `score` criteria of 2-10 ordered
        levels, and fields the protocol does not define are refused
        rather than dropped. Non-streaming, deliberately — initial
        scope.

        **A fired deadline is not permission to re-decide.** Refusals
        before work cascade across eligible replicas exactly as
        completions do; a timeout after possible execution answers 504
        without silently sending the same decision to a different model,
        and the outcome is recorded uncertain per A6b. A client
        disconnect does not free the backend: known local work runs to
        completion and capacity stays occupied until it does, because a
        single-slot decision engine that is over-admitted holds capacity
        nobody can free.

        Errors use TypeSafe's own status vocabulary where one exists
        (401, 422, 429) and this install's elsewhere. **SDK note carried
        from the pin**: TypeSafe's SDKs retry automatically by default;
        the documented client examples disable that, because a hidden
        retry against a decision endpoint is a second decision nobody
        asked for.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SystemOneRequest'
      responses:
        '200':
          description: |
            Every question answered and validated, in TypeSafe's
            response shape: `model` (the public alias that served it),
            `answers` keyed by the request's question names, and `usage`
            with `input_tokens` / `output_tokens` as the backend
            reported them (absent accounting stays absent rather than
            being invented).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemOneResponse'
        '400':
          description: |
            The named model exists and cannot decide (a chat model — the
            message names `/v1/chat/completions`), or the request
            violates the pinned protocol in a way no replica would
            accept.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenAIErrorResponse'
        '401':
          description: Missing, malformed, expired or revoked credential.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenAIErrorResponse'
        '403':
          description: |
            A valid client key that may not use this model, or a
            `localOnly` key against a hosted decision provider —
            refused before any state leaves the machine.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenAIErrorResponse'
        '404':
          description: No decision backend serves the named model.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenAIErrorResponse'
        '422':
          description: |
            Request validation failure — TypeSafe's own status for a
            malformed question, kept so a TypeSafe client's error
            handling works unchanged.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenAIErrorResponse'
        '429':
          description: A client key over its rate or concurrency limit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenAIErrorResponse'
        '502':
          description: |
            Every eligible backend failed, or the backend returned
            something that is not a valid decision — malformed output is
            a backend error, never an invented answer. A provider that
            refused the driver's own key (hosted Jev with a bad or
            unfunded key) is `upstream_auth_error`, as on
            `POST /v1/chat/completions`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenAIErrorResponse'
        '504':
          description: |
            No answer within the deadline. Not retried on another
            backend; the outcome is uncertain, not failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenAIErrorResponse'

  /v1/admin/drivers:
    get:
      tags: [admin]
      operationId: listDrivers
      summary: Report the gateway's configured drivers.
      description: |
        Surfaces what the gateway sees when it queries each
        driver's `/v1/info`, in the order the operator configured
        them. Used by the UI to render dynamic per-driver tabs and by
        ops to confirm the topology.

        Every driver is listed whatever it answered, each unreachable
        or degraded one with its `error`; an empty topology is an empty
        list. Until 2026-10-10 an all-unreachable topology was a 503,
        and the console lost every driver's reason and every
        companion's runtime with it.
      responses:
        '200':
          description: Driver topology snapshot.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriversInfo'
        '503':
          description: The gateway is starting up or in safe mode, so it has no routing table yet.
          content:
            application/problem+json:
              schema:
                $ref: 'components/common.yaml#/components/schemas/Problem'

  /v1/admin/drivers/probe:
    post:
      tags: [admin]
      operationId: probeDriver
      summary: Test-connect to an arbitrary driver URL without persisting it.
      description: |
        Used by the UI's per-URL "Test" buttons in the drivers list
        editor — same affordance Sonarr / Radarr expose next to each
        indexer entry. Fetches `<url>/v1/info` once, reports
        reachability + backend identity, and returns. Does not touch
        the saved config; safe to call against unsaved form values.

        Probes a *single* URL. The UI resolves a driver's name to a URL
        via the agent topology and calls this once per driver, so each
        backend behind a model can be tested independently. Priority
        lists are `modelSlots` entries naming model ids, not URLs, so
        there is nothing here to probe for a slot as a whole — read
        `GET /v1/admin/routing` for how a slot currently resolves.

        **Probed anonymously** (2026-09-18). Operator-gated, as every
        admin path here is, and it dials whatever the operator typed —
        that is the feature. What it no longer carries is this
        gateway's service token, so a URL in a form is not enough to
        collect one. An operator typing an address is not an operator
        deciding to hand out a credential.

        Consequently a backend that wants a key answers **401, and that
        is reported as `reachable: true`** with the reason in `error`. It
        is the more diagnostic answer: the address answered, so the
        operator's next step is the key rather than the network.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DriverProbeRequest'
      responses:
        '200':
          description: |
            Probe outcome. Returned for both reachable and unreachable
            cases — `reachable` distinguishes them, `error` carries the
            failure detail when set. **A URL that answered at all is
            `reachable: true`**, including one that answered 401 or 403
            to the unauthenticated probe; only a transport failure is
            `reachable: false`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriverHealth'
        '400':
          $ref: 'components/common.yaml#/components/responses/Problem'

  /v1/admin/routing:
    get:
      tags: [admin]
      operationId: getRoutingTable
      summary: The resolved routing table — slots, tiers, backends, and what each is doing.
      description: |
        What `/v1/models` compresses into one entry per model, opened
        up: every slot the gateway would answer for, its tiers in
        order, and for each backend whether it is eligible right now
        and why not, how many requests are in flight to it, the
        runtime behind it and that runtime's lifecycle state. This is
        the page an operator reads when a request went somewhere
        surprising, and what the acceptance run reads to see the
        balancer alternate.

        A view of the last refresh, not a fresh poll — the same
        snapshot requests are routed from, so what it shows is what a
        request would meet.

        `control_root` says where the node list came from — the
        `controlUrl` config field, the gateway's own agent, or nowhere
        — and whether the control root answered on the last refresh.
        A sealed root after a container restart shows here as
        `reachable: false` with `503 Locked` in `error`, the one place
        outside the control root's own API that says so; the table
        keeps the previous node list while it is true.
      responses:
        '200':
          description: The routing table as of the last refresh.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoutingTableView'
        '503':
          description: No routing table — the gateway is in safe mode.
          content:
            application/problem+json:
              schema:
                $ref: 'components/common.yaml#/components/schemas/Problem'

  /v1/admin/restart:
    post:
      tags: [admin]
      operationId: restart
      summary: Schedule a process restart so `requiresRestart` config takes effect.
      description: |
        Some config keys (driver list, ports, etc.) carry
        `requiresRestart: true` because the gateway only reads them
        at startup. Calling this endpoint tells the gateway to
        exit shortly after responding; an external supervisor (systemd,
        docker, deploy launcher) brings it back up with the new config
        in effect. The endpoint returns *before* the exit so the HTTP
        response has time to flush.

        v0.1 personal-use installations without a supervisor will
        require a manual relaunch. The UI should make this clear in the
        confirmation dialog.

        ## Auth note (v0.1)

        Unauthenticated, same as the rest of the v0.1 admin surface
        (assumed Tailscale tailnet). Auth lands in v0.2.
      responses:
        '202':
          description: Restart scheduled.
          content:
            application/json:
              schema:
                $ref: 'components/common.yaml#/components/schemas/RestartResult'

  # -------- Retained request metrics (M8) --------
  #
  # Every completion already reported how it was served, on
  # `x_eugene_plexus`, and none of it was kept. These two paths are
  # where it is kept.
  #
  # Recorded at the routing hooks rather than off the response
  # envelope, deliberately: the streaming path never sets
  # `x_eugene_plexus`, so an envelope-based recorder would be blind to
  # every streaming client. The hooks fire around every attempt on both
  # paths.

  /v1/metrics/clients:
    get:
      tags: [metrics]
      operationId: getClientUsage
      summary: Per-key reported usage on this gateway (operator only; retained raw rows).
      parameters:
        - {name: since, in: query, schema: {type: string, format: date-time}}
        - {name: until, in: query, schema: {type: string, format: date-time}}
      responses:
        '200':
          description: Totals by authenticated key; no prompts or credentials. Unknown token usage is not invented.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ClientUsageSummary'}
        '503': {description: Metrics disabled or unavailable.}

  /v1/metrics:
    get:
      tags: [metrics]
      operationId: getMetrics
      summary: Aggregated per-backend latency, throughput and failure counts.
      description: |
        What each backend actually did, over a window. The question this
        exists to answer is "is this backend faster than that one for
        this model **on this box**" — and the restraint that goes with
        it: these numbers describe this install only. They are not a
        benchmark and must not be presented as one.

        Grouped by (model, driver, runtime, node, backend). A group's
        throughput is computed from the latency of the attempt that
        **served** the request, never the request's total — a cascade
        whose primary timed out for 30 s before a secondary answered in
        800 ms would otherwise report the secondary as forty times
        slower than it is.

        `tokensPerSecond` is **null**, not zero, for a group whose
        backends did not report token usage. A UI that renders those the
        same way says "slow" where it means "unmeasured".

        Which backends those are is not a fixed list, and an earlier
        draft of this text claimed it was: the CLI subscription backends
        *do* report usage, parsing it out of Claude's envelope and
        Codex's `turn.completed`, and return nothing only when the CLI
        emitted none. Treat absence as a per-request fact, not a
        property of a backend kind.

        Operator-only. No component needs this, so a service token is
        refused rather than accepted for reads as elsewhere; and
        model names plus traffic volumes are not nothing on a shared
        tailnet.
      parameters:
        - name: since
          in: query
          description: |
            Start of the window, inclusive. Defaults to 24 hours ago.
            Rows older than `metricsRetentionDays` are gone, so a
            `since` beyond it returns what survived and sets
            `truncated`.
          schema:
            type: string
            format: date-time
        - name: until
          in: query
          description: End of the window, exclusive. Defaults to now.
          schema:
            type: string
            format: date-time
        - name: model
          in: query
          description: Restrict to one requested model id.
          schema:
            type: string
        - name: driver
          in: query
          description: Restrict to one inference-driver by name.
          schema:
            type: string
        - name: bucket
          in: query
          description: |
            `none` (default) returns one group per dimension tuple over
            the whole window. `hour` additionally splits each group by
            hour, which is what a history chart reads.

            Both are computed from **raw rows**, so both are bounded by
            `metricsRetentionDays`. Hourly rollups are written and kept
            past retention, but they are not served here and deliberately
            so: a rollup can carry sums and a max, and a percentile
            cannot be reconstructed from those. Serving a mean through a
            field named `p50` would be a quieter error than serving
            nothing.
          schema:
            type: string
            enum: [none, hour]
            default: none
        - name: groupBy
          in: query
          description: |
            `backend` (default) groups by the full dimension tuple
            (model, driver, runtime, node, backend) — the comparison
            table's shape. `model` collapses the backend dimensions,
            answering "how is this model doing" across replicas and
            cascades. `total` collapses everything into one group per
            bucket — the shape an overview chart or a stat tile reads.

            This parameter exists because percentiles cannot be
            recombined client-side: a caller holding per-backend groups
            can sum their `requests`, but the install-wide p90 is not
            computable from per-group p90s. The coarser grains are
            computed here over the bucket's raw rows, so their
            percentiles are real percentiles rather than a merge that
            flatters whichever group was busiest.
          schema:
            type: string
            enum: [backend, model, total]
            default: backend
      responses:
        '200':
          description: Aggregates over the window.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetricsSummary'
        '503':
          description: |
            Metrics are disabled (`metricsEnabled: false`) or the store
            could not be opened. Distinguished from an empty window,
            which is a 200 with no groups.
          content:
            application/problem+json:
              schema:
                $ref: 'components/common.yaml#/components/schemas/Problem'

  /v1/metrics/requests:
    get:
      tags: [metrics]
      operationId: getMetricRequests
      summary: Individual retained requests, newest first, with their attempts.
      description: |
        The rows behind the aggregates, for the question an aggregate
        cannot answer: what happened at 02:14. Each request carries
        every attempt it made, so a cascade is legible as one request
        and the backends it tried in order.

        Newest first, cursor-paged. Raw rows exist only within
        `metricsRetentionDays`; older traffic survives only as hourly
        rollups, which no endpoint serves yet.
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 50
        - name: cursor
          in: query
          description: |
            `nextCursor` from a previous page. Opaque; encodes the
            position rather than an offset, so a page is stable while
            new requests arrive.
          schema:
            type: string
        - name: model
          in: query
          schema:
            type: string
        - name: outcome
          in: query
          description: |
            Restrict to one outcome. `error` and `cascaded` are the two
            worth filtering for; `cascaded` means `attempts > 1`
            whether or not the request eventually succeeded.
          schema:
            type: string
            enum: [served, error, cascaded]
      responses:
        '200':
          description: One page of retained requests.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetricRequestPage'
        '503':
          description: Metrics are disabled or the store could not be opened.
          content:
            application/problem+json:
              schema:
                $ref: 'components/common.yaml#/components/schemas/Problem'

  /v1/config:
    get:
      tags: [config]
      operationId: getConfig
      summary: Read the gateway's current effective configuration.
      description: |
        Returns every config field's currently effective value. Values
        of fields with `sensitive: true` are redacted as the literal
        string `"<redacted>"`.

        The lifecycle-policy fields (M6), all editable at runtime
        through the generic editor:

        * **`modelSlots`** (`model_slots`) — the priority lists. An
          ordered list of `{model, targets}`; see
          `ConfigValueType.model_slots` for the shape and why targets
          are model ids rather than driver names.

          Names `role:<ModelRole>` are reserved for model roles, using
          `components/common.yaml#/components/schemas/ModelRole`. Their
          `targets` are the role's assigned models in configured order.
          They use the same slot resolution, fallback and refusals as
          other slots. Capability checks warn; they never block assignment.
          Other slot names retain their existing meaning. `GET /v1/roles`
          shows every role's effective list, including an empty list.

          A request for a role with no assigned model returns 404 with
          `model_not_found` and a message naming the role and where to
          assign one, for example: "No model has the role Reads pages.
          Give one that role under Routing > Model roles."
        * **`geminiModelNames`** (`model_slots`, default `[]`, label
          **Gemini model names**) — live mappings on the Gemini door.
          Each entry is a `GeminiModelNameMapping`: `{model, targets}`,
          with one Eugene model id or `role:<ModelRole>` in targets.
          A known Eugene model id is used directly. Otherwise an explicit
          name mapping wins; an unmapped name uses `role:chat` for both
          the CLI's routing classifier and its turn (R58-NAMES, default
          built). The target uses the same slot routing and failover as
          the other doors; all key scope and locality rules apply to the
          resolved models. An unassigned role is a 404 naming the role
          and where to assign it, not a guessed substitute.
          The GUI edits this field through the existing model_slots
          renderer, and GET shows the effective mappings and default
          description, never a value waiting for restart. Unknown target
          capability warns; checks never block an untested target.
        * **`conversationAffinity`** (`boolean`, default on; CB1, since
          2026-10-02) — a request that continues a conversation goes to
          the replica its earlier turns went to, because only that
          replica's engine holds its prompt in cache, unless that replica
          is saturated while another has a free slot. The conversation is
          the client's `prompt_cache_key`, Claude Code's `session_id` in
          `metadata.user_id`, or else the model, first system message and
          first user message. Measured with twelve agent sessions on three
          replicas: 80.8% of prompt tokens reused with it, 67.7% without,
          and the median first token in half the time. **Off only for
          benchmarking**, where a tool repeating one prompt would land on
          one replica every time.
        * **`loadBalancing`** (`enum`) — where a **new** conversation
          goes, whatever `conversationAffinity` says. **`spread` (the
          default since CB2, 2026-10-02)** picks the replica holding the
          fewest conversations per slot — every conversation it served
          inside the affinity table's 30 minutes, whether or not a
          request is in flight — ties to the fewest in flight, then in
          turn. Measured with 32 agent sessions on eight replicas: 80.2%
          of prompt tokens reused against 60.4%, the median first token
          1.05 s against 4.00 s, because a replica whose agents are all
          thinking between turns looks empty to a count of requests in
          flight; within noise on three replicas. `least_busy` picks the
          eligible driver with the fewest in-flight requests per slot of
          capacity, ties round-robin; `round_robin` alternates strictly,
          which is worth having when comparing two replicas. **`conversation` is no longer a value**
          (it was PC4's
          default, from 2026-10-02 until CB1 the same day, and kept
          conversations on their replicas, which affinity now does under
          every value): a file holding it, or holding the default because
          the gateway wrote it there, follows the current default, and a
          PATCH of it is refused.
        * **`swapWaitSeconds`** (`duration`) — how long a request waits
          for a `startOnDemand` runtime to reach `ready` before the next
          tier is tried. Engine-dependent: llama.cpp loads a small
          model in seconds; vLLM's silent load is minutes. **Since
          2026-10-02 (CB3) also how long a chat turn waits for room in a
          runtime's shared context.** A runtime whose agent reports
          `capabilities.contextPoolTokens` gets no more prompt tokens in
          flight than 90% of it: each turn counted as its conversation's
          last prompt tokens, plus its new text at ~3.5 characters a
          token (the whole request's, for a new conversation), plus its
          `max_tokens`. A turn that does not fit waits — on the replica
          that holds its conversation while it holds one, else on any
          replica of the tier with room — and after this long is sent
          in the usual order. A request bigger than the whole pool is
          sent at once, and the engine's own refusal is the answer.
          Measured on an 8B at 64k with four agents a replica: 158 of
          204 turns failed before, when a few prompts overflowed a pool
          and the engine's refusal was counted as a broken backend. That
          refusal (the driver's `#backend-capacity`) now cascades and is
          not counted by a backend's circuit.
        * **`idleCheckSeconds`** (`duration`) — how often the gateway
          checks each runtime's idle timeout.
        * **`controlUrl`** (`url`, optional) — the control root, when
          the gateway should not work it out itself. Unset, the gateway
          asks its own agent on every refresh: the control root the
          node is enrolled to (`GET /v1/node`), else the `control`
          component the agent declares (`GET /v1/components`), else
          this host alone. Set, it is used as given, even when wrong —
          the override for a gateway whose agent is neither enrolled
          nor running a control root, or for an address the agent
          cannot know. Takes effect on the next routing refresh.

        The retained-metrics fields (M8):

        * **`metricsEnabled`** (`boolean`, default `true`) — whether
          completions are measured at all. False skips building the
          row, not just writing it: the recording path runs on every
          request, and "small" is how the routing table came to be a
          refresh interval behind.
        * **`metricsRetentionDays`** (`integer`, default `7`) — how
          long raw per-request rows are kept. `0` keeps rollups only.
          A request plus its attempts is roughly 200 bytes, so a heavy
          install at one completion a second is about 17 MB a day.
        * **`metricsRollupEnabled`** (`boolean`, default `true`) —
          hourly aggregates, kept indefinitely because they are a few
          hundred rows a day and they are the only record that survives
          retention. Written but not yet served: they hold sums and a
          max, and no endpoint reports a percentile it cannot compute
          from those.
      responses:
        '200':
          description: Current config.
          content:
            application/json:
              schema:
                $ref: 'components/common.yaml#/components/schemas/ConfigDocument'
    patch:
      tags: [config]
      operationId: updateConfig
      summary: Partial update of the gateway's configuration.
      description: |
        Accepts a partial map of `key -> new-value` pairs. Each key is
        validated against its `ConfigField` definition. Validation
        errors are reported per-key without aborting the whole
        request — valid changes are applied, invalid ones are
        rejected and surfaced in the response.

        For `modelSlots`, a name starting with `role:` must be
        `role:<ModelRole>` from
        `components/common.yaml#/components/schemas/ModelRole`. Any other
        `role:` name (including `role:` alone) rejects the `modelSlots`
        field with the list of valid roles. Capability findings only warn
        and never block an assignment. Edits to role slots keep every other
        slot; clients save the complete list they read with their edits.

        `geminiModelNames` takes a complete list of
        `GeminiModelNameMapping` entries, using the same GUI editor as
        model_slots. Each name is unique and each targets list holds
        exactly one model or role. Invalid entries are rejected naming
        geminiModelNames and their observed cause. Valid updates take
        effect immediately. An invalid file leaves config endpoints
        reachable and GET reports the mappings actually in effect.

        Some fields require a process restart to take effect (see
        `ConfigField.requiresRestart`). The response indicates whether
        a restart is needed and which keys are queued.

        ## Auth note (v0.1)

        Same caveat as `GET /v1/config`: in v0.1, anyone on the network
        can change gateway config. Auth lands in v0.2.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: 'components/common.yaml#/components/schemas/ConfigUpdateRequest'
      responses:
        '200':
          description: Update outcome (may include per-field rejections).
          content:
            application/json:
              schema:
                $ref: 'components/common.yaml#/components/schemas/ConfigUpdateResult'
        '400':
          $ref: 'components/common.yaml#/components/responses/Problem'

  /v1/config/schema:
    get:
      tags: [config]
      operationId: getConfigSchema
      summary: UI-renderable description of every editable config field.
      description: |
        Returns a `ConfigSchema` listing every config field the
        gateway accepts, with type, default, validation hints,
        and UI metadata (label, description, category, sensitive flag,
        restart-required flag). UIs use this to render a generic
        config editor without gateway-specific code.
      responses:
        '200':
          description: Config schema.
          content:
            application/json:
              schema:
                $ref: 'components/common.yaml#/components/schemas/ConfigSchema'

  /v1/config/test:
    post:
      tags: [config]
      operationId: testConfig
      summary: Test the effective config without committing it.
      description: |
        Probes every driver the gateway can route to, hitting each
        `/v1/info`, using the saved config merged with the optional
        `overrides`. The override values are NOT persisted. Use this
        from the UI's "Test Connection" button to verify the routing
        table and timeouts before saving.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: 'components/common.yaml#/components/schemas/ConfigTestRequest'
      responses:
        '200':
          description: Test result. Returned for both success and failure cases.
          content:
            application/json:
              schema:
                $ref: 'components/common.yaml#/components/schemas/ConfigTestResult'

  /v1/info:
    get:
      tags: [meta]
      operationId: getInfo
      summary: The gateway's observed Library state and saved settings use.
      description: |
        Reports the last Library check without waiting for another one.
        A Library outage does not stop routing or running models. Saved
        profile defaults stay in effect under profileMaxStaleSeconds;
        this view counts only models whose saved defaults are in effect.
      responses:
        '200':
          description: Current observations, including an unknown state before the first check.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GatewayInfo'

  /healthz:
    get:
      tags: [meta]
      operationId: healthz
      summary: Liveness / readiness probe.
      security: []
      responses:
        '200':
          description: Healthy.
          content:
            application/json:
              schema:
                $ref: 'components/common.yaml#/components/schemas/Health'
        '503':
          description: One or more dependencies unhealthy.
          content:
            application/json:
              schema:
                $ref: 'components/common.yaml#/components/schemas/Health'

components:
  parameters:
    RepetitionMode:
      name: X-Eugene-Repetition-Mode
      in: header
      required: false
      description: |
        Override repeated-passage protection for this request: off, observe,
        or stop. Omission inherits gateway settings; the initial default is
        observe. Invalid values fail before generation. This is a gateway
        control and is never forwarded to a provider or treated as a sampler.

        Stop applies only to streaming plain-text output. Reasoning, tool
        arguments, structured output, audio and non-streamed responses remain
        observation-only. The initial detector requires a substantial passage
        of at least 100 whitespace-normalized characters, repeated four times;
        it has a bounded window, not a universal output-token cap.

        A stop closes the upstream stream, preserves already-delivered output,
        and never retries on another backend. Chat and Completions emit an SSE
        error with type and code repetition_detected, then [DONE], without a
        success finish_reason. Responses emits response.failed with
        invalid_prompt to prevent retrying clients replaying the loop;
        Messages emits an invalid_request_error. All name repetition in their
        human-readable message. Time and token limits remain independent.
        Use off for intentional repeated passages.
      schema:
        type: string
        enum: ['off', observe, stop]

  securitySchemes:
    geminiApiKeyAuth:
      type: apiKey
      in: header
      name: x-goog-api-key
      description: |-
        An Eugene client key, checked as bearerAuth on the Gemini front-door routes and model reads
        only. Never grants access to config or admin routes. When multiple credential forms are
        supplied they must agree; mismatches are refused naming the conflicting headers without
        echoing secrets.
    geminiQueryKeyAuth:
      type: apiKey
      in: query
      name: key
      description: |-
        The same Eugene client key as x-goog-api-key or bearerAuth. Its value is redacted from every
        log, trace, error and metrics record, including access logs and failures before routing.
        Never persisted or forwarded to an inference driver. Accepted only on Gemini front-door
        routes and model reads.

    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: |
        Bearer token issued by the agent. Operator sessions come from
        `POST /v1/auth/login`; component-internal calls use service
        tokens threaded to spawned children via env var at startup; and
        an outside app uses a **client key** from
        `POST /v1/auth/client-keys`, which this gateway accepts on the
        front-door paths and refuses everywhere else. See
        "Client keys, on the front door only" above.

        On `POST /v1/messages` the same token may arrive as `x-api-key`
        instead -- see `apiKeyAuth` -- and a refusal there is **403, not
        401**, because a 401 is retried without bound by the client that
        door exists for.

    apiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key
      description: |
        The same tokens as `bearerAuth`, in the header an Anthropic
        client sends. Accepted on `POST /v1/messages` and nowhere else.

        Measured against Claude Code 2.1.207: `ANTHROPIC_API_KEY`
        produces this header and **no `Authorization` header at all**,
        while `ANTHROPIC_AUTH_TOKEN` produces `Authorization: Bearer`
        and no `x-api-key`. They are alternatives, never both, so a
        door reading only one of them sees no credential rather than
        the wrong one.

  schemas:
    GatewayInfo:
      type: object
      description: The gateway's observed Library state and use of saved model settings.
      required:
        - library
      properties:
        library:
          $ref: '#/components/schemas/GatewayLibraryStatus'

    GatewayLibraryStatus:
      type: object
      description: |
        Library reachability observed by profile and special-token reads.
        Loading saved caches after a restart does not establish whether
        the Library can answer. A successful Library answer clears the
        outage time and cause, including an answer with no profile.
      required:
        - reachable
        - since
        - cause
        - modelsOnSavedSettings
      properties:
        reachable:
          type: [boolean, 'null']
          description: |
            True after a successful Library answer. False after a
            transport error, a proxy 502/503/504, or a timeout. Null
            before the first check, including after a gateway restart.
        since:
          type: [string, 'null']
          format: date-time
          description: |
            When the current outage was first observed, in UTC. Further
            failed checks keep this time. Null while reachable or before
            the first check.
        cause:
          type: [string, 'null']
          description: |
            The latest observed cause of the failed Library check, such
            as connection refused, proxy HTTP 502/503/504, or a timeout.
            Null while reachable or before the first check.
        modelsOnSavedSettings:
          type: integer
          minimum: 0
          description: |
            Number of distinct model paths currently using saved profile
            defaults after cache expiry, including values loaded after a restart.
            Counts each path once. Excludes fresh profiles, saved values
            that are not in effect, and values excluded by an explicit
            profileMaxStaleSeconds limit.

    GeminiGenerateContentRequest:
      type: object
      description: |-
        Native Gemini request translated onto the shared chat path. Unsupported settings are refused
        by field name. Untested capabilities are attempted rather than blocked by an unmeasured
        allowlist.
      required:
      - contents
      properties:
        contents:
          type: array
          items:
            $ref: '#/components/schemas/GeminiContent'
          minItems: 1
        systemInstruction:
          $ref: '#/components/schemas/GeminiContent'
        tools:
          type: array
          items:
            $ref: '#/components/schemas/GeminiTool'
        toolConfig:
          type: object
          properties:
            functionCallingConfig:
              $ref: '#/components/schemas/GeminiFunctionCallingConfig'
        generationConfig:
          $ref: '#/components/schemas/GeminiGenerationConfig'
        safetySettings:
          type: array
          items:
            type: object
            properties:
              category:
                type: string
              threshold:
                type: string
          description: Accepted; named as ignored because no local safety filter runs.
        model:
          type: string
          description: |-
            Used inside countTokens.generateContentRequest only. When present it must resolve to the
            same model as the URL; a mismatch is a 400 naming generateContentRequest.model.
    GeminiContent:
      type: object
      required:
      - parts
      properties:
        role:
          type: string
          description: Omitted for systemInstruction; otherwise defaults to user.
          enum:
          - user
          - model
        parts:
          type: array
          items:
            $ref: '#/components/schemas/GeminiPart'
          minItems: 1
    GeminiPart:
      type: object
      description: |-
        Text, inline image/audio/PDF, function call or result. Existing attachment size and MIME
        limits apply. Backend reasoning returns as text with thought true only when requested.
      properties:
        text:
          type: string
        inlineData:
          type: object
          required:
          - mimeType
          - data
          properties:
            mimeType:
              type: string
            data:
              type: string
              contentEncoding: base64
        functionCall:
          type: object
          required:
          - name
          - args
          properties:
            id:
              type: string
              description: Preserved when supplied; otherwise the shared path assigns one.
            name:
              type: string
            args:
              type: object
              additionalProperties: true
        functionResponse:
          type: object
          description: |-
            Matched to the preceding call by id, or by name in call order when ids are absent. An
            ambiguous or missing call is a 400 naming functionResponse; its content is never lost.
          required:
          - name
          - response
          properties:
            id:
              type: string
            name:
              type: string
            response:
              type: object
              additionalProperties: true
        thought:
          type: boolean
        thoughtSignature:
          type: string
          description: |-
            Opaque client data, never invented by the door. The Gemini provider retains its own
            required signatures on the shared path (G2).
    GeminiTool:
      type: object
      properties:
        functionDeclarations:
          type: array
          items:
            $ref: '#/components/schemas/GeminiFunctionDeclaration'
        googleSearch:
          type: object
          description: |-
            Runs the hub's web search through web_search_options, with the same key tool/locality
            limits and observed-cause refusals.
          additionalProperties: true
    GeminiFunctionDeclaration:
      type: object
      required:
      - name
      properties:
        name:
          type: string
        description:
          type: string
        parameters:
          type: object
          additionalProperties: true
          description: Gemini schema form, translated to the shared function schema.
        parametersJsonSchema:
          description: JSON Schema form used by Gemini CLI; mutually exclusive with parameters.
        parameters_json_schema:
          description: |-
            Measured google-genai dictionary spelling of parametersJsonSchema. Same translation;
            conflicting spellings are refused naming the field.

    GeminiFunctionCallingConfig:
      type: object
      properties:
        mode:
          type: string
          description: Maps to tool_choice auto, required or none.
          enum:
          - AUTO
          - ANY
          - NONE
        allowedFunctionNames:
          type: array
          items:
            type: string
          description: |-
            Restricts declarations offered to the shared path. A single name in ANY selects that
            function. Unknown names are a 400 naming allowedFunctionNames.
    GeminiGenerationConfig:
      type: object
      properties:
        temperature:
          type: number
        topP:
          type: number
          minimum: 0
          maximum: 1
        topK:
          type: integer
          minimum: 0
        maxOutputTokens:
          type: integer
          minimum: 1
        stopSequences:
          type: array
          items:
            type: string
        seed:
          type: integer
        candidateCount:
          type: integer
          minimum: 1
          description: Only one candidate; larger values are refused naming candidateCount.
          maximum: 1
        responseMimeType:
          type: string
          description: text/plain or application/json; other types are refused naming this field.
        responseSchema:
          type: object
          additionalProperties: true
          description: Gemini schema form; used with application/json for structured output.
        responseJsonSchema:
          description: JSON Schema form; mutually exclusive with responseSchema.
        thinkingConfig:
          $ref: '#/components/schemas/GeminiThinkingConfig'
    GeminiThinkingConfig:
      type: object
      description: |-
        thinkingLevel LOW, MEDIUM, HIGH maps to reasoning_effort low, medium, high (case
        insensitive). thinkingBudget maps 0 to none, 1..1024 to low, 1025..8192 to medium, larger
        values to high; -1 leaves the backend default. An exact positive budget is not promised:
        thinkingConfig.thinkingBudget is named in ignored-settings when reduced to effort. A level
        and budget together are a 400 naming thinkingConfig. includeThoughts controls returning
        thought parts independently of effort; omitted means false. Unsupported effort is refused
        with the backend's observed cause, never guessed from a name.
      properties:
        thinkingLevel:
          type: string
        thinkingBudget:
          type: integer
          minimum: -1
        includeThoughts:
          type: boolean
          default: false
        thinking_level:
          type: string
          description: |-
            Measured google-genai dictionary spelling of thinkingLevel; conflicting spellings are
            refused naming the field.
        thinking_budget:
          type: integer
          minimum: -1
          description: |-
            Measured google-genai dictionary spelling of thinkingBudget; conflicting spellings are
            refused naming the field.
        include_thoughts:
          type: boolean
          description: |-
            Measured google-genai dictionary spelling of includeThoughts; conflicting spellings are
            refused naming the field.

    GeminiStreamGenerateContentResponse:
      type: object
      description: |-
        One SSE data object. Each frame carries Gemini response fields as available; text and tool
        parts are deltas, usageMetadata may arrive only at the end, and finishReason appears only
        when observed. No synthetic usage or finish reason.
      properties:
        candidates:
          type: array
          items:
            $ref: '#/components/schemas/GeminiCandidate'
          maxItems: 1
        usageMetadata:
          $ref: '#/components/schemas/GeminiUsageMetadata'
        modelVersion:
          type: string
          description: The Eugene model id that actually answered, after role routing and failover.
        responseId:
          type: string

    GeminiGenerateContentResponse:
      type: object
      description: |-
        A complete answer. SSE uses the same fields but may omit candidates in a usage-only frame
        and usageMetadata until the final frame. Required fields here apply to a complete
        non-streamed response.
      required:
      - candidates
      - usageMetadata
      - modelVersion
      properties:
        candidates:
          type: array
          items:
            $ref: '#/components/schemas/GeminiCandidate'
          maxItems: 1
        usageMetadata:
          $ref: '#/components/schemas/GeminiUsageMetadata'
        modelVersion:
          type: string
          description: The Eugene model id that actually answered, after role routing and failover.
        responseId:
          type: string
    GeminiCandidate:
      type: object
      properties:
        index:
          type: integer
          minimum: 0
          const: 0
        content:
          $ref: '#/components/schemas/GeminiContent'
        finishReason:
          type: string
          description: |-
            STOP for stop or tool calls, MAX_TOKENS for length, SAFETY only for observed
            content_filter. Never invent a safety refusal.
          enum:
          - STOP
          - MAX_TOKENS
          - SAFETY
    GeminiUsageMetadata:
      type: object
      description: |-
        Counts from the shared path; omit unavailable counts rather than invent them.
        candidatesTokenCount excludes thoughtsTokenCount; totalTokenCount includes prompt, candidate
        and thought tokens, with cachedContentTokenCount already included in promptTokenCount.
      properties:
        promptTokenCount:
          type: integer
          minimum: 0
        candidatesTokenCount:
          type: integer
          minimum: 0
        totalTokenCount:
          type: integer
          minimum: 0
        thoughtsTokenCount:
          type: integer
          minimum: 0
        cachedContentTokenCount:
          type: integer
          minimum: 0
    GeminiCountTokensRequest:
      type: object
      description: |-
        Either contents or a full generateContentRequest including system instructions and tools,
        never both. The SDK sends contents for an ordinary count_tokens call.
      properties:
        contents:
          type: array
          items:
            $ref: '#/components/schemas/GeminiContent'
          minItems: 1
        generateContentRequest:
          $ref: '#/components/schemas/GeminiGenerateContentRequest'
      oneOf:
      - required:
        - contents
        not:
          required:
          - generateContentRequest
      - required:
        - generateContentRequest
        not:
          required:
          - contents
    GeminiCountTokensResponse:
      type: object
      required:
      - totalTokens
      properties:
        totalTokens:
          type: integer
          minimum: 0
        cachedContentTokenCount:
          type: integer
          minimum: 0
    GeminiListModelsResponse:
      type: object
      required:
      - models
      properties:
        models:
          type: array
          items:
            $ref: '#/components/schemas/GeminiModel'
        nextPageToken:
          type: string
          description: Omitted on the last page, so SDK iteration terminates.
    GeminiModel:
      type: object
      required:
      - name
      - supportedGenerationMethods
      properties:
        name:
          type: string
          description: models/<Eugene id or configured Gemini alias>; slashes in ids are preserved.
        version:
          type: string
        displayName:
          type: string
        description:
          type: string
        inputTokenLimit:
          type: integer
          minimum: 1
          description: Effective reported input limit; omitted when unknown, never guessed.
        outputTokenLimit:
          type: integer
          minimum: 1
          description: Effective reported output limit; omitted when unknown, never guessed.
        supportedGenerationMethods:
          type: array
          items:
            type: string
          description: |-
            Door methods the serving path reports, such as generateContent, streamGenerateContent
            and countTokens. Unknown capability is not a refusal; requests may still try it.
    GeminiModelNameMapping:
      type: object
      description: |-
        One geminiModelNames entry using the existing model_slots config renderer. model is the
        requested Gemini name without models/; targets holds one Eugene model id or
        role:<ModelRole>. A role uses its existing slot and failover. No capability allowlist blocks
        an untested target. Duplicate names and empty targets are rejected by field name; a bad file
        keeps config endpoints reachable.
      required:
      - model
      - targets
      properties:
        model:
          type: string
          minLength: 1
        targets:
          type: array
          items:
            type: string
            minLength: 1
          minItems: 1
          maxItems: 1
    GeminiErrorResponse:
      type: object
      required:
      - error
      properties:
        error:
          type: object
          required:
          - code
          - message
          - status
          properties:
            code:
              type: integer
              minimum: 0
              description: HTTP status code.
            message:
              type: string
              description: |-
                Names the field or model and the observed cause. Upstream credentials are identified
                as the backend's, not the caller's. No query key or other secret appears here.
            status:
              type: string
              description: |-
                Google's status word: INVALID_ARGUMENT (400), UNAUTHENTICATED (401),
                PERMISSION_DENIED (403), NOT_FOUND (404), RESOURCE_EXHAUSTED (429), CANCELLED (499),
                INTERNAL (502), UNAVAILABLE (503), DEADLINE_EXCEEDED (504).

    WebSearchRequest:
      type: object
      additionalProperties: false
      required: [query]
      properties:
        query:
          type: string
          minLength: 1
          maxLength: 2000
        count:
          type: integer
          minimum: 1
          maximum: 20
          description: |
            Upper bound on the returned list. Does not raise or replace
            the search account's own result count. Omitted, the account's
            count applies, capped at 20.

    WebSearchResult:
      type: object
      additionalProperties: false
      required: [link, title, snippet]
      properties:
        link:
          type: string
          format: uri
          description: The result's address.
        title:
          type: string
        snippet:
          type: string
          description: The search provider's excerpt; no result page is fetched.

    RuntimeSwitchRequest:
      type: object
      required: [source, target]
      properties:
        node:
          type: string
          description: Node name; absent for the gateway's local node.
        source:
          type: string
          minLength: 1
        target:
          type: string
          minLength: 1
    DriverProbeRequest:
      type: object
      description: |
        Request body for `POST /v1/admin/drivers/probe`. Tests a single
        backend URL without persisting it. A driver slot in the
        gateway's `drivers` config may name several backends, as
        topology entry names; the UI resolves each to a URL and probes
        them separately so an operator can verify every fallback before
        saving.
      required:
        - url
      properties:
        url:
          type: string
          format: uri
          description: The single backend base URL to test-connect.
        name:
          type: string
          description: |
            Optional slot label, echoed into diagnostics. Not required
            to probe; the operator may be testing a URL before naming
            the slot.

    DriversInfo:
      type: object
      required:
        - drivers
      properties:
        drivers:
          type: array
          description: |
            Per-driver health snapshot, ordered as the gateway's
            `drivers` config declared them.
          items:
            $ref: '#/components/schemas/DriverHealth'

    DriverHealth:
      type: object
      description: |
        What the gateway sees from one inference-driver's `/v1/info`,
        plus the gateway-side reachability status and the
        operator-supplied `name`.
      required:
        - name
        - reachable
      properties:
        name:
          type: string
          description: |
            Operator-supplied driver name from the gateway's
            `drivers` config. UI uses this as the tab/column label.
        reachable:
          type: boolean
        url:
          type: string
          format: uri
          description: How the gateway reaches this driver.
        backend:
          $ref: 'components/common.yaml#/components/schemas/BackendKind'
        node:
          type:
            - string
            - 'null'
          description: |
            The machine this driver runs on, as the agent that declares
            it names it. Null on a standalone install whose agent has no
            node name yet.
        modelId:
          type: string
          description: |
            The one model a single-model driver serves, as published.
            Absent for an account (see `account`) and for a driver
            serving nothing yet.
        modelCount:
          type: integer
          minimum: 0
          description: |
            How many models this driver serves (`DriverInfo.models`).
            One for a single-model driver; hundreds for an aggregator
            account.
        account:
          type: boolean
          description: |
            True when the driver is a provider account, whose models are
            published as `<name>/<model id>`.
        catalogueRefreshedAt:
          type:
            - string
            - 'null'
          format: date-time
          description: When the account's model list in force was read.
        catalogueError:
          type:
            - string
            - 'null'
          description: |
            Why the account's most recent catalogue read failed, in the
            backend's words. The previous list stays in force.
        runtime:
          type: string
          description: |
            The supervised engine runtime this driver follows, straight
            off its `/v1/info`. Absent for a backend that is not a
            runtime this install supervises.

            Carried up because it answers the one question this panel
            could not previously answer: a driver that is reachable but
            serves nothing, next to a runtime that is `ready` and
            routed to by nobody, is the visible shape of a
            mis-wired install.
        version:
          type: string
        error:
          type: string
          description: |
            Why the gateway routes nothing to this driver, in words:
            populated when `reachable: false` (never empty: a timeout
            says so, with the address and port), and when the driver
            answered but is degraded (its `/v1/info` `degraded`).

    # -------- Model roles --------

    ModelRoleList:
      type: object
      required: [roles]
      properties:
        roles:
          type: array
          description: Every ModelRole in enum order, including roles with no assigned models.
          items:
            $ref: '#/components/schemas/ModelRoleDefinition'

    ModelRoleDefinition:
      type: object
      required: [role, label, requiredCapability, models]
      properties:
        role:
          $ref: 'components/common.yaml#/components/schemas/ModelRole'
        label:
          type: string
          description: The role's display label, as listed in the /v1/roles example.
        requiredCapability:
          $ref: '#/components/schemas/ModelRoleCapability'
        models:
          type: array
          description: |
            Models from the effective role slot's targets in configured
            order, including models with negative or unknown capability
            findings. An unassigned role has an empty list.
          items:
            $ref: '#/components/schemas/ModelRoleModel'

    ModelRoleCapability:
      type: string
      enum: [chat, toolCalling, imageInput, image, transcription, speech, audioOutput, embeddings, rerank, decision]
      description: |
        The capability a role needs, using the driver's capability or
        surface names. `chat` needs chat; `agentic` needs chat with
        `toolCalling`; `vision` and `reads-pages` need chat with
        `imageInput`; `image` needs image generation; `speech-to-text`
        needs transcription; `text-to-speech` needs speech; `music`
        needs audio generation (`audioOutput`); `embeddings` needs
        embeddings; `rerank` needs rerank; `decision` needs a decision
        backend. These findings advise the owner, never gate assignment.

    ModelRoleModel:
      type: object
      required: [model, capability, reason]
      properties:
        model:
          type: string
          description: The assigned model id, as stored in the role slot's targets.
        capability:
          $ref: '#/components/schemas/ModelRoleCapabilityStatus'
        reason:
          type: [string, 'null']
          description: |
            Null for `yes`. For `no`, the observed cause: a backend's
            refusal or an explicit capability listing, in words. For
            `unknown`, why the capability could not be established,
            such as an unreachable driver or a listing that does not say.
            An untested capability alone is never reported as `no`.

    ModelRoleCapabilityStatus:
      type: string
      enum: ['yes', 'no', unknown]
      description: |
        `yes` means the required capability is supported; `no` means
        evidence says it is not; `unknown` means it has not been
        established. All three allow the owner to assign the role.

    ModelRoleInfo:
      type: object
      required: [role, label]
      description: The role represented by a role:<name> model-list entry.
      properties:
        role:
          $ref: 'components/common.yaml#/components/schemas/ModelRole'
        label:
          type: string
          description: The same display label returned by /v1/roles.

    # -------- OpenAI-compatible wire schemas --------
    #
    # snake_case throughout, unlike the rest of Eugene Plexus. See the
    # note above `/v1/models` in `paths` for why.

    ModelList:
      type: object
      required:
      - object
      - data
      - models
      properties:
        object:
          type: string
          const: list
        data:
          type: array
          items:
            $ref: '#/components/schemas/Model'
        x_eugene_plexus:
          $ref: '#/components/schemas/ModelListInfo'
        models:
          type: array
          items:
            $ref: '#/components/schemas/GeminiModel'
          description: Gemini projection of this same page; existing OpenAI clients continue reading data.
        nextPageToken:
          type: string
          description: Opaque token for the next page; omitted on the last page.

    ModelListInfo:
      type: object
      description: |
        Namespaced extension: what this install can do for this caller
        beyond any one model. OpenAI clients ignore it.

        Added 2026-10-01 (C3, `workbench-v1.md` §3). Before it a client
        could learn whether a search would run only by sending one: the
        chat door's 400 was the first word, so a switch offering *Search
        the web* could not say beforehand that it would fail, or why.
      properties:
        web_search:
          $ref: '#/components/schemas/WebSearchAvailability'

    WebSearchAvailability:
      type: object
      required:
        - available
      description: |
        Whether a web search (P8, "Server-run tools") can run for **this
        key** on **this install**: a reachable search account runs
        `web_search`, the key's `allowedTools` permits it, and the key is
        not `localOnly`. Which models it can reach is each model's own
        `x_eugene_plexus.web_search`; a client offering a search needs
        both.
      properties:
        available:
          type: boolean
        reason:
          type:
            - string
            - 'null'
          description: |
            Why not, in the words a refused request would carry -- e.g.
            *no search account is set up; add one under Backends, then
            Add a search account*. Null when `available` is true.

    Model:
      type: object
      description: |
        One routable model, in OpenAI's shape plus one namespaced
        extension. Unknown fields are ignored by OpenAI clients, which
        is what makes it safe to answer "which of my backends is behind
        this name" without breaking compatibility.

        Gemini clients read name, displayName, supportedGenerationMethods and known token limits;
        OpenAI clients retain id, object and the namespaced extension.
      required:
      - id
      - object
      - name
      - supportedGenerationMethods
      properties:
        id:
          type: string
          description: |
            What the client puts in `ChatCompletionRequest.model`. For a
            local runtime this is its `modelAlias`, which defaults to
            the model's own filename — so the name a user sees is the
            name of the file they downloaded. For a provider account
            it is `<driver name>/<the provider's id>`
            (`openrouter/anthropic/claude-opus-5.5`, `ollama/qwen3:8b`),
            so two accounts never collide and one model through two
            providers stays two ids.

            An assigned model role is listed as `role:<ModelRole>`, with
            its role and label in `x_eugene_plexus.role`. It resolves
            through the role's model slot.

            Listed only when a door serves one of the model's surfaces
            (P1-4): an account's speech, image, video and transcription
            models appear as their doors are built, under the ids they
            already have.
        object:
          type: string
          const: model
        created:
          type: integer
          description: Unix timestamp. Model file mtime for local models.
        owned_by:
          type: string
          description: |
            OpenAI sends an organisation here. We send `local` only when
            every backend reports local inference, otherwise the provider
            key when there is one, `mixed` for multiple providers, or
            `unknown` when no provider or local inference is confirmed.
        x_eugene_plexus:
          $ref: '#/components/schemas/ModelRoutingInfo'
        name:
          type: string
          description: models/<Eugene id or configured Gemini alias>; slashes in ids are preserved.
        version:
          type: string
        displayName:
          type: string
        inputTokenLimit:
          type: integer
          minimum: 1
          description: Effective reported input limit; omitted when unknown, never guessed.
        outputTokenLimit:
          type: integer
          minimum: 1
          description: Effective reported output limit; omitted when unknown, never guessed.
        supportedGenerationMethods:
          type: array
          items:
            type: string
          description: |-
            Door methods the serving path reports, such as generateContent, streamGenerateContent
            and countTokens. Unknown capability is not a refusal; requests may still try it.

    ModelRoutingInfo:
      type: object
      description: |
        Namespaced extension: how this install serves the model. Present
        so the UI can render the routing table straight off the standard
        endpoint instead of needing a parallel admin call, and so an
        operator can see that a name is backed by two replicas.
      properties:
        role:
          $ref: '#/components/schemas/ModelRoleInfo'
          description: Present on role:<name> entries only; absent on ordinary model entries.
        drivers:
          type: array
          items:
            type: string
          description: Names of the inference-drivers currently serving this model.
        backends:
          type: array
          items:
            $ref: 'components/common.yaml#/components/schemas/BackendKind'
          description: Distinct wire protocols behind this model.
        context_length:
          type: integer
          description: |
            Smallest context window among the serving backends — the
            honest number, since a request may land on any of them.
        surfaces:
          type: array
          items:
            type: string
            enum: [chat, embeddings, decisions, speech, transcription, translation, image, video, moderation, completion, rerank]
          description: |
            Which surfaces this model can be sent to. `decisions` means
            `POST /v1/systemone`; a decision-only model lists nothing
            else, and a chat request naming it is refused with the
            door's name. `speech` means `POST /v1/audio/speech` (P3a),
            `transcription` `POST /v1/audio/transcriptions` (P3b),
            `translation` `POST /v1/audio/translations` (P3-4), `image`
            `POST /v1/images/generations` and `/edits` (P4), `video`
            `POST /v1/videos` (P5), `moderation` `POST /v1/moderations`
            (P6), `completion` `POST /v1/completions` (P6), `rerank`
            `POST /v1/rerank` (MR6).

            OpenAI's own `/v1/models` does not say, which is why every
            RAG front-end makes you pick an embedding model from a
            dropdown of everything and discover your mistake as an
            error. This install knows, because the driver determines it
            from the backend, so it says.

            **Embeddings and chat are disjoint on every engine measured.**
            An Ollama runner started for chat refuses to embed and
            `nomic-embed-text` refuses to chat. A `llama-server` started
            with `--embedding` answers `/v1/chat/completions` and
            `/v1/completions` with a 500, and one started without it
            answers `/v1/embeddings` with a 501 naming the flag (builds
            b10948 and b11552, measured 2026-10-11). So a single-model
            driver reports `embeddings` or `chat`, never both. Until
            2026-10-11 this text said `llama-server --embedding` "still
            serves chat perfectly well". That was recorded on 2026-09-12
            and had stopped reproducing by 2026-09-16 (b10948). The
            surfaces are a list for other reasons: a chat model also
            carries `completion` where a local engine continues raw text
            and `transcription` where its projector hears, and an
            account's image-and-text model carries `image` beside `chat`.

            **Eugene starts a llama.cpp model as an embedder when the file
            is one (MR3, 2026-10-11).** The agent's adapter reads the
            GGUF header, or takes the runtime's `mode`
            (`RuntimeSpec.mode`), and adds `--embeddings` itself, so an
            embedding model started from the Library is listed here as
            `embeddings` and not `chat`. Until then this text said that
            nothing did: the adapter passed the model, host, port and
            alias, the profile's curated flags and its extra arguments,
            and an embedding model answered neither surface (501 on
            `/v1/embeddings`, 500 on chat, both measured on b10948 and
            b11552) and was listed here as `chat`.

            **A reranker is listed as `rerank` (MR6, 2026-10-12)**, and
            nothing else: its driver asks it to rerank before it asks
            anything else, and a reranker answers neither chat nor
            embeddings. Until then there was no `rerank` surface or door,
            and a reranker was listed as `chat`.

            Empty means nothing serving this model would admit to either
            surface, which is a backend that could not be reached rather
            than a model that does nothing.
        image_input:
          type: boolean
          description: |
            At least one backend confirms image input for its loaded model.
            Image requests route only to those backends, including fallback.
            Inline PNG/JPEG only; see MessageContent for request limits.
        audio_input:
          type: boolean
          description: |
            At least one backend confirms audio input for this model. A
            request carrying `input_audio` routes only to those backends,
            including fallback. Added 2026-09-28 (P2).
        fill_in_middle:
          type: boolean
          description: |
            At least one backend fills in the middle for this model (P6): a
            `/v1/completions` request with `suffix` routes only to those
            backends, including fallback.
        file_input:
          type: boolean
          description: |
            At least one backend confirms file (PDF) input for this
            model, with the same routing rule. Added 2026-09-28 (P2).
        voices:
          type: array
          items:
            type: string
          description: |
            For a `speech` model: the voices its provider lists, in the
            provider's own ids (P3a). Absent when the provider does not say,
            which is not the same as having none -- any voice is passed
            through and an unknown one is the provider's 400 (P3-3).

            **When every backend that would speak the request lists its
            voices, a voice none of them lists is refused before anything
            is sent** (400, `param: voice`), naming the listed ones: a
            provider's own refusal named nothing (OpenRouter: *"Provider
            returned 400"*, measured 2026-10-08). OpenAI's TTS models list
            the voices measured for their family that day. Added
            2026-10-08 (Workbench media screens, M10).
        voice_names:
          type: object
          additionalProperties:
            type: string
          description: |
            For a `speech` model: a display name for each voice in
            `voices` that its provider names, keyed by the voice's id
            (ElevenLabs: `21m00Tcm4TlvDq8ikWAM` is *Rachel*), from the
            backends that list `voices`. A request still sends the id; a
            voice with no name here is shown by its id. Absent when no
            backend names any. Added 2026-10-08 (Workbench media screens:
            ElevenLabs voices showed as ids).
        speech_formats:
          type: array
          items:
            $ref: './components/common.yaml#/components/schemas/SpeechFormat'
          description: |
            For a `speech` model: the formats every backend serving it can
            give, `wav` included where it is made from `pcm`.
        image_streaming:
          type: boolean
          description: |
            For an `image` model: at least one backend streams partial
            images. A request with `stream: true` routes only to those
            (P4-3).
        image_edits:
          type: boolean
          description: |
            For an `image` model: at least one backend takes reference
            images, so `/v1/images/edits` can reach it.
        image_mask:
          type: boolean
          description: |
            For an `image` model: at least one backend honours `mask`
            (OpenAI's API only, measured).
        image_max_images:
          type: integer
          minimum: 1
          description: |
            For an `image` model: the largest `n` a request may ask for,
            across the backends serving it. Null when any of them checks
            `n` itself (an OpenAI account's, whose API lists nothing per
            model), which is not the same as no limit: the backend's own
            refusal is relayed. A larger `n` is refused before anything
            is sent. Added 2026-10-08 (Workbench media screens, so a form
            can offer what the gateway would take).
        image_qualities:
          type: array
          items:
            type: string
          description: |
            For an `image` model: the `quality` values its backends take.
            Null when any backend checks `quality` itself; empty when none
            takes one. `auto` is always taken. Added 2026-10-08.
        image_backgrounds:
          type: array
          items:
            type: string
          description: For an `image` model, the `background` values taken, with the same null and empty as `image_qualities`. Added 2026-10-08.
        image_output_formats:
          type: array
          items:
            type: string
          description: For an `image` model, the `output_format` values taken, with the same null and empty as `image_qualities`. Added 2026-10-08.
        image_min_references:
          type: integer
          minimum: 0
          description: |
            For an `image` model: the fewest reference images some backend
            serving it needs. 1 for a model that only edits; 0 when one
            makes images from a prompt alone. Added 2026-10-08.
        image_max_references:
          type: integer
          minimum: 0
          description: |
            For an `image` model: the most reference images some backend
            serving it takes; 0 cannot edit. Null when any backend checks
            the count itself. Added 2026-10-08.
        locality:
          $ref: '#/components/schemas/ModelLocality'
        video_durations:
          type: array
          items:
            type: integer
          description: For a `video` model, the whole seconds its backends list (P5).
        video_sizes:
          type: array
          items:
            type: string
          description: For a `video` model, the sizes its backends list.
        video_first_frame:
          type: boolean
          description: For a `video` model, at least one backend takes an `input_reference`.
        video_prices:
          type: array
          items:
            $ref: '#/components/schemas/VideoPrice'
          description: |
            For a `video` model: the provider's price list, as its driver
            reads it (OpenRouter's `pricing_skus`), so a client can say
            what a job will cost before it sends one. **Listed only when
            every backend serving the model lists the same prices**: a
            request may land on any of them. Absent when none is listed
            or they differ, which a client says as *no price listed*,
            never as free. Added 2026-10-08 (Workbench media screens,
            §6.4).

            **A request's price** is its seconds times the `second` line
            that applies, plus each input image (a first frame) times the
            `input_image` line, and at least the `minimum` line. The
            `second` line that applies is one whose `sizes` holds the
            size sent; failing that, one with no `resolution`. Lines that
            still differ only by `audio` (whether sound is added is the
            provider's default) or are left open by an unsent size give a
            range, not one figure. A line whose `first_frame` disagrees
            with the request does not apply.
        audio_output:
          type: boolean
          description: |
            At least one backend confirms this model answers with audio.
            A request with `modalities` including `audio` routes only to
            those backends, including fallback. Added 2026-09-28 (P2b).
        tool_calling:
          type: boolean
          description: |
            Whether a request for this model may carry `tools`.

            **True only when every backend serving it can**, by the same
            reasoning as `context_length` above: a request may land on
            any of them, so the honest answer is the weakest one. A
            harness can read this and pick a model rather than discover
            the limit as a 400 halfway through a task.

            A chat model's backend whose driver does not say counts as
            one that can (2026-10-12, `docs/design/tools-assumed.md`):
            tools are assumed, and turned off only on evidence the
            driver reports (`capabilities.toolCalling: false`). A model
            that does not chat (embeddings, rerank, speech) is not one
            that calls tools, and a request sending it tools is refused
            for what it is, in the door's words for a model on the wrong
            door. The tools that come with a request that carries tools
            (`tool_choice`, `parallel_tool_calls`) are admitted for such a
            backend whatever its `supportedSettings` says, since a driver
            that reports nothing is not a no.
        web_search:
          type: boolean
          description: |
            Whether a web search can reach this model: at least one
            backend serving it searches itself (its model lists
            `webSearchOptions`) or calls tools, so the gateway can run the
            search for it. Says nothing about the caller's key or whether
            the install has a search account; that is
            `ModelList.x_eugene_plexus.web_search`. Added 2026-10-01 (C3).
            A backend whose driver does not say whether it calls tools
            counts as one that does (2026-10-12).
        tiers:
          type: array
          items:
            type: array
            items:
              type: string
          description: |
            The slot's tiers in priority order, each the driver names
            in it. One tier for an unconfigured model; more when a
            `modelSlots` entry adds targets.

            **An empty tier is kept.** Its index is the `tier` a
            completion reports, so dropping one renumbers every tier
            after it and a fallback comes back claiming to be the
            primary. A configured target with nothing serving it reads
            as `[]` here, which is also the diagnosis an operator
            wants: *you asked for `local-8b` and nothing serves it*.
            (This said "empty tiers are omitted" until 2026-09-19; it
            had been untrue since the 2026-09-10 fix that made it so.)

            The one tier that can be **absent** is the slot's own name,
            which is implicit rather than something the operator listed.
            It is there whenever any node in the install declares a
            runtime under that name — a primary that is merely down is
            still a primary — and gone for a purely virtual alias, where
            keeping it would renumber the operator's own targets.
        ready_backends:
          type: integer
          minimum: 0
          description: |
            How many of those drivers can take a request right now — a
            reachable driver whose runtime is `ready`, or that follows
            no runtime. Zero with the model still listed means every
            runtime behind it is asleep and at least one will wake on
            demand.
        on_demand:
          type: boolean
          description: |
            True when a request for this model may have to wait for a
            runtime to start — every eligible backend is `stopped` and
            at least one declared `startOnDemand`.

    VideoPriceUnit:
      type: string
      enum: [second, input_image, minimum]
      description: |
        What one unit of a `VideoPrice` is: a second of video made, one
        image sent in (a first frame), or the least a job is billed.

    VideoPrice:
      type: object
      additionalProperties: false
      required: [sku, per, usd]
      description: |
        One line of a video model's price list, in US dollars. Only lines
        that price what a request asks for are carried: a second of
        output, an input image, a job's minimum. Lines in units a request
        cannot be counted in (video tokens, megapixel-seconds, a
        continuation of a video sent in) are left out.
      properties:
        sku:
          type: string
          description: The provider's own name for the line (`cents_per_video_output_second_480p`).
        per:
          $ref: '#/components/schemas/VideoPriceUnit'
        usd:
          type: number
          minimum: 0
          description: Dollars per unit; a price listed in cents is divided by 100.
        resolution:
          type: string
          description: |
            The provider's resolution class (`480p`, `720p`, `1080p`, `2K`,
            `4K`). Absent: the line holds at every resolution.
        sizes:
          type: array
          items:
            type: string
          description: |
            The model's listed sizes of that resolution: those whose
            shorter side is its height (480p: 480; 2K: 1440; 4K: 2160).
            Absent when `resolution` is, or when the model lists no sizes.
        audio:
          type: boolean
          description: True holds only with sound, false only without. Absent holds either way.
        first_frame:
          type: boolean
          description: |
            True holds only with a first frame (image to video), false
            only without one. Absent holds either way.

    ModelLocality:
      type: string
      enum: [local, external, unknown]
      description: |
        Where a request for this model may run, from the serving drivers'
        own `locality` (their configured trust classification): `local`
        only when every backend serving it is local, `external` when any
        is (a cloud API, a subscription, someone else's server), and
        `unknown` otherwise. A client can say *runs on <account>* before
        it sends. External is not the same as billed; it names where the
        request goes, not what it costs. A `localOnly` key sees only
        local backends, so it sees `local`. Added 2026-10-08 (Workbench
        media screens).

    ChatCompletionRequest:
      type: object
      additionalProperties: false
      description: |
        Supported chat settings only. Unknown properties, including nested message,
        tool and response-format properties, return 400 with a field name. Arbitrary
        JSON Schemas inside function parameters and response schemas are preserved.
        Validation errors do not echo request values. See docs/api-compatibility.md.
      required:
        - model
        - messages
      properties:
        model:
          type: string
          description: |
            A model id from `GET /v1/models`. The gateway resolves it to
            a backend; the client does not choose a backend.
        messages:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ChatCompletionMessage'
        max_tokens:
          type: [integer, 'null']
          minimum: 1
          description: |
            Positive JSON integer generation limit; booleans, strings and floats
            are rejected. Null or absent uses the profile then gateway default.
            Normalized before defaults and preserved on every fallback attempt.
            Engine token accounting is not guaranteed to match OpenAI's.
        max_completion_tokens:
          type: [integer, 'null']
          minimum: 1
          description: |
            Alias of max_tokens. If both are non-null they must be equal, otherwise
            400 names max_completion_tokens. Neither spelling takes precedence over
            a conflicting value. This does not add reasoning-token support to engines.
        temperature:
          type: number
          format: float
          minimum: 0
          maximum: 2
        top_p:
          type: number
          format: float
          minimum: 0
          maximum: 1
          description: |
            Nucleus sampling cutoff, carried to the backend.

            **This field was accepted, validated and discarded until
            2026-09-19**: `GenerateRequest` had no `topP` to put it in,
            so the value went no further than this schema and nothing
            was logged. It has one now.
        stop:
          oneOf:
            - type: string
            - type: array
              items:
                type: string
              maxItems: 4
          description: One stop sequence or up to four sequences; forwarded as an array.
        seed:
          type: integer
          description: |
            Passed through to backends that support deterministic
            sampling; dropped with a warning where they do not.

            **True since 2026-09-19 and unfulfillable before it** —
            there was no `seed` on `GenerateRequest`, so the value was
            dropped by every backend and the warning this sentence
            promises was logged by none of them. A caller asking for a
            seed is asking for a reproducible answer and was getting a
            different one each time, with nothing in the response to
            say so.
        frequency_penalty:
          type: number
          format: float
          minimum: -2
          maximum: 2
          description: |
            Carried to the backend. Refused with 400 by backends that
            cannot honour it (the agentic CLIs; OpenAI models with a
            fixed sampler), which are skipped when choosing a backend
            rather than tried and failed.

            **Refused with a 400 at this door until 2026-09-23**, like
            the four fields below it, although llama.cpp and vLLM both
            take all of them: the internal request had nowhere to carry
            them, and a refusal was the honest answer to that. Clients
            that send them by default -- SillyTavern, Open WebUI's
            advanced parameters -- could not use this door at all.
        presence_penalty:
          type: number
          format: float
          minimum: -2
          maximum: 2
          description: Carried and refused exactly as `frequency_penalty` is.
        top_k:
          type: integer
          minimum: 0
          description: |
            **Not an OpenAI parameter.** A local-engine extension that
            llama.cpp and vLLM both read; 0 disables the cut. Refused
            by backends known to reject it -- OpenAI's own endpoint and
            the agentic CLIs -- and those are routed around.
        min_p:
          type: number
          format: float
          minimum: 0
          maximum: 1
          description: |
            **Not an OpenAI parameter.** llama.cpp's and vLLM's `min_p`,
            carried and refused exactly as `top_k` is.
        stream:
          type: boolean
          default: false
          description: |
            When true the response is an SSE stream of
            `ChatCompletionChunk` objects terminated by `data: [DONE]`.
        user:
          type: string
          description: Ignored client annotation; not stored, forwarded or used as identity.
        metadata:
          type: object
          additionalProperties:
            type: string
          description: Ignored annotations; not provider storage or queryable metadata.
        safety_identifier:
          type: string
          maxLength: 64
          description: |
            A hint (P2c): carried to OpenAI's own API, which uses it for abuse
            detection, and dropped for every other backend, none of which
            lists it. Not an authenticated identity here.
        prompt_cache_key:
          type: string
          maxLength: 1024
          description: |
            A hint (P2c): OpenAI's cache routing key, carried to OpenAI's own
            API and dropped elsewhere. A hint changes where or how cheaply an
            answer is made, never what it says, so dropping it is honest
            where refusing a setting is not. No OpenRouter model lists it
            (measured).
        prompt_cache_retention:
          $ref: './components/common.yaml#/components/schemas/PromptCacheRetention'
        service_tier:
          $ref: './components/common.yaml#/components/schemas/ServiceTier'
        n:
          type: integer
          const: 1
          description: Only one completion is supported; any other non-null value returns 400.
        logprobs:
          type: boolean
          description: |
            Return each chosen token's log probability (P2c). Routes only to
            a model that lists `logprobs` (149 on OpenRouter, measured),
            where it was refused with a 400 before 2026-09-28.
        top_logprobs:
          type: integer
          minimum: 0
          maximum: 20
          description: How many alternatives per token, with `logprobs` true; refused without it.
        logit_bias:
          type: object
          maxProperties: 300
          additionalProperties:
            type: integer
            minimum: -100
            maximum: 100
          description: |
            Token id (as a string) to a bias from -100 to 100, OpenAI's
            shape. A setting, routed as A2 says (141 models list it). Token
            ids are the model's own, so the same bias means something else
            on another model -- which is why it is never sent to one that
            did not list it.
        reasoning_effort:
          $ref: './components/common.yaml#/components/schemas/ReasoningEffort'
        verbosity:
          $ref: './components/common.yaml#/components/schemas/Verbosity'
        prediction:
          $ref: './components/common.yaml#/components/schemas/Prediction'
        web_search_options:
          $ref: './components/common.yaml#/components/schemas/WebSearchOptions'
        functions:
          type: array
          maxItems: 128
          items:
            $ref: '#/components/schemas/FunctionDefinition'
          description: |
            **Deprecated by OpenAI; translated, not refused (P2c).** The same
            thing as `tools` with every tool a function, carried as tools.
            The answer is given back in the deprecated shape too,
            `message.function_call` and `finish_reason: function_call`,
            because a client that sends this shape reads that one. The old
            API gave one call per turn; if a model asks for more, the first
            is given. **`parallel_tool_calls` is not sent for it**: set
            false, it would be an explicit setting, and A2 would route the
            request only to models that list it (12 of 455 on OpenRouter,
            measured). Refused together with `tools` or `tool_choice`.
        function_call:
          $ref: '#/components/schemas/FunctionCallChoice'
        store:
          type: boolean
          const: false
          description: Only false is supported; provider completion storage is not implemented.
        stream_options:
          type: object
          additionalProperties: false
          properties:
            include_usage:
              type: boolean
            include_progress:
              type: boolean
              description: |
                **An Eugene Plexus extension, not OpenAI's.** With streaming,
                true adds progress chunks saying what the backend is doing
                while it is not producing output, and how far it has written
                while it is: `choices: []` and an `x_eugene_plexus` carrying
                only `progress`. Local and cloud backends alike report what
                they can observe -- llama.cpp how far it has read the prompt
                and how many tokens it has written, any HTTP backend that the
                service has the request, Claude Code and Codex the tools they
                run.
                See `StreamProgress`. A client that sets it must tolerate a
                chunk with no choices, as it already must for
                `include_usage`.

                A progress chunk is not output: failover to another backend
                is still possible after one, and a second backend's progress
                starts again from its own beginning.
          description: |
            With streaming, true adds a usage-only chunk before DONE when the driver
            reports usage. False omits usage. If absent, retains Eugene's historical
            final choice chunk containing usage. Does not affect retained metrics.
        tools:
          type: array
          items:
            $ref: '#/components/schemas/Tool'
          description: |
            Tools the model may call. Passed through to the backend
            unchanged; the gateway never invents, filters or reorders
            them.

            **The gateway does not execute tools.** It carries the
            definitions down and the model's chosen calls back up, and
            the caller runs them and sends the results as `tool` role
            messages. That is OpenAI's contract and it is the one an
            agent harness implements.

            A backend that cannot carry tools is not silently stripped:
            the request fails with a 400 naming the backend, because a
            harness that receives a plain answer where it expected a
            tool call has no way to tell "the model chose not to" from
            "nobody ever offered it the tools" — and the second is a
            bug that looks exactly like the first. `GET /v1/models`
            reports which models can.
        tool_choice:
          description: |
            How the model should use `tools`. `auto` is the default when
            tools are present, `none` forbids calling one, `required`
            forces at least one call, and an object names a specific
            function. Passed through; the gateway does not enforce it.
          oneOf:
            - type: string
              enum:
                - none
                - auto
                - required
            - $ref: '#/components/schemas/NamedToolChoice'
        parallel_tool_calls:
          type: boolean
          description: |
            Whether the model may request several tools in one turn.
            Carried when set and left absent when not, because the
            backends disagree about the default -- llama.cpp assumes
            false, OpenAI true -- and filling one in would change what
            one of them already does.
        response_format:
          $ref: '#/components/schemas/ResponseFormat'
        modalities:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ChatModality'
          description: |
            What the answer is made of. `["text"]` is the default;
            `["text", "audio"]` asks for a spoken answer and needs
            `audio`. Routes only to a model that confirms audio output.
            Added 2026-09-28 (P2b).
        audio:
          $ref: '#/components/schemas/ChatAudioRequest'

    FunctionCallChoice:
      description: |
        The deprecated `function_call`: `none`, `auto`, or `{"name"}` to
        force one function. Translated to `tool_choice`.
      oneOf:
        - $ref: '#/components/schemas/FunctionCallMode'
        - $ref: '#/components/schemas/FunctionCallName'

    FunctionCallMode:
      type: string
      enum: [none, auto]

    FunctionCallName:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string

    FunctionCallDelta:
      type: object
      description: A fragment of a deprecated `function_call`, accumulated like a tool call's.
      properties:
        name:
          type: string
        arguments:
          type: string

    SpeechRequest:
      type: object
      additionalProperties: false
      required: [model, input, voice]
      description: OpenAI's speech request (P3a). Unknown fields are refused naming them.
      properties:
        model:
          type: string
        input:
          type: string
          minLength: 1
          maxLength: 4096
        voice:
          type: string
          minLength: 1
          maxLength: 128
          description: |
            The provider's own voice id, passed through (P3-3) -- or refused
            before sending when the model lists its voices and this is not
            one of them (`ModelRoutingInfo.voices`, M10).
        response_format:
          $ref: './components/common.yaml#/components/schemas/SpeechFormat'
        speed:
          type: number
          minimum: 0.25
          maximum: 4.0
        instructions:
          type: string
          maxLength: 4096
        stream_format:
          $ref: '#/components/schemas/SpeechStreamFormat'

    SpeechStreamFormat:
      type: string
      enum: [audio, sse]
      description: '`audio` is the raw bytes, streamed; `sse` is refused.'

    TranscriptionForm:
      type: object
      required: [file, model]
      description: |
        OpenAI's multipart form (P3b). Fields this door does not carry are
        refused naming them.
      properties:
        file:
          type: string
          format: binary
          description: At most 25 MiB.
        model:
          type: string
        language:
          type: string
        prompt:
          type: string
        response_format:
          $ref: '#/components/schemas/TranscriptionResponseFormat'
        temperature:
          type: number
          minimum: 0
          maximum: 1
        timestamp_granularities:
          type: array
          items:
            $ref: '#/components/schemas/TimestampGranularity'
          description: Sent as `timestamp_granularities[]`, once per value, as the SDK does.
        stream:
          type: boolean
          description: Refused when true.

    TimestampGranularity:
      type: string
      enum: [word, segment]
      description: |
        Named, as every enum in this document should be: an inline one is
        numbered by the generator, and the next one renumbers the rest
        (S6's `Source1`, and P3b's first draft, which renamed nine `Type`
        enums).

    TranscriptionUsageType:
      type: string
      enum: [duration, tokens]
      description: Which unit the backend counted in.

    TranscriptionResponseFormat:
      type: string
      enum: [json, text, verbose_json, srt, vtt]
      description: '`srt` and `vtt` are refused; `text` is rendered here from `json`.'

    Transcription:
      type: object
      required: [text]
      properties:
        text:
          type: string
        usage:
          $ref: '#/components/schemas/TranscriptionUsageOut'

    TranscriptionVerbose:
      type: object
      required: [task, text]
      properties:
        task:
          type: string
          const: transcribe
        language:
          type: string
        duration:
          type: number
        text:
          type: string
        segments:
          type: array
          items:
            type: object
            additionalProperties: true
        words:
          type: array
          items:
            type: object
            additionalProperties: true
        usage:
          $ref: '#/components/schemas/TranscriptionUsageOut'

    CompletionRequest:
      type: object
      additionalProperties: false
      required: [model, prompt]
      description: |
        OpenAI's legacy completion request (P6). Every piece is a named
        schema: an inline `oneOf` in a document this size is renamed by
        the next one.
      properties:
        model:
          type: string
        prompt:
          oneOf:
            - type: string
            - $ref: '#/components/schemas/CompletionPrompts'
        suffix:
          type: string
        max_tokens:
          type: integer
          minimum: 1
        temperature:
          type: number
          minimum: 0
          maximum: 2
        top_p:
          type: number
          minimum: 0
          maximum: 1
        n:
          type: integer
          description: 1 only in P6.
        stream:
          type: boolean
        stream_options:
          $ref: '#/components/schemas/CompletionStreamOptions'
        logprobs:
          type: integer
          description: Refused in P6.
        echo:
          type: boolean
          description: Refused when true in P6.
        stop:
          $ref: '#/components/schemas/CompletionStop'
        presence_penalty:
          type: number
          minimum: -2
          maximum: 2
        frequency_penalty:
          type: number
          minimum: -2
          maximum: 2
        best_of:
          type: integer
          description: 1 only in P6.
        logit_bias:
          type: object
          additionalProperties:
            type: integer
            minimum: -100
            maximum: 100
        seed:
          type: integer
        user:
          type: string
          description: Accepted and not forwarded, as on chat.

    CompletionPrompts:
      type: array
      minItems: 1
      maxItems: 1
      items:
        type: string
      description: One prompt only in P6.

    CompletionStop:
      oneOf:
        - type: string
        - type: array
          maxItems: 4
          items:
            type: string

    CompletionStreamOptions:
      type: object
      additionalProperties: false
      properties:
        include_usage:
          type: boolean

    CompletionResponse:
      type: object
      required: [id, object, created, model, choices]
      properties:
        id:
          type: string
        object:
          type: string
          const: text_completion
        created:
          type: integer
        model:
          type: string
        choices:
          type: array
          items:
            $ref: '#/components/schemas/CompletionChoice'
        usage:
          $ref: '#/components/schemas/CompletionUsage'
        x_eugene_plexus:
          $ref: '#/components/schemas/CompletionRoutingInfo'

    CompletionChoice:
      type: object
      required: [text, index, finish_reason]
      properties:
        text:
          type: string
        index:
          type: integer
        logprobs:
          type: 'null'
        finish_reason:
          type:
            - string
            - 'null'
          description: '`stop` or `length`; null on a chunk before the last.'

    CompletionChunk:
      type: object
      required: [id, object, created, model, choices]
      description: |
        One SSE `data:` frame. The frame with `finish_reason` carries
        `x_eugene_plexus`, as chat's final frame does. With
        `include_usage`, a last frame has `choices` empty and `usage`.
      properties:
        id:
          type: string
        object:
          type: string
          const: text_completion
        created:
          type: integer
        model:
          type: string
        choices:
          type: array
          items:
            $ref: '#/components/schemas/CompletionChoice'
        usage:
          $ref: '#/components/schemas/CompletionUsage'
        x_eugene_plexus:
          $ref: '#/components/schemas/CompletionRoutingInfo'

    ModerationRequest:
      type: object
      additionalProperties: false
      required: [input]
      properties:
        model:
          type: string
          description: Left out, the one moderation model this key may use (P6-1).
        input:
          description: |
            A string, an array of strings, or an array of parts. Every piece
            is a named schema: an inline array here was generated as `Input`
            and renamed the embeddings request's `Input` to `Input2`.
          oneOf:
            - type: string
            - $ref: '#/components/schemas/ModerationTexts'
            - $ref: '#/components/schemas/ModerationParts'

    ModerationTexts:
      type: array
      minItems: 1
      items:
        type: string
      description: Moderated one by one, with one result each.

    ModerationParts:
      type: array
      minItems: 1
      items:
        $ref: '#/components/schemas/ModerationInputPart'
      description: One input of text and an image, with one result.

    ModerationInputPart:
      type: object
      required: [type]
      properties:
        type:
          $ref: '#/components/schemas/ModerationInputPartType'
        text:
          type: string
        image_url:
          $ref: '#/components/schemas/ModerationImageUrl'

    ModerationImageUrl:
      type: object
      required: [url]
      properties:
        url:
          type: string
          description: A `data:` URL (A4).

    ModerationInputPartType:
      type: string
      enum: [text, image_url]

    ModerationResponse:
      type: object
      required: [id, model, results]
      properties:
        id:
          type: string
        model:
          type: string
          description: The public id of the model that answered.
        results:
          type: array
          items:
            $ref: '#/components/schemas/ModerationResult'

    ModerationResult:
      type: object
      additionalProperties: true
      required: [flagged]
      properties:
        flagged:
          type: boolean
        categories:
          type: object
          additionalProperties:
            type: boolean
        category_scores:
          type: object
          additionalProperties:
            type: number
        category_applied_input_types:
          type: object
          additionalProperties:
            type: array
            items:
              type: string

    TranslationForm:
      type: object
      required: [file, model]
      description: |
        The OpenAI SDK's translation form (P3-4): five fields, every other
        refused naming it.
      properties:
        file:
          type: string
          format: binary
          description: At most 25 MiB.
        model:
          type: string
        prompt:
          type: string
          description: English text to guide the style, as OpenAI's.
        response_format:
          $ref: '#/components/schemas/TranscriptionResponseFormat'
        temperature:
          type: number
          minimum: 0
          maximum: 1

    Translation:
      type: object
      required: [text]
      properties:
        text:
          type: string
          description: The speech, in English.

    TranslationVerbose:
      type: object
      required: [task, text]
      properties:
        task:
          type: string
          const: translate
        language:
          type: string
          description: The language of the text, which OpenAI names `english`.
        duration:
          type: number
        text:
          type: string
        segments:
          type: array
          items:
            type: object
            additionalProperties: true

    TranscriptionUsageOut:
      type: object
      description: |
        OpenAI's two shapes: `{"type": "duration", "seconds"}` for a
        backend that counts audio, `{"type": "tokens", ...}` for one that
        counts tokens.
      required: [type]
      properties:
        type:
          $ref: '#/components/schemas/TranscriptionUsageType'
        seconds:
          type: number
        input_tokens:
          type: integer
        output_tokens:
          type: integer
        total_tokens:
          type: integer

    ImageGenerationRequest:
      type: object
      additionalProperties: false
      required: [model, prompt]
      description: OpenAI's image generation request (P4). Unknown fields are refused naming them.
      properties:
        model:
          type: string
        prompt:
          type: string
          minLength: 1
          maxLength: 32000
        n:
          type: integer
          minimum: 1
          maximum: 10
        size:
          type: string
          maxLength: 32
          description: '`WIDTHxHEIGHT` or `auto`, carried as sent.'
        quality:
          $ref: '#/components/schemas/ImageQuality'
        background:
          $ref: '#/components/schemas/ImageBackground'
        output_format:
          $ref: '#/components/schemas/ImageOutputFormat'
        output_compression:
          type: integer
          minimum: 0
          maximum: 100
        moderation:
          $ref: '#/components/schemas/ImageModeration'
        stream:
          type: boolean
          description: Routes only to a model that streams (P4-3).
        partial_images:
          type: integer
          minimum: 0
          maximum: 3
        user:
          type: string
          maxLength: 256
        response_format:
          $ref: '#/components/schemas/ImageResponseFormat'
        style:
          $ref: '#/components/schemas/ImageStyle'

    ImageEditJsonRequest:
      type: object
      additionalProperties: false
      required: [model, prompt, images]
      description: OpenAI's JSON edit form (P4). Unknown fields are refused naming them.
      properties:
        model:
          type: string
        prompt:
          type: string
          minLength: 1
          maxLength: 32000
        images:
          type: array
          minItems: 1
          maxItems: 16
          items:
            $ref: '#/components/schemas/ImageRef'
        mask:
          $ref: '#/components/schemas/ImageRef'
        input_fidelity:
          $ref: '#/components/schemas/ImageInputFidelity'
        n:
          type: integer
          minimum: 1
          maximum: 10
        size:
          type: string
          maxLength: 32
          description: '`WIDTHxHEIGHT` or `auto`, carried as sent.'
        quality:
          $ref: '#/components/schemas/ImageQuality'
        background:
          $ref: '#/components/schemas/ImageBackground'
        output_format:
          $ref: '#/components/schemas/ImageOutputFormat'
        output_compression:
          type: integer
          minimum: 0
          maximum: 100
        moderation:
          $ref: '#/components/schemas/ImageModeration'
        stream:
          type: boolean
          description: Routes only to a model that streams (P4-3).
        partial_images:
          type: integer
          minimum: 0
          maximum: 3
        user:
          type: string
          maxLength: 256

    ImageRef:
      type: object
      additionalProperties: false
      description: |
        One input image. Only a `data:` URL is taken; any other URL, and a
        `file_id`, are refused (A4; no store).
      properties:
        image_url:
          type: string
        file_id:
          type: string

    ImageEditForm:
      type: object
      required: [model, prompt]
      description: |
        OpenAI's multipart edit form, as its SDK sends it (P4). The images
        are `image` (one) or `image[]` (several, once each). Fields this door
        does not carry are refused naming them.
      properties:
        model:
          type: string
        prompt:
          type: string
        image:
          type: string
          format: binary
        image[]:
          type: array
          items:
            type: string
            format: binary
        mask:
          type: string
          format: binary
        input_fidelity:
          $ref: '#/components/schemas/ImageInputFidelity'
        response_format:
          $ref: '#/components/schemas/ImageResponseFormat'
        n:
          type: integer
          minimum: 1
          maximum: 10
        size:
          type: string
          maxLength: 32
          description: '`WIDTHxHEIGHT` or `auto`, carried as sent.'
        quality:
          $ref: '#/components/schemas/ImageQuality'
        background:
          $ref: '#/components/schemas/ImageBackground'
        output_format:
          $ref: '#/components/schemas/ImageOutputFormat'
        output_compression:
          type: integer
          minimum: 0
          maximum: 100
        moderation:
          $ref: '#/components/schemas/ImageModeration'
        stream:
          type: boolean
          description: Routes only to a model that streams (P4-3).
        partial_images:
          type: integer
          minimum: 0
          maximum: 3
        user:
          type: string
          maxLength: 256

    ImageQuality:
      type: string
      enum: [standard, hd, low, medium, high, xhigh, max, auto]
      description: OpenAI's values; each model's listing says which it takes.

    ImageBackground:
      type: string
      enum: [transparent, opaque, auto]

    ImageOutputFormat:
      type: string
      enum: [png, jpeg, webp]

    ImageModeration:
      type: string
      enum: [low, auto]

    ImageStyle:
      type: string
      enum: [vivid, natural]
      description: '`dall-e-3` only; carried and dropped where not taken.'

    ImageInputFidelity:
      type: string
      enum: [high, low]

    ImageResponseFormat:
      type: string
      enum: [url, b64_json]
      description: '`url` is accepted and ignored (P4-1): every answer is `b64_json`.'

    ImageStreamEventType:
      type: string
      enum:
        - image_generation.partial_image
        - image_generation.completed
        - image_edit.partial_image
        - image_edit.completed

    ImagesResponse:
      type: object
      required: [created, data]
      properties:
        created:
          type: integer
        data:
          type: array
          items:
            $ref: '#/components/schemas/ImageObject'
        output_format:
          type: string
          description: |
            What the first image is, read from its bytes (P2-2): `png`,
            `jpeg`, `webp`, and `svg` from OpenRouter's vector models.
        size:
          type: string
        quality:
          type: string
        background:
          type: string
        usage:
          $ref: '#/components/schemas/ImagesUsage'
        x_eugene_plexus:
          $ref: '#/components/schemas/CompletionRoutingInfo'

    ImageObject:
      type: object
      required: [b64_json]
      properties:
        b64_json:
          type: string
        revised_prompt:
          type: string

    ImagesUsage:
      type: object
      properties:
        input_tokens:
          type: integer
        output_tokens:
          type: integer
        total_tokens:
          type: integer
        input_tokens_details:
          type: object
          additionalProperties: true

    ImageStreamEvent:
      type: object
      required: [type, b64_json, created_at, size, quality, background, output_format]
      description: |
        One SSE `data:` event, with the fields OpenAI's schema requires
        filled here where the backend sent none: `size`, `quality` and
        `background` as asked (`auto` when not), `output_format` from the
        bytes. A `partial_image` carries `partial_image_index`; a
        `completed` carries `usage`.
      properties:
        type:
          $ref: '#/components/schemas/ImageStreamEventType'
        b64_json:
          type: string
        created_at:
          type: integer
        size:
          type: string
        quality:
          type: string
        background:
          type: string
        output_format:
          type: string
        partial_image_index:
          type: integer
        usage:
          $ref: '#/components/schemas/ImagesUsage'

    VideoCreateRequest:
      type: object
      additionalProperties: false
      required: [model, prompt]
      description: OpenAI's JSON video request (P5). Unknown fields are refused naming them.
      properties:
        model:
          type: string
        prompt:
          type: string
          minLength: 1
          maxLength: 32000
        seconds:
          type: string
          pattern: '^[0-9]{1,3}$'
          description: Whole seconds, as a string as OpenAI's is; any the model lists (P5-1).
        size:
          type: string
          maxLength: 32
        input_reference:
          $ref: '#/components/schemas/ImageRef'

    VideoCreateForm:
      type: object
      required: [model, prompt]
      description: OpenAI's multipart video request, with `input_reference` a file.
      properties:
        model:
          type: string
        prompt:
          type: string
        seconds:
          type: string
        size:
          type: string
        input_reference:
          type: string
          format: binary

    VideoStatus:
      type: string
      enum: [queued, in_progress, completed, failed]

    VideoVariant:
      type: string
      enum: [video, thumbnail, spritesheet]
      description: Only `video` is served.

    VideoError:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string

    VideoResource:
      type: object
      required: [id, object, model, status, progress, created_at, completed_at, expires_at, prompt, size, seconds, remixed_from_video_id, error]
      description: |
        OpenAI's `VideoResource`, every field its schema requires. `id` is
        the signed handle.
      properties:
        id:
          type: string
        object:
          type: string
          const: video
        model:
          type: string
        status:
          $ref: '#/components/schemas/VideoStatus'
        progress:
          type: integer
        created_at:
          type: integer
        completed_at:
          type:
            - integer
            - 'null'
        expires_at:
          type:
            - integer
            - 'null'
        prompt:
          type:
            - string
            - 'null'
        size:
          type: string
        seconds:
          type: string
        remixed_from_video_id:
          type:
            - string
            - 'null'
        error:
          oneOf:
            - $ref: '#/components/schemas/VideoError'
            - type: 'null'
        x_eugene_plexus:
          $ref: '#/components/schemas/CompletionRoutingInfo'

    ChatModality:
      type: string
      enum: [text, audio]
      description: |
        One part of what the answer is made of. Named rather than inline
        so a later inline enum cannot rename it (S6's `Source1`).

    ChatAudioRequest:
      type: object
      additionalProperties: false
      required: [voice, format]
      description: |
        The spoken answer's voice and format, with `modalities`
        including `audio`; refused without it, rather than ignored.
        `format` is `wav` or `pcm16` for a non-streamed request and
        `pcm16` for a streamed one; the others are refused (see the
        operation).
      properties:
        voice:
          type: string
          minLength: 1
          maxLength: 64
          description: |
            The provider's voice name (`alloy`, `coral`, ...), passed
            through. A model with no voices (Lyria) ignores it.
        format:
          $ref: './components/common.yaml#/components/schemas/AudioOutputFormat'

    ChatCompletionAudio:
      type: object
      required: [data, format]
      description: |
        The spoken answer, on a response's `message.audio`: OpenAI's
        shape, plus `format`, which says what `data` is. **Refused on a
        request message**, where OpenAI takes `{id}` to name stored
        audio; this install stores none.
      properties:
        id:
          type: string
          description: The backend's id for the audio, when it gives one.
        data:
          type: string
          description: The audio, base64-encoded.
        format:
          $ref: './components/common.yaml#/components/schemas/AudioOutputFormat'
          description: |
            **Not OpenAI's field, and added because OpenAI's shape
            cannot say this:** what `data` is, read from its bytes.
            Lyria answers MP3 when asked for WAV (measured), and
            presenting MP3 bytes as the WAV that was asked for would be
            a lie a player discovers first (P2-2).
        transcript:
          type: string
          description: What the audio says. The answer's text is here, not in `content`.
        expires_at:
          type: integer
          description: |
            Unix seconds the backend says it keeps the audio until.
            Nothing here keeps it.

    ChatCompletionAudioDelta:
      type: object
      description: |
        A fragment of the spoken answer. Decode each `data` fragment
        from base64 and concatenate the bytes. `id`, `format` and
        `expires_at` arrive once; `transcript` arrives in fragments.
      properties:
        id:
          type: string
        data:
          type: string
        format:
          $ref: './components/common.yaml#/components/schemas/AudioOutputFormat'
        transcript:
          type: string
        expires_at:
          type: integer

    ChatCompletionMessage:
      type: object
      description: |
        OpenAI-shaped chat message. Intentionally *not* the shared
        `Message` schema: this one is on a wire contract we do not own,
        so it carries exactly OpenAI's fields and nothing of ours.
        Leaking a house field like `timestamp` into a payload an OpenAI
        SDK parses is how "compatible" quietly stops being true.
      required:
        - role
      properties:
        role:
          type: string
          enum:
            - system
            - developer
            - user
            - assistant
            - tool
            - function
          description: |
            `function` is the deprecated role for a function's result,
            answering the assistant's `function_call` before it; it is
            carried as a `tool` message answering that call (P2c).

            `developer` is OpenAI's newer name for the instruction role,
            sent by current SDKs and frameworks when they target a
            reasoning model. It reaches the backend as `system`, in
            place -- local chat templates know only `system`, and the
            two mean the same thing to a model that is not OpenAI's.
            Refused with a 400 until 2026-09-23.
        content:
          $ref: './components/common.yaml#/components/schemas/MessageContent'
          description: |
            On a **tool** message: the result, as a string or an array of
            text and image parts. The gateway moves each tool picture to the
            next user message, labelled with the call id, and leaves a note
            in the tool's text. Audio and files ride on user messages only.
        reasoning:
          type:
            - string
            - 'null'
          description: |
            Request alias for `reasoning_content`, used by Hermes Agent and
            OpenRouter-compatible clients when replaying assistant turns.
            Preserved as reasoning, never merged into visible content. If both
            fields contain non-null values, they must match. Responses use
            `reasoning_content`.
        reasoning_content:
          type:
            - string
            - 'null'
          description: |
            **On a response:** the model's reasoning for this turn, when
            the backend reported it separately from `content`. The name
            is DeepSeek's and llama.cpp's, and the one OpenAI-compatible
            clients already parse (vLLM's `reasoning` is normalised to
            it). Absent when there was none or when the serving driver's
            `thinkingMode` is `off`.

            **On a request:** accepted on an `assistant` message and
            handed back to the backend, so a tool loop resumes with the
            model's own earlier thinking -- a client that appends the
            response message verbatim sends it back, and llama.cpp
            renders it into the prompt for templates that keep it.

            Added 2026-09-23. Before it every token of a reasoning
            model's thinking was discarded one hop down, so a model that
            spent its whole budget thinking answered with an empty
            `content` and `finish_reason: length`, with nothing to say
            why.
        name:
          type: string
          description: Optional participant name, per OpenAI.
        tool_calls:
          type: array
          items:
            $ref: '#/components/schemas/ToolCall'
          description: |
            Set on an **assistant** message, naming the tools the model
            chose to call. The caller executes them and replies with one
            `tool` message per call, each carrying the matching
            `tool_call_id`.
        tool_call_id:
          type: string
          description: |
            Required on a **tool** message: which call in the preceding
            assistant turn this is the result of. `content` carries the
            result as described above.
        audio:
          $ref: '#/components/schemas/ChatCompletionAudio'
          description: |
            On a response: the spoken answer (P2b). On a request:
            refused with a 400, since it would name stored audio.
        function_call:
          $ref: '#/components/schemas/FunctionCall'
          description: |
            The deprecated single function call (P2c). On a response, only
            when the request used `functions`. On a request's assistant
            message, it is carried as that turn's one tool call.
        annotations:
          type: array
          items:
            $ref: './components/common.yaml#/components/schemas/ChatAnnotation'
          description: |
            On a response: the web sources the answer cites (P2c). On a
            request's assistant message, accepted and not forwarded: it
            describes the text beside it and instructs nothing.

    ChatCompletionResponse:
      type: object
      required:
        - id
        - object
        - created
        - model
        - choices
      properties:
        id:
          type: string
          description: 'Completion id, `chatcmpl-` prefixed as clients expect.'
        object:
          type: string
          const: chat.completion
        created:
          type: integer
        model:
          type: string
          description: |
            The model that actually served the request. Equal to the
            requested id in the normal case; after a cascade it names
            what answered, which may differ.
        choices:
          type: array
          items:
            $ref: '#/components/schemas/ChatCompletionChoice'
        usage:
          $ref: '#/components/schemas/CompletionUsage'
          description: Present on the final chunk only.
        x_eugene_plexus:
          $ref: '#/components/schemas/CompletionRoutingInfo'

    ChatCompletionChoice:
      type: object
      required:
        - index
        - message
        - finish_reason
      properties:
        index:
          type: integer
        message:
          $ref: '#/components/schemas/ChatCompletionMessage'
        logprobs:
          oneOf:
            - $ref: './components/common.yaml#/components/schemas/ChatLogprobs'
            - type: 'null'
          description: With `logprobs` true, the answer's; otherwise null.
        finish_reason:
          type: string
          enum:
            - stop
            - length
            - tool_calls
            - content_filter
            - function_call
          description: |
            `function_call` only when the request used the deprecated
            `functions`, in place of `tool_calls` (P2c).

            `stop` for a natural end or a matched stop sequence,
            `length` for hitting the token cap, `tool_calls` when the
            model stopped because it wants one or more tools run,
            `content_filter` when a safety classifier stopped it.

            **`content_filter` is OpenAI's own value and is carried
            since 2026-09-19.** Before that the chain was
            `content_filter` → the driver's `error` → `stop`, so a
            filtered answer arrived as a natural end and a caller had
            no way to tell a refusal from a reply. The same mistake as
            `tool_calls` → `stop` before 2026-09-11, one value along:
            a state with no row of its own reported as its nearest
            neighbour.

            Until 2026-09-11 this enum was `stop` and `length` only, and
            its description said so in as many words — "OpenAI's two
            values for a completion **without** tool calls". That
            sentence was the single occurrence of the string "tool"
            anywhere in this contract or the driver's, and it was an
            accurate description of a control plane no agent harness
            could use.

    ChatCompletionChunk:
      type: object
      description: One SSE frame of a streaming completion.
      required:
        - id
        - object
        - created
        - model
        - choices
      properties:
        id:
          type: string
        object:
          type: string
          const: chat.completion.chunk
        created:
          type: integer
        model:
          type: string
        choices:
          type: array
          items:
            $ref: '#/components/schemas/ChatCompletionChunkChoice'
        usage:
          $ref: '#/components/schemas/CompletionUsage'
        x_eugene_plexus:
          $ref: '#/components/schemas/CompletionRoutingInfo'
          description: |
            Set on the **final frame only**, alongside `usage` — the
            same place OpenAI puts its own end-of-stream extras.
            Absent on every earlier frame, because the values are not
            known until the completion is done. **One exception, asked
            for:** with `stream_options.include_progress`, a progress
            chunk before or between output chunks carries an
            `x_eugene_plexus` holding only `progress`, with
            `choices: []`.

            Added at M8. Until then a streaming client could see no
            routing information at all: the non-streaming response
            carried this and the stream did not, so exactly the clients
            that stream — the UI playground among them — were the ones
            that could not tell which backend answered. Retained
            metrics do not depend on this (they are recorded at the
            routing hooks, which fire on both paths); this closes the
            matching gap in what a caller can see.

    ChatCompletionChunkChoice:
      type: object
      required:
        - index
        - delta
      properties:
        index:
          type: integer
        delta:
          type: object
          description: |
            Incremental payload. The first chunk carries `role`;
            subsequent chunks carry `content` fragments, `tool_calls`
            fragments, `audio` fragments, or neither on the terminal
            chunk.
          properties:
            role:
              type: string
              enum:
                - assistant
            content:
              type:
                - string
                - 'null'
            reasoning_content:
              type:
                - string
                - 'null'
              description: |
                A fragment of the model's reasoning, forwarded as the
                backend produces it and before any `content`. Accumulate
                it the way `content` is accumulated. Its first frame is
                the stream's commit point like any other output: once a
                caller has seen the model thinking, a failure truncates
                rather than cascading onto another model.
            tool_calls:
              type: array
              items:
                $ref: '#/components/schemas/ToolCallDelta'
              description: |
                Tool-call fragments. Each carries an `index` and the
                caller accumulates by it: `id` and `function.name`
                arrive once, `function.arguments` arrives as a string
                split across any number of frames. A single frame is
                **not** parseable JSON and was never meant to be.
            audio:
              $ref: '#/components/schemas/ChatCompletionAudioDelta'
            annotations:
              type: array
              items:
                $ref: './components/common.yaml#/components/schemas/ChatAnnotation'
              description: Citations, as the provider streams them (P2c); accumulate them.
            function_call:
              $ref: '#/components/schemas/FunctionCallDelta'
        logprobs:
          oneOf:
            - $ref: './components/common.yaml#/components/schemas/ChatLogprobs'
            - type: 'null'
          description: The log probabilities of this frame's tokens, with `logprobs` true.
        finish_reason:
          type:
            - string
            - 'null'
          enum:
            - stop
            - length
            - tool_calls
            - content_filter
            - function_call
            - null
          description: Null until the terminal chunk.

    Tool:
      type: object
      description: |
        One tool offered to the model. OpenAI has only ever defined
        `function`, and the wrapper exists so other kinds can be added
        without reshaping the field.
      required:
        - type
        - function
      properties:
        type:
          type: string
          const: function
        function:
          $ref: '#/components/schemas/FunctionDefinition'

    FunctionDefinition:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          description: 'The name the model calls, e.g. `read_file`.'
        description:
          type: string
          description: |
            What the tool does. Load bearing rather than decorative —
            it is the only thing the model has to decide *whether* to
            call this tool.
        parameters:
          type: object
          additionalProperties: true
          description: |
            A JSON Schema object describing the arguments. Passed
            through verbatim: we do not validate it, rewrite it, or
            translate dialects. A backend that rejects a construct
            rejects it in its own words, which is more useful than a
            guess of ours made one hop earlier.
        strict:
          type:
            - boolean
            - 'null'
          description: |
            Ask the backend to constrain generation to `parameters`.
            Passed through; backends that do not support it ignore it.

    NamedToolChoice:
      type: object
      description: Force one specific function.
      required:
        - type
        - function
      properties:
        type:
          type: string
          const: function
        function:
          type: object
          required:
            - name
          properties:
            name:
              type: string

    ToolCall:
      type: object
      description: One tool call the model chose to make.
      required:
        - id
        - type
        - function
      properties:
        id:
          type: string
          description: |
            Correlation id. The caller echoes it as `tool_call_id` on
            the message carrying the result.
        type:
          type: string
          const: function
        function:
          $ref: '#/components/schemas/FunctionCall'

    FunctionCall:
      type: object
      required:
        - name
        - arguments
      properties:
        name:
          type: string
        arguments:
          type: string
          description: |
            The arguments as a **JSON string**, not an object. That is
            OpenAI's shape and it is deliberate on their part: a model
            can emit invalid JSON, and a string preserves what it
            actually said instead of failing the whole response. The
            caller parses it and handles the failure. We do not parse
            it, so we cannot lose it.

    ToolCallDelta:
      type: object
      description: |
        A fragment of a `ToolCall` in a streaming response. Accumulate
        by `index`.
      required:
        - index
      properties:
        index:
          type: integer
          description: |
            Which call in the assistant turn this fragment belongs to.
            Present on every fragment, because a model can interleave
            fragments of two calls.
        id:
          type: string
        type:
          type: string
          const: function
        function:
          type: object
          properties:
            name:
              type: string
            arguments:
              type: string
              description: A fragment of the arguments string, to be concatenated.

    ResponseFormat:
      type: object
      description: |
        Constrain the shape of the reply. Passed through to the backend;
        the gateway does not enforce or post-validate it.
      required:
        - type
      properties:
        type:
          type: string
          enum:
            - text
            - json_object
            - json_schema
        json_schema:
          $ref: '#/components/schemas/ResponseJsonSchema'
          description: Required when `type` is `json_schema`.

    ResponseJsonSchema:
      type: object
      required:
        - name
        - schema
      properties:
        name:
          type: string
        description:
          type: string
        schema:
          type: object
          additionalProperties: true
          description: A JSON Schema object. Passed through verbatim.
        strict:
          type:
            - boolean
            - 'null'

    CompletionUsage:
      type: object
      description: |
        Token accounting in OpenAI's field names. Fields may be absent
        when the backend did not report them on that request.

        This used to say the CLI subprocess backends "generally do not",
        which is wrong and was believed downstream: both of them parse a
        usage block out of their CLI's output — Claude's envelope,
        Codex's `turn.completed` — and omit it only when the CLI emitted
        none.
      properties:
        prompt_tokens:
          type: integer
          minimum: 0
        completion_tokens:
          type: integer
          minimum: 0
        total_tokens:
          type: integer
          minimum: 0
        prompt_tokens_details:
          type: object
          description: |
            Present only when the backend reported it. `cached_tokens`
            is the part of `prompt_tokens` served from the backend's
            prompt cache -- llama.cpp and vLLM both report it.
          properties:
            cached_tokens:
              type: integer
              minimum: 0
        completion_tokens_details:
          type: object
          description: |
            Present only when the backend reported it.
            `reasoning_tokens` is the part of `completion_tokens` spent
            reasoning; vLLM reports it with its reasoning parser on,
            llama.cpp does not, and it is never estimated here.
          properties:
            reasoning_tokens:
              type: integer
              minimum: 0

    CompletionRoutingInfo:
      type: object
      description: |
        Namespaced extension recording how this particular request was
        served. Not part of OpenAI's schema, and ignored by clients that
        do not know it.

        It exists because the failure mode of a routing layer is being
        opaque: when one of several backends is slow or a cascade fired,
        an operator needs to see which one answered without going to the
        logs. `attempts` above 1 is the visible evidence that failover
        did its job.
      properties:
        driver:
          type: string
          description: Name of the inference-driver that served this request.
        runtime:
          type: string
          description: |
            Name of the engine runtime behind that driver, when it is a
            local engine. Absent for hosted and CLI backends, which have
            no runtime of ours.
        node:
          type:
            - string
            - 'null'
          description: |
            Name of the machine whose runtime answered, as the root's node
            registry names it. Null when the backend is not a machine's
            runtime, such as a cloud provider. Where the `x_eugene_plexus`
            envelope rides on headers, this field rides as the
            `x-eugene-plexus-node` header.
        backend:
          $ref: 'components/common.yaml#/components/schemas/BackendKind'
        reported_model:
          type: string
          description: |
            What the backend said served this request, verbatim. Provenance,
            never a routing key. Only the decision door sets it today.
            Absent from a decision answer when the backend reported none,
            and null on the doors whose envelope serializes its unset
            fields, as `runtime` is.
        latency_ms:
          type: integer
          description: Gateway-side wall-clock time, including any failed attempts.
        attempts:
          type: integer
          minimum: 1
          description: |
            How many backends were tried. Greater than 1 means the
            priority-list cascade fired and an earlier backend failed.
        web_searches:
          type: integer
          minimum: 0
          description: |
            How many web searches this install ran for the request (P8).
            Absent when none ran, and when the backend searched itself.
        search_suggestions:
          type: array
          items:
            type: string
          description: |
            For each search this install ran whose provider's terms require
            something shown with its results (Google's Search Suggestions,
            HTML), that HTML, in the order the searches ran. Show it to the
            person who asked, unmodified, beside the answer
            (docs/design/google-search-account.md, GS4). Absent when none
            had any.
        tier:
          type: integer
          minimum: 1
          description: |
            Which tier of the slot answered, 1-based. Greater than 1
            means every backend in an earlier tier was ineligible or
            failed — a cloud target answering for a local model, say.

            **Positional, counted over the slot's tiers rather than over
            the ones that had anything in them**, which is the only
            reading that answers the question this field exists for:
            *did the primary serve this?* A primary whose companion
            driver is down is a tier with no backends, and it still
            occupies its number. See `ModelRoutingInfo.tiers` for which
            tier can be absent and why.
        swapped_in:
          type: boolean
          description: |
            True when the gateway had to start a `startOnDemand`
            runtime to serve this request. The visible cost of idle
            unload, next to the request that paid it.
        waited_ms:
          type: integer
          minimum: 0
          description: |
            How long the request waited for a runtime to reach `ready`
            before being sent. Zero when nothing had to be woken.
        context_length:
          type: integer
          minimum: 1
          description: |
            The context window of the backend that actually answered, as
            that backend resolved it. **Null** when it does not expose
            one — a hosted provider, a CLI subscription, or a local
            engine that was not reachable to ask. Null and not absent:
            this envelope serializes its unset fields, as `runtime` has
            since M0.

            Per-request, and therefore not the same number as
            `x_eugene_plexus.context_length` on `GET /v1/models`: that
            one is the smallest across every backend serving the name,
            because a request may land on any of them. This one is the
            window that applied to *this* request, which is what makes a
            truncated answer explicable after the fact.
        prompt_truncated:
          type: boolean
          description: |
            **The backend silently dropped input.** True when the prompt
            we sent was far larger than the token count the backend
            reported consuming — the signature of a server that fits an
            over-long prompt into the window by discarding the middle of
            the conversation and answering anyway, with a 200 and no
            flag of its own.

            This is the failure that makes a coding harness loop: it
            sends file contents, the model never receives them, and the
            confident answer that comes back is about code nobody read.
            Measured on this project's own hardware: 66,389 characters
            across six messages came back as `prompt_tokens: 86`, HTTP
            200, nothing anywhere saying so.

            Detected, not predicted. It is computed from
            `usage.prompt_tokens` **after** the answer, by a ratio
            chosen to be far below any real tokenizer's — so it cannot
            fire on a merely token-dense prompt, and it needs no
            tokenizer of ours.

            **And by a second test where the window is known**
            (2026-10-03): `prompt_tokens` reached at least 90% of
            `context_length` while the prompt's characters, at four to a
            token, exceed the whole window. The ratio alone cannot see a
            cut that keeps a near-full window: Ollama's default context is
            4,096 tokens on a card under 23 GiB and it still keeps the
            newest turns and drops the middle, so a prompt cut to 4k went
            unflagged below about 82,000 characters.

            **Three states, and the difference matters.** `null` means
            not evaluated — the backend reported no usage, or the prompt
            was too small for the test to mean anything — and must not
            be read as reassurance. `false` means it was checked and the
            input arrived. `true` means it did not. Null and not absent:
            this envelope serializes its unset fields, as `runtime` has
            since M0.

            **Why a flag and not an error.** The answer has already been
            generated, and on a streamed request it has already been
            delivered — M10's rule is that a stream cannot be unsent.
            Failing one path and flagging the other would make the same
            condition report two different ways, so both flag. A backend
            that refuses instead of truncating needs none of this: its
            refusal is exact and is passed straight through as a 400.
        progress:
          $ref: '#/components/schemas/StreamProgress'
        output_cap:
          $ref: '#/components/schemas/OutputCap'
        cost_usd:
          type: number
          minimum: 0
          description: |
            What the provider says it billed for this request, in US
            dollars. Only a video job carries it today: on the poll that
            finds it `completed` (or `failed`), when the provider reports
            one (OpenRouter's `usage.cost`). **Absent means not known,
            never free.** Added 2026-10-08 (Workbench's video screen; the
            gateway's first money).

    OutputCap:
      type: object
      required:
        - tokens
        - source
      description: |
        The output cap the gateway sent to the backend that answered, and
        where it came from. Absent when none was sent: the answer was then
        bounded only by the model's context window, the request deadline
        and the backend's own rules. On the chat door's final frame and on
        its non-streamed response.

        **Why (2026-10-10).** A Strata answer stopped mid-thought at 4,096
        tokens, and Workbench told Troy to raise his chat's own setting.
        The cap was his install's `defaultMaxTokens`, saved long before.
        Whoever shows a length stop can now name the setting that made it.
      properties:
        tokens:
          type: integer
          minimum: 1
          description: The `max_tokens` sent.
        source:
          $ref: '#/components/schemas/OutputCapSource'

    OutputCapSource:
      type: string
      enum: [request, profile, install]
      description: |
        Where an `OutputCap` came from. `request`: the caller's own
        `max_tokens`. `profile`: the model's default Library profile
        (Maximum output tokens). `install`: the gateway's
        `defaultMaxTokens`.

    StreamProgress:
      type: object
      required:
        - stage
      description: |
        What the backend is doing while it is not producing output, or
        how far it has written while it is, on a progress chunk
        (`stream_options.include_progress`). The only thing such a chunk
        carries: its `x_eugene_plexus` has this and nothing else, and its
        `choices` is empty. It can arrive at any point before the final
        chunk -- an agent backend runs a tool between two bursts of
        thinking, and `generating` comes between output chunks.

        What each backend can report is in `inference-driver.yaml`'s
        `StreamProgress`: llama.cpp's prompt reading and its running count
        of tokens written, a hosted API accepting the request and its
        keepalives, Claude Code's and Codex's own tools. Nothing is
        estimated here.

        **Why it exists (2026-09-27).** Until the first token a stream
        said nothing. On the processor a long prompt takes minutes to
        read -- measured, 35 s for 7,795 tokens with a 0.6B -- and a
        tester who saw nothing for that long concluded the request had
        failed. A cloud agent is the same shape from the other end.
      properties:
        stage:
          type: string
          enum: [prompt, working, tool, generating]
          description: |
            `prompt`: reading the prompt, with the token counts below.
            `working`: the backend says it is working and not how far.
            `tool`: an agent backend is running one of its own tools,
            named in `tool`.
            `generating`: writing, thinking included, with the backend's
            own count so far in `generated_tokens`. Only from a backend
            that counts as it writes (llama.cpp), at most every half
            second.
        tool:
          type: string
          description: On `tool`, the tool's name as the backend gives it.
        generated_tokens:
          type: integer
          minimum: 0
          description: |
            On `generating`: tokens written so far, reasoning included, as
            the backend counted them.
        tokens_per_second:
          type: number
          minimum: 0
          description: |
            On `generating`: the backend's own writing speed so far, when
            it reports one.
        phase:
          type: string
          enum: [started, finished]
          description: |
            On `tool`, whether the tool has just started or has just
            finished. Absent means `started`: a gateway before alpha.6 sends
            only the start, and an agent backend's own tools still do.

            **The tools this install runs itself** (`web_search`, P8) send
            both. On chat, which has no item for a search, they mark where
            one turn of the model's text ends and the next begins. Text sent
            before a `started` was written before that search ran; text
            after the `finished` was written with its results. A model told
            to search can write a whole answer first (llama-server does not
            enforce a forced tool choice), so a caller that shows only the
            last turn's text as the answer uses these marks to tell the
            two apart. The text is still sent: a stream cannot be unsent,
            and this layer does not hold output back to decide later.
        prompt_tokens:
          type: integer
          minimum: 0
          description: On `prompt`, tokens in the whole prompt.
        cached_tokens:
          type: integer
          minimum: 0
          description: |
            Of those, reused from the backend's cache and not read again.
            The fraction still to read is
            `(prompt_tokens - processed_tokens) / (prompt_tokens - cached_tokens)`.
        processed_tokens:
          type: integer
          minimum: 0
          description: Read so far, the cached ones included.
        elapsed_ms:
          type: integer
          minimum: 0
          description: |
            The backend's time on this prompt so far, from which a client
            can estimate what is left.

    EmbeddingRequest:
      type: object
      required:
        - model
        - input
      properties:
        model:
          type: string
          description: |
            Must name a model that serves the embeddings surface.
            `GET /v1/models` reports `x_eugene_plexus.surfaces` per
            model; a chat-only model is refused here with a 400 rather
            than sent down to fail as an obscure backend error.
        input:
          oneOf:
            - type: string
            - type: array
              minItems: 1
              items:
                type: string
          description: |
            One string, or a batch of them. Order is preserved and is
            the only way a caller can match vectors to inputs.

            **Token-array inputs are not accepted**, which OpenAI does
            allow. Supporting them would mean tokenizing on this side to
            validate, and this install deliberately owns no tokenizer --
            see the context-window decision. A caller sending one gets a
            400 rather than a silently different answer.
        encoding_format:
          type: string
          enum: [float, base64]
          default: float
          description: |
            `base64` is what the OpenAI SDKs ask for by default, so it
            is supported and is handled **here** rather than passed to
            the backend: little-endian `float32`, then base64.
        user:
          type: string
          description: |
            Opaque end-user id, as OpenAI defines it. **Accepted and
            ignored**: it is not sent to any backend, not recorded and not
            routed on. A request that carries one is answered with
            `x-eugene-plexus-ignored-settings: user` (`dimensions, user`
            when both are sent). Before 2026-10-11 this said "recorded".
        dimensions:
          type: integer
          minimum: 1
          description: |
            Requested vector width, forwarded in EmbedRequest.dimensions.
            Gemini applies it as outputDimensionality. A backend that
            does not apply it returns its native width and names
            dimensions in x-eugene-plexus-ignored-settings; Gemini does
            not call an applied value ignored. No layer truncates or
            pads vectors, and an untested capability never blocks an
            attempt. A provider refusal names the field and its cause.

    EmbeddingResponse:
      type: object
      required:
        - object
        - data
        - model
      properties:
        object:
          type: string
          enum: [list]
        data:
          type: array
          items:
            $ref: '#/components/schemas/EmbeddingData'
        model:
          type: string
          description: |
            The model that actually produced these vectors. After a
            same-model failover this still names that model -- by the
            rule above, it can never name a different one.
        usage:
          $ref: '#/components/schemas/EmbeddingUsage'
        x_eugene_plexus:
          $ref: '#/components/schemas/CompletionRoutingInfo'

    EmbeddingData:
      type: object
      required:
        - object
        - index
        - embedding
      properties:
        object:
          type: string
          enum: [embedding]
        index:
          type: integer
          minimum: 0
          description: Position of the input this vector came from.
        embedding:
          oneOf:
            - type: array
              items:
                type: number
            - type: string
          description: |
            An array of floats, or a base64 string when the caller asked
            for `base64` -- little-endian `float32`.

    EmbeddingUsage:
      type: object
      description: |
        Separate from `CompletionUsage` because there is no completion:
        OpenAI omits `completion_tokens` here, and inventing a zero
        would assert something the backend never said.
      properties:
        prompt_tokens:
          type: integer
          minimum: 0
        total_tokens:
          type: integer
          minimum: 0

    RerankRequest:
      type: object
      description: |
        Jina's and Cohere's rerank body (`documents`), or TEI's (`texts`):
        exactly one of the two (MR6). Fields this door does not know are
        ignored, as other OpenAI-shaped bodies' are.
      required:
        - query
      properties:
        model:
          type: string
          description: |
            A model whose `x_eugene_plexus.surfaces` include `rerank`.
            Left out: the one such model this key may use (see the
            operation).
        query:
          type: string
          minLength: 1
          maxLength: 1048576
          description: |
            The question the passages are scored against. At most 1,048,576
            characters, as one passage.
        documents:
          type: array
          maxItems: 1000
          items:
            oneOf:
              - type: string
                maxLength: 1048576
              - $ref: '#/components/schemas/RerankDocument'
          description: |
            The passages (Jina, Cohere): strings, or objects whose `text`
            is the passage. Answered as `RerankResponse`. At most 1,048,576
            characters a passage (the driver's limit); a longer one is a 400
            naming its position. A passage longer than the model reads is a
            400 naming the model's limit.
        texts:
          type: array
          maxItems: 1000
          items:
            type: string
            maxLength: 1048576
          description: |
            The passages (TEI). Answered as `TeiRerankResponse`. The same
            limits as `documents`.
        top_n:
          type: integer
          minimum: 1
          description: |
            How many of the best to return. Left out, or more than there
            are: all of them, which is what Open WebUI asks for.
        return_documents:
          type: boolean
          default: false
          description: |
            Put each passage on its result (`document.text`, or `text` in
            TEI's shape). Cohere's default, false; Jina's is true, so a
            Jina client that wants the text asks.
        return_text:
          type: boolean
          default: false
          description: TEI's name for `return_documents`; either one asks.
        raw_scores:
          type: boolean
          default: false
          description: |
            TEI's: the engine's own numbers, unchanged, instead of 0 to 1.
            Honoured in either shape.
        truncate:
          type: boolean
          description: |
            TEI's. `false`, its default, is what this door does: a passage
            longer than the model reads is refused, not cut. `true` is
            **accepted and ignored**, and named in
            `x-eugene-plexus-ignored-settings`.
        truncation_direction:
          type: string
          description: |
            TEI's, and only meaningful with `truncate: true`: named with it
            then, and not otherwise, as nothing is cut.
        max_chunks_per_doc:
          type: integer
          description: Cohere's. **Accepted and ignored**, and named.
        max_tokens_per_doc:
          type: integer
          description: Cohere's. **Accepted and ignored**, and named.
        rank_fields:
          type: array
          items:
            type: string
          description: |
            Cohere's. **Accepted and ignored**, and named: an object's
            `text` is the passage.

    RerankDocument:
      type: object
      required:
        - text
      additionalProperties: true
      properties:
        text:
          type: string
          maxLength: 1048576
          description: The passage. Other fields are kept by the caller, not read here.

    RerankResponse:
      type: object
      required:
        - object
        - model
        - results
      properties:
        id:
          type: string
          description: This answer's own id, as Cohere's carry one.
        object:
          $ref: '#/components/schemas/RerankObject'
        model:
          type: string
          description: |
            The model that scored these. After a same-model failover it
            still names that model; by the rule above it can never name a
            different one.
        results:
          type: array
          items:
            $ref: '#/components/schemas/RerankResult'
          description: |
            Best first, by `relevance_score` and then by `index`; `top_n`
            long when it was given and smaller than the number of passages.
        usage:
          $ref: '#/components/schemas/EmbeddingUsage'
        x_eugene_plexus:
          $ref: '#/components/schemas/CompletionRoutingInfo'

    RerankObject:
      type: string
      enum: [list]
      description: |
        Named, not inline: an inline enum here made the Python generator
        number it `Object2` and rename the Responses door's `Object2` to
        `Object3` in every consumer (MR6, 2026-10-12).

    RerankResult:
      type: object
      required:
        - index
        - relevance_score
      properties:
        index:
          type: integer
          minimum: 0
          description: Position of the passage in the request's `documents`.
        relevance_score:
          type: number
          description: |
            0 to 1, higher answers the question better; the engine's own
            number with `raw_scores`.
        document:
          $ref: '#/components/schemas/RerankResultDocument'

    RerankResultDocument:
      type: object
      required:
        - text
      properties:
        text:
          type: string
          description: The passage, when `return_documents` or `return_text` asked.

    TeiRerankResponse:
      type: array
      description: TEI's answer, one entry a passage, best first.
      items:
        $ref: '#/components/schemas/TeiRerankResult'

    TeiRerankResult:
      type: object
      required:
        - index
        - score
      properties:
        index:
          type: integer
          minimum: 0
          description: Position of the passage in the request's `texts`.
        score:
          type: number
          description: 0 to 1, or the engine's own number with `raw_scores`.
        text:
          type: string
          description: The passage, when `return_text` or `return_documents` asked.

    RoutingTableView:
      type: object
      description: |
        The gateway's resolved routing table, as of the last refresh.
        The same snapshot requests are routed from, opened up so an
        operator can see why a request went where it did.
      required:
        - refreshed_at
        - slots
      properties:
        refreshed_at:
          type: string
          format: date-time
        load_balancing:
          type: string
          description: |
            Where a new conversation goes now: the `loadBalancing` value,
            or its default when it is unset or the old `conversation`.
        slots:
          type: array
          items:
            $ref: '#/components/schemas/RoutingSlotView'
        unreachable_drivers:
          type: array
          items:
            type: string
          description: Drivers in the topology that did not answer `/v1/info`.
        control_root:
          $ref: '#/components/schemas/ControlRootView'
        search_accounts:
          type: array
          items:
            $ref: '#/components/schemas/SearchAccountView'
          description: |
            Every search account that answered, in the order a web search
            tries them: those `webSearchOrder` names first, in its order,
            then the rest by the default rule (free before billed, this
            machine's before another's). Set or not, this is the order in
            effect (docs/design/google-search-account.md, GS7).

    SearchAccountView:
      type: object
      required:
        - name
        - provider
        - runs
        - placed_by
      properties:
        name:
          type: string
          description: The account's name, as its agent declares it.
        node:
          type:
            - string
            - 'null'
          description: The machine it runs on; null on a standalone install.
        provider:
          type: string
          description: '`searxng`, `brave` or `google`.'
        label:
          type:
            - string
            - 'null'
        billing:
          type: string
          enum: [free, per_search]
          description: |
            As the account reports it (`free`: SearXNG; `per_search`: Brave, Google).
        runs:
          type: boolean
          description: |
            Set up and able to search now. An account that is not is
            listed in its place and skipped.
        placed_by:
          type: string
          enum: [order, default]
          description: |
            `order` when `webSearchOrder` names it, `default` when it is
            placed by the default rule after the named ones.

    ControlRootView:
      type: object
      description: |
        Where the routing table's node list comes from, and whether that
        source answered on the last refresh. The control root is the one
        thing routing needs from management — which agents exist and
        where — and the one thing that, until 2026-09-13, nothing told
        the gateway. It reads it from its own agent now; this says what
        it found.
      required:
        - source
        - reachable
      properties:
        source:
          type: string
          enum: [config, agent, none]
          description: |
            `config` — the `controlUrl` config field, set by an operator
            and used as given, even when wrong. `agent` — derived on
            this refresh from the gateway's own agent: `GET /v1/node`
            (`controlUrl`, when the node is enrolled), else the
            `control` component the agent declares. `none` — neither
            knew of one; the table is built from the one configured
            agent, which is a single-host install.
        url:
          type: string
          format: uri
          description: The control root read, or tried. Absent when `source` is `none`.
        reachable:
          type: boolean
          description: |
            Whether `GET /v1/nodes` answered on the last refresh. False
            keeps the previous node list in force — management being
            down must not empty the routing table — and is the state a
            container's sealed root leaves every gateway in after a
            restart. Always false when `source` is `none`.
        error:
          type: string
          description: |
            Why it did not answer, when it did not: the HTTP status and
            the problem's title when it sent one (`503 Locked`), else
            the transport error.
        nodes:
          type: integer
          description: How many nodes the control root listed on the last read that answered.

    RoutingSlotView:
      type: object
      required:
        - model
        - tiers
      properties:
        model:
          type: string
          description: What a client asks for.
        configured:
          type: boolean
          description: |
            True when a `modelSlots` entry exists for this model; false
            for the implicit one-tier slot every served model id gets.
        tiers:
          type: array
          items:
            $ref: '#/components/schemas/RoutingTierView'

    RoutingTierView:
      type: object
      required:
        - target
        - backends
      properties:
        target:
          type: string
          description: The model id this tier is the replica set of.
        backends:
          type: array
          items:
            $ref: '#/components/schemas/RoutingBackendView'

    RoutingBackendView:
      type: object
      required:
        - driver
        - eligible
      properties:
        driver:
          type: string
        model:
          type: string
          description: |
            The driver's own id for the model this row serves: the tier's
            target for a single-model driver, and the target without its
            `<driver>/` prefix for an account.
        url:
          type: string
          format: uri
        eligible:
          type: boolean
          description: Whether a request could be sent here right now.
        ineligible_reason:
          type: string
          description: |
            Why not, when `eligible` is false — the runtime's status
            (`stopped`, `loading`, `crashed`), or that the driver was
            unreachable.
        in_flight:
          type: integer
          minimum: 0
          description: Requests this gateway currently has outstanding to it.
        parallel_slots:
          type: integer
          minimum: 1
          description: The runtime's capacity, when it reported one; 1 otherwise.
        runtime:
          type: string
          description: The engine runtime this driver follows, when it follows one.
        runtime_status:
          type: string
          description: |
            The agent's `RuntimeStatus` for that runtime, as a string —
            the agent owns the enum.
        node:
          type: string
          description: |
            The machine the driver runs on. Was the runtime's node only,
            which left a cloud driver's row with none although its agent
            is known.
        stop_reason:
          type: string
          description: The agent's `Runtime.stopReason`, when the runtime is stopped.
        idle_unload_seconds:
          type: integer
          description: The runtime's declared idle timeout, when it has one.
        start_on_demand:
          type: boolean
        idle_seconds:
          type: integer
          minimum: 0
          description: |
            Seconds since the gateway last sent this backend a request.
            Absent when it never has.

    AnthropicMessagesRequest:
      type: object
      description: |
        Request body for `POST /v1/messages`, in Anthropic's shape.

        Measured Claude Code hints (`cache_control`, `context_management`)
        are accepted with a response header naming the ignored ones
        (`cache_control` only when the answering backend did not carry it);
        `thinking` chooses whether reasoning is returned. Metadata is
        discarded. Claude Code's `safeguards`, `speed`, `thread` and
        `diagnostics` are accepted and named as ignored; any other unknown
        top-level setting is explicitly rejected.
        This is a text, image, document and tool translation, not full parity.

        Consequently **this schema does not decide what is refused**.
        The refusals — documents it cannot carry, server-side tools,
        `mcp_servers`, more than four `stop_sequences` — are enforced
        against the raw request body by the implementation, with a 400
        naming the field, because a model that ignores extra keys cannot
        see the thing it is meant to reject. Read this schema as what
        the gateway *reads*, and the endpoint description as what it
        refuses.
      additionalProperties: true
      required:
        - model
        - messages
        - max_tokens
      properties:
        model:
          type: string
          description: |
            A model id from `GET /v1/models`. Anthropic model names have
            no special meaning here: the id is resolved against this
            install's slots like any other, and a caller naming
            `claude-sonnet-4-5` gets whatever the operator mapped that
            to, or a 400.
        messages:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/AnthropicInputMessage'
        max_tokens:
          type: integer
          minimum: 1
          description: |
            **Required by Anthropic's contract, and required here.**
            Unlike the OpenAI door, a missing value is a 400 rather than
            a fill from the settings profile, because a client written
            against this wire always sends one and its absence means the
            caller is not speaking this protocol.
        system:
          description: |
            A system prompt: a plain string, or a list of blocks.

            Claude Code sends three blocks, and the **first is not a
            prompt at all** — it is a billing header smuggled as prose
            (`x-anthropic-billing-header: …`). Any code that assumes
            `system[0]` is the instruction is wrong about the commonest
            client. All blocks are concatenated in order into one
            `system` message, **without that header line**: a leading
            `x-anthropic-billing-header:` line is taken off every block
            before any backend sees the prompt. It tells a model nothing,
            and it leads the prompt with a value that changes per session
            (on some client builds, per request), so carrying it made
            every new session re-read its whole system prompt and tool
            list from the engine's first token (measured 2026-10-02:
            ~18,700 tokens, `docs/acceptance/prompt-cache-measurement.md`).
            Text after the line in the same block is kept.
          oneOf:
            - type: string
            - type: array
              items:
                $ref: '#/components/schemas/AnthropicSystemBlock'
        stream:
          type: boolean
          default: false
          description: |
            When true the response is Anthropic's typed SSE stream.
            **Claude Code sets this on every request**, so the
            non-streaming path of this endpoint is real but is not
            exercised by that client.
        temperature:
          type: number
          format: float
          minimum: 0
          maximum: 1
          description: |
            Anthropic's range is 0-1 where OpenAI's is 0-2. Passed
            through unscaled: the value means the same thing to a local
            engine either way, and rescaling would silently change what
            a caller asked for.
        top_p:
          type: number
          format: float
          minimum: 0
          maximum: 1
        top_k:
          type: integer
          minimum: 0
          description: |
            Carried to the backend since 2026-09-23. Before A2 it was
            silently discarded despite controlling generation; from A2
            until 2026-09-23 it was refused with a 400, because the
            internal request had nowhere to put it. Backends known to
            reject it are routed around.
        stop_sequences:
          type: array
          items:
            type: string
          description: |
            Up to four. A fifth is a 400 rather than a silent truncation
            to the first four, because dropping a stop sequence changes
            where the answer ends.
        tools:
          type: array
          items:
            $ref: '#/components/schemas/AnthropicToolDefinition'
          description: |
            Tool definitions. Translated into the OpenAI function shape
            and carried to the backend unchanged.

            A backend that cannot carry tools is refused by name rather
            than served without them — the same rule the OpenAI door
            states, and for the same reason: a harness cannot tell "the
            model chose not to call one" from "nobody offered it any".
        tool_choice:
          $ref: '#/components/schemas/AnthropicToolChoice'
        metadata:
          type: object
          additionalProperties: true
          description: |
            Read and dropped. Claude Code puts a JSON *string* in
            `user_id` carrying a device id, an account uuid and a
            session id; none of it is ours to keep, and the gateway's
            own request records already identify a request.
        thinking:
          type:
            - object
            - 'null'
          additionalProperties: true
          description: |
            **Read and dropped, never refused**, and the distinction was
            measured. Present on every Claude Code request, in three
            shapes: `{"budget_tokens": N, "type": "enabled"}` for a
            known Claude id, `{"type": "adaptive"}` for an arbitrary
            local id, and **`null` when the caller set
            `MAX_THINKING_TOKENS=0`** — so even `"thinking" in body` is
            true for the one configuration asking for no thinking at
            all.

            **What it does decide, since 2026-09-23: whether the
            response carries `thinking` blocks, and whether their text
            is shown.** Non-null and not `{"type": "disabled"}` returns
            the model's reasoning, when the backend reported any, as a
            `thinking` block ahead of the answer -- with the text, or
            with the text empty and the reasoning carried in `signature`
            when `display` is `"omitted"`. Absent, null or disabled
            returns none, which is Anthropic's own behaviour and keeps
            `content[0].text` pointing at the answer for every client
            that never asked.

            A `budget_tokens` is not enforced and is named on the ignored-settings
            header. Since 2026-10-15, `disabled` also requests effort `none`, taking
            precedence over `output_config.effort`. Supporting backends receive
            the control; others omit it and name `thinking` on that header.
        output_config:
          type:
            - object
            - 'null'
          additionalProperties: true
          description: |
            **`effort` is carried to supporting backends.** Claude Code
            sends `{"effort": "high"}` on every request -- measured
            2026-09-23 (2.1.207 with agent-sdk 0.3.280, beta header
            `effort-2025-11-24`), absent from the 2026-09-19 capture --
            and the unknown-field refusal A2 added turned that into a
            400 on the first request of every session: **Claude Code
            could not use this door at all** until this field was named.
            Since 2026-10-15 it uses the shared reasoning-effort preference.
            Unsupported effort is omitted and named as `output_config.effort`
            on the ignored-settings header, without refusing the request.

            **`format` is honoured** (2026-10-03): `{"type":
            "json_schema", "schema": {...}}` becomes the chat path's
            `response_format` of type `json_schema`. Claude Code sends it
            for session titles, memory recall and prompt hooks. Any other
            `format` type, a `format` without a `schema` or with a key
            beside `type` and `schema`, and any other key, is refused
            with a 400 naming it: it changes what the answer is, and this
            door does not implement it.
        cache_control:
          type: object
          additionalProperties: true
          description: |
            Prompt-cache hints, read wherever they appear — on system
            blocks, on the last user content block, and on `tool_result`
            blocks. Carried to a hosted backend that caches on request
            (an OpenRouter `anthropic/*` model) and dropped, and named on
            `x-eugene-plexus-ignored-settings`, by any other. A local
            engine owns its own KV cache and there is nothing here to
            honour.

    AnthropicCountTokensRequest:
      type: object
      description: |
        Request body for `POST /v1/messages/count_tokens`: a Messages
        request without `max_tokens` (Claude Code sends `model`,
        `messages` and, per category, `system` or `tools`). Translated
        exactly as `POST /v1/messages` translates it, with the same
        refusals enforced against the raw body.
      additionalProperties: true
      required:
        - model
        - messages
      properties:
        model:
          type: string
        messages:
          type: array
          items:
            $ref: '#/components/schemas/AnthropicInputMessage'
        system:
          oneOf:
            - type: string
            - type: array
              items:
                $ref: '#/components/schemas/AnthropicSystemBlock'
        tools:
          type: array
          items:
            $ref: '#/components/schemas/AnthropicToolDefinition'
        tool_choice:
          $ref: '#/components/schemas/AnthropicToolChoice'

    AnthropicTokenCount:
      type: object
      required:
        - input_tokens
      properties:
        input_tokens:
          type: integer
          minimum: 0
          description: |
            The prompt's size as the serving backend's own template and
            tokenizer count it -- what a generation of the same request
            would report as its input.

    AnthropicInputMessage:
      type: object
      description: |
        One turn. A tool result is **a `tool_result` block inside a
        `user` message**, and a model's tool call comes back as a
        `tool_use` block inside an `assistant` message — Anthropic has
        no `tool` role, and that is the shape fact the translation turns
        on.

        **`system` is in the enum because a real client sends it, and
        the published contract says it does not.** Anthropic documents
        `user` and `assistant` only, and the first version of this
        schema said so. Then a real Claude Code driving a tool loop
        against this gateway was refused with
        `messages.1.role: Input should be 'user' or 'assistant'` on its
        very first request: it sends the documented top-level `system`
        (three blocks) **and, separately, a `system`-role message inside
        `messages`** carrying several more kilobytes, positioned after
        the first user turn.

        It is carried **in place** rather than hoisted into the leading
        system prompt. The client put it after a user turn deliberately,
        and moving it would change what the model sees for the sake of
        tidiness on a wire we do not own -- and would change the start of
        the prompt on every turn, so the engine's prompt cache could reuse
        nothing past it.

        **By default it reaches the backend as a user turn**, its text
        wrapped `<system-reminder>…</system-reminder>`, because the Qwen
        3.5 and later chat templates refuse a system message anywhere but
        first ("System message must be at the beginning") and Claude Code
        could not use those models (measured 2026-10-02, gateway#6). The
        gateway setting `inConversationSystem` chooses: `user_turn` (the
        default) or `system`, as the client sent it. It applies on every
        door, to a `developer` message after the first turn as well, and
        a leading run of system messages becomes one.

        This one was found by the live run and not by the unit tests,
        because the unit fixtures came from a capture of a *simple*
        request and this shape appears only once tools are in play.
        Recorded in `docs/acceptance/anthropic-messages-measurement.md`.
      additionalProperties: true
      required:
        - role
        - content
      properties:
        role:
          type: string
          enum:
            - user
            - assistant
            - system
        content:
          description: |
            A plain string, or a list of blocks. Both forms arrive from
            real clients in the same conversation.
          oneOf:
            - type: string
            - type: array
              items:
                $ref: '#/components/schemas/AnthropicContentBlock'

    AnthropicContentBlock:
      type: object
      description: |
        One content block. **Modelled loosely on purpose**: the variants
        differ by `type` and a strict `oneOf` here would generate a
        union that rejects the next block type Anthropic adds, on a wire
        we do not own.

        The variants this gateway carries: `text` (`text`), `image`
        (`source`, base64 only -- see the endpoint), `document`
        (`source`, a base64 PDF or plain text; `title`), `tool_use`
        (`id`, `name`, `input`), `tool_result` (`tool_use_id`,
        `content`, `is_error`), and `thinking` (`thinking`,
        `signature`) -- returned ahead of the answer when the request
        enabled thinking, and read back on an assistant turn as that
        turn's reasoning. `redacted_thinking` is accepted on the way in
        and dropped. `search_result` (`source`, a string here; `title`;
        `content`, text blocks; `citations`) is read as text, numbered
        across the request (MR9a; see the endpoint). `server_tool_use` and
        `web_search_tool_result` (P8)
        are returned for a search this install ran and, handed back on
        an assistant turn, become that turn's history: the query, and
        each result's title, address and the excerpt the model read,
        which `encrypted_content` carries (readable only here, as a
        thinking block's `signature` is). A `web_search_tool_result`
        whose provider's terms require something shown with its results
        carries it as `x_eugene_plexus.search_suggestions` (HTML:
        Google's Search Suggestions).

        `document` was refused with a 400 until 2026-09-28, and `image`
        until 2026-09-23, on one reasoning: a model that never received
        the attachment is not answering the question that was asked.
        Each began to be carried once a backend that confirms that input
        could be routed to.
      additionalProperties: true
      required:
        - type
      properties:
        type:
          type: string
          description: '`text`, `tool_use`, `tool_result`, `image`, `document`, `thinking`, …'
        text:
          type: string
        id:
          type: string
          description: 'On `tool_use`: the id a matching `tool_result` refers to.'
        name:
          type: string
          description: 'On `tool_use`: the tool being called.'
        input:
          type: object
          additionalProperties: true
          description: 'On `tool_use`: the arguments object, already parsed.'
        tool_use_id:
          type: string
          description: 'On `tool_result`: which call this answers.'
        content:
          description: |
            On `tool_result`: the result, as a string or as a list of
            blocks. Claude Code sends a plain string for text, and for
            its `Read` of an image a list holding one `image` block and
            no text -- whose picture is carried on the next user message,
            since a `tool` message carries text only.
          oneOf:
            - type: string
            - type: array
              items:
                $ref: '#/components/schemas/AnthropicContentBlock'
        is_error:
          type: boolean
          description: |
            On `tool_result`: the tool failed. Carried into the `tool`
            message's text rather than dropped, because a harness that
            cannot see its own tool failed will call it again.
        thinking:
          type: string
          description: 'On `thinking`: the model''s reasoning, as the backend reported it.'
        signature:
          type: string
          description: |
            On `thinking`: opaque to the client, as Anthropic's is. From
            this gateway it is empty when the text is shown, and
            `eugene-plexus-reasoning-v1:<base64 of the reasoning>` when
            the request asked for `display: "omitted"` -- so a client
            that echoes the block back unchanged, as Anthropic tells it
            to, returns the reasoning for the next turn. Not Anthropic's
            signature and not verifiable by Anthropic; a signature
            without that prefix is ignored on the way in.
        source:
          description: |
            On `image`: `{"type": "base64", "media_type": "image/png",
            "data": "<base64>"}`. `media_type` is `image/png`,
            `image/jpeg`, `image/gif` or `image/webp`; the last two are
            re-encoded to PNG. A `url` or `file` source is refused. On
            `search_result`: a string, the URL or identifier the result
            came from (MR9a).
          oneOf:
            - type: object
              additionalProperties: true
            - type: string
        cache_control:
          type: object
          additionalProperties: true

    AnthropicSystemBlock:
      type: object
      additionalProperties: true
      required:
        - type
      properties:
        type:
          type: string
          enum:
            - text
        text:
          type: string
        cache_control:
          type: object
          additionalProperties: true

    AnthropicToolDefinition:
      type: object
      description: |
        A tool the model may call. `name` plus `input_schema` map
        directly onto an OpenAI function's `name` and `parameters`.

        A definition carrying a `type` naming a server-side tool —
        anything this gateway would have to execute itself, rather than
        hand back to the caller — is refused with a 400, **except web
        search** (`web_search_<date>`), which this install's search
        account runs since P8, **and the memory tool**
        (`memory_20250818`, named `memory`), which is client-run by
        definition and becomes a function whose calls come back to the
        caller (MR9a). There is no sandbox to run code in, and
        pretending otherwise would fail at the moment the model chose to
        use one. The refusal's message contains `Input tag '<type>'`, the
        wording Claude Code (2.1.280 and later) looks for to retry
        without an optional server tool such as its advisor.
      additionalProperties: true
      required:
        - name
      properties:
        name:
          type: string
        description:
          type: string
        input_schema:
          type: object
          additionalProperties: true
          description: JSON Schema for the tool's arguments.
        type:
          type: string
          description: |
            Present only for server-side tools. Its presence is what the
            refusal keys on.
        cache_control:
          type: object
          additionalProperties: true

    AnthropicToolChoice:
      type: object
      description: |
        How the model should use `tools`. `auto`, `any`, `tool` (with a
        `name`) or `none`, mapped onto the OpenAI equivalents — `any`
        becomes `required`, which is the closest honest reading.
      additionalProperties: true
      required:
        - type
      properties:
        type:
          type: string
          enum:
            - auto
            - any
            - tool
            - none
        name:
          type: string
          description: 'With `type: tool`: which one.'
        disable_parallel_tool_use:
          type: boolean
          description: |
            Carried as the backend's `parallel_tool_calls` with the
            opposite sense: true asks for at most one tool call per
            turn. **Silently dropped until 2026-09-23**, which broke the
            rule that a setting changing the answer is refused or
            honoured, never discarded.

    AnthropicMessageResponse:
      type: object
      description: |
        A completed message. The `x_eugene_plexus` envelope the OpenAI
        door adds to its response body is **not** here — it rides on
        response headers instead, because a strict Anthropic client is
        exactly who this door is for and an unknown top-level key is a
        risk with no upside.
      required:
        - id
        - type
        - role
        - content
        - model
      properties:
        id:
          type: string
        type:
          type: string
          enum:
            - message
        role:
          type: string
          enum:
            - assistant
        model:
          type: string
          description: |
            The model that actually answered, which after a cascade is
            not necessarily the one that was asked for.
        content:
          type: array
          items:
            $ref: '#/components/schemas/AnthropicContentBlock'
          description: |
            A `thinking` block first when the request enabled thinking
            and the backend reported reasoning, then `text` and
            `tool_use` blocks in the order the backend produced them.
        stop_reason:
          type:
            - string
            - 'null'
          enum:
            - end_turn
            - max_tokens
            - stop_sequence
            - tool_use
            - refusal
            - null
          description: |
            Mapped from the backend's finish reason: `stop` becomes
            `end_turn`, `length` becomes `max_tokens`, `tool_calls`
            becomes `tool_use`, and **since 2026-09-19 a backend's
            `content_filter` becomes `refusal`** — Anthropic's own name
            for a classifier stopping the answer, so a client switching
            on this field gets a value from the vocabulary it already
            parses rather than one we invented. Not verified against a
            live Anthropic SDK; the OpenAI door's `content_filter` was.

            A backend error still reports `end_turn`, because there is
            no Anthropic stop reason for *the backend broke* and the
            truncation is reported where it can be acted on — the log
            line and the metrics row.
        stop_sequence:
          type:
            - string
            - 'null'
          description: |
            Which `stop_sequences` entry ended the answer, with
            `stop_reason: stop_sequence`, when the backend says so. vLLM
            does; **llama.cpp does not** -- it reports a matched stop
            string and a natural end identically -- so behind llama.cpp
            this stays null and `stop_reason` reads `end_turn`.
        usage:
          $ref: '#/components/schemas/AnthropicUsage'

    AnthropicUsage:
      type: object
      description: |
        Token counts, renamed from the backend's OpenAI-shaped `usage`.

        **Anthropic's `input_tokens` excludes cached input and ours
        follows it**: when the backend reports how much of the prompt
        came from its cache (llama.cpp and vLLM both do), that part is
        `cache_read_input_tokens` and `input_tokens` is the rest, so the
        three fields sum to the prompt the way a client that computes
        context usage expects. Reported as zero when the backend says
        nothing -- an honest nothing rather than an absence to guess
        about. `cache_creation_input_tokens` is always zero: a local
        engine's cache is not something a request pays to write.
      required:
        - input_tokens
        - output_tokens
      properties:
        input_tokens:
          type: integer
        output_tokens:
          type: integer
        cache_creation_input_tokens:
          type: integer
          default: 0
        cache_read_input_tokens:
          type: integer
          default: 0
        server_tool_use:
          type: object
          description: |
            Present when this install ran searches for the request (P8):
            `{"web_search_requests": N}`, as Anthropic reports its own.
          properties:
            web_search_requests:
              type: integer
              minimum: 0

    AnthropicStreamEvent:
      type: object
      description: |
        One frame of the Anthropic event stream. Each SSE frame carries
        both an `event:` name and a `data:` object whose `type` repeats
        it; a client may read either, so both are always sent.

        The order is `message_start`, then per content block
        `content_block_start` → `content_block_delta`* →
        `content_block_stop`, then `message_delta` carrying
        `stop_reason` and final `usage`, then `message_stop`. **There is
        no `[DONE]` sentinel.**

        `message_start` is emitted on the **first event from the
        driver**, never on request acceptance — it names the model, and
        until the first token the cascade can still change which backend
        answers.

        An `error` event is how a truncation is reported once the status
        code is long gone: a stream that has emitted a token cannot fail
        over, so it stops, says why, and still closes with
        `message_stop` so a client's state machine does not hang.
      additionalProperties: true
      required:
        - type
      properties:
        type:
          type: string
          enum:
            - message_start
            - content_block_start
            - content_block_delta
            - content_block_stop
            - message_delta
            - message_stop
            - ping
            - error
        index:
          type: integer
          description: |
            Which content block, on the three `content_block_*` events.
            **Assigned by the gateway, statefully**: our internal stream
            numbers tool-call fragments per call and gives text no index
            at all, so the translator holds the open text block and a
            map from tool-call index to block index.
        message:
          type: object
          additionalProperties: true
        content_block:
          $ref: '#/components/schemas/AnthropicContentBlock'
        delta:
          type: object
          additionalProperties: true
          description: |
            `{"type": "text_delta", "text": …}` for prose,
            `{"type": "thinking_delta", "thinking": …}` for reasoning
            (none under `display: "omitted"`), a closing
            `{"type": "signature_delta", "signature": …}` on an omitted
            thinking block,
            `{"type": "input_json_delta", "partial_json": …}` for a tool
            call's arguments, and on `message_delta` the `stop_reason`
            and `stop_sequence`.
        usage:
          $ref: '#/components/schemas/AnthropicUsage'
        error:
          type: object
          additionalProperties: true

    AnthropicErrorResponse:
      type: object
      description: |
        Anthropic's error envelope. The rest of this gateway returns RFC
        7807 `problem+json` and the OpenAI doors return OpenAI's shape;
        this is the third foreign convention on this component, honoured
        exactly for the same reason as the second — a client parses it
        to build its exception, and anything else reports as an
        unhelpful generic failure.
      required:
        - type
        - error
      properties:
        type:
          type: string
          enum:
            - error
        error:
          type: object
          required:
            - type
            - message
          properties:
            type:
              type: string
              description: |
                `invalid_request_error`, `authentication_error`,
                `permission_error`, `not_found_error`,
                `rate_limit_error`, `api_error`, `overloaded_error`.
            message:
              type: string
              description: |
                Human-readable, and **it has to carry the whole
                explanation** — measured, a 400 and a 403 are shown to
                the user verbatim while a 404's message is discarded,
                which is why this door answers 400 for a model nothing
                serves. A prompt too long for the model's context begins
                `prompt is too long`, the wording Claude Code compacts on.

    ResponsesInputTokens:
      type: object
      required: [object, input_tokens]
      properties:
        object:
          type: string
          const: response.input_tokens
        input_tokens:
          type: integer
          minimum: 0

    ResponsesRequest:
      type: object
      description: |
        Request body for `POST /v1/responses`, in OpenAI's shape. Like
        `AnthropicMessagesRequest`, **this schema is what the gateway
        reads, not what it refuses**: the refusals are enforced against
        the raw body by the implementation, with a 400 naming the field,
        and the endpoint description lists them. A top-level field not
        named here is refused.
      additionalProperties: true
      required:
        - model
        - input
      properties:
        model:
          type: string
          description: A model id from `GET /v1/models`, resolved against this install's slots.
        input:
          description: |
            A string (one user message), or the conversation as a list of
            items. Codex resends the whole conversation on every turn.
          oneOf:
            - type: string
            - type: array
              items:
                $ref: '#/components/schemas/ResponsesInputItem'
        instructions:
          type:
            - string
            - 'null'
          description: The leading system message.
        tools:
          type: array
          items:
            $ref: '#/components/schemas/ResponsesTool'
        tool_choice:
          description: |
            `auto`, `none`, `required`, or an object forcing a declared
            client-run tool: `function` or `custom` with `name`, or
            `local_shell`, `shell` or `apply_patch` by `type`. An
            undeclared or refused tool is a 400 naming the cause.
          oneOf:
            - type: string
              enum: [auto, none, required]
            - type: object
              additionalProperties: true
        parallel_tool_calls:
          type:
            - boolean
            - 'null'
        stream:
          type:
            - boolean
            - 'null'
          description: Codex sets this on every request.
        temperature:
          type:
            - number
            - 'null'
          minimum: 0
          maximum: 2
        top_p:
          type:
            - number
            - 'null'
          minimum: 0
          maximum: 1
        max_output_tokens:
          type:
            - integer
            - 'null'
          minimum: 1
          description: |
            Absent means no cap here -- see "No cap from the install
            default" on the endpoint. The model's settings profile still
            applies.
        text:
          type:
            - object
            - 'null'
          additionalProperties: true
          description: |
            `format` (`text`, `json_object`, or `json_schema` with `name`,
            `schema`, `strict`, `description`) is carried as the backend's
            response format. `verbosity` is accepted and not honoured.
        reasoning:
          type:
            - object
            - 'null'
          additionalProperties: true
          description: |
            `effort` is carried to supporting backends, otherwise omitted and
            named as `reasoning.effort` on the ignored-settings header. `summary`
            is accepted and not honoured, and named when set. Codex sends null
            for a model id it does not know.
        include:
          type:
            - array
            - 'null'
          items:
            type: string
          description: |
            `reasoning.encrypted_content` is honoured. The server-side tool
            includes are accepted (nothing here produces those items).
            `message.output_text.logprobs` is refused.
        store:
          type:
            - boolean
            - 'null'
          description: Nothing is ever stored; `true` is named on the ignored-settings header.
        previous_response_id:
          type:
            - string
            - 'null'
          description: Refused when set. This gateway keeps no response store.
        truncation:
          type:
            - string
            - 'null'
          enum: [auto, disabled, null]
        metadata:
          type:
            - object
            - 'null'
          additionalProperties: true
        client_metadata:
          type:
            - object
            - 'null'
          additionalProperties: true
          description: Sent by Codex (`x-codex-installation-id`). Discarded.
        prompt_cache_key:
          type:
            - string
            - 'null'
          description: Sent by Codex (the session id). A local engine keeps its own cache.
        user:
          type:
            - string
            - 'null'
        safety_identifier:
          type:
            - string
            - 'null'
        service_tier:
          type:
            - string
            - 'null'
        max_tool_calls:
          type:
            - integer
            - 'null'
        top_logprobs:
          type:
            - integer
            - 'null'
        background:
          type:
            - boolean
            - 'null'
        stream_options:
          type:
            - object
            - 'null'
          additionalProperties: true
        prompt_cache_retention:
          type:
            - string
            - 'null'
        conversation:
          description: Refused when set. Conversations are stored objects.
        prompt:
          description: Refused when set. A stored prompt template exists only at OpenAI.

    ResponsesCompactRequest:
      type: object
      description: |
        Request for standalone compaction. The model and conversation are
        required while no response store exists. Unknown top-level fields
        are refused with a 400 naming the field.
      additionalProperties: true
      required:
        - model
        - input
      properties:
        model:
          type: string
          description: A model id from `GET /v1/models`, resolved against this install's slots.
        input:
          description: |
            A string (one user message), or the conversation as a list of
            items. Codex resends the whole conversation on every turn.
          oneOf:
            - type: string
            - type: array
              items:
                $ref: '#/components/schemas/ResponsesInputItem'
        instructions:
          type:
            - string
            - 'null'
          description: Summary guidance carried alongside the fixed compaction prompt.
        previous_response_id:
          type:
            - string
            - 'null'
          description: Refused when set until row 54 supplies chain loading; send input instead.

    ResponsesCompactResponse:
      type: object
      description: |
        OpenAI's compacted response, with output items ending with a
        `compaction` item (`id`, `type: compaction`, `encrypted_content`).
        Send the whole output array back as the next input window.
      additionalProperties: true
      required:
        - id
        - object
        - created_at
        - output
        - usage
      properties:
        id:
          type: string
        object:
          type: string
          const: response.compaction
        created_at:
          type: integer
          description: Unix timestamp in seconds.
        output:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ResponsesOutputItem'
        usage:
          $ref: '#/components/schemas/ResponsesUsage'

    ResponsesInputItem:
      type: object
      description: |
        One conversation item. **Modelled loosely on purpose**, as
        `AnthropicContentBlock` is: the variants differ by `type`, and a
        strict union would reject the next item type on a wire we do not
        own.

        Carried: `message` (`role` user, assistant, system or developer;
        `content` a string or parts; `type` may be omitted), `function_call`
        (`call_id`, `name`, `arguments` as a JSON string, and `namespace`
        when the call was to a member of a `namespace` tool),
        `function_call_output` (`call_id`, `output` as a string or a list
        of `input_text` / `input_image` parts), `custom_tool_call`
        (`call_id`, `name`, `input`), `local_shell_call` and `shell_call`
        (`call_id`, `action`), and `apply_patch_call` (`call_id`,
        `operation`). Their `custom_tool_call_output`,
        `local_shell_call_output`, `shell_call_output` and
        `apply_patch_call_output` become tool results by `call_id`
        (a legacy local-shell output may use `id` instead).
        A `compaction` item's authenticated `encrypted_content` is
        expanded into a developer message with the summary; an
        unauthenticated item is a 400 (see `/v1/responses/compact`).
        Also carried: `reasoning`
        (`content` of `reasoning_text` parts, `encrypted_content`), and a
        `web_search_call` handed back (P8), which becomes a line of the
        assistant's history naming the search and its sources, and an
        `image_generation_call` handed back (P8e), which becomes a line
        naming the prompt the image was made for -- its base64 is not
        sent to the model.
        Remote MCP's items (row 59b): `mcp_list_tools` (`server_label`,
        `tools`) is the server's tool list, used instead of listing again;
        `mcp_call` (`server_label`, `name`, `arguments`, `output`, `error`,
        `approval_request_id`) becomes the call and its result in the
        history; `mcp_approval_request` (`id`, `server_label`, `name`,
        `arguments`) becomes the call the model asked for, and
        `mcp_approval_response` (`approval_request_id`, `approve`,
        `reason`) answers it -- an approval whose id no request in `input`
        carries is a 400.
        Codex drops `id` and `status` when it sends items back
        (measured), so neither is required. Refused: `item_reference` and
        any other type.
      additionalProperties: true
      properties:
        type:
          type: string
        id:
          type: string
          description: Optional item id; also the legacy local-shell output's call id.
        role:
          type: string
        content:
          description: A string, or a list of parts.
        call_id:
          type: string
        name:
          type: string
        namespace:
          type: string
          description: The `namespace` tool a `function_call` was to (Codex 0.133 and later).
        arguments:
          type: string
        input:
          type: string
          description: Free-text input of a custom tool call.
        action:
          $ref: '#/components/schemas/ResponsesToolAction'
        operation:
          $ref: '#/components/schemas/ResponsesPatchOperation'
        status:
          type: string
          description: A call's status; an apply-patch output reports completed or failed.
        max_output_length:
          type:
            - integer
            - 'null'
          description: Carried on shell output when present on its call.
        output:
          description: |
            A function or custom result is a string or a list of
            `input_text` / `input_image` parts. A local-shell result is a
            string. A shell result is a list of objects with `stdout`,
            `stderr` and `outcome` (`type: exit` with `exit_code`, or
            `type: timeout`). An apply-patch result is an optional string;
            its status and observed failure text are carried to the model.
        summary:
          type: array
          items:
            type: object
            additionalProperties: true
        encrypted_content:
          type:
            - string
            - 'null'
          description: |
            Reasoning's existing carrier, or a compaction item's encrypted
            and authenticated summary. A compaction requires a nonempty
            string that this gateway can authenticate before using it.
        server_label:
          type: string
          description: The MCP server an `mcp_*` item belongs to (row 59b).
        approval_request_id:
          type:
            - string
            - 'null'
          description: |
            On `mcp_approval_response`, the `mcp_approval_request` it
            answers; on `mcp_call`, the approval it ran under.
        approve:
          type: boolean
          description: An `mcp_approval_response`'s answer.
        reason:
          type:
            - string
            - 'null'
          description: Why an approval was given or refused; told to the model when refused.
        error:
          description: An `mcp_call`'s or `mcp_list_tools`' failure, as words.
        tools:
          type: array
          description: An `mcp_list_tools` item's tools (`name`, `description`, `input_schema`, `annotations`).
          items:
            type: object
            additionalProperties: true

    ResponsesToolAction:
      type: object
      description: |
        A local-shell `exec` action has `type: exec`, `command`, `env`,
        and optional `working_directory`, `timeout_ms` and `user`.
        A shell action has `commands`, `timeout_ms` and
        `max_output_length`. The gateway returns these for the client to
        execute. Other action fields remain open for existing search items.
      additionalProperties: true
      properties:
        type:
          type: string
        command:
          type: array
          items:
            type: string
        commands:
          type: array
          items:
            type: string
        working_directory:
          type: string
        env:
          type: object
          additionalProperties:
            type: string
        user:
          type: string
        timeout_ms:
          type:
            - integer
            - 'null'
        max_output_length:
          type:
            - integer
            - 'null'

    ResponsesPatchOperation:
      type: object
      description: |
        OpenAI's file operation for a client-run apply-patch call.
        `create_file` and `update_file` include a V4A `diff`;
        `delete_file` needs only `path`. The client applies the operation
        and reports completed or failed with its observed cause.
      additionalProperties: true
      required:
        - type
        - path
      properties:
        type:
          type: string
          enum: [create_file, delete_file, update_file]
        path:
          type: string
        diff:
          type: string

    ResponsesTool:
      type: object
      description: |
        A `function` tool (`name`, `description`, `parameters`, `strict`)
        maps onto an OpenAI chat function. A `namespace` tool (`name`,
        `description`, `tools`) offers each of its `function` members the
        same way and marks calls to them with its `namespace` (see the
        endpoint). `web_search` runs on this install's search account, or
        is removed and named when it cannot (see the endpoint);
        `image_generation` runs on this install's image models, or is
        refused naming why (P8e). `mcp` (`server_label`, `server_url`,
        `headers`, `authorization`, `allowed_tools`, `require_approval`,
        `server_description`) is a remote MCP server the gateway lists
        and calls through a tool-driver (row 59b, "Remote MCP" above).

        `custom` (`name`, `description`, `format`) maps to a function with
        one string parameter `input`; `local_shell` maps to a function
        with `command`, `workdir`, `timeout_ms` and `env`; `shell` maps
        to a function with `commands`, `timeout_ms` and
        `max_output_length`; `apply_patch` maps to a function with one
        string parameter `input`, the patch. The client executes their
        calls; the gateway translates them into their Responses item
        types. A shell's `environment` may be absent or `type: local`;
        hosted containers are refused because no shell execution service
        exists here. Other tool types are refused with the causes and
        alternatives on `/v1/responses`.
      additionalProperties: true
      required:
        - type
      properties:
        type:
          type: string
        name:
          type: string
        tools:
          type: array
          description: A `namespace` tool's members, each a tool object of its own.
          items:
            type: object
            additionalProperties: true
        description:
          type: string
        parameters:
          type: object
          additionalProperties: true
        strict:
          type:
            - boolean
            - 'null'
        format:
          type: object
          description: |
            A custom tool's free-text format, or grammar (Lark or regex).
            Grammars are not enforced: they are included in the function
            description and named as `tools[i].format` on
            `x-eugene-plexus-ignored-settings`. No constrained output is claimed.
          additionalProperties: true
          required:
            - type
          properties:
            type:
              type: string
              enum: [text, grammar]
            syntax:
              type: string
              enum: [lark, regex]
            definition:
              type: string
        environment:
          type: object
          description: |
            A shell tool's execution environment. Only the client's local
            environment is supported; hosted containers are refused.
          additionalProperties: true
          properties:
            type:
              type: string
        server_label:
          type: string
          description: An `mcp` tool's name for its server, unique in the request.
        server_url:
          type: string
          description: |
            An `mcp` tool's Streamable HTTP endpoint. `https` on the
            internet under the default `remoteMcp`; see "Remote MCP".
        server_description:
          type: string
          description: An `mcp` tool's words about its server, added to each of its tools' descriptions.
        headers:
          type:
            - object
            - 'null'
          additionalProperties:
            type: string
          description: |
            An `mcp` tool's headers for its server, sent for this request
            only and never echoed, logged or kept. Headers that frame the
            request (`Host`, `Content-Type`, `Accept`, ...) are refused.
        authorization:
          type:
            - string
            - 'null'
          description: |
            An `mcp` tool's OAuth access token, sent as `Authorization:
            Bearer`, under the same rules as `headers`.
        allowed_tools:
          description: An `mcp` tool's tool names to offer, as a list or `{"tool_names"}`.
        require_approval:
          description: |
            `always` (the default), `never`, or `{"always": {"tool_names"},
            "never": {"tool_names"}}`.

    ResponsesResponse:
      type: object
      description: |
        A response object. `output` holds a `reasoning` item first when
        the model reasoned, then a `message` with one `output_text` part,
        then one call item per tool call, using the declared tool's type
        (`function_call`, `custom_tool_call`, `local_shell_call`,
        `shell_call` or `apply_patch_call`). The request's settings
        are echoed as OpenAI echoes them; `store` is always false.
      additionalProperties: true
      required:
        - id
        - object
        - created_at
        - status
        - model
        - output
      properties:
        id:
          type: string
        object:
          type: string
          enum: [response]
        created_at:
          type: integer
        status:
          type: string
          enum: [completed, incomplete, failed, in_progress]
          description: |
            `incomplete` when the answer was cut at the output cap
            (`incomplete_details.reason: max_output_tokens`) or by a
            content filter (`content_filter`).
        incomplete_details:
          type:
            - object
            - 'null'
          additionalProperties: true
        error:
          type:
            - object
            - 'null'
          additionalProperties: true
        model:
          type: string
          description: The model that answered, which after a cascade may not be the one asked for.
        output:
          type: array
          items:
            $ref: '#/components/schemas/ResponsesOutputItem'
        usage:
          $ref: '#/components/schemas/ResponsesUsage'

    ResponsesOutputItem:
      type: object
      description: |
        `{"type": "reasoning", "id", "summary": [], "content":
        [{"type": "reasoning_text", "text"}], "encrypted_content"?}`,
        `{"type": "message", "id", "role": "assistant", "status",
        "content": [{"type": "output_text", "text", "annotations": []}]}`,
        `{"type": "function_call", "id", "status", "call_id", "name",
        "arguments", "namespace"?}` (`namespace` when the call is to a
        member of a `namespace` tool), for a search this install ran (P8),
        `{"type": "web_search_call", "id", "status", "action": {"type":
        "search", "query", "sources": [{"type": "url", "url"}]},
        "x_eugene_plexus"?: {"search_suggestions": html}}` (the HTML the
        search provider's terms require shown with its results: Google's
        Search Suggestions), or for
        an image it made (P8e), `{"type": "image_generation_call", "id",
        "status", "result", "revised_prompt", "size", "quality",
        "background", "output_format", "action": "generate"}` -- `result`
        the base64 image, null and `status: failed` when none was made.
        Remote MCP (row 59b) adds `{"type": "mcp_list_tools", "id",
        "server_label", "tools": [{"name", "description", "input_schema",
        "annotations"}]}`, `{"type": "mcp_call", "id", "status",
        "server_label", "name", "arguments", "output", "error",
        "approval_request_id"}` and `{"type": "mcp_approval_request", "id",
        "server_label", "name", "arguments"}`.

        Client-run calls are `custom_tool_call` (`id`, `call_id`, `name`,
        `input`), `local_shell_call` and `shell_call` (`id`, `call_id`,
        `status`, `action`), and `apply_patch_call` (`id`, `call_id`,
        `status`, `operation`). Standalone compact returns a `compaction`
        item (`id`, `encrypted_content`, the encrypted and authenticated
        summary); it can be passed back unchanged to any model here.
      additionalProperties: true
      required:
        - type
      properties:
        type:
          type: string
          enum:
            - reasoning
            - message
            - function_call
            - web_search_call
            - image_generation_call
            - mcp_list_tools
            - mcp_call
            - mcp_approval_request
            - custom_tool_call
            - local_shell_call
            - shell_call
            - apply_patch_call
            - compaction
        id:
          type: string
        call_id:
          type: string
        name:
          type: string
        input:
          type: string
          description: Free-text input of a custom tool call.
        status:
          type: string
        action:
          $ref: '#/components/schemas/ResponsesToolAction'
        operation:
          $ref: '#/components/schemas/ResponsesPatchOperation'
        encrypted_content:
          type: string
          description: An opaque compaction summary or the existing reasoning carrier.

    ResponsesUsage:
      type: object
      description: |
        Token counts in OpenAI's names. **Unlike Anthropic's,
        `input_tokens` includes cached input**; `input_tokens_details` and
        `output_tokens_details` appear only when the backend reported them.
      required:
        - input_tokens
        - output_tokens
        - total_tokens
      properties:
        input_tokens:
          type: integer
        output_tokens:
          type: integer
        total_tokens:
          type: integer
        input_tokens_details:
          type: object
          additionalProperties: true
        output_tokens_details:
          type: object
          additionalProperties: true

    ResponsesStreamEvent:
      type: object
      description: |
        One frame of the Responses event stream. The SSE `event:` name
        and `data.type` always agree, and every frame has a
        `sequence_number`.

        Custom input uses `response.custom_tool_call_input.delta` (`delta`)
        and `.done` (`input`), with `item_id` and `output_index`. Shell
        commands use `response.shell_call_command.added`, `.delta` and
        `.done`, with `command_index` and `output_index`; added and done
        carry `command`, delta carries `delta`. All client call types,
        including `local_shell_call` and `apply_patch_call`, also use
        `response.output_item.added` and `response.output_item.done` with
        their Responses `item`, including the complete action or operation
        on done. Internal function-adapter arguments are not exposed as
        function-call events for these client-run tools.
      additionalProperties: true
      required:
        - type
        - sequence_number
      properties:
        type:
          type: string
          enum:
            - response.created
            - response.in_progress
            - response.output_item.added
            - response.output_item.done
            - response.content_part.added
            - response.content_part.done
            - response.output_text.delta
            - response.output_text.done
            - response.reasoning_text.delta
            - response.reasoning_text.done
            - response.function_call_arguments.delta
            - response.function_call_arguments.done
            - response.custom_tool_call_input.delta
            - response.custom_tool_call_input.done
            - response.shell_call_command.added
            - response.shell_call_command.delta
            - response.shell_call_command.done
            - response.completed
            - response.incomplete
            - response.failed
        sequence_number:
          type: integer
        response:
          $ref: '#/components/schemas/ResponsesResponse'
        item:
          $ref: '#/components/schemas/ResponsesOutputItem'
        item_id:
          type: string
        output_index:
          type: integer
          minimum: 0
        command_index:
          type: integer
          minimum: 0
        delta:
          type: string
        input:
          type: string
        command:
          type: string

    SystemOneRequest:
      type: object
      description: |
        The pinned TypeSafe System One request, verbatim — see
        `POST /v1/systemone`. `model` is a public Eugene alias.
      required:
        - model
        - state
        - questions
      properties:
        model:
          type: string
          description: Public model alias, resolved through the routing table.
        state:
          description: What is being judged — text, or structured data.
          oneOf:
            - type: string
            - type: object
              additionalProperties: true
            - type: array
              items: {}
        questions:
          type: object
          minProperties: 1
          additionalProperties:
            $ref: '#/components/schemas/SystemOneQuestion'

    SystemOneQuestion:
      type: object
      description: |
        One typed question. `criteria`'s shape depends on `type` and is
        validated against the pinned protocol before any backend work:
        `noul` takes an optional `{true, false}` outcome map, `choice` a
        required map of 1-255 option names to rubric text or null,
        `score` a required array of 2-10 ordered level descriptions.
        Unknown fields are refused, never dropped.
      required:
        - type
        - instructions
      properties:
        type:
          type: string
          enum: [noul, choice, score]
        instructions:
          oneOf:
            - type: string
            - type: object
              additionalProperties: true
            - type: array
              items: {}
        criteria:
          description: Shape depends on `type`; see above.

    SystemOneAnswer:
      type: object
      description: |
        One answer, in TypeSafe's response vocabulary: `noul` carries
        `noul`; `choice` carries `choice`, `probabilities` and
        `confidence`; `score` carries `score`, `legend`, `probabilities`
        and `confidence`. Validated at the driver before this gateway
        forwards it — a malformed backend answer became a 502, not a
        half-shaped object here.
      required:
        - type
      properties:
        type:
          type: string
          enum: [noul, choice, score]
        noul:
          type: number
          minimum: 0
          maximum: 1
        choice:
          type: string
        score:
          type: number
        legend:
          type: object
          additionalProperties:
            type: string
        probabilities:
          type: object
          additionalProperties:
            type: number
        confidence:
          type: number
          minimum: 0
          maximum: 1

    SystemOneUsage:
      type: object
      description: |
        Token accounting in TypeSafe's own field names. Reported as the
        backend reported it; absent accounting stays absent.
      properties:
        input_tokens:
          type: integer
          minimum: 0
        output_tokens:
          type: integer
          minimum: 0

    SystemOneResponse:
      type: object
      required:
        - model
        - answers
      properties:
        model:
          type: string
          description: |
            The public alias that served the request — after a cascade
            it names what answered, exactly as the chat doors do. The
            backend's own model revision is preserved on the driver's
            `reportedModel` for provenance and surfaced as
            `x_eugene_plexus.reported_model`.
        answers:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/SystemOneAnswer'
        usage:
          $ref: '#/components/schemas/SystemOneUsage'
        x_eugene_plexus:
          $ref: '#/components/schemas/CompletionRoutingInfo'

    OpenAIErrorResponse:
      type: object
      description: |
        Error envelope for the OpenAI-compatible operations, `/v1/responses`
        included. The rest of the gateway returns RFC 7807 `problem+json`;
        these cannot, because OpenAI SDKs parse this shape to build their
        exceptions and would report a problem+json body as an unhelpful
        generic failure. One surface, one foreign convention, honoured
        exactly.
      required:
        - error
      properties:
        error:
          type: object
          required:
            - message
            - type
          properties:
            message:
              type: string
              description: |
                Human-readable failure. Names the model and, on a
                cascade, that every backend was tried — the operator
                reading it is usually the person who configured the
                thing.
            type:
              type: string
              description: |
                OpenAI-style class, e.g. `invalid_request_error`. The
                gateway also emits `upstream_error`, `timeout`,
                `service_unavailable`, `client_disconnected` and —
                since 2026-09-19 — **`upstream_auth_error`**, which is
                the one that says the fault is ours rather than the
                caller's: a driver refused the gateway's credential,
                or (since 2026-09-28) a provider refused a driver's own
                key.
            param:
              type:
                - string
                - 'null'
            code:
              type:
                - string
                - 'null'

    # -------- Retained request metrics (M8) --------

    Percentiles:
      type: object
      description: |
        A latency distribution, in milliseconds. Percentiles rather than
        a mean because generation latency is long-tailed, and a mean
        hides exactly the requests an operator is asking about.
      required:
        - p50
        - p90
        - max
      properties:
        p50:
          type: integer
          minimum: 0
        p90:
          type: integer
          minimum: 0
        p99:
          type: integer
          minimum: 0
        max:
          type: integer
          minimum: 0

    Throughput:
      type: object
      description: |
        Completion tokens per second, computed from the **serving
        attempt's** elapsed time — not the request total, which
        includes failed attempts.

        `samples` is how many requests in the group actually reported
        token usage, and can be lower than the group's `requests`. A
        group where nothing reported usage is not given a zeroed
        `Throughput`: the field is null instead, so "unmeasured" and
        "zero" stay distinguishable.
      required:
        - p50
        - samples
      properties:
        p50:
          type: number
        p90:
          type: number
        samples:
          type: integer
          minimum: 1

    MetricsGroup:
      type: object
      description: |
        One dimension tuple's numbers over the window, or over one hour
        of it when `bucket=hour`. Under `groupBy=model` the backend
        dimensions (`driver`, `runtime`, `node`, `backend`) are absent;
        under `groupBy=total`, `model` is too.
      required:
        - requests
        - errors
        - cascaded
        - swappedIn
        - latencyMs
      properties:
        bucketStart:
          type: string
          format: date-time
          description: Present only when `bucket=hour`.
        model:
          type: string
          description: |
            The model id the client **asked for**. After a cascade this
            is not what answered — `driver` and `runtime` say that —
            and grouping by the requested id is what makes "this model
            is slow" answerable at all.
        driver:
          type: string
        runtime:
          type:
            - string
            - 'null'
          description: |
            The engine runtime behind the driver, by name so replicas
            are distinguished. Null for hosted and CLI backends, which
            have no runtime of ours.
        node:
          type:
            - string
            - 'null'
          description: Which host's agent supervises it. Null before enrollment.
        backend:
          $ref: 'components/common.yaml#/components/schemas/BackendKind'
        requests:
          type: integer
          minimum: 0
        errors:
          type: integer
          minimum: 0
          description: Requests that ended with no backend having served them.
        cascaded:
          type: integer
          minimum: 0
          description: |
            Requests with `attempts > 1`. A cascade that silently
            always works hides a broken primary, which is why this is
            counted rather than only logged.
        swappedIn:
          type: integer
          minimum: 0
          description: |
            Requests that had to wake a `startOnDemand` runtime. The
            measured cost of M6's idle unload, which shipped with no
            way to see what it costs.
        latencyMs:
          $ref: '#/components/schemas/Percentiles'
        tokensPerSecond:
          oneOf:
            - $ref: '#/components/schemas/Throughput'
            - type: 'null'
          description: |
            Null when no request in this group reported token usage.
            Whole-attempt rate: the serving attempt's elapsed time
            includes prefill, so this understates decode speed on long
            prompts. `decodeTokensPerSecond` beside it excludes prefill;
            the two differing is the prefill cost made visible.
        ttftMs:
          oneOf:
            - $ref: '#/components/schemas/Percentiles'
            - type: 'null'
          description: |
            Time to first token: milliseconds from the start of the
            serving attempt to its first streamed event, over streamed
            requests only. Null when nothing in the group streamed — a
            non-streamed request has no first token to time, the
            response arrives whole. Measured gateway-side, so it
            includes the gateway→driver hop and the driver's own
            dispatch: on a local engine it is dominated by prefill but
            is not a pure prefill measurement, and deriving a
            prompt-tokens-per-second from it would be confidently
            wrong. The benchmark is the instrument for real prefill
            curves.
        decodeTokensPerSecond:
          oneOf:
            - $ref: '#/components/schemas/Throughput'
            - type: 'null'
          description: |
            Completion tokens over the serving attempt's time **after**
            its first streamed event — the decode rate an enthusiast
            means by "tokens per second", with prefill excluded. Only
            computed for streamed requests that reported usage and ran
            past a minimum window (2+ tokens and 250 ms after the first
            event, the same guard the playground's badge uses), so its
            `samples` can be lower than `tokensPerSecond.samples`. Null
            when nothing in the group qualifies.
        waitedMs:
          oneOf:
            - $ref: '#/components/schemas/Percentiles'
            - type: 'null'
          description: |
            Wake latency, over the `swappedIn` requests only. Null when
            none of them woke anything.
        routingMs:
          oneOf:
            - $ref: '#/components/schemas/Percentiles'
            - type: 'null'
          description: |
            How long deciding where to send the request took. Null for
            groups recorded before this was measured.
        overheadMs:
          oneOf:
            - $ref: '#/components/schemas/Percentiles'
            - type: 'null'
          description: |
            The control plane's own cost: the serving attempt's
            gateway-side time minus the driver's measurement of its
            backend call. Null when no request in the group had a
            backend that reported its own latency.
        promptCache:
          oneOf:
            - $ref: '#/components/schemas/MetricsPromptCache'
            - type: 'null'
          description: |
            How much of the prompt the engines did not have to read
            again (PC5), over the requests whose backend reported a
            cached count. Null when none did.
        affinity:
          oneOf:
            - $ref: '#/components/schemas/MetricsAffinity'
            - type: 'null'
          description: |
            What conversation affinity did (PC4; `conversationAffinity`
            since CB1). Null when it never had a choice to make in this
            group.
        tierCounts:
          type: object
          additionalProperties:
            type: integer
            minimum: 0
          description: |
            Requests served, keyed by the 1-based tier that answered. A
            slot whose tier 2 answers everything has a primary that is
            not working, and this is where that becomes visible.

    MetricsPromptCache:
      type: object
      description: |
        Prompt tokens and the part of them served from an engine's
        prompt cache, summed over `requests` (the ones that reported).
        `cachedTokens / promptTokens` is the share reused.
      required: [requests, promptTokens, cachedTokens]
      properties:
        requests: {type: integer, minimum: 0}
        promptTokens: {type: integer, minimum: 0}
        cachedTokens: {type: integer, minimum: 0}

    MetricsAffinity:
      type: object
      description: |
        Requests by what conversation affinity did with them. `evicted`
        (CB5, schema v12) is a turn that went back to its replica and
        found its history gone there: the engine reused less than the
        whole of the conversation's previous prompt. Grouped by backend,
        it says which model needs more context or another replica, where
        an operator saw only a slow model.
      required: [hit, new, moved, evicted]
      properties:
        hit: {type: integer, minimum: 0}
        new: {type: integer, minimum: 0}
        moved: {type: integer, minimum: 0}
        evicted: {type: integer, minimum: 0}

    MetricsSummary:
      type: object
      required:
        - windowStart
        - windowEnd
        - gatewayStartedAt
        - rowsDropped
        - groups
      properties:
        windowStart:
          type: string
          format: date-time
        windowEnd:
          type: string
          format: date-time
        gatewayStartedAt:
          type: string
          format: date-time
          description: |
            When this gateway process started. Present so a history
            that begins mid-window reads as partial rather than as an
            install that served nothing — the gateway is respawned on
            operator login, so a fresh start time is routine.
        rowsDropped:
          type: integer
          minimum: 0
          description: |
            Measurements discarded since startup because the write
            queue was full. Non-zero means these numbers are a sample
            rather than a census, and the endpoint says so instead of
            quietly under-reporting. Recording degrades before
            inference does.
        truncated:
          type: boolean
          description: |
            True when the window reaches past `metricsRetentionDays`,
            so raw rows for its early part no longer exist and the
            numbers describe less than the window asked for. Hourly
            rollups do cover that period on disk; nothing serves them
            yet.
        groups:
          type: array
          items:
            $ref: '#/components/schemas/MetricsGroup'

    MetricAttempt:
      type: object
      description: One backend touched by one request, in the order tried.
      required:
        - driver
        - elapsedMs
        - served
      properties:
        retryDisposition:
          type: string
          enum: [safe, terminal, indeterminate]
          description: Failure classification; absent for success or historical rows.
        usageKnown:
          type: boolean
          description: Whether token usage is known for this attempt; false is not zero cost.
        promptTokens: {type: integer, minimum: 0}
        cachedTokens:
          type: integer
          minimum: 0
          description: |
            Of `promptTokens`, those the backend served from its prompt
            cache (PC5, schema v11). Absent when the backend did not say,
            never guessed: llama.cpp, vLLM (with
            `--enable-prompt-tokens-details`), MLX and hosted OpenAI and
            Anthropic report it.
        completionTokens: {type: integer, minimum: 0}
        driver:
          type: string
        model:
          type:
            - string
            - 'null'
          description: |
            The published id of the model this attempt asked for — a
            slot's target, prefixed for an account — since one account's
            driver serves hundreds. Null on rows recorded before metrics
            schema v6.
        runtime:
          type:
            - string
            - 'null'
        node:
          type:
            - string
            - 'null'
        backend:
          $ref: 'components/common.yaml#/components/schemas/BackendKind'
        elapsedMs:
          type: integer
          minimum: 0
          description: |
            This attempt alone, not the request. Gateway-side, so it
            includes the local hop to the driver.
        firstMs:
          type:
            - integer
            - 'null'
          minimum: 0
          description: |
            Milliseconds from the start of this attempt to its first
            streamed event — time to first token, gateway-side. Null
            for non-streamed attempts (the response arrives whole, so
            there is no first token to time) and for rows recorded
            before this was measured. Recorded on failures too: a
            stream that emitted tokens and then broke still had a
            first token, and its timing is evidence about the backend.
        backendMs:
          type:
            - integer
            - 'null'
          description: |
            The **driver's** own measurement of its backend call
            (`GenerateResponse.latencyMs`), when it reported one.

            `elapsedMs - backendMs` is therefore the cost of the
            gateway-to-driver hop plus the driver's own work: the
            control plane's overhead on this attempt, not a measurement
            of GPU compute alone. Both durations use `time.perf_counter()`
            and are truncated to integer milliseconds, so subtraction also
            includes quantization error. Historical 114-120 ms overhead came
            from per-request HTTP-client construction, fixed in R1.1;
            see this document's overview for the measured result.
          minimum: 0
        served:
          type: boolean
        error:
          type:
            - string
            - 'null'
          description: |
            The exception **class name** only, never its message.
            Driver error text can carry a provider's response body, and
            a metrics table is the kind of thing that gets pasted into
            an issue — this must not become an accidental credential
            store.

    MetricRequest:
      type: object
      required:
        - startedAt
        - requestedModel
        - attempts
        - totalMs
        - outcome
        - tries
      properties:
        requestId:
          type: string
          description: Gateway-generated correlation ID shared by every driver attempt.
        elapsedMs:
          type: integer
          minimum: 0
          description: Entire request lifetime, including preparation, wake and every attempt.
        clientKeyId: {type: string, description: Verified key identifier; absent for operator/service requests and pre-A5 rows.}
        clientKeyName: {type: string, description: Registry name captured for this request.}
        personId: {type: string, description: "Stable person subject verified by the control root, when present."}
        appClientId: {type: string, description: Registered app bound to the person's proof.}
        startedAt:
          type: string
          format: date-time
        requestedModel:
          type: string
        servedModel:
          type:
            - string
            - 'null'
          description: |
            What actually answered. Differs from the requested id after
            a cascade.
        attempts:
          type: integer
          minimum: 0
        tier:
          type: integer
          minimum: 1
        totalMs:
          type: integer
          minimum: 0
          description: |
            Gateway-side wall clock for the whole request, including
            failed attempts and excluding the wake — the same figure
            `x_eugene_plexus.latency_ms` reports. Per-backend
            throughput comes from `tries[].elapsedMs`, never from here.
        routingMs:
          type:
            - integer
            - 'null'
          description: |
            Time spent deciding where to send this request - resolving
            the model to a slot, picking a backend, and any
            routing-table refresh that happened on the way - measured
            **before** `totalMs` starts and excluding the wake, which is
            `waitedMs`.

            Previously invisible, and not always small: a refresh does
            HTTP to the agent and to every driver's `/v1/info`, inside
            the request that triggered it.
          minimum: 0
        refreshed:
          type: boolean
          description: |
            Whether a routing-table refresh ran inside this request.
            The expensive and surprising case, so it is a flag rather
            than something to infer from `routingMs`.
        strategy:
          type:
            - string
            - 'null'
          description: |
            Where a new conversation went when this request was routed:
            the `loadBalancing` value in effect, or its default when it is
            unset. Recorded per request because the config can change
            between them, and `spread`, `least_busy` and `round_robin`
            explain different orderings. Rows from before CB1 (2026-10-02) may say
            `conversation`, PC4's value, which placed new conversations by
            least busy and kept the rest on their replicas. Whether this
            request went back to its replica is `affinity`.
        candidates:
          type: array
          description: |
            What the balancer considered. Present only when there was a
            decision to make - more than one candidate, or at least one
            rejected.
          items:
            $ref: '#/components/schemas/MetricCandidate'
        waitedMs:
          type: integer
          minimum: 0
        swappedIn:
          type: boolean
        streamed:
          type: boolean
          description: |
            Whether the client asked for SSE. Recorded because streamed
            requests were invisible to the response envelope, and a
            store that could not tell them apart would hide the very
            gap it was built to close.
        promptTokens:
          type:
            - integer
            - 'null'
        completionTokens:
          type:
            - integer
            - 'null'
        cachedTokens:
          type:
            - integer
            - 'null'
          description: |
            Of `promptTokens`, those the serving backend took from its
            prompt cache (PC5, schema v11). Null when it did not say.
        affinity:
          type:
            - string
            - 'null'
          description: |
            What conversation affinity did with this request (PC4;
            `conversationAffinity` since CB1): `hit`, sent back to the
            replica its conversation used before; `evicted` (CB5, schema
            v12), sent back there and the engine reused less than the
            whole of the conversation's previous prompt, so its history
            was gone; `new`, a conversation not seen before; `moved`, its
            replica was full or gone and it went elsewhere. Null when
            there was no choice to make or affinity was off (before CB1,
            when another strategy was in effect). A backend that does not
            report cached tokens cannot be judged, and its turns stay
            `hit`.
        door:
          type:
            - string
            - 'null'
          description: |
            Which door the request came in by (P3b): `speech`,
            `transcription`, `translation` (P3-4), `images` (P4, schema v8),
            `videos` (P5, schema v9, the submit's row), `moderation` (P6)
            or `completion` (P6, a row that carries tokens as chat's does).
            Null on rows from before schema v7 and on every other door,
            whose rows carry tokens.
        characters:
          type:
            - integer
            - 'null'
          description: For speech, the characters spoken, the unit providers bill it in.
        audioSeconds:
          type:
            - number
            - 'null'
          description: For transcription and translation, the seconds of audio heard, where the backend says.
        images:
          type:
            - integer
            - 'null'
          description: For images, how many were returned (P4, schema v8). Tokens ride beside it.
        videoSeconds:
          type:
            - integer
            - 'null'
          description: For a video job, the seconds asked for (P5, schema v9).
        outcome:
          type: string
          enum: [served, error]
        tries:
          type: array
          minItems: 0
          items:
            $ref: '#/components/schemas/MetricAttempt'
        webSearches:
          type: array
          description: |
            Each search this install ran for the request (P8, schema v10),
            in order. **No query text is kept**, by A5's rule that no prompt
            is kept: a query is made from the prompt.
          items:
            $ref: '#/components/schemas/MetricToolExecution'
        imageGenerations:
          type: array
          description: |
            Each image the `image_generation` tool made or failed to make
            for the request (P8e, schema v10), in order. No prompt text is
            kept, for the same reason. Absent on rows written before P8e.
          items:
            $ref: '#/components/schemas/MetricToolExecution'
        mcpCalls:
          type: array
          description: |
            Each remote MCP call the install made for the request (row
            59b), in order: the tool-driver that made it, the outcome and
            the time. Not the server, the tool's name or its arguments,
            which are the caller's words, and never its credential. Absent
            when the request made none.
          items:
            $ref: '#/components/schemas/MetricToolExecution'

    MetricToolOutcome:
      type: string
      enum: [ok, error, over_limit]
      description: |
        `over_limit` is a call past the request's limit, answered without
        running. Named rather than inline: an inline `outcome` enum here
        generated as `Outcome1` beside the request's own `Outcome` (the S6
        trap).

    MetricToolExecution:
      type: object
      required: [tool, outcome, elapsedMs]
      properties:
        tool:
          type: string
          description: |
            The tool that ran -- `web_search`, `image_generation`, or `mcp`
            (a remote MCP call, row 59b; the row names neither the server
            nor the tool, which are the caller's words).
        driver:
          type:
            - string
            - 'null'
          description: |
            The tool-driver (search account) that ran a search, or the
            inference-driver that made an image; null when none was asked.
        node:
          type:
            - string
            - 'null'
        provider:
          type:
            - string
            - 'null'
          description: |
            The search account's provider, `searxng`, `brave` or `google`;
            for an image, the image model that made it.
        version:
          type:
            - string
            - 'null'
          description: |
            How the caller named the tool: `web_search_options`,
            `web_search`, or Anthropic's dated `web_search_20250305` -- kept
            so a new date is noticed rather than discovered.
        outcome:
          $ref: '#/components/schemas/MetricToolOutcome'
        results:
          type:
            - integer
            - 'null'
          description: How many results the model was given, or images made.
        elapsedMs:
          type: integer
          minimum: 0


    MetricCandidate:
      type: object
      description: |
        One backend the balancer considered for a request, and what it
        saw when it decided.

        Deliberately the **input** to the decision rather than a score.
        There is no score: `least_busy` is a sort by in-flight requests
        per slot of capacity, and inventing a number to display would be
        inventing the smarter balancer that was explicitly deferred.
        What this answers is the question an operator actually asks —
        why did this request go there and not to the other one.

        Recorded only when there was a decision to make: more than one
        candidate, or at least one rejected. A single eligible backend is
        not an audit trail.
      required:
        - driver
        - tier
        - eligible
      properties:
        driver:
          type: string
        tier:
          type: integer
          minimum: 1
        eligible:
          type: boolean
          description: |
            Whether this backend could take the request at all. A driver
            following a runtime is eligible only while that runtime is
            `ready`; one following nothing of ours is eligible whenever
            it is reachable.
        reason:
          type:
            - string
            - 'null'
          description: Why not, when `eligible` is false. Null when it was.
        inFlight:
          type:
            - integer
            - 'null'
          description: |
            Requests already outstanding to this backend when the choice
            was made. The load signal `least_busy` sorts on.
          minimum: 0
        slots:
          type:
            - integer
            - 'null'
          description: |
            The runtime's `parallelSlots`, its concurrent capacity. The
            balancer compares `inFlight / slots`, not `inFlight`, so a
            four-slot replica holding two requests is less loaded than a
            one-slot replica holding one.
          minimum: 1

    MetricRequestPage:
      type: object
      required:
        - requests
      properties:
        requests:
          type: array
          items:
            $ref: '#/components/schemas/MetricRequest'
        nextCursor:
          type:
            - string
            - 'null'
          description: Absent or null on the last page.

    ClientUsageGroup:
      type: object
      required: [clientKeyId, clientKeyName, requests, served, failed, attempts, promptTokens, completionTokens, incompleteUsageRequests]
      properties:
        clientKeyId: {type: string}
        clientKeyName: {type: string}
        requests: {type: integer}
        served: {type: integer}
        failed: {type: integer}
        attempts: {type: integer}
        promptTokens: {type: integer}
        completionTokens: {type: integer}
        incompleteUsageRequests: {type: integer}
    ClientUsageSummary:
      type: object
      required: [windowStart, windowEnd, truncated, rowsDropped, clients]
      properties:
        windowStart: {type: string, format: date-time}
        windowEnd: {type: string, format: date-time}
        truncated: {type: boolean}
        rowsDropped: {type: integer}
        clients:
          type: array
          items: {$ref: '#/components/schemas/ClientUsageGroup'}

    # -------- Files and uploads (row 53) --------

    OpenAIFilePurpose:
      type: string
      enum: [assistants, batch, fine-tune, vision, user_data, evals]
      description: OpenAI's upload purposes. Kept as given; nothing here processes a file by its purpose.

    OpenAIFileStatus:
      type: string
      enum: [processed]
      description: OpenAI's (deprecated) file status. A file kept here is ready at once.

    OpenAIUploadStatus:
      type: string
      enum: [pending, completed, cancelled, expired]

    OpenAIExpiresAfter:
      type: object
      additionalProperties: false
      required: [anchor, seconds]
      properties:
        anchor:
          type: string
          const: created_at
        seconds:
          type: integer
          minimum: 3600
          maximum: 2592000
          description: Seconds after upload, one hour to 30 days, as OpenAI takes them.

    FileUploadForm:
      type: object
      required: [file]
      description: |
        `POST /v1/files`, as the OpenAI SDK sends it. `purpose` is
        required on the OpenAI door and absent on Anthropic's.
        `expires_after` arrives as the two form fields the SDK writes.
      properties:
        file:
          type: string
          format: binary
        purpose:
          $ref: '#/components/schemas/OpenAIFilePurpose'
        expires_after[anchor]:
          type: string
          const: created_at
        expires_after[seconds]:
          type: integer
          minimum: 3600
          maximum: 2592000

    OpenAIFile:
      type: object
      required: [id, object, bytes, created_at, filename, purpose, status]
      properties:
        id:
          type: string
        object:
          type: string
          const: file
        bytes:
          type: integer
        created_at:
          type: integer
        expires_at:
          type: ['integer', 'null']
          description: Null when the file is kept until it is deleted (OpenAI's default).
        filename:
          type: string
        purpose:
          $ref: '#/components/schemas/OpenAIFilePurpose'
        status:
          $ref: '#/components/schemas/OpenAIFileStatus'
        status_details:
          type: ['string', 'null']

    OpenAIFileList:
      type: object
      required: [object, data, has_more]
      properties:
        object:
          type: string
          const: list
        data:
          type: array
          items: {$ref: '#/components/schemas/OpenAIFile'}
        first_id:
          type: ['string', 'null']
        last_id:
          type: ['string', 'null']
        has_more:
          type: boolean

    OpenAIFileDeleted:
      type: object
      required: [id, object, deleted]
      properties:
        id:
          type: string
        object:
          type: string
          const: file
        deleted:
          type: boolean

    OpenAIUploadRequest:
      type: object
      additionalProperties: false
      required: [bytes, filename, mime_type, purpose]
      properties:
        bytes:
          type: integer
          minimum: 1
        filename:
          type: string
          minLength: 1
          maxLength: 255
        mime_type:
          type: string
          maxLength: 255
        purpose:
          $ref: '#/components/schemas/OpenAIFilePurpose'
        expires_after:
          $ref: '#/components/schemas/OpenAIExpiresAfter'

    OpenAIUpload:
      type: object
      required: [id, object, bytes, created_at, filename, purpose, status, expires_at]
      properties:
        id:
          type: string
        object:
          type: string
          const: upload
        bytes:
          type: integer
        created_at:
          type: integer
        filename:
          type: string
        purpose:
          $ref: '#/components/schemas/OpenAIFilePurpose'
        status:
          $ref: '#/components/schemas/OpenAIUploadStatus'
        expires_at:
          type: integer
        file:
          oneOf:
            - $ref: '#/components/schemas/OpenAIFile'
            - type: 'null'

    OpenAIUploadPart:
      type: object
      required: [id, object, created_at, upload_id]
      properties:
        id:
          type: string
        object:
          type: string
          const: upload.part
        created_at:
          type: integer
        upload_id:
          type: string

    OpenAIUploadComplete:
      type: object
      additionalProperties: false
      required: [part_ids]
      properties:
        part_ids:
          type: array
          minItems: 1
          items: {type: string}
        md5:
          type: string
          description: The joined file's MD5, checked before it becomes a file.
        sha256:
          type: string
          description: Eugene's own check, the joined file's SHA-256.

    AnthropicFileMetadata:
      type: object
      required: [id, type, filename, mime_type, size_bytes, created_at]
      properties:
        id:
          type: string
        type:
          type: string
          const: file
        filename:
          type: string
        mime_type:
          type: string
        size_bytes:
          type: integer
        created_at:
          type: string
          format: date-time
        downloadable:
          type: boolean
          description: Always true here; the owner may read back what it kept.

    AnthropicFileList:
      type: object
      required: [data, has_more]
      properties:
        data:
          type: array
          items: {$ref: '#/components/schemas/AnthropicFileMetadata'}
        first_id:
          type: ['string', 'null']
        last_id:
          type: ['string', 'null']
        has_more:
          type: boolean

    AnthropicFileDeleted:
      type: object
      required: [id, type]
      properties:
        id:
          type: string
        type:
          type: string
          const: file_deleted
