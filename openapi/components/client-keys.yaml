openapi: 3.1.0
info:
  title: Eugene Plexus client-key registry and policy
  version: 0.1.0
paths: {}
components:
  schemas:
    ClientKey:
      type: object
      required: [id, name, tail, createdAt, expiresAt]
      properties:
        id: {type: string, minLength: 1, maxLength: 128}
        name: {type: string, minLength: 1, maxLength: 64}
        tail: {type: string, maxLength: 6}
        createdAt: {type: string, format: date-time}
        expiresAt: {type: string, format: date-time}
        revokedAt: {type: string, format: date-time}
        lastUsedAt:
          type: string
          format: date-time
          description: When the authority last admitted a check or acquisition with this key, to the minute. Absent, no use recorded.
        retiresAt:
          type: string
          format: date-time
          description: Set when the key was rotated. The token works until then, and new requests on it are refused as replaced afterwards. Running requests finish.
        replaces:
          type: string
          minLength: 1
          maxLength: 128
          description: The id of the key this one replaced.
        replacedBy:
          type: string
          minLength: 1
          maxLength: 128
          description: The id of the key that replaced this one.
        limits:
          $ref: '#/components/schemas/ClientKeyLimits'
          description: Absent on legacy keys (all models, no per-key limits); new keys receive bounded defaults.
    ClientKeyList:
      type: object
      required: [keys]
      properties:
        keys:
          type: array
          items: {$ref: '#/components/schemas/ClientKey'}
        authority: {type: string}
        revision: {type: integer, minimum: 0}
        scope: {type: string, enum: [install, standalone]}
        detail: {type: string}
    ClientKeyCreateRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: {type: string, minLength: 1, maxLength: 64}
        ttlDays: {type: integer, minimum: 1, maximum: 3650, default: 365}
        limits: {$ref: '#/components/schemas/ClientKeyLimits'}
    ClientKeyRotateRequest:
      type: object
      additionalProperties: false
      properties:
        overlapSeconds:
          type: integer
          minimum: 0
          maximum: 2592000
          default: 86400
          description: How long the old token keeps working. 0 stops it now. The old and new tokens share one concurrency and rate allowance during the overlap.
        ttlDays:
          type: integer
          minimum: 1
          maximum: 3650
          description: Lifetime of the new key. Absent, the old key's lifetime.
    ClientKeyLimits:
      type: object
      additionalProperties: false
      properties:
        localOnly:
          type: boolean
          default: false
          description: |
            Permit only backends explicitly classified local by drivers enforcing
            the local-only request policy. External, unknown and older drivers
            are ineligible, including through aliases, fallback and wake. The
            caller cannot relax this restriction. Local is a configured trust
            boundary, not a promise to sandbox a malicious backend.
        allowedModels:
          type: [array, 'null']
          maxItems: 100
          uniqueItems: true
          items: {type: string, minLength: 1, maxLength: 256}
          description: |
            Null permits all. Empty permits none. Both the id the caller
            asked for and every model actually tried (a slot's fallback
            targets) must be allowed.

            An entry is an exact id, or a pattern with `*` (P1,
            2026-09-27): `*` matches any run of characters, `/` included,
            and is the only wildcard, so `openrouter/*` allows every
            model of the account named `openrouter`
            (`openrouter/anthropic/claude-opus-5.5`) and nothing else.
            Without it, scoping a key to one account means typing out
            hundreds of names. The same matcher runs in the gateway, the
            agent and the control root.
        allowedTools:
          type: [array, 'null']
          maxItems: 100
          uniqueItems: true
          items: {type: string, minLength: 1, maxLength: 64}
          description: |
            The tools the hub runs itself (P8) that this key may have run
            on its behalf -- `web_search`, `image_generation`, and `mcp`
            (remote MCP servers the key's caller names, row 59b). **Null permits every tool
            the install runs** (design call #5: a key is allowed search once
            a search account exists, and can be denied it here). Empty
            permits none. An entry is a tool name or a pattern with `*`,
            matched by the same matcher as `allowedModels`.

            A key denied a tool is not refused for asking: the door says
            why the search did not run, as it does for an install with no
            search account (`gateway.yaml`, "Server-run tools"). A
            `localOnly` key never has a tool run whatever this says,
            because a search sends a query derived from the prompt to the
            public internet.
        writeLogs:
          type: boolean
          default: false
          description: |
            Whether this key may send log records to an agent's log ingress
            (`POST /v1/logs` on `agent.yaml`, C1 in `workbench.md`). It
            grants nothing else: reading logs stays operator-only.

            Every app the registry installs gets a key with this on,
            because the launcher that runs an app in its own account
            forwards what the app prints. Any other key gets it when the
            operator turns it on, so a tool outside the registry sends its
            logs the same way ours do.
        readMetrics:
          type: boolean
          description: |
            Whether this key may read `GET /metrics` on a gateway or an agent,
            and `GET /v1/metrics/export` on a gateway (row 12): the numbers a
            Prometheus scraper reads. **It grants nothing else.** A key with it
            runs no inference unless `allowedModels` also names a model, and a
            key without it is refused at every metrics path with 403.

            **Absent means off**, and no default is declared here on purpose: a
            declared default is filled into every answer a generated model
            writes, and a reader a release behind refuses the field
            (`extra='forbid'`), so the authority and the agent send it only when
            it is on. Found by the specs integration: a gateway a release behind
            refused every request on a key whose answer said `readMetrics: false`.

            The console's "Make a scrape key" sets it together with
            `allowedModels: []` and `allowedTools: []`, so the key can read numbers and
            run no model and no tool (an absent `allowedTools` permits every tool).
            The metrics paths ask the authority with admission purpose
            `metrics`: a check that names no model and takes no lease.
        maxConcurrentRequests:
          type: integer
          minimum: 1
          maximum: 64
          default: 2
          description: |
            How many of this key's requests run at once, across every
            gateway. A request past it waits in the gateway's queue (row 11)
            while `maxQueuedRequests` allows, and is refused when it does not.
        requestsPerMinute: {type: integer, minimum: 1, maximum: 10000, default: 60}
        band:
          $ref: '#/components/schemas/QueueBand'
          description: |
            The key's queue band (row 11): which of its requests wait or are
            turned away first when the machines are busy. Absent means
            `interactive`. A verified person's band from their permission
            groups (`ClientAdmissionResult.queueBand`) replaces it, and a
            request's `X-Eugene-Band` header can only lower it. Not part of
            the policy a running request is bound to: changing it never cuts
            a request that is already running.
        maxQueuedRequests:
          type: integer
          minimum: 0
          maximum: 64
          description: |
            How many of this key's requests may wait in one gateway's queue
            for each person (row 11): Workbench's one app key serves
            everyone, so each verified person has a line of their own. A
            request past it is refused with `key_queue_full` and
            `Retry-After`. `0` refuses at once, as before the queue. Not part
            of the policy a running request is bound to.

            **Absent means 8**, and no default is declared here on purpose:
            a declared default is filled into every answer a generated model
            writes, and a reader a release behind refuses the field
            (`extra='forbid'`), so the authority and the agent send it only
            when it was set to something else, as `band` and row 70's
            `queueBand`.
        tokensPerDay:
          type: [integer, 'null']
          minimum: 1
          maximum: 1000000000000
          description: |
            **On an edit (`PUT .../limits`), an allowance left out keeps the
            key's current one and `null` clears it**, so a console a release
            behind, which knows none of the three, never clears them. Every
            other limit is replaced whole, as before.

            Row 40: how many tokens (in and out) this key's lineage may use in
            one UTC day, across every gateway. A request is refused before it
            runs once the day's tokens reach it (429, `insufficient_quota`,
            `X-Eugene-Refusal-Reason: allowance`); a request that crosses the
            line while it runs finishes. **Absent means no limit**, and no
            default is declared on purpose, as for `readMetrics`: the
            authority writes it only when it is set. Not part of the policy a
            running request is bound to, and never sent in an admission answer.
        tokensPerMonth:
          type: [integer, 'null']
          minimum: 1
          maximum: 1000000000000000
          description: Row 40. As `tokensPerDay`, for one calendar month (UTC). Absent means no limit; on an edit, absent keeps and null clears.
        costPerMonthMicros:
          type: [integer, 'null']
          minimum: 0
          maximum: 1000000000000000
          description: |
            Row 40: how much this key's lineage may spend in one calendar month
            (UTC), in millionths of a US dollar, at the install's prices (the
            owner's rate for a model, else its provider's published price, else
            nothing for a local model). A model with no price is refused while
            this is set, because its cost cannot be counted. `0` allows only
            models that cost nothing. Absent means no limit; on an edit,
            absent keeps and null clears.
    ClientKeyUpdateRequest:
      type: object
      additionalProperties: false
      required: [limits]
      properties:
        limits: {$ref: '#/components/schemas/ClientKeyLimits'}
    ClientAdmissionRequest:
      type: object
      additionalProperties: false
      required: [action, keyId, requestId]
      description: |
        Since row 11 the gateway sends `check` when a request arrives and
        `acquire` when the request leaves its queue, so a request that waits
        holds no lease. A `check` that names a `model` applies the key's
        `allowedModels` as `acquire` does, and takes nothing.

        An `acquire` refused for the key's limits is a 429 with
        `Retry-After` and `X-Eugene-Refusal-Reason`: `concurrency` when the
        key already runs `maxConcurrentRequests` requests (on any gateway;
        the gateway keeps the request's place and asks again), `rate` when
        its `requestsPerMinute` are used (the gateway refuses the request).
      properties:
        action: {type: string, enum: [check, acquire, renew, release]}
        keyId: {type: string, minLength: 1, maxLength: 128}
        requestId: {type: string, minLength: 1, maxLength: 128}
        purpose:
          type: string
          enum: [inference, logs, catalog, search, metrics]
          default: inference
          description: |
            Metrics (row 12) is a check for a scraper that reads `GET /metrics`: it names no model and no person token, takes no lease, and is refused with 403 ("This key may not read metrics.") unless the key's `readMetrics` is on. It never acquires, renews or releases.

            Logs and catalog permit only a check without a model/person token; neither acquires or renews inference. Catalog is only GET /v1/models with X-Eugene-App-Operation set to catalog, for app settings.

            Search is a web search that names no model (POST /v1/web_search, the door Open WebUI's external search engine calls). It takes the same check, acquire, renew and release as inference, and the same concurrency and rolling-minute limits, but it carries no `model` (a body that names one is refused with 422) and the key's `allowedModels` does not apply. The gateway checks the key's `allowedTools` and `localOnly`, as for every tool.
        model: {type: string, minLength: 1, maxLength: 256}
        price:
          $ref: '#/components/schemas/ModelPriceHint'
          description: |
            Row 40, `acquire` only: how the gateway sees the requested model's
            price, so the authority can tell whether a money allowance can
            count it. An authority before row 40 refuses the field (422) and
            the gateway asks again without it.
        usage:
          $ref: '#/components/schemas/AdmissionUsage'
          description: |
            Row 40, `release` only: what the request used. The authority counts
            it for the key's lineage, the person it verified at `acquire`, and
            that person's groups. Absent (a request that was never served, or a
            gateway before row 40) counts nothing. An authority before row 40
            refuses the field (422) and the gateway releases again without it.
        personToken:
          type: string
          minLength: 1
          maxLength: 16384
          description: |
            Root-issued OIDC access token carried alongside the app key in
            X-Eugene-Person-Token. The root checks its signature, session,
            current person access and exact registered app owner on every check,
            acquisition and renewal. Required for app:workbench@ keys. Never
            persist or log this token. A standalone authority refuses it.
    ClientAdmissionResult:
      type: object
      additionalProperties: false
      required: [keyId, keyName]
      description: |
        Row 37: an agent or gateway from before row 37 refuses an answer that
        carries `roleRouting`, `routingGroup` or `modelLimits` (its model
        forbids unknown fields), so a person whose groups set them is refused
        there until that machine is updated: it fails closed, never open.
        The root sends them only when a group sets them.
      properties:
        keyId: {type: string}
        keyName: {type: string}
        lineage:
          type: string
          minLength: 1
          maxLength: 128
          description: |
            The id of the first key of this key's rotations (row 24): a
            replacement shares its predecessor's lineage. The store names a
            key's objects by it, so a rotated key keeps its files (row 53).
            Readers take it when present and use `keyId` when absent; the
            authority starts sending it once every reader knows the field,
            because an older reader refuses an unknown one.
        personId: {type: string, description: "Stable subject verified by the root, never caller supplied."}
        appClientId: {type: string}
        limits: {$ref: '#/components/schemas/ClientKeyLimits'}
        leaseSeconds: {type: number, exclusiveMinimum: 0, maximum: 30}
        queueBand:
          $ref: '#/components/schemas/QueueBand'
          description: |
            The verified person's queue band from their permission groups
            (row 70): the highest band any of their groups sets. Present only
            when the root verified a person (`personId`) and one of their
            groups sets a band. Absent for a key with no person, a release, or
            a person whose groups set none: the key's own band, or the
            install's default, applies. Never taken from the caller.
        roleRouting:
          $ref: '#/components/schemas/RoleRouting'
          description: |
            The verified person's routing by model role (row 37), from their
            active group (`Person.activeGroup`). Present only when the root
            verified a person and that group routes at least one role. A
            request for `role:<role>` that this names tries these models in
            order, after the gateway drops every model outside the allowed
            set (`modelLimits` and the key's list); a role it does not name
            uses the install's slot. Absent: the
            install's routing for every role, as before row 37. Never taken
            from the caller.
        routingGroup:
          $ref: '#/components/schemas/ModelGroup'
          description: |
            The group `roleRouting` comes from (row 37): the person's active
            group. Present with `roleRouting`.
        modelLimits:
          type: array
          maxItems: 64
          items: {$ref: '#/components/schemas/GroupModelLimit'}
          description: |
            Row 37 (call R37-SELF, Choice 3): the model list of every group
            the verified person is in that sets one, sorted by group name. A
            model is allowed only when the key's own `allowedModels` and
            every list here allow it, for the model asked for, every fallback
            and every model a server-run tool calls; the person's choice of
            active group never widens it. A `role:<role>` name is not checked
            against these lists: the role's models are. Absent when no group
            of theirs sets a list: no limit beyond the key's.
    RoleRouting:
      type: object
      description: |
        Row 37: for each model role, the models a person's requests for
        `role:<role>` try, in order. A role not named here uses the
        install's slot (`modelSlots`). The keys are `ModelRole` values
        (`components/common.yaml`); a root refuses any other.
      maxProperties: 16
      additionalProperties:
        type: array
        minItems: 1
        maxItems: 16
        uniqueItems: true
        items: {type: string, minLength: 1, maxLength: 256}
    ModelGroup:
      type: object
      additionalProperties: false
      required: [id, name]
      description: A permission group, as a refusal names it (row 37).
      properties:
        id: {type: string, minLength: 1, maxLength: 64}
        name: {type: string, minLength: 1, maxLength: 80}
    GroupModelLimit:
      type: object
      additionalProperties: false
      required: [group, models]
      description: One group's model list, as it limits a person (row 37).
      properties:
        group: {$ref: '#/components/schemas/ModelGroup'}
        models:
          type: array
          maxItems: 64
          uniqueItems: true
          items: {type: string, minLength: 1, maxLength: 256}
          description: Exact ids or patterns with `*`, at most 8 `*` in one entry. Empty allows none.
    AdmissionRefusalReason:
      type: string
      enum: [concurrency, rate, allowance]
      description: |
        Why an `acquire` was refused with a 429, in its
        `X-Eugene-Refusal-Reason` header (row 11): `concurrency`, the key
        already runs `maxConcurrentRequests` requests; `rate`, its
        `requestsPerMinute` are used; `allowance` (row 40), a token or money
        allowance of the key, the person or one of their groups is spent, or
        the model has no price while a money allowance applies. An
        `allowance` refusal is final until the allowance resets: its
        `Retry-After` is the seconds until then, and its `detail` is the
        sentence the caller is shown. An agent that forwards the root's
        answer passes the header on, and a standalone agent sets it the same
        way.
    ModelPrice:
      type: object
      additionalProperties: false
      required: [inputPerMillionMicros, outputPerMillionMicros]
      description: |
        Row 40: a model's rate, in millionths of a US dollar for each million
        tokens. One micro-dollar for a million tokens is one pico-dollar a
        token, so a request's cost is a whole number of pico-dollars:
        `promptTokens * inputPerMillionMicros + completionTokens *
        outputPerMillionMicros`. Integers, so every sum is exact.
      properties:
        inputPerMillionMicros: {type: integer, minimum: 0, maximum: 1000000000000}
        outputPerMillionMicros: {type: integer, minimum: 0, maximum: 1000000000000}
    ModelPriceHint:
      type: object
      additionalProperties: false
      required: [locality]
      description: |
        Row 40: what a gateway knows about a model's price from its drivers.
        `locality` is the model's `ModelLocality` (`local` only when every
        backend serving it is local). `providerPrice` is the price its
        provider publishes, as its driver reported it; absent when no driver
        reported one, or when two backends report different prices and one
        of them has none. The authority's owner rate wins over both.
      properties:
        locality:
          $ref: '#/components/schemas/ModelPriceLocality'
        providerPrice:
          $ref: '#/components/schemas/ModelPrice'
    ModelPriceLocality:
      type: string
      enum: [local, external, unknown]
      description: Where a model runs, as the gateway's `ModelLocality` says it (row 40).
    AdmissionUsage:
      type: object
      additionalProperties: false
      required: [model, promptTokens, completionTokens, price]
      description: |
        Row 40: what one served request used, as the gateway that served it
        measured it. `model` is the model that served it (a fallback's, not
        the one asked for), and `price` that model's hint. When the serving
        model has no price at the authority, the request is priced at the
        model its lease was acquired for.
      properties:
        model: {type: string, minLength: 1, maxLength: 256}
        promptTokens: {type: integer, minimum: 0, maximum: 100000000}
        completionTokens: {type: integer, minimum: 0, maximum: 100000000}
        price:
          $ref: '#/components/schemas/ModelPriceHint'
        estimated:
          type: boolean
          description: |
            True when the tokens are the gateway's estimate, not the backend's
            count: the backend reported none, or the answer was cut before its
            end (the client hung up, the backend failed after its first token,
            the gateway stopped a repetition). The prompt is the estimate the
            queue made of it; the answer is what was forwarded. Absent is false.
    QueueBand:
      type: string
      enum: [interactive, background, sheddable]
      description: |
        Which requests wait or are turned away first when the machines are
        busy. From highest to lowest: `interactive` (a person waiting at a
        chat), `background` (work nobody watches), `sheddable` (refused first
        under load). With no policy the install's default is `interactive`.
    ClientKeyCreated:
      type: object
      required: [key, token]
      properties:
        key: {$ref: '#/components/schemas/ClientKey'}
        token:
          type: string
          description: Returned once; never persisted in the registry or gateway cache.
    ClientKeyPolicyEntry:
      type: object
      additionalProperties: false
      required: [id, expiresAt]
      properties:
        id: {type: string, minLength: 1, maxLength: 128}
        expiresAt: {type: string, format: date-time}
        revokedAt: {type: string, format: date-time}
    ClientKeyPolicy:
      type: object
      additionalProperties: false
      required: [authority, revision, generatedAt, keys]
      properties:
        authority: {type: string, minLength: 1}
        revision: {type: integer, minimum: 0}
        generatedAt:
          type: number
          description: Authority UTC Unix timestamp. Intermediaries must not renew it.
        keys:
          type: array
          items: {$ref: '#/components/schemas/ClientKeyPolicyEntry'}
      description: |
        Positive registry: only listed, unrevoked, unexpired identifiers may be
        authorized. Default refresh 15 seconds, maximum age 60 seconds (up to
        five seconds clock tolerance). Missing/stale policy causes client-only
        503; known revoked keys remain refused. Operator/service auth is unaffected.
