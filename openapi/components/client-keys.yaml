openapi: 3.1.0
info:
  title: Eugene Plexus client-key registry and policy
  version: 0.1.0
paths: {}
components:
  schemas:
    ClientKey:
      type: object
      required: [id, name, tail, createdAt, expiresAt]
      properties:
        id: {type: string, minLength: 1, maxLength: 128}
        name: {type: string, minLength: 1, maxLength: 64}
        tail: {type: string, maxLength: 6}
        createdAt: {type: string, format: date-time}
        expiresAt: {type: string, format: date-time}
        revokedAt: {type: string, format: date-time}
        lastUsedAt:
          type: string
          format: date-time
          description: When the authority last admitted a check or acquisition with this key, to the minute. Absent, no use recorded.
        retiresAt:
          type: string
          format: date-time
          description: Set when the key was rotated. The token works until then, and new requests on it are refused as replaced afterwards. Running requests finish.
        replaces:
          type: string
          minLength: 1
          maxLength: 128
          description: The id of the key this one replaced.
        replacedBy:
          type: string
          minLength: 1
          maxLength: 128
          description: The id of the key that replaced this one.
        limits:
          $ref: '#/components/schemas/ClientKeyLimits'
          description: Absent on legacy keys (all models, no per-key limits); new keys receive bounded defaults.
    ClientKeyList:
      type: object
      required: [keys]
      properties:
        keys:
          type: array
          items: {$ref: '#/components/schemas/ClientKey'}
        authority: {type: string}
        revision: {type: integer, minimum: 0}
        scope: {type: string, enum: [install, standalone]}
        detail: {type: string}
    ClientKeyCreateRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: {type: string, minLength: 1, maxLength: 64}
        ttlDays: {type: integer, minimum: 1, maximum: 3650, default: 365}
        limits: {$ref: '#/components/schemas/ClientKeyLimits'}
    ClientKeyRotateRequest:
      type: object
      additionalProperties: false
      properties:
        overlapSeconds:
          type: integer
          minimum: 0
          maximum: 2592000
          default: 86400
          description: How long the old token keeps working. 0 stops it now. The old and new tokens share one concurrency and rate allowance during the overlap.
        ttlDays:
          type: integer
          minimum: 1
          maximum: 3650
          description: Lifetime of the new key. Absent, the old key's lifetime.
    ClientKeyLimits:
      type: object
      additionalProperties: false
      properties:
        localOnly:
          type: boolean
          default: false
          description: |
            Permit only backends explicitly classified local by drivers enforcing
            the local-only request policy. External, unknown and older drivers
            are ineligible, including through aliases, fallback and wake. The
            caller cannot relax this restriction. Local is a configured trust
            boundary, not a promise to sandbox a malicious backend.
        allowedModels:
          type: [array, 'null']
          maxItems: 100
          uniqueItems: true
          items: {type: string, minLength: 1, maxLength: 256}
          description: |
            Null permits all. Empty permits none. Both the id the caller
            asked for and every model actually tried (a slot's fallback
            targets) must be allowed.

            An entry is an exact id, or a pattern with `*` (P1,
            2026-09-27): `*` matches any run of characters, `/` included,
            and is the only wildcard, so `openrouter/*` allows every
            model of the account named `openrouter`
            (`openrouter/anthropic/claude-opus-5.5`) and nothing else.
            Without it, scoping a key to one account means typing out
            hundreds of names. The same matcher runs in the gateway, the
            agent and the control root.
        allowedTools:
          type: [array, 'null']
          maxItems: 100
          uniqueItems: true
          items: {type: string, minLength: 1, maxLength: 64}
          description: |
            The tools the hub runs itself (P8) that this key may have run
            on its behalf -- `web_search` today. **Null permits every tool
            the install runs** (design call #5: a key is allowed search once
            a search account exists, and can be denied it here). Empty
            permits none. An entry is a tool name or a pattern with `*`,
            matched by the same matcher as `allowedModels`.

            A key denied a tool is not refused for asking: the door says
            why the search did not run, as it does for an install with no
            search account (`gateway.yaml`, "Server-run tools"). A
            `localOnly` key never has a tool run whatever this says,
            because a search sends a query derived from the prompt to the
            public internet.
        writeLogs:
          type: boolean
          default: false
          description: |
            Whether this key may send log records to an agent's log ingress
            (`POST /v1/logs` on `agent.yaml`, C1 in `workbench.md`). It
            grants nothing else: reading logs stays operator-only.

            Every app the registry installs gets a key with this on,
            because the launcher that runs an app in its own account
            forwards what the app prints. Any other key gets it when the
            operator turns it on, so a tool outside the registry sends its
            logs the same way ours do.
        maxConcurrentRequests:
          type: integer
          minimum: 1
          maximum: 64
          default: 2
          description: |
            How many of this key's requests run at once, across every
            gateway. A request past it waits in the gateway's queue (row 11)
            while `maxQueuedRequests` allows, and is refused when it does not.
        requestsPerMinute: {type: integer, minimum: 1, maximum: 10000, default: 60}
        band:
          $ref: '#/components/schemas/QueueBand'
          description: |
            The key's queue band (row 11): which of its requests wait or are
            turned away first when the machines are busy. Absent means
            `interactive`. A verified person's band from their permission
            groups (`ClientAdmissionResult.queueBand`) replaces it, and a
            request's `X-Eugene-Band` header can only lower it. Not part of
            the policy a running request is bound to: changing it never cuts
            a request that is already running.
        maxQueuedRequests:
          type: integer
          minimum: 0
          maximum: 64
          default: 8
          description: |
            How many of this key's requests may wait in one gateway's queue
            for each person (row 11): Workbench's one app key serves
            everyone, so each verified person has a line of their own. A
            request past it is refused with `key_queue_full` and
            `Retry-After`. `0` refuses at once, as before the queue. Not part
            of the policy a running request is bound to.
    ClientKeyUpdateRequest:
      type: object
      additionalProperties: false
      required: [limits]
      properties:
        limits: {$ref: '#/components/schemas/ClientKeyLimits'}
    ClientAdmissionRequest:
      type: object
      additionalProperties: false
      required: [action, keyId, requestId]
      description: |
        Since row 11 the gateway sends `check` when a request arrives and
        `acquire` when the request leaves its queue, so a request that waits
        holds no lease. A `check` that names a `model` applies the key's
        `allowedModels` as `acquire` does, and takes nothing.

        An `acquire` refused for the key's limits is a 429 with
        `Retry-After` and `X-Eugene-Refusal-Reason`: `concurrency` when the
        key already runs `maxConcurrentRequests` requests (on any gateway;
        the gateway keeps the request's place and asks again), `rate` when
        its `requestsPerMinute` are used (the gateway refuses the request).
      properties:
        action: {type: string, enum: [check, acquire, renew, release]}
        keyId: {type: string, minLength: 1, maxLength: 128}
        requestId: {type: string, minLength: 1, maxLength: 128}
        purpose:
          type: string
          enum: [inference, logs, catalog, search]
          default: inference
          description: |
            Logs and catalog permit only a check without a model/person token; neither acquires or renews inference. Catalog is only GET /v1/models with X-Eugene-App-Operation set to catalog, for app settings.

            Search is a web search that names no model (POST /v1/web_search, the door Open WebUI's external search engine calls). It takes the same check, acquire, renew and release as inference, and the same concurrency and rolling-minute limits, but it carries no `model` (a body that names one is refused with 422) and the key's `allowedModels` does not apply. The gateway checks the key's `allowedTools` and `localOnly`, as for every tool.
        model: {type: string, minLength: 1, maxLength: 256}
        personToken:
          type: string
          minLength: 1
          maxLength: 16384
          description: |
            Root-issued OIDC access token carried alongside the app key in
            X-Eugene-Person-Token. The root checks its signature, session,
            current person access and exact registered app owner on every check,
            acquisition and renewal. Required for app:workbench@ keys. Never
            persist or log this token. A standalone authority refuses it.
    ClientAdmissionResult:
      type: object
      additionalProperties: false
      required: [keyId, keyName]
      properties:
        keyId: {type: string}
        keyName: {type: string}
        lineage:
          type: string
          minLength: 1
          maxLength: 128
          description: |
            The id of the first key of this key's rotations (row 24): a
            replacement shares its predecessor's lineage. The store names a
            key's objects by it, so a rotated key keeps its files (row 53).
            Readers take it when present and use `keyId` when absent; the
            authority starts sending it once every reader knows the field,
            because an older reader refuses an unknown one.
        personId: {type: string, description: "Stable subject verified by the root, never caller supplied."}
        appClientId: {type: string}
        limits: {$ref: '#/components/schemas/ClientKeyLimits'}
        leaseSeconds: {type: number, exclusiveMinimum: 0, maximum: 30}
        queueBand:
          $ref: '#/components/schemas/QueueBand'
          description: |
            The verified person's queue band from their permission groups
            (row 70): the highest band any of their groups sets. Present only
            when the root verified a person (`personId`) and one of their
            groups sets a band. Absent for a key with no person, a release, or
            a person whose groups set none: the key's own band, or the
            install's default, applies. Never taken from the caller.
    AdmissionRefusalReason:
      type: string
      enum: [concurrency, rate]
      description: |
        Why an `acquire` was refused with a 429, in its
        `X-Eugene-Refusal-Reason` header (row 11): `concurrency`, the key
        already runs `maxConcurrentRequests` requests; `rate`, its
        `requestsPerMinute` are used. An agent that forwards the root's
        answer passes the header on, and a standalone agent sets it the same
        way.
    QueueBand:
      type: string
      enum: [interactive, background, sheddable]
      description: |
        Which requests wait or are turned away first when the machines are
        busy. From highest to lowest: `interactive` (a person waiting at a
        chat), `background` (work nobody watches), `sheddable` (refused first
        under load). With no policy the install's default is `interactive`.
    ClientKeyCreated:
      type: object
      required: [key, token]
      properties:
        key: {$ref: '#/components/schemas/ClientKey'}
        token:
          type: string
          description: Returned once; never persisted in the registry or gateway cache.
    ClientKeyPolicyEntry:
      type: object
      additionalProperties: false
      required: [id, expiresAt]
      properties:
        id: {type: string, minLength: 1, maxLength: 128}
        expiresAt: {type: string, format: date-time}
        revokedAt: {type: string, format: date-time}
    ClientKeyPolicy:
      type: object
      additionalProperties: false
      required: [authority, revision, generatedAt, keys]
      properties:
        authority: {type: string, minLength: 1}
        revision: {type: integer, minimum: 0}
        generatedAt:
          type: number
          description: Authority UTC Unix timestamp. Intermediaries must not renew it.
        keys:
          type: array
          items: {$ref: '#/components/schemas/ClientKeyPolicyEntry'}
      description: |
        Positive registry: only listed, unrevoked, unexpired identifiers may be
        authorized. Default refresh 15 seconds, maximum age 60 seconds (up to
        five seconds clock tolerance). Missing/stale policy causes client-only
        503; known revoked keys remain refused. Operator/service auth is unaffected.
