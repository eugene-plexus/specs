openapi: 3.1.0
info:
  title: Eugene Plexus client-key registry and policy
  version: 0.1.0
paths: {}
components:
  schemas:
    ClientKey:
      type: object
      required: [id, name, tail, createdAt, expiresAt]
      properties:
        id: {type: string, minLength: 1, maxLength: 128}
        name: {type: string, minLength: 1, maxLength: 64}
        tail: {type: string, maxLength: 6}
        createdAt: {type: string, format: date-time}
        expiresAt: {type: string, format: date-time}
        revokedAt: {type: string, format: date-time}
        lastUsedAt:
          type: string
          format: date-time
          description: Reserved; not currently measured.
        limits:
          $ref: '#/components/schemas/ClientKeyLimits'
          description: Absent on legacy keys (all models, no per-key limits); new keys receive bounded defaults.
    ClientKeyList:
      type: object
      required: [keys]
      properties:
        keys:
          type: array
          items: {$ref: '#/components/schemas/ClientKey'}
        authority: {type: string}
        revision: {type: integer, minimum: 0}
        scope: {type: string, enum: [install, standalone]}
        detail: {type: string}
    ClientKeyCreateRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: {type: string, minLength: 1, maxLength: 64}
        ttlDays: {type: integer, minimum: 1, maximum: 3650, default: 365}
        limits: {$ref: '#/components/schemas/ClientKeyLimits'}
    ClientKeyLimits:
      type: object
      additionalProperties: false
      properties:
        localOnly:
          type: boolean
          default: false
          description: |
            Permit only backends explicitly classified local by drivers enforcing
            the local-only request policy. External, unknown and older drivers
            are ineligible, including through aliases, fallback and wake. The
            caller cannot relax this restriction. Local is a configured trust
            boundary, not a promise to sandbox a malicious backend.
        allowedModels:
          type: [array, 'null']
          maxItems: 100
          uniqueItems: true
          items: {type: string, minLength: 1, maxLength: 256}
          description: |
            Null permits all. Empty permits none. Both the id the caller
            asked for and every model actually tried (a slot's fallback
            targets) must be allowed.

            An entry is an exact id, or a pattern with `*` (P1,
            2026-09-27): `*` matches any run of characters, `/` included,
            and is the only wildcard, so `openrouter/*` allows every
            model of the account named `openrouter`
            (`openrouter/anthropic/claude-opus-5.5`) and nothing else.
            Without it, scoping a key to one account means typing out
            hundreds of names. The same matcher runs in the gateway, the
            agent and the control root.
        allowedTools:
          type: [array, 'null']
          maxItems: 100
          uniqueItems: true
          items: {type: string, minLength: 1, maxLength: 64}
          description: |
            The tools the hub runs itself (P8) that this key may have run
            on its behalf -- `web_search` today. **Null permits every tool
            the install runs** (design call #5: a key is allowed search once
            a search account exists, and can be denied it here). Empty
            permits none. An entry is a tool name or a pattern with `*`,
            matched by the same matcher as `allowedModels`.

            A key denied a tool is not refused for asking: the door says
            why the search did not run, as it does for an install with no
            search account (`gateway.yaml`, "Server-run tools"). A
            `localOnly` key never has a tool run whatever this says,
            because a search sends a query derived from the prompt to the
            public internet.
        writeLogs:
          type: boolean
          default: false
          description: |
            Whether this key may send log records to an agent's log ingress
            (`POST /v1/logs` on `agent.yaml`, C1 in `workbench.md`). It
            grants nothing else: reading logs stays operator-only.

            Every app the registry installs gets a key with this on,
            because the launcher that runs an app in its own account
            forwards what the app prints. Any other key gets it when the
            operator turns it on, so a tool outside the registry sends its
            logs the same way ours do.
        maxConcurrentRequests: {type: integer, minimum: 1, maximum: 64, default: 2}
        requestsPerMinute: {type: integer, minimum: 1, maximum: 10000, default: 60}
    ClientKeyUpdateRequest:
      type: object
      additionalProperties: false
      required: [limits]
      properties:
        limits: {$ref: '#/components/schemas/ClientKeyLimits'}
    ClientAdmissionRequest:
      type: object
      additionalProperties: false
      required: [action, keyId, requestId]
      properties:
        action: {type: string, enum: [check, acquire, renew, release]}
        keyId: {type: string, minLength: 1, maxLength: 128}
        requestId: {type: string, minLength: 1, maxLength: 128}
        model: {type: string, minLength: 1, maxLength: 256}
    ClientAdmissionResult:
      type: object
      additionalProperties: false
      required: [keyId, keyName]
      properties:
        keyId: {type: string}
        keyName: {type: string}
        limits: {$ref: '#/components/schemas/ClientKeyLimits'}
        leaseSeconds: {type: number, exclusiveMinimum: 0, maximum: 30}
    ClientKeyCreated:
      type: object
      required: [key, token]
      properties:
        key: {$ref: '#/components/schemas/ClientKey'}
        token:
          type: string
          description: Returned once; never persisted in the registry or gateway cache.
    ClientKeyPolicyEntry:
      type: object
      additionalProperties: false
      required: [id, expiresAt]
      properties:
        id: {type: string, minLength: 1, maxLength: 128}
        expiresAt: {type: string, format: date-time}
        revokedAt: {type: string, format: date-time}
    ClientKeyPolicy:
      type: object
      additionalProperties: false
      required: [authority, revision, generatedAt, keys]
      properties:
        authority: {type: string, minLength: 1}
        revision: {type: integer, minimum: 0}
        generatedAt:
          type: number
          description: Authority UTC Unix timestamp. Intermediaries must not renew it.
        keys:
          type: array
          items: {$ref: '#/components/schemas/ClientKeyPolicyEntry'}
      description: |
        Positive registry: only listed, unrevoked, unexpired identifiers may be
        authorized. Default refresh 15 seconds, maximum age 60 seconds (up to
        five seconds clock tolerance). Missing/stale policy causes client-only
        503; known revoked keys remain refused. Operator/service auth is unaffected.
