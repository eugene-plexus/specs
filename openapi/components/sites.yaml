# Shapes shared by the site host (openapi/site-host.yaml) and the control
# root's Job Site surface (openapi/control.yaml, components/job-sites.yaml).
#
# A Job Site is its own enrollment, held by the site host, whose policy is
# final on that machine (docs/design/job-sites-own-enrollment.md, J19, J23;
# docs/design/remote-nodes.md §3.4, J6, J8). The site host joins, polls and
# answers the root itself. Between them travel MCP messages of the
# 2026-07-28 revision: one self-contained JSON-RPC request in, one response
# out (J6a, J6c).
#
# Every object here is named, never inline: an inline object in a document
# this size renames an existing schema at codegen (`Person` became `Person1`
# in slice 1).

McpRequest:
  type: object
  description: |
    One MCP request of the 2026-07-28 revision: `server/discover`,
    `tools/list` or `tools/call`. `params._meta` carries
    `io.modelcontextprotocol/protocolVersion` (`2026-07-28`) and
    `io.modelcontextprotocol/clientCapabilities` (the revision's envelope: the
    SDK answers a request without it with an error), and may carry the
    client's info. Nothing else crosses: no notifications, no server-initiated
    requests, no other methods.
  required: [jsonrpc, id, method]
  properties:
    jsonrpc: {$ref: '#/McpJsonRpc'}
    id: {$ref: '#/McpRequestId'}
    method: {$ref: '#/McpMethod'}
    params: {type: object, additionalProperties: true}

McpJsonRpc:
  type: string
  enum: ["2.0"]

McpRequestId:
  type: [string, integer]
  description: A JSON-RPC id. The site answers with the same one.

McpMethod:
  type: string
  enum: [server/discover, tools/list, tools/call]

SiteHostProtocol:
  type: string
  description: What a site host speaks to the root. The only value is MCP's 2026-07-28 revision.
  enum: [mcp-2026-07-28]

McpResponse:
  type: object
  description: |
    The JSON-RPC response to an `McpRequest`, exactly as the site's server
    produced it after the site's policy filtered it: `result` or `error`.
  required: [jsonrpc]
  properties:
    jsonrpc: {$ref: '#/McpJsonRpc'}
    id:
      anyOf:
        - {$ref: '#/McpRequestId'}
        - {type: 'null'}
    result: {type: object, additionalProperties: true}
    error: {type: object, additionalProperties: true}

SiteAnswerStatus:
  type: string
  description: |
    `done`: the site answered (an MCP error or a tool's own failure is still
    `done`, inside `response`). `failed`: the site refused or could not run
    it, and `message` says why in the site's words; nothing ran. `uncertain`:
    a tool call started and its end could not be established; it may have
    acted. `held` (J14a, J50): a change that gives access, from a person who
    has a key pinned at the machine; the site keeps it until they approve it
    there with that key, and `message` says where. Nothing changed yet.
    Since J14b (J86), also a tool call from a person with a key that needs
    their signature (an `ask` rule, a command) or an open window (an `allow`
    rule): `held` (`SiteHeldCall`) says what to sign. Nothing ran.
  enum: [done, failed, uncertain, held]

SiteServerId:
  type: string
  description: |
    A server on the machine. `files` is Eugene's own file server, one per
    machine, whose tools take a `folder` argument (J6g). Any other id is one
    a machine administrator gave a local server when adding it at the
    machine; no local server's id begins `files`.
  pattern: '^(files|[a-z][a-z0-9-]{0,39})$'
  maxLength: 40

SiteTool:
  type: object
  additionalProperties: false
  required: [name, readOnly, destructive]
  properties:
    name: {type: string, minLength: 1, maxLength: 128}
    title: {type: [string, 'null'], maxLength: 256}
    description: {type: [string, 'null'], maxLength: 2048}
    readOnly:
      type: boolean
      description: The server marks the tool as changing nothing (`readOnlyHint`).
    destructive:
      type: boolean
      description: |
        Whether the site treats the tool as able to change or delete
        something. True unless the server marks it read-only, or marks it
        `destructiveHint: false`. MCP's own default, so an unmarked tool is
        destructive. Since 2b.3b a destructive tool is granted `ask` unless
        the site's owner grants it `allow` (`SiteToolGrant.decision`, J78).

SiteServerKind:
  type: string
  description: "`files`: Eugene's own file server, one per machine, its tools taking a `folder` argument (J6g). `local`: a server a machine administrator added at the machine."
  enum: [files, local]

SiteServer:
  type: object
  additionalProperties: false
  required: [id, name, kind, system, enabled, available, tools]
  properties:
    id: {$ref: '#/SiteServerId'}
    name: {type: string, minLength: 1, maxLength: 80}
    kind: {$ref: '#/SiteServerKind'}
    system:
      type: boolean
      description: |
        Marked as able to alter the machine's operating system. It cannot be
        enabled without an administrator's consent recorded at the machine
        (J9).
    enabled:
      type: boolean
      description: Whether it is on. Eugene's file server is on while a folder is registered; a local server is on once the site's owner turns it on.
    available:
      type: boolean
      description: Whether it can run now.
    reason:
      type: [string, 'null']
      maxLength: 1024
      description: Why it cannot run, in plain words.
    tools:
      type: array
      maxItems: 64
      items: {$ref: '#/SiteTool'}

SiteToolGrant:
  type: object
  additionalProperties: false
  required: [name]
  properties:
    name: {type: string, minLength: 1, maxLength: 128}
    decision:
      description: |
        2b.3b (J70, J78): `allow`, the tool runs without asking; `ask`, it
        runs once the person who made the call approved it: with their
        signature over the call when they have a key (J14b), else on
        Workbench's word (`SiteCall.asked`, J72). Absent: `allow` for a tool the site does not
        treat as destructive, or one granted `standing`; `ask` otherwise.
        A tool not granted is denied: it is never offered.
      anyOf:
        - {$ref: '#/SiteGrantDecision'}
        - {type: 'null'}
    standing:
      type: boolean
      default: false
      description: |
        From before 2b.3b: a standing pre-approval, the person may use this
        destructive tool without being asked. Reads as `decision: allow`.
        Before 2b.3b it was required for a destructive tool, which was
        otherwise refused.

SiteDecision:
  type: string
  description: |
    What a rule says of a group of tools (J70). `allow`: runs without
    asking; for a person with a key, only inside a window they opened with
    it (J14b, J81). `ask`: runs only with the person's signature over the
    call when they have a key (J14b); for a person without one, when the
    call says they approved (`SiteCall.asked`, J72), which the audit log
    records as claimed. `deny`: never offered, and refused.
  enum: [allow, ask, deny]

SiteCommandDecision:
  type: string
  description: |
    What a rule says of running commands (2b.4, J88): `ask`, each command
    runs only with its person's own signature over it (J47: never `allow`);
    `deny`, never offered.
  enum: [ask, deny]

SiteGrantDecision:
  type: string
  description: A `SiteDecision` for a tool granted by name; a tool not granted is denied.
  enum: [allow, ask]

SiteRules:
  type: object
  additionalProperties: false
  description: |
    One person's rules in one workspace, per group of tools (J70). `read`:
    `list_directory`, `read_text`, `glob` and `grep`. `change`: `write_text`
    and `edit_text`. `command` (2b.4, J88): `run_command`, in a workspace
    the person holds; absent reads `deny`, as it does for a workspace from
    before 2b.4. `change` and `command` cannot be looser than `deny` in a
    workspace registered read-only (`writable: false`).
  required: [read, change]
  properties:
    read: {$ref: '#/SiteDecision'}
    change: {$ref: '#/SiteDecision'}
    command:
      anyOf:
        - {$ref: '#/SiteCommandDecision'}
        - {type: 'null'}

SiteDenyPattern:
  type: string
  minLength: 1
  maxLength: 256
  pattern: '^[^!\x00-\x1f]'
  description: |
    A path inside a workspace that no tool may touch (J70), in `.gitignore`'s
    syntax without `!`: `.env`, `secrets/`, `*.pem`. It is hidden from every
    tool, for everyone who uses the workspace: listings and searches leave it
    out, and a tool that names it is refused whether or not it exists.

SiteWorkspacePerson:
  type: object
  additionalProperties: false
  description: |
    Someone the site's owner shares one of their own workspaces with, and
    their rules there (J69, J70). Only the owner's workspaces are shared.
  required: [subject, read, change]
  properties:
    subject:
      type: string
      minLength: 1
      maxLength: 64
      description: A person's id. Never `operator`; Eugene's owner reaches a site only through `ownerInDevMode`.
    read: {$ref: '#/SiteDecision'}
    change: {$ref: '#/SiteDecision'}

SiteWorkspace:
  type: object
  additionalProperties: false
  description: |
    A workspace, as the site reports it in each poll (2b.3b): a folder on the
    machine that one linked person, its holder, works in through the file
    server (J69). Its id and name, never its path (J76): the holder reads the
    path live (`workspace.list`). The root shows each person only their own,
    and the people the owner shared theirs with only the ones shared.
  required: [id, name, holder, writable, rules]
  properties:
    id: {type: string, pattern: '^[a-f0-9]{32}$'}
    name:
      type: string
      minLength: 1
      maxLength: 96
      description: |
        The name its holder gave it, unique among the holder's own. Each
        person's `folder` argument names their view: their own workspaces,
        then those the owner shared with them, in the order reported, and a
        name already taken there, ignoring case, reads `Name (2)`. The root
        names a person's view the same way, so its names match the site's.
    holder:
      type: string
      minLength: 1
      maxLength: 64
      description: The linked person it belongs to, whose own account opens it.
    writable:
      type: boolean
      description: Registered for changing files at all. When false, every `change` rule in it reads `deny`.
    rules: {$ref: '#/SiteRules'}
    people:
      type: array
      maxItems: 256
      description: For the site owner's workspaces, whom they shared it with (J69). Empty otherwise.
      items: {$ref: '#/SiteWorkspacePerson'}

SiteWorkspaceDetail:
  type: object
  additionalProperties: false
  description: |
    One of a person's own workspaces as the site holds it, read live through
    the root (`workspace.list`, J76) and kept by no one else.
  required: [id, name, path, holder, writable, rules, deny, people]
  properties:
    id: {type: string, pattern: '^[a-f0-9]{32}$'}
    name: {type: string, minLength: 1, maxLength: 96}
    path: {type: string, minLength: 1, maxLength: 4096}
    holder: {type: string, minLength: 1, maxLength: 64}
    writable: {type: boolean}
    rules: {$ref: '#/SiteRules'}
    deny:
      type: array
      maxItems: 64
      items: {$ref: '#/SiteDenyPattern'}
    people:
      type: array
      maxItems: 256
      items: {$ref: '#/SiteWorkspacePerson'}

SiteAccess:
  type: object
  additionalProperties: false
  description: |
    Who may use which tools of one local server. Eugene's file server is
    granted per folder instead (`SiteFolder.people`, J6g).
  required: [subject, server, tools]
  properties:
    subject:
      type: string
      minLength: 1
      maxLength: 64
      description: A person's id. Never `operator`; Eugene's owner reaches a site only through `ownerInDevMode`.
    server: {$ref: '#/SiteServerId'}
    tools:
      type: array
      maxItems: 64
      items: {$ref: '#/SiteToolGrant'}

SiteFolder:
  type: object
  additionalProperties: false
  description: |
    A folder registered on the machine, as a site from before 2b.3b reports
    it (a newer site reports `SiteWorkspace`, without the path, J76). Eugene's
    file server offers it to the people on its list, by its name, as its
    tools' `folder` argument (J6g). Since 2b.3b the site's `folder.add`,
    `folder.remove` and `folder.people` act on its owner's workspaces, for a
    root from before then, and answer with this shape.
  required: [id, name, path, identity, writable, people]
  properties:
    id: {type: string, pattern: '^[a-f0-9]{32}$'}
    name:
      type: string
      minLength: 1
      maxLength: 96
      description: |
        Unique on the machine, and the value of the `folder` argument. A
        folder that shares a name with one registered before it is shown,
        and taken, as `Name (2)`, `Name (3)` and so on.
    path: {type: string, minLength: 1, maxLength: 4096}
    identity:
      type: string
      minLength: 1
      maxLength: 256
      description: The folder's identity on its file system, as the site recorded it. A dev-mode grant names it (`SiteGrantHint`).
    writable:
      type: boolean
      description: Whether anyone may change files in it at all. A person's `writable` cannot exceed it.
    people:
      type: array
      maxItems: 256
      description: Who may use it, the site's owner included (J11). Nobody is on it until the owner says so.
      items: {$ref: '#/SiteFolderPerson'}

SiteFolderPerson:
  type: object
  additionalProperties: false
  required: [subject, writable]
  properties:
    subject:
      type: string
      minLength: 1
      maxLength: 64
      description: A person's id. Never `operator`; Eugene's owner reaches a site only through `ownerInDevMode`.
    writable:
      type: boolean
      description: |
        The person may change files in it: a standing pre-approval for
        `write_text` and `edit_text` (J6b). Otherwise they may list, read
        and search.

SiteSummary:
  type: object
  additionalProperties: false
  description: |
    What a job site holds, as the site itself reports it in each poll. The
    root keeps it as a cache: it answers Workbench's listings from it, and
    the site checks every call against its own copy again (rule 2 of §3.3).
  required: [owner, ownerInDevMode, servers, access]
  properties:
    owner:
      type: string
      minLength: 1
      maxLength: 64
      description: The person the site pinned as its owner at its join.
    ownerInDevMode:
      type: boolean
      description: The site's owner lets Eugene's owner in while Eugene is in dev mode (J6e).
    folders:
      type: array
      maxItems: 64
      description: From a site before 2b.3b, which reports folders with their paths. A newer site reports `workspaces` instead.
      items: {$ref: '#/SiteFolder'}
    workspaces:
      type: array
      maxItems: 512
      description: Every linked person's workspaces, by id and name, never path (2b.3b, J76). The root shows each person only their own and those shared with them.
      items: {$ref: '#/SiteWorkspace'}
    servers:
      type: array
      maxItems: 96
      items: {$ref: '#/SiteServer'}
    access:
      type: array
      maxItems: 2048
      description: Who may use the local servers' tools. Folders carry their own people.
      items: {$ref: '#/SiteAccess'}
    links:
      type: array
      maxItems: 256
      description: |
        The people linked to an OS account on this machine (§2.2, J27), and
        whether each one's worker is connected now. A linked person's calls
        run as their own account; anyone else's run in the owner's worker,
        as the owner, confined to the folder (J27).
      items: {$ref: '#/SitePersonLink'}
    linkPage:
      type: [string, 'null']
      maxLength: 256
      description: |
        Where a person links their account, on the machine itself: the
        agent's loopback link page on a Windows service install. Null where
        linking is the elevated one-liner (a Linux system install, J36) or
        where only the installing person is served (a per-user install, J38).
    sharing:
      type: boolean
      description: |
        Whether this site can serve anyone but its owner. False on macOS,
        which has no folder boundary yet (§2.6). Absent means true.
    signing:
      $ref: '#/SiteSigning'
    commands:
      $ref: '#/SiteCommands'

SiteCommands:
  type: object
  additionalProperties: false
  description: |
    Whether this machine runs commands from Workbench (2b.4, J9, J30, J89).
    An administrator consents at the machine; the site's owner may take it
    back from Workbench. Absent from a site older than 2b.4.
  required: [allowed]
  properties:
    allowed:
      type: boolean
      description: Commands may run here now (each still under its person's rules and signature).
    consentedAt:
      type: [string, 'null']
      format: date-time
      description: When an administrator consented at the machine.
    withdrawnAt:
      type: [string, 'null']
      format: date-time
      description: When the site's owner took the consent back; a later consent at the machine replaces it.
    reason:
      type: [string, 'null']
      maxLength: 1024
      description: Why not, and how to give consent, in the site's words.

SiteCommandConsent:
  type: object
  additionalProperties: false
  description: |
    An administrator's consent to commands on this machine (J9, J89),
    recorded only by an elevated process at the machine: the join's
    question, the Windows tray behind UAC, the one-liner again, or the
    elevated `site consent` CLI.
  required: [consentedAt]
  properties:
    consentedAt: {type: string, format: date-time}
    by:
      type: [string, 'null']
      maxLength: 256
      description: The administrator's account, for display.

SitePersonLink:
  type: object
  additionalProperties: false
  description: One person linked to an OS account on a site's machine, as the site reports it.
  required: [subject, accountName, available]
  properties:
    subject:
      type: string
      minLength: 1
      maxLength: 64
      description: The person's id.
    accountName:
      type: string
      minLength: 1
      maxLength: 256
      description: The OS account, for display, e.g. `AMISH_STATION\jessie` or `jessie`.
    available:
      type: boolean
      description: Their worker is connected, so their calls can run now.
    reason:
      type: [string, 'null']
      maxLength: 1024
      description: Why not, when it is not, e.g. that they are not signed in on a Windows machine (J25).
    keys:
      type: integer
      minimum: 0
      maximum: 16
      description: How many keys this person has here, at the machine and as passkeys (J14a, J67). Absent from a site older than J14a.
    signing:
      description: |
        2b.3b (J67, J68): the state of this person's own workspaces and
        rules. `unsigned`: they have no key here, so their changes wait for
        one. `unconfirmed`: rules from before 2b.3b they have not approved
        with their key (the owner's, J69). `signed`: every rule of theirs
        here was approved with their own key. Absent from an older site.
      anyOf:
        - {$ref: '#/SiteSigningState'}
        - {type: 'null'}
    held:
      type: integer
      minimum: 0
      maximum: 64
      description: Changes the site holds until this person approves them with their own key (2b.3b). Absent from an older site.
    windowUntil:
      type: [string, 'null']
      format: date-time
      description: When this person's open window ends (J14b, J81); null when none is open. Absent from an older site.

SiteSigningState:
  type: string
  description: |
    `unsigned`: the site's owner has no key pinned at the machine. Its rules
    are trusted to the root, and no tool runs there as anyone (J48).
    `unconfirmed`: the owner has a key, but has not approved the site's
    current rules with it (J52); no tool runs. `signed`: every rule the site
    holds was approved with its owner's key, at the machine; tools run.
    Since 2b.3b (J79) the owner's state governs what the owner's rules
    govern: their own workspaces, what they shared, the local servers and
    dev mode. Each other linked person's own workspaces run under their own
    state (`SitePersonLink.signing`).
  enum: [unsigned, unconfirmed, signed]

SiteSigning:
  type: object
  additionalProperties: false
  description: Whether the site checks its owner's changes with the owner's own key (J14a).
  required: [state, held]
  properties:
    state: {$ref: '#/SiteSigningState'}
    held:
      type: integer
      minimum: 0
      maximum: 64
      description: Changes the site holds until its owner approves them with their key (J50). Since 2b.3b, the owner's alone; each person's own count is on their link.
    approvePage:
      type: [string, 'null']
      maxLength: 256
      description: |
        Where a person adds a key and approves held changes, on the machine
        itself: a Windows service install, and a per-user install on Windows,
        Linux or macOS (J14a.2). Null where this install has no such page (a
        Linux system install, whose owner pairs a passkey instead, J14a.3).
    passkeys:
      type: boolean
      description: |
        The site takes its owner's passkey from Workbench, paired with a code
        shown at the machine, and approvals made with it (J14a.3). Absent
        from a site older than that.
    people:
      type: boolean
      description: |
        The site keeps each linked person's own workspaces, rules and keys
        (2b.3b, J67): any linked person pairs a passkey, and adds, changes and
        approves their own. Absent from an older site, whose root offers
        these to the owner alone.

SiteAccountLink:
  type: object
  additionalProperties: false
  description: |
    One link in the links file: *this Eugene person is this OS account on
    this machine* (§2.2, J27). Made at the machine only, by the machine's
    privileged starter (the agent on a Windows service install, root on a
    Linux system install, the join on a per-user install), never by the root
    or the site host.
  required: [subject, account, accountName, linkedAt]
  properties:
    subject:
      type: string
      minLength: 1
      maxLength: 64
      description: The person's id.
    name:
      type: [string, 'null']
      maxLength: 256
      description: How the person signs in, for display.
    account:
      type: string
      minLength: 1
      maxLength: 256
      description: The OS account's SID on Windows, or its uid in decimal elsewhere. Compared exactly.
    accountName:
      type: string
      minLength: 1
      maxLength: 256
    linkedAt: {type: string, format: date-time}
    keys:
      type: array
      maxItems: 8
      default: []
      description: |
        The person's own keys, pinned at the machine (J14a,
        `person-held-keys.md` §4.1). The site checks every change this
        person approves against them, never the person the root names.
      items: {$ref: '#/SitePersonKey'}

SitePersonKeyAlg:
  type: string
  description: |
    `Ed25519`: a raw 32-byte public key and a 64-byte signature. `ES256`:
    ECDSA on P-256 with SHA-256, for a browser without Ed25519: an
    uncompressed 65-byte public point and a 64-byte `r||s` signature, as
    WebCrypto gives it.
  enum: [Ed25519, ES256]

SitePersonKey:
  type: object
  additionalProperties: false
  description: |
    A person's own key (J14a, Path A). Its private half was made in the
    person's browser on the machine's loopback page and cannot leave it;
    the root never saw either half. Written to the links file by the
    machine's privileged starter, at the machine.
  required: [id, alg, publicKey, addedAt]
  properties:
    id:
      type: string
      pattern: '^[a-f0-9]{32}$'
      description: The first 16 bytes of SHA-256 over the raw public key, in hex.
    alg: {$ref: '#/SitePersonKeyAlg'}
    publicKey: {type: string, minLength: 1, maxLength: 128, description: Base64 of the raw public key.}
    label: {type: [string, 'null'], maxLength: 120, description: 'Where it was made, for display, e.g. "Chrome on AMISH_STATION".'}
    addedAt: {type: string, format: date-time}

SiteLinkFile:
  type: object
  additionalProperties: false
  description: |
    The links file (§3.2): written by the machine's privileged starter,
    read by the site host, which cannot write it. One link per person, and
    one person per account.
  required: [version, links]
  properties:
    version: {type: integer, const: 1}
    links:
      type: array
      maxItems: 256
      items: {$ref: '#/SiteAccountLink'}

SitePersonCheckRequest:
  type: object
  additionalProperties: false
  description: A person's Eugene sign-in, typed at the machine to link them there (J36).
  required: [name, password]
  properties:
    name: {type: string, minLength: 1, maxLength: 256, description: How the person signs in.}
    password: {type: string, minLength: 1, maxLength: 1024}

SitePersonCheck:
  type: object
  additionalProperties: false
  required: [subject, name]
  properties:
    subject: {type: string, minLength: 1, maxLength: 64, description: The person's id.}
    name: {type: string, maxLength: 256}

SiteGrantHint:
  type: object
  additionalProperties: false
  description: |
    One of Eugene's owner's dev-mode folder grants on a site (J13b), carried
    with a call in a list (`grants`). The site honours them only if its
    owner opted in there (J6e) and Eugene is in dev mode. The host checks
    the folder a call names against them. Only the site owner's workspaces
    can be granted. Since 2b.3b the site matches a grant by `folderId` alone
    (J76): the root keeps no paths, so a newer root sends none.
  required: [folderId, name, writable]
  properties:
    folderId: {type: string, minLength: 1, maxLength: 64}
    name:
      type: string
      minLength: 1
      maxLength: 96
      description: The folder's name on this machine, as the `folder` argument takes it. The root makes it unique; a folder that shares a name with an earlier one reads `Name (2)`.
    path: {type: [string, 'null'], maxLength: 4096, description: From a root before 2b.3b; a newer site ignores it.}
    identity: {type: [string, 'null'], maxLength: 256, description: From a root before 2b.3b; a newer site ignores it.}
    writable: {type: boolean}

SiteAuditDecision:
  type: string
  enum: [allowed, refused]

SiteAuditKind:
  type: string
  enum: [mcp, manage]

SiteAuditEntry:
  type: object
  additionalProperties: false
  description: |
    One line of the site's own audit log, kept on the machine and read by
    its owner (J8). It records who asked for what and what the site decided,
    never a file's contents or a tool's result. Since 2b.3b (J80) each line
    belongs to one person, who alone reads it through the root: a call or
    change in a workspace, to its holder; one about a person's own keys, to
    them; the rest (the local servers, sharing, settings, and anything not
    yet tied to a workspace), to the site's owner.
  required: [at, subject, kind, decision]
  properties:
    at: {type: string, format: date-time}
    subject: {type: string, maxLength: 64}
    kind: {$ref: '#/SiteAuditKind'}
    server: {type: [string, 'null'], maxLength: 40}
    method: {type: [string, 'null'], maxLength: 64}
    tool: {type: [string, 'null'], maxLength: 128}
    action: {type: [string, 'null'], maxLength: 64}
    arguments:
      type: [string, 'null']
      maxLength: 1024
      description: The call's arguments as JSON, cut at 1,024 characters, with a write's text left out.
    decision: {$ref: '#/SiteAuditDecision'}
    outcome:
      anyOf:
        - {$ref: '#/SiteAnswerStatus'}
        - {type: 'null'}
    reason: {type: [string, 'null'], maxLength: 1024}
    rule:
      description: For a tool call since 2b.3b, the rule that applied (J72).
      anyOf:
        - {$ref: '#/SiteDecision'}
        - {type: 'null'}
    asked:
      type: [boolean, 'null']
      description: |
        For a tool call under an `ask` rule from a person with no key,
        whether the call said they approved it: claimed, not checked.
    signed:
      type: [string, 'null']
      maxLength: 256
      description: |
        For a call from a person with a key (J14b, J91): which of their keys
        signed it and where, or the window it ran in.

SiteLocalServer:
  type: object
  additionalProperties: false
  description: |
    A local MCP server a machine administrator added at the machine
    (`eugene-plexus-agent site server add`, elevated). Kept in the install's
    protected configuration, which neither the site host nor a worker can
    write (remote-nodes.md §6.2). It runs in the worker of whoever calls it,
    as that person, or as the site's owner for someone with no link (J27).
  required: [id, name, command, sha256]
  properties:
    id:
      type: string
      pattern: '^[a-z][a-z0-9-]{0,39}$'
      description: Its id on this site. An id beginning `files` is refused; `files` is Eugene's own file server.
    name: {type: string, minLength: 1, maxLength: 80}
    command: {type: string, minLength: 1, maxLength: 4096, description: The program's absolute path.}
    args:
      type: array
      maxItems: 64
      items: {type: string, maxLength: 4096}
    env:
      type: object
      maxProperties: 32
      additionalProperties: {type: string, maxLength: 4096}
    sha256:
      type: string
      pattern: '^[a-f0-9]{64}$'
      description: The program file's SHA-256 when it was added. A program that changed since is not run.
    system:
      type: boolean
      default: false
      description: Marked as able to alter the operating system (J9).
    consentedAt:
      type: [string, 'null']
      format: date-time
      description: |
        When an administrator, proven elevated at the machine, consented to
        this system server. A `system` server without it is never enabled.

SiteLocalServerList:
  type: object
  additionalProperties: false
  description: |
    The local-server list (`servers.yaml`), beside the links in the
    install's administrator-only place (§3.2). An administrator writes it at
    the machine. The site host and each worker read it directly and cannot
    write it, so the site host cannot name a program for a worker to run.
  required: [servers]
  properties:
    servers:
      type: array
      maxItems: 32
      items: {$ref: '#/SiteLocalServer'}
    commands:
      description: The administrator's consent to commands here (2b.4, J89); absent, none.
      anyOf:
        - {$ref: '#/SiteCommandConsent'}
        - {type: 'null'}

InstallModeName:
  type: string
  description: The install's mode (J13, J18). In `dev`, Eugene's owner sees all tool information; in `production`, owners are restricted.
  enum: [production, dev]

SiteId:
  type: string
  description: |
    A site's id: random, given by the root at enrollment, and fixed for
    that enrollment. A machine that joins again gets a new one. Never a
    machine's name, which is only its `label`.
  pattern: '^s-[a-z2-7]{26}$'

SiteLabel:
  type: string
  description: What people call the site, the machine's name by default. Not unique, not an identifier.
  minLength: 1
  maxLength: 63
  pattern: '^[A-Za-z0-9][A-Za-z0-9_.-]*$'

SiteOwnerProof:
  type: object
  additionalProperties: false
  description: |
    The person a site invitation names, confirming the join at the machine
    with their own password (remote-nodes.md §3.3, rule 1). Checked after
    the join token, rate-limited as a sign-in is, and never stored: the root
    records the site's owner from it, so ownership comes from presence plus
    the person's own credential.
  required: [name, password]
  properties:
    name: {type: string, minLength: 1, maxLength: 256}
    password: {type: string, minLength: 1, maxLength: 1024}

SiteEnrollmentRequest:
  type: object
  additionalProperties: false
  description: |
    What a site host sends to join (`POST /v1/sites/enroll`). It generated
    its token key first and sends only the public half; no private key
    leaves the machine (J23).
  required: [token, label, tokenPublicKey, owner]
  properties:
    token: {type: string, minLength: 1, maxLength: 4096, description: The site invitation's join token.}
    label: {$ref: '#/SiteLabel'}
    tokenPublicKey:
      type: string
      minLength: 40
      maxLength: 64
      description: Base64 of the site's raw Ed25519 token public key. Its tokens are checked against it, by the root alone; it is never in the trust bundle nodes receive.
    owner: {$ref: '#/SiteOwnerProof'}
    hostVersion: {type: [string, 'null'], maxLength: 64}

SiteEnrollment:
  type: object
  additionalProperties: false
  description: |
    The root's answer to a site's join. The site records its owner from it,
    once (J6b); no later answer changes it.
  required: [id, label, owner, ownerName, controlPublicKey, enrolledAt]
  properties:
    id: {$ref: '#/SiteId'}
    label: {$ref: '#/SiteLabel'}
    owner: {type: string, minLength: 1, maxLength: 64, description: The owner's person id.}
    ownerName: {type: string, maxLength: 256, description: 'How the owner signs in, for display.'}
    controlPublicKey:
      type: string
      description: Base64 of the root's raw Ed25519 identity key. A site that pinned a key at its join (J7a) checks it is this one.
    enrolledAt: {type: string, format: date-time}

SiteReport:
  type: object
  additionalProperties: false
  description: |
    What a site host reports in each poll (`POST /v1/sites/poll`). The root
    keeps it as a cache for listings; the site checks every call against
    its own copy again (rule 2 of remote-nodes.md §3.3).
  required: [protocol, ready]
  properties:
    protocol: {$ref: '#/SiteHostProtocol'}
    hostVersion: {type: [string, 'null'], maxLength: 64}
    ready: {type: boolean}
    reason: {type: [string, 'null'], maxLength: 1024}
    account:
      type: [string, 'null']
      maxLength: 256
      description: |
        The kind of OS account the site host itself runs in. Since 2b.2 the
        site's tools run in each person's worker, as `SiteSummary.links`
        says, and never in this account.
    site:
      anyOf:
        - {$ref: '#/SiteSummary'}
        - {type: 'null'}

SitePollAnswer:
  type: object
  additionalProperties: false
  required: [operation]
  properties:
    operation:
      type: [string, 'null']
      description: The id of an operation waiting for this site to claim, or null when the long poll ended with none.

SiteOperationKind:
  type: string
  description: "`mcp`: one MCP request to one of the site's servers. `manage`: one of the site host's management actions (`SiteManageAction`, site-host.yaml)."
  enum: [mcp, manage]

SiteOperation:
  type: object
  additionalProperties: false
  description: |
    What a site claims (`POST /v1/sites/operations/{id}/claim`): one
    operation, bound to this site's enrollment, to be done before
    `expiresAt`. The site host refuses one whose `site` or `enrolledAt` is
    not its own, so an operation queued for an earlier enrollment never runs
    on a later one; then its policy decides (J8).
  required: [id, expiresAt, site, enrolledAt, subject, kind, installMode]
  properties:
    id: {type: string, minLength: 1, maxLength: 128}
    expiresAt: {type: number, description: Unix seconds. At most 30 s ahead.}
    site: {$ref: '#/SiteId'}
    enrolledAt: {type: string, format: date-time}
    subject:
      type: string
      minLength: 1
      maxLength: 64
      description: Who asked, as the root established it (a person's id, or `operator` for Eugene's owner).
    kind: {$ref: '#/SiteOperationKind'}
    server:
      description: For `mcp`, the site's server.
      anyOf:
        - {$ref: '#/SiteServerId'}
        - {type: 'null'}
    request:
      description: For `mcp`, the request.
      anyOf:
        - {$ref: '#/McpRequest'}
        - {type: 'null'}
    grants:
      type: array
      maxItems: 64
      description: For `mcp` to the file server from Eugene's owner, their dev-mode grants (J6e). Empty otherwise.
      items: {$ref: '#/SiteGrantHint'}
    asked:
      type: boolean
      default: false
      description: For `mcp`, Workbench's word that the person approved this call (`SiteCall.asked`, J72).
    approval:
      description: For `mcp`, the person's approval of a held call (J14b, `SiteCallApproval`), carried as Workbench sent it.
      anyOf:
        - {$ref: '#/SiteCallApproval'}
        - {type: 'null'}
    action:
      type: [string, 'null']
      description: For `manage`, the action.
    arguments:
      type: [object, 'null']
      description: For `manage`, its arguments.
    names:
      type: [object, 'null']
      maxProperties: 256
      additionalProperties: {type: string, maxLength: 256}
      description: |
        For `manage`, how the root names each person the arguments name, by
        id. Display only: a site shows them on a held change marked as the
        root's names (J54), and decides nothing by them.
    installMode: {$ref: '#/InstallModeName'}

SiteResult:
  type: object
  additionalProperties: false
  description: A site's answer to an operation it claimed (`POST /v1/sites/operations/{id}/result`).
  required: [status]
  properties:
    status: {$ref: '#/SiteAnswerStatus'}
    message: {type: [string, 'null'], maxLength: 1024}
    result:
      type: [object, 'null']
      description: A management action's result.
    response:
      description: An MCP request's JSON-RPC response, as the site's server answered it after its policy filtered it.
      anyOf:
        - {$ref: '#/McpResponse'}
        - {type: 'null'}
    held:
      description: With `held` for an MCP request (J86), what the person signs for it to run.
      anyOf:
        - {$ref: '#/SiteHeldCall'}
        - {type: 'null'}
    windowUntil:
      type: [string, 'null']
      format: date-time
      description: For an MCP request from a person with a key, when their open window ends; null when none is open (J81).

SiteHeldCallKind:
  type: string
  description: |
    `call`: this one tool call, signed per call (an `ask` rule, or a
    command). `window`: a window of `minutes` in which every `allow` tool of
    the person's runs without a signature each (J81, J90); the call that
    asked for it runs once it is open.
  enum: [call, window]

SiteHeldCall:
  type: object
  additionalProperties: false
  description: |
    A tool call the site holds for its person's signature (J14b, J86). The
    person signs at the machine, on its page, which lists it with the held
    changes, or from Workbench with a passkey over one of `envelopes`. Either
    way the call runs only when Workbench sends it again with `approval`
    naming this id, before `expiresAt`.
  required: [id, kind, words, expiresAt]
  properties:
    id: {type: string, pattern: '^[a-z0-9]{1,32}$'}
    kind: {$ref: '#/SiteHeldCallKind'}
    minutes:
      type: [integer, 'null']
      minimum: 1
      maximum: 60
      description: For `window`, how long it stays open once signed.
    words:
      type: array
      maxItems: 64
      description: What is signed, in the site's own words, line by line.
      items: {type: string, maxLength: 1024}
    expiresAt: {type: string, format: date-time, description: When the site drops it unsigned.}
    approved:
      type: boolean
      default: false
      description: Signed at the machine already; sending the call again with this id runs it.
    envelopes:
      type: object
      maxProperties: 8
      description: For each of the person's passkeys here, by key id, the canonical `SiteEditEnvelope` to sign.
      additionalProperties: {type: string, maxLength: 262144}
    approvePage:
      type: [string, 'null']
      maxLength: 256
      description: Where the person signs it at the machine (`SiteSigning.approvePage`).

SiteCallApproval:
  type: object
  additionalProperties: false
  description: |
    A held call sent again (J14b). With `held` alone, it runs if it was
    signed at the machine. With a passkey assertion over one of its
    envelopes (as `SitePasskeyApproval` describes), the site checks it and
    runs it.
  required: [held]
  properties:
    held: {type: string, pattern: '^[a-z0-9]{1,32}$'}
    envelope: {type: [string, 'null'], minLength: 2, maxLength: 262144}
    key: {type: [string, 'null'], pattern: '^[a-f0-9]{32}$'}
    credentialId: {type: [string, 'null'], minLength: 1, maxLength: 1366, pattern: '^[A-Za-z0-9_-]+$'}
    authenticatorData: {type: [string, 'null'], minLength: 1, maxLength: 4096}
    clientDataJSON: {type: [string, 'null'], minLength: 1, maxLength: 8192}
    signature: {type: [string, 'null'], minLength: 1, maxLength: 1024}

SiteHeldEdit:
  type: object
  additionalProperties: false
  required: [id, action, words, heldAt]
  properties:
    id: {type: string, pattern: '^[a-z0-9]{1,32}$'}
    action:
      type: string
      maxLength: 64
      description: The held change's action; `call` or `window.open` for a held call (J14b).
    words:
      type: array
      maxItems: 600
      description: The change in the site host's own words, line by line, as the page shows it.
      items: {type: string, maxLength: 1024}
    heldAt: {type: [string, 'null'], format: date-time}
    expiresAt: {type: [string, 'null'], format: date-time, description: When the site drops it unapproved.}
    envelope:
      type: [string, 'null']
      description: With `key`, the canonical `SiteEditEnvelope` to sign.

SiteHeldList:
  type: object
  additionalProperties: false
  required: [subject, keys, items]
  properties:
    subject: {type: string, maxLength: 64}
    keys:
      type: array
      maxItems: 16
      description: The ids of the keys pinned to this person, at the machine and as passkeys.
      items: {type: string, pattern: '^[a-f0-9]{32}$'}
    passkeys:
      type: array
      maxItems: 8
      description: Their passkeys (J14a.3), for Workbench to choose which one signs.
      items: {$ref: '#/SitePasskey'}
    state:
      description: The site's state for its owner; since 2b.3b, for anyone, the state of their own rules (`SitePersonLink.signing`).
      anyOf:
        - {$ref: '#/SiteSigningState'}
        - {type: 'null'}
    items:
      type: array
      maxItems: 64
      items: {$ref: '#/SiteHeldEdit'}

SitePasskey:
  type: object
  additionalProperties: false
  description: A passkey pinned to a person here (J14a.3). Its private half is in the person's own authenticator.
  required: [id, credentialId, alg, rpId, label, addedAt]
  properties:
    id: {type: string, pattern: '^[a-f0-9]{32}$', description: 'The key id an envelope names: the first 16 bytes of SHA-256 over the public key (`SubjectPublicKeyInfo`, DER), in hex.'}
    credentialId: {type: string, minLength: 1, maxLength: 1366, pattern: '^[A-Za-z0-9_-]+$', description: 'The WebAuthn credential id, base64url without padding.'}
    alg: {$ref: '#/SitePasskeyAlgorithm'}
    rpId: {type: string, minLength: 1, maxLength: 253, description: The WebAuthn relying party id it was made for (Workbench's HTTPS name).}
    label: {type: string, maxLength: 128}
    addedAt: {type: string, format: date-time}

SitePasskeyAlgorithm:
  type: integer
  description: 'A passkey''s COSE algorithm: -8 EdDSA, -7 ES256, -257 RS256.'
  enum: [-8, -7, -257]
