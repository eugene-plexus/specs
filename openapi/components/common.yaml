openapi: 3.1.0
info:
  title: Eugene Plexus — shared schema components
  version: 0.3.0-draft
  description: |
    Schemas referenced by multiple Eugene Plexus components. This is not a
    standalone API — it's a $ref target. Components share *schemas*, not code.
  license:
    name: Apache-2.0
    identifier: Apache-2.0

# This document defines no paths — it exists only to host shared `components`.
paths: {}

components:
  schemas:

    # -------- Conversation messages --------

    Role:
      type: string
      description: |
        The speaker of a single message in a conversation. Matches the
        OpenAI / Anthropic chat roles so adapters never re-shape on a hop.
      enum:
        - system
        - user
        - assistant
        - tool
    Message:
      type: object
      description: |
        A single message in a conversation. Deliberately close to the
        OpenAI / Anthropic chat message format so drivers don't have to
        re-shape on every hop.
      required:
        - role
      properties:
        role:
          $ref: '#/components/schemas/Role'
        content:
          $ref: '#/components/schemas/MessageContent'
        toolCalls:
          type: array
          items:
            type: object
            additionalProperties: true
          description: |
            On an **assistant** message: the tool calls the model made,
            in OpenAI's `{id, type, function: {name, arguments}}` shape.

            Deliberately loose here. This is the *shared* schema, so a
            tightly-typed copy would be a third definition of the same
            object alongside the gateway's and the driver's, and the one
            place all three must agree is the wire format, which is
            OpenAI's and not ours to restate. The two API documents
            carry the strict shapes.
        toolCallId:
          type: string
          description: |
            On a **tool** message: which call this is the result of.
            `content` is the result, serialized by the caller.
        reasoning:
          type:
            - string
            - 'null'
          description: |
            On an **assistant** message: the reasoning the model produced
            for that turn, as the backend reported it separately from
            `content` (`reasoning_content` on llama.cpp, `reasoning` on
            vLLM). Handed back so the next turn of a tool loop reaches
            the model with its own earlier thinking.

            **Load-bearing rather than decorative, and measured:**
            llama.cpp b10948 renders a history turn's reasoning into the
            prompt for templates that preserve it (Qwen3, gpt-oss) --
            the same tool-loop request was 172 prompt tokens without it
            and 184 with a twelve-token canary. Dropped here, a model
            resuming a tool loop has forgotten why it called the tool.

            Absent on every other role, and an adapter whose backend
            has no such channel (the agentic CLIs, a hosted OpenAI
            endpoint) omits it upstream rather than inventing one.
        timestamp:
          type: string
          format: date-time
          description: When the message was produced. Server-assigned if omitted.
    MessageContent:
      description: |
        Text, null for an assistant tool-call turn, or ordered user content parts.
        Images are inline PNG/JPEG only: the gateway's `maxImagesPerRequest`
        per request (12 by default, at most 64, counted across the whole
        conversation), 5 MiB decoded each, 10 MiB decoded total, 16 million
        pixels each, maximum dimension 8192. The inference-driver enforces
        the ceiling of 64; the gateway enforces the setting.
        JSON bodies are limited to 16 MiB. Remote URLs are never fetched.
      anyOf:
        - type: string
        - type: 'null'
        - type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/MessageContentPart'
    MessageContentPart:
      oneOf:
        - $ref: '#/components/schemas/TextContentPart'
        - $ref: '#/components/schemas/ImageContentPart'
    TextContentPart:
      type: object
      additionalProperties: false
      required: [type, text]
      properties:
        type:
          type: string
          const: text
        text:
          type: string
    ImageContentPart:
      type: object
      additionalProperties: false
      required: [type, image_url]
      properties:
        type:
          type: string
          const: image_url
        image_url:
          type: object
          additionalProperties: false
          required: [url]
          properties:
            url:
              type: string
              maxLength: 6990531
              description: Inline base64 PNG or JPEG data URL. No remote references.
            detail:
              type: string
              enum: [auto]
              description: Explicit high/low processing modes are not supported.

    # -------- Backend + component identity --------

    BackendKind:
      type: string
      description: |
        Which wire protocol an inference-driver instance speaks to its
        backend. Reported by the driver's `/v1/info` so the gateway can
        log it and the UI can render a label.

        `openai_compat_http` covers every local engine we care about
        (llama.cpp's `llama-server`, vLLM, LM Studio, Ollama) as well as
        hosted OpenAI-compatible services — the protocol is shared even
        though the providers are not, so `DriverInfo.provider` is what
        distinguishes them. `claude_code_cli` and `codex_cli` shell out
        to the respective CLIs, which is how a subscription the operator
        already pays for becomes just another backend.

        `systemone_http` speaks the TypeSafe System One decision
        protocol (`POST /v1/systemone`: a state and named typed
        questions, answered with structured probabilities rather than
        text) — a supervised Kev runtime, another System One-compatible
        server, or TypeSafe's own hosted endpoint, distinguished by
        `DriverInfo.provider` exactly as the chat protocols are. A
        driver on this protocol serves decisions and not chat; see
        `Capabilities.chatCapable`.
      enum:
        - anthropic_api
        - openai_api
        - claude_code_cli
        - codex_cli
        - openai_compat_http
        - systemone_http
    ComponentKind:
      type: string
      enum:
        - control
        - gateway
        - inference-driver
        - library
      description: |
        Which Eugene Plexus component class a topology entry
        represents. Lives in `common.yaml` because more than one
        component references it: the agent's `/v1/components`, and
        (via `ConfigField.componentKindHint`) any component declaring
        a config field that points at a peer of a specific kind.

        A component is a **Eugene Plexus process**. Engine processes
        are not components and are not named here — they are runtimes,
        declared separately on the agent, because a third-party
        binary shares none of a component's declarative shape (no
        module, no config trio, no service token). See the agent's
        `GET /v1/runtimes`.

        `control` is the trust root, node registry, install-wide
        topology and UI host — exactly one active, plus warm standbys.
        `gateway` is the one OpenAI-compatible front door and there is
        exactly one. `inference-driver` instances are the per-backend
        wrappers and there are N — one per backend, wherever that
        backend lives. `library` scans the operator's model
        directories and holds per-model launch profiles; there is
        exactly one, and it is deliberately not in the request path.

        **The agent is not in this list**, for the same reason engine
        runtimes are not: it supervises, it is not supervised. Its
        lifecycle belongs to the platform — a systemd unit, a container
        entrypoint — not to a topology entry. `control` *is* in the list
        precisely because the agent on its host supervises it like
        anything else, which is what stops the control root needing a
        second copy of the supervision machinery.

    ComputeDevice:
      type: object
      description: |
        One compute device on one host, as that host's agent detected it.

        Shared because it appears on both sides of a join: an agent
        reports its own devices on `GET /v1/node`, and the control root
        aggregates them into `Node.devices` — the cross-host
        inventory M3 deferred with the note that *"building a real
        inventory is topology work"*. Two copies of this shape would be
        two definitions of one fact, and the copy would be the one that
        went stale.

        Deliberately **not** the same thing as the agent's
        `HostAccelerator`, which answers a narrower question — "which
        prebuilt engine build should we fetch for this machine" — and
        describes a host in the singular. This is a device *list*,
        because a host with two cards is the case that makes replicas of
        one model possible.
      required:
        - kind
      properties:
        kind:
          $ref: '#/components/schemas/ComputeDeviceKind'
        name:
          type: string
          description: 'Device name as the vendor reports it, e.g. `NVIDIA GeForce RTX 5090`.'
        index:
          type: integer
          minimum: 0
          description: |
            Device ordinal on its own host — what `CUDA_VISIBLE_DEVICES`
            or `HIP_VISIBLE_DEVICES` in a runtime's `env` selects to pin
            that runtime to one card.
        memoryTotalBytes:
          type: integer
          format: int64
        memoryFreeBytes:
          type: integer
          format: int64
          description: |
            Free decides whether a model fits, not total — M3 measured
            2.9 GiB of a 32 GiB card already held on an idle desktop.
            Both are reported so the difference is visible rather than
            surprising.

    ComputeDeviceKind:
      type: string
      enum: [cuda, rocm, xpu, metal, cpu]
      description: |
        What kind of device this is.

        A named schema rather than an inline enum because an inline one
        generated a bare `Kind` class, which is too generic to sit in a
        module every component imports.

        Note `cpu` is a member, which is why the surrounding schema is
        `ComputeDevice` and not `Accelerator`: a list that includes CPUs
        is a device list. The narrower `HostAccelerator.accelerator` on
        the agent keeps its own name and its own values — it answers
        "which prebuilt engine build fits this machine", not "what can
        this host compute on".

    # -------- Engines and model formats --------

    EngineKind:
      type: string
      enum:
        - llama_cpp
        - vllm
        - mlx
        - kev
      description: |
        Which engine adapter constructs the argv and interprets
        readiness. Deliberately a closed enum rather than a free string:
        an engine is supported exactly when an adapter exists for it,
        and without an adapter there is nothing that knows how to start
        it or tell when it is ready.

        `kev` drives upstream `python -m kev.serve` and loads Kev
        decision checkpoints (`kev_checkpoint` format) — a decision
        model, not a chat model: its server speaks the System One
        protocol and its companion driver serves `POST /v1/decide`,
        never completions. Like vLLM it loads the model *before*
        binding its port (read off `kev/serve.py` at the pinned commit
        and observed live 2026-09-22), so alive-and-refusing is
        `loading`; unlike every other engine it handles one request at
        a time, which its driver advertises as a concurrency limit.
        Its bind is hardcoded to loopback upstream, which is the
        posture Eugene wants: the gateway is the authenticated front
        door.

        `llama_cpp` drives upstream `llama-server` and loads GGUF.
        `vllm` drives upstream `vllm serve` and loads safetensors.
        `mlx` drives upstream `mlx_lm.server` and loads MLX-format
        safetensors, on Apple silicon only — experimental until a
        physical Mac run is recorded. We never ship an engine — every
        one of them is an upstream project we wrap and track.

        They differ in far more than argv, and that is why readiness
        is per-adapter rather than one shared TCP check:
        `llama-server` answers `/health` while it loads and reports that
        it is loading, whereas vLLM binds its port *before* loading the
        model and refuses connections until the model is in memory — so
        for minutes it is indistinguishable, over the network alone,
        from a process that died. `mlx_lm.server` is a third mechanism
        again and the most awkward: it serves HTTP immediately, and at
        the pinned release its `/health` answers a hardcoded
        `{"status": "ok"}` while the model is still loading on another
        thread, so **no read-only probe can tell loading from ready**.
        Its adapter proves residency by asking for one token, once per
        process, and only then treats the health endpoint as evidence.
        (Upstream `main` has since taught `/health` to answer 503
        `unavailable` while loading; the adapter reads that as loading
        too, so a future pin gets the cheap probe for free.) They
        differ in acquisition too: a llama.cpp build is fetched and
        verified by us, while vLLM and mlx-lm are Python packages the
        operator installs themselves. See `EngineAcquisition.policy`.

        Lives here rather than on the agent because two components
        reference it: the agent's engines and runtimes, and a
        library `ModelProfile`, which names the engine its launch flags
        are written for.

    ModelFormat:
      type: string
      enum:
        - gguf
        - safetensors
        - kev_checkpoint
      description: |
        On-disk format of a model. A dimension of the data model rather
        than an assumption (locked 2026-09-08), and the differences are
        load-bearing rather than cosmetic.

        * `gguf` — a single file, quantized, carrying its own metadata
          and tokenizer. Large models may be **split** into
          `…-00001-of-0000N.gguf` shards, of which only the first is
          named on a launch line. A multimodal GGUF ships its vision
          projector as a separate file in the same directory, which is
          not itself a model.
        * `safetensors` — a directory: `config.json` plus one or more
          weight files plus tokenizer files. Unquantized in practice,
          so **no quant tier** — a safetensors model is sized, not
          tiered, and the quant fields exist only on the GGUF side.
        * `kev_checkpoint` — a directory holding a rank-limited LoRA
          adapter (`adapter_config.json` + `adapter_model.safetensors`),
          a pointer/decision head (`head.pt`), tokenizer files and
          calibration/provenance artifacts (`provenance.json`), loaded
          by Kev's own loader on top of a separately downloaded base
          model named in the adapter config. Measured off the published
          `jaredpalmer/kev-0.8b` checkpoint on 2026-09-22. **Not an
          ordinary adapter**: a plain LoRA directory is skipped by the
          scanner on purpose, and the decision head is what makes this
          one a launchable model instead. Decision-only —
          `ModelCapabilities.decision`, never `chat`.

        Shared because it appears on both sides of a join: a library
        entry declares what a model *is*, and
        `EngineDescriptor.modelFormats` declares what an engine can
        *load*. Nothing can serve a safetensors model until the vLLM
        adapter lands, and that answer comes from the engine's
        descriptor rather than from anything the library knows.

    Problem:
      type: object
      description: |
        Error response shape, modeled on RFC 7807 (problem+json). Every
        Eugene Plexus component returns this for 4xx / 5xx responses.
      required:
        - type
        - title
        - status
      properties:
        type:
          type: string
          description: |
            A URI reference identifying the problem type, per RFC 7807.
            Modeled as a plain string rather than `format: uri` to keep
            sentinel values like `about:blank` and ergonomic at call sites.
          default: about:blank
        title:
          type: string
          description: Short human-readable summary.
        status:
          type: integer
          description: HTTP status code.
        detail:
          type: string
          description: Human-readable explanation specific to this occurrence.
        instance:
          type: string
          description: |
            A URI reference identifying the specific occurrence. Modeled
            as a plain string for the same reason as `type`.
        component:
          type: string
          description: |
            Eugene Plexus component name that originated the error
            (e.g. `"gateway"`, `"inference-driver:left"`).
        retryDisposition:
          type: string
          enum: [safe, terminal, indeterminate]
          description: |
            Safe means this attempt did not accept application work and may
            be replayed before any output. Terminal means the request must
            be corrected. Indeterminate means work may have occurred; do not
            replay automatically. Missing classification on a server failure
            is indeterminate, never implicit permission to retry.
        retryAfterSeconds:
          type: number
          minimum: 0
          description: Parsed provider Retry-After delay; a scheduling hint, not permission to replay.

    # -------- Health --------

    Health:
      type: object
      description: Liveness / readiness response shape.
      required:
        - status
      properties:
        status:
          type: string
          enum: [ok, degraded, error]
        version:
          type: string
          description: Component version (semver).
        component:
          type: string
          description: Component identifier (e.g. `"inference-driver"`).
        safeMode:
          type: boolean
          default: false
          description: |
            True when the component was started with the agent's
            safe-mode env var set
            (`EUGENE_PLEXUS_<KIND>_SAFE_MODE=1`) and is therefore
            running on built-in defaults instead of its persisted
            config. Components in safe mode are reachable for config
            editing (`PATCH /v1/config` writes to disk normally) but
            should be considered non-functional for their primary
            purpose until restarted without the flag. `status` is
            also reported as `degraded` while safe mode is in effect.
        details:
          type: object
          additionalProperties: true
          description: Optional component-specific health detail.

    # -------- Config protocol --------
    #
    # Every Eugene Plexus component implements a uniform remote-config
    # contract: GET /v1/config, GET /v1/config/schema, PATCH /v1/config.
    # The schema is rich enough that a generic UI can render an editor
    # without component-specific code (label, description, valueType,
    # category, sensitive flag, validation hints, restart-required flag).
    # See each component's spec for the endpoint definitions.

    ConfigValueType:
      type: string
      description: |
        The kind of value a config field holds. The UI uses this to pick
        a renderer (text input, dropdown, password field, etc.).

        Three of these hold more than a scalar. `path_list` is an
        ordered JSON array of directory paths on the component host —
        the library's model roots are the first and so far only user —
        and the UI renders it as an add/remove list of directory pickers
        rather than a text field, because asking someone to
        comma-separate Windows paths is asking for a bug report. Order
        is preserved and meaningful: it is the order the operator sees,
        and M3's downloader offers the first entry as the default
        destination.

        `url_list` is the same argument one type over: an ordered JSON
        array of URLs, rendered as an add/remove list of address fields.
        Added at M5 for the control root's standby endpoints, which are
        inherently plural — *"N standbys is a configuration, not a
        mechanism"* — and which have no natural single-value spelling.
        A comma-separated text field would be the same bug report
        `path_list` exists to avoid, and reusing `path_list` for
        addresses would tell every UI to open a directory picker.
        Validation is the field's business rather than the type's; what
        the type promises is a list whose entries are addresses.

        `runtime_name` holds the `name` of a supervised engine runtime,
        and UIs render it as a dropdown sourced from the agent's
        `GET /v1/runtimes`. It exists because `componentKindHint` cannot
        do this job: a runtime is deliberately not a component, so
        `/v1/components` does not list one. What is saved is the
        runtime's *name*, never its URL — the agent assigns the port
        when the operator does not pick one, so a stored URL would
        encode a number the operator never chose and does not own, and
        would be wrong the moment the runtime moved. Its first user is
        the inference-driver's `runtimeName`, which is how a driver
        follows the engine process it fronts.

        `node_name` holds the `name` of an enrolled node, rendered as a
        dropdown sourced from the control root's `GET /v1/nodes`. Same
        reasoning as `runtime_name` one level up: a node is not a
        component either, so `componentKindHint` cannot source it, and
        what is saved is the name rather than a URL because the address
        of a host is topology the control root owns.

        `model_slots` is the gateway's priority-list surface, and the
        one value here that holds objects. An ordered JSON array of
        `{"model": <alias a client asks for>, "targets": [<model id>,
        ...]}`: a request for `model` is served by the drivers serving
        `model` itself, then by the drivers serving each target in
        order, cascading on failure. Targets are **model ids, not driver
        names**, because a model id names a replica set — every driver
        currently serving it, load-balanced — and a driver name would
        name one process. That is why the value reserved since M2 as
        `driver_list` was renamed when M6 defined it: the old name said
        the wrong thing about what goes in the list. A cloud
        subscription is a target like any other, because a
        `claude_code_cli` driver already serves a model id. UIs without
        a structured renderer for it fall back to editing the JSON.

        `path_mappings` (M11) is an ordered JSON array of `PathMapping`
        — `{"from": <a directory as another machine states it>, "to":
        <the same directory on this host>}`. Its one user is the agent's
        `pathMappings`, which is how a node opens model files a library
        on another host described by *its* path: `/models` on the NAS
        is `Z:\models` here. UIs render it as rows of two directory
        fields, the right-hand one browsable on the component's own
        host, and offer the library's configured roots as suggestions
        for the left. Matching, precedence and translation rules are on
        the agent's field description, not here — the type promises a
        list of pairs and nothing about what they mean.

        `library_folders` (2026-09-14) is an ordered JSON array of
        `LibraryFolder` — `{"path": <a directory on the library's
        host>, "mounts": [<where other machines find the same
        directory>, ...]}`. Its one user is the library's `modelRoots`,
        which was a `path_list` until the reach of a folder moved onto
        the folder: a folder is one exported share, mounted the same
        way on every node of one OS, so the library says where once and
        every node inherits it rather than each node carrying a row per
        folder. A bare string is accepted wherever a `LibraryFolder` is
        expected and means a folder with no mounts — so a config file,
        a PATCH body or a default written for `path_list` still works,
        and `GET /v1/config` always answers in the object form. UIs
        render it as rows of one browsable directory (the library's
        host) plus its mounts; the per-node grid over it is the
        Library's Folders page, not this field.

        `share_credentials` (R2.6, 2026-09-18) is an ordered JSON array
        of `ShareCredential` — `{"host": <a file server>, "username":
        ..., "password": ...}`. Its one user is the agent's
        `shareCredentials`, which is how a host that runs Eugene as a
        Windows **service** reaches an authenticated share at all: a
        service has none of the per-user credentials the person who
        installed it collected by hand. It is the only value here whose
        entries contain a secret, so it carries `secret`'s rule per
        entry rather than per field — the password is redacted in `GET`,
        accepted in `PATCH`, and an entry that omits it keeps the stored
        one. UIs render it as rows of host / user / password, with the
        password a password input, and must not display a redacted
        entry as though its password were empty.
      enum:
        - string
        - integer
        - number
        - boolean
        - enum        # one of a fixed set; see ConfigField.enumValues
        - secret      # sensitive string; redacted in GET, accepted in PATCH
        - file_path   # path on the component host's filesystem
        - path_list   # ordered list of paths; see the description
        - url
        - url_list    # ordered list of URLs; see the description
        - duration    # seconds; UI may render as a time picker
        - runtime_name # name of a supervised engine runtime; see the description
        - node_name   # name of an enrolled node; see the description
        - model_slots # ordered model -> targets priority lists; see the description
        - path_mappings # ordered {from, to} directory mappings; see the description
        - library_folders # ordered {path, mounts[]} library folders; see the description
        - share_credentials # ordered {host, username, password} file-server logins

    ConfigField:
      type: object
      description: |
        UI-renderable description of a single editable config field.
      required:
        - key
        - label
        - valueType
        - category
      properties:
        key:
          type: string
          description: |
            Stable machine-readable id, dot-separated for grouping
            (e.g. `"adapter.modelId"`).
        label:
          type: string
          description: Human-readable label for the UI.
        description:
          type: string
          description: One-sentence explanation suitable for non-programmers.
        category:
          type: string
          description: |
            Group key for UI tabbing or sectioning (e.g. `"adapter"`,
            `"logging"`, `"network"`). Mapped to a display label via
            `ConfigSchema.categories`.
        valueType:
          $ref: '#/components/schemas/ConfigValueType'
        default:
          description: |
            Default value if unset. Type matches `valueType`. Omitted
            for fields with no default.
        enumValues:
          type: array
          items:
            type: string
          description: Allowed values when `valueType == enum`.
        suggestions:
          type: array
          items:
            type: string
          description: |
            Discovery-time hints — values the operator might want
            but which AREN'T enforced by validation. UIs render
            string-typed fields with non-empty `suggestions` as a
            combobox (free-text input with a dropdown of suggestions)
            rather than a strict dropdown. Use when the set of
            valid values is large, partially-discoverable, or
            extends beyond what the component knows at the moment
            (e.g. local LLM model lists that update when the operator
            pulls a new model). Distinct from `enumValues`:
            suggestions are advisory, enumValues are mandatory.
        componentKindHint:
          $ref: '#/components/schemas/ComponentKind'
          description: |
            Declarative rendering hint: this field references a peer
            component of the given kind. UIs render any kind-hinted
            field as a dropdown sourced from the agent's
            `/v1/components` (filtered by kind), with `(off)` as the
            first option (saves an empty string). For single-instance
            kinds (memory, identity, etc.) the dropdown UX collapses
            to effectively a toggle; for multi-instance kinds
            (inference-driver) the operator picks one. Pairs with a
            string/url `valueType` — the saved value is still the
            peer's URL, the hint only changes how the UI looks it up.
            Avoids the OpenClaw trap of duplicating topology into
            free-text URL fields the operator has to type by hand.
        enumLabels:
          type: array
          items:
            type: string
          description: |
            Optional human-readable display labels paired one-to-one
            with `enumValues`. UIs that render an enum as a dropdown
            should show `enumLabels[i]` while still submitting
            `enumValues[i]` as the saved value. When omitted (or
            shorter than `enumValues`), UIs fall back to the raw
            value as the label. Useful where the stored key is
            machine-friendly but the user-facing label isn't —
            e.g. `claude_subscription` saved, "Claude (Pro/Max)"
            shown.
        sensitive:
          type: boolean
          default: false
          description: |
            If true, the value is redacted (`"<redacted>"`) in
            `ConfigDocument` responses but is accepted in
            `ConfigUpdateRequest`. Use for API keys, passwords, etc.
        required:
          type: boolean
          default: false
          description: |
            If true, the component will refuse to start without this
            field set (either in config or via env var fallback).
        minimum:
          type: number
          description: Validation hint for `integer` / `number` fields.
        maximum:
          type: number
          description: Validation hint for `integer` / `number` fields.
        pattern:
          type: string
          description: Regex validation hint for `string` / `url` / `file_path`.
        requiresRestart:
          type: boolean
          default: false
          description: |
            If true, changes to this field via PATCH are accepted and
            stored but do not take effect until the component process
            restarts. The UI should warn before submitting.
        showWhen:
          $ref: '#/components/schemas/ConfigFieldShowWhen'
          description: |
            Conditional-rendering hint. When set, the UI should only
            render this field when another field's current value matches
            the condition. Used to hide adapter-specific fields
            (e.g. `openaiApiKey`) when a different adapter is selected.
            The component still validates and stores the field
            regardless of UI visibility.

    ConfigFieldShowWhen:
      type: object
      description: |
        Predicate over another `ConfigField`'s current value. The UI
        renders the field this is attached to only when the named field
        equals the given value (or matches one entry in the given list).
      required:
        - key
        - equals
      properties:
        key:
          type: string
          description: |
            `key` of another field in the same `ConfigSchema` to compare
            against.
        equals:
          description: |
            Value the named field must equal for this field to render.
            Untyped — when scalar, matches by literal equality against
            the referenced field's `valueType`. When an array, matches
            if the referenced field's current value equals any entry
            (set-membership). Use the array form for a field that
            applies to multiple entries of an enum (e.g. an `apiKey`
            field shared across several OpenAI-compatible providers).

    ConfigSchema:
      type: object
      description: |
        UI-renderable description of every editable config field this
        component accepts. Returned by `GET /v1/config/schema`. UIs use
        this to render a generic config editor without component-specific
        code.
      required:
        - component
        - fields
      properties:
        component:
          type: string
          description: Component identifier (e.g. `"inference-driver"`).
        fields:
          type: array
          items:
            $ref: '#/components/schemas/ConfigField'
        categories:
          type: object
          description: |
            Map from category key (used in `ConfigField.category`) to
            a human-readable section label. Optional; UIs may fall back
            to the raw key.
          additionalProperties:
            type: string

    ConfigDocument:
      type: object
      description: |
        Current effective config values, keyed by `ConfigField.key`.
        Values of fields with `sensitive: true` are returned as the
        literal string `"<redacted>"` regardless of whether they are
        set. Returned by `GET /v1/config`.
      additionalProperties: true

    ConfigUpdateRequest:
      type: object
      description: |
        Partial update for `PATCH /v1/config`. Every present key is
        set; absent keys are left unchanged. To revert a field to its
        default, send `null` as the value. Sensitive fields are written
        through directly (the redacted form sent back by GET is never
        accepted as a write value).
      additionalProperties: true

    ConfigFieldError:
      type: object
      description: A per-field validation failure during PATCH.
      required:
        - key
        - message
      properties:
        key:
          type: string
        message:
          type: string

    ConfigUpdateResult:
      type: object
      description: |
        Outcome of a `PATCH /v1/config` call. Validation failures on
        individual keys do not abort the whole request — valid changes
        are applied, invalid ones are reported in `rejected`.
      required:
        - applied
        - rejected
        - requiresRestart
      properties:
        applied:
          type: array
          items:
            type: string
          description: Keys that were validated and applied successfully.
        rejected:
          type: array
          items:
            $ref: '#/components/schemas/ConfigFieldError'
          description: |
            Keys whose new values failed validation. The current value
            is preserved.
        requiresRestart:
          type: boolean
          description: |
            True if any key in `applied` has `requiresRestart: true`,
            meaning a process restart is needed for the change to take
            effect. The UI should surface this to the user.
        pendingRestart:
          type: array
          items:
            type: string
          description: |
            Keys whose new values are stored but not yet active. Subset
            of `applied`. Empty unless `requiresRestart` is true.

    ConfigTestRequest:
      type: object
      description: |
        Optional override for `POST /v1/config/test`. Same shape as
        `ConfigUpdateRequest`: keys override the saved config for the
        duration of the test only. Useful for "Test Connection" UIs where
        the operator wants to verify a new API key, URL, or model
        identifier before committing it. Send an empty body (`{}`) to
        test the saved config as-is.
      properties:
        overrides:
          $ref: '#/components/schemas/ConfigUpdateRequest'

    ConfigTestResult:
      type: object
      description: |
        Result of a `POST /v1/config/test` invocation. Components decide
        what "test" means for their own surface: an inference-driver runs
        a minimal `generate()` round-trip against its backend; the
        gateway probes every driver it can route to; the library checks
        that its configured model directories are readable.
      required:
        - ok
        - component
        - latencyMs
      properties:
        ok:
          type: boolean
          description: True iff the test invocation succeeded end-to-end.
        component:
          type: string
          description: |
            Component identifier (matches `ConfigSchema.component`).
            Echoed for UI clarity when several /v1/config/test responses
            land in the same view.
        latencyMs:
          type: integer
          description: Wall-clock time the test took, in milliseconds.
        summary:
          type: string
          description: |
            One-line human-readable result summary. Always set when
            `ok` is true; may be set on failure to add context beyond
            `error`.
        sampleOutput:
          type: string
          description: |
            Brief sample of the data the test produced — e.g. assistant
            text from an inference-driver `generate()` round-trip. May be
            truncated to keep the response small. Omitted when there's
            nothing useful to show.
        error:
          type: string
          description: |
            Human-readable error message. Set when `ok` is false. Should
            be specific enough that the operator can act on it (e.g.
            `"openaiApiKey rejected: 401 Unauthorized"`).

    # -------- Auth + security (v0.2) --------
    #
    # v0.1 had no application-level auth (Tailscale tailnet assumption).
    # v0.2 introduces a passphrase-gated UI auth model: operator sets a
    # passphrase during the wizard, the agent derives a master key
    # via KDF, and that master key encrypts API keys on disk plus
    # backs UI session auth. Every component-internal call presents a
    # bearer token issued by the agent at spawn time.

    SecurityMode:
      type: string
      description: |
        How a host retains access to its master encryption key between
        restarts. The component's config schema lists the supported
        subset: the agent offers the first two modes; the control root
        also offers `passphrase_file`.

        * `prompt_on_startup` — passphrase required at every agent
          start. Master key lives only in process memory. Best for
          shared environments, sensitive conversations, security-
          conscious operators. A power outage means Eugene stays
          offline until the operator re-enters the passphrase.
        * `os_keyring` — master key stored in the OS secret store
          (Windows Credential Manager / macOS Keychain / Linux Secret
          Service via the `keyring` Python lib). OS unlocks tied to
          user login; Eugene auto-recovers from restarts. Best for
          home / personal-use installs and anyone who wants minimum
          friction. Anyone with the OS account can also start Eugene.
        * `passphrase_file` — the control root reads a mounted passphrase
          at startup from `EUGENE_PLEXUS_CONTROL_PASSPHRASE_FILE`. For
          containers and other hosts without a keyring. An absent or
          unreadable file leaves the root sealed, with a diagnosis in
          its log. Access to that file permits unlocking the root.
      enum:
        - prompt_on_startup
        - os_keyring
        - passphrase_file

    AuthLoginRequest:
      type: object
      description: |
        Login request body sent by the UI to `POST /v1/auth/login` on
        the agent. The passphrase is the same one the operator set
        in the wizard. The agent verifies its Argon2id hash; on match,
        issues a session token.
      required:
        - passphrase
      properties:
        passphrase:
          type: string
          minLength: 1

    AuthLoginResponse:
      type: object
      description: |
        Issued on successful login. The UI stores `sessionToken` as a
        Secure / HttpOnly / SameSite=Strict cookie or in memory; every
        subsequent proxy request includes it as
        `Authorization: Bearer <token>`.
      required:
        - sessionToken
        - expiresAt
      properties:
        sessionToken:
          type: string
          description: |
            Opaque bearer token; the UI should never inspect its
            contents. Lifetime is bounded by `expiresAt`.

            An `ep-session+jwt` (see `TrustBundle` for the profile),
            signed by the control root's token key. It is addressed to
            the machine the operator signed in on and to the control
            root (`aud: ["node:<name>", "control"]`), or to the root
            alone for a login made there directly. A standalone agent
            that has not joined an install signs its own. The console
            acts on other machines by exchanging it
            (`control.yaml`, `POST /v1/auth/token`), never by sending
            it on.
        expiresAt:
          type: string
          format: date-time
        operatorName:
          type: string
          description: |
            The operator's display name from the constitution
            (typically "operator" or whatever the operator set).
            Echoed for UI welcome strings.

    # -------- Tokens and trust (per-node token keys, 2026-09-25) --------

    TrustGrant:
      type: string
      enum:
        - authority
        - node
        - gateway
      description: |
        What a key in a `TrustBundle` may issue. Checked by every
        verifier against the token's `typ`, `sub` and `aud`:

        * `authority`: the control root's token key, or a standalone
          agent's own. Sessions, exchanged tokens, client keys, and
          service tokens with `sub: control`, to any recipient.
        * `node`: an enrolled agent's token key. Service tokens to **its
          own machine** with any `sub`, and service tokens with
          `sub: agent` to other machines and to `control`.
        * `gateway`: given to a node by the operator's join token, never
          claimed by the node. Service tokens with `sub: gateway` to
          other machines and to `control`.

    TrustKey:
      type: object
      description: One token-signing key a verifier may accept, and what it may issue.
      required:
        - kid
        - issuer
        - publicKey
        - grants
      properties:
        kid:
          type: string
          description: |
            The RFC 7638 JWK thumbprint of the key: base64url, no
            padding, SHA-256 over
            `{"crv":"Ed25519","kty":"OKP","x":"<base64url public key>"}`.
            A token names its key by this in its `kid` header; a verifier
            refuses a `kid` its bundle does not list.
        issuer:
          type: string
          pattern: '^(control|node:.+)$'
          description: |
            The `iss` a token signed by this key must carry: `control`
            for the root, `node:<name>` for an enrolled agent, and
            `node:local` for a standalone one.
        publicKey:
          type: string
          description: Base64 of the raw 32-byte Ed25519 public key.
        grants:
          type: array
          items:
            $ref: '#/components/schemas/TrustGrant'

    RevokedSession:
      type: object
      description: |
        An operator session signed out anywhere in the install. A
        verifier refuses a session whose `jti` is listed, and an
        exchanged token whose `sid` is. Pruned once `exp` has passed.
      required:
        - jti
        - exp
      properties:
        jti:
          type: string
        exp:
          type: integer
          format: int64
          description: The session's own `exp`, unix seconds.

    TrustBundle:
      type: object
      description: |
        The set of keys every verifier in the install trusts, and what
        each may issue. Published by the control root, signed with its
        identity key, carried as the claims of `SignedTrustBundle.jws`.
        Design: `docs/design/per-node-token-keys.md`.

        **The token profile it governs.** Every token is a JWS compact
        JWT with header `{"alg": "EdDSA", "typ": <class>, "kid": <kid>}`
        and claims `iss`, `sub`, `aud` (an array), `iat`, `exp` and
        `jti`. There are three classes:

        * `ep-session+jwt`: an operator session (`sub: operator`), or a
          token obtained from one by exchange, which also carries `act`
          (`{"sub": "node:<asking machine>"}`) and `sid` (the session's
          `jti`).
        * `ep-service+jwt`: a process calling another; `sub` is the
          caller's kind.
        * `ep-client+jwt`: a key an app outside the install holds;
          `jti` is the key's id.

        Recipients are `node:<name>` (every component on that machine),
        `control` (the root), and `gateway` (the install's front door,
        for client keys only).

        **A verifier:**

        1. finds the key by `kid` in the bundle it holds, and refuses an
           unknown one;
        2. takes the algorithm from the key, never from the header;
        3. checks the signature, `exp` and `iat` with a 300 s leeway,
           `typ` against the route's classes, `iss` against the key's
           issuer, `aud` against itself, and the key's `grants` against
           what the token claims;
        4. refuses a token that lives longer than its class allows:
           1 hour for a service token to another machine, 400 days to
           the issuer's own, 14 days for a session, 10 minutes for an
           exchanged token, and 400 days for a client key;
        5. refuses a session that is listed in `revokedSessions`, or
           whose `aud` names a node no longer in the bundle.

        No hard expiry, deliberately. A bundle that stopped verifying
        when the root was dead would end the data path's guarantee to
        outlive it, so a verifier keeps the newest bundle it holds and
        its age is reported instead.
      required:
        - version
        - epoch
        - iat
        - authority
        - keys
        - revokedSessions
      properties:
        version:
          type: integer
          format: int64
          minimum: 0
          description: |
            The control root's replicated log index when this bundle was
            built, so it only grows, including across a promotion. A
            verifier refuses a lower version than it holds (rollback)
            and replaces its bundle with an equal or higher one.
        epoch:
          type: integer
          format: int64
          minimum: 0
          description: The control root's epoch; an agent refuses a lower one.
        iat:
          type: integer
          format: int64
          description: When the bundle was signed, unix seconds. Its age is reported, never enforced.
        authority:
          type: string
          description: |
            Base64 of the raw 32-byte Ed25519 public key that signed this
            bundle: the control root's identity key, which every node
            pins at enrollment, or a standalone agent's own identity key.
            A verifier refuses a bundle whose `authority` is not the key
            it pinned.
        keys:
          type: array
          items:
            $ref: '#/components/schemas/TrustKey'
        revokedSessions:
          type: array
          items:
            $ref: '#/components/schemas/RevokedSession'

    SignedTrustBundle:
      type: object
      required:
        - jws
      properties:
        jws:
          type: string
          description: |
            A JWS compact serialization with header
            `{"alg": "EdDSA", "typ": "ep-trust-bundle+jwt"}`, whose
            payload is a `TrustBundle`, signed with the key its
            `authority` names. The signature covers the payload's exact
            bytes, so nothing has to be re-serialized to check it.

    MasterKeyEnvelope:
      type: object
      description: |
        Encrypted-at-rest envelope for sensitive config fields. The
        on-disk YAML for fields marked `sensitive: true` is stored as
        this envelope when v0.2 security is enabled; the component
        decrypts using the master key passed in by the agent at
        spawn time (env var `EUGENE_PLEXUS_<KIND>_MASTER_KEY`,
        base64-encoded).

        Algorithm: libsodium secretbox (XSalsa20-Poly1305). The nonce
        is generated per-encryption and stored alongside the
        ciphertext. The master key is 32 bytes derived from the
        operator's passphrase via Argon2id with parameters chosen at
        first-run time and persisted in the agent's state.

        Components MAY accept plaintext values in PATCH requests
        (current behavior); on persist, they encrypt to this envelope
        if the master key is available. GET requests continue to
        return `"<redacted>"` for sensitive fields regardless of
        envelope-vs-plaintext on disk.
      required:
        - alg
        - nonce
        - ciphertext
      properties:
        alg:
          type: string
          description: Encryption algorithm identifier.
          enum:
            - secretbox-xsalsa20poly1305
        nonce:
          type: string
          description: |
            Base64-encoded 24-byte nonce. Generated per-encryption,
            never reused with the same key.
        ciphertext:
          type: string
          description: Base64-encoded ciphertext + auth tag.
    RestartResult:
      type: object
      description: |
        Acknowledgement returned by `POST /v1/admin/restart`. The
        component schedules its own process exit shortly after returning
        this response (typically a few hundred ms — long enough for the
        HTTP response to flush). The component does NOT bring itself
        back up; a process supervisor (systemd, docker-compose, the
        deploy launcher, etc.) is expected to relaunch it. In v0.1
        personal-use deploys without a supervisor, the operator
        relaunches manually.
      required:
        - scheduled
        - delayMs
      properties:
        scheduled:
          type: boolean
          description: |
            True if the component accepted the restart and an exit is
            queued. Always true in v0.1 — the endpoint has no reason to
            refuse — but typed as a boolean so future versions can gate
            on (e.g.) an in-flight long-running operation.
        delayMs:
          type: integer
          minimum: 0
          description: |
            How long the component intends to wait before calling exit,
            measured from the moment the response is sent. Lets clients
            time their UI ("restarting in 0.5s…") and decide when to
            start polling `/healthz` for the relaunched process.
        message:
          type: string
          description: |
            Optional human-readable note (e.g. "logs flushed, exiting
            now"). UI may display this in the restart-progress dialog.

    # -------- Paths on another host (M11) --------

    ShareCredential:
      type: object
      description: |
        A user name and password this host uses to reach one file server.

        **The unit is the server, not the share**, and that is a Windows
        constraint rather than a simplification: Windows refuses a second
        set of credentials to a server it already holds a session with
        (`ERROR_SESSION_CREDENTIAL_CONFLICT`, 1219), so a per-share
        credential would be a field that cannot always be honoured. One
        entry covers every share on that host.

        **Why this exists at all.** An agent that runs as a Windows
        service has no per-user credential store, so the entry a person
        once typed into Explorer is invisible to it — and at Windows 11
        defaults there is no guest fallback either
        (`EnableInsecureGuestLogons` is 0), so a share that asks for
        nobody in particular is still refused with
        *"your organization's security policies block unauthenticated
        guest access"* (measured 2026-09-18 against the live install's
        own NAS). Without this the agent comes back after a reboot
        unable to read a single model, with every health check green.

        **Per node, and that is `library-folders-and-reach`'s shape
        rather than a departure from it.** A folder states its `mounts`
        once because a mount is a property of the share; a credential is
        a property of *this machine's relationship to* the share, which
        is exactly what `pathMappings` already is. Nodes do not inherit
        credentials, and a folder never carries one.

        Nothing here is required to mount anything: the agent asks the
        OS to establish the session, and an operator who has already
        arranged access another way leaves the list empty.
      required:
        - host
        - username
      properties:
        host:
          type: string
          description: |
            The file server, as the paths that need it spell it — a host
            name or an address, with no leading slashes and no share
            name. `192.168.16.252` covers `\\192.168.16.252\downloads`
            and `\\192.168.16.252\appdata` both. Matched
            case-insensitively, because a server name is.

            A name and an address for the same machine are **two
            different servers** to Windows, which keys a session by the
            name it was dialled with. That is a tripwire worth knowing
            rather than a rule to work around: spell it here the way the
            Library folder's mounts spell it.
        username:
          type: string
          description: |
            The account on the file server, not on this machine.
            `DOMAIN\user` where the server wants one.
        password:
          type: string
          description: |
            Redacted in `GET /v1/config` exactly as a `secret` scalar is
            — the value comes back as null and the entry keeps its `host`
            and `username`, so a UI can render the row without ever
            holding the secret. A `PATCH` that omits `password` on an
            entry whose `host` already exists **keeps the stored one**,
            so editing a user name does not silently blank the password;
            an explicit empty string clears it.

            **At rest it is sealed with the install's master key**, the
            same envelope a driver's `apiKey` gets, so it is not
            readable from the config file — and so it is readable only
            once the agent is unlocked. On a host whose `securityMode`
            is `prompt_on_startup` that means shares are not reachable
            until somebody signs in, which is the same thing everything
            else behind the master key already does and is reported the
            same way rather than failing as a missing file.

    PathMapping:
      type: object
      description: |
        One rule for reading a path that another machine wrote.

        The library describes each model by its path **on the library's
        own host**, and a runtime declaration copies that string
        verbatim — so when the engine runs elsewhere, the agent there is
        handed a path from a filesystem it does not have. A mapping says
        where the same directory is on this host: the NAS's `/models`
        is `Z:\models` on the Windows box that mounts it. Nothing is
        copied or cached; the operator mounts the share, and this tells
        the agent where they mounted it.

        Shared here because it appears in two places on the agent: as
        the entries of the `pathMappings` config field, and as
        `ModelLocation.mapping` on an admission answer, which reports
        the rule that applied. Two definitions of one pair would drift.
      required:
        - from
        - to
      properties:
        from:
          type: string
          description: |
            A directory as the other machine states it — in practice a
            library root, spelled exactly as the library's own
            `GET /v1/config` lists it. Its shape decides how it matches:
            a drive letter or UNC prefix means Windows rules (case-
            insensitive, `/` and `\` interchangeable); a leading `/`
            means POSIX rules. The agent cannot know the library's
            operating system, and the string came from it, so the
            string stands in.
        to:
          type: string
          description: |
            The same directory on the host holding this config. Used
            verbatim, `~` expanded; the remainder of a matched path is
            re-joined onto it with this host's own separator.

    LibraryFolder:
      type: object
      description: |
        One directory the library catalogues, and where other machines
        find it (2026-09-14).

        `path` is the directory as the library's own host spells it —
        what the scanner walks, what a `ModelSummary.path` starts with,
        the left-hand side of every rule that reaches it. `mounts` is
        the same directory as **other** machines see it: a POSIX-shaped
        entry is for Linux and macOS nodes, a Windows-shaped one (drive
        letter or UNC) for Windows nodes, and a node takes the first
        entry of its own shape. That is the whole of "how does node X
        reach folder Y" for every node that mounts the share where the
        folder says; a node that mounts it elsewhere carries one
        override in its agent's `pathMappings`, and a node with no
        mount of its shape opens `path` as written — the identical-mount
        convention, and every single-host install.

        The rule this replaces was per node per folder, on each node's
        agent, and grew as nodes × folders with every row typed by hand.
        This is per folder, stated once. Nothing is copied or cached:
        the operator mounts the share, this says where.
      required:
        - path
      properties:
        path:
          type: string
          description: |
            Absolute, as the library's host spells it. Immutable in the
            sense that changing it is a different folder: models are
            identified by their path under it.
        mounts:
          type: array
          default: []
          items:
            type: string
          description: |
            Absolute paths, each Windows- or POSIX-shaped; the shape
            says which nodes it is for. Order matters only among entries
            of one shape, where the first wins. Empty means "reached at
            `path`, or not at all".

    DirectoryListing:
      type: object
      description: |
        One directory on the component's own host, listed for a picker.

        Returned by `GET /v1/directories` on the library (whose host
        holds the model roots) and on the agent (whose host holds a
        path mapping's `to`, and any engine binary an operator points
        at). The same shape on both, because the UI has one picker and
        the only thing that differs is which machine's disk it is
        looking at — which is why `host` is on the response.

        This is the endpoint behind the promise `path_list` has carried
        since M2: *"an add/remove list of directory pickers"*. It lists
        what an operator could already type into a path field, on
        request, to the strongest credential there is; it is not a new
        capability and it is not a file browser.
      required:
        - host
        - entries
      properties:
        host:
          type: string
          description: |
            The machine whose disk this is. On a multi-host install the
            answer to "browse" is frequently a machine other than the
            one the browser is on.
        path:
          type: string
          description: |
            The directory listed, absolute and as this host spells it.
            Absent when no `path` was asked for, in which case `entries`
            are the places to start from — every drive on Windows, `/`
            on POSIX, and the home directory.
        parent:
          type: string
          description: |
            The directory above `path`, so a picker can go up without
            doing path arithmetic in a browser. Absent at a filesystem
            root and when `path` is absent.
        entries:
          type: array
          items:
            $ref: '#/components/schemas/DirectoryEntry'
          description: |
            Sorted by name, directories first. Entries this component
            may not read are omitted rather than failing the listing.

    DirectoryEntry:
      type: object
      required:
        - name
        - path
        - kind
      properties:
        name:
          type: string
        path:
          type: string
          description: Absolute path, ready to be used as a config value.
        kind:
          $ref: '#/components/schemas/DirectoryEntryKind'
        hidden:
          type: boolean
          default: false
          description: |
            A dot-prefixed name, or the hidden attribute on Windows.
            Only present in a listing that asked for `showHidden`.

    DirectoryEntryKind:
      type: string
      enum: [directory, file]
      description: |
        Files appear only when a listing asked for `includeFiles`. A
        directory picker never does; a `file_path` field's picker would,
        which is why the flag exists on the endpoint without a UI yet.
  responses:

    Problem:
