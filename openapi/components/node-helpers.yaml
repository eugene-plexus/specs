HelperGrant:
  type: object
  additionalProperties: false
  required: [folderId, writable]
  properties:
    folderId: {type: string, minLength: 1, maxLength: 64}
    writable: {type: boolean, default: false}

HelperFolder:
  type: object
  additionalProperties: false
  required: [id, name, path, identity, writable, ownerAccess]
  properties:
    id: {type: string, minLength: 1, maxLength: 64}
    name: {type: string, minLength: 1, maxLength: 80}
    path: {type: string, minLength: 1, maxLength: 4096}
    identity: {type: string, minLength: 1, maxLength: 256}
    writable: {type: boolean, default: false}
    ownerAccess: {type: string, enum: [none, read, write], default: none}
    people:
      type: array
      maxItems: 256
      description: >-
        Deprecated, read and ignored. Slice 1 kept a Job Site's folders and
        who may use them here; since slice 2 the site keeps them itself and
        its own list is final (J6b). Kept so the replicated log replays.
      items: {$ref: '#/SitePersonGrant'}

SitePersonGrant:
  type: object
  additionalProperties: false
  required: [person, writable]
  properties:
    person: {type: string, minLength: 1, maxLength: 64}
    writable: {type: boolean, default: false}

NodeHelper:
  type: object
  additionalProperties: false
  required: [node, nodeKey, enrolledAt, enabled, folders]
  properties:
    node: {type: string, minLength: 1, maxLength: 256}
    nodeKey: {type: string, minLength: 1, maxLength: 256}
    enrolledAt: {type: string}
    enabled: {type: boolean, default: false}
    folders:
      type: array
      maxItems: 64
      description: >-
        An ordinary node's folders, registered by Eugene's owner. A Job
        Site's folders are the site's own (`HelperReport.site`); none are
        kept here for one.
      items: {$ref: '#/HelperFolder'}
    devGrants:
      type: array
      maxItems: 64
      description: >-
        On a Job Site only: the folders Eugene's owner gave themselves in dev
        mode (J13b). They work only while the install is in dev mode, and
        only if the site's owner lets Eugene's owner in there (J6e), which
        the site checks itself.
      items: {$ref: '#/HelperGrant'}

HelperFolderCreate:
  type: object
  additionalProperties: false
  required: [name, path]
  properties:
    name: {type: string, minLength: 1, maxLength: 80}
    path: {type: string, minLength: 1, maxLength: 4096}
    writable: {type: boolean, default: false}
    ownerAccess: {type: string, enum: [none, read, write], default: none}

HelperReport:
  type: object
  additionalProperties: false
  required: [supported, ready]
  properties:
    supported: {type: boolean}
    ready: {type: boolean}
    reason: {type: [string, 'null'], maxLength: 1024}
    account: {type: [string, 'null'], maxLength: 256}
    protocol:
      description: >-
        The protocol this machine's host speaks. Absent from an agent older
        than slice 2, whose helper takes only the four bespoke tools; the
        root then says the machine needs an update, rather than sending it
        MCP.
      anyOf:
        - {$ref: 'sites.yaml#/SiteHostProtocol'}
        - {type: 'null'}
    hostVersion: {type: [string, 'null'], maxLength: 64}
    site:
      description: A Job Site's own folders, servers and list of who may use what (J6b).
      anyOf:
        - {$ref: 'sites.yaml#/SiteSummary'}
        - {type: 'null'}

HelperOperationStatus:
  type: string
  enum: [done, failed, uncertain]

HelperResult:
  type: object
  additionalProperties: false
  required: [status]
  properties:
    status: {$ref: '#/HelperOperationStatus'}
    result:
      type: object
      description: A management action's result.
    message: {type: string, maxLength: 1024}
    response:
      description: An MCP request's JSON-RPC response, as the machine's host answered it.
      anyOf:
        - {$ref: 'sites.yaml#/McpResponse'}
        - {type: 'null'}

HelperOperationKind:
  type: string
  description: "`mcp`: one MCP request to one of the machine's servers. `manage`: one of the site host's management actions (`SiteManageAction`, site-host.yaml)."
  enum: [mcp, manage]

HelperOperation:
  type: object
  additionalProperties: false
  description: >-
    What a machine claims: one operation, bound to this machine's enrolment,
    to be done before `expiresAt`. The agent checks the binding and hands the
    rest to the machine's host, whose policy decides (J8).
  required: [id, expiresAt, node, nodeKey, enrolledAt, subject, kind, installMode]
  properties:
    id: {type: string, minLength: 1, maxLength: 128}
    expiresAt: {type: number}
    node: {type: string}
    nodeKey: {type: string}
    enrolledAt: {type: string}
    subject:
      type: string
      description: Who asked, as the root established it (a person's id, or `operator`).
    kind: {$ref: '#/HelperOperationKind'}
    server:
      description: For `mcp`, the machine's server.
      anyOf:
        - {$ref: 'sites.yaml#/SiteServerId'}
        - {type: 'null'}
    request:
      description: For `mcp`, the request.
      anyOf:
        - {$ref: 'sites.yaml#/McpRequest'}
        - {type: 'null'}
    grant:
      description: The root's grant where it is final (an ordinary node), or Eugene's owner's dev-mode grant on a site (J6e).
      anyOf:
        - {$ref: 'sites.yaml#/SiteGrantHint'}
        - {type: 'null'}
    action:
      type: [string, 'null']
      description: For `manage`, the action.
    arguments:
      type: [object, 'null']
      description: For `manage`, its arguments.
    installMode: {$ref: '#/InstallModeName'}

HelperDiscovery:
  type: object
  additionalProperties: false
  required: [refreshToken]
  properties:
    refreshToken: {type: string, minLength: 1, maxLength: 16384}

SiteCancel:
  type: object
  additionalProperties: false
  required: [refreshToken, operationId]
  properties:
    refreshToken: {type: string, minLength: 1, maxLength: 16384}
    operationId: {type: string, minLength: 16, maxLength: 64, pattern: '^[a-zA-Z0-9_-]+$'}

SiteServerGrant:
  type: object
  additionalProperties: false
  description: One server on one machine that the signed-in person may use.
  required: [node, server, name, kind, jobSite, available]
  properties:
    node: {type: string}
    server: {$ref: 'sites.yaml#/SiteServerId'}
    name: {type: string, description: "The server's name: the folder's name, for a folder."}
    kind: {$ref: 'sites.yaml#/SiteServerKind'}
    jobSite: {type: boolean}
    available: {type: boolean}
    reason: {type: [string, 'null']}

SiteServerList:
  type: object
  additionalProperties: false
  required: [servers, installMode]
  properties:
    servers:
      type: array
      items: {$ref: '#/SiteServerGrant'}
    installMode: {$ref: '#/InstallMode'}

SiteMcpCall:
  type: object
  additionalProperties: false
  required: [refreshToken, node, server, request]
  properties:
    refreshToken: {type: string, minLength: 1, maxLength: 16384}
    node: {type: string, minLength: 1, maxLength: 256}
    server: {$ref: 'sites.yaml#/SiteServerId'}
    request: {$ref: 'sites.yaml#/McpRequest'}
    operationId:
      type: string
      minLength: 16
      maxLength: 64
      pattern: '^[a-zA-Z0-9_-]+$'
      description: Lets `/oidc/sites/cancel` stop it before the machine claims it.

SiteMcpAnswer:
  type: object
  additionalProperties: false
  required: [status, jobSite, installMode]
  properties:
    status: {$ref: 'sites.yaml#/SiteAnswerStatus'}
    message: {type: [string, 'null'], maxLength: 1024}
    response:
      anyOf:
        - {$ref: 'sites.yaml#/McpResponse'}
        - {type: 'null'}
    jobSite:
      type: boolean
      description: Whether a Job Site answered. Workbench keeps it with the result, with `installMode` (J13a, J18).
    installMode: {$ref: '#/InstallModeName'}

InstallMode:
  type: object
  additionalProperties: false
  required: [mode]
  properties:
    mode: {$ref: '#/InstallModeName'}
    changedAt:
      type: [string, 'null']
      format: date-time
      description: When the mode last changed; null when it never has.

JobSiteServerPerson:
  type: object
  additionalProperties: false
  required: [person, name, tools]
  properties:
    person: {type: string}
    name: {type: string, description: How the person signs in.}
    tools:
      type: array
      items: {$ref: 'sites.yaml#/SiteToolGrant'}

JobSiteServer:
  type: object
  additionalProperties: false
  description: A server on the site, as the site reports it, and who may use which of its tools.
  required: [server, people]
  properties:
    server: {$ref: 'sites.yaml#/SiteServer'}
    people:
      type: array
      items: {$ref: '#/JobSiteServerPerson'}

JobSite:
  type: object
  additionalProperties: false
  required: [node, enabled, online, ready, folders]
  properties:
    node: {type: string}
    enabled: {type: boolean}
    online: {type: boolean}
    ready: {type: boolean}
    supported: {type: [boolean, 'null']}
    reason: {type: [string, 'null']}
    account: {type: [string, 'null'], description: The OS account to give folder permission to.}
    lastContactAt: {type: [string, 'null'], format: date-time}
    folders:
      type: array
      description: The folders registered on it. Each one's server is `files.<id>`.
      items: {$ref: 'sites.yaml#/SiteFolder'}
    servers:
      type: array
      items: {$ref: '#/JobSiteServer'}
    ownerInDevMode:
      type: [boolean, 'null']
      description: Whether the site lets Eugene's owner in while Eugene is in dev mode (J6e). Null until the site has reported.

JobSiteList:
  type: object
  additionalProperties: false
  required: [sites, installMode, canInvite]
  properties:
    sites:
      type: array
      items: {$ref: '#/JobSite'}
    installMode: {$ref: '#/InstallMode'}
    canInvite:
      type: boolean
      description: Whether the owner has opened the public route for machines, so this person can add one.

JobSiteInviteRequest:
  type: object
  additionalProperties: false
  required: [refreshToken]
  properties:
    refreshToken: {type: string, minLength: 1, maxLength: 16384}
    nodeName:
      type: string
      minLength: 1
      maxLength: 63
      pattern: '^[A-Za-z0-9][A-Za-z0-9_.-]*$'
      description: The machine's name in the install. Its own host name when left out.

JobSiteInvite:
  type: object
  additionalProperties: false
  required: [token, expiresAt, nodesUrl, rootKey, owner]
  properties:
    token: {type: string, description: Shown once.}
    expiresAt: {type: string, format: date-time}
    nodeName: {type: [string, 'null']}
    nodesUrl: {type: string, description: The public node route the machine joins through.}
    rootKey: {type: string, description: The root's identity key the machine pins.}
    owner: {type: string, description: The sign-in name the machine will ask for.}

JobSiteEnable:
  type: object
  additionalProperties: false
  required: [refreshToken, enabled]
  properties:
    refreshToken: {type: string, minLength: 1, maxLength: 16384}
    enabled: {type: boolean}

JobSiteFolderCreate:
  type: object
  additionalProperties: false
  required: [refreshToken, name, path]
  properties:
    refreshToken: {type: string, minLength: 1, maxLength: 16384}
    name: {type: string, minLength: 1, maxLength: 80}
    path: {type: string, minLength: 1, maxLength: 4096}
    writable: {type: boolean, default: false}

JobSitePersonTools:
  type: object
  additionalProperties: false
  required: [name, tools]
  properties:
    name: {type: string, minLength: 1, maxLength: 256, description: How the person signs in.}
    tools:
      type: array
      maxItems: 64
      items: {$ref: 'sites.yaml#/SiteToolGrant'}

JobSiteAccessRequest:
  type: object
  additionalProperties: false
  required: [refreshToken, people]
  properties:
    refreshToken: {type: string, minLength: 1, maxLength: 16384}
    people:
      type: array
      maxItems: 256
      items: {$ref: '#/JobSitePersonTools'}

JobSiteServerEnable:
  type: object
  additionalProperties: false
  required: [refreshToken, enabled]
  properties:
    refreshToken: {type: string, minLength: 1, maxLength: 16384}
    enabled: {type: boolean}

JobSiteSettings:
  type: object
  additionalProperties: false
  required: [refreshToken, ownerInDevMode]
  properties:
    refreshToken: {type: string, minLength: 1, maxLength: 16384}
    ownerInDevMode: {type: boolean}

JobSiteAuditRequest:
  type: object
  additionalProperties: false
  required: [refreshToken]
  properties:
    refreshToken: {type: string, minLength: 1, maxLength: 16384}
    limit: {type: integer, minimum: 1, maximum: 200, default: 50}

JobSiteAudit:
  type: object
  additionalProperties: false
  required: [entries]
  properties:
    entries:
      type: array
      items: {$ref: 'sites.yaml#/SiteAuditEntry'}

InstallModeName:
  type: string
  enum: [production, dev]
