# The control root's Job Site surface (docs/design/job-sites-own-enrollment.md):
#
# - the console's membership routes, `/v1/sites` (J19, J33);
# - Workbench's routes for a site's owner, `/oidc/job-sites` (J6b);
# - Workbench's routes for a person using a site's tools, `/oidc/sites`.
#
# What a site host and the root exchange directly is in sites.yaml.
#
# Every object here is named, never inline: an inline object in a document
# this size renames an existing schema at codegen (`Person` became `Person1`
# in slice 1).

SiteDevGrant:
  type: object
  additionalProperties: false
  description: |
    A folder Eugene's owner gave themselves on a site in dev mode (J13b). It
    works only while the install is in dev mode, and only if the site's
    owner lets Eugene's owner in there (J6e), which the site checks itself.
  required: [folderId, writable]
  properties:
    folderId: {type: string, minLength: 1, maxLength: 64}
    writable: {type: boolean, default: false}

SiteOwnerAccess:
  type: string
  enum: [none, read, write]

SiteFolderOwnerAccess:
  type: object
  additionalProperties: false
  required: [ownerAccess]
  properties:
    ownerAccess: {$ref: '#/SiteOwnerAccess'}

SiteDevFolder:
  type: object
  additionalProperties: false
  description: A folder on a site, as the site last reported it, with Eugene's owner's own dev-mode access to it.
  required: [id, name, path, writable, ownerAccess]
  properties:
    id: {type: string}
    name: {type: string}
    path: {type: string}
    writable: {type: boolean, description: Whether the folder was registered for writing at all.}
    ownerAccess: {$ref: '#/SiteOwnerAccess'}

SiteDevView:
  type: object
  additionalProperties: false
  description: |
    What dev mode adds to a site's entry in the console (J13, J33): its
    folders and servers as it last reported them, and Eugene's owner's own
    access there. Absent in production, where the console shows membership
    only (J19).
  required: [ownerInDevMode, folders, servers]
  properties:
    ownerInDevMode:
      type: [boolean, 'null']
      description: Whether the site's owner lets Eugene's owner in while Eugene is in dev mode (J6e). Null until the site has reported.
    folders:
      type: array
      items: {$ref: '#/SiteDevFolder'}
    servers:
      type: array
      items: {$ref: 'sites.yaml#/SiteServer'}

Site:
  type: object
  additionalProperties: false
  description: One Job Site, as Eugene's owner sees it in the console (J19).
  required: [id, label, owner, ownerName, online, ready, enrolledAt]
  properties:
    id: {$ref: 'sites.yaml#/SiteId'}
    label: {$ref: 'sites.yaml#/SiteLabel'}
    owner: {type: string, description: The owner's person id.}
    ownerName: {type: string, description: How the owner signs in.}
    online:
      type: boolean
      description: The site polled within the last 25 s. A site has no address to probe, so this is its status.
    lastContactAt: {type: [string, 'null'], format: date-time}
    ready: {type: boolean}
    reason: {type: [string, 'null']}
    hostVersion: {type: [string, 'null']}
    hostNode:
      type: [string, 'null']
      description: The node whose agent says it hosts this site (J32). For display and links only; nothing is authorized by it.
    enrolledAt: {type: string, format: date-time}
    dev:
      description: In dev mode only (J33).
      anyOf:
        - {$ref: '#/SiteDevView'}
        - {type: 'null'}

SiteList:
  type: object
  additionalProperties: false
  required: [sites, installMode]
  properties:
    sites:
      type: array
      items: {$ref: '#/Site'}
    installMode: {$ref: '#/InstallMode'}
    joinUrl:
      type: [string, 'null']
      description: The address a machine joins through, when this root knows one (see `JobSiteList.canInvite`).

SiteInvitationRequest:
  type: object
  additionalProperties: false
  required: [owner]
  properties:
    owner: {type: string, minLength: 1, maxLength: 64, description: The person id the site will belong to. They confirm at the machine.}
    label: {$ref: 'sites.yaml#/SiteLabel'}
    ttlSeconds: {type: integer, minimum: 30, maximum: 86400, default: 900}

SiteInvitation:
  type: object
  additionalProperties: false
  description: A site invitation. The token is shown once.
  required: [id, token, expiresAt, owner, ownerName, rootKey]
  properties:
    id:
      type: string
      description: The handle to withdraw it by (`DELETE /v1/nodes/join-tokens/{id}`), not the token.
    token: {type: string}
    expiresAt: {type: string, format: date-time}
    owner: {type: string}
    ownerName: {type: string, description: The sign-in name the machine will ask for.}
    label: {type: [string, 'null']}
    joinUrl: {type: [string, 'null'], description: The address the machine joins through, when this root knows one.}
    rootKey: {type: string, description: Base64 of the root's raw Ed25519 identity key, which the site pins (J7a).}

HostedSites:
  type: object
  additionalProperties: false
  description: The sites a node's agent supervises, by id (J32). Display only.
  required: [sites]
  properties:
    sites:
      type: array
      maxItems: 16
      items: {$ref: 'sites.yaml#/SiteId'}

JobSiteRequest:
  type: object
  additionalProperties: false
  description: A Workbench request on behalf of its signed-in person.
  required: [refreshToken]
  properties:
    refreshToken: {type: string, minLength: 1, maxLength: 16384}

SiteCancel:
  type: object
  additionalProperties: false
  required: [refreshToken, operationId]
  properties:
    refreshToken: {type: string, minLength: 1, maxLength: 16384}
    operationId: {type: string, minLength: 16, maxLength: 64, pattern: '^[a-zA-Z0-9_-]+$'}

SiteServerGrant:
  type: object
  additionalProperties: false
  description: >-
    One server on one site that the signed-in person may use. The file
    server (`files`) appears once per site, with the folders the person may
    use there (J6g).
  required: [site, label, server, name, kind, available, folders]
  properties:
    site: {$ref: 'sites.yaml#/SiteId'}
    label: {$ref: 'sites.yaml#/SiteLabel'}
    server: {$ref: 'sites.yaml#/SiteServerId'}
    name: {type: string, description: The server's name.}
    kind: {$ref: 'sites.yaml#/SiteServerKind'}
    available: {type: boolean}
    reason: {type: [string, 'null']}
    folders:
      type: array
      maxItems: 64
      description: For the file server, the folders this person may use, each by the name its tools' `folder` argument takes. Empty for a local server.
      items: {$ref: '#/SiteServerFolder'}

SiteServerFolder:
  type: object
  additionalProperties: false
  required: [id, name, writable]
  properties:
    id: {type: string, minLength: 1, maxLength: 64}
    name:
      type: string
      minLength: 1
      maxLength: 96
      description: Unique on its site; the `folder` argument's value.
    writable:
      type: boolean
      description: This person may change files in it.

SiteServerList:
  type: object
  additionalProperties: false
  required: [servers, installMode]
  properties:
    servers:
      type: array
      items: {$ref: '#/SiteServerGrant'}
    installMode: {$ref: '#/InstallMode'}

SiteMcpCall:
  type: object
  additionalProperties: false
  required: [refreshToken, site, server, request]
  properties:
    refreshToken: {type: string, minLength: 1, maxLength: 16384}
    site: {$ref: 'sites.yaml#/SiteId'}
    server: {$ref: 'sites.yaml#/SiteServerId'}
    request: {$ref: 'sites.yaml#/McpRequest'}
    operationId:
      type: string
      minLength: 16
      maxLength: 64
      pattern: '^[a-zA-Z0-9_-]+$'
      description: Lets `/oidc/sites/cancel` stop it before the site claims it.

SiteMcpAnswer:
  type: object
  additionalProperties: false
  required: [status, installMode]
  properties:
    status: {$ref: 'sites.yaml#/SiteAnswerStatus'}
    message: {type: [string, 'null'], maxLength: 1024}
    response:
      anyOf:
        - {$ref: 'sites.yaml#/McpResponse'}
        - {type: 'null'}
    installMode:
      $ref: 'sites.yaml#/InstallModeName'

InstallMode:
  type: object
  additionalProperties: false
  required: [mode]
  properties:
    mode: {$ref: 'sites.yaml#/InstallModeName'}
    changedAt:
      type: [string, 'null']
      format: date-time
      description: When the mode last changed; null when it never has.

JobSiteFolderPerson:
  type: object
  additionalProperties: false
  required: [person, name, writable]
  properties:
    person: {type: string}
    name: {type: string, description: How the person signs in.}
    writable:
      type: boolean
      description: May change files in it, without asking the site's owner each time (a standing pre-approval).

JobSiteFolder:
  type: object
  additionalProperties: false
  description: A folder on the site, as the site reports it, and who may use it (J6g).
  required: [id, name, path, writable, people]
  properties:
    id: {type: string}
    name: {type: string, description: Unique on the site; what Workbench and the model call it.}
    path: {type: string}
    writable: {type: boolean}
    people:
      type: array
      items: {$ref: '#/JobSiteFolderPerson'}

JobSiteServerPerson:
  type: object
  additionalProperties: false
  required: [person, name, tools]
  properties:
    person: {type: string}
    name: {type: string, description: How the person signs in.}
    tools:
      type: array
      items: {$ref: 'sites.yaml#/SiteToolGrant'}

JobSiteServer:
  type: object
  additionalProperties: false
  description: A local server on the site, as the site reports it, and who may use which of its tools.
  required: [server, people]
  properties:
    server: {$ref: 'sites.yaml#/SiteServer'}
    people:
      type: array
      items: {$ref: '#/JobSiteServerPerson'}

JobSite:
  type: object
  additionalProperties: false
  description: One of the signed-in person's own sites, as Workbench's Job sites page shows it.
  required: [id, label, online, ready, folders, servers]
  properties:
    id: {$ref: 'sites.yaml#/SiteId'}
    label: {$ref: 'sites.yaml#/SiteLabel'}
    online: {type: boolean}
    ready: {type: boolean}
    reason: {type: [string, 'null']}
    account: {type: [string, 'null'], description: The OS account the site's tools run as.}
    lastContactAt: {type: [string, 'null'], format: date-time}
    hostNode: {type: [string, 'null'], description: The node that hosts it (J32), for display.}
    folders:
      type: array
      description: The folders registered on it, which its one file server offers by name (J6g), and who may use each.
      items: {$ref: '#/JobSiteFolder'}
    servers:
      type: array
      description: The local servers a machine administrator added at it.
      items: {$ref: '#/JobSiteServer'}
    ownerInDevMode:
      type: [boolean, 'null']
      description: Whether the site lets Eugene's owner in while Eugene is in dev mode (J6e). Null until the site has reported.

JobSiteList:
  type: object
  additionalProperties: false
  required: [sites, installMode, canInvite]
  properties:
    sites:
      type: array
      items: {$ref: '#/JobSite'}
    installMode: {$ref: '#/InstallMode'}
    canInvite:
      type: boolean
      description: |
        Whether this root knows the address a machine joins through: the
        entry point's nodes name, or the address Eugene's owner set
        (`siteJoinUrl` in the root's settings). It does not need the public
        route: a machine on the root's own network joins through its LAN
        address (J31).

JobSiteInviteRequest:
  type: object
  additionalProperties: false
  required: [refreshToken]
  properties:
    refreshToken: {type: string, minLength: 1, maxLength: 16384}
    label:
      $ref: 'sites.yaml#/SiteLabel'

JobSiteInvite:
  type: object
  additionalProperties: false
  required: [token, expiresAt, joinUrl, rootKey, owner]
  properties:
    token: {type: string, description: Shown once.}
    expiresAt: {type: string, format: date-time}
    label: {type: [string, 'null']}
    joinUrl: {type: string, description: The address the machine joins through.}
    rootKey: {type: string, description: The root's identity key the machine pins.}
    owner: {type: string, description: The sign-in name the machine will ask for.}

JobSiteFolderCreate:
  type: object
  additionalProperties: false
  required: [refreshToken, name, path]
  properties:
    refreshToken: {type: string, minLength: 1, maxLength: 16384}
    name: {type: string, minLength: 1, maxLength: 80}
    path: {type: string, minLength: 1, maxLength: 4096}
    writable: {type: boolean, default: false}

JobSitePeopleRequest:
  type: object
  additionalProperties: false
  required: [refreshToken, people]
  properties:
    refreshToken: {type: string, minLength: 1, maxLength: 16384}
    people:
      type: array
      maxItems: 256
      items: {$ref: '#/JobSitePersonGrant'}

JobSitePersonGrant:
  type: object
  additionalProperties: false
  required: [name, writable]
  properties:
    name: {type: string, minLength: 1, maxLength: 256, description: How the person signs in.}
    writable:
      type: boolean
      description: May change files in the folder without asking each time. Cannot exceed the folder's own `writable`.

JobSitePersonTools:
  type: object
  additionalProperties: false
  required: [name, tools]
  properties:
    name: {type: string, minLength: 1, maxLength: 256, description: How the person signs in.}
    tools:
      type: array
      maxItems: 64
      items: {$ref: 'sites.yaml#/SiteToolGrant'}

JobSiteAccessRequest:
  type: object
  additionalProperties: false
  required: [refreshToken, people]
  properties:
    refreshToken: {type: string, minLength: 1, maxLength: 16384}
    people:
      type: array
      maxItems: 256
      items: {$ref: '#/JobSitePersonTools'}

JobSiteServerEnable:
  type: object
  additionalProperties: false
  required: [refreshToken, enabled]
  properties:
    refreshToken: {type: string, minLength: 1, maxLength: 16384}
    enabled: {type: boolean}

JobSiteSettings:
  type: object
  additionalProperties: false
  required: [refreshToken, ownerInDevMode]
  properties:
    refreshToken: {type: string, minLength: 1, maxLength: 16384}
    ownerInDevMode: {type: boolean}

JobSiteAuditRequest:
  type: object
  additionalProperties: false
  required: [refreshToken]
  properties:
    refreshToken: {type: string, minLength: 1, maxLength: 16384}
    limit: {type: integer, minimum: 1, maximum: 200, default: 50}

JobSiteAudit:
  type: object
  additionalProperties: false
  required: [entries]
  properties:
    entries:
      type: array
      items: {$ref: 'sites.yaml#/SiteAuditEntry'}
